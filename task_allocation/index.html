 { eyebrow:"Part 4 · Lenses", title:"What counts as a paradigm", fig:"p4anat", tag:"criteria",
   bullets:[`A paradigm changes the <b>formal statement</b>: state, decision, objective or guarantee`,`It drops at least one <b>classical commitment</b> (4.2)`,`It brings <b>theory from somewhere</b>, often outside robotics`,`It addresses a gap Part 3 rated <b>thin</b> or <b>partly</b> covered`],
   notesTitle:"Why Part 4 is organised by formal statements",
   notes:`<p>Part 3 found where the problem space is empty. Part 4 asks a different question: are there ways of <i>stating</i> the problem that would put work into those empty regions? A faster solver for the same statement does not count. A paradigm counts if it changes at least one of four things:</p>
<ul><li><b>State:</b> what the decision maker tracks. Classically it is a utility table; here it may be queue lengths, a belief over teammates, or the team itself.</li>
<li><b>Decision:</b> classically a one-shot assignment <code>x(r,t)</code>; here it may be a feedback policy, a time to stop observing, or a single robot's own action.</li>
<li><b>Objective:</b> classically <code>Σ U·x</code>; here it may be a long-run rate, the cost of information, or not doing harm.</li>
<li><b>Guarantee:</b> classically optimality or an approximation ratio; here stability, a confidence level δ, or a safety bound.</li></ul>
<p><b>How the six were chosen.</b> 4.2 lists six commitments that the "table first, solve second" pipeline makes. Each paradigm is defined by dropping one of them. This makes the list derivable rather than a collection of favourite topics, and it means another reader could add a paradigm by naming a commitment we missed.</p>
<p><b>What each section contains.</b> An overview with the generic formal statement, then deep dives into the source papers, with their theorems and conditions taken from the full texts, and finally what breaks when the idea is carried over to multi-robot task allocation. 4.9 looks at combinations and 4.10 at objections and limits.</p>
<div class="key"><span class="lbl">Reading rule</span>Most of the theory in Part 4 comes from neighbouring fields: queueing, sequential statistics, game theory, safe reinforcement learning, human–AI coordination. The guarantees hold under those fields' assumptions. Each deep dive says which assumptions fail for a robot team.</div>`,
   refs:[] },

 { kind:"table", eyebrow:"Part 4 · Lenses", title:"Six reference-case assumptions, one lens each", tag:"four groups",
   table:{ dense:true, head:["Group","Reference-case assumption","Lens that relaxes it","Related dimensions"],
     rows:[["① What is unknown","<b>Free information</b>: U is known or computable before allocating","P2 information acquisition","E6d · E2d · E3a"],
           ["② What counts as help","<b>One-shot value</b>: the objective is Σ U·x for one decision","P1 flow and bottlenecks","E4d · E5a"],
           ["","<b>Replace the plan</b>: optimise, then deploy the new plan","P4 conservative improvement","E5b · E7b"],
           ["③ Who knows and who decides","<b>Full control</b>: one planner, or one protocol, controls every robot","P3 controlled agent's view","E1a · E7b · E1b · E7a"],
           ["","<b>Shared protocol</b>: all robots share message format, scoring and rules","P6 coordination interfaces","E6e · E1b · E7a"],
           ["④ How it runs, and what can change","<b>Given problem</b>: team, layout and payoffs are fixed inputs","P5 system and incentive design","E10c · E10a · E10b"]],
     hlCol:2, caption:"Ordered by the four groups of Part 3 (3.2.2); each lens relaxes one assumption, and several can apply in one system." },
   notesTitle:"Deriving the six from the reference case",
   notes:`<p>Read the reference case of 1.5 slowly and six assumptions appear. Each lens relaxes one of them; none of them is assumed by every method in the literature (2.7).</p>
<ol><li><b>① Free information.</b> The table is available before allocating. Finding out what a robot is good at, or what a task needs, is free and instantaneous.</li>
<li><b>② One-shot value.</b> The value of a decision is the sum of pairing utilities for one decision. Nothing is said about what happens to the system afterwards.</li>
<li><b>② Replace the plan.</b> The output replaces whatever the team was doing. There is no notion of "the current plan is the baseline".</li>
<li><b>③ Full control.</b> Whoever solves the problem controls every robot, either directly or because every robot runs the same algorithm.</li>
<li><b>③ Shared protocol.</b> Robots agree on what messages mean, how to score bids, and how to break ties. 2.3.11 showed this for every agreement method; 2.4.6 showed that self-organisation is the one classical family that avoids it.</li>
<li><b>④ Given problem.</b> Team, workspace and payoffs are inputs. The allocator can only choose among options someone else has fixed.</li></ol>
<p><b>Link to Part 3.</b> The rows follow the four groups introduced in 3.2.2: what is unknown, what counts as help, who knows and who decides, and how the system runs. The last column lists the Part 3 sub-axes each lens speaks to; several lenses also touch a second group (for example, the controlled agent's view also concerns unknown teammates, E1b).</p>
<p><b>A limit found while writing.</b> The shared-protocol assumption had no sub-axis in Part 3's first model: shared semantics appeared only indirectly, through unknown teammates (E1b) and partial control (E7a). It has since been added as E6e, rated thin; 4.10 records how it was missed.</p>`,
   refs:[] },

 /* ---------- P2 flow ---------- */
 { eyebrow:"Part 4 · ② Value · P2 Flow and bottlenecks", title:"Flow and bottlenecks: keep the system moving", fig:"p4capacity", tag:"relaxes one-shot value · E4d, E5a",
   bullets:[`State: a <b>backlog</b> that grows with arrivals and shrinks with work`,`Decision: a feedback <b>policy</b> (who serves which queue, now)`,`Objective: <b>throughput</b>, stability, or time in system`,`Guarantees: <b>capacity regions</b> and bottleneck certificates`],
   notesTitle:"Allocation as a rate, not a matching",
   notes:`<p>In a running system such as a warehouse, a kitchen or an assembly cell, work arrives continuously. A single assignment is quickly out of date. The flow view states the problem in terms of rates:</p>
<ul><li><b>State:</b> a backlog vector <code>x(t)</code>: queue lengths, buffer levels, robots at stations.</li>
<li><b>Decision:</b> a stationary feedback policy <code>π: x(t) → u(t)</code>, choosing which queues are served, under feasibility constraints.</li>
<li><b>Objective:</b> keep the backlog bounded for the largest possible arrival rates (throughput), or minimise steady-state time in system.</li>
<li><b>Guarantee type:</b> a capacity region (stable if and only if the arrival rates lie inside it), constant-factor bounds in light and heavy traffic, convergence to a balanced fixed point, or a sensitivity-based bottleneck certificate.</li></ul>
<p><b>The figure.</b> Two task streams share a pool of robots. Every policy is limited by the same capacity region. Inside it a good policy keeps queues bounded; outside it backlog grows without bound under <i>every</i> policy. The question becomes "is the demand inside the region, and does my policy reach its edge?" rather than "who does which task?".</p>
<p><b>Already in robotics.</b> Dynamic vehicle routing gives stability conditions and delay bounds when tasks arrive as a Poisson stream. For one vehicle the system is stable if and only if load ρ &lt; 1 (Bertsimas &amp; van Ryzin, 1991); for m identical vehicles the load ϱ = λs̄/m &lt; 1 is necessary (Bullo et al., 2011). Mobility-on-demand rebalancing uses a fluid model and a min-cost-flow LP (Pavone et al., 2012). Lifelong multi-agent path finding measures warehouse throughput, but leaves task assignment to an external assigner (Li et al., 2021). These cover E5a, which Part 3 rated "partly".</p>
<p><b>What is missing for MRTA.</b> The guarantees assume identical servers; heterogeneity in DVR appears only as order-of-magnitude results for team forming (Bullo et al., §VII). None of these works treats the case where the allocation itself moves the bottleneck (E4d, thin).</p>`,
   refs:[ref("Bertsimas & van Ryzin, Operations Research 1991","A stochastic and dynamic vehicle routing problem in the Euclidean plane",{PDF:"https://dspace.mit.edu/bitstream/1721.1/2353/1/SWP-3286-23735265.pdf",Scholar:sch("A stochastic and dynamic vehicle routing problem in the Euclidean plane")}),
         ref("Bullo, Frazzoli, Pavone, Savla & Smith, Proceedings of the IEEE 2011","Dynamic vehicle routing for robotic systems",{PDF:"https://ece.uwaterloo.ca/~sl2smith/papers/2010PIEEE_DVR_Robotic.pdf",Scholar:sch("Dynamic vehicle routing for robotic systems")}),
         ref("Pavone, Smith, Frazzoli & Rus, IJRR 2012","Robotic load balancing for mobility-on-demand systems",{PDF:"https://ece.uwaterloo.ca/~sl2smith/papers/2011IJRR_MOD.pdf",Scholar:sch("Robotic load balancing for mobility-on-demand systems")}),
         ref("Li, Tinka, Kiesel, Durham, Kumar & Koenig, AAAI 2021","Lifelong multi-agent path finding in large-scale warehouses",{arXiv:arx("2005.07371"),Scholar:sch("Lifelong multi-agent path finding in large-scale warehouses")})] },

 { child:true, eyebrow:"Part 4 · ② Value · P2 Flow and bottlenecks · Deep dive", title:"Max-weight: throughput-optimal scheduling", fig:"p4maxweight",
   intro:{year:'1992',by:'Tassiulas & Ephremides',cell:'queues with conflict constraints',problem:'serve interfering queues so the network is stable whenever any policy could make it stable',note:'Tassiulas and Ephremides studied multihop radio networks in which links interfere, so only certain sets of links can transmit together. They asked for a scheduling rule that keeps all queues bounded for every arrival rate that any rule could handle. The answer, now called max-weight or back-pressure scheduling, became a standard tool for wireless networks, switches and later for robot fleets.'},
   math:[["weight","D<sub>i</sub> = (X<sub>q(i)</sub> − X<sub>h(i)</sub>) · m<sub>i</sub>","backlog difference × rate"],["choose","ĉ = argmax<sub>c∈𝒮</sub> Dᵀc","each slot"],["result","C′ ⊂ C<sub>π₀</sub> ⊂ C ⊂ C̄′","Thm 3.2"]],
   bullets:[`Each slot, serve the feasible set with the <b>largest total weight</b>`,`Stable for <b>every</b> arrival rate inside the capacity region`,`Stability is <b>not</b> short makespan or small delay tails`],
   notesTitle:"An assignment problem whose table is the state",
   notes:`<p><b>Model.</b> Queues hold <code>X<sub>lj</sub>(t)</code> packets of class <i>j</i>; arrivals are i.i.d. with rates <code>a<sub>lj</sub></code>; server <i>i</i> succeeds with probability <code>m<sub>i</sub></code>. Each slot the scheduler picks an activation vector from 𝒮, the sets of servers that may be active together. Stability means the queue process stays bounded (positive recurrent).</p>
<p><b>Policy.</b> The weight of server <i>i</i> is the backlog difference between its upstream and downstream queue, times its success rate. The scheduler activates the feasible set with the largest total weight. In the single-hop case shown in the figure, the weight is simply backlog × rate: queue 2 is served although queue 3 is longer, because it is served twice as fast.</p>
<p><b>Theorem 3.2.</b> With C′ the set of arrival rates that admit a flow strictly inside the convex hull of 𝒮, the stability region of the policy contains C′ and is contained in the closure of C′. In words, max-weight is stable for every arrival rate that any policy can stabilise, up to the boundary. The proof uses a quadratic Lyapunov function. Theorem 4.1 shows that outside the region backlog grows without bound even under non-stationary policies (single-class, unit service).</p>
<p><b>Why it matters here.</b> Max-weight shows that the flow view does not discard assignment. It solves an assignment every slot, but on a table that is recomputed from the system's congestion instead of being given in advance.</p>
<p><b>What does not carry over.</b></p>
<ul><li>The scheduler is centralised and needs every queue length.</li>
<li>The per-slot problem is a maximum-weight independent set, NP-hard in general (Remark 2).</li>
<li>Success rates depend on the server only, not on the (robot, task) pair; there is no travel or switching cost.</li>
<li>The guarantee concerns throughput only; delay is not addressed. Queue stability at an admissible load does not imply minimum completion time, small delay tails or bounded queues on every sample path.</li></ul>`,
   refs:[ref("Tassiulas & Ephremides, IEEE Trans. Automatic Control 1992","Stability properties of constrained queueing systems and scheduling policies for maximum throughput in multihop radio networks",{"Tech report":"https://drum.lib.umd.edu/bitstreams/ec9ae6dc-036d-4681-acbb-4a35a31100c3/download",Scholar:sch("Stability properties of constrained queueing systems and scheduling policies for maximum throughput in multihop radio networks")})] },

 { child:true, eyebrow:"Part 4 · ② Value · P2 Flow and bottlenecks · Deep dive", title:"Bucket brigades: a line that balances itself", fig:"p4bucket",
   intro:{year:'1996',by:'Bartholdi & Eisenstein',cell:'serial line, workers of different speeds',problem:'balance work across workers of different speeds with no planner and no measurement',note:'Bartholdi and Eisenstein analysed "bucket brigades", a way of running order-picking and assembly lines used in industry. Each worker carries an item forward; when the last worker finishes, everyone walks back and takes over the item of the worker behind. They asked when this local rule balances the line on its own.'},
   math:[["rule","carry forward; when the last worker finishes, walk back and take over","local"],["Thm 2","slowest → fastest order ⇒ every orbit converges to a unique fixed point",""],["Thm 3","constant speeds v₁ &lt; … &lt; vₙ, no blocking ⇒ rate = Σ vᵢ","maximal"]],
   bullets:[`A <b>local rule</b> settles into zones proportional to speed`,`With the right order, the rate is the <b>sum of all speeds</b>`,`Adding a worker <b>never lowers</b> the rate (Thm 4)`],
   notesTitle:"Self-balancing without a planner",
   notes:`<p><b>Model.</b> The line is normalised to work content [0, 1]. Worker <i>i</i> has a speed function <code>v<sub>i</sub>(x)</code> bounded away from zero. The state is the vector of worker positions; one hand-off cycle maps it to the next, <code>x<sup>(t+1)</sup> = f(x<sup>(t)</sup>)</code>.</p>
<p><b>Results.</b></p>
<ul><li><b>Theorem 1:</b> a fixed point always exists.</li>
<li><b>Theorem 2:</b> if workers are ordered from slowest to fastest, where "i slower than j" means <code>sup<sub>x</sub> v<sub>i</sub>(x)/v<sub>j</sub>(x) &lt; 1</code>, the fixed point is unique and every starting configuration converges to it.</li>
<li><b>Theorem 3:</b> with constant speeds and no blocking, convergence is exponentially fast, worker <i>i</i> ends up covering a zone proportional to its speed, and the production rate is the sum of the speeds, the most any arrangement can achieve.</li>
<li><b>Theorem 4:</b> in slowest-to-fastest order, adding a worker or speeding one up never lowers the rate.</li></ul>
<p>With other orders the line can have repelling fixed points or limit cycles, and the rate can be much worse (§4–5).</p>
<p><b>Why it is a flow-view result.</b> Nobody computes an assignment. The rule's dynamics allocate work, and the guarantee is about the long-run rate. The figure uses speeds 1 : 2 : 3, which give zones 1/6, 1/3 and 1/2 of the line.</p>
<p><b>What does not carry over.</b> The proof needs workers that are totally ordered by speed at every point of the line. Heterogeneous robots that are fast at some tasks and slow at others break that condition. The model has one serial flow, identical items, instant walk-back and deterministic speeds.</p>`,
   refs:[ref("Bartholdi & Eisenstein, Operations Research 1996","A production line that balances itself",{DOI:"https://doi.org/10.1287/opre.44.1.21",Scholar:sch("A production line that balances itself Bartholdi Eisenstein")})] },

 { child:true, eyebrow:"Part 4 · ② Value · P2 Flow and bottlenecks · Deep dive", title:"Finding the bottleneck from a running line", fig:"p4bottleneck",
   intro:{year:'1996 / 2002 / 2009',by:'Kuo, Lim & Meerkov; Roser et al.; Li & Meerkov',cell:'serial production lines',problem:'locate the constraint of a line from data it produces anyway',note:'Production engineers needed to know which machine limits a line without building a full model. Kuo, Lim and Meerkov (1996) defined the bottleneck by sensitivity and showed it can be read from how often machines are blocked or starved. Roser, Nakano and Tanaka (2002) proposed a simpler, simulation-tested method based on uninterrupted active periods. Li and Meerkov (2009) collected these rules in a textbook.'},
   math:[["define","bottleneck = argmax<sub>i</sub> ∂PR/∂p<sub>i</sub>","sensitivity of rate"],["Thm 2.1","M = 2: ∂PR/∂p₁ &gt; ∂PR/∂p₂ ⇔ mb₁ &lt; ms₂","blocked vs starved"],["rule","arrow toward m<sub>i+1</sub> if mb<sub>i</sub> &gt; ms<sub>i+1</sub>","M &gt; 2: tested, not proved"]],
   bullets:[`Bottleneck = the machine whose improvement <b>helps throughput most</b>`,`Readable from <b>blocked and starved</b> frequencies`,`Exact for two machines; a <b>tested rule</b> beyond`],
   notesTitle:"A diagnosis that needs no model",
   notes:`<p><b>Definition.</b> In a serial line of Bernoulli machines with efficiencies <code>p<sub>i</sub></code> and finite buffers, machine <i>i</i> is the bottleneck if the production rate is most sensitive to it: <code>∂PR/∂p<sub>i</sub> &gt; ∂PR/∂p<sub>j</sub></code> for all <i>j ≠ i</i>. This is not always the slowest machine.</p>
<p><b>Theorem 2.1 (two machines).</b> Machine 1 is the bottleneck if and only if it is blocked less often than machine 2 is starved: <code>mb<sub>1</sub> &lt; ms<sub>2</sub></code>. Both frequencies can be measured on the floor.</p>
<p><b>More machines.</b> The arrow rule in the figure points from <code>m<sub>i</sub></code> toward <code>m<sub>i+1</sub></code> when <code>mb<sub>i</sub> &gt; ms<sub>i+1</sub></code>, and backwards otherwise; the bottleneck is the machine no arrow leaves. For M &gt; 2 this is supported by simulation, and the paper gives a counterexample. Theorem 4.1 justifies a weaker statement under two hypotheses (a single bottleneck; buffers rarely empty or full). The rule for multiple bottlenecks has, in the authors' words, no analytical justification. In Li and Meerkov's evaluation the primary bottleneck is identified correctly in about 72% of cases.</p>
<p><b>Shifting bottlenecks.</b> Roser et al. call the machine with the longest uninterrupted active period the momentary bottleneck, and count overlaps as shifts. Their table of active states explicitly includes AGVs. It is a heuristic with no guarantee.</p>
<p><b>Relevance.</b> These are among the few tools that read a system's constraint from its own behaviour. They diagnose; they do not allocate. Part 3's thin gap E4d, where the allocation moves the bottleneck, needs both: a diagnosis that updates as robots move, and an allocation that responds to it.</p>`,
   refs:[ref("Kuo, Lim & Meerkov, Mathematical Problems in Engineering 1996","Bottlenecks in serial production lines: a system-theoretic approach",{Link:"https://emis.muni.cz/journals/HOA/MPE/Volume2_3/276.html",Scholar:sch("Bottlenecks in serial production lines: a system-theoretic approach")}),
         ref("Roser, Nakano & Tanaka, Winter Simulation Conference 2002","Shifting bottleneck detection",{PDF:"https://www.informs-sim.org/wsc02papers/145.pdf",Scholar:sch("Shifting bottleneck detection Roser")}),
         ref("Li & Meerkov, Springer 2009","Production Systems Engineering (book)",{Link:"https://link.springer.com/book/10.1007/978-0-387-75579-3",Scholar:sch("Li Meerkov Production Systems Engineering")})] },

 /* ---------- P1 information ---------- */
 { eyebrow:"Part 4 · ① Unknowns · P1 Information acquisition", title:"Information acquisition: observing has a price", fig:"p4infoloop", tag:"relaxes free information · E6d, E2d",
   bullets:[`The table is <b>unknown</b>; learning it takes time the team could spend working`,`Each step: <b>observe</b> at a cost, or <b>stop and commit</b>`,`Objective: cost of observing + cost of a <b>wrong commitment</b>`,`Only enough information to beat the <b>closest alternative</b> is needed`],
   notesTitle:"When the table has to be bought",
   notes:`<p>The classical pipeline treats the utility table as known. When it is not, for example when a robot's effectiveness in this team is unknown, or what a task needs is only revealed by trying, the decision has two parts: what to observe, and when to stop observing and commit.</p>
<p><b>Generic statement.</b> An unknown θ (task values, teammate types, one's own usefulness) and a belief <code>b<sub>t</sub></code> over it. Each step, either take an observing action <i>a</i> that costs <code>c(a)</code> and yields a sample, or stop at time τ and commit to an allocation <i>x</i>. Three standard objectives:</p>
<ul><li><b>Bayes or Lagrangian:</b> minimise expected observation cost plus L × probability of a wrong commitment.</li>
<li><b>Fixed confidence:</b> minimise expected stopping time subject to error ≤ δ.</li>
<li><b>Fixed budget:</b> maximise the value of the final choice after N observations.</li></ul>
<p><b>The common answer.</b> Across Wald, Chernoff and best-arm identification, the expected number of observations behaves like <code>log(1/δ) / D*</code>, where D* is an information rate: the KL divergence that the best mix of experiments achieves against the hardest-to-distinguish alternative. Two consequences matter for allocation: you only need enough evidence to rule out the nearest competing allocation, not to fill the whole table; and the information rate of each way of observing tells you which observation to buy.</p>
<p><b>The figure</b> is schematic: waiting costs grow with observation time, the risk of a wrong commitment shrinks, and the total has a minimum τ*. Its exact location depends on the cost of idling, the cost of a wrong role and how distinguishable the alternatives are.</p>
<p><b>In MRTA.</b> Part 3 rated E6d, "information costs time to acquire", as thin. Reading the two closest papers in full keeps that rating (4.3.3).</p>`,
   refs:[] },

 { child:true, eyebrow:"Part 4 · ① Unknowns · P1 Information acquisition · Deep dive", title:"Wald's sequential probability ratio test", fig:"p4sprt",
   intro:{year:'1945',by:'Wald',cell:'two hypotheses, one experiment',problem:'decide between two hypotheses with as few observations as possible at given error rates',note:'Wald developed sequential analysis during the Second World War for acceptance testing of munitions, where every test was costly. Instead of fixing the sample size in advance, the test looks at the evidence after each observation and stops as soon as it is decisive. The 1945 paper set out the test, its error bounds and its expected sample size.'},
   math:[["evidence","Sₙ = Σ log f₁(xᵢ)/f₀(xᵢ)",""],["stop","Sₙ ≥ log A ⇒ H₁;  Sₙ ≤ log B ⇒ H₀","else observe again"],["set","A = (1−β)/α,  B = β/(1−α)","§3.3"],["cost","E₁[n] ≈ log(1/α) / KL(f₁‖f₀)","α, β small"]],
   bullets:[`Accumulate evidence; stop at the <b>first decisive moment</b>`,`Error rates are controlled by two <b>thresholds</b>`,`Expected cost ≈ log(1/α) divided by an <b>information rate</b>`],
   notesTitle:"The stopping problem in its simplest form",
   notes:`<p><b>Setting.</b> Observations <code>x<sub>1</sub>, x<sub>2</sub>, …</code> are i.i.d. from <code>f<sub>0</sub></code> or <code>f<sub>1</sub></code>. There is one experiment, so the only choice is when to stop. The test accumulates the log-likelihood ratio <code>S<sub>n</sub></code> and stops when it leaves the band (log B, log A).</p>
<p><b>What is proved.</b></p>
<ul><li>The test terminates with probability one (3.11).</li>
<li>Fundamental inequalities (§3.2): <code>α/(1−β) ≤ 1/A</code> and <code>β/(1−α) ≤ B</code>. With the practical choice A = (1−β)/α and B = β/(1−α), the achieved errors satisfy <code>α′ ≤ α/(1−β)</code>, <code>β′ ≤ β/(1−α)</code> and <code>α′ + β′ ≤ α + β</code>. They are not exactly α and β because the walk overshoots the boundary.</li>
<li>Expected sample size (§4.1): <code>E[n] = E[S<sub>n</sub>]/E[z]</code> (Wald's identity), approximately <code>[(1−γ) log B + γ log A]/E[z]</code>, with γ the probability of accepting H₁.</li>
<li>Efficiency (§4.7): any sequential test with the same error rates needs at least as many observations on average as the bound the test attains when there is no overshoot. Exact optimality was proved later by Wald and Wolfowitz (1948).</li></ul>
<p>For small α and β, <code>E₁[n] ≈ log(1/α)/KL(f₁‖f₀)</code> and <code>E₀[n] ≈ log(1/β)/KL(f₀‖f₁)</code>. Wald does not use the term KL; the quantities are the expected log-likelihood ratios.</p>
<p><b>What does not carry over.</b> One fixed experiment, two simple hypotheses, i.i.d. data. A robot deciding where it is needed usually has more than two options, can choose what to look at, and observes a system that its own presence changes. The error and sample-size statements hold only if observations follow the assumed model; correlated observations, adaptive teammates or a missing hypothesis invalidate the nominal confidence, and none of this is a bound on time-to-integration.</p>`,
   refs:[ref("Wald, Annals of Mathematical Statistics 1945","Sequential tests of statistical hypotheses",{Link:"https://projecteuclid.org/euclid.aoms/1177731118",Scholar:sch("Sequential tests of statistical hypotheses Wald 1945")}),
         ref("Wald & Wolfowitz, Annals of Mathematical Statistics 1948","Optimum character of the sequential probability ratio test",{Scholar:sch("Optimum character of the sequential probability ratio test")})] },

 { child:true, eyebrow:"Part 4 · ① Unknowns · P1 Information acquisition · Deep dive", title:"Choosing what to observe", fig:"p4active",
   intro:{year:'1959 / 2013 / 2016',by:'Chernoff; Naghshvar & Javidi; Garivier & Kaufmann',cell:'many hypotheses, many experiments',problem:'choose which experiment to run as well as when to stop',note:'Chernoff (1959) extended sequential testing to the case where the experimenter can choose among several experiments at each step. Naghshvar and Javidi (2013) gave non-asymptotic bounds and a two-phase policy for active hypothesis testing. Garivier and Kaufmann (2016) solved the matching problem for bandits: identify the best of K options with confidence 1−δ using as few samples as possible.'},
   math:[["rate","I(θ) = sup<sub>λ</sub> inf<sub>φ∈a(θ)</sub> Σ<sub>E</sub> λ<sub>E</sub> KL(f<sub>θ</sub><sup>E</sup>‖f<sub>φ</sub><sup>E</sup>)","Chernoff (4.2)"],["Chernoff","E[N] ≤ (1+o(1)) log(1/c) / I(θ)","cost c → 0"],["lower","E[τ<sub>δ</sub>] ≥ T*(μ) · kl(δ, 1−δ)","GK Thm 1"],["upper","lim sup E[τ<sub>δ</sub>]/log(1/δ) ≤ α T*(μ)","Track-and-Stop"]],
   bullets:[`Pick the experiment mix that separates the truth from its <b>nearest rival</b> fastest`,`Chernoff: optimal to first order as <b>cost → 0</b>`,`Best-arm identification: matching <b>lower and upper bounds</b>`],
   notesTitle:"Information rates decide what to look at",
   notes:`<p><b>Chernoff (1959).</b> States θ, experiments E, outcome densities <code>f(x, θ, E)</code>. The information number of a randomised experiment λ against the set a(θ) of alternatives is the value of a zero-sum game: the experimenter picks λ to maximise the weighted KL divergence; nature picks the most confusing alternative. Procedure A estimates θ by maximum likelihood, runs the maximin experiment for that estimate, and stops when the accumulated evidence exceeds log(1/c). Theorems 1–2: the risk is <code>(1+o(1)) c log(1/c)/I(θ)</code> and no procedure does better to first order as c → 0. Assumptions: finitely many states and experiments, and every experiment separates every pair of states. Chernoff warns that the procedure can be poor when sampling is expensive, because of "initial bungling".</p>
<p><b>Naghshvar &amp; Javidi (2013)</b> write the problem as minimising <code>E[τ] + L·P<sub>e</sub></code>, a dynamic program over beliefs. They weaken the assumption to "every pair is separated by <i>some</i> experiment", give lower bounds, and show a two-phase policy is asymptotically optimal (Corollary 2): <code>V* = Σ<sub>i</sub> ρ<sub>i</sub> log L / D<sub>i</sub> + o(log L)</code>.</p>
<p><b>Garivier &amp; Kaufmann (2016).</b> K arms from an exponential family with a unique best arm. Theorem 1: every δ-correct strategy needs <code>E[τ<sub>δ</sub>] ≥ T*(μ)·kl(δ, 1−δ)</code>, where <code>1/T*(μ) = sup<sub>w</sub> inf<sub>λ∈Alt(μ)</sub> Σ<sub>a</sub> w<sub>a</sub> d(μ<sub>a</sub>, λ<sub>a</sub>)</code>. Track-and-Stop samples in the optimal proportions w* and stops with Chernoff's rule; Theorem 14 gives a matching upper bound as δ → 0 (with α = 1 admissible for Bernoulli arms).</p>
<p><b>The figure</b> shows the idea: each way of observing accumulates evidence at a different slope; mixing them in the right proportions gives the steepest slope against the closest alternative, hence the earliest commitment.</p>
<p><b>What does not carry over.</b> The answer is a single best arm or hypothesis, not a joint allocation; observation costs do not depend on travel; one decision maker samples at a time. In a team, robots observe in parallel, and observing often means doing the task, so productive work and information gathering are interleaved rather than sequential (4.3). The rates T* and I(θ) are meaningful only under a matching observation model.</p>`,
   refs:[ref("Chernoff, Annals of Mathematical Statistics 1959","Sequential design of experiments",{Link:"https://projecteuclid.org/euclid.aoms/1177706205",Scholar:sch("Chernoff Sequential design of experiments 1959")}),
         ref("Naghshvar & Javidi, Annals of Statistics 2013","Active sequential hypothesis testing",{arXiv:arx("1203.4626"),Scholar:sch("Active sequential hypothesis testing Naghshvar Javidi")}),
         ref("Garivier & Kaufmann, COLT 2016","Optimal best arm identification with fixed confidence",{arXiv:arx("1602.04589"),Scholar:sch("Optimal best arm identification with fixed confidence")})] },

 { child:true, kind:"table", eyebrow:"Part 4 · ① Unknowns · P1 Information acquisition · Deep dive", title:"Information as a cost in MRTA so far", tag:"related evidence",
   table:{ dense:true, head:["Work","What is unknown","Is observing a decision?","Guarantee"],
     rows:[["Rossano, Lim & How 2025","whether a task needs an extra capability","no: revealed after a fixed delay or by progress","convergence and run time; no quality bound"],
           ["Liang et al. 2026","parts of the map","yes: spare robots can be sent to explore; cost counted as makespan","plan meets the specification; regret heuristic, no optimality"],
           ["Macke, Mirsky & Stone 2021","a teammate's goal","yes: ask if value of the query exceeds its cost","myopic rule; no optimality result"],
           ["Hollinger & Sukhatme 2014","an environmental field","information is the objective itself","RIG-graph asymptotically optimal"],
           ["Lerman et al. 2006","the task mix","window length h is a design parameter","convergence time grows with h (model)"]],
     hlCol:2, caption:"Among these, none trades observation time against working time with a stopping rule (this search only)." },
   notesTitle:"What the full texts show",
   notes:`<p>Part 3's search snapshot rated E6d thin. The full texts below are related evidence with different assumptions; communication-aware ad hoc planning (Macke et al.) is the closest and belongs in any baseline set.</p>
<ul><li><b>Rossano et al.</b> model uncertainty about whether a task will need an extra capability, revealed at a fixed time after arrival. The auction samples these uncertainties to estimate expected rewards. No action chooses what or when to observe, and there is no observation cost.</li>
<li><b>Liang et al.</b> come closest: exploring an uncertain region is an explicit allocation choice, and its cost is robot travel time in the same currency as task work, under a worst-case regret objective. But observation is perfect and free on arrival, there is no value-of-information calculation and no stopping rule, and completeness holds only with regret pruning disabled.</li>
<li><b>Macke et al.</b> decide when to ask a teammate, by comparing the value of a query with its cost. It is a myopic rule without an optimality result, and it assumes the teammate answers truthfully in a shared protocol (4.7.3).</li>
<li><b>Hollinger and Sukhatme</b> plan paths that maximise information under a budget; information is the goal, not a means to allocate.</li>
<li><b>Lerman et al.</b> show that the window over which a robot estimates the task mix sets a trade-off: longer windows converge more slowly after a change (Lerman et al.); shorter windows make robots switch more often (Jones &amp; Matarić) (4.6.3).</li></ul>
<p><b>What is missing.</b> A formulation in which observation costs robot-time, several robots observe in parallel, the answer is an allocation rather than a single best option, and the decision to stop observing has a guarantee of the kind 4.3.1–4.3.2 provide.</p>`,
   refs:[ref("Rossano, Lim & How, arXiv 2025","Uncertainty-aware multi-robot task allocation with strongly coupled inter-robot rewards",{arXiv:arx("2509.22469"),Scholar:sch("Uncertainty-aware multi-robot task allocation with strongly coupled inter-robot rewards")}),
         ref("Liang, Chan, Liu, Shi & Fang, arXiv 2026","Min-max regret task allocation and planning of heterogeneous multi-robot system in partially known environments",{arXiv:arx("2607.13403"),Scholar:sch("Min-max regret task allocation and planning of heterogeneous multi-robot system in partially known environments")}),
         ref("Macke, Mirsky & Stone, AAAI 2021","Expected value of communication for planning in ad hoc teamwork",{arXiv:arx("2103.01171"),Scholar:sch("Expected value of communication for planning in ad hoc teamwork")}),
         ref("Hollinger & Sukhatme, IJRR 2014","Sampling-based robotic information gathering algorithms",{Link:"https://robotics.usc.edu/resl/publications/840/",Scholar:sch("Sampling-based robotic information gathering algorithms")}),
         ref("Lerman, Jones, Galstyan & Matarić, IJRR 2006","Analysis of dynamic task allocation in multi-robot systems",{arXiv:arx("cs/0604111"),Scholar:sch("Analysis of dynamic task allocation in multi-robot systems")})] },

 /* ---------- P4 individual ---------- */
 { eyebrow:"Part 4 · ③ Knowledge & authority · P4 Controlled agent's view", title:"Controlled agent's view: control only yourself", fig:"p4ego", tag:"relaxes full control · E1a, E7b, E1b, E7a",
   bullets:[`One robot chooses <b>only its own</b> actions`,`Teammates move from decision variables into the <b>state</b>`,`Objective: a <b>best response to a belief</b>, judged over many teams`,`Everything depends on whether the <b>hypothesis space</b> is right`],
   notesTitle:"From team optimum to best response",
   notes:`<p>The classical allocator optimises over everyone's assignment. When a robot joins a team built by someone else, or works beside teammates it cannot command, that is not the decision it faces. The individual view states the problem from that robot's side.</p>
<p><b>Generic statement.</b> Robot <i>i</i> chooses its own policy <code>π<sub>i</sub></code> to maximise expected team return, where the other robots act according to unknown types or models <code>θ<sub>−i</sub></code>, and <i>i</i> holds a belief <code>b<sub>i</sub> ∈ Δ(S × Θ<sub>−i</sub>)</code> updated from what it observes. Team membership and the task set may change outside its control. Success is judged by team performance averaged over the teammates and tasks it might meet (4.6.1).</p>
<p><b>What changes compared with the planner view.</b></p>
<ul><li>Teammates become part of the state, as types or models, instead of decision variables.</li>
<li>The joint optimum is replaced by a best response to a belief.</li>
<li>Performance depends on whether the true teammates lie in the hypothesis space (4.6.2).</li></ul>
<p><b>Between the two views.</b> N-agent ad hoc teamwork (Wang et al., 2024) controls N of M agents. Its matrix-game examples show that reusing a single-agent ad hoc policy for two controlled agents can be worse than training them together, which is one reason the two views give different answers.</p>
<p><b>In MRTA.</b> Swarm studies by Lerman, Jones and colleagues are individual in the sense that each robot decides from local observation, but every robot runs the same rule. Eck et al. (2020) is the clearest egocentric task-choice model: each firefighting agent plans which fire to fight while modelling neighbours. 4.6.3 compares the open-team works in detail; Part 3's thin rating for E1a stands.</p>`,
   refs:[ref("Wang, Rahman, Durugkar, Liebman & Stone, NeurIPS 2024","N-agent ad hoc teamwork",{arXiv:arx("2404.10740"),Scholar:sch("N-agent ad hoc teamwork")}),
         ref("Eck, Shah, Doshi & Soh, AAAI 2020","Scalable decision-theoretic planning in open and typed multiagent systems",{arXiv:arx("1911.08642"),Scholar:sch("Scalable decision-theoretic planning in open and typed multiagent systems")})] },

 { child:true, eyebrow:"Part 4 · ③ Knowledge & authority · P4 Controlled agent's view · Deep dive", title:"Ad hoc teamwork: the challenge and a formal model", fig:"p4adhoc",
   intro:{year:'2005 / 2010',by:'Gmytrasiewicz & Doshi; Stone, Kaminka, Kraus & Rosenschein',cell:'one agent, unknown teammates',problem:'collaborate with previously unknown teammates without pre-coordination',note:'Gmytrasiewicz and Doshi (2005) extended POMDPs to settings with other agents: an agent keeps beliefs over the physical state and over models of the others. Stone et al. (2010) posed ad hoc teamwork as a challenge: build an agent that is a good teammate for agents it has never met, and judge it by how much it helps teams drawn from a population.'},
   math:[["state","IS<sub>i</sub> = S × M<sub>j</sub>","world × others"],["belief","b<sub>i</sub> ∈ Δ(IS<sub>i</sub>)","Prop. 1"],["evaluate","Σ s({a₀} ∪ B⁻, d) vs Σ s({a₁} ∪ B⁻, d)","Stone"]],
   bullets:[`Challenge: be a good teammate to agents you <b>have never met</b>`,`Judged by the <b>team's score</b> across many teams`,`I-POMDP: keep beliefs over the <b>world and the others' models</b>`],
   notesTitle:"How the problem is posed",
   notes:`<p><b>The challenge.</b> Stone et al. state it as: "To create an autonomous agent that is able to efficiently and robustly collaborate with previously unknown teammates on tasks to which they are all individually capable of contributing as team members." They stress that "an ad hoc team agent is fundamentally an individual agent".</p>
<p><b>The evaluation.</b> Draw a task <i>d</i> and a team <i>B</i> from a pool of agents, remove one member, insert the candidate, and record the team's score. Repeat many times; agent a₀ is the better ad hoc teammate if its total is higher than a₁'s (figure). Teams must be competent: every agent could contribute to some team that reaches a minimum score.</p>
<p><b>What the challenge paper does not give.</b> It is a problem statement and an evaluation procedure, not a decision model. Choosing a role appears only in prose examples (a first-aid helper versus a doctor; taking the goalkeeper's place).</p>
<p><b>A formal model: the I-POMDP.</b> Gmytrasiewicz and Doshi define an interactive state as the physical state together with models of the other agents. Models are intentional (the other is itself a rational agent with beliefs and a frame) or subintentional (a fixed policy). The belief over interactive states is a sufficient statistic (Proposition 1); value iteration for finitely nested I-POMDPs converges to a unique fixed point and the value function is piecewise linear and convex (Theorems 1–2). Solving them is PSPACE-hard for finite horizons and undecidable for infinite ones, the same as POMDPs. The framework is general-sum and its worked example is a two-agent tiger problem; it has no tasks or robots.</p>
<p><b>For MRTA</b> these give the shape of the problem (an individual decision over beliefs about others, evaluated across populations) but not task allocation itself.</p>
<p><b>Online ad hoc planning.</b> Wu, Zilberstein and Chen (2011, OPAT) plan online, step by step, with unfamiliar teammates, using Monte Carlo tree search and models of teammates' behaviour. Repeated planning with unknown teammates is therefore not new; a contribution must name an additional difficulty (1.6).</p>`,
   refs:[ref("Stone, Kaminka, Kraus & Rosenschein, AAAI 2010","Ad hoc autonomous agent teams: collaboration without pre-coordination",{PDF:"https://www.cs.utexas.edu/users/pstone/Papers/bib2html-links/AAAI10-adhoc.pdf",Scholar:sch("Ad hoc autonomous agent teams: collaboration without pre-coordination")}),
         ref("Gmytrasiewicz & Doshi, JAIR 2005","A framework for sequential planning in multi-agent settings",{arXiv:arx("1109.2135"),Scholar:sch("A framework for sequential planning in multi-agent settings")}),
         ref("Wu, Zilberstein & Chen, IJCAI 2011","Online planning for ad hoc autonomous agent teams",{PDF:"https://www.ijcai.org/Proceedings/11/Papers/081.pdf",Scholar:sch("Online planning for ad hoc autonomous agent teams")}),
         ref("Mirsky, Carlucho, Rahman, Fosong, Macke, Sridharan, Stone & Albrecht, EUMAS 2022","A survey of ad hoc teamwork research",{arXiv:arx("2202.10450"),Scholar:sch("A survey of ad hoc teamwork research")})] },

 { child:true, eyebrow:"Part 4 · ③ Knowledge & authority · P4 Controlled agent's view · Deep dive", title:"Type-based reasoning: PLASTIC, and when beliefs can be trusted", fig:"p4belief",
   intro:{year:'2016 / 2017',by:'Albrecht, Crandall & Ramamoorthy; Barrett, Rosenfeld, Kraus & Stone',cell:'one agent, teammates of unknown type',problem:'reuse what was learned with past teammates to help new ones quickly',note:'Barrett et al. (2017) built PLASTIC: an ad hoc agent keeps models or policies learned with earlier teams and weighs them by how well they predict the new teammates. Albrecht, Crandall and Ramamoorthy (2016) asked the underlying question for all such type-based methods: when do the beliefs converge to something correct, and what happens if the true type was never hypothesised?'},
   math:[["update","P(m) ← (1 − η(1 − P(a|m,s))) · P(m)","PLASTIC"],["assume","Θ⁺ ⊆ Θ*","true types are hypothesised"],["Thm 1","predictions become ε-correct","not: the type is identified"]],
   bullets:[`Keep models of <b>past teammates</b>; weigh them by how well they predict`,`If the true type is hypothesised, <b>predictions</b> become correct`,`If it is not, behaviour can fail; <b>test</b> the hypotheses online`],
   notesTitle:"Learning who your teammates are",
   notes:`<p><b>PLASTIC (Barrett et al.).</b> Teammates are drawn from a set of types; the agent has worked with earlier teams. PLASTIC-Model updates a belief over teammate models with the polynomial-weights rule above and plans with UCT; PLASTIC-Policy chooses among policies learned with earlier teams. Assumptions: a common goal, a known environment, no communication, and teammates that do not learn. Evaluated in a pursuit domain with more than 40 unseen teams and in RoboCup 2D half-field offence with seven teams, it adapts quickly by exploiting similarity to past teammates. The authors note it "may perform arbitrarily poorly" if new teammates are far from past ones.</p>
<p><b>Belief and truth (Albrecht et al.).</b> In a stochastic Bayesian game with hypothesised types Θ*:</p>
<ul><li>All convergence results need Assumption 1: the true types are among the hypotheses.</li>
<li>Theorem 1 (product posterior): with a pure type distribution and positive priors, the agent's <i>predictions</i> of future play become ε-correct. It need not identify the type (Example 1), and the result fails for mixed type distributions (Example 2).</li>
<li>Theorems 2–3 give conditions under which other posteriors converge to the true type distribution.</li>
<li>When the true type is missing, Section 6 gives sufficient conditions, checkable offline, under which the agent still completes the task; "critical" hypothesis spaces can trap it in a cycle.</li>
<li>Section 7 proposes an online hypothesis test (a p-value from score functions); its accuracy is shown empirically, often near 100%.</li>
<li>Priors can significantly affect long-term payoff (empirical, 78 repeated games).</li></ul>
<p><b>For MRTA.</b> Type-based reasoning is the natural way for a newcomer to estimate what its teammates will do, and these results say when to trust it. All experiments are simulations, teammates are stationary, and the decision is low-level action, not task allocation.</p>`,
   refs:[ref("Barrett, Rosenfeld, Kraus & Stone, Artificial Intelligence 2017","Making friends on the fly: cooperating with new teammates",{PDF:"https://www.cs.utexas.edu/~AustinVilla/papers/AIJ16-Barrett.pdf",Scholar:sch("Making friends on the fly: cooperating with new teammates")}),
         ref("Albrecht, Crandall & Ramamoorthy, Artificial Intelligence 2016","Belief and truth in hypothesised behaviours",{arXiv:arx("1507.07688"),Scholar:sch("Belief and truth in hypothesised behaviours")})] },

 { child:true, kind:"table", eyebrow:"Part 4 · ③ Knowledge & authority · P4 Controlled agent's view · Deep dive", title:"Open teams: who joins, who adapts, who chooses tasks", tag:"related evidence",
   table:{ dense:true, head:["Work","Who adapts","Openness","Task choice","Setting"],
     rows:[["Lerman et al. 2006; Jones & Matarić 2003","every robot, same rule","named, not tested (N = 20)","task type from a local window","simulated robots, two task types"],
           ["Eck et al. 2020","each agent plans for itself","leave and re-enter; no new agents","which fire to fight","simulated wildfire, ≤ 50 agents"],
           ["Rahman et al. 2021 (GPL)","one learner","teammates enter and leave mid-episode","implicit","grid games, ≤ 5 agents"],
           ["Wang et al. 2024 (NAHT)","N of M agents","team sampled once per episode","implicit","MPE, SMAC"],
           ["Saleh Abadi et al. 2026 (PLATO)","one shared policy, trained jointly","exit-and-refill cycles","pointer over tasks","wildfire grids"],
           ["Genter, Laue & Stone 2017","each robot","new teammates every game","soccer roles","physical NAO robots, shared message packet"]],
     hlCol:2, caption:"Mid-mission joining with heterogeneous robots choosing tasks: not found." },
   notesTitle:"What the open-team works actually cover",
   notes:`<p>Part 3 rated E1a ("members join and leave mid-mission") thin and named Eck et al. and PLATO as the closest work. The full texts sharpen this.</p>
<ul><li><b>Lerman et al. and Jones &amp; Matarić</b> study robots that each estimate the task mix from a sliding window of observations and switch task type accordingly. Lerman et al. show that after a change in the mix, convergence time grows roughly linearly with the window length when the window is long, and that windows also cause delay-induced oscillations. Jones and Matarić observe that short windows converge faster but switch more. Robots are homogeneous, there are two task types, and the team size is fixed at 20; adding or removing robots is named as a motivation but not tested.</li>
<li><b>Eck et al.</b> let agents leave and re-enter but "new agents do not enter". Each agent plans for itself, models a sample of neighbours and extrapolates; Theorem 1 says how many to model for a given error.</li>
<li><b>GPL</b> is the one work here with teammates entering and leaving within an episode, but in grid games with at most five agents.</li>
<li><b>NAHT</b> varies the team between episodes only.</li>
<li><b>PLATO</b> chooses among tasks with a pointer network, but all agents share one jointly trained policy; it is a team-level design, and openness is a temporary exit-and-refill.</li>
<li><b>The SPL drop-in competition</b> is the only long-running test on physical robots: 56 entries from 30 organisations over three years. Teams had to use a standard communication packet, so a shared protocol existed (the shared-protocol assumption).</li></ul>
<p><b>Conclusion.</b> In this review's search the snapshot rating holds. OPAT (Wu, Zilberstein &amp; Chen, 2011) is a further direct predecessor for online ad hoc planning. Add GPL to the closest-work list; note that no work combines mid-mission joining, heterogeneous capabilities and task choice on physical robots.</p>`,
   refs:[ref("Lerman, Jones, Galstyan & Matarić, IJRR 2006","Analysis of dynamic task allocation in multi-robot systems",{arXiv:arx("cs/0604111"),Scholar:sch("Analysis of dynamic task allocation in multi-robot systems")}),
         ref("Jones & Matarić, IROS 2003","Adaptive division of labor in large-scale minimalist multi-robot systems",{Link:"https://robotics.usc.edu/publications/340",Scholar:sch("Adaptive division of labor in large-scale minimalist multi-robot systems")}),
         ref("Rahman, Höpner, Christianos & Albrecht, ICML 2021","Towards open ad hoc teamwork using graph-based policy learning",{PDF:"http://proceedings.mlr.press/v139/rahman21a/rahman21a.pdf",Scholar:sch("Towards open ad hoc teamwork using graph-based policy learning")}),
         ref("Saleh Abadi, Soh, Redder, Eck & Doshi, arXiv 2026","PLATO: Pointer learner for agent and task openness",{arXiv:arx("2607.25082"),Scholar:sch("PLATO Pointer learner for agent and task openness")}),
         ref("Genter, Laue & Stone, JAAMAS 2017","Three years of the RoboCup Standard Platform League drop-in player competition",{PDF:"https://www.cs.utexas.edu/~AustinVilla/papers/JAAMAS16-katie.pdf",Scholar:sch("Three years of the RoboCup standard platform league drop-in player competition")})] },

 /* ---------- P3 safe ---------- */
 { eyebrow:"Part 4 · ② Value · P3 Conservative improvement", title:"Conservative improvement: never worse than now", fig:"p4gate", tag:"relaxes replace the plan · E5b, E7b",
   bullets:[`Decide on a <b>change</b> to a running team, not a plan from scratch`,`"No change" is <b>always allowed</b>`,`Guarantee: P(new &lt; baseline − ε) ≤ δ`,`The price of safety is explicit: <b>regret, data, or refusals</b>`],
   notesTitle:"The incumbent as the reference point",
   notes:`<p>A running team already has a way of working. A new allocation, a new member or a new policy is useful only if it improves on that, and harmful if it makes things worse while it learns. Safe-increment methods make the incumbent the reference point.</p>
<p><b>Generic statement.</b> Given an incumbent π₀, data D collected under it, a performance measure J, a tolerance ε and a risk level δ, an algorithm returns either a candidate or "keep π₀", such that <code>P<sub>D</sub>[J(output) &lt; J(π₀) − ε] ≤ δ</code>. Candidates are considered only if a lower confidence bound on their performance clears the threshold; falling back to π₀ is always feasible.</p>
<p><b>Two forms.</b></p>
<ul><li><b>Online and anytime</b> (conservative bandits, 4.5.1): cumulative reward must stay above a fraction of what the baseline would have earned, at every round. This constrains <i>learning</i>.</li>
<li><b>Batch and one-shot</b> (HCPI, Seldonian algorithms, SPIBB, 4.5.2): a new policy is deployed only if held-out data certify it. This constrains <i>deployment</i>.</li></ul>
<p><b>How it differs from optimise-then-deploy.</b> The decision variable is the change, not the allocation; the output may be "no change"; the guarantee is about the algorithm over random data, not about reaching the optimum; and the cost of safety appears as a number (extra regret, a data requirement, or how often the answer is "no solution found").</p>
<p><b>In MRTA.</b> None of the papers read applies a baseline-relative guarantee to multi-robot task allocation. Rudolph et al. (2021) argue that fixed risk attitudes can hurt and adapt risk-seeking to the situation; Shi and Sukhatme (2024) infer a human's risk parameters by minimally deviating from current ones. Both use absolute thresholds or parameter distances, not "not worse than the current team". E5b stays at "partly" because risk-aware objectives exist; the baseline-relative form is missing.</p>`,
   refs:[ref("Thomas, Castro da Silva, Barto, Giguere, Brun & Brunskill, Science 2019","Preventing undesirable behavior of intelligent machines",{DOI:"https://doi.org/10.1126/science.aag3311",Scholar:sch("Preventing undesirable behavior of intelligent machines")}),
         ref("Rudolph, Chernova & Ravichandar, arXiv 2021","Desperate times call for desperate measures: towards risk-adaptive task allocation",{arXiv:arx("2108.00346"),Scholar:sch("Desperate times call for desperate measures towards risk-adaptive task allocation")}),
         ref("Shi & Sukhatme, arXiv 2024","Inverse risk-sensitive multi-robot task allocation",{arXiv:arx("2406.10199"),Scholar:sch("Inverse risk-sensitive multi-robot task allocation")})] },

 { child:true, eyebrow:"Part 4 · ② Value · P3 Conservative improvement · Deep dive", title:"Conservative bandits: learning above a floor", fig:"p4floor",
   intro:{year:'2016 / 2017',by:'Wu, Shariff, Lattimore & Szepesvári; Kazerouni et al.',cell:'one learner, a default option',problem:'explore new options while never earning much less than the default would have',note:'Wu et al. (2016) were motivated by companies that already run a reasonable default strategy and want to try alternatives without a visible drop in revenue. They added a constraint to the bandit problem: cumulative reward must stay above a fixed fraction of the default\'s, at all times. Kazerouni et al. (2017) extended it to contextual linear bandits.'},
   math:[["floor","Σ<sub>s≤t</sub> μ<sub>I<sub>s</sub></sub> ≥ (1−α) μ₀ t, ∀t","w.p. ≥ 1−δ"],["regret","O(√(nKL) + KL/(α μ₀))","Thm 2"],["lower","Ω( K/(αμ₀) + √(Kn) )","Thm 9"]],
   bullets:[`Play the default to <b>build a margin</b>, then spend it exploring`,`The constraint costs only an <b>additive</b> term in regret`,`It is cumulative: a single step can still be bad`],
   notesTitle:"The cost of not falling behind",
   notes:`<p><b>Setting.</b> K arms plus a default arm 0 with mean μ₀. The learner must keep its cumulative mean reward at least (1−α) times what always playing the default would have given, at every round. Conservative UCB plays the optimistic arm only if a pessimistic estimate of the remaining "budget" stays non-negative; otherwise it plays the default (the staircase in the figure).</p>
<p><b>Theorem 2.</b> With rewards in [0, 1], 1-subgaussian noise and μ₀ known, with probability at least 1−δ the constraint holds at every round and the regret is the usual <code>√(nK log)</code> term plus <code>K log/(αμ₀)</code>. The second term does not grow with n: safety costs a constant. Theorem 5 handles unknown μ₀; Theorem 9 shows the additive term is unavoidable even if the constraint is imposed only at the last round.</p>
<p><b>Contextual extension.</b> Kazerouni et al. impose the same constraint against a baseline <i>policy</i> in linear contextual bandits (CLUCB, Theorem 6), with a constant extra term that requires a positive lower bound on baseline rewards.</p>
<p><b>Read carefully.</b> The guarantee is cumulative and anytime, not per action: individual pulls can be much worse than the default. Theorem 2 assumes stochastic rewards; the paper also treats an adversarial setting (Theorem 7 and Corollary 8), where the extra cost of the constraint is larger.</p>
<p><b>For a robot team.</b> The "arms" would be a newcomer's options or a team's alternative allocations. In a team, other robots react, so the arms are not stationary; rewards are coupled across robots; and a newcomer may not even know what the default for itself is.</p>`,
   refs:[ref("Wu, Shariff, Lattimore & Szepesvári, ICML 2016","Conservative bandits",{PDF:"http://proceedings.mlr.press/v48/wu16.pdf",Scholar:sch("Conservative bandits Wu Shariff Lattimore Szepesvari")}),
         ref("Kazerouni, Ghavamzadeh, Abbasi-Yadkori & Van Roy, NeurIPS 2017","Conservative contextual linear bandits",{arXiv:arx("1611.06426"),Scholar:sch("Conservative contextual linear bandits")})] },

 { child:true, eyebrow:"Part 4 · ② Value · P3 Conservative improvement · Deep dive", title:"Safe policy improvement from data", fig:"p4spibb",
   intro:{year:'2015 / 2019',by:'Thomas, Theocharous & Ghavamzadeh; Laroche, Trichelair & Tachet des Combes',cell:'one learner, batch data from a baseline',problem:'deploy a new policy only when data show it is not worse than the current one',note:'Thomas et al. (2015) asked for reinforcement learning that a practitioner could trust: an algorithm that returns a new policy only if, with high confidence, it performs at least as well as a chosen threshold, and otherwise says "no solution found". Laroche et al. (2019) proposed a model-based alternative that stays with the baseline wherever data are scarce.'},
   math:[["HCPI","Pr( ρ(output) &lt; ρ₋ ) ≤ δ","else: keep π₀"],["SPIBB","π = π<sub>b</sub> where N(x,a) &lt; N∧","copy if data thin"],["Thm 2","ρ(π<sub>spibb</sub>) ≥ ρ(π<sub>b</sub>) − ζ","w.p. 1−δ"]],
   bullets:[`Pick a candidate on part of the data; <b>test it once</b> on the rest`,`SPIBB: where data are thin, <b>copy the baseline</b>`,`A newcomer has no data: safe means <b>copy the team</b>`],
   notesTitle:"Certify before you deploy",
   notes:`<p><b>HCPI.</b> An algorithm is "safe" if the probability that it returns a policy worse than the user's threshold ρ₋ is at most δ. The data are split: one part proposes a candidate, the other tests it once with a lower confidence bound on importance-weighted returns; if the bound clears ρ₋ the candidate is returned, otherwise "no solution found". Only the concentration-inequality version is fully safe; the t-test and bootstrap versions are "semi-safe" because they rely on approximations. The only assumption beyond that is that the environment is a (stationary) POMDP. The iterated version, Daedalus, sets ρ₋ to an estimate of the current policy's performance.</p>
<p><b>Seldonian algorithms</b> (Thomas et al., 2019) generalise this: maximise an objective subject to user-stated constraints that must each hold with probability ≥ 1−δ<sub>i</sub>. "Do not decrease performance relative to the current policy" is one such constraint.</p>
<p><b>SPIBB.</b> In a finite MDP with a known baseline policy and a batch of data, state–action pairs seen fewer than N∧ times form the bootstrapped set 𝔅. The new policy must copy the baseline on 𝔅 and may optimise elsewhere. Theorem 2: with probability 1−δ it is a ζ-approximate safe improvement, with ζ given by the counts and the model's estimates. Variants without the 𝔅 constraint (Π≤b-SPIBB, SPIBB-DQN) lose the guarantee.</p>
<p><b>The figure</b> contrasts a team with logged data (improve where counts are high) with a newcomer (all counts zero, so every cell is copied). For a robot joining a team, the safe-improvement answer degenerates to "behave like the baseline", which presupposes a baseline for that robot.</p>
<p><b>Distribution-free gates.</b> Conformal prediction gives a guarantee of the same flavour with fewer assumptions: if calibration data and the test point are exchangeable, the prediction set contains the truth with probability at least 1−α (Angelopoulos &amp; Bates, Theorem 1). The coverage is marginal, not conditional. Lindemann et al. (2023) use it for safe planning around other agents but assume the robot does not influence them, which a teammate does.</p>`,
   refs:[ref("Thomas, Theocharous & Ghavamzadeh, ICML 2015","High confidence policy improvement",{PDF:"http://proceedings.mlr.press/v37/thomas15.pdf",Scholar:sch("High confidence policy improvement")}),
         ref("Laroche, Trichelair & Tachet des Combes, ICML 2019","Safe policy improvement with baseline bootstrapping",{PDF:"http://proceedings.mlr.press/v97/laroche19a/laroche19a.pdf",Scholar:sch("Safe policy improvement with baseline bootstrapping")}),
         ref("Angelopoulos & Bates, Foundations and Trends in ML 2023","Conformal prediction: a gentle introduction",{arXiv:arx("2107.07511"),Scholar:sch("A gentle introduction to conformal prediction and distribution-free uncertainty quantification")}),
         ref("Lindemann, Cleaveland, Shim & Pappas, IEEE RA-L 2023","Safe planning in dynamic environments using conformal prediction",{arXiv:arx("2210.10254"),Scholar:sch("Safe planning in dynamic environments using conformal prediction")})] },

 { eyebrow:"Part 4 · ④ Operation & design · P6 System and incentive design", title:"System and incentive design: change it, then solve it simply", fig:"p4bilevel", tag:"relaxes given problem · E10c, E10a, E10b",
   bullets:[`Change the problem so a <b>simple rule</b> does well`,`Three knobs: <b>payoffs</b>, <b>team make-up</b>, <b>environment</b>`,`Bilevel: choose d to maximise the welfare of what the rule produces`,`Only payoff design has <b>proofs</b>; the others use metrics or simulation`],
   notesTitle:"Allocation as the inner loop of a design problem",
   notes:`<p>Instead of a better allocator for a fixed problem, change the problem. If the payoffs, the team or the workspace are chosen well, a simple, decentralised rule may do as well as a sophisticated planner on a badly designed problem.</p>
<p><b>Generic statement.</b> <code>max<sub>d∈𝒟</sub> J(d)</code>, where <code>J(d) = W(a(d))</code> and <code>a(d)</code> is the outcome of a fixed, simple allocation rule run under design d: equilibria of a game, a swarm's transition dynamics, or uniformly random task assignment followed by path finding. The objective can be worst-case over outcomes (the price of anarchy) or an expectation estimated by simulation.</p>
<p><b>Three kinds of design.</b></p>
<ul><li><b>Payoff or rule design</b> (4.8.1): d is the agents' local utility. This is the only kind with theorems: existence of equilibria and price-of-anarchy bounds, under conditions such as submodular welfare.</li>
<li><b>Team design</b> (4.8.2): d is which robots, with which traits, are in the team. Diversity measures predict how hard allocation will be; team formation itself is NP-hard and solved heuristically.</li>
<li><b>Environment design</b> (4.8.2): d is the layout. It is searched with quality-diversity methods and evaluated in simulation, without guarantees.</li></ul>
<p><b>In MRTA.</b> Part 3 rated co-design of fleet, layout and policy (E10c) thin. The full texts confirm why: layout search holds the allocator fixed (random goals), team-diversity work measures diversity rather than choosing the team, and payoff design is analysed for equilibria, not for the robotic constraints of travel, timing or capability.</p>`,
   refs:[] },

 { child:true, eyebrow:"Part 4 · ④ Operation & design · P6 System and incentive design · Deep dive", title:"Designing payoffs: distributed welfare games", fig:"p4poa",
   intro:{year:'2009 / 2013',by:'Marden, Arslan & Shamma; Marden & Wierman',cell:'resource allocation as a game',problem:'choose local utilities so that self-interested best responses give good team welfare',note:'Marden, Arslan and Shamma (2009) argued that cooperative control could be designed as a game: give each agent a local utility aligned with a global objective, so that simple learning finds good outcomes. Marden and Wierman (2013) asked which ways of splitting welfare among agents guarantee that equilibria exist and are efficient, without knowing the agents\' action sets in advance.'},
   math:[["utility","U<sub>i</sub>(a) = Σ<sub>r∈a<sub>i</sub></sub> f<sub>r</sub>(i, {a}<sub>r</sub>)","rule f<sub>r</sub> is the design"],["if","W<sub>r</sub> submodular, f<sub>r</sub> ≥ marginal, Σ<sub>i</sub> f<sub>r</sub> ≤ W<sub>r</sub>","Prop. 4 (Vetta)"],["then","W(a<sup>ne</sup>) ≥ ½ W(a<sup>opt</sup>)","tight (Example 1)"]],
   bullets:[`Design the <b>split of welfare</b>, not the assignment`,`Marginal contribution and Shapley rules: equilibria exist, <b>at least ½ optimal</b>`,`Needs <b>submodular</b> welfare; budget balance trades against efficiency`],
   notesTitle:"What payoff design can and cannot promise",
   notes:`<p><b>Model.</b> Agents choose sets of resources; welfare is a sum over resources, <code>W(a) = Σ<sub>r</sub> W<sub>r</sub>({a}<sub>r</sub>)</code>. The designer fixes, for each resource, a distribution rule <code>f<sub>r</sub></code> that says how much of <code>W<sub>r</sub></code> each agent using it receives. The rule may depend only on <code>W<sub>r</sub></code> and must work for action sets the designer does not know.</p>
<p><b>Rules compared (Table 1).</b></p>
<ul><li><b>Equal share</b>: budget-balanced and cheap; an equilibrium is guaranteed only if <code>W<sub>r</sub></code> is anonymous.</li>
<li><b>Marginal contribution</b> (wonderful life utility): always a potential game with potential W, so equilibria exist; not budget-balanced.</li>
<li><b>Shapley value</b> (and weighted Shapley): equilibria exist and the rule is budget-balanced, but computing it is hard and needs much information.</li></ul>
<p><b>Efficiency.</b> If welfare is submodular and the rule pays each agent at least its marginal contribution without overspending, every equilibrium achieves at least half the optimal welfare (Proposition 4, after Vetta 2002). The bound is tight (Example 1, the figure's lower line). With identical action sets and anonymous welfare the bound improves to n/(2n−1) (Theorem 2). For coverage problems a non-Shapley budget-balanced rule also reaches ½ (Theorem 3).</p>
<p><b>Equilibria versus dynamics.</b> Marden and Wierman analyse equilibria, not how agents reach them; they note that finding a Nash equilibrium is not polynomial in general. Marden, Arslan and Shamma give learning results: under log-linear learning the stationary distribution is proportional to <code>exp(β·φ)</code>, concentrating on maximisers of the potential as β → ∞ (Theorem 3.1). Their examples are consensus and sensor coverage.</p>
<p><b>For MRTA.</b> Payoff design gives the cleanest guarantees in this part, but for welfare that is separable over resources and submodular. Task allocation with travel, timing and complementary capabilities often violates both.</p>`,
   refs:[ref("Marden & Wierman, Operations Research 2013","Distributed welfare games",{Link:"https://authors.library.caltech.edu/37881",Scholar:sch("Distributed welfare games Marden Wierman")}),
         ref("Marden, Arslan & Shamma, IEEE Trans. SMC-B 2009","Cooperative control and potential games",{PDF:"https://authors.library.caltech.edu/records/xq9ws-8wp90/files/Marden2009p6043Ieee_T_Syst_Man_Cy_B.pdf",Scholar:sch("Cooperative control and potential games")})] },

 { child:true, eyebrow:"Part 4 · ④ Operation & design · P6 System and incentive design · Deep dive", title:"Designing the team and the workspace", fig:"p4teamdesign",
   intro:{year:'2017 / 2020 / 2023',by:'Prorok, Hsieh & Kumar; Ravichandar, Shaw & Chernova; Zhang et al.',cell:'trait-based teams; warehouse layouts',problem:'choose who is on the team, or where things are, so that allocation becomes easier',note:'Prorok, Hsieh and Kumar (2017) described heterogeneous swarms by species and binary traits and asked how team diversity affects how fast a desired trait distribution can be reached. Ravichandar et al. (2020) extended this to continuous, uncertain traits (STRATA). Zhang et al. (2023) searched over warehouse layouts, with a path planner in the loop, to raise throughput.'},
   math:[["traits","Y = X Q","robots per task × traits per species"],["diversity","D<sub>G₁</sub>(Q) = rank(Q)","eigenspecies (exact match)"],["","D<sub>G₂</sub>(Q) = min set cover","coverspecies (at least)"],["layout","max<sub>x</sub> mean throughput(x)","simulated, QD search"]],
   bullets:[`Team design: <b>diversity measures</b> predict difficulty`,`More complementarity → <b>slower</b> convergence`,`Layout search: <b>2× scalability</b>, random task assigner`],
   notesTitle:"Measures, searches and what is not yet designed",
   notes:`<p><b>Trait-based teams (Prorok et al.).</b> S species, U binary traits, species–trait matrix Q; X(t) says how many robots of each species are at each task, and Y = XQ is the trait distribution. Each species follows designed transition rates (as in 2.4.4). The goal is to reach a target trait distribution exactly (G₁) or at least (G₂) as fast as possible.</p>
<ul><li>Diversity is measured by the <b>minspecies cardinality</b>: the smallest set of species from which every reachable trait distribution can be built. For exact matching it equals rank(Q) (eigenspecies, Proposition 1); for minimum matching it is a minimum set cover (coverspecies, Proposition 2).</li>
<li><b>Finding (empirical, Fig. 7):</b> convergence time increases with minspecies cardinality. In the authors' words, "the more the robot community is diverse, the harder it is to optimize". Adding redundant species makes allocation easier.</li>
<li>Diversity is measured, not designed; choosing Q or the species counts is left open.</li></ul>
<p><b>STRATA</b> extends the model to Gaussian traits and adds a variance constraint; its conclusion states that optimality guarantees are open and that using diversity to synthesise teams is future work. Synergy-graph team formation (Liemhetcharat &amp; Veloso, 2012) learns pairwise compatibility from observation; finding the best team is NP-hard in the weighted version and solved by simulated annealing.</p>
<p><b>Layout design (Zhang et al., 2023).</b> The decision is which grid cells hold shelves, endpoints or nothing; throughput is the mean over lifelong path-finding simulations; search uses quality-diversity methods with a repair step. The headline: optimised layouts double the number of robots one planner (RHCR) can handle before congestion, from under 150 to over 300 in one setup. At small robot counts throughput is similar. Task assignment is uniformly random throughout. A follow-up learns layout generators that scale to maps with 2,350 robots.</p>
<p><b>Gap.</b> Team and layout are designed with the allocator held fixed and simple. Optimising the allocator and the design together (E10c) remains open.</p>`,
   refs:[ref("Prorok, Hsieh & Kumar, IEEE Trans. Robotics 2017","The impact of diversity on optimal control policies for heterogeneous robot swarms",{Link:"https://scalar.seas.upenn.edu/?p=264",Scholar:sch("The impact of diversity on optimal control policies for heterogeneous robot swarms")}),
         ref("Ravichandar, Shaw & Chernova, JAAMAS 2020","STRATA: unified framework for task assignments in large teams of heterogeneous agents",{arXiv:arx("1903.05149"),Scholar:sch("STRATA unified framework for task assignments in large teams of heterogeneous agents")}),
         ref("Liemhetcharat & Veloso, AAMAS 2012","Modeling and learning synergy for team formation with heterogeneous agents",{PDF:"https://ifaamas.csc.liv.ac.uk/Proceedings/aamas2012/papers/5B_4.pdf",Scholar:sch("Modeling and learning synergy for team formation with heterogeneous agents")}),
         ref("Zhang, Fontaine, Bhatt, Nikolaidis & Li, IJCAI 2023","Multi-robot coordination and layout design for automated warehousing",{arXiv:arx("2305.06436"),Scholar:sch("Multi-robot coordination and layout design for automated warehousing")}),
         ref("Zhang, Fontaine, Bhatt, Nikolaidis & Li, NeurIPS 2023","Arbitrarily scalable environment generators via neural cellular automata",{arXiv:arx("2310.18622"),Scholar:sch("Arbitrarily scalable environment generators via neural cellular automata")})] },

 /* ---------- P5 no shared protocol ---------- */
 { eyebrow:"Part 4 · ③ Knowledge & authority · P5 Coordination interfaces", title:"Coordination interfaces: talk or watch", fig:"p4talkwatch", tag:"relaxes shared protocol · E6e, E1b, E7a",
   bullets:[`Teammates from <b>different builders</b>: no agreed format, scores or conventions`,`Objective: do well across a <b>population of partners</b> (cross-play)`,`Two channels: <b>talk</b> (language) and <b>watch</b> (actions, environment)`,`Many methods only <b>move</b> the agreement up a level`],
   notesTitle:"Coordinating without agreeing first",
   notes:`<p>Every agreement method of 2.3 assumes that robots share a message format, a scoring rule and tie-breaking conventions. Robots from different builders, or a robot joining a team whose software it has never seen, cannot assume this. Section 2.4.6 noted that self-organisation is the only classical family that coordinates through the environment instead.</p>
<p><b>Generic statement.</b> Robot <i>i</i> runs a policy built by its own builder; its partners are drawn from an unknown population 𝒫, possibly with different action spaces. There is no shared message alphabet with agreed meanings, no shared utility table and no shared algorithm. Each builder solves <code>max<sub>π<sub>i</sub></sub> E<sub>π<sub>−i</sub>∼𝒫</sub>[J(π<sub>i</sub>, π<sub>−i</sub>)]</code>: perform well with partners it was not co-trained with.</p>
<p><b>Two channels.</b></p>
<ul><li><b>Watch:</b> infer partners' intentions from their actions and from traces in the environment. Implicit communication, legibility and stigmergy live here (4.7.2).</li>
<li><b>Talk:</b> send a message, now often in natural language, which costs time and is useful only if the partner decodes it as intended (2.3.10).</li>
<li>Deciding which channel to use, and when, is itself an information problem (4.7.3).</li></ul>
<p><b>A caveat that runs through this section.</b> Much of the zero-shot coordination literature does not remove agreement; it moves it up a level. Designers still share the game, its symmetries, a base policy, a simulator or a learning rule (4.7.1). Systems such as RoCo and SMART-LLM, sometimes cited as heterogeneous coordination, use one language model or a designed dialogue protocol for all robots, so a shared protocol is in place.</p>`,
   refs:[ref("Mandi, Jain & Song, ICRA 2024","RoCo: dialectic multi-robot collaboration with large language models",{arXiv:arx("2307.04738"),Scholar:sch("RoCo dialectic multi-robot collaboration with large language models")}),
         ref("Kannan, Venkatesh & Min, IROS 2024","SMART-LLM: smart multi-agent robot task planning using large language models",{arXiv:arx("2309.10062"),Scholar:sch("SMART-LLM smart multi-agent robot task planning using large language models")})] },

 { child:true, kind:"table", eyebrow:"Part 4 · ③ Knowledge & authority · P5 Coordination interfaces · Deep dive", title:"Zero-shot coordination: what is still shared", tag:"cross-play",
   table:{ dense:true, head:["Method","Idea","Evidence","Still shared"],
     rows:[["Other-play (Hu et al. 2020)","train against symmetry-relabelled partners so arbitrary conventions do not form","Hanabi cross-play; small human study (n = 20)","the game, its symmetries Φ, the learning rule"],
           ["Off-belief learning (Hu et al. 2021)","read partners' past actions as if from a fixed base policy","Hanabi; zero-shot between independent runs","the base policy π₀, a simulator"],
           ["Fictitious co-play (Strouse et al. 2021)","best-respond to a pool of self-play agents and their checkpoints","Overcooked with humans (n = 114)","the simulator and action space"],
           ["Rules and conventions (Shih et al. 2021)","separate task rules from partner-specific conventions","bandit, block placing, a Hanabi variant","the domain; partner identity known"],
           ["Learning about humans (Carroll et al. 2019)","best-respond to a behaviour-cloned human model","Overcooked with humans","a human model from data"],
           ["ProAgent (Zhang et al. 2024)","an LLM infers teammates' intentions from observation","Overcooked vs other algorithms and cloned humans","a hand-written knowledge library, language grounding"]],
     hlCol:3, caption:"Robustness to unseen partners improves, but every method relies on something shared by design." },
   notesTitle:"Reading the zero-shot coordination literature for robots",
   notes:`<p><b>Other-play.</b> In a cooperative game that is common knowledge, the symmetries Φ are relabellings of states, actions and observations that leave the game unchanged. Self-play can settle on any one of many equivalent conventions; other-play maximises the expected return against symmetry-relabelled copies, <code>E<sub>φ∼U(Φ)</sub>[J(π¹, φ(π²))]</code>, so it cannot rely on arbitrary labels. Proposition 2 shows it is the best possible meta-equilibrium when states and actions carry no labels. In Hanabi, cross-play between independently trained agents rises sharply; a 20-person human study favours it, and the authors note it is not a "silver bullet".</p>
<p><b>Off-belief learning</b> interprets partners' past actions as if they came from a fixed base policy π₀, removing hidden conventions. In bounded turn-based games the resulting policy is unique, so independently trained agents coordinate zero-shot (Theorem 1, Corollary 1); with simultaneous moves uniqueness is lost.</p>
<p><b>Fictitious co-play</b> trains a best response to a frozen pool of self-play agents and their earlier checkpoints; with real humans in Overcooked (n = 114) it scored best and was preferred. Removing the earlier checkpoints sharply lowers performance.</p>
<p><b>Rules and conventions.</b> Shih et al. factor a policy into a task-dependent rule module and a partner-dependent convention module. Adapting to a <i>new</i> partner still needs fine-tuning; zero-shot transfer applies to known partners on new tasks.</p>
<p><b>Carroll et al.</b> show that agents trained only with other agents do poorly with humans and that a human model helps, less strongly with real people than in simulation. <b>ProAgent</b> uses a language model to infer intentions and corrects its beliefs when the teammate acts differently; it is strongest as one of the two players but not as the other in two layouts.</p>
<p><b>For robots from different builders.</b> The last column is the point: each method replaces a shared protocol with some other shared assumption. Which of these assumptions are reasonable between real robot makers is an open question.</p>`,
   refs:[ref("Hu, Lerer, Peysakhovich & Foerster, ICML 2020","\"Other-play\" for zero-shot coordination",{arXiv:arx("2003.02979"),Scholar:sch("Other-play for zero-shot coordination")}),
         ref("Hu, Lerer, Cui, Pineda, Brown & Foerster, ICML 2021","Off-belief learning",{PDF:"http://proceedings.mlr.press/v139/hu21c/hu21c.pdf",Scholar:sch("Off-belief learning")}),
         ref("Strouse, McKee, Botvinick, Hughes & Everett, NeurIPS 2021","Collaborating with humans without human data",{arXiv:arx("2110.08176"),Scholar:sch("Collaborating with humans without human data")}),
         ref("Shih, Sawhney, Kondic, Ermon & Sadigh, ICLR 2021","On the critical role of conventions in adaptive human-AI collaboration",{arXiv:arx("2104.02871"),Scholar:sch("On the critical role of conventions in adaptive human-AI collaboration")}),
         ref("Carroll, Shah, Ho, Griffiths, Seshia, Abbeel & Dragan, NeurIPS 2019","On the utility of learning about humans for human-AI coordination",{arXiv:arx("1910.05789"),Scholar:sch("On the utility of learning about humans for human-AI coordination")}),
         ref("Zhang et al., AAAI 2024","ProAgent: building proactive cooperative agents with large language models",{arXiv:arx("2308.11339"),Scholar:sch("ProAgent building proactive cooperative agents with large language models")})] },

 { child:true, eyebrow:"Part 4 · ③ Knowledge & authority · P5 Coordination interfaces · Deep dive", title:"The watch channel: implicit signals, legibility, stigmergy", fig:"p4legible",
