<style>

const GROUPS=[null,
 {g:"①",en:"What is unknown",es:"Unknowns",zh:"什么是未知的",zs:"未知",E:[1,2,3],P:[1]},
 {g:"②",en:"What counts as help",es:"Value",zh:"怎样才算帮上忙",zs:"价值",E:[4,5],P:[2,3]},
 {g:"③",en:"Who knows and who decides",es:"Knowledge & authority",zh:"谁知道什么、谁能决定",zs:"信息与权限",E:[6,7],P:[4,5]},
 {g:"④",en:"How it runs, and what can change",es:"Operation & design",zh:"何时执行、能否改系统",zs:"运行与设计",E:[8,9,10],P:[6]}];
const EGN=k=>{ const n=+String(k).replace(/^E(\d+).*/,"$1"); return GROUPS.findIndex(g=>g&&g.E.includes(n)); };
const PGN=k=>{ const n=+String(k).replace(/^P(\d).*/,"$1"); return GROUPS.findIndex(g=>g&&g.P.includes(n)); };
const EGRP=k=>{ const g=GROUPS[EGN(k)]; return g.g+" "+g.es; };
function grpOf(f){ const e=f.eyebrow||""; let m=e.match(/· (E\d+)/); if(m&&f.part.id==="p3") return EGN(m[1]); m=e.match(/· (P[1-6]) /); if(m&&f.part.id==="p4") return PGN(m[1]); return 0; }
/* ================= SVG helpers ================= */
const S = (inner, vb="0 0 400 300") => `<svg viewBox="${vb}" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const T = (x,y,s,cls="",extra="") => `<text x="${x}" y="${y}" class="${cls}" ${extra}>${s}</text>`;
function arrow(x1,y1,x2,y2,cls="ln"){
  const a=Math.atan2(y2-y1,x2-x1), h=8, w=4.5;
  const bx=x2-h*Math.cos(a), by=y2-h*Math.sin(a);
  const p1=[bx+w*Math.sin(a), by-w*Math.cos(a)], p2=[bx-w*Math.sin(a), by+w*Math.cos(a)];
  const fill = cls.includes("acc")?"f-acc":cls.includes("cool")?"f-cool":"f-ink";
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" class="${cls}"/><polygon points="${x2},${y2} ${p1} ${p2}" class="${fill}"/>`;
}
function robot(x,y,hl=false,s=1){
  const body = hl? 'class="f-accs" stroke="var(--accent)"' : 'class="f-surf" stroke="var(--ink)"';
  return `<g transform="translate(${x},${y}) scale(${s})">
    <line x1="0" y1="-16" x2="0" y2="-24" class="${hl?'ln-acc':'ln'}" style="stroke-width:1.5"/>
    <circle cy="-26" r="3" class="${hl?'f-acc':'f-ink'}"/>
    <rect x="-17" y="-16" width="34" height="28" rx="7" ${body} stroke-width="1.6"/>
    <circle cx="-6" cy="-3" r="3" class="${hl?'f-acc':'f-ink'}"/><circle cx="6" cy="-3" r="3" class="${hl?'f-acc':'f-ink'}"/>
    <line x1="-8" y1="16" x2="-8" y2="20" class="ln"/><line x1="8" y1="16" x2="8" y2="20" class="ln"/></g>`;
}
function task(x,y,label,hl=false,r=15){
  return `<polygon points="${x},${y-r} ${x+r},${y} ${x},${y+r} ${x-r},${y}" class="${hl?'f-accs':'f-surf'}" stroke="var(${hl?'--accent':'--ink'})" stroke-width="1.6"/>`+
    T(x,y+4,label,"t-b",'text-anchor="middle" font-size="10"');
}

FIG.itax = () => { let s=""; const zh=(typeof LANG!=="undefined"&&LANG==="zh");
  const P=[["ND",zh?"无依赖":"no dependencies",zh?"每个配对的价值各自独立":"each pairing stands alone"],
           ["ID",zh?"日程内依赖":"in-schedule",zh?"代价取决于自己的路线":"cost depends on own route"],
           ["XD",zh?"跨日程依赖":"cross-schedule",zh?"还取决于他人的日程":"depends on others' schedules"],
           ["CD",zh?"复杂依赖":"complex",zh?"还取决于任务如何分解":"depends on how tasks are split"]];
  const O=[[4,6],[204,6],[4,154],[204,154]], W=192, H=140;
  const node=(p,c)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6.5" class="${c[0]}" stroke="var(${c[1]})" stroke-width="1.7"/>`;
  const path=(pts,cls,extra="")=>`<path d="${pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}" class="${cls}" style="stroke-width:2;fill:none" ${extra}/>`;
  const ACC=["f-accs","--accent"], COOL=["f-cools","--cool"], INK=["f-surf","--ink"];
  const sh=(o,pts)=>pts.map(p=>[o[0]+p[0],o[1]+p[1]]);
  P.forEach((p,i)=>{ const [ox,oy]=O[i];
    s+=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" rx="6" class="f-surf" stroke="var(--line)" stroke-width="1.4"/>`;
    s+=T(ox+10,oy+21,p[0],"t-d",'font-size="15"')+T(ox+40,oy+20,p[1],"t-b",'font-size="9.5"');
    s+=T(ox+W/2,oy+H-9,p[2],"t-mut",'text-anchor="middle" font-size="8.5"'); });
  // ND: each robot linked to its tasks directly; no task-to-task edges
  { const o=O[0]; const [A,B]=sh(o,[[46,98],[150,62]]); const ta=sh(o,[[18,58],[96,108]]), tb=sh(o,[[98,42],[112,90],[176,106]]);
    ta.forEach(t=>s+=path([A,t],"ln-acc")); tb.forEach(t=>s+=path([B,t],"ln-acc"));
    [...ta,...tb].forEach(t=>s+=node(t,ACC)); s+=robot(A[0],A[1],false,.5)+robot(B[0],B[1],false,.5); }
  // ID: each robot has its own route; a task's cost depends on its neighbours in that route
  { const o=O[1]; const A=sh(o,[[170,52],[134,64],[98,42],[60,62]]), B=sh(o,[[22,104],[62,108],[104,94],[150,108]]);
    s+=path(A,"ln-cool")+path(B,"ln-cool"); [...A.slice(1),...B.slice(1)].forEach(t=>s+=node(t,COOL));
    s+=robot(A[0][0],A[0][1],false,.5)+robot(B[0][0],B[0][1],false,.5); }
  // XD: routes of different robots are linked by a constraint
  { const o=O[2]; const A=sh(o,[[22,106],[34,64],[70,48]]), B=sh(o,[[172,54],[132,50],[112,88],[150,108]]);
    s+=path(A,"ln")+path(B,"ln"); [...A.slice(1),...B.slice(1)].forEach(t=>s+=node(t,INK));
    const a=A[2], b=B[2]; const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    s+=arrow(mx,my,a[0]+8,a[1]+3,"ln-acc")+arrow(mx,my,b[0]-8,b[1]-3,"ln-acc");
    s+=T(mx-12,my+16,zh?"先后":"before","t-acc t-b",'text-anchor="end" font-size="8.5"');
    s+=robot(A[0][0],A[0][1],false,.5)+robot(B[0][0],B[0][1],false,.5); }
  // CD: two alternative decompositions of the same job, interleaved
  { const o=O[3]; const R1=sh(o,[[20,104]])[0], R2=sh(o,[[174,50]])[0];
    const a=sh(o,[[56,64],[96,96],[136,62],[170,100]]), b=sh(o,[[54,104],[96,50],[138,100]]);
    s+=path([R1,...a],"ln-acc")+path([R2,...b.slice().reverse()],"ln-cool","stroke-dasharray=\"5 4\"");
    s+=path([R1,b[0]],"ln-cool","stroke-dasharray=\"5 4\"");
    a.forEach(t=>s+=node(t,ACC)); b.forEach(t=>s+=node(t,COOL));
    s+=`<line x1="${o[0]+122}" y1="${o[1]+17}" x2="${o[0]+136}" y2="${o[1]+17}" class="ln-acc" style="stroke-width:2"/><line x1="${o[0]+156}" y1="${o[1]+17}" x2="${o[0]+170}" y2="${o[1]+17}" class="ln-cool" style="stroke-width:2" stroke-dasharray="4 3"/>`+T(o[0]+140,o[1]+20,"A","t-acc t-b",'font-size="9"')+T(o[0]+174,o[1]+20,"B","t-cool t-b",'font-size="9"');
    s+=robot(R1[0],R1[1],false,.5)+robot(R2[0],R2[1],false,.5); }
  return S(s);
};

 E1:{name:"Agents", classical:"a fixed, known set of robots", subs:["E1a","E1b","E1c","E1d"],
   summary:`<p>Of the four ways the "fixed, known robots" assumption breaks, only heterogeneous capability structure has a mature robotics line (trait-based allocation). Teammates of unknown type and humans on the team are studied, but mostly outside MRTA proper or in small teams. Robots joining and leaving mid-mission is well defined in multi-agent systems research but has almost no robotics allocation work.</p>
<p><b>A pattern across E1:</b> the most developed lines (ad hoc teamwork, open MAS) live in multi-agent learning and game benchmarks; the robotics lines keep a fixed roster and handle change as repair after a disruption.</p>`},
 E2:{name:"Tasks", classical:"a given batch, already decomposed, with known requirements", subs:["E2a","E2b","E2c","E2d"],
   summary:`<p>Tasks arriving over time is the best-studied departure in the whole of Part 3 so far, with mature, separate lines in dynamic vehicle routing and lifelong pickup-and-delivery. Discovery and decomposition are partly studied. Unknown task requirements are thin.</p>
<p><b>A pattern across E2:</b> each line relaxes one sub-axis and keeps the others classical. Lifelong pickup-and-delivery has streaming tasks but atomic ones with known requirements; LLM planners decompose tasks but allocate them once, with known skills. In the works checked, none relaxes more than two E2 sub-axes at once.</p>`},
 E3:{name:"Dynamics", classical:"what each robot's actions achieve is known, static and deterministic", subs:["E3a","E3b","E3c","E3d"],
   summary:`<p>All four E3 sub-axes are partly studied, which is itself informative: each has a cluster of 2020–2026 papers, usually from a few groups, but no shared formulation, theory or benchmark.</p>
<p><b>A pattern across E3:</b> methods that handle uncertainty almost always assume the uncertainty is <i>known</i>: known capability distributions, known failure probabilities, known blockage rates. Methods that <i>learn</i> capability or environment online usually drop temporal coupling, stochastic failure, or both. Combinations are rare; no work was found that learns capability, handles failures and faces an unknown environment at once.</p>`},
};

     W("Zhu et al.","2025",.66,"Zhu, Xu, Guo & Lin, EPTCS 2025","The combined problem of online task assignment and lifelong path finding in logistics warehouses","https://arxiv.org/abs/2502.07332","Online assignment and lifelong path finding solved jointly in a warehouse simulator.","Known task types; no decomposition or discovery.","abstract")]},
 E2b:{el:"E2", title:"Tasks must be discovered by sensing", status:"partly",
   ideal:"tasks listed for the team", real:"robots find tasks while working, from what they see",
   bullets:[`Exploration-coupled allocation exists, usually with a fixed <b>scout / worker split</b>`,`Most methods <b>replan after discovery</b> rather than plan to discover`,`<b>Open:</b> joint information gathering and assignment; egocentric perception of where help is needed`],
   open:`Aziz et al. (2022) note that tasks may be discovered over time and that most methods handle this by replanning. Osooli et al. (2023) state that search-and-rescue work rarely treats information gathering, assignment and planning as one problem. No work was found that makes a robot's own perception of where help is needed part of multi-robot allocation.`,
   why:"exploration–allocation coupling exists through fixed roles or replanning; discovery from egocentric perception is thin.",
   works:[W("Zlot et al.","2002",.3,"Zlot, Stentz, Dias & Thayer, ICRA 2002","Multi-robot exploration controlled by a market economy","https://publications.ri.cmu.edu/multi-robot-exploration-controlled-by-a-market-economy","Market allocation of exploration goals trading information gain against cost.","Tasks are the exploration targets themselves.","abstract"),
     W("Watch-And-Help","2021",.36,"Puig et al., ICLR 2021","Watch-And-Help: A challenge for social perception and human-AI collaboration","https://mlanthology.org/iclr/2021/puig2021iclr-watchandhelp","A helper infers another agent's goal from observation, then helps.","Single helper; simulated household; adjacent to, not part of, MRTA.","abstract"),
     W("Ginting et al.","2024",.4,"Ginting, Otsu, Kochenderfer & Agha-mohammadi, arXiv 2024","Capability-aware task allocation and team formation analysis for cooperative exploration of complex environments","https://arxiv.org/abs/2411.00400","Heterogeneous team deployment in subterranean exploration with failures and comms limits.","Mission is exploration; capability and outcome models given.","abstract"),
     W("Osooli et al.","2023",.45,"Osooli, Robinette, Jerath & Ahmadzadeh, arXiv 2023","A multi-robot task assignment framework for search and rescue with heterogeneous teams","https://arxiv.org/abs/2309.12589","Scouting, then assignment, then planning; matches capabilities to victim needs.","Stages run in sequence; predefined requirement categories.","abstract"),
     W("MI-UCB","2021",.5,"Lee et al., arXiv 2021","An upper confidence bound for simultaneous exploration and exploitation in heterogeneous multi-robot systems","https://arxiv.org/abs/2105.06118","Scouts gather information while task robots earn reward.","Fixed scout / task split; known reward model.","partial full text"),
     W("Hunter–gatherer","2021",.56,"Dadvar, Moazami, Myler & Zargarzadeh, 2021","Exploration and coordination of complementary multi-robot teams in a hunter and gatherer scenario","https://arxiv.org/abs/1912.07521","Tasks unknown in advance; fast robots find them, skilled robots do them.","Found tasks are atomic with known requirements; fixed roles.","abstract")]},
 E2c:{el:"E2", title:"Tasks must be decomposed", status:"partly",
   ideal:"tasks arrive already decomposed", real:"a goal must be broken into subtasks as part of the decision",
   bullets:[`Classical: <b>task trees</b> traded at any level; temporal-logic methods with guarantees`,`Since 2023: very active <b>LLM decomposition</b> (SMART-LLM, COHERENT, LaMMA-P)`,`<b>Open:</b> guarantees for LLM decomposition, online re-decomposition, real-world validation`],
   open:`Li et al. (2025) list weak numerical reasoning, high latency and indoor-only benchmarks for LLM-based multi-robot systems and suggest combining LLMs with optimisation solvers. SMART-LLM reports assignments to robots lacking the required skill. Classical complex-task methods still depend on hand-written decomposition structures or specifications.`,
   why:"formal foundations exist and LLM work is very active, but guarantees, online re-decomposition and real-world validation are sparse.",
   works:[W("Korsah et al.","2013",.2,"Korsah, Stentz & Dias, IJRR 2013","A comprehensive taxonomy for multi-robot task allocation","https://publications.ri.cmu.edu/a-comprehensive-taxonomy-for-multi-robot-task-allocation","Names complex dependencies (CD), where decomposition is part of the decision.","Taxonomy, no method.","abstract"),

 E2d:{el:"E2", title:"Task requirements are unknown", status:"thin",
   ideal:"each task's required capabilities are given", real:"a new task arrives and nobody has said what it needs",
   bullets:[`Most MRTA, including trait-based methods, <b>takes requirements as given</b>`,`A few papers <b>learn</b> requirements or rewards, only for task types already seen`,`<b>Open:</b> mapping a new task to its capability needs, with any guarantee`],
   open:`Ali et al. (2022) say novel tasks need representations covering familiar and unfamiliar work. Fu et al. (2022) and Singh et al. (2023) learn requirements or rewards only for task types already seen. LLM systems infer requirements implicitly and without verification. No work was found that maps a new task's description to capability requirements with a guarantee.`,
   why:"a handful of learning papers limited to known task types, plus position papers flagging the problem.",
   works:[W("STRATA","2020",.12,"Ravichandar, Shaw & Chernova, JAAMAS","STRATA: Unified framework for task assignments in large teams of heterogeneous agents","https://arxiv.org/abs/1903.05149","Matches tasks' trait requirements to agents.","Requirements given.","abstract"),
     W("Murata et al.","2025",.36,"Murata et al., arXiv 2025","Multi-robot task planning for multi-object retrieval tasks with distributed on-site knowledge via large language models","https://arxiv.org/abs/2509.12838","LLM infers which objects a vague instruction needs, then decomposes and assigns.","Retrieval only; requirements as object lists, not capabilities.","abstract"),
     W("CMTAB","2023",.42,"Singh, Srikanthan, Mallampati & Ravichandar, RSS 2023","Concurrent constrained optimization of unknown rewards for multi-robot task allocation","https://roboticsproceedings.org/rss19/p108.html","Learns unknown task rewards online with bandits.","Recurring known task set; no transfer to new tasks.","full text"),
     W("Fu et al.","2022",.47,"Fu, Smith, Rizzo, Castanier, Ghaffari & Barton, arXiv 2022","Learning task requirements and agent capabilities for multi-agent task allocation","https://arxiv.org/abs/2211.03286","Learns requirement constraints and capability models from team performance data.","Offline data for the same task types; linear constraints.","abstract")]},

 E3a:{el:"E3", title:"Capability is unknown", status:"partly",
   ideal:"capabilities known in advance", real:"what a robot can do, and how well, must be learned while working",
   bullets:[`A cluster of 2020–2026 work <b>estimates capability online</b> (specialisation, proficiency, bandits, Bayesian inference)`,`Most still assume a <b>known capability structure</b>, stationarity and one fixed team`,`<b>Open:</b> theory (regret bounds), scaling, and learning combined with temporal coupling`],
   open:`Online capability learning usually still assumes a known trait structure (CMTAB assumes the trait matrix), stationary rewards and a single team. Singh et al. (2023) list missing regret bounds and scalability as open. Learning robot capability together with temporal or coupling constraints has few examples.`,
   why:"several recent papers from a few groups, without a shared formulation, theory or benchmark.",
   works:[W("Fu et al.","2021",.3,"Fu, Smith, Rizzo, Castanier, Ghaffari & Barton, arXiv 2021 (venue unverified)","Robust task scheduling for heterogeneous robot teams under capability uncertainty","https://arxiv.org/abs/2106.12111","Capabilities as random variables; risk-aware (CVaR) decomposition, assignment and scheduling.","Distributions known in advance; offline plan.","abstract"),
     W("CMTAB","2023",.45,"Singh, Srikanthan, Mallampati & Ravichandar, RSS 2023","Concurrent constrained optimization of unknown rewards for multi-robot task allocation","https://roboticsproceedings.org/rss19/p108.html","Learns unknown task rewards online with continuum-armed bandits.","Known trait matrix; stationary rewards; simulation; no regret bounds.","full text"),

     W("Liu et al.","2022",.55,"Liu, Natarajan & Gombolay, ACM THRI 2022","Coordinating human-robot teams with dynamic and stochastic task proficiencies","https://arxiv.org/abs/2007.01921","Learns noisy, changing human proficiencies; exploration-aware robust schedules; user studies.","Learns humans, not robots; parametric learning curves; fixed task set.","abstract"),
     W("CE-CM","2026",.6,"Tisnikar, Swieczkowska, Ma, Canal & Leonetti, arXiv 2026","Partner capability estimation for task-agnostic adaptation in ad-hoc teamwork","https://arxiv.org/abs/2607.27177","Bayesian inference of task-invariant partner capability, refined over a few tasks.","Ad hoc teamwork, not allocation at scale; simulation and offline human data.","abstract")]},
 E3b:{el:"E3", title:"Capability drifts over time", status:"partly",
   ideal:"capabilities are constant", real:"batteries drain, parts wear, skills improve or degrade",
   bullets:[`<b>Energy-aware</b> allocation is fairly common, mostly with deterministic energy models`,`<b>Wear and degradation</b> appear only in a few recent papers, mostly batteries and homogeneous fleets`,`<b>Open:</b> predicting capability drift inside heterogeneous allocation, under uncertainty`],
   open:`Notomista et al. (2021) leave recovering lost capability out of scope. Li et al. (2026) note that most battery-aware planning addresses a single robot. No work was found that predicts capability drift (prognostics) inside heterogeneous multi-robot allocation with uncertainty.`,
   why:"energy depletion is widely handled; degradation and learning-effect drift are thin and fragmented.",
   works:[W("Latif et al.","2021",.38,"Latif, Gui, Munir & Parasuraman, arXiv 2021 (venue unverified)","Energy-aware multi-robot task allocation in persistent tasks","https://arxiv.org/abs/2112.15282","Decentralised foraging allocation accounting for battery depletion and recharging.","Single domain; greedy baseline only.","abstract"),
     W("Emam et al.","2020",.42,"Emam et al., arXiv 2020","Adaptive task allocation for heterogeneous multi-robot teams with evolving and unknown robot capabilities","https://arxiv.org/abs/2003.03344","Specialisation tracks evolving capability.","Deterministic dynamics; fixed team.","abstract"),

     W("Mayya et al.","2020",.5,"Mayya, D'Antonio, Saldaña & Kumar, arXiv 2020 (venue unverified)","Resilient task allocation in heterogeneous multi-robot systems","https://arxiv.org/abs/2009.04593","Infers degraded capabilities from task performance, then reallocates.","Centralised; known capability-to-task map; no predictive model.","abstract"),
     W("Li et al.","2026",.56,"Li, Li, Chu, Li & Chen, arXiv 2026","Fleet-level battery-health-aware scheduling for autonomous mobile robots","https://arxiv.org/abs/2603.22731","Assignment, routing and charging that spreads battery degradation across the fleet.","Deterministic degradation proxies; offline.","abstract")]},
 E3c:{el:"E3", title:"Execution is stochastic; robots fail", status:"partly",
   ideal:"tasks succeed, durations are known", real:"durations vary, tasks fail, robots break down",
   bullets:[`Called "very sparse" in 2017; since then <b>risk-aware and stochastic</b> methods have appeared`,`Almost all assume <b>known distributions</b> and single-robot tasks`,`<b>Open:</b> stochastic multi-robot tasks; learned failure models; failure + reallocation + guarantees together`],
   open:`Nunes et al. (2017) called stochastic allocation with temporal constraints very sparse, with no work on stochastic multi-robot (ST-MR) tasks. Work since 2020 covers parts of this but keeps known distributions, single-robot tasks or perfect communication; Faruq et al. (2024) list these limits themselves, and Rossano et al. (2025) leave an approximation bound for greedy allocation with their coupled, non-submodular rewards as an open theoretical challenge.`,
   why:"no longer sparse for single-robot tasks with known distributions; coalition tasks, learned failure models and combined guarantees are thin.",
   works:[W("Ponda et al.","2012",.4,"Ponda, Johnson & How, ACC 2012","Distributed chance-constrained task allocation for autonomous multi-agent teams","https://dspace.mit.edu/handle/1721.1/81757","Decentralised chance-constrained allocation splitting a team risk budget.","Known distributions; single-robot tasks; no robot loss.","abstract"),

     W("SCoBA","2020",.5,"Choudhury et al., RSS 2020","Dynamic multi-robot task allocation under uncertainty and temporal constraints","https://arxiv.org/abs/2005.13109","Stochastic task success with time windows; optimal in expectation.","Known stochastic model; single-agent tasks.","abstract"),
     W("Messing et al.","2023",.52,"Messing et al., RSS 2023","A sampling-based approach for heterogeneous coalition scheduling with temporal uncertainty","https://roboticsproceedings.org/rss19/p107.html","Uncertain durations with a probabilistic bound on execution time.","Known capabilities; no failure or reallocation.","abstract"),
     W("Faruq et al.","2024",.56,"Faruq, Lacerda, Hawes & Parker, ACM TAAS 2024","A framework for simultaneous task allocation and planning under uncertainty","https://www.cs.ox.ac.uk/David.Parker/papers/taas-stapu.pdf","Robots as MDPs with permanent failure; replans after failure.","Perfect communication; no task arrival; single-robot tasks.","full text")]},
 E3d:{el:"E3", title:"The environment is unknown", status:"partly",
   ideal:"map and travel costs known", real:"costs uncertain or learned while working; the map is built online",
   bullets:[`Uncertain travel cost has solid <b>risk-aware and robust</b> formulations, with distributions known`,`Allocation interleaved with <b>exploration</b> is mostly heuristic, homogeneous or phased`,`<b>Open:</b> learning the environment model online while allocating, for heterogeneous teams`],
   open:`Most work on uncertain costs assumes the cost or blockage distributions are known. Wilde and Alonso-Mora (2022) list estimating blockage parameters online, with its exploration–exploitation trade-off, as future work. Exploration-coupled allocation is mostly heuristic, uses homogeneous robots or keeps mapping and allocation as separate phases.`,

     W("Burgard et al.","2005",.45,"Burgard, Moors, Stachniss & Schneider, IEEE T-RO 2005","Coordinated multi-robot exploration","https://www.ipb.uni-bonn.de/wp-content/papercite-data/pdf/burgard05tro.pdf","Allocates frontier targets on a map built online.","Deterministic actions; the tasks are the frontiers.","full text"),
     W("Wilde & A.-Mora","2022",.5,"Wilde & Alonso-Mora, IEEE CDC 2022","Online multi-robot task assignment with stochastic blockages","https://research.tudelft.nl/en/publications/online-multi-robot-task-assignment-with-stochastic-blockages/","Blockages discovered on arrival; expected-cost greedy online assignment.","Known map and blockage rates; homogeneous; no reassignment.","full text"),
     W("Patil et al.","2023",.52,"Patil et al., arXiv 2023","Graph-based simultaneous coverage and exploration planning for fast multi-robot search","https://arxiv.org/abs/2303.02259","Generates and allocates exploration and coverage tasks in an unknown environment.","Homogeneous; heuristic, no guarantees.","summary")]},

const STATUS = {well:["well studied","--cool"], partly:["partly studied","--accent"], thin:["thin","--accent"]};

FIG.axis = key => { const a=SUB[key]; let s=""; const x0=150, x1=372, X=p=>x0+p*(x1-x0);
  const ws=[...a.works].sort((p,q)=>p.pos-q.pos), rh=27, y0=58;
  const yEnd=y0+ws.length*rh;
  s+=`<rect x="${X(.72)}" y="${y0-12}" width="${X(1)-X(.72)}" height="${yEnd-y0+14}" rx="5" class="f-accs" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.2"/>`;
  s+=T((X(.72)+X(1))/2,y0-18,"open","t-acc t-b",'text-anchor="middle" font-size="10.5"');
  s+=T(x0,y0-18,"classical","t-cool t-b",'font-size="9.5"')+T(X(.72)-6,y0-18,"→ relaxed","t-mut",'text-anchor="end" font-size="9"');
  s+=`<line x1="${x0}" y1="${y0-10}" x2="${x0}" y2="${yEnd}" class="ln-cool"/>`;
  ws.forEach((w,i)=>{ const y=y0+i*rh+6;
    s+=T(x0-10,y+4,w.short,"t-b",'text-anchor="end" font-size="9.5"')+T(x0-10,y+15,w.yr,"t-mut",'text-anchor="end" font-size="8"');
    s+=`<line x1="${x0}" y1="${y}" x2="${X(w.pos)}" y2="${y}" class="ln" style="stroke-width:2.2"/><circle cx="${X(w.pos)}" cy="${y}" r="5" class="f-ink"/>`; });
  const yb=yEnd+26;
  s+=`<line x1="16" y1="${yb-14}" x2="384" y2="${yb-14}" class="ln-mut"/>`;
  const lines=[""]; a.real.split(" ").forEach(w=>{ const L=lines.length-1; if((lines[L]+" "+w).trim().length<=41) lines[L]=(lines[L]+" "+w).trim(); else lines.push(w); });
  s+=T(16,yb,"fully relaxed:","t-acc t-b",'font-size="9.5"'); lines.forEach((l,i)=>s+=T(114,yb+i*13,l,"",'font-size="9.5"'));
  const st=STATUS[a.status]; const ys=yb+13*(lines.length-1)+19;
  s+=T(16,ys,"snapshot:","t-mut",'font-size="9.5"')+T(80,ys,st[0],"t-b",`font-size="9.5" style="fill:var(${st[1]})"`)+T(384,ys,"bar = judged extent","t-mut",'text-anchor="end" font-size="8.5"');
  return S(s); };

FIG.elem = key => { const e=AX[key]; let s="";
  s+=T(16,24,`${key}: ${["","one","two","three","four","five"][e.subs.length]} ways the classical assumption breaks`,"t-mut",'font-size="9.5"');
  const lvl={well:3,partly:2,thin:1};
  const st=e.subs.length>4?48:60, bh=st-12;
  e.subs.forEach((k,i)=>{ const a=SUB[k], y=40+i*st, v=lvl[a.status];
    s+=`<rect x="16" y="${y}" width="368" height="${bh}" rx="6" class="f-surf" stroke="var(--line)"/>`;
    s+=T(28,y+(st>50?20:16),k,"t-b",'font-size="10"')+T(62,y+(st>50?20:16),a.title,"t-b",'font-size="8.8"');
    s+=T(62,y+(st>50?36:30),`${a.works.length} works checked`,"t-mut",'font-size="9"');
    for(let b=0;b<3;b++) s+=`<rect x="${320+b*21}" y="${y+(st>50?8:6)}" width="17" height="16" rx="3" class="${b<v?(v===3?'f-cool':'f-acc'):'f-bg'}" stroke="var(--line)"/>`;
    s+=T(374,y+(st>50?39:32),STATUS[a.status][0],"t-mut",'text-anchor="end" font-size="8.5"'); });
  s+=T(200,290,"bars: 1 = thin · 2 = partly studied · 3 = well studied","t-mut",'text-anchor="middle" font-size="9"');
  return S(s); };

const elemSlides = (key, num) => { const e=AX[key]; const out=[];
  out.push({ eyebrow:`Part 3 · Step 4 · ${EGRP(key)} · ${key}`, title:`${key} ${e.name}: ${e.subs.map(k=>SUB[k].status).filter(x=>x==="thin").length} thin, ${e.subs.map(k=>SUB[k].status).filter(x=>x==="partly").length} partly, ${e.subs.map(k=>SUB[k].status).filter(x=>x==="well").length} well studied`, fig:`elem:${key}`,
    tag:`${key} · classical: ${e.classical}`,
    bullets:e.subs.map(k=>`<b>${k}</b> ${SUB[k].title}: <i>${STATUS[SUB[k].status][0]}</i>`),
    notesTitle:`${key} ${e.name}: summary`,
    notes:`<p><b>Classical assumption:</b> ${e.classical}.</p>${e.summary}
<p><b>How to read the sub-axis pages.</b> Each page places representative works on a line from the classical assumption (left) to the fully relaxed setting (right). Positions are qualitative judgements of how far a work relaxes the assumption, not measurements. The dashed region on the right is what no checked work reaches. Each work's notes record what it handles, what it still keeps, and how it was checked (full text, abstract, or title only).</p>
<p><b>Status ratings.</b> <i>Well studied</i>: several mature lines of work. <i>Partly studied</i>: a real but fragmented cluster, or one that keeps strong simplifications. <i>Thin</i>: a handful of papers or none, often with the field's own surveys calling it open.</p>`,
    refs:[] });
  e.subs.forEach(k=>{ const a=SUB[k];
    out.push({ child:true, eyebrow:`Part 3 · Step 4 · ${EGRP(key)} · ${key} ${e.name}`, title:`${k} · ${a.title}`, fig:`axis:${k}`, tag:`search snapshot: ${STATUS[a.status][0]}`,
      bullets:a.bullets,
      notesTitle:`${k}: ${a.title}`,
      notes:`<p><b>Classical:</b> ${a.ideal}. <b>Fully relaxed:</b> ${a.real}.</p>
<p><b>Representative works</b> (left to right on the figure):</p>
<ul>${[...a.works].sort((p,q)=>p.pos-q.pos).map(w=>`<li><b>${w.short} (${w.yr})</b>. ${w.handles} <span style="color:var(--muted)">Still keeps: ${w.keeps} Checked: ${w.ev}.</span></li>`).join("")}</ul>
<p><b>What remains open.</b> ${a.open}</p>
<div class="key"><span class="lbl">Search snapshot (Oct 2026): ${STATUS[a.status][0]}</span>${a.why.charAt(0).toUpperCase()+a.why.slice(1)} This label records what this review's searches found; it is not a coverage statistic.</div>`,
      refs:[...a.works].sort((p,q)=>p.pos-q.pos).map(w=>ref(w.cite,w.title,{Link:w.link,Scholar:sch(w.title)})) }); });
  return out; };

/* ---------- Part 3: E4–E6 ---------- */
Object.assign(AX, {
 E4:{name:"Interaction", classical:"the value of each robot–task pairing is independent of the others (ND)", subs:["E4a","E4b","E4c","E4d"],
   summary:`<p>Two E4 sub-axes are well studied: temporal coupling has a dedicated taxonomy and many solvers, and non-additive team value has mature formalisms (coalition formation, submodular assignment) with guarantees. Interference as an allocation cost is partly studied. The case where the allocation itself reshapes the system is thin within MRTA, although its pieces are mature in operations research.</p>
<p><b>A pattern across E4:</b> guarantees rest on <i>monotone</i> structure, where adding a robot never hurts and returns diminish. Interference breaks that monotonicity, and feedback between allocation and system state breaks the assumption that values are fixed while the allocation is chosen. Both sit at the edge of current theory.</p>`},
 E5:{name:"Objective", classical:"one scalar objective per episode, fully specified by the designer", subs:["E5a","E5b","E5c","E5d"],
   summary:`<p>E5 was nearly empty in the family coverage matrix (3.3.1), and the literature check confirms it is thinner than E1–E4 overall. Throughput objectives are well established, but almost only in homogeneous warehouse path-finding. Risk measures are established, while guarantees of doing no worse than a baseline are absent in MRTA. Multiple objectives and fairness are fragmented, and human-defined objectives are thin.</p>
<p><b>A pattern across E5:</b> when the objective changes, the rest of the problem is simplified to compensate: throughput work keeps single-robot tasks and identical robots; risk work keeps known distributions and a designer-fixed risk level; fairness has no shared definition.</p>`},
 E6:{name:"Information", classical:"the allocator sees the global state, or each robot knows its own costs exactly", subs:["E6a","E6b","E6c","E6d","E6e"],
   summary:`<p>E6 was the element most often raised in the audit (13 items). Limited communication is well studied, with a qualifier on realism. Local observation and uncertain self-knowledge are partly studied. Treating information as something that costs time to acquire is thin: value-of-information reasoning exists outside allocation or for single ad hoc agents in small domains. A fifth sub-axis, E6e, was added after Parts 2 and 4 showed that classical coordination assumes a shared message protocol; working without one is also thin.</p>
<p><b>A pattern across E6:</b> uncertainty is usually exogenous and known (a distribution, an interval, a loss model). Robots that must <i>estimate</i> their own costs or the team's state, and decide how long to spend doing so, are rare.</p>`},
});
Object.assign(SUB, {
 E4a:{el:"E4", title:"Temporal coupling across robots", status:"well",
   ideal:"tasks independent in time", real:"precedence, synchronisation and time windows linking robots, under uncertainty",
   bullets:[`A dedicated <b>taxonomy</b> (Nunes et al. 2017) and many exact, heuristic, distributed and learned solvers`,`Basic deterministic formulations are <b>mature</b>`,`<b>Open:</b> stochastic versions, guarantees for heuristics, richer constraint types, dynamic arrivals`],
   open:`Nunes et al. (2017) call stochastic allocation with temporal and ordering constraints very sparse and ask for guarantees for heuristic solvers and richer temporal models (disjunctive constraints, mixed soft and hard windows). Arbanas Ferreira et al. (2024) list dynamic arrivals, communication loss and complex dependencies as future work.`,
   why:"the deterministic formulation is mature; gaps are in uncertainty, guarantees and dynamics.",
   works:[W("Nunes et al.","2017",.2,"Nunes, Manner, Mitiche & Gini, RAS 2017","A taxonomy for task allocation problems with temporal and ordering constraints","https://www-users.cse.umn.edu/~gini/papers/NunesRAS.pdf","Taxonomy separating temporal from ordering constraints, mapped to VRP and scheduling.","Survey; covered work mostly deterministic.","full text"),
     W("Tercio","2013",.5,"Gombolay, Wilcox & Shah, RSS 2013","Fast scheduling of multi-robot teams with temporospatial constraints","https://roboticsproceedings.org/rss09/p49.html","Deadlines, precedence and spatial separation; MILP plus fast sequencer.","Centralised; deterministic durations.","abstract"),
     W("Bischoff et al.","2020",.55,"Bischoff, Meyer, Inga & Hohmann, arXiv 2020","Multi-robot task allocation and scheduling considering cooperative tasks and precedence constraints","https://arxiv.org/abs/2005.03902","Synchronised multi-robot tasks with precedence; feasibility check and local improvement.","Centralised heuristic; deterministic.","abstract"),
     W("ScheduleNet","2020",.55,"Wang & Gombolay, RSS 2020","Heterogeneous graph attention networks for scalable multi-robot scheduling with temporospatial constraints","https://roboticsproceedings.org/rss16/p094.html","Learned scheduler over a temporal network with robot and proximity nodes.","Centralised; imitation from an expert; deterministic.","abstract"),
     W("GRSTAPS","2022",.6,"Messing, Neville, Hutchinson, Chernova & Ravichandar, IJRR 2022","GRSTAPS: Graphically recursive simultaneous task allocation, planning, and scheduling","https://star-lab.cc.gatech.edu/papers/messing-grstaps","Joint planning, allocation, scheduling and motion under spatiotemporal constraints.","Centralised, offline, deterministic; simulation.","abstract"),
     W("CBM-pop","2024",.62,"Arbanas Ferreira, Petrović, Orsag, Martínez de Dios & Bogdan, IEEE Access 2024","Distributed allocation and scheduling of tasks with cross-schedule dependencies for heterogeneous multi-robot teams","https://idus.us.es/handle/11441/160682","Distributed metaheuristic for precedence and transitional dependencies.","Connected network; static missions; no stochasticity.","full text")]},
 E4b:{el:"E4", title:"Interference and congestion", status:"partly",
   ideal:"robots do not slow each other down", real:"a robot's cost depends on how many others share its space or resources",
   bullets:[`Interference is well <b>characterised</b> in swarm and foraging models (sublinear scaling)`,`Few <b>allocation</b> formulations price it; most reduce it through behaviour or push it into path planning`,`<b>Open:</b> congestion-aware allocation that is time-extended, heterogeneous or decentralised`],
   open:`Nam and Shell's count-dependent penalty model is centralised and instantaneous; they name decentralised and time-extended versions as future work. Rosenfeld et al. and Mayya et al. reduce interference through behaviour rather than through the assignment. The Aziz et al. (2022) survey does not discuss interference (an inference from absence).`,
   why:"well characterised in swarm models, with some assignment formulations, but rarely inside time-extended, heterogeneous or decentralised allocation.",
   works:[W("Lerman & Galstyan","2002",.3,"Lerman & Galstyan, Autonomous Robots 2002","Mathematical model of foraging in a group of robots: effect of interference","https://www.isi.edu/results/publications/13159/mathematical-model-of-foraging-in-a-group-of-robots-effect-of-interference/","Shows group performance grows sublinearly with size because of interference.","Homogeneous; one task type; no assignment optimisation.","abstract"),
     W("Rosenfeld et al.","2008",.35,"Rosenfeld, Kaminka, Kraus & Shehory, Artificial Intelligence 2008","A study of mechanisms for improving robotic group performance","https://u.cs.biu.ac.il/~kaminkg/publications/b2hd-aij07avi.html","Measures coordination cost; adapts coordination to perceived conflicts.","Adapts behaviour, not assignment; foraging; simulation.","abstract"),
     W("Mayya et al.","2018",.4,"Mayya, Pierpaoli & Egerstedt, arXiv 2018","Voluntary retreat for decentralized interference reduction in robot swarms","https://arxiv.org/abs/1812.02193","Robots estimate local density and probabilistically leave crowded areas.","Homogeneous; stay-or-leave, not full assignment.","abstract"),
     W("Zhang et al.","2016",.45,"Zhang, Rossi & Pavone, RSS 2016","Routing autonomous vehicles in congested transportation networks","https://arxiv.org/abs/1603.00939","Capacitated network-flow model of congestion for vehicle rebalancing.","Fluid steady-state abstraction.","abstract"),
     W("Nam & Shell","2015",.5,"Nam & Shell, IEEE T-ASE (extends ICRA 2014)","Assignment algorithms for modeling resource contention in multi-robot task allocation","https://cse-robotics.engr.tamu.edu/dshell/papers/tase2014_mapwp.pdf","Assignment cost includes a penalty in the number of robots using a resource.","Centralised; instantaneous; one-to-one.","full text")]},
 E4c:{el:"E4", title:"Non-additive team value", status:"well",
   ideal:"team value = sum of individual values", real:"synergy and interference both present, values learned during deployment",
   bullets:[`<b>Coalition formation</b> and <b>submodular assignment</b> are mature, with guarantees`,`Guarantees assume <b>monotone</b> value: adding a robot never hurts`,`<b>Open:</b> non-monotone value (synergy and interference together); learning it online`],
   open:`Guarantees rest on monotone submodular or supermodular structure; E-ITAGS states its bound needs "adding a robot never reduces performance". Nam and Shell note their exact method fails with synergistic negative costs. Prorok leaves the trade-off between redundancy cost and gain as future work. Learning non-additive value from few observations is only recently addressed.`,
   why:"mature formalisms with guarantees; the thin parts are non-monotone value and learning it during deployment.",
   works:[W("Shehory & Kraus","1998",.4,"Shehory & Kraus, Artificial Intelligence 1998","Methods for task allocation via agent coalition formation","https://jmvidal.cse.sc.edu/lib/shehory98a.html","Distributed coalition formation with approximation bounds; disjoint and overlapping coalitions.","Coalition values from known capabilities; capped coalition size; new tasks handled by re-running formation.","full text"),
     W("Prorok","2020",.45,"Prorok, IEEE T-ASE","Robust assignment using redundant robots on transport networks with uncertain travel time","https://arxiv.org/abs/1804.04986","Redundant assignment as supermodular minimisation with greedy bounds.","One-shot; redundancy cost not modelled.","abstract and partial full text"),
     W("Synergy graphs","2014",.5,"Liemhetcharat & Veloso, Artificial Intelligence 2014","Weighted synergy graphs for effective team formation with heterogeneous ad hoc agents","https://doi.org/10.1016/j.artint.2013.12.002","Learns pairwise synergy from observed small-team performance.","Team selection, not allocation; pairwise structure.","abstract"),
     W("E-ITAGS","2026",.56,"Liu, Neville, Park, Chernova & Ravichandar, arXiv 2026","Learning and optimizing the efficacy of spatio-temporal task allocation under temporal and resource constraints","https://arxiv.org/abs/2601.02505","Learned nonlinear coalition efficacy with temporal constraints.","Additive trait aggregation; monotonicity assumed; simulation.","full text"),
     W("Liu et al.","2026",.6,"Liu, Yang, Ballotta, Li, Tang & Carli, arXiv 2026","Submodular multi-agent policy learning for online distributed task allocation in open multi-agent systems","https://www.alphaxiv.org/abs/2605.13269","Learned policies with submodular team utility, open agent sets, approximation and regret bounds.","Diminishing returns only.","abstract")]},
 E4d:{el:"E4", title:"The allocation reshapes the system", status:"thin",
   ideal:"values fixed while allocating", real:"each assignment changes the state that set the values (bottlenecks move, queues shift)",
   bullets:[`Mature in <b>operations research</b>: bottleneck identification, bucket brigades, warehouse queueing`,`Robotics has <b>isolated domain instances</b> (vehicle rebalancing, wildfire)`,`<b>Open:</b> a general MRTA formulation in which value changes with the allocation itself`],
   open:`The closed loop between allocation and system state is treated mostly in operations research or fluid models, not in MRTA formulations. Endogenous queues and coupled decisions are, however, well studied there, so the useful question is the marginal effect of a specific intervention under a stated model and objective (3.8), not whether the loop exists. Roser et al. (2002) note that sensitivity-based predictions break down once the bottleneck shifts, which is exactly where reallocation acts. None of the MRTA taxonomies checked (Korsah 2013, Nunes 2017, Aziz 2022) names this as a category (an inference from what was read).`,
   why:"pieces are mature in operations research, with isolated robotics instances, but there is no general MRTA formulation or taxonomy entry.",
   works:[W("Kuo et al.","1996",.2,"Kuo, Lim & Meerkov, Mathematical Problems in Engineering 1996","Bottlenecks in serial production lines: A system-theoretic approach","https://emis.muni.cz/journals/HOA/MPE/Volume2_3/276.html","Defines the bottleneck by sensitivity of throughput and identifies it from blockage and starvation frequencies; in a plant case study the bottleneck moves after each buffer change.","Serial lines; buffer redesign, not mobile resources; multiple-bottleneck rule heuristic.","full text"),
     W("Roser et al.","2002",.25,"Roser, Nakano & Tanaka, Winter Simulation Conference 2002","Throughput sensitivity analysis using a single simulation","https://informs-sim.org/wsc02papers/146.pdf","Throughput sensitivity, valid while the bottleneck does not shift.","Analysis tool, not allocation.","abstract"),
     W("Berman et al.","2009",.35,"Berman, Halász, Hsieh & Kumar, IEEE T-RO 2009","Optimized stochastic policies for task allocation in swarms of robots","https://repository.upenn.edu/entities/publication/9e857882-eeca-4317-b242-25a5791c1955","Transition rates drive the swarm to a target distribution.","Target given; robots do not change the task environment.","abstract"),
     W("Bucket brigades","1996",.45,"Bartholdi & Eisenstein, Operations Research 1996","A production line that balances itself","https://ideas.repec.org/a/inm/oropre/v44y1996i1p21-34.html","Allocation and line state co-evolve to a stable, near-maximal-throughput split.","One-dimensional line; human workers.","abstract"),
     W("Pavone et al.","2012",.5,"Pavone, Smith, Frazzoli & Rus, IJRR 2012","Robotic load balancing for mobility-on-demand systems","https://dspace.mit.edu/handle/1721.1/81451","Dispatching changes station imbalances; fluid-model rebalancing policy.","Fluid approximation; homogeneous; known demand.","abstract"),
     W("Haksar & Schwager","2018",.5,"Haksar & Schwager, IROS 2018","Distributed deep reinforcement learning for fighting forest fires with a network of aerial robots","https://msl.stanford.edu/bibliography/haksar_distributed_2018.html","Robot actions change the fire, which sets future values.","Domain-specific; no guarantees.","abstract"),
     W("Lamballais et al.","2022",.55,"Lamballais et al., European Journal of Operational Research 2022","Dynamic policies for resource reallocation in a robotic mobile fulfillment system with time-varying demand","https://iima.ac.in/publication/dynamic-policies-resource-reallocation-robotic-mobile-fulfillment-system-time-varying","Queueing network in an MDP reallocates robots between processes by workload.","Aggregate robot pools; two processes; OR model.","abstract")]},

 E5a:{el:"E5", title:"Long-run throughput", status:"partly",
   ideal:"finish one episode fast", real:"maximise the long-run rate for heterogeneous robots and team tasks",
   bullets:[`Throughput is central in <b>warehouse lifelong path finding</b> and robotic-cell operations research`,`Nearly all of it uses <b>identical robots</b> and <b>single-robot tasks</b>`,`<b>Open:</b> rate objectives for heterogeneous teams and multi-robot tasks, with formal guarantees`],
   open:`Zhu et al. (2025) note that prior work assumes a fixed task assigner or offline tasks, so joint online throughput-driven assignment is still emerging. The League of Robot Runners paper names online lifelong operation with frequent replanning as a core challenge. No work was found that defines long-run rate objectives for heterogeneous agents or multi-robot tasks.`,
   why:"central and benchmarked in homogeneous warehouse settings and in robotic-cell operations research; little beyond them.",
   works:[W("Berman et al.","2009",.3,"Berman, Halász, Hsieh & Kumar, IEEE T-RO 2009","Optimized stochastic policies for task allocation in swarms of robots","https://repository.upenn.edu/entities/publication/9e857882-eeca-4317-b242-25a5791c1955","Steady-state allocation of identical robots.","Optimises convergence speed, not throughput.","abstract"),
     W("Lifelong MAPD","2017",.45,"Ma, Li, Kumar & Koenig, AAMAS 2017","Lifelong multi-agent path finding for online pickup and delivery tasks","https://arxiv.org/abs/1705.10868","Online stream of tasks, complete on well-formed instances.","Homogeneous; single-agent tasks; throughput not the stated objective.","abstract"),
     W("Dawande et al.","2007",.5,"Dawande, Geismar, Sethi & Sriskandarajah, Springer 2007","Throughput optimization in robotic cells (book)","https://link.springer.com/book/10.1007/0-387-70988-6","Cyclic steady-state throughput in robotic cells, including multiple robots.","Deterministic, known cell layouts.","abstract"),
     W("Robot Runners","2024",.55,"Chan et al., ICAPS 2024 (demo)","The League of Robot Runners: Competition goals, designs, and implementation","https://idm-lab.org/bib/abstracts/papers/icaps24e.pdf","Benchmark maximising tasks completed over a horizon.","Finite horizon; homogeneous; single-agent tasks.","full text"),
     W("Zhu et al.","2025",.58,"Zhu, Xu, Guo & Lin, EPTCS 2025","The combined problem of online task assignment and lifelong path finding in logistics warehouses","https://arxiv.org/abs/2502.07332","Joint online assignment and path finding aimed at throughput.","Simulation; rule-based planner.","abstract"),
     W("GRAND","2026",.6,"Gaber, Alharbi, Gammelli & Zardini, IEEE RA-L 2026 (via DOI)","GRAND: Guidance, rebalancing, and assignment for networked dispatch in multi-agent path finding","https://arxiv.org/abs/2512.03194","Learned rebalancing plus min-cost-flow assignment; up to 10% throughput gain.","Homogeneous; single-agent tasks; no formal rate objective.","abstract")]},
 E5b:{el:"E5", title:"Risk and no-harm limits", status:"partly",
   ideal:"optimise the expected value", real:"bound the risk, and guarantee a change never makes the team worse than before",
   bullets:[`Risk measures (<b>CVaR</b>) and <b>chance constraints</b> in MRTA: several solid works`,`Risk level is usually a <b>single parameter</b> fixed by the designer`,`<b>Thin:</b> guarantees that adding a robot or reallocating does no worse than the current team`],
   open:`Risk preference is usually fixed by the designer, and Rudolph et al. (2021) argue a fixed risk attitude can itself be harmful. No MRTA work was found that guarantees a change (adding a robot, reallocating) will not do worse than the current allocation; that kind of guarantee exists only outside MRTA, in conservative bandits and safe policy improvement. Nam and Shell's exact method is practical only for small instances.`,
   why:"risk measures and chance constraints are established (partly studied); baseline-relative no-harm guarantees are thin.",
   works:[W("Ponda et al.","2012",.35,"Ponda, Johnson & How, ACC 2012","Distributed chance-constrained task allocation for autonomous multi-agent teams","https://dspace.mit.edu/handle/1721.1/81757","Chance-constrained CBBA splitting a team risk budget.","Known uncertainty; episode objective.","abstract"),
     W("Nam & Shell","2016",.4,"Nam & Shell, IEEE RA-L 2016","Analyzing the sensitivity of the optimal assignment in probabilistic multi-robot task allocation","https://cse-robotics.engr.tamu.edu/dshell/papers/ral2016_risk.pdf","Mean–CVaR costs and sensitivity to risk preference.","ST-SR-IA; small instances.","full text"),
     W("Zhou & Tokekar","2022",.45,"Zhou & Tokekar, IEEE T-RO 2022","Risk-aware submodular optimization for multirobot coordination","https://arxiv.org/abs/2003.10492","CVaR over submodular utilities with a greedy bound.","Fixed risk level; known distributions; one-shot.","abstract"),
     W("Park et al.","2023",.48,"Park, Messing, Ravichandar & Hutchinson, IROS 2023","Risk-tolerant task allocation and scheduling in heterogeneous multi-robot team","https://star-lab.cc.gatech.edu/papers/park-ritags/","Keeps the probability of missing trait requirements below a threshold, with deadlines.","Makespan objective; designer threshold; offline.","abstract"),
     W("Tihanyi et al.","2022",.5,"Tihanyi, Lu, Karaca & Kamgarpour, arXiv 2022","Multi-robot task allocation for safe planning against stochastic hazard dynamics","https://arxiv.org/abs/2103.01840","Safety via stochastic reachability with bounds for greedy and auction allocation.","Known hazard model.","abstract"),
     W("Conservative bandits","2016",.55,"Wu, Shariff, Lattimore & Szepesvári, ICML 2016","Conservative bandits","http://proceedings.mlr.press/v48/wu16.pdf","Exploration that never falls below a baseline's cumulative performance (not MRTA).","Single agent; bandit setting.","abstract")]},
 E5c:{el:"E5", title:"Several objectives and fairness", status:"partly",
   ideal:"one objective", real:"trade-offs across objectives, and fairness across robots and people",
   bullets:[`Multi-objective and <b>min-max workload</b> formulations are common`,`<b>Fairness</b> has no shared definition (worst-case task, minimum selection rate, workload balance)`,`<b>Open:</b> choosing a point on the Pareto front; fairness to humans with efficiency trade-offs`],
   open:`Multi-objective MRTA is mostly offline metaheuristic Pareto search with no principled way to choose a solution. Fairness is defined differently in each paper. Ali et al. (2022) list fairness and negotiation in human–robot allocation as needing work.`,
   why:"multi-objective and balance formulations are common; fairness, especially toward humans, is a handful of works without a shared definition.",
   works:[W("Msala et al.","2023",.3,"Msala, Hamed, Talea & Aboulfatah, J. Robotics and Control 2023","A new method for improving the fairness of multi-robot task allocation by balancing the distribution of tasks","https://journal.umy.ac.id/index.php/jrc/article/view/18650","Workload balance across robots.","Static; fairness as balance only.","abstract"),
     W("Wei et al.","2020",.4,"Wei, Ji & Cai, IEEE RA-L 2020","Particle swarm optimization for cooperative multi-robot task allocation: A multi-objective approach","https://orca.cardiff.ac.uk/id/eprint/129443/","Pareto search trading total travel against workload balance.","Offline; no rule for choosing a solution.","abstract"),
     W("Malencia et al.","2021",.48,"Malencia, Kumar, Pappas & Prorok, IEEE RA-L 2021","Fair robust assignment using redundancy","https://arxiv.org/abs/2102.06265","Fairness across tasks as minimising worst-case cost under uncertainty.","Fairness across tasks only; one-shot.","abstract"),
     W("Claure et al.","2020",.5,"Claure, Chen, Modi, Jung & Nikolaidis, arXiv 2019/2020","Multi-armed bandits with fairness constraints for distributing resources to human teammates","https://arxiv.org/abs/1907.00313","Fairness across humans as minimum selection rate; user study on trust.","Single robot allocating; simple task.","abstract")]},
 E5d:{el:"E5", title:"Human preferences define the objective", status:"thin",
   ideal:"the designer writes the objective", real:"people's preferences, possibly several and changing, shape what is optimised",
   bullets:[`Strong <b>human-factors studies</b> on authority and preferences in scheduling`,`Scattered methods <b>imitate experts</b> or <b>invert</b> a parameter from a preferred allocation`,`<b>Open:</b> interactive elicitation with guarantees; several people; preferences that change`],
   open:`Methods either study human factors empirically (Gombolay et al. 2015, 2017), imitate expert schedules (2016), or invert a single parameter class (Shi and Sukhatme 2024). No MRTA work was found on interactive preference elicitation with guarantees, combining preferences from several people, or preferences that change over time. Ali et al. (2022) argue humans may need to stay involved in allocation decisions.`,
   why:"a few strong human-factors studies and scattered inverse or imitation methods; formal treatment is sparse.",
   works:[W("Gombolay et al.","2015",.3,"Gombolay, Gutierrez, Clarke, Sturla & Shah, Autonomous Robots 2015","Decision-making authority, team efficiency and human worker satisfaction in mixed human–robot teams","https://dspace.mit.edu/handle/1721.1/103126","Studies who holds allocation authority.","Objective still efficiency.","abstract"),
     W("Apprenticeship","2016",.4,"Gombolay, Jensen, Stigile, Son & Shah, IJCAI 2016","Apprenticeship scheduling: Learning to schedule from human experts","https://www.ijcai.org/Abstract/16/122","Learns expert scheduling heuristics from demonstrations.","Imitates a policy rather than eliciting an objective.","abstract"),
     W("Gombolay et al.","2017",.42,"Gombolay, Bair, Huang & Shah, IJRR 2017","Computational design of mixed-initiative human–robot teaming that considers human factors","https://journals.sagepub.com/doi/10.1177/0278364916688255","How workflow preferences and workload should enter scheduling.","Guidelines; small lab tasks.","abstract"),
     W("Shi & Sukhatme","2024",.48,"Shi & Sukhatme, arXiv 2024","Inverse risk-sensitive multi-robot task allocation","https://arxiv.org/abs/2406.10199","Adjusts risk parameters so the allocator reproduces a supervisor's preferred allocation.","Known greedy allocator; one preference at a time.","abstract"),
     W("REBEL","2024",.5,"Gupte et al., arXiv 2024","REBEL: Rule-based and experience-enhanced learning with LLMs for initial task allocation in multi-human multi-robot teaming","https://arxiv.org/abs/2409.16266","LLM-based initial allocation aligned with user preferences.","Initial allocation only; no guarantees.","abstract")]},

 E6a:{el:"E6", title:"Partial, local observation", status:"partly",
   ideal:"the allocator sees the global state", real:"each robot sees only its surroundings and must infer team and task state",
   bullets:[`Swarm and multi-agent RL work on <b>local observation</b> is common`,`Almost all of it is <b>homogeneous</b>, without guarantees, or relies on <b>centralised training</b>`,`<b>Open:</b> bounding the loss from inferring team state from one robot's own view`],
   open:`Learned methods still use a centralised critic or global state during training; game-theoretic and swarm methods assume homogeneous robots and simple tasks. Mendoza et al. (2026) list guarantees, heterogeneity, time-varying topologies and multi-robot tasks as future work. No work was found that bounds the loss from estimating team or task state from a robot's egocentric view.`,
   why:"common in swarm and learning settings, but nearly always homogeneous, unguaranteed, or dependent on centralised training.",
   works:[W("Jones & Matarić","2003",.35,"Jones & Matarić, IROS 2003","Adaptive division of labor in large-scale minimalist multi-robot systems","https://robotics.usc.edu/publications/340","Each robot estimates the task mix and others' tasks from short histories and switches to match; adapts to changes in the mix.","Homogeneous; two task types; target rule fixed by design; 20 simulated robots; robot failure not tested.","full text"),
     W("Lerman et al.","2006",.4,"Lerman, Jones, Galstyan & Matarić, IJRR 2006","Analysis of dynamic task allocation in multi-robot systems","https://arxiv.org/abs/cs/0604111","Robots estimate the environment from a window of local observations; convergence time grows with window length; windows cause oscillations.","Two task types (for exposition); homogeneous; aggregate model.","full text"),
     W("Amato et al.","2015",.45,"Amato, Konidaris, Cruz, Maynor, How & Kaelbling, ICRA 2015","Planning for decentralized control of multiple robots under uncertainty","https://dspace.mit.edu/handle/1721.1/100515","Macro-action Dec-POMDP; allocation emerges from local observations.","Known model; offline; small problems.","abstract"),
     W("Lv et al.","2024",.45,"Lv, Lei & Yi, arXiv 2024","A local information aggregation based multi-agent reinforcement learning for robot swarm dynamic task allocation","https://arxiv.org/abs/2411.19526","Dec-POMDP swarm allocation aggregating neighbours' observations.","Centralised training; no guarantees.","abstract"),
     W("Bezerra et al.","2025",.5,"Bezerra, dos Santos & Park, arXiv 2025","Learning policies for dynamic coalition formation in multi-robot task allocation","https://arxiv.org/abs/2412.20397","View-range observation plus intention sharing within communication range.","Centralised critic; homogeneous.","partial full text"),
     W("Mendoza et al.","2026",.52,"Mendoza, Su, Ferguson & Sastry, arXiv 2026","Dynamic multi-robot task allocation under uncertainty and communication constraints: A game-theoretic approach","https://arxiv.org/abs/2604.11954","Local sensing radius; robots learn a task is taken only on arrival; 100 drones.","Homogeneous; single-robot tasks; no guarantees yet.","full text")]},
 E6b:{el:"E6", title:"Limited or intermittent communication", status:"well",
   ideal:"reliable, unlimited communication", real:"messages drop, links come and go, team and network must be planned together",
   bullets:[`Large literature: <b>robust auctions</b>, consensus methods, <b>rendezvous</b> scheduling`,`Analyses mostly use <b>simple loss models</b> (independent drops)`,`<b>Open:</b> realistic channels; guarantees when allocation and network are planned jointly`],
   open:`Gielis, Shankar and Prorok (2022) report a dearth of work that co-designs robots and the networks they use, and list co-design as their first open problem. Most allocation analyses use Bernoulli or two-state loss models. Guarantees under time-varying topologies are listed as future work (Mendoza et al. 2026).`,
   why:"a large literature exists; realistic channel models and guarantees for joint task–network planning are thinner.",
   works:[W("Kopeikin et al.","2011",.4,"Kopeikin, Ponda, Johnson, Toupet & How, IEEE GLOBECOM Workshops 2011","Real-time dynamic planning to maintain network connectivity in a team of unmanned air vehicles","https://dspace.mit.edu/handle/1721.1/81863","CBBA schedules relay tasks to keep the network connected.","Known range model.","abstract"),
     W("Hollinger & Singh","2012",.45,"Hollinger & Singh, IEEE T-RO 2012","Multirobot coordination with periodic connectivity: Theory and experiments","https://publications.ri.cmu.edu/multirobot-coordination-with-periodic-connectivity-theory-and-experiments","Robots reconnect at set intervals; online algorithm and hardness results.","Search and coverage, not general allocation.","abstract"),
     W("Dec-MCTS","2019",.5,"Best, Cliff, Patten, Mettu & Fitch, IJRR 2019","Dec-MCTS: Decentralized planning for multi-robot active perception","https://opus.lib.uts.edu.au/handle/10453/135053","Periodic exchange of compressed search trees tolerates degraded links.","Active perception rather than allocation.","abstract"),
     W("Otte et al.","2020",.52,"Otte, Kuhlman & Sofge, Autonomous Robots 2020","Auctions for multi-robot task allocation in communication limited environments","https://ottelab.com/html_stuff/pdf_files/otte.etal.AURO19.pdf","Compares auction types under random and bursty message loss.","Reliable auctioneer; simple loss model.","full text"),
     W("CoCoPlan","2026",.6,"Zhang, Chen, Zhu, Luo & Guo, arXiv 2026","CoCoPlan: Adaptive coordination and communication for multi-robot systems in dynamic and unknown environments","https://arxiv.org/abs/2601.10116","Plans assignment and reconnection events together; 100 robots; hardware tests.","Exponential worst case; stationary task arrivals for optimality.","full text")]},
 E6c:{el:"E6", title:"Uncertain self-knowledge", status:"partly",
   ideal:"each robot knows its own cost exactly", real:"robots estimate their own costs, possibly with bias, and must calibrate",
   bullets:[`Robust and stochastic allocation treats costs as <b>known distributions or intervals</b>`,`A few methods <b>update</b> robots' estimates from execution, centrally`,`<b>Open:</b> miscalibrated self-estimates; how biased bids propagate through auctions`],
   open:`Most methods treat uncertainty as an exogenous known distribution or interval rather than as a robot's biased estimate of itself. Online self-estimation (Emam et al.; Lin and Tron) is centralised with no calibration analysis. No work was found on how over- or under-confident bids propagate through auctions.`,
   why:"robust and stochastic allocation is established; robots learning or calibrating their own estimates during allocation is thin.",
   works:[W("Liu & Shell","2010",.3,"Liu & Shell, RSS 2010","Assessing optimal assignment under uncertainty: An interval-based algorithm","https://m.roboticsproceedings.org/rss06/p16.html","How far each utility can deviate before the optimal assignment changes.","Centralised ST-SR-IA; interval uncertainty.","abstract"),
     W("Ponda et al.","2012",.35,"Ponda, Johnson & How, ACC 2012","Distributed chance-constrained task allocation for autonomous multi-agent teams","https://dspace.mit.edu/handle/1721.1/81757","Stochastic task scores in distributed allocation.","Known distributions; no self-learning.","abstract"),
     W("Fu et al.","2021",.4,"Fu et al., arXiv 2021","Robust task scheduling for heterogeneous robot teams under capability uncertainty","https://arxiv.org/abs/2106.12111","Capabilities as random variables with CVaR-robust scheduling.","Known distributions; centralised.","abstract"),
     W("Messing et al.","2023",.45,"Messing et al., RSS 2023","A sampling-based approach for heterogeneous coalition scheduling with temporal uncertainty","https://www.roboticsproceedings.org/rss19/p107.html","Uncertain durations with a probabilistic guarantee, no distributional assumption.","Centralised, offline; durations only.","abstract"),

 E6d:{el:"E6", title:"Information costs time to acquire", status:"thin",
   ideal:"information is free and immediate", real:"observing takes time while the team works; when to stop observing is a decision",
   bullets:[`Value-of-information theory exists <b>outside allocation</b> (sequential design, active testing)`,`In teamwork it appears for <b>single ad hoc agents</b> in small, fully observable domains`,`<b>Open:</b> "spend time observing" as an explicit, costed action in multi-robot allocation`],
   open:`Value-of-information reasoning exists outside allocation (Chernoff 1959; active hypothesis testing) or for single ad hoc agents in small domains (Mirsky et al. 2020; Macke et al. 2021, whose authors state limits to simple, finite environments). MRTA papers touch the trade-off only partly: bandit exploration (Singh et al. 2023), an exogenous confirmation delay (Rossano et al. 2025), or a fixed gather-then-act order. Liang et al. (2026) make exploring an explicit, costed allocation choice, but without a value-of-information or stopping analysis. No work was found that treats observation time as an explicit, costed action in multi-robot allocation with a value-of-information or stopping-rule analysis.`,
   why:"a handful of recent, mostly preprint papers touch it implicitly; none frames observe-versus-act in MRTA with value-of-information or stopping theory.",
   works:[W("Chernoff","1959",.2,"Chernoff, Annals of Mathematical Statistics 1959 (verified via 1992 reprint)","Sequential design of experiments","https://link.springer.com/chapter/10.1007/978-1-4612-4380-9_27","Choosing which experiment to run and when to stop before deciding.","Single decision maker; not robotics.","reprint metadata"),
     W("CMTAB","2023",.3,"Singh, Srikanthan, Mallampati & Ravichandar, RSS 2023","Concurrent constrained optimization of unknown rewards for multi-robot task allocation","https://roboticsproceedings.org/rss19/p108.html","Explores unknown rewards through repeated allocations.","No separate observe actions; stationary rewards.","abstract"),
     W("Mirsky et al.","2020",.4,"Mirsky, Macke, Wang, Yedidsion & Stone, IJCAI 2020","A penny for your thoughts: The value of communication in ad hoc teamwork","https://www.ijcai.org/proceedings/2020/36","An ad hoc agent decides when to ask a teammate.","Single ad hoc agent; known set of possible goals; shared protocol with truthful answers; static, deterministic domain.","full text"),
     W("Macke et al.","2021",.45,"Macke, Mirsky & Stone, AAAI 2021","Expected value of communication for planning in ad hoc teamwork","https://ojs.aaai.org/index.php/AAAI/article/view/17346","Costly query versus inferring a teammate's goal from observation.","Static, deterministic, fully observable; small domains.","full text"),
     W("Rossano et al.","2025",.5,"Rossano, Lim & How, arXiv 2025","Uncertainty-aware multi-robot task allocation with strongly coupled inter-robot rewards","https://arxiv.org/abs/2509.22469","Whether a task needs an extra capability is revealed after a known delay on site, or estimated from slow progress; a central auction pre-positions support robots.","Revelation is exogenous, not a chosen observation; fixed team; simulation.","full text"),
     W("Liang et al.","2026",.52,"Liang, Chan, Liu, Shi & Fang, arXiv 2026","Min-max regret task allocation and planning of heterogeneous multi-robot system in partially known environments","https://arxiv.org/abs/2607.13403","Spare robots can be sent to explore uncertain regions, with the cost counted in makespan; regret-based search.","Centralised; observation perfect on arrival; worst-case rather than value-of-information view; no stopping rule.","full text")]},
 E6e:{el:"E6", title:"Teammates share only a minimal interface", status:"thin",
   ideal:"all robots run a jointly designed protocol and coordination policy", real:"robots from different builders share at most a minimal interface, not a jointly designed policy",
   bullets:[`Every classical agreement method <b>assumes</b> a shared format, scoring rule and tie-breaking (2.3.11)`,`Zero-shot coordination and ad hoc teamwork relax it <b>outside robotics</b>, sharing other things instead (4.7.1)`,`<b>Open:</b> allocation among robots that share an interface but not a jointly designed policy`],
   open:`This sub-axis was added after Part 3's first pass. Part 2 showed that auctions, consensus, CBBA and distributed optimisation all rely on robots agreeing in advance on message formats, scoring and tie-breaking (2.3.11), and that self-organisation is the one classical family that coordinates through the environment instead (2.4.6). None of the eleven audit sources raised the assumption, which suggests how deeply it is taken for granted. Robot work that meets unknown teammates either mandates a shared message packet (the RoboCup drop-in competition) or runs every robot on the same language model or dialogue protocol (RoCo, SMART-LLM). Coordination without a shared protocol is studied in game and human–AI benchmarks (other-play, off-belief learning, fictitious co-play, ProAgent), and ad hoc teamwork often avoids communication altogether (PLASTIC). Note the distinction drawn in 4.7: sharing an interface (task identifiers, status, reservations) is not the same as sharing a jointly designed team policy. This review's search did not find task allocation among robots that share only such a minimal interface. The pairwise checks of 3.15 predate this sub-axis and do not cover it.`,
   why:"MRTA work found either assumes a common protocol or avoids communication; protocol-free coordination is studied in games and human–AI benchmarks, not for robot task allocation (see 4.7).",
   works:[W("CBBA","2009",.1,"Choi, Brunet & How, IEEE T-RO 2009","Consensus-based decentralized auctions for robust task allocation","https://dspace.mit.edu/handle/1721.1/52330","Robots agree on winning bids by exchanging them with neighbours.","All robots run the same algorithm, message format and scoring scheme.","full text"),
     W("RoCo","2024",.3,"Mandi, Jain & Song, ICRA 2024","RoCo: Dialectic multi-robot collaboration with large language models","https://arxiv.org/abs/2307.04738","Robot arms negotiate subtasks in natural language.","Every robot is the same LLM with a designed dialogue protocol; central motion planner.","full text"),
     W("Drop-in SPL","2017",.38,"Genter, Laue & Stone, JAAMAS 2017","Three years of the RoboCup Standard Platform League drop-in player competition","https://www.cs.utexas.edu/~AustinVilla/papers/JAAMAS16-katie.pdf","Physical robots from 30 organisations play with teammates they have never met.","A mandated standard message packet; soccer roles, not general allocation.","full text (extended abstract)"),
     W("PLASTIC","2017",.5,"Barrett, Rosenfeld, Kraus & Stone, Artificial Intelligence 2017","Making friends on the fly: Cooperating with new teammates","https://www.cs.utexas.edu/~AustinVilla/papers/AIJ16-Barrett.pdf","Cooperates with unseen teammates by modelling them, without communication.","No communication at all; stationary teammates; simulation; low-level actions.","full text"),
     W("Other-play","2020",.6,"Hu, Lerer, Peysakhovich & Foerster, ICML 2020","\"Other-play\" for zero-shot coordination","https://arxiv.org/abs/2003.02979","Coordinates with independently trained partners without arbitrary conventions.","Common knowledge of the game and its symmetries; same learning rule; card game.","full text"),
     W("ProAgent","2024",.62,"Zhang et al., AAAI 2024","ProAgent: Building proactive cooperative agents with large language models","https://arxiv.org/abs/2308.11339","An LLM agent infers teammates' intentions from observation and adapts.","Hand-written knowledge library; two-player cooking game; not robots.","full text")]},
});

/* ---------- Part 3: E7–E10 ---------- */
Object.assign(AX, {
 E7:{name:"Control", classical:"one designer controls every robot, and all robots are cooperative and truthful", subs:["E7a","E7b","E7c","E7d"],
   summary:`<p>Every E7 sub-axis has a strong theoretical base outside MRTA: ad hoc teamwork for partial control, learning-aware multi-agent learning for adaptive teammates, algorithmic mechanism design for strategic agents, and levels-of-automation research for human authority. Inside allocation, each of these is thin or early. Adaptive teammates are the thinnest: in allocation work, "adaptation" means every robot running the designer's own rule.</p>
<p><b>A pattern across E7:</b> robotics has engineered the practical side (multi-vendor fleet adapters, human override layers, truthful path-finding mechanisms) without the allocation-level formulation, while the formal side lives in multi-agent research without robots.</p>`},
 E8:{name:"Timing", classical:"the allocation is solved offline, with no time limit, before execution", subs:["E8a","E8b","E8c"],
   summary:`<p>All three E8 sub-axes are partly studied, each with a mature core and a thin edge. Fast and anytime solvers exist but only for small teams or simple constraints; rolling-horizon and online assignment are mature in lifelong path finding, but when to reallocate and what switching costs is scattered; very large scale is shown for simple assignment, not for time windows, coalitions or heterogeneity.</p>
<p><b>A pattern across E8:</b> speed is bought by dropping structure. No work was found that bounds how much plan quality is lost to decision latency while robots keep moving.</p>`},
 E9:{name:"Execution", classical:"any allocation the allocator chooses can be executed by the layers below it", subs:["E9a","E9b","E9c"],
   summary:`<p>E9 was raised by only one audit source, yet the literature check finds substantial work, which shows the audit measured attention in surveys rather than activity. Joint assignment and path finding is well studied within the discrete grid abstraction. Multi-robot task and motion planning is active but small-scale and offline. Robust execution exists at the path level and event-triggered repair at the allocation level, but the two are not connected.</p>
<p><b>A pattern across E9:</b> the coupling between allocation and execution is studied one layer pair at a time, open-loop, and in idealised geometry. Feeding low-level execution deviation back into allocation is rare.</p>`},
 E10:{name:"System design", classical:"the fleet, the layout and the environment are fixed and given; only the allocation is designed", subs:["E10a","E10b","E10c"],
   summary:`<p>E10 was added by the audit (3.4.2) and the literature check confirms it is a real research area, mostly outside classical MRTA. Fleet sizing is mature for mobility-on-demand; heterogeneous robot-team composition designed with allocation has a few recent papers. Layout design has an operations-research evaluation literature and an active path-finding line since 2023. Co-design of fleet, environment and allocation policy together is thin.</p>
<p><b>A pattern across E10:</b> design is done offline for a known task set, with the allocation or path-finding policy held fixed inside the loop. Robustness of a design to uncertain task streams, and the split between design-time and run-time decisions, were not found.</p>`},
});

 E7c:{el:"E7", title:"Self-interested or strategic agents", status:"partly",

 E8b:{el:"E8", title:"Decide while executing", status:"partly",

 E10c:{el:"E10", title:"Co-design of fleet, layout and policy", status:"thin",
