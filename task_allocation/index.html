 title: { sub:"From a useful assignment model to a defensible research question.",
   notesTitle:"What this deck is for",
   notes:`<p>Task allocation asks how a team should distribute work. In a running system that decision also depends on what the robots know, what they may change, and what is already being executed. The challenge is to identify which of these features matters in a particular setting, then choose an appropriate model.</p>
<div class="key"><span class="lbl">The central argument</span>A fixed robot–task score table is a useful starting point. It is not a definition of the entire MRTA literature. Extensions involving learning, communication, planning and execution already exist; a credible contribution must specify the additional assumption or combination it addresses.</div>
<ol><li><b>Part 1 · Define the problem.</b> Separate assignment, planning, execution and team openness.</li>
<li><b>Part 2 · Locate existing methods.</b> Compare families by their assumptions, without treating them as mutually exclusive.</li>
<li><b>Part 3 · Assess the evidence.</b> Use ten modelling dimensions to formulate testable questions, rather than count apparently empty cells.</li>
<li><b>Part 4 · Build an approach.</b> Connect six useful lenses to execution, symbolic planning and fair evaluation.</li></ol>
<p>This is a narrative review, not a systematic review or an exhaustive novelty assessment. Earlier material (coverage maps, search snapshots, deep dives) is kept as supporting pages under the relevant sections, labelled with the depth of evidence behind it.</p>` },

 decide: { eyebrow:"Part 1 · Define the problem", title:"Define the decision before choosing the solver", fig:"rv_decisions", tag:"reference case",
   bullets:[`Four coupled decisions: <b>decomposition</b>, <b>allocation</b>, <b>scheduling</b>, <b>motion and manipulation</b>`,`Linear assignment is a <b>reference case</b>: defined work, meaningful costs, no mutual invalidation`,`Precedence, coalitions, shared resources and uncertainty <b>change the formulation</b>`,`Complexity depends on the <b>precise class and encoding</b>, not on a taxonomy label`],
   notesTitle:"“Who does what?” is necessary, but usually not sufficient",
   notes:`<p>Distinguish four coupled decisions: <b>decomposition</b> turns goals into tasks; <b>allocation</b> assigns responsibility; <b>scheduling</b> orders and times the work; <b>motion and manipulation planning</b> determine how to execute it. An application may solve these jointly, alternate between them, or accept an approximate interface.</p>
<p>A simple reference case uses known costs <code>c_ij</code> and binary assignments <code>x_ij</code>. Minimising <code>Σ c_ij x_ij</code> under one-to-one constraints gives linear assignment (1.1.4 and its worked example). This model is appropriate when the work is already defined, costs are meaningful and the chosen assignments do not invalidate one another.</p>
<p>Temporal precedence, coalitions, shared resources, uncertain outcomes and route-dependent costs change the formulation. General versions can be computationally hard, but "everything except one-to-one assignment is NP-hard" is too broad: Gerkey and Matarić prove hardness for their formulations of each class (1.1.2), and other encodings or special structures can behave differently.</p>
<div class="key"><span class="lbl">Running example</span>A warehouse team transports items through a shared aisle to a packing station. A new robot arrives. If tasks, capabilities and routes are known and reassignment is authorised, this may be an ordinary rescheduling problem. If the newcomer cannot inspect the team's queue or change its commitments, a different decision problem arises, even with the same physical robots.</div>
<p>The supporting pages keep the vocabulary used throughout: the five questions (1.1.1), the Gerkey–Matarić and iTax taxonomies (1.1.2–1.1.3), the reference table and a worked example (1.1.4), and where the reference table falls short (1.1.5).</p>${RVNOTE}`,
   refs:[] },

 terms: { kind:"table", eyebrow:"Part 1 · Define the problem", title:"Four terms that should not be conflated", tag:"open · ad hoc · replanning · decentralised",
   table:{ head:["Term","What changes?","What does not follow automatically?"],
     rows:[["Open team","membership can change during operation","a newcomer need not have unknown capabilities or an incompatible policy"],
           ["Ad hoc teamwork","agents cooperate without having jointly designed their coordination strategy in advance","zero communication, zero shared semantics, or the absence of an incumbent dispatcher"],
           ["Online replanning / plan repair","a decision or plan is revised as state, information or constraints change; repair reuses an existing plan","unfamiliar teammates; a reactive policy can adapt without an explicit plan"],
           ["Decentralised decision making","information or decisions are distributed across agents","no shared protocol or known models; optimisation itself need not be centralised"]],
     hlCol:2, caption:"“Ad hoc replanning” is not by itself an unoccupied category (OPAT, PLASTIC)." },
   notesTitle:"Open membership, ad hoc teamwork, replanning and decentralisation are different properties",
   notes:`<p>These four terms are often used interchangeably. Each describes a different property, and none implies the others.</p>
<p><b>Ad hoc planners already plan repeatedly while executing.</b> OPAT (Wu, Zilberstein &amp; Chen, 2011) explicitly studies online planning for ad hoc teams, and PLASTIC (Barrett et al., 2017) adapts behaviour using models of past teammates (4.3.2). Therefore "ad hoc replanning" is not by itself an unoccupied category. A proposed contribution must identify an additional difficulty, such as costly information, persistent commitments or restricted intervention.</p>
<p><b>Distributed optimisation is a counterexample</b> to "optimisation requires central control": consensus ADMM (Shorinwa et al., 2023) and the distributed auction, simplex and Hungarian methods of 2.3.7 solve assignment problems without a central solver.</p>${RVNOTE}`,
   refs:[RVREF.opat, RVREF.plastic, RVREF.stone, RVREF.admm] },

 contract: { kind:"table", eyebrow:"Part 1 · Define the problem", title:"State the information and authority contract", tag:"warehouse example",
   table:{ head:["Specify","A concrete example"],
     rows:[["Shared semantics","task identifiers, units, capability descriptors, map coordinates and message meanings"],
           ["Initially available information","public goal and map; partial view of work queues; advertised rather than perfectly known capability"],

           ["Authority","self-assignment only; proposals subject to acceptance; or permission to reassign the whole team"],
           ["Execution contract","which actions may be interrupted, which reservations expire, how a handoff becomes binding"],
           ["Fallback","a defined incumbent policy and a feasible newcomer behaviour while information or agreement is pending"]],
     hlCol:1, caption:"Where computation runs is separate from what is known and who can be controlled." },
   notesTitle:"Define the interface before choosing an algorithm",
   notes:`<p>For the warehouse example, define an explicit interface before selecting a centralised or distributed algorithm. The incumbent team can have its own dispatcher while the newcomer controls only its own actions. Whether that setting is ad hoc depends on what coordination was established beforehand, not on the number of servers.</p>
<div class="key"><span class="lbl">Do not manufacture difficulty</span>Do not create a problem by withholding free information. If the incumbent can cheaply transmit an adequate schedule, that is a strong baseline. If sharing is limited, motivate the limit by the deployment and charge its actual cost.</div>
<p>The contract also fixes what a fair comparison looks like later (4.9): methods should differ in algorithm, not in the information or authority they are granted.</p>${RVNOTE}`,

 families: { kind:"table", eyebrow:"Part 2 · Locate existing methods", title:"Five families, overlapping roles", tag:"not a partition",
   table:{ dense:true, head:["Family","Useful contribution","Questions to ask of a particular method"],
     rows:[["Optimisation and search","explicit objectives, constraints, schedules, sometimes bounds","which quantities are known? stochastic or robust? execution and solver latency?"],
           ["Markets, consensus and distributed optimisation","coordinate bids or local decisions across agents","which protocol, connectivity, truthfulness and convergence assumptions?"],
           ["Self-organising allocation","local rules react to demand with little negotiation","how are thresholds set? oscillation, congestion, unfairness?"],
           ["Learned policies and teammate models","amortise decisions; represent uncertainty or interaction","which training and teammate diversity support generalisation? what shifts at deployment?"],
           ["Language-based and hybrid planners","interpret instructions; propose decompositions or messages","how are grounding, feasibility, permissions and feedback checked?"]],
     hlCol:2, caption:"Compare concrete algorithms and their assumptions, not whole families." },
   notesTitle:"Organisational categories, not a partition",
   notes:`<p>These are organisational categories, not a partition. An auction can call a motion planner to compute bids; a learned model can supply costs to an optimiser; a language model can propose an HTN or symbolic plan that a separate checker validates.</p>
<p>Likewise, centralised computation does not imply complete information, and distributed computation does not imply unknown teammates. Claims such as "optimisation assumes a static team" or "learning alone handles uncertainty" obscure existing hybrid approaches.</p>
<p>The pages 2.2–2.6 go through each family with formulations, guarantees and examples; 2.1.1 keeps the earlier two-axis map as a rough orientation.</p>${RVNOTE}`,

 prior: { kind:"table", eyebrow:"Part 2 · Locate existing methods", title:"What the existing literature already changes", tag:"counterexamples",
   table:{ head:["Claim to avoid","Counterexample","What it shows"],
     rows:[["capability is a fixed input","Emam et al. 2020","allocation adapted from observed task progress and evolving capability"],
           ["utility is a fixed input","CMTAB (Singh et al. 2023)","online coalition optimisation under unknown task rewards"],
           ["ad hoc teams plan once","OPAT (2011); PLASTIC (2017)","online planning and model reuse with unfamiliar teammates"],
           ["communication is not a decision","Macke, Mirsky & Stone 2021","cost-sensitive choice between querying and inferring"],
           ["allocation and execution are separate","D-ITAGS (2022)","repair of interleaved allocation, scheduling and motion"],
           ["partial plans and commitments are new","SharedPlans (Grosz & Kraus 1996)","collaborative activity with partial knowledge and commitments"]],
     hlCol:2, caption:"These do not solve every joint setting; they rule out blanket claims." },
   notesTitle:"Acknowledge counterexamples to the fixed-table story",
   notes:`<ul><li><b>Capability can be updated from execution.</b> Emam et al. adapt allocation using observed task progress and evolving capabilities.</li>
<li><b>Allocation can learn an unknown reward.</b> CMTAB studies online coalition optimisation under unknown task rewards and resource constraints.</li>
<li><b>Planning can already be online and ad hoc.</b> OPAT repeatedly plans with unfamiliar teammates; PLASTIC uses learned teammate models.</li>
<li><b>Communication can itself be a decision.</b> Macke et al. study the cost-sensitive choice of querying teammates versus inferring their plans from observation.</li>
<li><b>Allocation and execution can be coupled.</b> D-ITAGS repairs an interleaved allocation, scheduling and motion-planning solution after changes.</li>
<li><b>Partial plans and commitments have a history.</b> SharedPlans formalises collaborative activity with partial knowledge and commitments; these ideas were not created by recent language models.</li></ul>
<p>These examples do not solve every joint setting. They do invalidate a blanket claim that all methods receive capability and utility as fixed inputs, or that online repair, decomposition and communication remain untouched. Part 3 therefore asks <i>under which precise assumptions</i> existing approaches cease to answer the question. The earlier five-question summary is kept as 2.7.1 with these corrections.</p>${RVNOTE}`,

 audit: { eyebrow:"Part 3 · Assess the evidence", title:"From a coverage map to a research question", fig:"rv_method", tag:"method",
   bullets:[`E1–E10 are a <b>practical checklist</b>, not independent coordinates or a unique derivation`,`For each question: setting → nearest work → <b>actual evidence</b> → remaining question → <b>disconfirming result</b>`,`Evidence: <b>demonstrated</b> in a setting · <b>related</b> · <b>unresolved</b> in this review`,`Earlier counts and ratings are a <b>search snapshot</b>, not coverage statistics`],
   notesTitle:"A taxonomy organises evidence; it does not prove that a problem is new",
   notes:`<p>Retain the E1–E10 labels as a practical checklist. They describe useful aspects of a team decision problem, but are neither independent coordinates nor a uniquely complete derivation. Timing and physical execution can be included in an expanded state, action or transition model; separating them here makes their assumptions visible.</p>
<ol><li><b>Specify the setting.</b> State the task process, uncertainty, information, authority and execution constraints.</li>
<li><b>Identify nearest work.</b> Search both MRTA and adjacent fields using alternative names for the same mechanism.</li>
<li><b>Record the actual evidence.</b> Separate a paper's demonstrated setting from an abstract-level relevance judgement and an unanswered search.</li>
<li><b>Formulate the remaining question.</b> Name the additional assumption and explain why it changes the decision.</li>
<li><b>Define a disconfirming result.</b> State when an existing method or a simple interface would already be sufficient.</li></ol>
<p><b>Evidence vocabulary.</b> "Demonstrated in this setting" needs a concrete method and experiment or theorem. "Related evidence" identifies a useful connection with different assumptions. "Unresolved in this review" describes the limits of the search, not the absence of a literature.</p>
<div class="key"><span class="lbl">About the earlier material</span>The original pair counts, maturity labels and tiered gap list belong to a search snapshot (October 2026). The sub-axis pages and pair checks are kept under 3.3–3.7 because their representative works and "still keeps" notes remain useful; their status labels are marked as snapshots and are not used as updated coverage statistics or as a ranking. A later paper may invalidate a count without changing the taxonomy.</div>${RVNOTE}`,
   refs:[] },

 dims: { kind:"table", eyebrow:"Part 3 · Assess the evidence", title:"Ten dimensions, one coherent checklist", tag:"E1–E10",
   table:{ dense:true, head:["Dimension","What must be stated?","A useful stress test"],
     rows:[["E1 · Agents","membership, heterogeneity, humans, prior familiarity","known newcomer vs unfamiliar policy; entry vs failure"],
           ["E2 · Tasks","arrival, discovery, decomposition, requirements","streaming known tasks vs tasks whose requirements must be learned"],
           ["E3 · Dynamics / capability","unknown parameters, drift, failures, environment effects","poor capability vs congestion vs a difficult task"],
           ["E4 · Interaction","precedence, shared resources, coalition effects, feedback","does helping one station overload another?"],
           ["E5 · Objective","finite completion, throughput, risk, fairness, preferences","does a mean improvement conceal unacceptable tail loss?"],
           ["E6 · Information","observability, communication, self-knowledge, acquisition cost","can a query replace prolonged observation?"],
           ["E7 · Authority and behaviour","whose policy is controlled; adaptation, incentives, human vetoes","can the proposed plan actually be imposed?"],
           ["E8 · Decision timing","deadlines, compute budgets, concurrency, scale","is the returned plan already stale?"],

   notesTitle:"How the dimensions fit together",
   notes:`<p>E1–E4 describe much of the system; E5 defines success; E6–E7 constrain which decisions are possible; E8–E9 connect decisions to time and execution; E10 asks which system properties are design variables. This grouping is explanatory, not a formal separation: communication takes time, motion creates interaction, and the objective changes which uncertainty matters.</p>
<p>The supporting pages keep how the dimensions were first derived (3.2.1–3.2.4) and the completeness audit against outside taxonomies and surveys (3.2.5–3.2.7). The audit showed that every item raised by eleven, and later fourteen, outside sources could be expressed with these dimensions; it does not prove completeness, and one omission (a minimal shared interface, E6e) was found afterwards.</p>${RVNOTE}`,
   refs:[] },

 e123: { eyebrow:"Part 3 · Assess the evidence", title:"Agents, tasks and capability: identify what is unknown", fig:"rv_confound", tag:"E1–E3",
   bullets:[`<b>E1</b> · Joining is not the same as being unknown`,`<b>E2</b> · Task arrival is not discovery or decomposition`,`<b>E3</b> · Capability is conditional on task and environment`,`Ask what is <b>identifiable</b> from the allowed probes`],
   notesTitle:"Changes to the roster, the work and the model create different problems",
   notes:`<p><b>E1 · Joining is not the same as being unknown.</b> Separate unannounced entry, unannounced departure, unfamiliar behaviour, heterogeneous capability and human participation. A known robot rejoining after charging may only require schedule repair. An unfamiliar collaborator may require teammate modelling even in a fixed-size team. Test these independently before claiming a combined open-team problem.</p>
<p><b>E2 · Task arrival is not task discovery or decomposition.</b> An incoming delivery request may have a known schema; discovering a spill creates work that was not on the queue; decomposing "prepare the room" creates subtasks and ordering constraints. Unknown requirements add another uncertainty: which resources will succeed? Routing, symbolic planning and online learning provide relevant predecessors. Decomposition predates language-model planners.</p>
<p><b>E3 · Capability is conditional on the task and environment.</b> A slow completion can reflect a weak robot, a congested aisle or a hidden prerequisite (figure). Learning a single robot score may confound these causes. Emam et al. and CMTAB establish that adaptation from outcomes is relevant prior art; the question is which latent causes and feedback a setting requires.</p>
<div class="key"><span class="lbl">Candidate question</span>Can a newcomer estimate its useful contribution when task requirements and teammate behaviour are only partly known? To make this specific, define the permitted probes, identifiability assumptions and costs. If the uncertainty is not identifiable, the method should maintain alternatives or choose robust actions instead of reporting unjustified certainty.</div>
<p>The sub-axis pages 3.3.1–3.3.12 keep the representative works found in the October 2026 search, each with what it still keeps; their status labels are search snapshots.</p>${RVNOTE}`,
   refs:[RVREF.emam, RVREF.cmtab] },

 e45: { eyebrow:"Part 3 · Assess the evidence", title:"Interaction and objectives: define useful help", fig:"rv_marginal", tag:"E4–E5",
   bullets:[`<b>E4</b> · Intervention changes the system; coupled queues are <b>already studied</b>`,`The key quantity: the <b>marginal effect</b> of an intervention, under a stated horizon and baseline`,`<b>E5</b> · Choose the objective before the metric`,`Physical safety, performance conservatism and fairness are <b>three different questions</b>`],
   notesTitle:"Being busy, completing more local tasks and improving the team are different outcomes",
   notes:`<p><b>E4 · Intervention changes the system.</b> In the warehouse, sending another robot upstream may increase the downstream queue without increasing departures (figure). Precedence, shared chargers, aisle occupancy and coalition synergies already motivate coupled scheduling and queueing models. "Allocation reshapes the system" is therefore a useful modelling warning, not sufficient evidence of a new research gap.</p>
<p>The key quantity is the marginal effect of an intervention under a stated horizon and baseline. A long queue is evidence about demand and service, not proof that adding a robot there helps. Prefer controlled comparisons or an explicit predictive model over interpreting correlation as causal benefit. Kuo, Lim and Meerkov's bottleneck definition (4.2.3) is exactly such a marginal quantity, ∂PR/∂p<sub>i</sub>, for serial lines.</p>
<p><b>E5 · Choose the objective before the metric.</b> For a finite batch, remaining completion time may be appropriate. For continuing arrivals, throughput, queue growth and response-time tails matter. Multi-objective trade-offs, fairness and human preferences require an aggregation rule or constraints. None is represented adequately by an unspecified "utility".</p>
<div class="key"><span class="lbl">Three different safety questions</span>Physical safety restricts trajectories or states. Performance conservatism limits loss relative to a reference policy. Fairness limits how outcomes are distributed. One guarantee does not imply the other two.</div>
<p>When comparing against the pre-entry team, include travel, interference, failed handoffs and transition delay. A newcomer that performs well on its own task may still hurt the overall objective.</p>${RVNOTE}`,
   refs:[] },

 e67: { eyebrow:"Part 3 · Assess the evidence", title:"Information and authority: specify the feasible decisions", fig:"rv_contract", tag:"E6–E7",
   bullets:[`<b>E6</b> · Information has content, cost and timing`,`Asking versus watching is <b>already studied</b> in ad hoc planning; compare against it`,`<b>E7</b> · Control is not the same as cooperation`,`Uncertainty can be reduced; <b>authority cannot be assumed</b> into existence`],
   notesTitle:"Specify what an algorithm can observe and change",
   notes:`<p><b>E6 · Information has content, cost and timing.</b> Distinguish hidden state, unknown teammate policy, uncertain own capability and unavailable task requirements. An observation, a query and a productive trial reveal different information. Their usefulness depends on whether they change an actionable decision before the information becomes stale.</p>
<p>Communication-sensitive ad hoc planning already compares asking with watching (Macke et al., 2021; 4.4.4). A new method should be compared with such work, not only with a planner that receives no updates. Also account for query refusal, grounding errors and model mismatch when they are part of the actual deployment.</p>
<p><b>E7 · Control is not the same as cooperation.</b> A shared objective does not imply that one planner can replace every robot's policy. Incumbents may accept proposals, refuse interruptions, adapt to the newcomer or follow human instructions. Strategic behaviour introduces incentive questions beyond ordinary cooperative uncertainty.</p>
<div class="key"><span class="lbl">A precise combination</span>A newcomer controls only its own actions, sees a partial queue and can request a commitment summary at a cost. Existing tasks may not be interrupted. This is more informative than "decentralised ad hoc allocation": it specifies what an algorithm can observe and change.</div>
<p>Do not label a policy incapable because it lacks information or authority granted to its competitor. Change one condition at a time, or identify the result as a comparison between interfaces rather than algorithms.</p>${RVNOTE}`,
   refs:[RVREF.macke] },

 e8910: { eyebrow:"Part 3 · Assess the evidence", title:"Timing, execution and system design", fig:"rv_loop", tag:"E8–E10",
   bullets:[`<b>E8</b> · The solve is part of the timeline`,`<b>E9</b> · Execution can change the allocation decision`,`<b>E10</b> · The system itself may be a decision variable`,`Closed loop: observe → update → choose → <b>agree and activate</b> → execute → revise`],
   notesTitle:"The plan must remain meaningful while the world keeps moving",
   notes:`<p><b>E8 · The solve is part of the timeline.</b> State whether robots continue working during inference, communication and optimisation. A plan computed from an old snapshot needs an update, a validity check or an agreed future activation point. A seconds-long budget can be ample for some instances and unusable for others; scale alone does not establish either claim.</p>
<p><b>E9 · Execution can change the allocation decision.</b> Paths, manipulation feasibility, delays and handoffs are more than final checks. An infeasible route can require a different task owner; a non-interruptible action can prevent immediate reassignment. Task-and-motion planning and dynamic interleaved methods (D-ITAGS) already address parts of this loop. A proposed extension should identify which execution contract or uncertainty they do not cover.</p>
<p><b>E10 · The system itself may be a decision variable.</b> Fleet size, capability mix and layout shape which allocations are possible. Separate design-time investment from runtime adaptation and compare total cost. If a second packing station removes the bottleneck, that is a useful system-design finding, not a failure of the analysis.</p>
<p>The full closed loop is: <b>observe → update state or belief → choose a feasible intervention → agree and activate → execute and monitor → revise</b>. Not every implementation needs every stage, but omitted stages imply assumptions that should be explicit.</p>${RVNOTE}`,
   refs:[RVREF.ditags, RVREF.tamp] },

 cand: { kind:"table", eyebrow:"Part 3 · Assess the evidence", title:"Candidate questions, with ways to reject them", tag:"replaces the gap ranking",
   table:{ dense:true, xdense:true, head:["Candidate question","Nearest starting points","What would weaken the motivation?"],
     rows:[["When should a newcomer query, observe or act under limited authority and existing commitments?","online ad hoc teamwork, value of communication, teammate models, SharedPlans","a cheap status message plus plan repair does equally well"],
           ["Can intervention improve a coupled flow without unacceptable transition loss?","queueing control, bottleneck analysis, conservative learning","known-model queue control or static staffing already captures it"],
           ["Which uncertainty deserves a productive probe?","adaptive and bandit allocation, belief-space planning","declarations or passive observation are accurate enough, cheaper"],
           ["When should a team repair a plan versus reopen the full decision?","allocation–schedule–motion repair, online search","event-triggered replanning meets deadlines at similar transition cost"]],
     hlCol:2, caption:"Promising means consequential and testable, not merely sparsely cited in one review." },
   notesTitle:"Candidate combinations, not certified gaps",
   notes:`<p>These are <b>candidate combinations</b>, not certified gaps. Each needs a targeted search, a formal interface and a strong baseline. A useful next experiment varies one difficulty at a time (information cost, teammate mismatch, commitment duration or coupling strength) before combining them.</p>
<p>This replaces the earlier tiered gap list, whose scores mixed judged prevalence with search-snapshot emptiness. The pairwise checks and missing combinations that fed it are kept as supporting pages (3.7.1–3.7.4), as leads rather than evidence of absence.</p>
<div class="key"><span class="lbl">Bridge to Part 4</span>The goal is not to replace MRTA with a single new paradigm. It is to select tools whose assumptions match the candidate question, and to discover when the extra machinery is unnecessary.</div>${RVNOTE}`,
   refs:[] },

 lenses: { eyebrow:"Part 4 · Build an approach", title:"Six complementary lenses, not six replacements", fig:"p4six", tag:"P1–P6",
   bullets:[`Each lens changes a <b>modelling emphasis</b>; several can belong in one system`,`They build on <b>established</b> directions: queueing control, sequential inference, ad hoc planning, conservative learning`,`For each: model change · mechanism · <b>transfer conditions</b> · limitation · test`,`Then connect them to <b>execution</b> and <b>fair evaluation</b> (4.7–4.9)`],
   notesTitle:"Lenses whose transfer must be checked",
   notes:`<table class="cmp"><thead><tr><th>Lens</th><th>Main question</th><th>Most relevant dimensions</th></tr></thead><tbody>
<tr><td>P1 · Information acquisition</td><td>Which observation, query or trial is worth its cost?</td><td>E3, E6, E8</td></tr>
<tr><td>P2 · Flow and bottlenecks</td><td>Where does extra effort improve the system-level output?</td><td>E4, E5, E8</td></tr>
<tr><td>P3 · Conservative improvement</td><td>How much loss relative to a baseline is acceptable?</td><td>E5, E8, E9</td></tr>
<tr><td>P4 · The controlled agent's view</td><td>What can this agent infer and change about unfamiliar teammates?</td><td>E1, E6, E7</td></tr>
<tr><td>P5 · Coordination interfaces</td><td>What minimal shared semantics and agreements enable cooperation?</td><td>E1, E6, E7, E9</td></tr>
<tr><td>P6 · System and incentive design</td><td>Could changing the fleet, layout or interaction rules improve the problem itself?</td><td>E4, E7, E10</td></tr></tbody></table>
<p>The six themes are retained, but "overlooked paradigms" overstated what the evidence establishes. Queueing control, sequential inference, ad hoc planning and conservative learning are established research directions. Their transfer to a particular robot system may be useful, but requires an explicit match between assumptions.</p>
<p>For each lens, ask: <b>what changes in the model; what existing mechanism helps; which assumptions it requires; and what it does not establish</b>. The deep dives under each lens keep the source theorems with the conditions verified from the full texts. 4.1.1 shows which reference-case assumption each lens relaxes; 4.1.2 collects objections and limits.</p>${RVNOTE}`,
   refs:[] },

 exec: { eyebrow:"Part 4 · Build an approach", title:"Connect the lenses to symbolic planning and execution", fig:"rv_exec", tag:"architecture",
   bullets:[`A symbolic planner or HTN supplies <b>structure</b>: decomposition, preconditions, effects, dependencies`,`Allocation selects executors; scheduling supplies time; motion establishes <b>feasibility</b>`,`Unknown intentions must <b>not silently become</b> known symbolic facts`,`A handoff preserves <b>ownership, dependencies, reservations, validity</b>`],
   notesTitle:"A running team also needs beliefs, commitments and monitoring",
   notes:`<p>The six lenses do not replace a planning and execution architecture. A symbolic planner or HTN can express task decomposition, preconditions, effects, causal dependencies and resource constraints. Allocation selects executors; scheduling supplies timing; motion and manipulation establish physical feasibility.</p>
<p><b>Loop:</b> observe and update beliefs → generate task or repair options → evaluate information, cost and risk → agree on commitments → execute and monitor → repeat.</p>
<p>Unknown teammate intentions should not silently become known symbolic facts. Maintain a belief or a set of plausible explanations, and distinguish observed effects from predicted effects. Belief-space task-and-motion planning (Kaelbling &amp; Lozano-Pérez, 2013) provides related foundations; it does not remove the need to specify what other agents can change.</p>
<p><b>What a handoff must preserve.</b></p>
<ul><li><b>Ownership:</b> who is responsible before and after activation?</li>
<li><b>Dependencies:</b> which completed effects remain true, and which unfinished actions must finish first?</li>
<li><b>Reservations:</b> which resources, routes or objects have already been committed?</li>
<li><b>Validity:</b> what observation invalidates the new plan, and what recovery is allowed?</li></ul>
<p>D-ITAGS and SharedPlans are relevant predecessors for repair and collaborative commitments. The candidate research question is how these mechanisms interact with specified unfamiliar teammates and costly information, not whether symbolic planning and replanning can be combined for the first time.</p>${RVNOTE}`,
   refs:[RVREF.tamp, RVREF.ditags, RVREF.sharedplans] },

 evalu: { kind:"table", eyebrow:"Part 4 · Build an approach", title:"Evaluate the mechanism, not an information advantage", tag:"fair comparison",
   table:{ head:["Comparison","Purpose"],
     rows:[["Incumbent policy; newcomer waits where feasible","measure the counterfactual value and harm of integration"],
           ["Preserve assignments; give the newcomer eligible work","test the benefit of minimal intervention"],
           ["Local repair and full replanning under the same authority","separate neighbourhood restrictions from search budget; without full-team control, label full replanning a separate reference"],
           ["Existing online ad hoc / teammate-model method","test whether familiar adaptation mechanisms suffice"],
           ["Cheap communication, fixed observation, passive inference","test the need for adaptive information gathering"],
           ["Component ablations","remove commitment handling, information selection or conservative control one at a time"]],
     hlCol:1, caption:"A privileged reference is not automatically an upper bound unless it is exact or a bound is proved." },
   notesTitle:"A fair experiment should reveal when a simple method is already enough",
   notes:`<p><b>One shared environment and interface.</b> Use the same tasks, dynamics, observations, action permissions and execution model. Distinguish a same-interface algorithm baseline from a privileged reference with full information or full-team control.</p>
<p><b>Count time while the system runs.</b> For example, compare 0.1, 1, 5 and 10 second decision budgets while reporting actual wall time and hardware (an illustrative design, not measurements). Include communication and observation delay, plan activation, fallback behaviour and unfinished solves. Use separate, clearly named conditions if one pauses the team and another lets it keep executing.</p>
<p><b>Measure the claimed outcome.</b> For finite workloads, report remaining makespan and deadline misses; for streams, throughput, queue growth and response-time tails. Also record degradation relative to the incumbent, failed handoffs, communication cost and time to useful participation. Report uncertainty across seeds, arrival events and held-out teammate policies, not only a winning average.</p>
<div class="key"><span class="lbl">A useful negative result</span>If a cheap commitment summary plus ordinary repair matches the richer method, the contribution may be the interface and the problem characterisation. Do not make the benchmark harder merely to recover an algorithmic advantage.</div>${RVNOTE}`,
   refs:[] },

 next: { eyebrow:"Part 4 · Build an approach", title:"A concrete next question, with its limits", fig:"rv_question", tag:"illustrative formulation",
   bullets:[`<b>Illustrative:</b> how should a newcomer choose between productive action, observation and communication?`,`Constraints: cannot replace the incumbent, <b>partial view</b>, must respect <b>ongoing commitments</b>`,`Joins E1, E6, E7, E8, E9; it does <b>not establish novelty</b>`,`First test whether the <b>interface alone</b> suffices for ordinary repair`],
   notesTitle:"Narrow a falsifiable problem, do not declare a field empty",
   notes:`<p><b>Illustrative formulation.</b> How should a newcomer choose between productive action, observation and communication when it cannot replace the incumbent policy, sees only part of the task state, and must respect ongoing commitments?</p>
<p>This formulation joins E1, E6, E7, E8 and E9, with E3 or E4 included only when uncertainty or physical coupling is essential to the application. It makes the intervention and the interface explicit. It does not establish novelty: the nearest online ad hoc teamwork, communication-planning and plan-repair methods must still be examined under the same assumptions.</p>
<p>A minimal study should first determine whether the interface is sufficient for ordinary repair. Only then add belief modelling, information selection or conservative improvement where a measured failure motivates it. Keep the task and execution framework shared so that results remain attributable to the proposed mechanism.</p>
<div class="key"><span class="lbl">What this review supports, and what remains open</span><b>Supports:</b> precise problem boundaries, relevant neighbouring methods and a testable evaluation plan. <b>Open:</b> an exhaustive novelty check, source-level verification of the entire inherited bibliography, and empirical evidence that the candidate combination needs a new algorithm.</div>
<p>4.10.1 keeps the earlier table of lens combinations, read as related evidence rather than certified gaps.</p>${RVNOTE}`,
   refs:[RVREF.opat, RVREF.macke, RVREF.ditags] },
};

/* lens overviews (replace the old paradigm overview text) */
const RVL = {
 P2:{ title:"P2 · Optimize flow, not local busyness", eyebrow:"Part 4 · ② Value · P2 Flow and bottlenecks", tag:"lens · E4, E5, E8",
   bullets:[`<b>Model change:</b> evolving queues, resource occupancy and feasible service decisions`,`<b>Mechanisms:</b> max-weight control, bucket brigades, bottleneck analysis`,`<b>Transfer:</b> arrivals, service, routing and switching delays must match the model`,`Stability ≠ short makespan, small delay tails or bounded sample paths`],
   notesTitle:"A robot is helpful only through its effect on the team objective",
   notes:`<p><b>Model change.</b> Replace independent task scores with evolving queues, resource occupancy and feasible service decisions. This is especially useful for continuing work with shared bottlenecks. For a small finite batch, a direct schedule may remain the clearest formulation.</p>
<p><b>Mechanisms to borrow.</b> Max-weight control shows how queue pressure can guide service decisions under a specified network model (4.2.1, Theorem 3.2 of Tassiulas &amp; Ephremides). Bucket brigades show self-organised work sharing under structured production assumptions (4.2.2). Bottleneck analysis identifies which capacity constrains output (4.2.3). Dynamic vehicle routing gives stability conditions for task streams (load ρ &lt; 1 for one vehicle; Bertsimas &amp; van Ryzin, 1991).</p>
<p><b>Transfer conditions.</b> Define arrival and service processes, routing, feasible simultaneous actions and travel or switching delays. A queue-stability result under an admissible load does not imply minimum completion time, small delay tails or bounded queues on every sample path. A changing robot network may not satisfy the original theorem's assumptions.</p>
<p><b>Warehouse test.</b> Compare a queue-aware controller with assigning the newcomer to the longest queue and with a schedule-based controller. Increase aisle interference and packing capacity independently. If the benefit disappears when the downstream station saturates, that is evidence about coupling, not automatically about poor planning.</p>${RVNOTE}` },
 P1:{ title:"P1 · Learn only what can improve the decision", eyebrow:"Part 4 · ① Unknowns · P1 Information acquisition", tag:"lens · E3, E6, E8", fig:"rv_interleave",
   bullets:[`<b>Model change:</b> observations, queries and trials are <b>actions</b>, valued by the decision they improve`,`Not always "observe first, act later": <b>useful work also reveals information</b>`,`<b>Mechanisms:</b> sequential tests, controlled sensing, best-arm identification, communication-aware planning`,`<b>Transfer:</b> statistical bounds need a <b>matching observation model</b>`],
   notesTitle:"Choose useful interventions while learning",
   notes:`<p><b>Model change.</b> Make observations, queries and trials part of the action set. Their value is the expected improvement in a subsequent feasible decision, after subtracting time, communication and intervention cost. An accurate model of an irrelevant detail has little decision value.</p>
<p><b>Mechanisms to borrow.</b> Sequential testing provides a language for deciding when evidence is sufficient (4.4.1). Controlled sensing and best-arm identification help select informative experiments (4.4.2). Communication-aware ad hoc planning already treats which question to ask as part of planning (4.4.4).</p>
<p><b>Transfer conditions.</b> Likelihood-ratio tests and sample-complexity results require their stated statistical models; they are not universal bounds on time-to-integration. Correlated observations, adaptive teammates and missing hypotheses can invalidate nominal confidence. Distinguish uncertainty about the environment from uncertainty about the teammate.</p>
<p><b>A repeated decision.</b> The newcomer may carry one low-risk item, observe the resulting queue, query the dispatcher's commitment summary, then revise its next action (figure). "Commit" need not mean a permanent role. The problem is to choose useful interventions while learning, not to force all information gathering into an initial waiting period.</p>
<p>A practical comparison includes immediate action, passive observation, a fixed observation window, query-first behaviour and an adaptive information policy. Charge the same elapsed-time and communication costs to each.</p>${RVNOTE}` },
 P4:{ title:"P4 · Plan from the authority the agent actually has", eyebrow:"Part 4 · ③ Knowledge & authority · P4 Controlled agent's view", tag:"lens · E1, E6, E7",
   bullets:[`<b>Model change:</b> the controlled robot chooses its own policy while reasoning about others'`,`<b>Mechanisms:</b> OPAT (online ad hoc planning), PLASTIC (teammate-model reuse), type-based beliefs`,`<b>Transfer:</b> observability, model class, teammate adaptation, <b>actual authority</b>`,`Better inference cannot fix an action the robot <b>lacks permission</b> to take`],
   notesTitle:"Ad hoc cooperation changes the modelled teammate and the available interventions",
   notes:`<p><b>Model change.</b> The controlled robot chooses its own policy while reasoning about the policies of others. It may maintain beliefs over teammate types or latent intentions, then plan against that uncertainty. A centralised implementation of this inference does not grant centralised authority over the team.</p>
<p><b>Mechanisms to borrow.</b> OPAT (Wu, Zilberstein &amp; Chen, 2011) is an explicit precedent for online ad hoc planning. PLASTIC shows how teammate-model reuse and adaptation support behaviour selection, and Albrecht et al. state when type-based beliefs can be trusted (4.3.2). These are direct prior art for repeated decision making with unfamiliar collaborators.</p>
<p><b>Transfer conditions.</b> State the observability assumptions, candidate model class and how teammates may adapt. A library of teammate types may miss the deployment policy. Open membership additionally requires tracking who is present and how their roles affect the state and action space (4.3.3). More accurate inference cannot fix an action that the robot lacks permission to take.</p>
<p><b>Boundary test.</b> If the incumbent dispatcher supplies a complete plan and can direct every robot, the core problem may be dynamic centralised planning. If the newcomer must accommodate an unfamiliar incumbent policy it cannot replace, ad hoc reasoning is more central. Neither architecture is inherently the better research setting; the deployment decides.</p>${RVNOTE}`,
   refs:[RVREF.opat, RVREF.plastic] },
 P3:{ title:"P3 · Specify the meaning of “do no harm”", eyebrow:"Part 4 · ② Value · P3 Conservative improvement", tag:"lens · E5, E8, E9",
   bullets:[`<b>Model change:</b> improve subject to a stated loss budget relative to a reference policy`,`Expected, high-probability, cumulative and worst-case statements are <b>different requirements</b>`,`<b>Mechanisms:</b> conservative bandits (stochastic and adversarial), SPIBB, Seldonian tests`,`Performance conservatism is <b>not physical safety</b>; add separate constraints`],
   notesTitle:"A baseline is useful only when its behaviour and the promised comparison are defined",
   notes:`<p><b>Model change.</b> Optimise improvement subject to a stated performance budget relative to a reference policy. Specify whether the criterion concerns expected return, a high-probability bound, cumulative reward over prefixes, or a worst-case loss. These are different requirements.</p>
<p><b>Mechanisms to borrow.</b> Conservative bandits maintain cumulative performance relative to a baseline; the original work covers both stochastic and adversarial settings (4.6.1). SPIBB gives approximate baseline improvement from a fixed dataset under its MDP and confidence assumptions; HCPI and Seldonian algorithms certify a candidate before deployment or return "no solution found" (4.6.2). None is a general guarantee that every physical execution will outperform the incumbent at every instant.</p>
<p><b>Transfer conditions.</b> Define a feasible baseline after entry, the loss tolerance, horizon and uncertainty model. Inactivity may be a baseline if the newcomer can wait without blocking anyone; that is not automatically true. Physical safety and resource reservations still need separate constraints.</p>
<p><b>Make the counterfactual explicit.</b> Compare the post-entry policy with the same incumbent operation under matched demand and disturbances. The incumbent-only outcome is usually an evaluation counterfactual, not a simultaneously observable signal. An empirical loss rate across trials is evidence, not a proof of a no-harm guarantee. Report mean improvement together with the probability and severity of degradation.</p>${RVNOTE}` },
 P6:{ title:"P6 · Change the system when allocation is not enough", eyebrow:"Part 4 · ④ Operation & design · P6 System and incentive design", tag:"lens · E4, E7, E10",
   bullets:[`<b>Model change:</b> fleet, station capacity, chargers, interfaces or local rewards become <b>decisions</b>`,`<b>Mechanisms:</b> co-design, payoff and mechanism design (4.5.1–4.5.2)`,`<b>Transfer:</b> state who may change the system, on what timescale, at what cost`,`If a structural change wins, <b>report that</b>; do not blame the allocator`],
   notesTitle:"Fleet, layout and incentives can matter more than another solver iteration",
   notes:`<p><b>Model change.</b> Treat selected structural properties as decisions: fleet composition, station capacity, charging locations, communication interfaces or rewards used by local controllers. This shifts some work from runtime allocation to design.</p>
<p><b>Mechanisms to borrow.</b> Co-design optimises equipment and policy together. Mechanism and payoff design seek local rules that support a team objective (distributed welfare games: equilibria at least half of optimal under submodular welfare, 4.5.1). Layout search with a path planner in the loop raised the robot count one planner could handle before congestion (4.5.2). A deployment with self-interested participants needs incentive compatibility; a cooperative team with limited information may need only coordination.</p>
<p><b>Transfer conditions.</b> State who may change the system, on what timescale and at what cost. A newcomer cannot normally redesign the incumbent's reward function or warehouse layout. A design-time guarantee does not automatically survive an unknown runtime population.</p>
<p><b>Warehouse test.</b> Compare spending the same resource budget on another mobile robot, extra packing capacity and an improved information interface. If a structural intervention wins, report that conclusion. It prevents attributing a physical capacity limit to a deficiency in allocation.</p>${RVNOTE}` },
 P5:{ title:"P5 · Coordinate with a minimal explicit interface", eyebrow:"Part 4 · ③ Knowledge & authority · P5 Coordination interfaces", tag:"lens · E1, E6, E7, E9",
   bullets:[`No jointly designed policy does <b>not</b> mean no common meaning`,`<b>Model change:</b> what must agents share to make independent decisions compatible?`,`<b>Mechanisms:</b> zero-shot coordination, legible actions, environmental mediation, cheap queries`,`<b>Transfer:</b> observations need interpretation; language needs <b>grounding</b>`],
   notesTitle:"The interface can be small without being absent",
   notes:`<p><b>Model change.</b> Ask what agents must share to make independent decisions compatible. Candidates include task identifiers, public action effects, intent messages, reservations and a proposal–acceptance handshake. The interface can be small without being absent.</p>
<p><b>Mechanisms to borrow.</b> Zero-shot coordination studies compatibility across independently trained agents under specified shared structures (4.8.1). Legible actions, environmental signals and stigmergy (environment-mediated, indirect coordination) can support coordination without messages (4.8.2). Direct queries may be preferable when they are cheap; the communication literature makes that trade-off explicit (4.4.4).</p>
<p><b>Transfer conditions.</b> Observation still needs an interpretation, natural language still needs grounding, and an environmental signal still needs to be detectable. A protocol for exchanging task status is not the same as a jointly optimised team policy. Conversely, assuming that all parties obey a new negotiation algorithm is a substantive coordination assumption.</p>
<p><b>Minimal handoff example.</b> The newcomer proposes a task and activation time; the incumbent accepts or rejects; an accepted reservation has an owner and an expiry; completion updates public task state. This is an illustrative interface, not a new protocol or a claim that handshakes solve all failures.</p>
<p>Compare interface choices as well as policies: full schedule disclosure, task-level summaries, on-demand queries and observation alone. Let the result determine how much implicit inference is actually necessary. Systems such as RoCo and SMART-LLM, sometimes cited as heterogeneous coordination, run every robot on one language model or a designed dialogue protocol.</p>${RVNOTE}` },
};
const RVX_OVR={"p1-multi-robot-task-allocation-from-the-problem-up": {"notes": "<p>This deck reviews multi-robot task allocation (MRTA) by starting from the problem itself instead of from a catalogue of algorithms. It is a narrative review, not a systematic review or an exhaustive novelty assessment. The goal is to see which parts of the problem the field has worked hard on, which parts it has assumed away, and where a different framing might pay off.<\/p>\n<p>Task allocation asks how a team should distribute work. In a running system that decision also depends on what the robots know, what they may change, and what is already being executed. The challenge is to identify which of these features matters in a particular setting, then choose an appropriate model.<\/p>\n<p>The deck is built in four parts that follow the same thread:<\/p>\n<ol><li><b>Part 1<\/b> breaks allocation into five questions any allocator must answer.<\/li>\n<li><b>Part 2<\/b> maps the classic families of methods onto those five questions.<\/li>\n<li><b>Part 3<\/b> walks through the questions one at a time and looks for gaps.<\/li>\n<li><b>Part 4<\/b> looks at lenses the field has underweighted.<\/li><\/ol>\n<p>The figure is the canonical picture: robots on the left, tasks on the right, and allocation as a choice of edges between them. Most of what follows asks where the numbers on those edges come from.<\/p>\n<div class=\"key\"><span class=\"lbl\">The central argument<\/span>A fixed robot–task score table, the picture in the figure, is a useful starting point. It is not a definition of the entire MRTA literature. Extensions involving learning, communication, planning and execution already exist; a credible contribution must specify the additional assumption or combination it addresses.<\/div>"}, "p1-every-allocator-answers-five-questions": {"notes": "<p>Picture a parcel depot. There is a pile of parcels (tasks), a few couriers (robots), and a dispatcher who decides who delivers what. However clever the dispatcher's method, five questions cannot be avoided:<\/p>\n<ol><li><b>What work exists?<\/b> Is the parcel list fixed in the morning, or do parcels keep arriving?<\/li>\n<li><b>Who can do what?<\/b> One courier has an e-bike; another walks.<\/li>\n<li><b>What is a pairing worth?<\/b> Distance, time, chance of success.<\/li>\n<li><b>Who decides, and how?<\/b> The dispatcher assigns, couriers grab jobs, or everyone improvises.<\/li>\n<li><b>What if things change?<\/b> Someone calls in sick, an urgent parcel arrives, a road closes.<\/li><\/ol>\n<h4>“Who does what?” is necessary, but usually not sufficient<\/h4>\n<p>Before choosing a solver, define the decision. The dispatcher's question sits among four coupled decisions:<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_decisions\"><\/div>\n<p><b>Decomposition<\/b> turns goals into tasks; <b>allocation<\/b> assigns responsibility; <b>scheduling<\/b> orders and times the work; <b>motion and manipulation planning<\/b> determine how to execute it. An application may solve these jointly, alternate between them, or accept an approximate interface.<\/p>\n<p>A simple <b>reference case<\/b> uses known costs <code>c_ij<\/code> and binary assignments <code>x_ij<\/code>. Minimising <code>Σ c_ij x_ij<\/code> under one-to-one constraints gives linear assignment (1.5 and its worked example). In the depot's terms, the parcel list, the couriers' abilities and the value of each pairing are all settled in advance, and only the dispatcher's rule remains to be chosen. This model is appropriate when the work is already defined, costs are meaningful and the chosen assignments do not invalidate one another.<\/p>\n<p>Temporal precedence, coalitions, shared resources, uncertain outcomes and route-dependent costs change the formulation. General versions can be computationally hard, but \"everything except one-to-one assignment is NP-hard\" is too broad: complexity depends on the precise class and encoding, not on a taxonomy label. Gerkey and Matarić prove hardness for their formulations of each class (1.3), and other encodings or special structures can behave differently.<\/p>\n<div class=\"key\"><span class=\"lbl\">Working claim<\/span>Every MRTA paper can be read as a particular set of assumptions about these five questions. Comparing papers by their assumptions is often more revealing than comparing them by their algorithms.<\/div>\n<div class=\"key\"><span class=\"lbl\">Running example<\/span>A warehouse team transports items through a shared aisle to a packing station. A new robot arrives. If tasks, capabilities and routes are known and reassignment is authorised, this may be an ordinary rescheduling problem. If the newcomer cannot inspect the team's queue or change its commitments, a different decision problem arises, even with the same physical robots.<\/div>"}, "p1-where-the-reference-table-falls-short": {"notes": "<p>The reference case from the previous slide breaks in three distinct ways:<\/p>\n<ul><li><b>Missing.<\/b> A newcomer joins a team that is already working. Its row of the table may be empty, and nobody, including the newcomer, knows how to fill it yet; in other settings the row is already known, for instance from an advertised specification.<\/li>\n<li><b>Uncertain.<\/b> Capabilities and costs can only be estimated, for example from observation. Getting better estimates takes time during which the team is still working, so information has a price.<\/li>\n<li><b>Coupled.<\/b> What one robot does changes the value of what the others could do. If one station is overloaded, helping there is worth more than doing the task you are nominally best at.<\/li><\/ul>\n<p>Which of these applies has to be stated, not assumed, and the vocabulary used to state it is often blurred. Four terms in particular are used interchangeably: open team, ad hoc teamwork, online replanning and decentralised decision making. Each describes a different property, and none implies the others.<\/p>\n<table class=\"cmp\"><thead><tr><th>Term<\/th><th>What changes?<\/th><th>What does not follow automatically?<\/th><\/tr><\/thead><tbody><tr><td>Open team<\/td><td>membership can change during operation<\/td><td>a newcomer need not have unknown capabilities or an incompatible policy<\/td><\/tr><tr><td>Ad hoc teamwork<\/td><td>agents cooperate without having jointly designed their coordination strategy in advance<\/td><td>zero communication, zero shared semantics, or the absence of an incumbent dispatcher<\/td><\/tr><tr><td>Online replanning / plan repair<\/td><td>a decision or plan is revised as state, information or constraints change; repair reuses an existing plan<\/td><td>unfamiliar teammates; a reactive policy can adapt without an explicit plan<\/td><\/tr><tr><td>Decentralised decision making<\/td><td>information or decisions are distributed across agents<\/td><td>no shared protocol or known models; optimisation itself need not be centralised<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">Open membership, ad hoc teamwork, replanning and decentralisation are different properties. “Ad hoc replanning” is not by itself an unoccupied category (OPAT, PLASTIC).<\/p>\n<p><b>Ad hoc planners already plan repeatedly while executing.<\/b> OPAT (Wu, Zilberstein &amp; Chen, 2011) explicitly studies online planning for ad hoc teams, and PLASTIC (Barrett et al., 2017) adapts behaviour using models of past teammates (4.6.2). Therefore \"ad hoc replanning\" is not by itself an unoccupied category. A proposed contribution must identify an additional difficulty, such as costly information, persistent commitments or restricted intervention; these are the uncertain and coupled cases above, stated precisely.<\/p>\n<p><b>Distributed optimisation is a counterexample<\/b> to \"optimisation requires central control\": consensus ADMM (Shorinwa et al., 2023) and the distributed auction, simplex and Hungarian methods of 2.3.7 solve assignment problems without a central solver.<\/p>\n<p>With those distinctions in place, the case this review cares about, a newcomer that joins mid-run, can sit in all three failure modes at once. That is the link to the \"watch, then help\" direction: in that setting the newcomer faces a table that is not yet filled in, and has to fill it while the team keeps going.<\/p>\n<h4>State the information and authority contract<\/h4>\n<p>For the warehouse example, define an explicit interface before selecting a centralised or distributed algorithm. The incumbent team can have its own dispatcher while the newcomer controls only its own actions. Whether that setting is ad hoc depends on what coordination was established beforehand, not on the number of servers.<\/p>\n<table class=\"cmp\"><thead><tr><th>Specify<\/th><th>A concrete example<\/th><\/tr><\/thead><tbody><tr><td>Shared semantics<\/td><td>task identifiers, units, capability descriptors, map coordinates and message meanings<\/td><\/tr><tr><td>Initially available information<\/td><td>public goal and map; partial view of work queues; advertised rather than perfectly known capability<\/td><\/tr><tr><td>Queries and observations<\/td><td>queue summaries, current commitments or task status; latency, bandwidth, and whether requests can be refused<\/td><\/tr><tr><td>Authority<\/td><td>self-assignment only; proposals subject to acceptance; or permission to reassign the whole team<\/td><\/tr><tr><td>Execution contract<\/td><td>which actions may be interrupted, which reservations expire, how a handoff becomes binding<\/td><\/tr><tr><td>Fallback<\/td><td>a defined incumbent policy and a feasible newcomer behaviour while information or agreement is pending<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">Where computation runs is separate from what is known and who can be controlled.<\/p>\n<p>The contract is what decides which of the three failure modes is actually present. Whether the newcomer's row is <b>missing<\/b> depends on the shared semantics and the initially available information. How <b>uncertain<\/b> it stays, and what it costs to sharpen, depends on which queries and observations are allowed and at what latency and bandwidth. Whether <b>coupling<\/b> can be exploited or only suffered depends on authority and the execution contract: a newcomer limited to self-assignment can only adapt around the team's commitments, while one allowed to propose or reassign can change them.<\/p>\n<div class=\"key\"><span class=\"lbl\">Do not manufacture difficulty<\/span>Do not create a problem by withholding free information. If the incumbent can cheaply transmit an adequate schedule, that is a strong baseline. If sharing is limited, motivate the limit by the deployment and charge its actual cost.<\/div>\n<p>The contract also fixes what a fair comparison looks like later (4.10): methods should differ in algorithm, not in the information or authority they are granted.<\/p>\n<p><b>Next, Part 2:<\/b> how each classic family of methods handles the five questions, and why they make the assumptions they do.<\/p>"}, "p2-five-families-placed-on-two-axes": {"notes": "<p>The classic families can be roughly placed on two axes.<\/p>\n<ul><li><b>Who decides (horizontal):<\/b> a single planner with the whole picture, or each robot deciding from local information.<\/li>\n<li><b>Where utility comes from (vertical):<\/b> written down from a model (distances, travel times, success probabilities), or learned from data or prior knowledge.<\/li><\/ul>\n<p>Centralised optimisation and markets both use hand-modelled utilities; they differ in who computes the decision. Self-organising methods (response thresholds, ALLIANCE, swarm rate design) sit off to the side because they do not use an explicit utility at all. Learned policies and LLM planners moved upward: utility is implicit in a reward function or in a language model's commonsense. Broadly, then, the older families sit lower on the map and the newer ones higher.<\/p>\n<p>The positions are approximate, and many systems are hybrids. The five families are organisational categories, not a partition, and their roles overlap. An auction can call a motion planner to compute bids; a learned model can supply costs to an optimiser; a language model can propose an HTN or symbolic plan that a separate checker validates. Likewise, centralised computation does not imply complete information, and distributed computation does not imply unknown teammates. Claims such as \"optimisation assumes a static team\" or \"learning alone handles uncertainty\" obscure existing hybrid approaches.<\/p>\n<table class=\"cmp\"><thead><tr><th>Family<\/th><th>Useful contribution<\/th><th>Questions to ask of a particular method<\/th><\/tr><\/thead><tbody><tr><td>Optimisation and search<\/td><td>explicit objectives, constraints, schedules, sometimes bounds<\/td><td>which quantities are known? stochastic or robust? execution and solver latency?<\/td><\/tr><tr><td>Markets, consensus and distributed optimisation<\/td><td>coordinate bids or local decisions across agents<\/td><td>which protocol, connectivity, truthfulness and convergence assumptions?<\/td><\/tr><tr><td>Self-organising allocation<\/td><td>local rules react to demand with little negotiation<\/td><td>how are thresholds set? oscillation, congestion, unfairness?<\/td><\/tr><tr><td>Learned policies and teammate models<\/td><td>amortise decisions; represent uncertainty or interaction<\/td><td>which training and teammate diversity support generalisation? what shifts at deployment?<\/td><\/tr><tr><td>Language-based and hybrid planners<\/td><td>interpret instructions; propose decompositions or messages<\/td><td>how are grounding, feasibility, permissions and feedback checked?<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">Compare concrete algorithms and their assumptions, not whole families.<\/p>\n<p>The pages 2.2–2.6 go through each family with formulations, guarantees and examples; the two-axis map on this page is a rough orientation only. Its point is the observation at the bottom of the slide: the families differ most in how they decide (Q4), and much less in how they answer Q1 to Q3.<\/p>", "bullets": ["<b>Horizontal:<\/b> does one planner decide, or does each robot?", "<b>Vertical:<\/b> is utility written by hand, or learned?", "Families <b>overlap<\/b>: categories, not a partition", "They differ most in <b>Q4<\/b>, much less in Q1–Q3"]}, "p2-same-five-questions-five-answers": {"notes": "<p>Reading across the table:<\/p>\n<ul><li><b>Q4 is where the families really differ.<\/b> Solvers, auctions, local rules, trained policies and prompts are different answers to \"who decides, and how\" (highlighted).<\/li>\n<li><b>Q1 to Q3 are mostly answered by assumption<\/b> (blue text): a given list, a given model, or a robot that already knows itself. The exceptions are informative: thresholds read tasks from the environment, and LLMs read tasks from language. Some methods do update capability or utility from outcomes: <b>capability can be updated from execution<\/b>, as in the adaptive allocation of Emam et al. (2020), which adapts allocation using observed task progress and evolving capabilities; and <b>allocation can learn an unknown reward<\/b>, as in unknown-reward allocation: CMTAB (2023) studies online coalition optimisation under unknown task rewards and resource constraints (see the counterexamples below, 2.7).<\/li>\n<li><b>Q5 is often \"do Q4 again\".<\/b> Threshold methods adapt continuously and give up optimality to do it. Online and repair methods also revise decisions during execution (2.7). <b>Planning can already be online and ad hoc:<\/b> OPAT repeatedly plans with unfamiliar teammates, and PLASTIC uses learned teammate models. <b>Allocation and execution can be coupled:<\/b> D-ITAGS repairs an interleaved allocation, scheduling and motion-planning solution after changes.<\/li><\/ul>\n<p>Two further counterexamples to the fixed-table story fall outside the five columns. <b>Communication can itself be a decision:<\/b> Macke et al. study the cost-sensitive choice of querying teammates versus inferring their plans from observation. <b>Partial plans and commitments have a history:<\/b> SharedPlans formalises collaborative activity with partial knowledge and commitments; these ideas were not created by recent language models.<\/p>\n<table class=\"cmp\"><thead><tr><th>Claim to avoid<\/th><th>Counterexample<\/th><th>What it shows<\/th><\/tr><\/thead><tbody><tr><td>capability is a fixed input<\/td><td>Emam et al. 2020<\/td><td>allocation adapted from observed task progress and evolving capability<\/td><\/tr><tr><td>utility is a fixed input<\/td><td>CMTAB (Singh et al. 2023)<\/td><td>online coalition optimisation under unknown task rewards<\/td><\/tr><tr><td>ad hoc teams plan once<\/td><td>OPAT (2011); PLASTIC (2017)<\/td><td>online planning and model reuse with unfamiliar teammates<\/td><\/tr><tr><td>communication is not a decision<\/td><td>Macke, Mirsky &amp; Stone 2021<\/td><td>cost-sensitive choice between querying and inferring<\/td><\/tr><tr><td>allocation and execution are separate<\/td><td>D-ITAGS (2022)<\/td><td>repair of interleaved allocation, scheduling and motion<\/td><\/tr><tr><td>partial plans and commitments are new<\/td><td>SharedPlans (Grosz &amp; Kraus 1996)<\/td><td>collaborative activity with partial knowledge and commitments<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">These do not solve every joint setting; they rule out blanket claims.<\/p>\n<p>These examples do not solve every joint setting. They do invalidate a blanket claim that all methods receive capability and utility as fixed inputs, or that online repair, decomposition and communication remain untouched.<\/p>\n<div class=\"key\"><span class=\"lbl\">Read with the counterexamples (2.7)<\/span>The five-question table compares families at the level of typical assumptions, and should be read with these corrections. Individual methods often depart from their family's row; the list above (2.7) gives concrete counterexamples, and Part 3 therefore asks <i>under which precise assumptions<\/i> existing approaches stop answering a question.<\/div>"}, "p3-deriving-gaps-instead-of-listing-them": {"bullets": ["A gap list written from experience <b>reflects the writer<\/b>: what they read, what they want to work on", "Instead: start from the <b>most general model<\/b> of the problem and relax each assumption in turn", "Then <b>audit<\/b> the model against eleven outside lists, so blind spots show up", "Evidence: <b>demonstrated, related or unresolved<\/b>; ratings are <b>search snapshots<\/b>, not coverage"], "notes": "<p>Part 2 ended with a strong observation: across all five families, capability and utility are given, self-priced, encoded in thresholds, implicit in training, or read from text, and rarely measured from the team's ongoing work. (2.7 lists exceptions, such as adaptive and unknown-reward allocation.) That observation came from looking at five families through five questions. A neutral survey needs more than that, because the five questions were themselves an intuition, and a list of gaps built on an intuition inherits its blind spots.<\/p>\n<h4>Deriving the checklist<\/h4>\n<p>This part therefore follows four explicit steps:<\/p>\n<ol><li><b>Write the general model.<\/b> Treat allocation as an instance of a team decision problem and list everything such a problem contains.<\/li>\n<li><b>State the classical idealisation.<\/b> For each element, write down what classical MRTA assumes, and the ways reality can depart from it. Each departure is an axis.<\/li>\n<li><b>Audit.<\/b> Take the open problems listed by taxonomies and surveys, inside MRTA and in neighbouring fields, and map each onto an element. An item that fits nowhere means the model is missing something, and the model is extended.<\/li>\n<li><b>Check the literature.<\/b> For each axis, find work that relaxes it on its own; then look at pairs of axes, where unexplored combinations tend to hide. Only what survives this check is recorded as a candidate gap, and its status records what this review's search found at the time.<\/li><\/ol>\n<p>The result is the set of labels E1–E10, retained as a practical checklist. They describe useful aspects of a team decision problem, but are neither independent coordinates nor a uniquely complete derivation. Timing and physical execution, for example, can be included in an expanded state, action or transition model; separating them here makes their assumptions visible.<\/p>\n<h4>From a coverage map to a research question<\/h4>\n<p>A taxonomy organises evidence; it does not prove that a problem is new. A candidate gap located on the checklist therefore becomes a research question only after five further steps:<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_method\"><\/div>\n<ol><li><b>Specify the setting.<\/b> State the task process, uncertainty, information, authority and execution constraints.<\/li>\n<li><b>Identify nearest work.<\/b> Search both MRTA and adjacent fields using alternative names for the same mechanism.<\/li>\n<li><b>Record the actual evidence.<\/b> Separate a paper's demonstrated setting from an abstract-level relevance judgement and an unanswered search.<\/li>\n<li><b>Formulate the remaining question.<\/b> Name the additional assumption and explain why it changes the decision.<\/li>\n<li><b>Define a disconfirming result.<\/b> State when an existing method or a simple interface would already be sufficient.<\/li><\/ol>\n<p><b>Evidence vocabulary.<\/b> Each statement about prior work uses one of three terms. \"Demonstrated in a specified setting\" needs a concrete method and experiment or theorem. \"Related evidence\" identifies a useful connection with different assumptions. \"Unresolved in this review\" describes the limits of the search, not the absence of a literature.<\/p>\n<div class=\"key\"><span class=\"lbl\">Ground rules<\/span>The part stays neutral: no question is promoted for its fit to any research plan. How common a situation is and how thin the evidence found appears are recorded as context, not turned into a ranking. Every gap names the assumption it relaxes. No claim says that work does not exist: a question without matching work is \"unresolved in this review\", and the record states how each work was checked: full text, abstract, or title only.<\/div>\n<div class=\"key\"><span class=\"lbl\">Counts and labels are a snapshot<\/span>The pair counts, maturity labels and tiered gap list in this part belong to a search snapshot (October 2026), not coverage statistics. The sub-axis pages (3.5–3.14) and pair checks (3.15) remain useful because their representative works and \"still keeps\" notes remain useful; their status labels are marked as snapshots and are not used as updated coverage statistics or as a ranking. A later paper may invalidate a count without changing the taxonomy.<\/div>\n<p>This page and the next three cover steps 1 to 3 of the derivation. Steps 4 onward are listed in the sidebar as coming next.<\/p>"}, "p3-the-general-model-a-team-decision-problem": {"notes": "<p>A multi-robot team allocating work is a <b>team decision problem<\/b> in the sense of Marschak and Radner: several decision makers share one objective but hold different information and control different actions. The Dec-POMDP from 2.5.1 is a formal version of the same structure. Reading the elements off that structure:<\/p>\n<ul><li><b>E1 Agents<\/b> (the agent set): who is on the team, and whether that changes.<\/li>\n<li><b>E2 Tasks<\/b> (part of the state and reward): what must be done, and how it becomes known.<\/li>\n<li><b>E3 Dynamics<\/b> (the transition model): what each robot's actions achieve. Capability lives here.<\/li>\n<li><b>E4 Interaction<\/b> (how transitions and rewards factor): how robots' actions affect each other.<\/li>\n<li><b>E5 Objective<\/b> (the reward and its aggregation over time): what counts as good.<\/li>\n<li><b>E6 Information<\/b> (observations and communication): who observes what, and at what cost.<\/li>\n<li><b>E7 Control<\/b> (whose policies are designed): who decides for whom, and whether they cooperate.<\/li>\n<li><b>E8 Timing<\/b>: when decisions are made and how much computation is available.<\/li>\n<li><b>E9 Execution<\/b>: whether an allocation, expressed in abstract tasks, can be carried out by the motion and manipulation layers below.<\/li><\/ul>\n<p><b>A caveat on completeness.<\/b> E1 to E7 come directly from the decision-problem structure. E8 and E9 are not part of that formal structure; they are added because a real allocator is a computation running on top of physical execution. Step 3 tests whether anything else is missing. Pages 3.2–3.3.1 show how the dimensions were first derived, and 3.4–3.4.2 the completeness audit against outside taxonomies and surveys. The audit showed that every item raised by eleven, and later fourteen, outside sources could be expressed with these dimensions; it does not prove completeness, and one omission (a minimal shared interface, E6e) was found afterwards.<\/p>\n<p><b>Ten dimensions, one coherent checklist.<\/b> The checklist used in the rest of this part adds a tenth dimension, E10 System design, and states the others in working terms: E3 includes capability, E7 is stated as authority and behaviour, E8 as decision timing and E9 as physical execution. The dimensions fit together as follows: E1–E4 describe much of the system; E5 defines success; E6–E7 constrain which decisions are possible; E8–E9 connect decisions to time and execution; E10 asks which system properties are design variables. This grouping is explanatory, not a formal separation: communication takes time, motion creates interaction, and the objective changes which uncertainty matters. For each dimension, the table lists what a setting must state and a stress test that shows whether the dimension matters.<\/p>\n<table class=\"cmp\"><thead><tr><th>Dimension<\/th><th>What must be stated?<\/th><th>A useful stress test<\/th><\/tr><\/thead><tbody><tr><td>E1 · Agents<\/td><td>membership, heterogeneity, humans, prior familiarity<\/td><td>known newcomer vs unfamiliar policy; entry vs failure<\/td><\/tr><tr><td>E2 · Tasks<\/td><td>arrival, discovery, decomposition, requirements<\/td><td>streaming known tasks vs tasks whose requirements must be learned<\/td><\/tr><tr><td>E3 · Dynamics / capability<\/td><td>unknown parameters, drift, failures, environment effects<\/td><td>poor capability vs congestion vs a difficult task<\/td><\/tr><tr><td>E4 · Interaction<\/td><td>precedence, shared resources, coalition effects, feedback<\/td><td>does helping one station overload another?<\/td><\/tr><tr><td>E5 · Objective<\/td><td>finite completion, throughput, risk, fairness, preferences<\/td><td>does a mean improvement conceal unacceptable tail loss?<\/td><\/tr><tr><td>E6 · Information<\/td><td>observability, communication, self-knowledge, acquisition cost<\/td><td>can a query replace prolonged observation?<\/td><\/tr><tr><td>E7 · Authority and behaviour<\/td><td>whose policy is controlled; adaptation, incentives, human vetoes<\/td><td>can the proposed plan actually be imposed?<\/td><\/tr><tr><td>E8 · Decision timing<\/td><td>deadlines, compute budgets, concurrency, scale<\/td><td>is the returned plan already stale?<\/td><\/tr><tr><td>E9 · Physical execution<\/td><td>paths, manipulation, interruptions, handoffs, monitoring<\/td><td>is an abstractly feasible assignment executable?<\/td><\/tr><tr><td>E10 · System design<\/td><td>fleet composition, layout, permitted structural changes<\/td><td>would a layout change remove the apparent allocation bottleneck?<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">The useful unit of comparison is a specified setting, not the number of relaxed assumptions.<\/p>"}, "p3-e1-agents-1-thin-3-partly-0-well-studied": {"notes":
