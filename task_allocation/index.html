  { eyebrow:"Part 2 · Family 3", title:"Self-organising allocation", intro:{year:'1996 / 1998',by:'Bonabeau et al.; Parker',cell:'ST-SR-IA, continuous and dynamic',problem:'explain insect division of labour; keep a team working when robots fail',note:'Response-threshold models (Bonabeau, Theraulaz & Deneubourg, 1996) were introduced to explain how social insects divide labour without a coordinator. ALLIANCE (Parker, 1998) was designed for fault tolerance: a heterogeneous team that keeps working when robots fail or communication drops. Both solve continuous, dynamic allocation where tasks keep reappearing and no one keeps a list.'},  fig:"threshold",
    bullets:[`<b>Local response rules</b>; the division of labour <b>emerges</b>`,`No table at all: tasks act as <b>stimuli</b> in the environment`,`Response thresholds, ALLIANCE motivations, swarm transition rates`,`<b>Gives up</b> optimality; <b>gains</b> robustness and no need to talk`],
    notesTitle:"The family that skips the table",
    notes:`<p>This family takes a different route: there is no explicit utility table. Tasks show up as stimuli that robots perceive directly, such as a dirty floor, a growing queue or an idle station, and each robot follows a local rule for when to engage.</p>
<ul><li><b>Response threshold models</b> come from studies of division of labour in social insects (Bonabeau, Theraulaz &amp; Deneubourg, 1996). A robot engages with probability <code>s² / (s² + θ²)</code>, where <code>s</code> is the stimulus and <code>θ</code> its threshold. Robots with lower thresholds respond first, so specialisation can emerge without anyone assigning it.</li>
<li><b>ALLIANCE</b> (Parker, 1998) uses "motivational behaviours": a robot grows <i>impatient</i> when a task is left undone and takes it over, and <i>acquiesces</i> when it is making poor progress and lets another robot take over.</li></ul>
<p><b>Five-question reading.</b> Q1: tasks are read from the environment, not from a list. Q2: capability is encoded in thresholds. Q3: no explicit utility. Q4: a local rule. Q5: adaptation happens on its own.</p>
<p><b>Why "self-organising".</b> The literature often calls these "threshold-based" or "swarm" methods, but neither name covers the whole family: ALLIANCE is not a swarm method, and swarm rate design uses no thresholds. What they share is that no one computes an assignment. Each robot follows a local rule, and the division of labour emerges from the rules plus feedback from the environment.</p>
<p>This is the only classic family that does not start from a given task list. Part 4 comes back to that. Slide 2.4.6 compares it with the agreement family of 2.3.</p>`,
    refs:[ref("Bonabeau, Theraulaz & Deneubourg, Proc. Royal Society B 1996","Quantitative study of the fixed threshold model for the regulation of division of labour in insect societies",{Scholar:sch("Quantitative study of the fixed threshold model for the regulation of division of labour in insect societies")}),
          ref("Parker, IEEE Trans. Robotics and Automation 1998","ALLIANCE: An architecture for fault tolerant multirobot cooperation",{Scholar:sch("ALLIANCE: An architecture for fault tolerant multirobot cooperation")})] },

  { child:true, eyebrow:"Part 2 · Family 3 · Deep dive", title:"Fixed response thresholds", fig:"stim",
    intro:{year:'1996',by:'Bonabeau, Theraulaz & Deneubourg',cell:'ST-SR-IA, continuous',problem:'explain how ant colonies keep work done after specialists are removed',note:'Biologists had observed that when the ants specialised in a task are removed, other ants that normally ignore that task start doing it. Bonabeau, Theraulaz and Deneubourg (1996) showed that a simple model explains this: every individual has a response threshold, and the task stimulus rises when work is neglected. Robotics borrowed the model for allocation without communication.'},
    math:[["engage","T<sub>θ</sub>(s) = s<sup>n</sup> / (s<sup>n</sup> + θ<sup>n</sup>)","probability per step"],["quit","with probability p per step",""],["stimulus","s(t+1) = s(t) + δ − α N<sub>act</sub>(t) / N","demand − work"]],
    bullets:[`A task is a <b>stimulus</b> that grows when nobody works on it`,`Low-θ robots respond first; high-θ robots only if <b>demand keeps rising</b>`,`Removal of workers is absorbed <b>without any message</b>`],
    notesTitle:"Allocation as a feedback loop",
    notes:`<p>Each task has a stimulus <code>s</code>, for example the amount of litter or the length of a queue. It grows at rate <code>δ</code> and falls as robots work on it. Each robot engages with probability <code>T_θ(s)</code> and stops with probability <code>p</code>. Robots with low thresholds <code>θ</code> engage at low stimulus; robots with high thresholds engage only when the stimulus is high.</p>
<p><b>The figure is a simulation of the model.</b> Five low-θ and five high-θ robots share one task. At first the low-θ robots keep the stimulus low and the high-θ robots mostly stay idle. At step 100 the low-θ robots are removed. Nobody tells the others, but the stimulus climbs until the high-θ robots respond, and the system settles at a new, higher stimulus level.</p>
<p><b>What this buys.</b> No table, no messages, no planner. Robustness comes from the feedback loop itself.</p>
<p><b>What it costs.</b> The settled state is not optimal in any sense; it is just stable. The stimulus level is a proxy for demand, so tasks without a sensible stimulus are hard to express. Thresholds must be set by the designer.</p>
<p><b>Five-question reading.</b> Q1: tasks are sensed, not listed. Q2: capability is folded into <code>θ</code>. Q3: none. Q4: a local stochastic rule. Q5: automatic.</p>`,
    refs:[ref("Bonabeau, Theraulaz & Deneubourg, Proc. Royal Society B 1996","Quantitative study of the fixed threshold model for the regulation of division of labour in insect societies",{Scholar:sch("Quantitative study of the fixed threshold model for the regulation of division of labour in insect societies")})] },

  { child:true, eyebrow:"Part 2 · Family 3 · Deep dive", title:"Adaptive thresholds: specialists emerge", fig:"adapt",
    intro:{year:'1998',by:'Theraulaz, Bonabeau & Deneubourg',cell:'ST-SR-IA, continuous',problem:'let specialisation emerge from experience instead of being designed',note:'Theraulaz, Bonabeau and Deneubourg (1998) let thresholds change with experience: doing a task lowers your threshold for it, and not doing it raises it. Identical individuals then become specialists. On robots, Krieger, Billeter and Keller (2000) used fixed, individually different thresholds rather than adaptive ones (see the notes).'},
    math:[["doing j","θ<sub>ij</sub> ← θ<sub>ij</sub> − ξ Δt","learning"],["not doing j","θ<sub>ij</sub> ← θ<sub>ij</sub> + φ Δt","forgetting"],["bounds","θ<sub>min</sub> ≤ θ<sub>ij</sub> ≤ θ<sub>max</sub>",""]],
    bullets:[`Doing a task <b>lowers</b> your threshold for it; idling <b>raises</b> it`,`Identical robots become <b>specialists</b> without a planner`,`Capability is not measured; it is <b>grown</b> by repetition`],
    notesTitle:"Thresholds that learn",
    notes:`<p>The fixed model needs someone to choose thresholds. The adaptive model lets them drift. When robot <i>i</i> works on task <i>j</i>, <code>θ_ij</code> falls at rate <code>ξ</code> (learning); when it does not, <code>θ_ij</code> rises at rate <code>φ</code> (forgetting).</p>
<p><b>The figure</b> shows two robots that start with the same threshold for task A. Whoever happens to do A first lowers its threshold, so it becomes more likely to do A again. The other robot's threshold rises. A small random asymmetry is amplified into a stable division of labour.</p>
<p><b>Robot demonstrations.</b> Krieger et al. (2000) gave foraging Khepera robots <i>fixed</i> but individually different thresholds on the colony's energy level. The number of foragers adjusted itself, groups of intermediate size foraged most efficiently (interference hurt larger groups), and tandem recruitment between robots raised efficiency by about 9% when food was clustered. Robot thresholds that adapt with experience, as in the model above, were not part of that study. Note also that the robots received colony energy by radio from a control station.</p>
<p><b>An observation for later.</b> This is one of very few classic methods in which the robots' "capability profile" is not given in advance but forms during the run. The thresholds are a kind of learned row of the table, although they encode habit rather than skill: a robot becomes a specialist because it did the task, not because it was better at it.</p>`,
    refs:[ref("Theraulaz, Bonabeau & Deneubourg, Proc. Royal Society B 1998","Response threshold reinforcement and division of labour in insect societies",{Scholar:sch("Response threshold reinforcement and division of labour in insect societies")}),
          ref("Krieger, Billeter & Keller, Nature 2000","Ant-like task allocation and recruitment in cooperative robots",{Scholar:sch("Ant-like task allocation and recruitment in cooperative robots")})] },

  { child:true, eyebrow:"Part 2 · Family 3 · Deep dive", title:"ALLIANCE: impatience and acquiescence", fig:"alliance",
    intro:{year:'1998',by:'Parker',cell:'ST-SR-IA, heterogeneous and dynamic',problem:'keep a heterogeneous team working when robots fail or communication drops',note:'Parker designed ALLIANCE for small heterogeneous teams on real robots where any robot might fail and messages might be lost. Instead of negotiating, each robot broadcasts what it is doing and uses internal motivations to decide when to take over a task or give one up. L-ALLIANCE later added learning of the motivation parameters.'},
    math:[["motivation","m<sub>ij</sub>(t) = [m<sub>ij</sub>(t−1) + imp<sub>ij</sub>(t)]",""],["","× feedback × suppress × reset × acquiesce","0/1 gates"],["activate","m<sub>ij</sub>(t) ≥ θ","take the task"]],
    bullets:[`<b>Impatience</b>: a neglected task builds motivation until someone takes it`,`<b>Acquiescence</b>: a robot gives up a task it is failing at`,`Fault tolerance is built in; optimality is not guaranteed (greedy step, at least 2-competitive)`],
    notesTitle:"Motivations instead of messages",
    notes:`<p>Each robot <i>i</i> keeps a motivation <code>m_ij</code> for each task <i>j</i> it can do. Motivation grows by an impatience rate each step and is multiplied by gating factors that are either 0 or 1:</p>
<ul><li><b>sensory feedback:</b> is the task actually needed right now?</li>
<li><b>activity suppression:</b> am I already doing something else?</li>
<li><b>impatience reset:</b> has another robot just started this task?</li>
<li><b>acquiescence:</b> have I been doing this too long without progress?</li></ul>
<p>When motivation crosses the threshold <code>θ</code>, the robot takes the task.</p>
<p><b>The figure</b> follows robot B's motivation for "sweep". While robot A broadcasts that it is sweeping and making progress, B's impatience grows only slowly. When A stops making progress, B's impatience switches to a fast rate, motivation crosses <code>θ</code>, and B takes over. A, through acquiescence, will have stopped on its own.</p>
<p><b>Five-question reading.</b> Q2 is encoded in which behaviour sets a robot has and in its impatience rates. Q3 is never computed. Q5 is the design goal: failures are handled without anyone diagnosing them.</p>`,
    refs:[ref("Parker, IEEE Trans. Robotics and Automation 1998","ALLIANCE: An architecture for fault tolerant multirobot cooperation",{Scholar:sch("ALLIANCE: An architecture for fault tolerant multirobot cooperation")})] },

  { child:true, eyebrow:"Part 2 · Family 3 · Deep dive", title:"Swarms: design transition rates, not assignments", fig:"rates",
    intro:{year:'2009',by:'Berman, Halász, Hsieh & Kumar',cell:'ST-SR-IA, in aggregate',problem:'send a large swarm to sites in target proportions, without robot-to-robot communication',note:'Berman and colleagues considered swarms large enough that individual assignment is pointless. They model the swarm as population fractions moving between sites, and design the random switching rates of individual robots so that the population converges quickly to a desired distribution. The optimisation happens offline; each robot just follows its rates.'},
    math:[["dynamics","ẋ<sub>i</sub> = Σ<sub>j</sub> ( k<sub>ji</sub> x<sub>j</sub> − k<sub>ij</sub> x<sub>i</sub> )","flow in − flow out"],["compactly","ẋ = −K x","K = Lᵀ (rate Laplacian)"],["design","choose k ≥ 0 so x(t) → x<sub>d</sub> fast","offline optimisation"]],
    bullets:[`Model the swarm as <b>fractions at sites</b>, not individual robots`,`Each robot switches sites at random with <b>designed rates</b>`,`Allocation becomes <b>designing a Markov chain</b>`],
    notesTitle:"Allocation for very large teams",
    notes:`<p>With hundreds of robots, who-goes-where for each individual stops mattering; what matters is how many go to each site. Berman et al. describe the swarm by the fraction <code>x_i</code> of robots at site <i>i</i>. Each robot at site <i>i</i> moves to site <i>j</i> at random with rate <code>k_ij</code>. In the large-swarm limit, the fractions follow the linear equation <code>ẋ = −Kx</code>, where K has <code>−k_ji</code> off the diagonal and each site's total leaving rate on the diagonal.</p>
<p><b>The design problem.</b> Choose rates with <code>K x_d = 0</code> that maximise convergence speed (several formulations bound or optimise the eigenvalues of K), subject to a cap on how much robots keep switching once the target is reached; without that cap the rates would grow without bound. A central controller computes the rates offline and broadcasts them; robots do not communicate with each other.</p>
<p><b>The figure</b> shows a swarm that starts mostly at site 1 and must end with 20 / 30 / 50 percent across three sites.</p>
<p><b>Five-question reading.</b> Q1 is a target distribution. Q2 assumes robots are interchangeable. Q3 is replaced by the target. Q4 is a designed stochastic policy. Q5: if the target changes, new rates must be broadcast.</p>
<p><b>Why it belongs in this family.</b> Like threshold models, it gives up per-robot optimality for robustness and needs no robot-to-robot communication. Unlike them, it is designed with an explicit optimisation, which makes it a bridge back to Family 1.</p>`,
    refs:[ref("Berman, Halász, Hsieh & Kumar, IEEE Trans. Robotics 2009","Optimized stochastic policies for task allocation in swarms of robots",{Scholar:sch("Optimized stochastic policies for task allocation in swarms of robots")})] },

  { child:true, kind:"table", eyebrow:"Part 2 · Family 3 · Deep dive", title:"Four self-organising models side by side",
    table:{ head:["Model","Introduced","State","Rule","What you get","Best for"],
      rows:[["Fixed threshold","Bonabeau 1996","stimulus s<sub>j</sub>","engage w.p. T<sub>θ</sub>(s)","stable demand-driven response","recurring tasks, identical robots"],
            ["Adaptive threshold","Theraulaz 1998","s<sub>j</sub>, θ<sub>ij</sub>","θ learns and forgets","specialisation emerges","repeated tasks, no designed roles"],
            ["ALLIANCE","Parker 1998","motivations m<sub>ij</sub>","impatience, acquiescence","fault tolerance by design","small heterogeneous teams, failures"],
            ["Rate design","Berman 2009","fractions x","transition rates K","fast convergence to a target mix","large swarms across sites"]],
      hlCol:4 },
    notesTitle:"What this family trades",
    notes:`<p>All four replace an explicit utility table with a local rule plus feedback from the environment or teammates. They give up optimality and gain robustness, scalability, and little or no communication.</p>
<div class="key"><span class="lbl">Worth carrying forward</span>This is the only classic family in which (a) tasks are read from the environment rather than from a list, and (b) in the adaptive version, a robot's profile forms during the run. Both properties matter for a robot that joins a team mid-task and has to work out where it is useful. Part 4 returns to this.</div>`,
    refs:[] },
  { child:true, eyebrow:"Part 2 · Family 3 · Deep dive", title:"Agreement vs self-organisation", fig:"selforg",
    intro:{year:'2007 / 2009 / 2021',by:'Olfati-Saber et al.; Berman et al.; Park et al.',cell:'ST-SR-IA, decentralised',problem:'decide whether robots should coordinate by talking or through the shared environment',note:'The agreement family (2.3) and the self-organising family (2.4) are usually taught apart. Both are decentralised, both rest on local interaction, and both are analysed with the same tools: the swarm equations of Berman et al. (2009) have the same form as consensus dynamics (Olfati-Saber, Fax & Murray, 2007), and Park, Zhong and Leonard (2021) analyse task switching as a population game. The difference is what the robots exchange.'},
    math:[["consensus","ẋ = −L x","agree on a value"],["swarm","ẋ = −K x,  K = Lᵀ","settle on a mix"],["game view","rule = revision protocol","Park et al. 2021"]],
    bullets:[`Agreement: robots <b>exchange messages</b> until they hold the same plan`,`Self-organisation: robots <b>read the environment</b>, which every robot changes`,`Only self-organisation needs <b>no shared protocol</b>`],
    notesTitle:"Messages versus the environment",
    notes:`<p>Both families divide work without a central planner, and both work through local interaction. They differ in what is exchanged and in what "being consistent" means.</p>
<table class="cmp"><thead><tr><th></th><th>Agreement (2.3)</th><th>Self-organisation (2.4)</th></tr></thead><tbody>
<tr><td>What is exchanged</td><td>messages: bids, estimates, plans</td><td>nothing directly; robots sense stimuli that others change (Berman's robots sense nothing and follow fixed rates)</td></tr>
<tr><td>Where consistency comes from</td><td>the protocol: everyone converges to the same values</td><td>feedback: work lowers demand, unattended demand rises</td></tr>
<tr><td>Form of the result</td><td>a named assignment, robot by robot</td><td>stable proportions; who does what can churn</td></tr>
<tr><td>Optimality</td><td>bounds exist (CBBA, SSI, distributed LP)</td><td>usually none; stable, not optimal</td></tr>
<tr><td>Needs a shared protocol?</td><td>yes: message format, scoring rule, tie-breaking</td><td>no: only a shared world</td></tr></tbody></table>
<p><b>Overlap 1: the same equation.</b> In consensus, each robot moves toward its neighbours' values, <code>ẋ = −Lx</code>, where <i>L</i> is the graph Laplacian. In Berman et al.'s swarm model, the fraction of robots at each site follows <code>ẋ = −Kx</code>, where <code>k_ij</code> is the rate of switching from site <i>i</i> to site <i>j</i>. If you treat the rates as edge weights, <code>K = Lᵀ</code>, the transpose of the same kind of Laplacian: consensus conserves the average of the values (on a balanced graph), and the swarm conserves the number of robots. In both, the convergence speed is set by the spectrum of the same kind of matrix, which is why Berman et al. can tune the rates by optimising eigenvalues.</p>
<p><b>Overlap 2: the same equilibrium question.</b> Park, Zhong and Leonard (2021) model task allocation as a population game: each robot's task choice is a strategy, and its rule for switching tasks is a revision protocol. In the large-population limit the mean dynamics converge to the optimal stationary allocation, which is asymptotically stable. This gives a way to ask what a local response rule actually optimises, a question the threshold literature mostly leaves open.</p>
<div class="key"><span class="lbl">Why this matters for open teams</span>A team that can talk coordinates through messages, and with language models a newcomer from another builder may share that channel too (2.3.10). A team that cannot talk still shares the world: each robot can watch what work is left and what others are doing. Self-organisation is the only classic family that coordinates through that second channel and needs no shared protocol. Part 4 returns to the "talk" and "watch" channels.</div>`,
    refs:[ref("Olfati-Saber, Fax & Murray, Proceedings of the IEEE 2007","Consensus and cooperation in networked multi-agent systems",{Link:"https://murray.cds.caltech.edu/Consensus_and_Cooperation_in_Networked_Multi-Agent_Systems",Scholar:sch("Consensus and cooperation in networked multi-agent systems")}),
          ref("Berman, Halász, Hsieh & Kumar, IEEE Trans. Robotics 2009","Optimized stochastic policies for task allocation in swarms of robots",{Scholar:sch("Optimized stochastic policies for task allocation in swarms of robots")}),
          ref("Park, Zhong & Leonard, ICRA 2021","Multi-robot task allocation games in dynamically changing environments",{PDF:"https://naomi.princeton.edu/wp-content/uploads/sites/744/2022/01/ParkZhoLeoICRA2021.pdf",Scholar:sch("Multi-robot task allocation games in dynamically changing environments")})] },

  { eyebrow:"Part 2 · Family 4", title:"Learned policies", intro:{year:'2018 →',by:'Rashid et al.; Yu et al.',cell:'any cell, implicitly',problem:'coordinate when the dynamics are too complex to model by hand',note:'Cooperative MARL methods such as QMIX (2018) and MAPPO were developed and benchmarked on cooperative games, notably StarCraft II micromanagement, where who-does-what has to emerge from fast, complex dynamics. Learned schedulers (for example Wang & Gombolay, 2020) aim to replace slow MILP solving with a fast learned approximation. Both solve allocation when writing down the cost table or solving it exactly is too hard, provided a simulator is available for training.'},  fig:"marl",
    bullets:[`Train a policy that maps observations to who-does-what`,`MARL with centralised training (QMIX, MAPPO); graph networks for scheduling`,`<b>Assumes:</b> the reward encodes utility; test looks like training`,`Struggles when the <b>team itself</b> differs from training`],
    notesTitle:"Utility moves into the reward",
    notes:`<p>Learning-based methods replace the hand-written table with a trained policy. The utility of a pairing is no longer written down; it is implied by the reward the policy was trained on.</p>
<ul><li><b>Cooperative MARL</b> with centralised training and decentralised execution, for example value factorisation in QMIX (Rashid et al., 2018) or MAPPO (Yu et al., 2022).</li>
<li><b>Learned schedulers</b>, for example graph attention networks that learn to schedule multi-robot teams under temporal constraints (Wang &amp; Gombolay, 2020).</li></ul>
<p><b>Five-question reading.</b> Q1: fixed by the environment design. Q2: implicit in what the policy saw during training. Q3: implicit in the reward. Q4: the trained policy. Q5: handled only within the training distribution.</p>
<p><b>Strengths:</b> handles complex dynamics without writing a model, and runs fast once trained. <b>Weaknesses:</b> sample cost, interpretability, and generalisation to unseen team compositions. The last one is exactly what open-team and ad-hoc teamwork research is trying to fix.</p>`,
    refs:[ref("Rashid et al., ICML 2018","QMIX: Monotonic value function factorisation for deep multi-agent reinforcement learning",{arXiv:"https://arxiv.org/abs/1803.11485",Scholar:sch("QMIX monotonic value function factorisation")}),
          ref("Yu et al., NeurIPS 2022 Datasets & Benchmarks","The surprising effectiveness of PPO in cooperative multi-agent games",{arXiv:"https://arxiv.org/abs/2103.01955",Scholar:sch("The surprising effectiveness of PPO in cooperative multi-agent games")}),
          ref("Wang & Gombolay, IEEE RA-L 2020","Learning scheduling policies for multi-robot coordination with graph attention networks",{Scholar:sch("Learning scheduling policies for multi-robot coordination with graph attention networks")})] },

  { child:true, eyebrow:"Part 2 · Family 4 · Deep dive", title:"The model underneath: Dec-POMDPs and CTDE", fig:"dec",
    intro:{year:'2002',by:'Bernstein et al.',cell:'any cell, implicitly',problem:'a formal model of decentralised decisions under partial observation',note:'Bernstein, Givan, Immerman and Zilberstein (2002) defined the decentralised POMDP and showed that solving it optimally over a finite horizon is NEXP-complete for two or more agents, even when the agents together observe the full state, far harder than a single-agent POMDP. That result is why practical multi-agent learning relies on approximation, and why "centralised training, decentralised execution" (CTDE) became the standard compromise.'},
    math:[["model","⟨ I, S, {A<sub>i</sub>}, P, R, {Ω<sub>i</sub>}, O, γ ⟩",""],["policy","π<sub>i</sub>(a<sub>i</sub> | τ<sub>i</sub>)","acts on own history"],["max","E[ Σ<sub>t</sub> γ<sup>t</sup> R(s<sub>t</sub>, a<sub>t</sub>) ]","one shared reward"]],
    bullets:[`Allocation is not a separate step: <b>who-does-what emerges</b> from the policies`,`Optimal finite-horizon solving is <b>NEXP-complete</b>`,`CTDE: use full information while training, only local information while acting`],
    notesTitle:"Where the utility table went",
    notes:`<p>A Dec-POMDP has agents <i>I</i>, states <i>S</i>, an action set <code>A_i</code> and an observation set <code>Ω_i</code> per agent, transition <i>P</i>, observation model <i>O</i>, discount <code>γ</code>, and one shared reward <i>R</i>. Each agent acts on its own action–observation history <code>τ_i</code>. The team maximises expected discounted reward.</p>
<p><b>No explicit allocation.</b> There is no robot–task variable. If the reward pays for finished tasks, a good joint policy will divide the work, but the division is implicit in the actions. Utility lives in <i>R</i>, capability lives in <i>P</i> (what each robot's actions can achieve), and both are known only through samples from a simulator.</p>
<p><b>Why approximation.</b> Optimal finite-horizon Dec-POMDP solving is NEXP-complete (the result does not directly cover the discounted infinite-horizon objective above, which is no easier in practice). Deep MARL therefore trains approximate policies, usually with CTDE: during training a critic or mixer may use the true state and all agents' actions; at execution each robot uses only its own observations.</p>
<p><b>Five-question reading.</b> Q1 is fixed by how the environment is built. Q2 and Q3 are implicit and learned. Q4 is the policy. Q5 is handled only if training covered the change.</p>`,
    refs:[ref("Bernstein, Givan, Immerman & Zilberstein, Mathematics of Operations Research 2002","The complexity of decentralized control of Markov decision processes",{Scholar:sch("The complexity of decentralized control of Markov decision processes")}),
          ref("Oliehoek & Amato, Springer 2016","A Concise Introduction to Decentralized POMDPs (book)",{Scholar:sch("A Concise Introduction to Decentralized POMDPs Oliehoek Amato")})] },

  { child:true, eyebrow:"Part 2 · Family 4 · Deep dive", title:"Value factorisation: VDN and QMIX", fig:"qmix",
    intro:{year:'2018',by:'Sunehag et al.; Rashid et al.',cell:'any cell, implicitly',problem:'credit assignment from one shared reward, with decentralised greedy actions',note:'With a single team reward, an agent cannot tell how much its own action contributed. VDN (Sunehag et al., 2018) decomposed the team value into a sum of per-agent values. QMIX (Rashid et al., 2018) generalised the sum to any monotone mixing, still guaranteeing that each agent picking its own best action gives the team\'s best joint action. Both were benchmarked on cooperative StarCraft II micromanagement.'},
    math:[["VDN","Q<sub>tot</sub> = Σ<sub>i</sub> Q<sub>i</sub>(τ<sub>i</sub>, a<sub>i</sub>)",""],["QMIX","Q<sub>tot</sub> = f<sub>s</sub>(Q<sub>1</sub>, …, Q<sub>n</sub>)","f depends on state s"],["","∂Q<sub>tot</sub> / ∂Q<sub>i</sub> ≥ 0","monotone mixing"],["⇒","team argmax = each agent's own argmax","decentralised"]],
    bullets:[`Split the team value into <b>per-agent values</b> plus a mixer`,`<b>Monotone</b> mixing keeps decentralised greedy actions consistent`,`Cannot represent values where agents must <b>coordinate non-monotonically</b>`],
    notesTitle:"Learning a team value that splits",
    notes:`<p>Each agent learns <code>Q_i(τ_i, a_i)</code> from its own history. A mixing network combines them into <code>Q_tot</code>, which is trained against the shared reward.</p>
<ul><li><b>VDN</b> uses a plain sum.</li>
<li><b>QMIX</b> uses a mixing network whose weights are produced from the global state by a hypernetwork and constrained to be non-negative. This makes <code>Q_tot</code> monotone in every <code>Q_i</code>.</li></ul>
<p><b>Why monotonicity matters.</b> If <code>Q_tot</code> increases whenever any <code>Q_i</code> increases, then the joint action that maximises <code>Q_tot</code> is exactly each agent maximising its own <code>Q_i</code>. Agents can act greedily and independently at execution time while still acting as a team.</p>
<p><b>Limit.</b> Some coordination problems are not monotone: two robots each prefer task A individually, but the team is best off if one takes B. QMIX cannot represent all such value functions, which motivated later work (for example QTRAN and weighted QMIX).</p>
<p><b>Policy-gradient alternative.</b> MAPPO (Yu et al., 2022) trains decentralised PPO actors with a centralised value function and turned out to be a strong, simple baseline on the same benchmarks.</p>`,
    refs:[ref("Sunehag et al., AAMAS 2018","Value-decomposition networks for cooperative multi-agent learning",{arXiv:"https://arxiv.org/abs/1706.05296",Scholar:sch("Value-decomposition networks for cooperative multi-agent learning")}),
          ref("Rashid et al., ICML 2018","QMIX: Monotonic value function factorisation for deep multi-agent reinforcement learning",{arXiv:"https://arxiv.org/abs/1803.11485",Scholar:sch("QMIX monotonic value function factorisation")}),
          ref("Yu et al., NeurIPS 2022 Datasets & Benchmarks","The surprising effectiveness of PPO in cooperative multi-agent games",{arXiv:"https://arxiv.org/abs/2103.01955",Scholar:sch("The surprising effectiveness of PPO in cooperative multi-agent games")})] },

  { child:true, eyebrow:"Part 2 · Family 4 · Deep dive", title:"Learned schedulers on graphs", fig:"gnn",
    intro:{year:'2020',by:'Wang & Gombolay',cell:'ST-SR-TA (+XD)',problem:'MILP scheduling is too slow at scale; learn a fast approximation',note:'Gombolay\'s group had shown (Tercio, 2013) that exact MILP scheduling with temporal and spatial constraints is too slow for larger teams. Wang and Gombolay (2020) represented the scheduling problem as a graph of robots, tasks and timing constraints, and trained a graph attention network to pick robot–task pairs one at a time, aiming for near-solver quality at a fraction of the time.'},
    math:[["graph","G = (robots ∪ tasks, edges)","edges: travel, deadlines, precedence"],["score","q<sub>rt</sub> = MLP( h<sub>r</sub> ‖ h<sub>t</sub> )","after message passing"],["decode","schedule argmax q<sub>rt</sub>, update G, repeat","greedy, sequential"]],
    bullets:[`The problem instance <b>is</b> the input: a graph of robots, tasks, constraints`,`A GNN scores every (robot, task) pair; schedule the best, repeat`,`Trained by <b>imitation on small problems</b>, then applied to larger ones`],
    notesTitle:"Learning to imitate the solver",
    notes:`<p>Learned schedulers sit between Family 1 and Family 4. The problem is the same as 2.2.3 (who, in what order, and when, with deadlines and precedence), but instead of solving a MILP, a network learns to make good sequential choices.</p>
<p><b>Representation.</b> Timing constraints such as deadlines or "T2 before T4" form a simple temporal network (STN) over task start and finish events. ScheduleNet (Wang &amp; Gombolay, RSS 2020) adds robot nodes and proximity (location) nodes to the STN, so the graph's structure does not depend on the number of robots, tasks or locations. The figure is a simplified sketch of this idea. After several rounds of message passing, each node has an embedding <code>h</code> that reflects its neighbourhood.</p>
<p><b>Decoding.</b> A small network scores each (robot, task) pair. The highest-scoring pair is scheduled, the graph is updated, and the process repeats. This is the same greedy sequential structure as SSI auctions (2.3.2), with a learned bid.</p>
<p><b>Training.</b> ScheduleNet is trained by imitation learning on small problems and generalises to larger, unseen ones. The arXiv preprint of the graph-attention scheduling line (1912.02059) combines imitation learning on small problems with deep Q-learning on larger ones. Either way, graph networks handle different numbers of robots and tasks without retraining, which fixed-size MARL policies cannot.</p>
<p><b>Five-question reading.</b> Q1 to Q3 are still given explicitly in the graph. What is learned is Q4. This is a learned solver, not a learned utility.</p>`,
    refs:[ref("Wang & Gombolay, IEEE RA-L 2020","Learning scheduling policies for multi-robot coordination with graph attention networks",{arXiv:"https://arxiv.org/abs/1912.02059",Scholar:sch("Learning scheduling policies for multi-robot coordination with graph attention networks")}),
          ref("Wang & Gombolay, RSS 2020","Heterogeneous graph attention networks for scalable multi-robot scheduling with temporospatial constraints (ScheduleNet)",{Proceedings:"https://roboticsproceedings.org/rss16/p094.html",Scholar:sch("Heterogeneous graph attention networks for scalable multi-robot scheduling with temporospatial constraints")}),
          ref("Gombolay, Wilcox & Shah, RSS 2013","Fast scheduling of multi-robot teams with temporospatial constraints",{Scholar:sch("Fast scheduling of multi-robot teams with temporospatial constraints Gombolay")})] },

  { child:true, eyebrow:"Part 2 · Family 4 · Deep dive", title:"Where learned policies break: new teammates", fig:"shift",
    intro:{year:'2010 →',by:'Stone et al.; Rahman et al.',cell:'open teams',problem:'cooperate with teammates never seen in training',note:'Stone, Kaminka, Kraus and Rosenschein (AAAI 2010) posed the ad hoc teamwork challenge: build an agent that can collaborate with teammates it has no prior coordination with. Later work extended this to open teams, where agents join and leave during a task; Rahman and colleagues (ICML 2021) used graph-based policies that handle a changing number of teammates.'},
    math:[["train","teammates ~ 𝒟<sub>train</sub>",""],["deploy","teammates ~ 𝒟<sub>test</sub> ≠ 𝒟<sub>train</sub>",""],["gap","J(π; 𝒟<sub>train</sub>) − J(π; 𝒟<sub>test</sub>)","often large"]],
    bullets:[`MARL policies are tuned to the <b>teammates they trained with</b>`,`A new teammate or team size is a <b>distribution shift</b>`,`Ad hoc and open teamwork study exactly this gap`],
    notesTitle:"The connection to our work",
    notes:`<p>CTDE policies learn implicit conventions with their training partners: who goes left, who waits. When a partner behaves differently, or a new robot joins, those conventions can fail. In the figure, the policy does well with teammates like the ones it saw in training (blue region) and much worse with a new teammate outside that region. The bar heights are illustrative.</p>
<p><b>Two research lines address this.</b></p>
<ul><li><b>Ad hoc teamwork</b> (Stone et al., 2010): an agent must collaborate without prior coordination, typically by inferring a teammate's type from its behaviour and adapting.</li>
<li><b>Open teamwork</b> (for example GPL, Rahman et al., 2021): teammates join and leave during a task; graph-based policies handle a variable number of agents.</li></ul>
<p><b>In five-question terms,</b> this is Q2 and Q5 together: what can this teammate do, and what happens when the team changes. Learned allocation answers both only within its training distribution.</p>
<div class="key"><span class="lbl">Bridge to Part 3</span>The newcomer problem from Part 1 shows up here from the learning side. A learned policy has no explicit table to fill in, but it has the same missing information about the newcomer and the same need to obtain it while the team keeps working.</div>`,
    refs:[ref("Stone, Kaminka, Kraus & Rosenschein, AAAI 2010","Ad hoc autonomous agent teams: Collaboration without pre-coordination",{Scholar:sch("Ad hoc autonomous agent teams: Collaboration without pre-coordination")}),
          ref("Rahman, Höpner, Christianos & Albrecht, ICML 2021","Towards open ad hoc teamwork using graph-based policy learning",{Scholar:sch("Towards open ad hoc teamwork using graph-based policy learning")})] },

  { child:true, kind:"table", eyebrow:"Part 2 · Family 4 · Deep dive", title:"Four learned approaches side by side",
    table:{ head:["Approach","Introduced","What is learned","Execution","Needs","Breaks when"],
      rows:[["Value factorisation","VDN, QMIX 2018","Q<sub>i</sub> + monotone mixer","decentralised greedy","simulator, shared reward","coordination is non-monotone"],
            ["Policy gradient (CTDE)","MAPPO 2021–22","actors + central value","decentralised actors","simulator, many samples","partners differ from training"],
            ["Graph scheduler","Wang & Gombolay 2020","robot–task scoring","central, greedy decode","imitation of exact schedules on small problems","unseen constraint types"],
            ["Ad hoc / open-team policy","Stone 2010; GPL 2021","teammate models + policy","decentralised","diverse teammate population","teammates outside that population"]],
      hlCol:5 },
    notesTitle:"What learning changes, and what it does not",
    notes:`<p>Learning moves Q3 (and sometimes Q2) out of a hand-written table and into a reward and a simulator. That handles complex dynamics that no one could model by hand.</p>
<p>It does not remove the dependence on prior knowledge. The table is replaced by a training distribution, and everything the policy knows about capability and value comes from that distribution. The last column shows the shared failure mode: each approach breaks when deployment differs from training in the dimension it did not cover.</p>`,
    refs:[] },

  { eyebrow:"Part 2 · Family 5", title:"LLM planners", intro:{year:'2023 →',by:'Kannan et al.; Mandi et al.',cell:'ST-MR-TA with decomposition (toward CD)',problem:'turn a natural-language instruction into subtasks and assignments',note:'LLM planners appeared from 2023 for open-ended instructions, typically household tasks in simulators such as AI2-THOR, where no fixed task list exists. They offer another route to decomposition (Q1, and the CD level of iTax), which symbolic, hierarchical (HTN) and task-and-motion planners addressed earlier, and then form coalitions and assign subtasks from text descriptions of each robot.'},  fig:"llm",
    bullets:[`Tasks arrive in <b>natural language</b>; an LLM decomposes and assigns`,`SMART-LLM, RoCo, COHERENT`,`<b>Assumes:</b> capability can be read from a text description`,`Open-ended tasks, but <b>no grounding</b> of who can actually do what`],
    notesTitle:"Utility as commonsense",
    notes:`<p>The newest family uses large language models as the planner. A human states a goal in natural language, and the LLM breaks it into subtasks and decides which robot should do each one, usually from a text description of each robot's skills.</p>
<ul><li><b>SMART-LLM</b> (Kannan et al.): task decomposition, coalition formation and allocation, all through prompting.</li>
<li><b>RoCo</b> (Mandi et al.): robot arms that discuss and agree on a plan through dialogue, with environment feedback.</li>
<li><b>COHERENT</b>: an LLM framework for heterogeneous teams, such as arms, quadrupeds and drones.</li></ul>
<p><b>Five-question reading.</b> Q1: parsed from language, which is new and useful. Q2: read from a text description. Q3: the LLM's commonsense judgement. Q4: prompting and reasoning. Q5: re-prompt.</p>
<p><b>Strengths:</b> open-ended, compositional tasks that earlier families could not express. <b>Weaknesses:</b> capability is asserted, not measured, so feasibility can be hallucinated. There are also no optimality notion and real latency costs.</p>`,
    refs:[ref("Kannan, Venkatesh & Min, IROS 2024","SMART-LLM: Smart multi-agent robot task planning using large language models",{arXiv:"https://arxiv.org/abs/2309.10062",Scholar:sch("SMART-LLM smart multi-agent robot task planning using large language models")}),
          ref("Mandi, Jain & Song, ICRA 2024","RoCo: Dialectic multi-robot collaboration with large language models",{arXiv:"https://arxiv.org/abs/2307.04738",Scholar:sch("RoCo dialectic multi-robot collaboration with large language models")}),
          ref("Liu et al., 2024–25","COHERENT: Collaboration of heterogeneous multi-robot system with large language models",{Scholar:sch("COHERENT: Collaboration of heterogeneous multi-robot system with large language models")})] },

  { child:true, eyebrow:"Part 2 · Family 5 · Deep dive", title:"Prompt pipelines: SMART-LLM", fig:"smart",
    intro:{year:'2023',by:'Kannan, Venkatesh & Min',cell:'ST-MR-TA with decomposition',problem:'turn one natural-language instruction into a multi-robot plan',note:'SMART-LLM targeted household-style instructions in simulation (AI2-THOR), where there is no task list, only a sentence. It chains few-shot prompts through four stages: decompose the instruction, form coalitions by required skills, allocate subtasks to robots, and generate executable code that calls each robot\'s skills.'},
    math:[["input","instruction ℓ, skill list per robot",""],["stage 1","ℓ → subtasks { g<sub>1</sub>, …, g<sub>m</sub> }","decompose"],["stage 2–3","g<sub>k</sub> → coalition C<sub>k</sub> ⊆ robots","match skills"],["stage 4","plan → executable code","call robot APIs"]],
    bullets:[`A fixed chain of <b>few-shot prompts</b>, one per stage`,`Allocation = matching a subtask's <b>required skills</b> to robots' <b>listed skills</b>`,`No cost, no optimality: the plan is <b>feasible-looking</b>, not optimal`],
    notesTitle:"Allocation through prompting",
    notes:`<p>SMART-LLM is the clearest example of the pipeline style.</p>
<ol><li><b>Decompose:</b> the LLM turns the instruction into subtasks, for example "wash the apple and put it in the fridge" becomes pick, wash, open fridge, place.</li>
<li><b>Coalition formation:</b> for each subtask, decide which skills are needed and whether one robot has them all or several robots must work together.</li>
<li><b>Allocate:</b> assign subtasks to robots by matching required skills to each robot's skill list, which is given as text.</li>
<li><b>Execute:</b> generate code that calls the robots' skill functions in the right order, including parallel execution where possible.</li></ol>
<p><b>What is new.</b> Q1 is no longer assumed: the task list is produced from language. This is one route to the CD level of iTax, where decomposition is part of the decision; symbolic and HTN planners reached it earlier by other means.</p>
<p><b>What is missing.</b> Stage 3 matches skill names, not skill quality. There is no cost, so there is no notion of a better or worse allocation among feasible ones. If a skill list is wrong or incomplete, nothing in the pipeline finds out until execution.</p>`,
    refs:[ref("Kannan, Venkatesh & Min, IROS 2024","SMART-LLM: Smart multi-agent robot task planning using large language models",{arXiv:"https://arxiv.org/abs/2309.10062",Scholar:sch("SMART-LLM smart multi-agent robot task planning using large language models")})] },

  { child:true, eyebrow:"Part 2 · Family 5 · Deep dive", title:"Who talks to whom: central planner or dialogue", fig:"talk",
    intro:{year:'2023',by:'Mandi, Jain & Song; Chen et al.',cell:'ST-SR-TA / ST-MR-TA',problem:'coordinate peers that each know their own state; scale LLM planning to more robots',note:'RoCo (Mandi et al.) gave each robot arm its own LLM agent; the agents discuss and agree on subtasks and motion waypoints, and a motion planner checks the result and sends failures back. Chen et al. then compared centralised, decentralised and hybrid LLM architectures as the number of robots grows, looking at success rate and token cost.'},
    bullets:[`<b>Centralised:</b> one LLM sees everything and plans for all robots`,`<b>Dialogue:</b> each robot's LLM argues its own case until they agree`,`Both rely on a <b>checker</b> (motion planner, simulator) to catch infeasible plans`,`A <b>central plan + local feedback</b> hybrid scaled best in comparisons`],
    notesTitle:"Architectures for LLM teams",
    notes:`<p><b>RoCo</b> (Mandi et al., ICRA 2024) uses dialogue. Each arm has an LLM agent that knows its own reach and state. Agents take turns proposing who does what, then propose motion waypoints. A motion planner checks for collisions and reachability; errors are fed back into the conversation and the agents revise the plan. The paper also introduced RoCoBench.</p>
<p><b>Chen et al.</b> (ICRA 2024) compared four structures as the team grows: a fully centralised planner, a fully decentralised dialogue, and two hybrids in which a central plan is refined by local feedback. Their findings:</p>
<ul><li><b>Success and scaling:</b> the hybrid in which per-robot LLMs give feedback to a central planner (HMAS-2) had the highest success rate on all four tasks and scaled best as robots were added.</li>
<li><b>Centralised (CMAS):</b> the most token-efficient and competitive with few robots, but it scales significantly worse.</li>
<li><b>Fully decentralised dialogue (DMAS):</b> the lowest success rate and the most API calls and tokens.</li></ul>
<p><b>Five-question reading.</b> In dialogue, Q2 is partly grounded, because each agent describes its own state. Q4 is negotiation in natural language, a loose analogue of an auction without numeric bids. Q5 is handled by re-planning after feedback.</p>`,
    refs:[ref("Mandi, Jain & Song, ICRA 2024","RoCo: Dialectic multi-robot collaboration with large language models",{arXiv:"https://arxiv.org/abs/2307.04738",Scholar:sch("RoCo dialectic multi-robot collaboration with large language models")}),
          ref("Chen et al., ICRA 2024","Scalable multi-robot collaboration with large language models: Centralized or decentralized systems?",{arXiv:"https://arxiv.org/abs/2309.15943",Scholar:sch("Scalable multi-robot collaboration with large language models: Centralized or decentralized systems?")})] },

  { child:true, eyebrow:"Part 2 · Family 5 · Deep dive", title:"LLM + formal solver: let each do what it is good at", fig:"hybrid",
    intro:{year:'2023 →',by:'Liu et al.; Zhang et al.',cell:'ST-MR-TA (toward CD)',problem:'combine language understanding with the guarantees of a classical planner',note:'LLM+P (Liu et al., 2023) showed that LLMs plan poorly on their own but can translate a natural-language problem into PDDL reliably enough for a classical planner to solve it optimally. LaMMA-P (Zhang et al., 2024) applied this to heterogeneous multi-robot teams: an LLM handles decomposition and allocation by skill, and a PDDL planner produces each robot\'s plan.'},
    math:[["translate","ℓ → ( domain, problem ) in PDDL","LLM"],["solve","plan = Planner( domain, problem )","classical, complete"],["allocate","subtasks → robots by skill","LLM or solver"]],
    bullets:[`The LLM writes the <b>problem</b>; a classical planner or solver writes the <b>plan</b>`,`Recovers solver guarantees, <b>conditional on the spec being right</b>`,`Closes the loop back to Family 1`],
    notesTitle:"Language in, guarantees out",
    notes:`<p>A natural division of labour: LLMs are good at turning loose language into structure, while classical planners and solvers are good at searching structured problems correctly.</p>
<ul><li><b>LLM+P</b> (Liu et al., 2023, single agent): the LLM translates the problem into PDDL, a classical planner finds an optimal plan, and the LLM translates it back.</li>
<li><b>LaMMA-P</b> (Zhang et al., 2024): for heterogeneous multi-robot teams, LLM modules decompose the task and assign subtasks by skill, a PDDL planner generates the plans, and the results are validated and combined.</li></ul>
<p><b>Why this matters for the overall story.</b> This is Family 1 with an LLM front end. The LLM answers Q1 (what the tasks are) and asserts Q2 (who can do what), and the solver answers Q4. The utility table is still built before solving; it is just built from language instead of by an engineer.</p>
<p><b>Failure mode.</b> If the generated spec is wrong, for example a robot is declared able to open doors when it cannot, the planner will return a perfectly valid plan for the wrong problem.</p>`,
    refs:[ref("Liu et al., 2023","LLM+P: Empowering large language models with optimal planning proficiency",{arXiv:"https://arxiv.org/abs/2304.11477",Scholar:sch("LLM+P: Empowering large language models with optimal planning proficiency")}),
          ref("Zhang et al., 2024","LaMMA-P: Generalizable multi-agent long-horizon task allocation and planning with LM-driven PDDL planner",{arXiv:"https://arxiv.org/abs/2409.20560",Scholar:sch("LaMMA-P generalizable multi-agent long-horizon task allocation and planning")})] },

  { child:true, eyebrow:"Part 2 · Family 5 · Deep dive", title:"Heterogeneous teams: capability by trial and error", fig:"ground",
    intro:{year:'2024',by:'Liu et al. (COHERENT)',cell:'ST-MR-TA, heterogeneous',problem:'allocate across arms, quadrupeds and drones whose abilities differ sharply',note:'COHERENT targets teams of very different robots, such as manipulator arms, quadrupeds and drones. A central LLM proposes assignments, robots execute and report back, and the LLM adjusts. This proposal–execution–feedback–adjustment loop is how the system corrects assignments that looked fine in text but fail physically.'},
    bullets:[`Capability is <b>declared in text</b>, then <b>corrected by failure</b>`,`A propose → execute → feedback → adjust loop fixes bad assignments`,`Nothing measures <b>how well</b> a robot does a task, only whether it fails`],
    notesTitle:"The grounding problem",
    notes:`<p>In heterogeneous teams, mistakes about capability are obvious and costly: asking a drone to open a fridge, or a quadruped without an arm to pick something up. LLM planners read capability from a text description, so they can make exactly these mistakes.</p>
<p><b>COHERENT</b> (Liu et al., 2024) addresses this with a Proposal–Execution–Feedback–Adjustment (PEFA) loop for teams of quadrotors, robot dogs and arms. A central task assigner decomposes the task and proposes assignments; each robot's executor picks a feasible action and returns self-reflection feedback; the assigner adjusts, and the loop repeats until the task is done. The paper also introduces a 100-task heterogeneous benchmark. In the figure, "open fridge → drone" fails because the drone has no gripper, and the subtask is reassigned to the arm.</p>
<p><b>What this shows.</b> Feedback loops make LLM allocation more robust, but the knowledge gained is binary: did it fail or not. There is no estimate of how well, how fast or how reliably each robot does each task, which is exactly the content of the utility table in Family 1.</p>
<p><b>Five-question reading.</b> Q1 from language, Q2 asserted and then patched by failures, Q3 still absent, Q4 by the LLM, Q5 through the feedback loop.</p>`,
    refs:[ref("Liu et al., 2024","COHERENT: Collaboration of heterogeneous multi-robot system with large language models",{arXiv:"https://arxiv.org/abs/2409.15146",Scholar:sch("COHERENT: Collaboration of heterogeneous multi-robot system with large language models")})] },

    table:{ head:["Pattern","Example","LLM does","Who checks feasibility","Strength","Weakness"],

            ["Dialogue","RoCo 2023; Chen et al. 2023","negotiate who does what","motion planner, environment","each agent grounds its own state","token cost grows with team size"],

      hlCol:3 },
    notesTitle:"What LLMs added, and what they still assume",
    notes:`<p>LLM planners are the first family to address <b>Q1</b> head-on: tasks come from language, and decomposition is part of the decision. That is a real advance over every earlier family.</p>
<p>For <b>Q2 and Q3</b>, they rely on text: a robot is assumed to be able to do what its description says. The highlighted column shows how each pattern deals with that: by not checking, by asking a motion planner, by trusting the spec, or by learning from failures.</p>
<div class="key"><span class="lbl">Bridge to the summary</span>Across all five families, capability and utility are either given, priced by the robot itself, encoded in thresholds, implicit in training, or read from text. None measures them from the team's own ongoing work. That is the thread Part 3 picks up.</div>`,
    refs:[] },

  { kind:"table", eyebrow:"Part 2 · Summary", title:"Same five questions, five answers",
    table:{ head:["Family","Q1 Tasks","Q2 Capability","Q3 Utility","Q4 Mechanism","Q5 Dynamics"],
      rows:[["Centralized","given list","given model","computed from model","exact / approx. solver","re-solve"],
            ["Distributed agreement","announced or shared","each robot knows itself","own bid, score or utility","auction, consensus, distributed solver, equilibrium","re-run the agreement"],
            ["Self-organising","sensed as stimuli","encoded in thresholds","none explicit","local rule","adapts on its own"],
            ["Learned","fixed by environment","implicit in training","implicit in reward","trained policy","within training distribution"],
            ["LLM","parsed from language","read from text","commonsense guess","prompting","re-prompt"]],
      givenCols:[1,2,3], hlCol:4 },
    notesTitle:"What the comparison shows",
    notes:`<p>Reading across the table:</p>
<ul><li><b>Q4 is where the families really differ.</b> Solvers, auctions, local rules, trained policies and prompts are different answers to "who decides, and how" (highlighted).</li>
<li><b>Q1 to Q3 are mostly answered by assumption</b> (blue text): a given list, a given model, or a robot that already knows itself. The exceptions are informative: thresholds read tasks from the environment, and LLMs read tasks from language. Some methods do update capability or utility from outcomes (adaptive allocation, Emam et al. 2020; unknown-reward allocation, CMTAB 2023; see 2.7).</li>
<li><b>Q5 is often "do Q4 again".</b> Threshold methods adapt continuously and give up optimality to do it; online and repair methods (OPAT, D-ITAGS) also revise decisions during execution (2.7).</li></ul>
<div class="key"><span class="lbl">Read with 2.7</span>This table compares families at the level of typical assumptions. Individual methods often depart from their family's row; 2.7 lists concrete counterexamples, and Part 3 asks under which precise assumptions existing approaches stop answering a question.</div>`,
    refs:[] },
 ]},
 {id:"p3", label:"Part 3", title:"Candidate gaps, derived from first principles", slides:[
  { eyebrow:"Part 3 · Method", title:"Deriving gaps instead of listing them", fig:"method",
    bullets:[`A gap list written from experience <b>reflects the writer</b>: what they read, what they want to work on`,`Instead: start from the <b>most general model</b> of the problem and relax each assumption in turn`,`Then <b>audit</b> the model against eleven outside lists, so blind spots show up`,`Every gap must say <b>which assumption</b> it relaxes and <b>who has already tried</b>`],
    notesTitle:"Why derive, and how",
    notes:`<p>Part 2 ended with a strong observation: across all five families, capability and utility are given, self-priced, encoded in thresholds, implicit in training, or read from text, and rarely measured from the team's ongoing work. (The revised reading in 2.7 lists exceptions such as adaptive and unknown-reward allocation.) That observation came from looking at five families through five questions. A neutral survey needs more than that, because the five questions were themselves an intuition, and a list of gaps built on an intuition inherits its blind spots.</p>
<p>This part therefore follows four explicit steps:</p>
<ol><li><b>Write the general model.</b> Treat allocation as an instance of a team decision problem and list everything such a problem contains.</li>
<li><b>State the classical idealisation.</b> For each element, write down what classical MRTA assumes, and the ways reality can depart from it. Each departure is an axis.</li>
<li><b>Audit.</b> Take the open problems listed by taxonomies and surveys, inside MRTA and in neighbouring fields, and map each onto an element. An item that fits nowhere means the model is missing something, and the model is extended.</li>
<li><b>Check the literature.</b> For each axis, find work that relaxes it on its own; then look at pairs of axes, where unexplored combinations tend to hide. Only what survives this check is called a gap.</li></ol>
<div class="key"><span class="lbl">Ground rules</span>The part stays neutral: gaps are ranked by how common the situation is and how thin the literature is, not by fit to any research plan. Every gap names the assumption it relaxes. Every "nobody has done this" claim records how it was checked: full text, abstract, or title only.</div>
<p>This page and the next three cover steps 1 to 3. Steps 4 onward are listed in the sidebar as coming next.</p>`,
    refs:[] },

  { eyebrow:"Part 3 · Step 1", title:"The general model: a team decision problem", fig:"model",
    bullets:[`A team: <b>one shared objective</b>, members who know and control different things`,`Four elements describe <b>the world</b>, one the <b>objective</b>, three <b>who knows and decides</b>`,`One more sits <b>below the allocator</b>: whether its output can be executed`,`Classical MRTA fixes all nine at their simplest setting`],
    notesTitle:"Nine elements",
    notes:`<p>A multi-robot team allocating work is a <b>team decision problem</b> in the sense of Marschak and Radner: several decision makers share one objective but hold different information and control different actions. The Dec-POMDP from 2.5.1 is a formal version of the same structure. Reading the elements off that structure:</p>
<ul><li><b>E1 Agents</b> (the agent set): who is on the team, and whether that changes.</li>
<li><b>E2 Tasks</b> (part of the state and reward): what must be done, and how it becomes known.</li>
<li><b>E3 Dynamics</b> (the transition model): what each robot's actions achieve. Capability lives here.</li>
<li><b>E4 Interaction</b> (how transitions and rewards factor): how robots' actions affect each other.</li>
<li><b>E5 Objective</b> (the reward and its aggregation over time): what counts as good.</li>
<li><b>E6 Information</b> (observations and communication): who observes what, and at what cost.</li>
<li><b>E7 Control</b> (whose policies are designed): who decides for whom, and whether they cooperate.</li>
<li><b>E8 Timing</b>: when decisions are made and how much computation is available.</li>
<li><b>E9 Execution</b>: whether an allocation, expressed in abstract tasks, can be carried out by the motion and manipulation layers below.</li></ul>
<p><b>A caveat on completeness.</b> E1 to E7 come directly from the decision-problem structure. E8 and E9 are not part of that formal structure; they are added because a real allocator is a computation running on top of physical execution. Step 3 tests whether anything else is missing.</p>`,
    refs:[ref("Marschak & Radner, Yale University Press 1972","Economic Theory of Teams (book)",{Scholar:sch("Marschak Radner Economic Theory of Teams")}),
          ref("Ho, Proceedings of the IEEE 1980","Team decision theory and information structures",{Scholar:sch("Ho Team decision theory and information structures 1980")}),
          ref("Bernstein, Givan, Immerman & Zilberstein, Mathematics of Operations Research 2002","The complexity of decentralized control of Markov decision processes",{Scholar:sch("The complexity of decentralized control of Markov decision processes")})] },

  { child:true, eyebrow:"Part 3 · Step 1", title:"What the five questions underweighted", fig:"qmap",
    bullets:[`Q1, Q2 and Q5 map cleanly onto <b>one element each</b>`,`Q3 hid the <b>objective</b> (E5) inside "utility"`,`Q4 lumped <b>information, control and timing</b> (E6–E8) into "mechanism"`,`<b>Execution</b> (E9) had no question at all`],
    notesTitle:"Checking Part 1 against the model",
    notes:`<p>The five questions of Part 1 were a useful first cut, but laid against the nine elements they are uneven:</p>
<ul><li><b>Clean matches:</b> Q1 Tasks ↔ E2, Q2 Capability ↔ E3, Q5 Dynamics ↔ E1 (team changes), with drift in E3 as a second link.</li>
<li><b>Q3 Utility</b> covered E4 (how pairings interact) but only implied E5. "What a pairing is worth" already presumes an objective; whether that objective is makespan, throughput or risk was never asked.</li>
<li><b>Q4 Mechanism</b> merged three different things: what each robot can observe (E6), who is allowed to decide for whom (E7), and how much time there is to decide (E8).</li>
<li><b>E9 Execution</b> had no question. The five questions assumed that an allocation, once chosen, can be executed.</li></ul>
<p>This is the first concrete result of deriving rather than listing: four of the nine elements were only implicit in the framing used so far. Any gap that lives in E5 to E9 would have been easy to miss.</p>`,
    refs:[] },

  { child:true, eyebrow:"Part 3 · Step 1", title:"Four groups of elements, and the lens for each", fig:"groups",
    bullets:[`The ten elements form <b>four groups</b>, each asking one plain question`,`① what is unknown · ② what counts as help · ③ who knows and who decides · ④ how it runs`,`Part 4 follows the <b>same four groups</b>: each lens answers one of them`,`Codes such as E4d or P2 are labels; <b>hover</b> any code for its meaning`],
    notesTitle:"One frame for Parts 3 and 4",
    notes:`<p>Ten elements and thirty-eight sub-axes are too many to hold in mind one by one. They fall into four groups, each answering a plain question about a running team. The elements are numbered so that each group is contiguous, and the same four groups organise the lenses of Part 4, so a sub-axis met in Part 3 points directly to the place where Part 4 discusses a response.</p>
<table class="cmp"><thead><tr><th>Group</th><th>Question it asks</th><th>Elements (Part 3)</th><th>Lenses (Part 4)</th></tr></thead><tbody>
<tr><td>① Unknowns</td><td>What about the team, the tasks and the robots' abilities is not known in advance?</td><td>E1 Agents · E2 Tasks · E3 Dynamics (3.5–3.7)</td><td>P1 Information acquisition (4.3)</td></tr>
<tr><td>② Value</td><td>What counts as useful help: a better one-shot score, higher throughput, or no harm to what already works?</td><td>E4 Interaction · E5 Objective (3.8–3.9)</td><td>P2 Flow and bottlenecks (4.4) · P3 Conservative improvement (4.5)</td></tr>
<tr><td>③ Knowledge &amp; authority</td><td>What can each robot observe or ask, and whose behaviour may it change?</td><td>E6 Information · E7 Control (3.10–3.11)</td><td>P4 Controlled agent's view (4.6) · P5 Coordination interfaces (4.7)</td></tr>
<tr><td>④ Operation &amp; design</td><td>When must decisions be made, how are they executed, and can the system itself be changed?</td><td>E8 Timing · E9 Execution · E10 System design (3.12–3.14)</td><td>P6 System and incentive design (4.8); execution and planning in 4.11</td></tr>
</tbody></table>
<p><b>Why these four.</b> They follow the order in which a newcomer to a running team meets its problems: first it does not know enough (①), then it must decide what would actually help (②), then it finds that it can observe and change only part of the team (③), and finally its decisions have to be timed and executed, or the system redesigned (④). The grouping is a reading aid, not a further claim about the model; E10 was added only after the completeness audit (3.4.2).</p>
<p><b>Lenses touch more than one group.</b> Each lens is placed by its main group. The controlled agent's view (P4) also concerns unknown teammates (E1b), and information acquisition (P1) also concerns the cost of information (E6d). 4.2 lists all the related sub-axes.</p>
<div class="key"><span class="lbl">How to navigate</span>The coloured chips at the top of each page in Parts 3 and 4 show the current group; the same colours mark the table of contents. Hovering an E or P code shows its meaning and links to its page.</div>`,
    refs:[] },

  { kind:"table", eyebrow:"Part 3 · Step 2", title:"The classical corner, and the ways out of it",
    table:{ dense:true, head:["Element","Classical MRTA assumes","Ways reality departs (sub-axes)"],
      rows:[["E1 Agents","fixed, known robots","members join and leave · teammates of unknown type · humans on the team · many heterogeneous types"],
            ["E2 Tasks","a given batch, already decomposed","tasks arrive as a stream · must be discovered by sensing · must be decomposed · requirements unknown"],
            ["E3 Dynamics","known, static, deterministic","capability unknown · capability drifts (wear, battery) · execution fails at random · environment unknown"],
            ["E4 Interaction","pairings are independent (ND)","temporal coupling (precedence, sync) · interference and congestion · non-additive team value · allocation reshapes the system"],
            ["E5 Objective","one scalar per episode (makespan, cost)","long-run throughput · risk or no-harm limits · several objectives, fairness · human preferences"],
            ["E6 Information","global state, or each robot knows itself","partial local observation · limited communication · self-knowledge uncertain · information costs time to acquire"],
            ["E7 Control","one designer controls every robot","only some robots controllable · teammates that adapt · self-interested agents · authority shared with humans"],
            ["E8 Timing","solve offline, no time limit","decide in real time · decide while executing · computation grows with team size"],
            ["E9 Execution","every allocation is executable","path conflicts (MAPF) · manipulation feasibility · plans drift during execution"]],
      hlCol:1 },
    notesTitle:"Thirty-four ways out of one corner",
    notes:`<p>Classical MRTA sits in one corner of the space: every element at its simplest setting (middle column). Each entry in the right column is one way reality departs from that corner, and each is an axis along which a method can be more or less realistic.</p>
<p>Where the sub-axes come from:</p>
<ul><li>Most are direct negations of the classical assumption: "fixed team" becomes "members join and leave".</li>
<li>Some come from Part 2, where a family already moved along them: tasks sensed as stimuli (thresholds), decomposition from language (LLMs), local observation (Dec-POMDPs), temporal coupling (scheduling MILPs).</li>
<li>A few come from Part 1's three ways the table breaks: "information costs time to acquire" (Uncertain) and "allocation reshapes the system" (Coupled).</li></ul>
<p>The list is a starting point, not a final answer. The next two pages test it in two ways: which families have already left the corner along which elements (3.3.1), and whether outside lists of open problems contain anything this table cannot express (3.4).</p>`,
    refs:[] },

  { child:true, eyebrow:"Part 3 · Step 2", title:"Where each family has already left the corner", fig:"coverage",
    bullets:[`Each family relaxes <b>two to five</b> elements and keeps the rest ideal`,`<b>E5 Objective</b> and <b>E9 Execution</b> are almost untouched`,`Many dots are only <b>half filled</b>: relaxed in a limited way`,`A full dot here is <b>not</b> "solved": it means the family engages the element`],
    notesTitle:"Reading the coverage matrix",
    notes:`<p>The matrix summarises Part 2 element by element. A full dot means the family's core idea relaxes that element; a half dot means it does so in a limited way; an empty dot means it keeps the classical assumption.</p>
<ul><li><b>Centralised optimisation</b> engages E4 seriously (temporal constraints, coalitions) and lets the objective vary somewhat (sum, makespan, bottleneck). Everything else stays ideal.</li>
<li><b>Markets</b> engage E6: each robot holds private knowledge of its own costs, and CBBA works with local communication. They partly handle robot loss and task arrival (re-auction), marginal-cost coupling, and distributed control, but assume cooperative, honest bidders.</li>
<li><b>Self-organising allocation</b> engages E1 (robot loss), E2 (tasks sensed as stimuli), E6 (local information only) and E8 (instant local rules), and partly E3 through adaptive thresholds.</li>
<li><b>Learned policies</b> engage E3 (dynamics learned from a simulator), E4 (coupling absorbed into the value function) and E6 (partial observability), and partly E1 and E7 through ad hoc and open-team work.</li>
<li><b>LLM planners</b> engage E2 (tasks from language, decomposition) and partly E6 and E9 (dialogue, motion-planner checks).</li></ul>
<p><b>Two columns stand out.</b> E5 (what the team optimises) is varied only within classical cost functions, and E9 (execution) is touched only through feasibility checks. These are candidates for thin literature, to be tested in step 4 rather than assumed.</p>
<p><b>Caution.</b> These ratings are judgements made from the methods reviewed in Part 2, not a census. Specialist literatures not covered in Part 2, such as stochastic task allocation, task allocation with path finding, or human–robot allocation, will be checked axis by axis.</p>`,
    refs:[] },

  { kind:"table", eyebrow:"Part 3 · Step 3", title:"Completeness audit: MRTA taxonomies and surveys",
    table:{ head:["Source","Evidence","Items","Mapped to"], rows:auditRows("mrta"), hlCol:3 },
    notesTitle:"What MRTA's own surveys say is open",
    notes:`<p>Each open problem or stated limitation from these sources was mapped to the element (or two) it concerns. Items about the methods themselves, rather than the problem, are mapped to cross-cutting themes in italics. The full mapping:</p>${auditNotes("mrta")}
<p><b>Access limits, and an update.</b> When this audit was first run, Korsah et al. (2013) and Seenu et al. (2020) could only be read at abstract level, and Chakraa et al. (2023, RAS) and Quinton et al. (2023, JIRS, markets) could not be accessed. All four were later read in full (October 2026). Their open problems map onto the model: Chakraa et al. raise complexity and scalability (E8), fairness (E5c), dynamic allocation under uncertainty (E2a, E3), communication errors and limits (E6b), collision avoidance and kinematic constraints (E9) and the sim-to-real gap (evaluation). Quinton et al. raise cross-schedule dependencies and multi-robot tasks (E4a, E1d), communication loss (E6b), tasks appearing and vehicles leaving to refill (E2a, E1a), human–robot teams (E1c, E7d), bid design (E5), weak guarantees, distributed cost (E8c) and reproducibility. Seenu et al. add runtime scaling in robots and tasks (E1a, E2a), auctioneer failure (E7), multi-objective fitness (E5c) and exploration alongside path planning (E9, E3d). No new element is needed; the counts on the next slide predate this update. Aziz et al. (2022) has no explicit open-problems section, so its items are stated limitations treated as open problems.</p>`,
    refs:[ref("Khamis, Hussein & Elmogy, Springer 2015","Multi-robot task allocation: A review of the state-of-the-art",{Springer:"https://link.springer.com/chapter/10.1007/978-3-319-18299-5_2",Scholar:sch("Multi-robot task allocation: A review of the state-of-the-art Khamis")}),
          ref("Korsah, Stentz & Dias, IJRR 2013","A comprehensive taxonomy for multi-robot task allocation",{Scholar:sch("A comprehensive taxonomy for multi-robot task allocation Korsah Stentz Dias")}),
          ref("Nunes, Manner, Mitiche & Gini, Robotics and Autonomous Systems 2017","A taxonomy for task allocation problems with temporal and ordering constraints",{Preprint:"https://www-users.cse.umn.edu/~gini/papers/NunesRAS.pdf",Scholar:sch("A taxonomy for task allocation problems with temporal and ordering constraints Nunes Gini")}),
          ref("Aziz, Pal, Pourmiri, Ramezani & Sims, Current Robotics Reports 2022","Task allocation using a team of robots",{arXiv:"https://arxiv.org/abs/2207.09650",Scholar:sch("Task allocation using a team of robots Aziz")}),
          ref("Seenu, Kuppan Chetty, Ramya & Janardhanan, Industrial Robot 2020","Review on state-of-the-art dynamic task allocation strategies for multiple-robot systems",{Scholar:sch("Review on state-of-the-art dynamic task allocation strategies for multiple-robot systems")}),
          ref("Chakraa, Guérin, Leclercq & Lefebvre, RAS 2023 (read after the audit)","Optimization techniques for multi-robot task allocation problems: Review on the state-of-the-art",{Scholar:sch("Optimization techniques for Multi-Robot Task Allocation problems: Review on the state-of-the-art")}),
          ref("Quinton, Grand & Lesire, J. Intelligent & Robotic Systems 2023 (read after the audit)","Market approaches to the multi-robot task allocation problem: a survey",{Springer:"https://link.springer.com/article/10.1007/s10846-022-01803-0",Scholar:sch("Market approaches to the multi-robot task allocation problem: a survey")})] },

  { child:true, kind:"table", eyebrow:"Part 3 · Step 3", title:"Completeness audit: neighbouring fields",
    table:{ head:["Source","Evidence","Items","Mapped to"], rows:auditRows("adj"), hlCol:3 },
    notesTitle:"What neighbouring fields say is open",
    notes:`<p>Neighbouring fields see the same problem from different sides: heterogeneous multi-robot systems, ad hoc teamwork, LLM-based multi-robot systems, human–robot task allocation, and multi-agent path finding and pickup-and-delivery. The last row is the RSS/CoRL 2024–2026 scan kept in this project. The full mapping:</p>${auditNotes("adj")}
<p><b>Notes on sources.</b> The human–robot source is a short symposium review rather than a large survey; no larger open-access survey was found. For path finding, the agenda paper by Salzman and Stern was used because it lists open problems explicitly. The LLM survey's open problems come from its 2026 version (v5).</p>`,
    refs:[ref("Rizk, Awad & Tunstel, ACM Computing Surveys 2019","Cooperative heterogeneous multi-robot systems: A survey",{Scholar:sch("Cooperative heterogeneous multi-robot systems: A survey Rizk")}),
          ref("Mirsky et al., 2022","A survey of ad hoc teamwork research",{arXiv:"https://arxiv.org/abs/2202.10450",Scholar:sch("A survey of ad hoc teamwork research")}),
          ref("Li, An, Abrar & Zhou, 2025 (v5 2026)","Large language models for multi-robot systems: A survey",{arXiv:"https://arxiv.org/abs/2502.03814",Scholar:sch("Large Language Models for Multi-Robot Systems: A Survey")}),
          ref("Ali, Tilbury & Robert, AAAI Fall Symposium (AI-HRI) 2022","Considerations for task allocation in human-robot teams",{arXiv:"https://arxiv.org/abs/2210.03259",Scholar:sch("Considerations for task allocation in human-robot teams")}),
          ref("Salzman & Stern, AAMAS 2020 (Blue Sky)","Research challenges and opportunities in multi-agent path finding and multi-agent pickup and delivery problems",{PDF:"https://aamas.csc.liv.ac.uk/Proceedings/aamas2020/pdfs/p1711.pdf",Scholar:sch("Research challenges and opportunities in multi-agent path finding and multi-agent pickup and delivery problems")})] },

  { child:true, eyebrow:"Part 3 · Step 3", title:"What the audit changed", fig:"audit",
    bullets:[`Every problem-level item fits an element, except one: <b>system design</b>, now <b>E10</b>`,`<b>E9 Execution</b> is raised by only one source: thin attention, not necessarily thin need`,`Four themes concern <b>methods, not problems</b>; they are kept as cross-cutting`,`Some items already name <b>pairs</b> of elements: early pointers for step 4`],
    notesTitle:"Results of the audit",
    notes:`<p>Fifty-seven items from eleven sources were mapped. The bar chart counts how many items touch each element.</p>
<p><b>1. One new element.</b> Salzman and Stern ask for the warehouse layout and fleet size that maximise throughput. That is not a property of allocation inside a given system; it treats the system itself as a design variable. Rizk et al.'s "balancing scalability against heterogeneity" points the same way. This becomes <b>E10 System design</b>: fleet composition, layout and environment.</p>
<p><b>2. Uneven attention.</b> E6 (13 items) and E8 (12) are raised most often, followed by E1 and E3 (10 each). E9 Execution appears once (Rizk et al.: modules are studied in isolation); the later full-text reading adds Chakraa et al. and Seenu et al. E10 appears once. Few mentions can mean the problem is minor or that it falls between communities; step 4 must tell these apart.</p>
<p><b>3. Cross-cutting themes, outside the model.</b> Some items are about methods rather than problems, so they do not belong to any element:</p>
<ul><li><b>Guarantees:</b> bounds for heuristic schedulers; complexity of path finding.</li>
<li><b>Evaluation:</b> shared platforms, benchmarks, realistic testbeds, sim-to-real testing. Four of the eleven sources raise it, the most consistent single complaint in the audit.</li>
<li><b>Method-specific failures:</b> LLM hallucination and weak numerical reasoning.</li>
<li><b>Ethics and trust:</b> accountability and trust calibration in human–robot allocation.</li></ul>
<p>These will be treated together at the end of Part 3 rather than as gaps in the problem.</p>
<p><b>4. Pairs already named.</b> Several items already sit on two elements at once: stochastic execution with temporal constraints (E3 × E4, Nunes et al.), partial observability with open teams (E6 × E1, Mirsky et al.), observation cost versus acting (E6 × E8, our scan), uncertain self-knowledge (E3 × E6, Aziz et al.), and when to reassess capabilities (E3 × E8, Ali et al.). These seed the pairwise matrix in step 4.</p>
<div class="key"><span class="lbl">What the audit does not prove</span>Passing the audit means no outside list contains an item the model cannot express. It does not prove completeness: the sources share blind spots of their own. A later full-text check added Chakraa et al. (2023) and Quinton et al. (2023); every item they raise maps to E1–E10 or to the cross-cutting themes, so the audit still passes.</div>`,
    refs:[] },

FIG.p4capacity = () => { let s="";
