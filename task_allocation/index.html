 "<p><b>Classical assumption:<\/b> a fixed, known set of robots.<\/p><p>Of the four ways the \"fixed, known robots\" assumption breaks, only heterogeneous capability structure has a mature robotics line (trait-based allocation). Teammates of unknown type and humans on the team are studied, but mostly outside MRTA proper or in small teams. Robots joining and leaving mid-mission is well defined in multi-agent systems research, but this review's search found almost no robotics allocation work on it.<\/p>\n<p><b>A pattern across E1:<\/b> the most developed lines (ad hoc teamwork, open MAS) live in multi-agent learning and game benchmarks; the robotics lines keep a fixed roster and handle change as repair after a disruption.<\/p>\n<p><b>Joining is not the same as being unknown.<\/b> The sub-axes separate situations that are easily merged into a single \"open team\": unannounced entry, unannounced departure, unfamiliar behaviour, heterogeneous capability and human participation. A known robot rejoining after charging may only require schedule repair. An unfamiliar collaborator may require teammate modelling even in a fixed-size team. Test these independently before claiming a combined open-team problem.<\/p>\n<p>Changes to the roster, the work and the model create different problems, and the two neighbouring elements need the same separation.<\/p>\n<p><b>E2 · Task arrival is not task discovery or decomposition (3.6).<\/b> An incoming delivery request may have a known schema; discovering a spill creates work that was not on the queue; decomposing \"prepare the room\" creates subtasks and ordering constraints. Unknown requirements add another uncertainty: which resources will succeed? Routing, symbolic planning and online learning provide relevant predecessors. Decomposition predates language-model planners.<\/p>\n<p><b>E3 · Capability is conditional on the task and environment (3.7).<\/b> A slow completion can reflect a weak robot, a congested aisle or a hidden prerequisite (figure). Learning a single robot score may confound these causes. Emam et al. and CMTAB establish that adaptation from outcomes is relevant prior art; the question is which latent causes and feedback a setting requires.<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_confound\"><\/div>\n<div class=\"key\"><span class=\"lbl\">Candidate question<\/span>Across E1–E3, ask what is identifiable from the allowed probes. Can a newcomer estimate its useful contribution when task requirements and teammate behaviour are only partly known? To make this specific, define the permitted probes, identifiability assumptions and costs. If the uncertainty is not identifiable, the method should maintain alternatives or choose robust actions instead of reporting unjustified certainty.<\/div>\n<p><b>How to read the sub-axis pages.<\/b> Each page places representative works on a line from the classical assumption (left) to the fully relaxed setting (right). Positions are qualitative judgements of how far a work relaxes the assumption, not measurements. The dashed region on the right is what no checked work reaches. Each work's notes record what it handles, what it still keeps, and how it was checked (full text, abstract, or title only). The sub-axis pages 3.5.1–3.7.4 keep the representative works found in the October 2026 search, each with what it still keeps.<\/p>\n<p><b>Status ratings.<\/b> The labels record a search snapshot (October 2026), not coverage statistics or a ranking; a later paper may change a label without changing the axis. <i>Well studied<\/i>: several mature lines of work. <i>Partly studied<\/i>: a real but fragmented cluster, or one that keeps strong simplifications. <i>Thin<\/i>: a handful of papers, or none found in this review's search, often with the field's own surveys calling it open.<\/p>"}, "p3-e4-interaction-1-thin-1-partly-2-well-studied": {"notes": "<p><b>Classical assumption:<\/b> the value of each robot–task pairing is independent of the others (ND).<\/p><p>Two E4 sub-axes are well studied: temporal coupling has a dedicated taxonomy and many solvers, and non-additive team value has mature formalisms (coalition formation, submodular assignment) with guarantees. Interference as an allocation cost is partly studied. The case where the allocation itself reshapes the system was rated thin within MRTA, although its pieces are mature in operations research: precedence, shared chargers, aisle occupancy and coalition synergies already motivate coupled scheduling and queueing models. \"Allocation reshapes the system\" is therefore a useful modelling warning, not sufficient evidence of a new research gap.<\/p>\n<p><b>A pattern across E4:<\/b> guarantees rest on <i>monotone<\/i> structure, where adding a robot never hurts and returns diminish. Interference breaks that monotonicity, and feedback between allocation and system state breaks the assumption that values are fixed while the allocation is chosen. Both sit at the edge of current theory.<\/p>\n<p><b>Intervention changes the system.<\/b> Being busy, completing more local tasks and improving the team are different outcomes. In the warehouse, sending another robot upstream may increase the downstream queue without increasing departures (figure).<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_marginal\"><\/div>\n<p>The key quantity is the marginal effect of an intervention under a stated horizon and baseline. A long queue is evidence about demand and service, not proof that adding a robot there helps. Prefer controlled comparisons or an explicit predictive model over interpreting correlation as causal benefit. Kuo, Lim and Meerkov's bottleneck definition (4.4.3) is exactly such a marginal quantity, ∂PR/∂p<sub>i<\/sub>, for serial lines.<\/p>\n<p><b>E5 · Choose the objective before the metric (3.9).<\/b> What counts as useful help depends on the objective. For a finite batch, remaining completion time may be appropriate. For continuing arrivals, throughput, queue growth and response-time tails matter. Multi-objective trade-offs, fairness and human preferences require an aggregation rule or constraints. None is represented adequately by an unspecified \"utility\".<\/p>\n<div class=\"key\"><span class=\"lbl\">Three different safety questions<\/span>Physical safety restricts trajectories or states. Performance conservatism limits loss relative to a reference policy. Fairness limits how outcomes are distributed. One guarantee does not imply the other two.<\/div>\n<p>When comparing against the pre-entry team, include travel, interference, failed handoffs and transition delay. A newcomer that performs well on its own task may still hurt the overall objective.<\/p>\n<p><b>How to read the sub-axis pages.<\/b> Each page places representative works on a line from the classical assumption (left) to the fully relaxed setting (right). Positions are qualitative judgements of how far a work relaxes the assumption, not measurements. The dashed region on the right is what no checked work reaches. Each work's notes record what it handles, what it still keeps, and how it was checked (full text, abstract, or title only).<\/p>\n<p><b>Status ratings.<\/b> The labels record a search snapshot (October 2026), not coverage statistics or a ranking; a later paper may change a label without changing the axis. <i>Well studied<\/i>: several mature lines of work. <i>Partly studied<\/i>: a real but fragmented cluster, or one that keeps strong simplifications. <i>Thin<\/i>: a handful of papers, or none found in this review's search, often with the field's own surveys calling it open.<\/p>"}, "p3-e6-information-2-thin-2-partly-1-well-studied": {"notes": "<p><b>Classical assumption:<\/b> the allocator sees the global state, or each robot knows its own costs exactly.<\/p><p>E6 was the element most often raised in the audit (13 items). Limited communication is well studied, with a qualifier on realism. Local observation and uncertain self-knowledge are partly studied. Treating information as something that costs time to acquire was rated thin: value-of-information reasoning exists outside allocation or for single ad hoc agents in small domains. A fifth sub-axis, E6e, was added after Parts 2 and 4 showed that classical coordination assumes a shared message protocol; working without one was also rated thin.<\/p>\n<p><b>A pattern across E6:<\/b> uncertainty is usually exogenous and known (a distribution, an interval, a loss model). Robots that must <i>estimate<\/i> their own costs or the team's state, and decide how long to spend doing so, are rare in this review's search.<\/p>\n<p><b>Information has content, cost and timing.<\/b> Distinguish hidden state, unknown teammate policy, uncertain own capability and unavailable task requirements. An observation, a query and a productive trial reveal different information. Their usefulness depends on whether they change an actionable decision before the information becomes stale.<\/p>\n<p>That single-agent ad hoc work is the relevant baseline: communication-sensitive ad hoc planning already compares asking with watching (Macke et al., 2021; 4.7.3). A new method should be compared with such work, not only with a planner that receives no updates. Also account for query refusal, grounding errors and model mismatch when they are part of the actual deployment.<\/p>\n<p><b>E7 · Control is not the same as cooperation (3.11).<\/b> A shared objective does not imply that one planner can replace every robot's policy. Incumbents may accept proposals, refuse interruptions, adapt to the newcomer or follow human instructions. Strategic behaviour introduces incentive questions beyond ordinary cooperative uncertainty. Uncertainty can be reduced; authority cannot be assumed into existence. A useful setting therefore specifies what an algorithm can observe and change.<\/p>\n<div class=\"key\"><span class=\"lbl\">A precise combination<\/span>A newcomer controls only its own actions, sees a partial queue and can request a commitment summary at a cost. Existing tasks may not be interrupted. This is more informative than \"decentralised ad hoc allocation\": it specifies what an algorithm can observe and change.<\/div>\n<div class=\"fig nfig\" data-fig=\"rv_contract\"><\/div>\n<p>Do not label a policy incapable because it lacks information or authority granted to its competitor. Change one condition at a time, or identify the result as a comparison between interfaces rather than algorithms.<\/p>\n<p><b>How to read the sub-axis pages.<\/b> Each page places representative works on a line from the classical assumption (left) to the fully relaxed setting (right). Positions are qualitative judgements of how far a work relaxes the assumption, not measurements. The dashed region on the right is what no checked work reaches. Each work's notes record what it handles, what it still keeps, and how it was checked (full text, abstract, or title only).<\/p>\n<p><b>Status ratings.<\/b> The labels record a search snapshot (October 2026), not coverage statistics or a ranking; a later paper may change a label without changing the axis. <i>Well studied<\/i>: several mature lines of work. <i>Partly studied<\/i>: a real but fragmented cluster, or one that keeps strong simplifications. <i>Thin<\/i>: a handful of papers, or none found in this review's search, often with the field's own surveys calling it open.<\/p>"}, "p3-e8-timing-0-thin-3-partly-0-well-studied": {"notes": "<p><b>Classical assumption:<\/b> the allocation is solved offline, with no time limit, before execution.<\/p><p>All three E8 sub-axes are partly studied, each with a mature core and a thin edge. Fast and anytime solvers exist but only for small teams or simple constraints; rolling-horizon and online assignment are mature in lifelong path finding, but when to reallocate and what switching costs is scattered; very large scale is shown for simple assignment, not for time windows, coalitions or heterogeneity.<\/p>\n<p><b>A pattern across E8:<\/b> speed is bought by dropping structure. In this review's search, no work was found that bounds how much plan quality is lost to decision latency while robots keep moving.<\/p>\n<p><b>The solve is part of the timeline.<\/b> State whether robots continue working during inference, communication and optimisation. A plan computed from an old snapshot needs an update, a validity check or an agreed future activation point. A seconds-long budget can be ample for some instances and unusable for others; scale alone does not establish either claim.<\/p>\n<p>The plan must remain meaningful while the world keeps moving, which ties timing to the two remaining elements.<\/p>\n<p><b>E9 · Execution can change the allocation decision (3.13).<\/b> Paths, manipulation feasibility, delays and handoffs are more than final checks. An infeasible route can require a different task owner; a non-interruptible action can prevent immediate reassignment. Task-and-motion planning and dynamic interleaved methods (D-ITAGS) already address parts of this loop. A proposed extension should identify which execution contract or uncertainty they do not cover.<\/p>\n<p><b>E10 · The system itself may be a decision variable (3.14).<\/b> Fleet size, capability mix and layout shape which allocations are possible. Separate design-time investment from runtime adaptation and compare total cost. If a second packing station removes the bottleneck, that is a useful system-design finding, not a failure of the analysis.<\/p>\n<p>The full closed loop is: <b>observe → update state or belief → choose a feasible intervention → agree and activate → execute and monitor → revise<\/b>. Not every implementation needs every stage, but omitted stages imply assumptions that should be explicit.<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_loop\"><\/div>\n<p><b>How to read the sub-axis pages.<\/b> Each page places representative works on a line from the classical assumption (left) to the fully relaxed setting (right). Positions are qualitative judgements of how far a work relaxes the assumption, not measurements. The dashed region on the right is what no checked work reaches. Each work's notes record what it handles, what it still keeps, and how it was checked (full text, abstract, or title only).<\/p>\n<p><b>Status ratings.<\/b> The labels record a search snapshot (October 2026), not coverage statistics or a ranking; a later paper may change a label without changing the axis. <i>Well studied<\/i>: several mature lines of work. <i>Partly studied<\/i>: a real but fragmented cluster, or one that keeps strong simplifications. <i>Thin<\/i>: a handful of papers, or none found in this review's search, often with the field's own surveys calling it open.<\/p>"}, "p3-the-gap-list-ranked-neutrally": {"title": "Candidate gaps: a search snapshot, ranked neutrally", "tag": "search snapshot", "notes": "<p>The list merges the sub-axes rated thin on their own (including E6e, added after Part 2 surfaced the shared-protocol assumption) with the recurring missing combinations from 3.15.1. It is a search snapshot: every entry is a candidate gap, scored on two criteria and nothing else:<\/p>\n<ul><li><b>Prevalence<\/b> (0 low, 1 medium, 2 high): how often a deployed multi-robot system meets this situation. This is a judgement; the \"Where it arises\" column gives its basis.<\/li>\n<li><b>Emptiness<\/b> (1 partly or missing combination, 2 thin or none found in this review's search): taken from the literature checks, which record what this review's search found at one point in time, not a certified absence.<\/li><\/ul>\n<p><b>Tier rule:<\/b> A if prevalence + emptiness ≥ 3.5; B if ≥ 3; C otherwise. Tiers A and B are on this page, tier C on the next. The rule was fixed before the list was sorted. Because it adds a judged prevalence to a search-snapshot emptiness, a tier says where to look first, not that a gap has been established.<\/p>\n<p><b>Tier A<\/b> has three candidate gaps: allocation that reshapes the system, information that costs time to acquire, and team membership changing mid-mission. All three are common in practice and thin in this review's search of MRTA; for two of them, mature theory exists in a neighbouring field, and the search did not find it carried over.<\/p>\n<p><b>The \"Theory next door\" column matters.<\/b> Where it is filled in, the candidate gap looks like one of transfer rather than invention: bottleneck theory, sequential testing, conservative bandits, mechanism design and co-design all exist; what this review did not find is their formulation inside allocation with physical constraints.<\/p>\n<p><b>Candidate combinations, not certified gaps.<\/b> Because the tiers mix judged prevalence with search-snapshot emptiness, the more useful output of the ranking is the set of candidate questions below. Each is stated with its nearest starting points and with the result that would weaken its motivation, so that it can be rejected as well as pursued. The pairwise checks and missing combinations that fed the list (3.15–3.15.3) are leads rather than evidence of absence.<\/p>\n<table class=\"cmp\"><thead><tr><th>Candidate question<\/th><th>Nearest starting points<\/th><th>What would weaken the motivation?<\/th><\/tr><\/thead><tbody><tr><td>When should a newcomer query, observe or act under limited authority and existing commitments?<\/td><td>online ad hoc teamwork, value of communication, teammate models, SharedPlans<\/td><td>a cheap status message plus plan repair does equally well<\/td><\/tr><tr><td>Can intervention improve a coupled flow without unacceptable transition loss?<\/td><td>queueing control, bottleneck analysis, conservative learning<\/td><td>known-model queue control or static staffing already captures it<\/td><\/tr><tr><td>Which uncertainty deserves a productive probe?<\/td><td>adaptive and bandit allocation, belief-space planning<\/td><td>declarations or passive observation are accurate enough, cheaper<\/td><\/tr><tr><td>When should a team repair a plan versus reopen the full decision?<\/td><td>allocation–schedule–motion repair, online search<\/td><td>event-triggered replanning meets deadlines at similar transition cost<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">Promising means consequential and testable, not merely sparsely cited in one review.<\/p>\n<p>Each candidate needs a targeted search, a formal interface and a strong baseline. A useful next experiment varies one difficulty at a time (information cost, teammate mismatch, commitment duration or coupling strength) before combining them.<\/p>\n<div class=\"key\"><span class=\"lbl\">Read with 3.18<\/span>Prevalence ratings are the most subjective input here, and the tier-A candidate gaps overlap with the research interests behind this deck. 3.18 discusses both.<\/div>\n<div class=\"key\"><span class=\"lbl\">Bridge to Part 4<\/span>The goal is not to replace MRTA with a single new paradigm. It is to select tools whose assumptions match the candidate question, and to discover when the extra machinery is unnecessary.<\/div>"}, "p4-what-counts-as-a-paradigm": {"title": "What counts as a lens", "bullets": ["A lens changes the <b>formal statement<\/b>: state, decision, objective or guarantee", "It relaxes one <b>reference-case assumption<\/b> (4.2)", "Lenses <b>complement<\/b> MRTA; several can serve one system", "Its guarantees transfer only if <b>assumptions match<\/b>"], "notes": "<p>Part 3 found where the problem space looks empty in this review's search. Part 4 asks a different question: are there ways of <i>stating<\/i> the problem that would put work into those regions? A faster solver for the same statement does not count. A lens counts if it changes at least one of four things:<\/p>\n<ul><li><b>State:<\/b> what the decision maker tracks. Classically it is a utility table; here it may be queue lengths, a belief over teammates, or the team itself.<\/li>\n<li><b>Decision:<\/b> classically a one-shot assignment <code>x(r,t)<\/code>; here it may be a feedback policy, a time to stop observing, or a single robot's own action.<\/li>\n<li><b>Objective:<\/b> classically <code>Σ U·x<\/code>; here it may be a long-run rate, the cost of information, or not doing harm.<\/li>\n<li><b>Guarantee:<\/b> classically optimality or an approximation ratio; here stability, a confidence level δ, or a safety bound.<\/li><\/ul>\n<p><b>Lenses whose transfer must be checked.<\/b> Each lens changes a modelling emphasis; it complements MRTA rather than replacing it, and several lenses can belong in one system. Calling the six themes \"overlooked paradigms\" would overstate what the evidence establishes: queueing control, sequential inference, ad hoc planning and conservative learning are established research directions. Their transfer to a particular robot system may be useful, but requires an explicit match between assumptions. Each lens speaks to candidate gaps that Part 3 rated thin or partly covered.<\/p>\n<p><b>How the six were chosen.<\/b> 4.2 lists six assumptions made by the reference case, \"table first, solve second\", and shows which one each lens relaxes. Defining each lens by the assumption it relaxes makes the list derivable rather than a collection of favourite topics, and it means another reader could add a lens by naming an assumption we missed.<\/p>\n<p><b>The six lenses at a glance.<\/b> Each is summarised by its main question and the Part 3 dimensions it bears on most.<\/p>\n<table class=\"cmp\"><thead><tr><th>Lens<\/th><th>Main question<\/th><th>Most relevant dimensions<\/th><\/tr><\/thead><tbody><tr><td>P1 · Information acquisition<\/td><td>Which observation, query or trial is worth its cost?<\/td><td>E3, E6, E8<\/td><\/tr><tr><td>P2 · Flow and bottlenecks<\/td><td>Where does extra effort improve the system-level output?<\/td><td>E4, E5, E8<\/td><\/tr><tr><td>P3 · Conservative improvement<\/td><td>How much loss relative to a baseline is acceptable?<\/td><td>E5, E8, E9<\/td><\/tr><tr><td>P4 · The controlled agent's view<\/td><td>What can this agent infer and change about unfamiliar teammates?<\/td><td>E1, E6, E7<\/td><\/tr><tr><td>P5 · Coordination interfaces<\/td><td>What minimal shared semantics and agreements enable cooperation?<\/td><td>E1, E6, E7, E9<\/td><\/tr><tr><td>P6 · System and incentive design<\/td><td>Could changing the fleet, layout or interaction rules improve the problem itself?<\/td><td>E4, E7, E10<\/td><\/tr><\/tbody><\/table>\n<p><b>What each section contains.<\/b> Every lens is read under the same five headings: what changes in the model; what existing mechanism helps; which assumptions it requires (its transfer conditions); what it does not establish (its limitation); and a test. The overview gives the generic formal statement; the deep dives then go into the source papers, keeping their theorems with the conditions verified from the full texts, and finally say what breaks when the idea is carried over to multi-robot task allocation. 4.9 looks at combinations, 4.10 collects objections and limits, and 4.10–4.11 connect the lenses to execution and fair evaluation.<\/p>\n<div class=\"key\"><span class=\"lbl\">Reading rule<\/span>Most of the theory in Part 4 comes from neighbouring fields: queueing, sequential statistics, game theory, safe reinforcement learning, human–AI coordination. The guarantees hold under those fields' assumptions. Each deep dive says which assumptions fail for a robot team.<\/div>"}, "p4-flow-and-bottlenecks-keep-the-system-moving": {"bullets": ["State: a <b>backlog<\/b> that grows with arrivals and shrinks with work", "Decision: a feedback <b>policy<\/b> (who serves which queue, now)", "Objective: <b>throughput<\/b>, stability, or time in system", "Guarantees: <b>capacity regions<\/b>, if the model matches"], "notes": "<p>In a running system such as a warehouse, a kitchen or an assembly cell, work arrives continuously. A single assignment is quickly out of date. <b>Model change.<\/b> The flow view replaces independent task scores with evolving queues, resource occupancy and feasible service decisions, and states the problem in terms of rates. A robot is then helpful only through its effect on the team objective, not through how busy it is locally. This is especially useful for continuing work with shared bottlenecks; for a small finite batch, a direct schedule may remain the clearest formulation. Formally:<\/p>\n<ul><li><b>State:<\/b> a backlog vector <code>x(t)<\/code>: queue lengths, buffer levels, robots at stations.<\/li>\n<li><b>Decision:<\/b> a stationary feedback policy <code>π: x(t) → u(t)<\/code>, choosing which queues are served, under feasibility constraints.<\/li>\n<li><b>Objective:<\/b> keep the backlog bounded for the largest possible arrival rates (throughput), or minimise steady-state time in system.<\/li>\n<li><b>Guarantee type:<\/b> a capacity region (stable if and only if the arrival rates lie inside it), constant-factor bounds in light and heavy traffic, convergence to a balanced fixed point, or a sensitivity-based bottleneck certificate.<\/li><\/ul>\n<p><b>The figure.<\/b> Two task streams share a pool of robots. Every policy is limited by the same capacity region. Inside it a good policy keeps queues bounded; outside it backlog grows without bound under <i>every<\/i> policy. The question becomes \"is the demand inside the region, and does my policy reach its edge?\" rather than \"who does which task?\".<\/p>\n<p><b>Mechanisms to borrow.<\/b> Max-weight control shows how queue pressure can guide service decisions under a specified network model (4.4.1, Theorem 3.2 of Tassiulas &amp; Ephremides). Bucket brigades show self-organised work sharing under structured production assumptions (4.4.2). Bottleneck analysis identifies which capacity constrains output (4.4.3).<\/p>\n<p><b>Already in robotics.<\/b> Dynamic vehicle routing gives stability conditions and delay bounds when tasks arrive as a Poisson stream. For one vehicle the system is stable if and only if load ρ &lt; 1 (Bertsimas &amp; van Ryzin, 1991); for m identical vehicles the load ϱ = λs̄/m &lt; 1 is necessary (Bullo et al., 2011). Mobility-on-demand rebalancing uses a fluid model and a min-cost-flow LP (Pavone et al., 2012). Lifelong multi-agent path finding measures warehouse throughput, but leaves task assignment to an external assigner (Li et al., 2021). These cover E5a, which Part 3 rated \"partly\".<\/p>\n<p><b>Transfer conditions.<\/b> Before any of these results applies, define the arrival and service processes, routing, feasible simultaneous actions and travel or switching delays. A queue-stability result under an admissible load does not imply minimum completion time, small delay tails or bounded queues on every sample path. A changing robot network may not satisfy the original theorem's assumptions.<\/p>\n<p><b>What is missing for MRTA.<\/b> The guarantees assume identical servers; heterogeneity in DVR appears only as order-of-magnitude results for team forming (Bullo et al., §VII). None of these works treats the case where the allocation itself moves the bottleneck (E4d, thin).<\/p>\n<p><b>Warehouse test.<\/b> Compare a queue-aware controller with assigning the newcomer to the longest queue and with a schedule-based controller. Increase aisle interference and packing capacity independently. If the benefit disappears when the downstream station saturates, that is evidence about coupling, not automatically about poor planning.<\/p>"}, "p4-information-acquisition-observing-has-a-price": {"bullets": ["The table is <b>unknown<\/b>; learning it takes time the team could spend working", "Each step: <b>observe<\/b>, query or act; <b>commit<\/b> when evidence suffices", "Objective: cost of observing + cost of a <b>wrong commitment<\/b>", "Beat the <b>closest alternative<\/b>, if the <b>observation model<\/b> holds"], "notes": "<p>The reference case treats the utility table as known. When it is not, for example when a robot's effectiveness in this team is unknown, or what a task needs is only revealed by trying, the decision has two parts: what to observe, and when to stop observing and commit. <b>Model change.<\/b> Observations, queries and trials become part of the action set. Their value is the expected improvement in a subsequent feasible decision, after subtracting time, communication and intervention cost; an accurate model of an irrelevant detail has little decision value. The aim is to learn only what can improve the decision.<\/p>\n<p><b>Generic statement.<\/b> An unknown θ (task values, teammate types, one's own usefulness) and a belief <code>b<sub>t<\/sub><\/code> over it. Each step, either take an observing action <i>a<\/i> that costs <code>c(a)<\/code> and yields a sample, or stop at time τ and commit to an allocation <i>x<\/i>. Three standard objectives:<\/p>\n<ul><li><b>Bayes or Lagrangian:<\/b> minimise expected observation cost plus L × probability of a wrong commitment.<\/li>\n<li><b>Fixed confidence:<\/b> minimise expected stopping time subject to error ≤ δ.<\/li>\n<li><b>Fixed budget:<\/b> maximise the value of the final choice after N observations.<\/li><\/ul>\n<p><b>The common answer.<\/b> Across Wald, Chernoff and best-arm identification, the expected number of observations behaves like <code>log(1/δ) / D*<\/code>, where D* is an information rate: the KL divergence that the best mix of experiments achieves against the hardest-to-distinguish alternative. Two consequences matter for allocation: you only need enough evidence to rule out the nearest competing allocation, not to fill the whole table; and the information rate of each way of observing tells you which observation to buy.<\/p>\n<p><b>The figure<\/b> is schematic: waiting costs grow with observation time, the risk of a wrong commitment shrinks, and the total has a minimum τ*. Its exact location depends on the cost of idling, the cost of a wrong role and how distinguishable the alternatives are.<\/p>\n<p><b>Mechanisms to borrow.<\/b> Sequential testing provides a language for deciding when evidence is sufficient (4.3.1). Controlled sensing and best-arm identification help select informative experiments (4.3.2). Communication-aware ad hoc planning already treats which question to ask as part of planning (4.7.3).<\/p>\n<p><b>Transfer conditions.<\/b> Likelihood-ratio tests and sample-complexity results, including the scaling above, require their stated statistical models; they are not universal bounds on time-to-integration. Correlated observations, adaptive teammates and missing hypotheses can invalidate nominal confidence. Distinguish uncertainty about the environment from uncertainty about the teammate.<\/p>\n<p><b>Not always \"observe first, act later\".<\/b> The stopping formulation reads as a waiting period followed by a commitment, but useful work also reveals information, and the decision is repeated. A newcomer may carry one low-risk item, observe the resulting queue, query the dispatcher's commitment summary, then revise its next action (figure). \"Commit\" need not mean a permanent role. The problem is to choose useful interventions while learning, not to force all information gathering into an initial waiting period.<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_interleave\"><\/div>\n<p><b>A fair comparison.<\/b> A practical comparison includes immediate action, passive observation, a fixed observation window, query-first behaviour and an adaptive information policy. Charge the same elapsed-time and communication costs to each.<\/p>\n<p><b>In MRTA.<\/b> Part 3 rated E6d, \"information costs time to acquire\", as thin in its search snapshot. Reading the two closest papers in full keeps that rating (4.3.3).<\/p>"}, "p4-controlled-agent-s-view-control-only-yourself": {"bullets": ["One robot chooses <b>only its own<\/b> actions", "Teammates move from decision variables into the <b>state<\/b>", "Objective: a <b>best response to a belief<\/b>, judged over many teams", "Needs the right <b>hypothesis space<\/b> and real <b>authority<\/b> to act"], "notes": "<p>The classical allocator optimises over everyone's assignment. When a robot joins a team built by someone else, or works beside teammates it cannot command, that is not the decision it faces. The individual view states the problem from that robot's side. Ad hoc cooperation changes both the teammate being modelled and the interventions available, so the robot has to plan from the authority it actually has.<\/p>\n<p><b>Generic statement.<\/b> Robot <i>i<\/i> chooses its own policy <code>π<sub>i<\/sub><\/code> to maximise expected team return, where the other robots act according to unknown types or models <code>θ<sub>−i<\/sub><\/code>, and <i>i<\/i> holds a belief <code>b<sub>i<\/sub> ∈ Δ(S × Θ<sub>−i<\/sub>)<\/code> updated from what it observes. Team membership and the task set may change outside its control. Success is judged by team performance averaged over the teammates and tasks it might meet (4.6.1).<\/p>\n<p><b>What changes compared with the planner view.<\/b> The controlled robot chooses its own policy while reasoning about the policies of others. It may maintain beliefs over teammate types or latent intentions, then plan against that uncertainty.<\/p>\n<ul><li>Teammates become part of the state, as types or models, instead of decision variables.<\/li>\n<li>The joint optimum is replaced by a best response to a belief.<\/li>\n<li>Performance depends on whether the true teammates lie in the hypothesis space (4.6.2).<\/li><\/ul>\n<p>A centralised implementation of this inference does not grant centralised authority over the team: the robot may compute beliefs about everyone, but it can still act only within the permissions it holds.<\/p>\n<p><b>Between the two views.<\/b> N-agent ad hoc teamwork (Wang et al., 2024) controls N of M agents. Its matrix-game examples show that reusing a single-agent ad hoc policy for two controlled agents can be worse than training them together, which is one reason the two views give different answers.<\/p>\n<p><b>Mechanisms to borrow.<\/b> OPAT (Wu, Zilberstein &amp; Chen, 2011) is an explicit precedent for online ad hoc planning. PLASTIC shows how teammate-model reuse and adaptation support behaviour selection, and Albrecht et al. state when type-based beliefs can be trusted (4.6.2). These are direct prior art for repeated decision making with unfamiliar collaborators.<\/p>\n<p><b>Transfer conditions.<\/b> State the observability assumptions, the candidate model class and how teammates may adapt. A library of teammate types may miss the deployment policy. Open membership additionally requires tracking who is present and how their roles affect the state and action space (4.6.3). More accurate inference cannot fix an action that the robot lacks permission to take.<\/p>\n<p><b>Boundary test.<\/b> If the incumbent dispatcher supplies a complete plan and can direct every robot, the core problem may be dynamic centralised planning. If the newcomer must accommodate an unfamiliar incumbent policy it cannot replace, ad hoc reasoning is more central. Neither architecture is inherently the better research setting; the deployment decides.<\/p>\n<p><b>In MRTA.<\/b> Swarm studies by Lerman, Jones and colleagues are individual in the sense that each robot decides from local observation, but every robot runs the same rule. Eck et al. (2020) is the clearest egocentric task-choice model found in this review: each firefighting agent plans which fire to fight while modelling neighbours. 4.6.3 compares the open-team works in detail; in Part 3's search snapshot E1a remains rated thin.<\/p>"}, "p4-conservative-improvement-never-worse-than-now": {"bullets": ["Decide on a <b>change<\/b> to a running team, not a plan from scratch", "\"No change\" is the fallback; check that <b>waiting blocks no one<\/b>", "Guarantee: P(new &lt; baseline − ε) ≤ δ", "Explicit price (<b>regret, data, refusals<\/b>); <b>not physical safety<\/b>"], "notes": "<p>A running team already has a way of working. A new allocation, a new member or a new policy is useful only if it improves on that, and harmful if it makes things worse while it learns. Safe-increment methods make the incumbent the reference point. A baseline is useful, however, only when its behaviour and the promised comparison are both defined.<\/p>\n<p><b>Generic statement.<\/b> Given an incumbent π₀, data D collected under it, a performance measure J, a tolerance ε and a risk level δ, an algorithm returns either a candidate or \"keep π₀\", such that <code>P<sub>D<\/sub>[J(output) &lt; J(π₀) − ε] ≤ δ<\/code>. Candidates are considered only if a lower confidence bound on their performance clears the threshold; falling back to π₀ is always feasible.<\/p>\n<p><b>Specify what \"do no harm\" means.<\/b> The model change is to optimise improvement subject to a stated performance budget relative to a reference policy. Specify whether the criterion concerns expected return, a high-probability bound, cumulative reward over prefixes, or a worst-case loss. These are different requirements, and the two forms below make different choices among them.<\/p>\n<p><b>Two forms.<\/b><\/p>\n<ul><li><b>Online and anytime<\/b> (conservative bandits, 4.5.1): cumulative reward must stay above a fraction of what the baseline would have earned, at every round; the original work covers both stochastic and adversarial settings. This constrains <i>learning<\/i>.<\/li>\n<li><b>Batch and one-shot<\/b> (HCPI, Seldonian algorithms, SPIBB, 4.5.2): a new policy is deployed only if held-out data certify it. HCPI and Seldonian algorithms certify a candidate before deployment or return \"no solution found\"; SPIBB gives approximate baseline improvement from a fixed dataset under its MDP and confidence assumptions. This constrains <i>deployment<\/i>.<\/li><\/ul>\n<p>None of these is a general guarantee that every physical execution will outperform the incumbent at every instant.<\/p>\n<p><b>How it differs from optimise-then-deploy.<\/b> The decision variable is the change, not the allocation; the output may be \"no change\"; the guarantee is about the algorithm over random data, not about reaching the optimum; and the cost of safety appears as a number (extra regret, a data requirement, or how often the answer is \"no solution found\").<\/p>\n<p><b>Transfer conditions.<\/b> Define a feasible baseline after entry, the loss tolerance, the horizon and the uncertainty model. Inactivity may be a baseline if the newcomer can wait without blocking anyone; that is not automatically true, so the \"keep π₀\" fallback has to be checked for the team at hand rather than assumed. Performance conservatism is not physical safety: physical safety and resource reservations still need separate constraints.<\/p>\n<p><b>Make the counterfactual explicit.<\/b> Compare the post-entry policy with the same incumbent operation under matched demand and disturbances. The incumbent-only outcome is usually an evaluation counterfactual, not a simultaneously observable signal. An empirical loss rate across trials is evidence, not a proof of a no-harm guarantee. Report mean improvement together with the probability and severity of degradation.<\/p>\n<p><b>In MRTA.<\/b> None of the papers read applies a baseline-relative guarantee to multi-robot task allocation. Rudolph et al. (2021) argue that fixed risk attitudes can hurt and adapt risk-seeking to the situation; Shi and Sukhatme (2024) infer a human's risk parameters by minimally deviating from current ones. Both use absolute thresholds or parameter distances, not \"not worse than the current team\". In Part 3's search snapshot E5b stays at \"partly\" because risk-aware objectives exist; the baseline-relative form was not found in this review.<\/p>"}, "p4-system-and-incentive-design-change-it-then-solve-it-simply": {"bullets": ["Change the problem so a <b>simple rule<\/b> does well", "Three knobs: <b>payoffs<\/b>, <b>team<\/b>, <b>layout<\/b>; a newcomer rarely <b>holds them<\/b>", "Bilevel: choose d to maximise the welfare of what the rule produces", "Only payoff design has <b>proofs<\/b>; the others use metrics or simulation"], "notes": "<p>Instead of a better allocator for a fixed problem, change the problem. If the payoffs, the team or the workspace are chosen well, a simple, decentralised rule may do as well as a sophisticated planner on a badly designed problem. Fleet, layout and incentives can matter more than another solver iteration.<\/p>\n<p><b>Generic statement.<\/b> <code>max<sub>d∈𝒟<\/sub> J(d)<\/code>, where <code>J(d) = W(a(d))<\/code> and <code>a(d)<\/code> is the outcome of a fixed, simple allocation rule run under design d: equilibria of a game, a swarm's transition dynamics, or uniformly random task assignment followed by path finding. The objective can be worst-case over outcomes (the price of anarchy) or an expectation estimated by simulation.<\/p>\n<p><b>Model change.<\/b> Selected structural properties become decisions: fleet composition, station capacity, charging locations, communication interfaces or the rewards used by local controllers. This shifts some work from runtime allocation to design. Co-design optimises equipment and policy together; the three kinds of design below are the mechanisms this review examined.<\/p>\n<p><b>Three kinds of design.<\/b><\/p>\n<ul><li><b>Payoff or rule design<\/b> (4.8.1): d is the agents' local utility. This is the only kind with theorems: existence of equilibria and price-of-anarchy bounds, under conditions such as submodular welfare (in distributed welfare games, equilibria are at least half of optimal). Mechanism and payoff design seek local rules that support a team objective. A deployment with self-interested participants needs incentive compatibility; a cooperative team with limited information may need only coordination.<\/li>\n<li><b>Team design<\/b> (4.8.2): d is which robots, with which traits, are in the team. Diversity measures predict how hard allocation will be; team formation itself is NP-hard and solved heuristically.<\/li>\n<li><b>Environment design<\/b> (4.8.2): d is the layout. It is searched with quality-diversity methods and evaluated in simulation, without guarantees. Layout search with a path planner in the loop raised the robot count one planner could handle before congestion.<\/li><\/ul>\n<p><b>Transfer conditions.<\/b> State who may change the system, on what timescale and at what cost. A newcomer cannot normally redesign the incumbent's reward function or warehouse layout. A design-time guarantee does not automatically survive an unknown runtime population.<\/p>\n<p><b>Warehouse test.<\/b> Compare spending the same resource budget on another mobile robot, extra packing capacity and an improved information interface. If a structural intervention wins, report that conclusion. It prevents attributing a physical capacity limit to a deficiency in allocation.<\/p>\n<p><b>In MRTA.<\/b> In Part 3's search snapshot, co-design of fleet, layout and policy (E10c) was rated thin. The full texts read here show why: layout search holds the allocator fixed (random goals), team-diversity work measures diversity rather than choosing the team, and payoff design is analysed for equilibria, not for the robotic constraints of travel, timing or capability.<\/p>"}, "p4-coordination-interfaces-talk-or-watch": {"bullets": ["Teammates from <b>different builders<\/b>: no agreed format, scores or conventions", "Objective: do well across a <b>population of partners<\/b> (cross-play)", "Two channels: <b>talk<\/b> needs grounding, <b>watch<\/b> needs interpretation", "Many methods only <b>move<\/b> agreement up; the interface is <b>small, not absent<\/b>"], "notes": "<p>Every agreement method of 2.3 assumes that robots share a message format, a scoring rule and tie-breaking conventions. Robots from different builders, or a robot joining a team whose software it has never seen, cannot assume this. Section 2.4.6 noted that self-organisation is the only classical family that coordinates through the environment instead.<\/p>\n<p><b>Generic statement.<\/b> Robot <i>i<\/i> runs a policy built by its own builder; its partners are drawn from an unknown population 𝒫, possibly with different action spaces. There is no shared message alphabet with agreed meanings, no shared utility table and no shared algorithm. Each builder solves <code>max<sub>π<sub>i<\/sub><\/sub> E<sub>π<sub>−i<\/sub>∼𝒫<\/sub>[J(π<sub>i<\/sub>, π<sub>−i<\/sub>)]<\/code>: perform well with partners it was not co-trained with.<\/p>\n<p><b>The interface can be small without being absent.<\/b> No jointly designed policy does not mean no common meaning. The model change is to ask what agents must share to make independent decisions compatible. Candidates include task identifiers, public action effects, intent messages, reservations and a proposal–acceptance handshake.<\/p>\n<p><b>Two channels.<\/b><\/p>\n<ul><li><b>Watch:<\/b> infer partners' intentions from their actions and from traces in the environment. Implicit communication, legible actions, environmental signals and stigmergy (environment-mediated, indirect coordination) live here, and can support coordination without messages (4.7.2).<\/li>\n<li><b>Talk:<\/b> send a message, now often in natural language, which costs time and is useful only if the partner decodes it as intended (2.3.10).<\/li>\n<li>Deciding which channel to use, and when, is itself an information problem. Direct queries may be preferable when they are cheap; the communication literature makes that trade-off explicit (4.7.3).<\/li><\/ul>\n<p><b>A caveat that runs through this section.<\/b> Much of the zero-shot coordination literature does not remove agreement; it moves it up a level. It studies compatibility across independently trained agents under specified shared structures: designers still share the game, its symmetries, a base policy, a simulator or a learning rule (4.7.1). Systems such as RoCo and SMART-LLM, sometimes cited as heterogeneous coordination, use one language model or a designed dialogue protocol for all robots, so a shared protocol is in place.<\/p>\n<p><b>Transfer conditions.<\/b> Observation still needs an interpretation, natural language still needs grounding, and an environmental signal still needs to be detectable. A protocol for exchanging task status is not the same as a jointly optimised team policy. Conversely, assuming that all parties obey a new negotiation algorithm is a substantive coordination assumption.<\/p>\n<p><b>Minimal handoff example.<\/b> The newcomer proposes a task and activation time; the incumbent accepts or rejects; an accepted reservation has an owner and an expiry; completion updates public task state. This is an illustrative interface, not a new protocol or a claim that handshakes solve all failures.<\/p>\n<p>Evaluation should therefore compare interface choices as well as policies: full schedule disclosure, task-level summaries, on-demand queries and observation alone. Let the result determine how much implicit inference is actually necessary.<\/p>"}, "p4-objections-and-limits": {"notes": "<p><b>\"Just MRTA with constraints.\"<\/b> Any of the lenses can be folded into a large enough Dec-POMDP or game. That observation does not help: the classical solvers of Part 2 and their guarantees rely on the commitments the lenses drop. The contribution of a lens is a formal statement with a tractable structure and a guarantee, not the observation that the problem is general.<\/p>\n<p><b>Borrowed guarantees.<\/b> Max-weight assumes central knowledge and i.i.d. arrivals; Wald and Chernoff assume i.i.d. observations from fixed hypotheses; conservative bandits and SPIBB assume stationary environments and a single learner; other-play assumes known symmetries. Robot teams violate each of these, mainly because the other robots react. Each deep dive lists the specific failure. Showing which guarantees survive coupling is open.<\/p>\n<p><b>Thin evidence.<\/b> Almost every result in Part 4 is theoretical or simulated. The SPL drop-in competition is the main physical evidence for ad hoc teams, and it used a shared message packet.<\/p>\n<p><b>Where classical methods win.<\/b> In a warehouse with a fixed fleet from one vendor, a known map and stable demand, \"table first, solve second\" is the right approach. The lenses are for the three breaks of 1.6: a missing row, an uncertain table, a coupled one.<\/p>\n<p><b>Not new paradigms.<\/b> The six are complementary lenses, not replacements for one another or for classical allocation: each builds on an established research direction, and its value for a robot team depends on matching assumptions (4.1).<\/p>\n<p><b>Selection.<\/b> The six lenses follow from six reference-case assumptions we chose to list. 3.18 discloses the authors' interest in open teams; the derivation in 4.2 is meant to make the choice checkable, and a reader who names another commitment adds another lens.<\/p>\n<p><b>A gap in our own model.<\/b> The need for a shared protocol emerged in Part 2 (2.3.11, 2.4.6), not from the first-principles derivation or the audit. It has been added to Part 3 as E6e, “teammates share no protocol”, rated thin in the search snapshot, and placed in tier B of the candidate-gap list. That it was missed by eleven outside sources and by our own derivation is a reminder that the model's completeness is checked, not proved.<\/p>\n<h4>How to evaluate a lens fairly<\/h4>\n<p>Several of these objections can only be settled by experiment, and a fair experiment evaluates the mechanism, not an information advantage. It should also reveal when a simple method is already enough.<\/p>\n<p><b>One shared environment and interface.<\/b> Use the same tasks, dynamics, observations, action permissions and execution model. Distinguish a same-interface algorithm baseline from a privileged reference with full information or full-team control.<\/p>\n<p><b>Count time while the system runs.<\/b> For example, compare 0.1, 1, 5 and 10 second decision budgets while reporting actual wall time and hardware (an illustrative design, not measurements). Include communication and observation delay, plan activation, fallback behaviour and unfinished solves. Use separate, clearly named conditions if one pauses the team and another lets it keep executing.<\/p>\n<p><b>Measure the claimed outcome.<\/b> For finite workloads, report remaining makespan and deadline misses; for streams, throughput, queue growth and response-time tails. Also record degradation relative to the incumbent, failed handoffs, communication cost and time to useful participation. Report uncertainty across seeds, arrival events and held-out teammate policies, not only a winning average.<\/p>\n<p><b>Comparisons to include.<\/b><\/p>\n<table class=\"cmp\"><thead><tr><th>Comparison<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Incumbent policy; newcomer waits where feasible<\/td><td>measure the counterfactual value and harm of integration<\/td><\/tr><tr><td>Preserve assignments; give the newcomer eligible work<\/td><td>test the benefit of minimal intervention<\/td><\/tr><tr><td>Local repair and full replanning under the same authority<\/td><td>separate neighbourhood restrictions from search budget; without full-team control, label full replanning a separate reference<\/td><\/tr><tr><td>Existing online ad hoc / teammate-model method<\/td><td>test whether familiar adaptation mechanisms suffice<\/td><\/tr><tr><td>Cheap communication, fixed observation, passive inference<\/td><td>test the need for adaptive information gathering<\/td><\/tr><tr><td>Component ablations<\/td><td>remove commitment handling, information selection or conservative control one at a time<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">A privileged reference is not automatically an upper bound unless it is exact or a bound is proved.<\/p>\n<div class=\"key\"><span class=\"lbl\">A useful negative result<\/span>If a cheap commitment summary plus ordinary repair matches the richer method, the contribution may be the interface and the problem characterisation. Do not make the benchmark harder merely to recover an algorithmic advantage.<\/div>"}, "p4-six-ways-to-leave-the-table": {"title": "Six lenses, and where to start", "bullets": ["Each lens relaxes one commitment of <b>table first, solve second<\/b>", "Each brings borrowed theory and a <b>specific failure<\/b> when transferred", "All run inside <b>planning and execution<\/b>: beliefs, commitments, handoffs", "<b>Illustrative next question:<\/b> when should a newcomer act, observe or talk?"], "notes": "<p><b>Part 1<\/b> broke allocation into five questions and found a hidden default: build the utility table first, then solve.<\/p>\n<p><b>Part 2<\/b> showed that the classical families differ mostly in how they decide (Q4): centralised optimisation, agreement through markets and consensus, self-organisation, learned policies and language-model planners. Agreement methods all assume a shared protocol; self-organisation is the one classical family that coordinates through the environment.<\/p>\n<p><b>Part 3<\/b> derived a model of the problem from first principles (E1–E10), audited it against surveys, and rated each sub-axis as a search snapshot rather than a coverage statistic. The thinnest regions in that snapshot were teams whose membership changes (E1a), information that costs time (E6d), and allocations that reshape the system (E4d).<\/p>\n<p><b>Part 4<\/b> named six lenses, one per classical commitment: rates instead of matchings, information as a cost, the individual robot's view, safety relative to the incumbent, designing the problem, and coordination without a shared protocol. Each comes with real theory, mostly from neighbouring fields, and each deep dive records what that theory assumes and where a robot team breaks it. 4.9 lists combinations of the lenses, read as related evidence rather than certified gaps; the emptiest region in the snapshot is where Part 3's tier-A candidate gaps meet.<\/p>\n<h4>Where the lenses meet planning and execution<\/h4>\n<p>The six lenses do not replace a planning and execution architecture; a running team also needs beliefs, commitments and monitoring. A symbolic planner or HTN can express task decomposition, preconditions, effects, causal dependencies and resource constraints. Allocation selects executors; scheduling supplies timing; motion and manipulation establish physical feasibility.<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_exec\"><\/div>\n<p><b>Loop:<\/b> observe and update beliefs → generate task or repair options → evaluate information, cost and risk → agree on commitments → execute and monitor → repeat.<\/p>\n<p>Unknown teammate intentions should not silently become known symbolic facts. Maintain a belief or a set of plausible explanations, and distinguish observed effects from predicted effects. Belief-space task-and-motion planning (Kaelbling &amp; Lozano-Pérez, 2013) provides related foundations; it does not remove the need to specify what other agents can change.<\/p>\n<p><b>What a handoff must preserve.<\/b><\/p>\n<ul><li><b>Ownership:<\/b> who is responsible before and after activation?<\/li>\n<li><b>Dependencies:<\/b> which completed effects remain true, and which unfinished actions must finish first?<\/li>\n<li><b>Reservations:<\/b> which resources, routes or objects have already been committed?<\/li>\n<li><b>Validity:<\/b> what observation invalidates the new plan, and what recovery is allowed?<\/li><\/ul>\n<p>D-ITAGS and SharedPlans are relevant predecessors for repair and collaborative commitments. The candidate research question is how these mechanisms interact with specified unfamiliar teammates and costly information, not whether symbolic planning and replanning can be combined for the first time.<\/p>\n<h4>A concrete next question, with its limits<\/h4>\n<p>The aim is to narrow a falsifiable problem, not to declare a field empty. <b>Illustrative formulation:<\/b> how should a newcomer choose between productive action, observation and communication when it cannot replace the incumbent policy, sees only part of the task state, and must respect ongoing commitments?<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_question\"><\/div>\n<p>This formulation joins E1, E6, E7, E8 and E9, with E3 or E4 included only when uncertainty or physical coupling is essential to the application. It makes the intervention and the interface explicit. It does not establish novelty: the nearest online ad hoc teamwork, communication-planning and plan-repair methods must still be examined under the same assumptions.<\/p>\n<p>A minimal study should first determine whether the interface is sufficient for ordinary repair. Only then add belief modelling, information selection or conservative improvement where a measured failure motivates it. Keep the task and execution framework shared so that results remain attributable to the proposed mechanism.<\/p>\n<div class=\"key\"><span class=\"lbl\">What would move the field<\/span>For any lens, the useful contribution is a formal statement for robot teams, with heterogeneous capabilities and teammates that react, together with a guarantee that survives that coupling, and evidence on physical robots.<\/div>\n<div class=\"key\"><span class=\"lbl\">What this review supports, and what remains open<\/span><b>Supports:<\/b> precise problem boundaries, relevant neighbouring methods and a testable evaluation plan. <b>Open:<\/b> an exhaustive novelty check, source-level verification of the entire inherited bibliography, and empirical evidence that the candidate combination needs a new algorithm.<\/div>"}};

    FLAT.push({...s,part:p,idx:i,key:slugKey(p.id,s.title),num,parent:s.child?parent:-1}); }); });

          zh:{prev:"← 上一页",next:"下一页 →",present:"演示",jump:"跳转到",refs:"参考文献",intro:"提出时要解决的问题",solves:"解决",soon:"待续",hint:"← → 翻页 · Esc 退出",title:"重新审视多机器人任务分配",lang:"English",dark:"深色",light:"浅色",back:"← 返回",exTip:"打开主线之外的一个旁页：为三个机器人、三项任务一步步算出效用表，再求解。旁页上的返回按钮可回到这里。",clickToOpen:"点击打开",tipHint:"点击可固定",tipPinned:"点击别处关闭",defined:"定义见"}};

const ZH={"parts": {"p1": {"id": "p1", "label": "第一部分", "title": "从第一性原理看问题", "next": ""}, "p2": {"id": "p2", "label": "第二部分", "title": "经典方法流派", "next": ""}, "p3": {"id": "p3", "label": "第三部分", "title": "从第一性原理推导候选空白", "next": ""}, "p4": {"id": "p4", "label": "第四部分", "title": "参照情形之外的六个视角", "next": ""}}, "slides": {"p1-gerkey-matari-three-binary-axes": {"key": "p1-gerkey-matari-three-binary-axes", "eyebrow": "第一部分 · 标准地图", "title": "Gerkey & Matarić：三条二元轴", "bullets": ["<b>ST / MT<\/b>（单任务 / 多任务<i>机器人<\/i>）：一次做一个任务，还是同时做多个？", "<b>SR / MR<\/b>（单机器人 / 多机器人<i>任务<\/i>）：一个任务要一个机器人，还是一个团队？", "<b>IA / TA<\/b>（即时 / 时间扩展<i>分配<\/i>）：只管当下，还是规划一段日程？", "每条轴选一边，例如 <span class=\"m\">ST-SR-IA<\/span>：其基本形式可在多项式时间内求解"], "notesTitle": "人人引用的分类法", "notes": "<p>Gerkey 和 Matarić (2004) 为领域提供了通用词汇。每个 MRTA 问题由三个是非选择来刻画，每条轴一个，写成 <code>ST-SR-IA<\/code> 这样的三段代码。<\/p>\n<table class=\"cmp\"><thead><tr><th>轴<\/th><th>全称<\/th><th>它问的问题<\/th><th>例子<\/th><\/tr><\/thead><tbody>\n<tr><td>ST / MT<\/td><td>单任务 / 多任务<i>机器人<\/i><\/td><td>一个机器人能否在同一时刻执行多个任务？<\/td><td>ST：搬运机器人一次只搬一个周转箱。MT：巡逻机器人同时为建图回传视频。<\/td><\/tr>\n<tr><td>SR / MR<\/td><td>单机器人 / 多机器人<i>任务<\/i><\/td><td>一个任务需要一个机器人，还是多个机器人协同？<\/td><td>SR：巡检一条货道。MR：两台机器人一起抬一根长梁。<\/td><\/tr>\n<tr><td>IA / TA<\/td><td>即时 / 时间扩展<i>分配<\/i><\/td><td>只有当下的信息可用（立即分配），还是信息足以提前为每个机器人规划日程？<\/td><td>IA：把空闲的机器人分给待做的任务。TA：为每个机器人排好本班次的取货顺序。<\/td><\/tr><\/tbody><\/table>\n<p><b>如何读代码。<\/b><code>ST-MR-TA<\/code> 表示：每个机器人一次只做一个任务，有些任务需要团队完成，而答案是一份随时间展开的日程。用五个问题的语言说，前两条轴关于机器人能做什么、任务需要什么（Q2、Q3）；第三条轴关于时间与变化（Q5）。<\/p>\n<p>从这里开始，把鼠标悬停在这些代码（或 Q1–Q5）上即可看到完整含义；点击可固定显示。<\/p>\n<p>最简单的角落 <code>ST-SR-IA<\/code> 就是最优指派问题，匈牙利算法可在多项式时间内求解。在 Gerkey 和 Matarić 的建模下，其他每一类都被证明是 NP-hard；其他编码方式或特殊结构可能表现不同（1.2）。多机器人任务变成联盟形成（一个集合划分问题），时间扩展分配则变成调度问题。<\/p>\n<p>该论文还把当时已有的体系结构（例如 ALLIANCE 和基于拍卖的 MURDOCH）分析为这些问题的实例，这也是它至今仍是公共参照点的原因。<\/p>"}, "p1-itax-adds-a-fourth-axis-interdependence": {"key": "p1-itax-adds-a-fourth-axis-interdependence", "eyebrow": "第一部分 · 标准地图", "title": "iTax 增加第四条轴：相互依赖", "bullets": ["Gerkey & Matarić 假设（并明确指出）一个配对的价值是<b>独立存在<\/b>的", "Korsah 等 (2013) 对它<b>依赖其他选择<\/b>的程度进行分级", "<span class=\"m\">ND → ID → XD → CD<\/span>：效用表连写出来都越来越难"], "notesTitle": "当一个配对的价值依赖于其他配对", "notes": "<p>Korsah、Stentz 和 Dias (2013) 注意到，原有分类法把机器人–任务配对的价值视为与其他一切无关。他们的 iTax 把相互依赖程度作为第一层级，并保留 Gerkey 和 Matarić 的三条轴作为可选的第二层级，例如写作 <code>XD[ST-MR-TA]<\/code>。各层级如下：<\/p>\n<ul><li><b>ND，无依赖：<\/b>每个配对的效用可以单独计算。这就是原分类法的设定。<\/li>\n<li><b>ID，调度内依赖：<\/b>配对效用取决于同一机器人承担的其他任务，例如行驶距离取决于路线。<\/li>\n<li><b>XD，跨调度依赖：<\/b>还取决于其他机器人的调度，例如“推车通过之前要先开门”。<\/li>\n<li><b>CD，复杂依赖：<\/b>还取决于任务最初如何分解，因此任务列表本身也成为决策的一部分。<\/li><\/ul>\n<p>用五个问题的语言说，iTax 是关于 <b>Q3<\/b> 的陈述：在分配之前写出效用有多难。到了 CD，连 <b>Q1<\/b>（任务是什么）也成为决策的一部分。<\/p>\n<p><b>图<\/b>依照 Korsah 等 (2013) 的 iTax 示意图重绘。ND 中每个机器人直接连向各自的任务。ID 中每个机器人的任务连成一条路线，因此一个任务的代价取决于路线上的相邻任务。XD 中有一条约束（“先后”）把不同机器人路线上的任务连在一起。CD 中同一项工作有 A、B 两种不同的分解相互竞争，因此有哪些子任务本身就是选择的一部分。<\/p>"}, "p1-the-table-as-a-reference-case": {"title": "作为参照情形的效用表", "bullets": ["参照情形：效用表 <span class=\"m\">U(robot, task)<\/span> 在分配<b>之前<\/b>即可获得", "Q1–Q3 变成<b>输入<\/b>；Q4 是求解器发挥作用的地方", "许多方法<b>放松<\/b>了这一点：随机的、耦合的、在线的、学习得到的（2.7）"], "notesTitle": "塑造一切的那个假设", "notes": "<p>把这些分类法并排放在一起，底下浮现出一个默认的工作流程：<b>先得到效用表 U(robot, task)，再在其上做组合优化。<\/b><\/p>\n<p>用五个问题的语言说，Q1 到 Q3（有哪些任务、谁能做、每个配对值多少）被视为已知，或至少可以从模型直接算出。大部分算法工作集中在 Q4：高效地、带保证地、且常常以分布式方式求解。Q5 主要通过在情况变化时重新分配来处理，也就是在更新后的表上再跑一遍 Q4。<\/p>\n<div class=\"key\"><span class=\"lbl\">关键结论<\/span>这是一个有用的参照情形，而不是经典 MRTA 的定义。随机、耦合、动态与混合方法以多种方式放松了它（2.7）。对于给定设定，有用的问题是：表中哪一部分不可获得、不确定，或会因分配本身而改变，以及是否已有方法处理了这一点。<\/div>\n<p>想看一张表如何从零算出并求解，点击图中表格下方的<b>看一个算例<\/b>。它会打开一个旁页，旁页上的返回按钮可回到这里。<\/p>", "eyebrow": "第一部分 · 隐含假设"}, "p1-a-worked-example-three-robots-three-jobs": {"key": "p1-a-worked-example-three-robots-three-jobs", "eyebrow": "第一部分 · 旁页 · 算例", "title": "一个算例：三个机器人，三项任务", "bullets": ["仓库场景；代价 = 完成任务所需的<b>秒数<\/b>", "每个格子 = <b>地图距离 ÷ 额定速度 + 标称操作时间<\/b>", "没有机械臂 → <span class=\"m\">∞<\/span>：能力以可行性的形式进入", "匈牙利算法选出 R1→T1、R2→T3、R3→T2（85 s）", "这一切都在<b>任何机器人移动之前<\/b>就算好了"], "notesTitle": "先建表，再求解", "notes": "<p>用一个小仓库把这个流程具体化。共有三个机器人和三项任务：<\/p>\n<ul><li><b>R1<\/b> 和 <b>R2<\/b> 是额定速度 1 m/s 的移动底盘，没有机械臂。R1 在码头，R2 在 5 号通道。<\/li>\n<li><b>R3<\/b> 是额定速度 0.5 m/s 的移动操作机器人，停在货架附近。<\/li>\n<li><b>T1<\/b>：把一个周转箱从 3 号通道搬到码头。<b>T2<\/b>：从 B 货架取一个零件，需要机械臂。<b>T3<\/b>：巡检 7 号通道。<\/li><\/ul>\n<p><b>第一步，建表。<\/b>每个格子是一个预估完成时间。对于 R1→T1：以 1 m/s 行驶 30 m 到 3 号通道需 30 s，再加 10 s 标称装载时间，共 40 s。R1 和 R2 没有机械臂，所以它们的 T2 格子为 ∞（不可行）。对每一对重复这一计算，就得到幻灯片上的 3×3 表。<\/p>\n<p><b>第二步，求解。<\/b>R3 是唯一能做 T2 的机器人，所以它拿到 T2（25 s）。R1 和 R2 分担 T1 和 T3：R1→T1 加 R2→T3 代价为 40 + 20 = 60 s；交换后为 70 + 30 = 100 s。匈牙利算法返回前者，总计 85 s。若目标是 makespan（最小化最慢机器人的完成时间），这里答案相同，在 40 s 完成。<\/p>\n<p><b>每个输入的来源。<\/b>列来自订单系统 (Q1)。∞ 项来自规格表 (Q2)。数值来自地图、额定速度和标称操作时间 (Q3)。这一切在任何机器人移动之前就已存在，而求解器 (Q4) 从不质疑其中任何一项。<\/p>\n<div class=\"key\"><span class=\"lbl\">这张表默默假设了什么<\/span>\n<ul style=\"margin:6px 0 0\">\n<li>额定速度就是真实速度：没有拥堵、没有低电量、通道里没有人。<\/li>\n<li>操作时间每次都是标称的 10 s。<\/li>\n<li>能力就是规格表上写的那样，且不会改变。<\/li>\n<li>每个格子相互独立：R1 穿过 3 号通道不会拖慢 R2（即 iTax 中的 ND 情形）。<\/li>\n<li>团队是固定的。如果一分钟后又来了第四个机器人，没人知道它那一行该填什么。<\/li><\/ul><\/div>\n<p>在一个整洁的仓库里，这些假设各自都合理。本综述其余部分要问的是：当它们不再成立时会发生什么。<\/p>"}, "p2-centralized-optimization": {"key": "p2-centralized-optimization", "eyebrow": "第二部分 · 流派一", "title": "集中式优化", "bullets": ["一个规划器看到一切，求出最优方案", "ST-SR-IA 用<b>匈牙利算法<\/b>；更丰富的变体用 <b>MILP / VRP<\/b> 建模", "<b>假设：<\/b>全部信息集中在一处；效用由模型计算", "<b>代价：<\/b>可扩展性差、单点故障、对模型误差脆弱"], "notesTitle": "优化者的视角", "notes": "<p>这是对“先有表，再求解”最直接的诠释。所有信息汇集到一处，由模型为每个配对计算效用或代价，再由求解器返回最优分配。<\/p>\n<ul><li>对 <code>ST-SR-IA<\/code>，匈牙利算法在多项式时间内给出精确最优解。图中是一个 3×3 实例，最优总代价为 5。<\/li>\n<li>对多任务机器人、多机器人任务或调度问题，通常写成混合整数线性规划，或带时间窗与先后约束的车辆路径 / 多旅行商变体。Nunes 等 (2017) 系统整理了时间约束和顺序约束的各种变体。<\/li><\/ul>\n<p><b>五问解读。<\/b>Q1：已知的任务列表。Q2：每个机器人的已知模型。Q3：由该模型计算。Q4：精确或近似求解器。Q5：变化时重新求解。<\/p>\n<p><b>优点：<\/b>最优或有界次优，问题表述清晰。<b>缺点：<\/b>计算量增长很快，一切依赖与规划器的通信，结果的好坏取决于表背后的模型。<\/p>", "solves": "在世界完全已知时，求出可证明最优的方案", "introNote": "这些建模方式源自 20 世纪 50 年代的运筹学，当时的问题是在工厂或车场中分派工人、卡车或机器。世界是已知的，问题纯粹在于如何选得好。机器人学在同样的情境下采用了它们：已知地图、已知机器人、已知任务列表，并需要最优或有界次优的方案。"}, "p2-linear-assignment-the-one-easy-corner": {"key": "p2-linear-assignment-the-one-easy-corner", "eyebrow": "第二部分 · 流派一 · 深入", "title": "线性指派：唯一容易的角落", "bullets": ["<b>ST-SR-IA<\/b> 格，代价相互独立 (ND)", "一个<b>表现得像 LP<\/b> 的整数规划；匈牙利算法在 <span class=\"m\">O(n³)<\/span> 内精确求解", "一旦一个机器人承担两个任务，或一个任务需要两个机器人，就不再成立"], "notesTitle": "为什么唯独这个问题容易", "notes": "<p><b>变量。<\/b>若机器人 <i>i<\/i> 执行任务 <i>j<\/i>，则 <code>x_ij = 1<\/code>。<b>目标。<\/b>效用表中的总代价。<b>约束。<\/b>每个机器人恰好承担一个任务，每个任务恰好分到一个机器人。这正是第一部分的仓库算例。<\/p>\n<p><b>为什么容易。<\/b>整数规划通常很难，但这个约束矩阵是<i>全单模<\/i>的：LP 可行域的每个顶点坐标都已是 0/1。去掉整数约束、求解 LP，得到的解自然是整数。匈牙利算法通过 LP 对偶（每个机器人和每个任务各一个“势”）利用这一结构，在 <code>O(n³)<\/code> 内找到精确最优解。上千个机器人和任务也是常规规模。<\/p>\n<p><b>仍然容易的实用变体。<\/b><\/p>\n<ul><li>机器人与任务数量不等：用零代价的虚拟行或列补齐。<\/li>\n<li>最大化效用而非最小化代价：把表取负。<\/li>\n<li><b>瓶颈指派<\/b>，最小化单个最差代价 <code>max c_ij<\/code> 而非总和。这是 makespan 版本，同样是多项式时间可解。<\/li><\/ul>\n<p><b>通向流派二的桥梁。<\/b>Bertsekas 的<i>拍卖算法<\/i>把对偶变量解读为价格来求解同一问题：任务被争抢时提价，机器人竞拍“价值减价格”最大的任务。机器人拍卖正是源自这一视角。<\/p>\n<p><b>适用条件：<\/b>每个任务一个机器人、一次性决策、代价已知且相互独立。由于速度极快，每次变化都重新求解是处理 Q5 的实用办法。<\/p>", "solves": "以最小总代价把 n 名工人分配给 n 项工作", "introNote": "Kuhn (1955) 建立在 König 和 Egerváry 的早期结果之上，因此得名“匈牙利”算法。最初的问题是人员指派：n 名工人、n 项工作，每个配对的代价已知。在机器人学中，它解决一次性的一对一指派：哪个机器人去哪个目标点、目标物或编队位置。", "mathNotes": ["", "每个机器人：一个任务", "每个任务：一个机器人", ""]}, "p2-add-a-budget-the-generalized-assignment-problem": {"key": "p2-add-a-budget-the-generalized-assignment-problem", "eyebrow": "第二部分 · 流派一 · 深入", "title": "加入预算：广义指派问题", "bullets": ["一个机器人可在预算内承担<b>多个任务<\/b>", "改动一条约束就变成 <b>NP-hard<\/b>（它包含背包问题）", "可用 MILP 分支定界、拉格朗日松弛或贪心求解"], "notesTitle": "一条约束改变了复杂度类", "notes": "<p>把“每个机器人恰好承担一个任务”换成“每个机器人承担的任务必须在其预算之内”。这里 <code>w_ij<\/code> 表示任务 <i>j<\/i> 占用机器人 <i>i<\/i> 多少资源（时间、电量、载荷），<code>b_i<\/code> 是预算。<\/p>\n<p><b>所处位置。<\/b>当预算是被同时服务的任务共享的资源（如载荷）时，它对应 MT-SR-IA。它也是时间扩展分配最常见的<i>忽略顺序的近似<\/i>：给每个机器人一个时间或电量预算，忽略它执行任务的先后顺序。<\/p>\n<p><b>为什么难。<\/b>预算行是一个背包约束，因此矩阵不再全单模。LP 顶点可能是分数（这里半个任务、那里半个任务），对其取整并不保证正确。该问题是 NP-hard 的。<\/p>\n<p><b>常用解法。<\/b><\/p>\n<ul><li><b>分支定界 MILP<\/b>（Gurobi、CPLEX、OR-Tools）。界足够好时，几百个任务通常没问题。<\/li>\n<li><b>拉格朗日松弛<\/b>：用乘子把预算行移入目标函数。每个子问题重新变得容易，乘子还给出下界。<\/li>\n<li><b>贪心<\/b>：反复分配代价最低的可行配对。速度快，一般无保证。<\/li><\/ul>\n<p><b>仍然缺少：<\/b>任务之间的顺序和移动。一旦某任务的代价取决于机器人之前刚做了什么（iTax 中的 ID），问题就变成路径规划，见下一页。<\/p>", "solves": "把工作分配给各自容量有限的代理", "introNote": "Ross 和 Soland (1975) 研究了把工作分配给代理、且每个代理总负载不得超过容量的问题，这是设施选址和机器负载中的常见结构。在机器人学中，它处理机器人在时间、电量或载荷预算内承担多个任务、且任务顺序不太重要的情形。", "mathNotes": ["", "每个任务：一个机器人", "机器人 i 的预算", ""]}, "p2-add-time-routing-and-scheduling-milps": {"key": "p2-add-time-routing-and-scheduling-milps", "eyebrow": "第二部分 · 流派一 · 深入", "title": "加入时间：路径与调度 MILP", "bullets": ["<b>ST-SR-TA<\/b> 格，常带跨机器人约束 (XD)", "决定<b>谁来做、按什么顺序、何时做<\/b>", "Big-M 把顺序与时间联系起来，却削弱了 LP 界：精确求解只能到几十个任务"], "notesTitle": "谁来做、按什么顺序、何时做", "notes": "<p>一旦顺序重要，决策就变成为每个机器人确定<b>一条路线加一个时间表<\/b>。这就是带时间窗的多车辆路径问题（VRPTW；无时间窗时为 mTSP）。<\/p>\n<p><b>变量。<\/b>若机器人 <i>k<\/i> 从任务 <i>i<\/i> 直接前往任务 <i>j<\/i>，则 <code>x_ijk = 1<\/code>。<code>s_j<\/code> 是任务 <i>j<\/i> 的开始时间，<code>d_j<\/code> 是其持续时间，<code>t_ij<\/code> 是任务间行驶时间，<code>C_max<\/code> 是 makespan。流守恒约束（幻灯片未列出）保证每个机器人选中的边构成一条路线。<\/p>\n<p><b>解读约束。<\/b><\/p>\n<ul><li><b>big-M<\/b> 那一行表示：若机器人 <i>k<\/i> 从 <i>i<\/i> 去 <i>j<\/i>，则 <i>j<\/i> 不能在 <i>i<\/i> 完成并行驶过去之前开始；否则，一个很大的 <code>M<\/code> 使该约束失效。<\/li>\n<li><b>时间窗<\/b>限定任务可开始的时段，例如码头只在 30 s 到 50 s 之间可用。<\/li>\n<li>跨机器人的<b>先后约束<\/b>（T2 必须在 T5 开始前完成）就是 iTax 所说的 XD。图中 R2 不得不为此等待。<\/li><\/ul>\n<p><b>为什么慢。<\/b>Big-M 约束给出非常松的 LP 松弛，因此分支定界要搜索一棵很大的树。精确解适用于几十个任务的规模；超出后，人们使用插入启发式、大邻域搜索，或对问题进行分解。Tercio (Gombolay 等, 2013) 只在机器人–任务指派上使用 MILP，用快速排序器处理顺序与时间，并在两者之间迭代。<\/p>\n<p><b>目标函数很重要。<\/b>总行驶距离、makespan 和加权完成时间在相同约束下会给出不同方案。Nunes 等 (2017) 系统整理了时间约束的各种变体。<\/p>", "solves": "为配送车队规划路线；后来加入时间窗", "introNote": "Dantzig 和 Ramser (1959) 提出了“卡车调度问题”：为一支配送车队规划从车场到各客户的路线。20 世纪 80 年代加入了时间窗，Solomon (1987) 提供了标准基准。当顺序与时间很重要时，机器人学会使用这类建模：配送、巡检，以及带先后约束和共享空间约束的制造单元（例如 Tercio, 2013）。", "mathNotes": ["makespan", "每个任务访问一次", "顺序 ⇒ 时间", "时间窗", "先后约束", ""]}, "p2-add-teams-coalition-formation": {"key": "p2-add-teams-coalition-formation", "eyebrow": "第二部分 · 流派一 · 深入", "title": "加入团队：联盟形成", "bullets": ["<b>ST-MR-IA<\/b> 格：有些任务需要多个机器人", "团队的价值<b>不等于成员之和<\/b>", "多达 2ⁿ 列：集合划分；实践中限制团队规模或使用列生成"], "notesTitle": "当价值属于团队而非单个机器人", "notes": "<p>有些任务需要多个机器人同时参与：搬运重物、护送、区域覆盖。自然的变量是：若联盟 <i>C<\/i>（机器人的一个子集）执行任务 <i>j<\/i>，则 <code>y_Cj = 1<\/code>，代价为 <code>c(C, j)<\/code>。若 <i>C<\/i> 缺少所需能力，代价为无穷大。这是一个<b>集合划分<\/b>问题。<\/p>\n<p><b>为什么难。<\/b>有 <i>n<\/i> 个机器人时，每个任务有 <code>2ⁿ − 1<\/code> 种可能的联盟：5 个机器人有 31 种，20 个约有一百万种。很早就无法枚举所有列，且该问题是 NP-hard 的。<\/p>\n<p><b>常用解法。<\/b><\/p>\n<ul><li><b>限制联盟规模<\/b>不超过 <i>k<\/i>，从而限制列数。Shehory 和 Kraus (1998) 在此限制下给出了具有可证明界的贪心算法。<\/li>\n<li><b>列生成<\/b>：从少量联盟开始，由 LP 对偶提示哪些新联盟可能有帮助。<\/li>\n<li>Vig 和 Adams (2006) 将联盟形成移植到机器人上，加入了局部性和通信约束。<\/li><\/ul>\n<p><b>为何对全局图景重要。<\/b>这是第一个效用无法写成逐 (robot, task) 表格的建模。一个机器人的价值取决于它的队友是谁。这是第一部分“耦合”情形的一个温和版本。<\/p>", "solves": "单个代理无法独立完成的任务", "introNote": "Shehory 和 Kraus (1998) 研究了某些任务需要多个代理能力组合的多智能体系统。Vig 和 Adams (2006) 将其推广到机器人，加入了来自感知和通信范围的约束。它解决任务需要团队时的分配问题：搬运、护送、覆盖。", "mathNotes": ["", "每个机器人至多在 1 个团队", "每个任务分到一个团队", ""]}, "p2-four-formulations-side-by-side": {"key": "p2-four-formulations-side-by-side", "eyebrow": "第二部分 · 流派一 · 深入", "title": "四种建模并列对比", "notesTitle": "如何选择建模方式", "notes": "<p>快速判断哪种建模适用：<\/p>\n<ul><li><b>每个任务一个机器人、当下决策：<\/b>线性指派。速度足以在任何变化时重新求解。<\/li>\n<li><b>机器人承担多个任务、顺序不太重要：<\/b>广义指派。<\/li>\n<li><b>顺序、时间、时间窗或先后约束重要：<\/b>小规模用路径或调度 MILP，大规模用启发式或分解方法（例如 Tercio）。<\/li>\n<li><b>任务需要团队：<\/b>联盟形成，并限制团队规模。<\/li><\/ul>\n<p>表格每往下一行，就加入真实问题的一个特征（预算、时间、团队），而每一步都会使可精确求解的规模大幅下降。<\/p>\n<div class=\"key\"><span class=\"lbl\">共同主线<\/span>四者都把代价 <code>c<\/code> 当作输入。它们的区别在于 Q4 中允许多少结构，而不在于如何回答 Q3。流派二中的市场方法可以看作针对同样目标的分布式近似求解器，其起点正是 Bertsekas 对线性指派的价格诠释。<\/div>", "table": {"head": ["问题", "提出", "G&M 格", "变量", "难点所在", "精确求解器", "精确求解规模（粗略）"], "rows": [["线性指派", "Kuhn 1955", "ST-SR-IA", "x<sub>ij<\/sub>", "无：LP 解天然为整数", "匈牙利算法、拍卖", "数千"], ["广义指派", "Ross & Soland 1975", "MT-SR-IA；不计顺序的 TA", "x<sub>ij<\/sub>", "预算行（背包）", "MILP、拉格朗日松弛", "数百个任务"], ["路径 / 调度", "Dantzig & Ramser 1959", "ST-SR-TA (+XD)", "x<sub>ijk<\/sub>, s<sub>j<\/sub>, C<sub>max<\/sub>", "big-M 顺序–时间耦合", "MILP、约束规划", "几十个任务"], ["联盟形成", "Shehory & Kraus 1998", "ST-MR-IA", "y<sub>Cj<\/sub>", "2ⁿ 种联盟", "集合划分、列生成", "~10–20 个机器人"]], "caption": "规模仅为精确求解的粗略数量级，很大程度上取决于问题结构和求解器。"}}, "p2-distributed-agreement": {"key": "p2-distributed-agreement", "eyebrow": "第二部分 · 流派二", "title": "分布式达成一致", "bullets": ["核心问题：多个决策者如何得到<b>一个一致的分配<\/b>？", "四种答案：<b>拍卖<\/b>（就出价达成一致）、<b>共识<\/b>（就状态或计划达成一致）、<b>分布式优化<\/b>（就精确最优解达成一致）、<b>博弈<\/b>（就均衡达成一致）", "<b>假设：<\/b>每个机器人都能自行为任务定价或评估", "几乎所有方法都假设机器人运行<b>同一套预先约定的协议<\/b>"], "notesTitle": "分散决策，而非抛弃代价表", "notes": "<p>这一流派保留了经典代价表的逻辑，但把决策分散开来。每个机器人只计算表中与自身相关的部分（自身代价、边际代价或效用），再通过某种达成一致的过程，把这些局部视角合成一个一致的分配。该流派按<b>机器人就什么达成一致<\/b>来组织：<\/p>\n<ul><li><b>拍卖<\/b>（2.3.1–2.3.3）：就中标出价达成一致。包括 Contract Net（Smith, 1980）、MURDOCH（Gerkey &amp; Matarić, 2002）、TraderBots 及 Dias et al.（2006）的综述、顺序单物品拍卖与组合拍卖。<\/li>\n<li><b>共识<\/b>（2.3.4–2.3.5）：就共享的世界图景或计划本身达成一致。包括共识理论（Olfati-Saber et al., 2007）、隐式协调及其失效（Alighanbari &amp; How, 2005），以及通过共识就中标出价达成一致的 CBBA（Choi, Brunet &amp; How, 2009）。<\/li>\n<li><b>分布式优化<\/b>（2.3.7）：借助分布式拍卖、单纯形、匈牙利或 ADMM 方法，就指派问题的精确最优解达成一致。<\/li>\n<li><b>博弈<\/b>（2.3.8）：就均衡达成一致，即设计每个机器人的效用，使其自利的改进同时改进团队目标。<\/li>\n<li><b>假设失效时<\/b>（2.3.9–2.3.10）：韧性共识可容忍故障或恶意机器人；通过语言达成一致则不再需要共享协议。<\/li><\/ul>\n<p><b>五个问题视角。<\/b>Q1：任务被公告或共享。Q2 与 Q3：每个机器人足够了解自身，能为任务定价或打分。Q4：一个达成一致的过程。Q5：重新执行该过程。<\/p>\n<p><b>优势：<\/b>无单点故障，依靠局部通信即可扩展，部分方法能达到精确最优。<b>不足：<\/b>机器人必须能评估自身；耦合任务难以逐个打分；几乎所有方法都假设所有机器人诚实地运行同一协议。<\/p>", "solves": "在没有中央求解器的情况下得到一个一致的分配", "introNote": "Contract Net Protocol（1980）为分布式问题求解引入了“公告–投标–授予”机制，机器人拍卖（MURDOCH 2002、TraderBots）将其带入实体团队。与此同时，控制理论发展出共识（通过局部平均达成一致）、分布式优化（在网络上运行的精确求解器）和博弈论设计（其均衡即为良好分配的效用）。CBBA（2009）将拍卖与共识结合。这些方法回答的是同一个问题：没有中央规划器时，多个决策者如何得到一个一致的分配？"}, "p2-single-item-auctions-sell-each-task-as-it-arrives": {"key": "p2-single-item-auctions-sell-each-task-as-it-arrives", "eyebrow": "第二部分 · 流派二 · 深入", "title": "单物品拍卖：任务一到就卖出", "bullets": ["一个任务，一轮：<b>发布 → 投标 → 授予<\/b>", "每个机器人只需知道<b>自己的代价<\/b>；拍卖人只需知道出价", "它是一个<b>在线贪心<\/b>算法：快速、鲁棒、短视"], "notesTitle": "最简单的市场", "notes": "<p>一个任务出现时就被发布。每个空闲机器人计算自己的代价（例如到达任务的行驶时间）并作为出价发送。出价最低者中标。接下来的任务以同样方式处理。<\/p>\n<p><b>各方需要知道什么。<\/b>机器人只需知道自身状态和任务描述。拍卖人只需知道出价。通信量为每个机器人每个任务一条消息。这正是拍卖很早就能扩展到真实机器人团队的原因。<\/p>\n<p><b>它实际在计算什么。<\/b>Gerkey 和 Matarić (2004) 指出，这是一种在线贪心指派：每个决策在当时是最优的，且永不重新考虑。图中，T1 到达时把它交给 R2 代价最低，但当 T2 出现时 R2 却正忙着。<\/p>\n<p><b>五问解读。<\/b>Q1：任务逐个到达。Q2 和 Q3：每个机器人为自己定价。Q4：对出价取 argmin。Q5：对新任务天然适用；重新分配旧任务则需要重新拍卖，而 Gerkey 和 Matarić (2004) 的分析认为 MURDOCH 并不这样做。他们的分析表明，这种在线贪心规则的竞争比为 3，对于没有任务模型、也不重新分配的在线指派而言，这已是最好的可能结果。<\/p>", "solves": "在无中央控制器的情况下，随任务出现而分配", "introNote": "Contract Net Protocol (Smith, 1980) 源自分布式问题求解：有工作要分派的节点发布任务，其他节点投标，发布者授予合同。没有任何节点需要全局视图。MURDOCH (Gerkey & Matarić, 2002) 在实体机器人上使用同样的“发布–投标–授予”循环，任务随时间到达，每个任务都拍卖给当时可用的机器人。", "mathNotes": ["机器人 i 对任务 j 的自身代价", "代价最低的可用机器人", "不重新分配"]}, "p2-sequential-single-item-auctions-routing-on-a-budget": {"key": "p2-sequential-single-item-auctions-routing-on-a-budget", "eyebrow": "第二部分 · 流派二 · 深入", "title": "顺序单物品拍卖：低成本的路径规划", "bullets": ["所有未分配任务同时开放；机器人报出<b>边际路线代价<\/b>", "每轮只有<b>唯一最优<\/b>出价中标", "边际代价出价使总距离<b>不超过最优的 2 倍<\/b>"], "notesTitle": "懂得路线的拍卖", "notes": "<p>SSI 保留了单物品拍卖的简洁，同时通过出价引入前瞻。机器人对任务 <i>j<\/i> 的出价，是把 <i>j<\/i> 插入其当前路线 <code>R_i<\/code> 最佳位置后路线代价 <code>PC<\/code> 的增量。图中，R2 能以 +5 把新任务插在两个已有停靠点之间，而 R1 则要远道开过去，增量为 +16。<\/p>\n<p><b>为什么每轮只授予一个。<\/b>如果所有任务并行授予，两个授予单独看都很便宜，合在一起却可能冲突。一次授予一个、让机器人基于更新后的路线重新出价，能保持边际代价的准确。这使 SSI 成为贪心插入（一种标准路径启发式）的分布式版本。<\/p>\n<p><b>保证。<\/b>Lagoudakis 等 (2005) 针对三种团队目标、六种出价规则证明了相对最优解的最坏情况比率。对本文所述的边际路径代价规则 (BidSumPath)，比率为：<\/p>\n<ul><li><b>MiniSum<\/b>（所有机器人的总距离）：至多为最优的 <b>2×<\/b>。<\/li>\n<li><b>MiniMax<\/b>（最长单条路线，即 makespan）：至多 <b>2n×<\/b>，<i>n<\/i> 为机器人数。<\/li>\n<li><b>MiniAve<\/b>（每个目标被访问前的平均时间）：至多 <b>2m×<\/b>，<i>m<\/i> 为目标数。<\/li><\/ul>\n<p>可见同一个廉价拍卖对一种目标近乎最优，对其他目标则只有宽松的界；出价规则应与团队目标匹配。Koenig 及其合作者后来研究了 SSI 的扩展与变体。<\/p>\n<p><b>五问解读。<\/b>Q3 现在是一个<i>边际<\/i>代价，取决于机器人已持有的任务（iTax 中的 ID），这是超越固定表格的一小步，但却是实实在在的一步。<\/p>", "solves": "用仍带保证的低成本拍卖实现多机器人路径规划", "introNote": "Lagoudakis 及其合作者 (RSS 2005) 探讨了简单拍卖能否以可证明的质量解决多机器人路径规划这一时间扩展问题。顺序单物品 (SSI) 拍卖每轮开放所有未分配任务，机器人出价为把任务加入当前路线的边际代价，只有唯一最优出价中标。不同出价规则针对不同团队目标（总距离、makespan、平均延迟）。", "mathNotes": ["边际路线代价", "每轮授予一个", ""]}, "p2-combinatorial-auctions-bid-on-bundles": {"key": "p2-combinatorial-auctions-bid-on-bundles", "eyebrow": "第二部分 · 流派二 · 深入", "title": "组合拍卖：对任务包出价", "bullets": ["机器人对<b>任务集合<\/b>出价，从而把协同效应计入价格", "确定中标者是<b>加权集合打包<\/b>问题：NP-hard", "实用版本会限制允许出价的任务包"], "notesTitle": "为协同效应定价", "notes": "<p>如果两个任务离得很近，一起做的代价小于分别做的代价之和。图中，R1 一起做 T1 和 T2 代价为 10，分开做则为 7 + 7 = 14。单物品拍卖看不到这一点；组合拍卖允许 R1 直接对任务包 <code>{T1, T2}<\/code> 出价。<\/p>\n<p><b>优化问题。<\/b>若机器人 <i>i<\/i> 以估值 <code>v_i(B)<\/code> 赢得任务包 <i>B<\/i>，则 <code>z_iB = 1<\/code>。每个任务至多出现在一个中标包中，每个机器人至多赢得一个包。这个“中标者确定问题”就是加权集合打包，是 NP-hard 的。它与 2.2.4 中的联盟形成非常相似，只是用任务包代替了机器人团队。<\/p>\n<p><b>两重代价。<\/b>机器人需要评估多达 <code>2ᵐ − 1<\/code> 个任务包，拍卖人需要求解一个 NP-hard 问题。实践中，任务包被限制为小规模或相邻任务，中标者确定也采用近似求解。<\/p>\n<p><b>要点。<\/b>组合拍卖原则上能正确处理调度内依赖 (ID)，但它把大部分困难计算重新集中到了拍卖人身上。<\/p>", "solves": "捕捉一起做更便宜的任务之间的协同效应", "introNote": "Berhault 及其合作者 (IROS 2003) 将组合拍卖用于多机器人探索，在那里一起访问两个相邻目标要比分别访问便宜得多。单物品拍卖无法表达这种协同效应；允许机器人对任务包出价则可以。", "mathNotes": ["", "每个任务只卖出一次", "每个机器人一个任务包", ""]}, "p2-consensus-before-planning": {"key": "p2-consensus-before-planning", "eyebrow": "第二部分 · 流派二 · 深入", "title": "先共识，再规划", "bullets": ["机器人先<b>就共享图景达成一致<\/b>，再各自运行同一个规划器", "在连通图上一致性以<b>指数速度<\/b>收敛，但在有限时间内永远不精确", "微小的残余差异仍可能导致<b>冲突<\/b>的分配"], "notesTitle": "输入一致不等于决策一致", "notes": "<p><b>共识理论。<\/b>每个机器人持有某个共享量的估计 <code>x_i<\/code>，并反复向邻居的值靠拢。Olfati-Saber、Fax 和 Murray（2007）证明：在强连通且平衡的图上，所有机器人以指数速度收敛到初值的平均，速率由图的代数连通度决定。该结论在切换拓扑下依然成立，并在一定界限内容忍通信时延。图中是四个机器人在环形拓扑上的仿真。<\/p>\n<p><b>用于分配。<\/b>若所有机器人对任务位置、机器人状态和代价完全一致，每个机器人就可运行同一个确定性规划器，无需进一步通信便能算出相同的分配。Alighanbari 和 How（2005）称之为隐式协调。<\/p>\n<p><b>为何脆弱。<\/b>共识是渐近的：估计会很接近，但在有限时间内很少完全相同，而且新观测不断到来。分配是离散的，输入上的细微差异就可能翻转决策，两个机器人可能同时认领同一任务（图下方）。Alighanbari 和 How 报告的正是这一现象：对态势感知的共识是必要的，但缓慢且不完整，冲突随之而来。他们的修正是同时交换候选计划，从而把一致性从输入转移到决策上。接下来的 CBBA 就是这一思路的成熟版本。<\/p>\n<p><b>五个问题视角。<\/b>Q4 变为“先达成一致，再各自决策”；Q2 和 Q3 必须纳入共享状态，因此每个机器人都需要掌握其他所有机器人能力的模型。<\/p>", "solves": "先就输入达成一致，使每个机器人都能运行同一个规划器", "introNote": "共识理论（Olfati-Saber、Fax 和 Murray 2007 年的综述）说明了网络化智能体如何通过与邻居反复平均来就共享值达成一致。Alighanbari 和 How（2005）将这一思想用于 UAV 任务分配：若每架飞行器先就态势达成一致，便可各自在本地副本上运行同一个集中式规划器（“隐式协调”）。他们发现这种共识虽然必要，但缓慢且常常不完整，残余差异会导致分配冲突。其补救办法是同时交换候选计划，由此发展出计划层面的共识，并最终演化为 CBBA。", "mathNotes": ["与邻居取平均", "连通且平衡的图", "隐式协调"]}, "p2-cbba-bundles-plus-consensus-no-auctioneer": {"key": "p2-cbba-bundles-plus-consensus-no-auctioneer", "eyebrow": "第二部分 · 流派二 · 深入", "title": "CBBA：任务包加共识，无需拍卖师", "bullets": ["每个机器人依据自身的边际得分，贪心地<b>构建任务包<\/b>", "邻居之间<b>就中标出价达成一致<\/b>，而非就世界状态达成一致", "即使各方视图不一致，也已证明无冲突；在收益递减且信息共享时，为<b>≥ 最优解的 50%<\/b>"], "notesTitle": "CBBA 如何运作", "notes": "<p>CBBA 在两个阶段之间交替，直至不再发生变化。<\/p>\n<p><b>阶段一：任务包构建。<\/b>机器人 <i>i<\/i> 维护一个任务包 <code>b_i<\/code> 和一条路径 <code>p_i<\/code>。它反复加入边际得分 <code>S_i(p_i ⊕ j) − S_i(p_i)<\/code> 最高的任务，候选范围仅限于它仍可能赢得的任务，即其得分高于该任务当前已知最高出价 <code>y_ij<\/code> 的任务。<\/p>\n<p><b>阶段二：共识。<\/b>机器人将其中标出价列表 <code>y<\/code> 和中标者列表 <code>z<\/code> 发送给邻居，并按一张固定的规则表解决冲突，利用时间戳丢弃过时信息。若机器人得知自己在某任务上被更高出价超越，它会释放该任务<i>以及在其之后加入的所有任务<\/i>，因为后续任务的边际得分是在假设该任务仍在路径中的前提下计算的。<\/p>\n<p><b>理论保证。<\/b>Choi 等人证明了 CBBA 在 N<sub>min<\/sub>·D 轮内收敛到无冲突分配，其中 N<sub>min<\/sub> = min(任务数, 机器人数 × 任务包上限)，D 为网络直径（静态网络、同步轮次）；并且即使机器人对世界的认识不一致，无冲突性依然成立。若得分满足<i>边际收益递减<\/i>（向任务包中加入一个任务，绝不会使剩余任务变得更有价值），且机器人共享相同的态势信息，则结果等同于顺序贪心，并且至少为最优解的 50%。引理 4 表明，只要从不抬高出价，任何评分机制下都能保证无冲突收敛；只有与顺序贪心一致这一结论和 50% 界才需要收益递减。实际中 CBBA 通常比 50% 这一界更接近最优得多。<\/p>\n<p><b>五问解读。<\/b>Q2 和 Q3：每个机器人仍为自己定价，只是改用边际得分。Q4：分布式贪心加共识。收益递减条件很重要：2.3.3 中那种任务包协同效应就违反了这一条件。<\/p>", "solves": "机器人持有不一致的认知、且只能与邻居通信时，实现无冲突分配", "introNote": "基于共识的捆绑算法 (consensus-based bundle algorithm) 源于 UAV 编队场景：每个成员看到的世界图景各不相同且部分过时，并且只能与附近队友通信。早期的共识方法要求在规划前先就世界状态达成一致；CBBA 则直接就中标出价达成一致，代价更低，也能容忍对世界状态的分歧。", "mathNotes": ["我能赢下的最佳任
