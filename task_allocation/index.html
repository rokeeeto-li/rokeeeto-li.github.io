务", "边际得分", "就中标者达成一致", ""]}, "p2-four-auctions-side-by-side": {"key": "p2-four-auctions-side-by-side", "eyebrow": "第二部分 · 流派二 · 深入", "title": "四种拍卖机制对比", "notesTitle": "如何选择拍卖机制", "notes": "<ul><li><b>任务随时间到达、机器人一次只做一个：<\/b>单项拍卖。简单而鲁棒，但决策会较短视。<\/li>\n<li><b>每个机器人执行一条任务路线：<\/b>SSI。接近贪心插入，对某些目标函数有理论保证。<\/li>\n<li><b>任务间存在强协同效应：<\/b>组合拍卖，需限制任务包的形式。<\/li>\n<li><b>没有可靠的中心节点、通信差或仅限局部：<\/b>CBBA。<\/li><\/ul>\n<div class=\"key\"><span class=\"lbl\">共同主线<\/span>每种拍卖都要求每个机器人为自己给任务定价。效用表并未被取消，而是被拆开计算，每个机器人负责一行。若机器人无法为自己定价，例如一个尚不清楚自己在该团队中效能的新加入者，拍卖就无从下手。<\/div>", "table": {"head": ["拍卖类型", "提出", "拍卖对象", "出价", "难点", "理论保证", "可处理的耦合"], "rows": [["单项拍卖", "Smith 1980; MURDOCH 2002", "单个任务，到达即拍", "自身代价", "无难点；但短视", "竞争比为 3；在线情形下的最好可能 (G&amp;M 2004)", "无"], ["SSI", "Lagoudakis 2005", "每轮一个任务，所有未分配任务参与", "路线边际代价", "m 轮，每轮 n·m 个出价", "总距离 ≤ 2 倍；makespan 下更松", "ID，经由边际代价"], ["组合拍卖", "Berhault 2003", "任务包", "任务包价值", "胜者确定问题是 NP-hard", "一般无保证；胜者确定问题为近似求解", "ID，协同效应"], ["CBBA", "Choi 2009", "贪心构建的任务包", "边际得分", "在 N<sub>min<\/sub>·D 轮内收敛（D = 网络直径）", "无冲突；收益递减且信息共享时 ≥ 50%", "ID，无协同效应"]], "caption": ""}}, "p2-distributed-optimisation-exact-together": {"key": "p2-distributed-optimisation-exact-together", "eyebrow": "第二部分 · 流派二 · 深入", "title": "分布式优化：一起求精确解", "bullets": ["机器人与邻居交换<b>标号、价格、基或对偶变量<\/b>", "保证：在连通性条件下，有限时间内得到<b>同一最优解<\/b>", "仅限<b>线性、一对一<\/b>指派；耦合会破坏问题结构"], "notesTitle": "精确解，去中心化求得", "notes": "<p>这类方法保留 2.2.1 中的经典问题，只改变由谁来计算。每个机器人只知道代价表中属于自己的那一行，且只与邻居通信；目标是让每个机器人最终得到同一个最优指派。<\/p>\n<ul><li><b>分布式拍卖<\/b>（Zavlanos, Spesivtsev & Pappas, 2008）：将 Bertsekas 的拍卖算法扩展到随时间连通的网络上，通过多跳转发价格。结果与最优解相差不超过 <code>nε<\/code>；对整数收益且 <code>ε &lt; 1/n<\/code> 时精确最优；迭代次数随网络直径增长。<\/li>\n<li><b>分布式单纯形<\/b>（Bürger, Notarstefano, Bullo & Allgöwer, 2012）：每个机器人持有 LP 中属于自己的列；在周期性连通的网络上，机器人在有限时间内就同一最优基达成一致，退化问题亦然。<\/li>\n<li><b>分布式匈牙利算法<\/b>（Chopra, Notarstefano, Rice & Egerstedt, 2017）：机器人交换一个小规模图及其标号；在强连通网络上，所有机器人在有限时间内收敛到同一最优指派，同步情形下至多 <code>O(r³)<\/code> 轮。<\/li>\n<li><b>共识 ADMM<\/b>（Shorinwa, Haksar, Washington & Schwager, 2023）：将二值指派松弛后用共识 ADMM 求解；代价为线性时，松弛最优解即为整数解。其中一个变体只共享对偶变量，有利于隐私。<\/li><\/ul>\n<p><b>前提假设。<\/b>代价可加的线性一对一指派、运行同一算法的合作机器人，以及（始终或随时间）连通的网络。时间耦合、联盟或相互干扰都会破坏使精确求解成为可能的线性结构。<\/p>", "solves": "在没有中央求解器、每个机器人只知自身代价的情况下达到集中式最优解", "introNote": "拍卖和 CBBA 以最优性换取简洁性。控制领域的另一条脉络则追问：若每个机器人只知道自身代价、只与邻居通信，能否计算出指派问题的精确最优解？拍卖算法（Zavlanos et al. 2008）、单纯形法（Bürger et al. 2012）、匈牙利算法（Chopra et al. 2017）和 ADMM（Shorinwa et al. 2023）的分布式版本给出的答案都是肯定的，前提是满足连通性假设。", "mathNotes": ["机器人 i 只知道第 i 行", "同 2.2.1", "仅靠局部交换"]}, "p2-game-theoretic-allocation": {"key": "p2-game-theoretic-allocation", "eyebrow": "第二部分 · 流派二 · 深入", "title": "博弈论分配", "bullets": ["每个机器人优化<b>自身效用<\/b>；设计者负责塑造这些效用", "采用<b>边际贡献<\/b>效用时，团队目标即为势函数", "学习过程收敛到<b>纳什均衡<\/b>，但未必最优", "只需关于谁选了什么的<b>局部<\/b>信息"], "notesTitle": "分配即均衡", "notes": "<p>博弈论分配完全去掉了中央决策。每个机器人在给定他人选择的情况下，反复选择使自身效用 <code>U_i<\/code> 最大的任务。设计问题转移到了效用的选择上。<\/p>\n<p><b>势博弈。<\/b>若每个机器人的效用是其对团队目标 <code>G<\/code> 的边际贡献（“wonderful life utility”），则任何提升某个机器人效用的改变都会使 <code>G<\/code> 提升相同的量。<code>G<\/code> 是一个势函数：最优响应动态只能使其上升，因此必然停止，且停在纳什均衡处。Arslan、Marden 和 Shamma（2007）针对飞行器–目标指派发展了这一框架，并采用空间自适应博弈等学习规则；Marden、Arslan 和 Shamma（2009）将其推广到动作集受限且时变的协同控制。<\/p>\n<p><b>联盟。<\/b>Jang、Shin 和 Tsourdos（2018）采用匿名享乐博弈（GRAPE）：机器人按联盟规模表达偏好，通过局部交换在多项式时间内达到纳什稳定划分，在单调性条件下至少获得最优福利的 50%。<\/p>\n<p><b>局限。<\/b>均衡是稳定的，但未必最优（图中的差距）。计算边际贡献可能需要了解他人的动作。而且机器人实际上并非自利的；博弈只是一种设计手段。真正具有策略性的智能体需要机制设计（见第三部分 E7c）。<\/p>", "solves": "让各自只优化自身效用的机器人得到良好的分配", "introNote": "Arslan、Marden 和 Shamma（2007）把飞行器–目标指派视为一场博弈：每架飞行器选择目标以最大化自身效用，设计者则选择这些效用（例如每架飞行器的边际贡献），使博弈成为以团队目标为势函数的势博弈。简单的学习规则随后即可收敛到纳什均衡。Marden et al.（2009）将其推广到协同控制。Jang et al.（2018）用享乐博弈在大规模团队中形成任务联盟。", "mathNotes": ["仅自身效用", "边际贡献", "最优响应使 G 上升"]}, "p2-resilient-consensus-when-robots-fail-or-lie": {"key": "p2-resilient-consensus-when-robots-fail-or-lie", "eyebrow": "第二部分 · 流派二 · 深入", "title": "韧性共识：当机器人出错或说谎", "bullets": ["一个故障或恶意机器人就足以破坏<b>普通<\/b>共识", "先<b>剔除<\/b>邻居中的极端值，再取平均", "若网络是<b>鲁棒的<\/b>（比连通更强的条件），正常机器人能达成一致", "一致对象是<b>标量值<\/b>；推广到分配仍是开放问题"], "notesTitle": "为何这对非自建团队至关重要", "notes": "<p>前面所有达成一致的方法都假设所有机器人诚实地遵循同一协议。在 ad hoc 或多厂商混合团队中，这正是最先失效的假设：队友可能故障、标定错误，或只是运行着不同的软件。<\/p>\n<p><b>W-MSR 规则。<\/b>每个正常机器人丢弃所收到值中最大的至多 <code>F<\/code> 个和最小的至多 <code>F<\/code> 个，再对其余值取平均。LeBlanc et al.（2013）证明此时连通性不再是合适的条件；图必须是 <i>r-robust<\/i> 的：对任意两个不相交子集，至少有一个子集包含一个在其外部拥有足够多邻居的节点。若恶意机器人总数为 <code>F<\/code>，正常机器人达成共识当且仅当图是 <code>(F+1, F+1)<\/code>-robust 的，且一致值保持在正常机器人初值的范围内。<\/p>\n<p><b>运动中的机器人。<\/b>Saldaña et al.（2017）指出，移动团队的通信图在任一时刻都很少是鲁棒的。他们提出的滑动窗口变体只要求每个时间窗口内图的并集是鲁棒的，并设计机器人运动使这一条件成立。<\/p>\n<p><b>空白。<\/b>这些结果针对的是标量值的一致。对离散分配的韧性一致（说谎的机器人可能认领自己并不会执行的任务）与第三部分的 E7c（策略性智能体）和 E1b（未知队友）相关，目前尚未发现成体系的研究脉络。<\/p>", "solves": "即使至多 F 个机器人发送错误值，仍能达成一致", "introNote": "普通共识假设每个机器人都遵循协议；一个广播错误值的机器人就能把整个团队带偏。LeBlanc、Zhang、Koutsoukos 和 Sundaram（2013）证明，采用简单的剔除规则（W-MSR）时，只要网络在严格的图论意义上是“鲁棒的”，正常机器人仍能达成一致。Saldaña、Prorok、Sundaram、Campos 和 Kumar（2017）将其推广到网络仅在时间窗口上鲁棒的移动机器人。", "mathNotes": ["再取平均", "总数为 F 的恶意节点", "Saldaña et al. 2017"]}, "p2-agreement-through-language": {"key": "p2-agreement-through-language", "eyebrow": "第二部分 · 流派二 · 深入", "title": "通过语言达成一致", "bullets": ["经典共识需要预先约定<b>同一更新规则<\/b>；语言则不需要", "LLM 智能体倾向于<b>取平均<\/b>，但<b>固执<\/b>的智能体会主导，<b>幻觉<\/b>会传播", "2025–26 年的系统用语言协商分配；<b>没有收敛保证<\/b>", "相关方向：与<b>未见过的伙伴<\/b>零样本协调（other-play、有语义锚定的通信）"], "notesTitle": "语言改变了什么，没改变什么", "notes": "<p><b>协议问题。<\/b>前几页的每种方法都假设所有机器人运行同一算法：同样的平均规则、同样的投标规则、同样的平局处理。而这正是 ad hoc 协作无法假设的。自然语言是不同开发者构建的智能体无需事先协调即可能共有的第一种“协议”。<\/p>\n<p><b>LLM 智能体如何达成共识。<\/b>Chen、Ji、Xu 和 Zhao（2023）让 LLM 智能体协商一个共享数值。在没有指令的情况下，智能体大多取平均，与经典共识类似。固执的智能体导致领导者–跟随者结果，多个固执智能体会使群体分裂，易受影响的智能体可能振荡，幻觉也会传播。全连接网络收敛最快。没有收敛性证明，且并非总能达成共识。<\/p>\n<p><b>辩论。<\/b>Du et al.（ICML 2024）让多个 LLM 实例辩论直至达成一致；准确率随智能体数量和轮数增加而提升，约四轮后趋于平稳，但智能体有时会收敛到错误答案。<\/p>\n<p><b>分配系统。<\/b>DynaHMRC（2026）让具有角色意识的 LLM 智能体自我描述、竞选并选出领导者；CLiMRS（2025）组建子群，由管理者智能体主导协商；Ismayilov et al.（2025）交换 LLM 生成的目标排序，并采用固定的平局规则。这些都是没有理论保证的预印本，且没有一项研究独立构建的系统中的智能体彼此协商。LLM-Flock（2025）在不同 LLM 后端之间使用影响力加权共识实现集群飞行。<\/p>\n<p><b>不借助语言、与未见过的伙伴达成一致。<\/b>Other-play（Hu et al., ICML 2020）避免只有特定伙伴才会共享的任意约定；准等价发现（Bullard et al., 2021）找到未见过的伙伴也会收敛到的通信协议；Li et al.（NeurIPS 2024）将多智能体通信锚定在语言上，并报告了零样本 ad hoc 协作。<\/p>\n<div class=\"key\"><span class=\"lbl\">开放问题<\/span>语言消除了对预先约定协议的需要，但没有消除对保证的需要。就分配而言，通过语言达成一致是否收敛、收敛多快、在面对固执、故障或产生幻觉的智能体时如何退化，以及与直接观察队友相比何时值得付出其代价，都尚无答案。<\/div>", "solves": "让不共享任何更新规则的智能体借助自然语言仍能达成一致", "introNote": "所有经典的达成一致方法都要求机器人运行同一套预先设计的协议。大语言模型提供了另一种可能：不同团队构建的智能体可以用自然语言协商。Chen et al.（2023）研究了 LLM 智能体如何达成共识，发现其行为类似经典的平均过程，但带来新的失效模式。多智能体辩论（Du et al., ICML 2024）表明通过讨论达成一致可以改进答案。自 2025 年起，基于 LLM 的去中心化多机器人分配系统已开始以这种方式协商任务。"}, "p2-seven-ways-to-reach-agreement": {"key": "p2-seven-ways-to-reach-agreement", "eyebrow": "第二部分 · 流派二 · 深入", "title": "达成一致的七种方式", "notesTitle": "一个问题，七种答案", "notes": "<p>七种方法回答的是同一个问题：没有中央求解器时，多个决策者如何得到一个一致的分配？它们的区别在于就什么达成一致（高亮列）。<\/p>\n<ul><li>就<b>输入<\/b>（世界）达成一致是脆弱的，因为离散决策会放大微小差异。<\/li>\n<li>就<b>决策<\/b>（出价、胜者、指派、均衡）达成一致则对此鲁棒，理论保证也集中于此。<\/li>\n<li>在存在<b>不良行为者<\/b>时达成一致需要更强的网络条件，且仅针对数值有成熟研究，分配尚未覆盖。<\/li>\n<li>通过<b>语言<\/b>达成一致不再需要共享协议，代价是失去保证。<\/li><\/ul>\n<div class=\"key\"><span class=\"lbl\">共同假设<\/span>除最后一行外，每一行都假设所有机器人运行同一套预先约定的协议。而这恰恰是在 ad hoc 团队和多厂商混合团队中失效的假设，这也是最后两行对第三、第四部分至关重要的原因。<\/div>", "table": {"head": ["方法", "提出", "就什么达成一致", "保证", "前提", "失效情形"], "rows": [["拍卖", "Smith 1980 → Lagoudakis 2005", "中标出价", "贪心或有界（SSI）", "每个机器人为自身定价；需要拍卖人", "机器人无法为自身定价；耦合任务"], ["对世界的共识", "Alighanbari & How 2005", "共享态势图景", "数值上的渐近一致", "相同的规划器；良好连通性", "微小残余差异翻转决策"], ["CBBA", "Choi, Brunet & How 2009", "中标出价与胜者", "无冲突；收益递减且信息共享时 ≥ 50%", "同一协议；收益递减的打分", "协同效应；不诚实出价"], ["分布式优化", "Zavlanos 2008 → Shorinwa 2023", "标号、价格、基、对偶变量", "同一精确最优解", "线性一对一代价；连通性", "耦合、联盟、相互干扰"], ["博弈", "Arslan, Marden & Shamma 2007", "一个均衡", "纳什均衡（非最优）", "设计的效用；重复博弈", "均衡远离最优"], ["韧性共识", "LeBlanc et al. 2013", "数值，尽管存在 F 个不良机器人", "正常机器人之间达成一致", "鲁棒网络；F 已知", "离散分配（开放问题）"], ["语言", "Chen et al. 2023 →", "协商得到的计划", "暂无", "LLM 智能体；通信预算", "固执或产生幻觉的智能体"]], "caption": ""}}, "p2-self-organising-allocation": {"key": "p2-self-organising-allocation", "eyebrow": "第二部分 · 流派三", "title": "自组织分配", "bullets": ["<b>局部响应规则<\/b>；劳动分工<b>自发涌现<\/b>", "完全没有效用表：任务作为环境中的<b>刺激<\/b>出现", "响应阈值、ALLIANCE 动机、群体转移速率", "<b>放弃<\/b>最优性；<b>换来<\/b>鲁棒性且无需通信"], "notesTitle": "跳过效用表的流派", "notes": "<p>这一流派另辟蹊径：没有显式的效用表。任务以机器人可直接感知的刺激形式出现，例如脏地板、不断增长的队列或空闲的工位，每个机器人按照一条局部规则决定何时投入。<\/p>\n<ul><li><b>响应阈值模型<\/b>源自对社会性昆虫分工的研究 (Bonabeau, Theraulaz &amp; Deneubourg, 1996)。机器人以概率 <code>s² / (s² + θ²)<\/code> 投入任务，其中 <code>s<\/code> 为刺激强度，<code>θ<\/code> 为其阈值。阈值较低的机器人先响应，因此无需任何人指派，专业分工便可自发涌现。<\/li>\n<li><b>ALLIANCE<\/b> (Parker, 1998) 采用“动机行为”：当任务无人完成时，机器人会变得<i>不耐烦<\/i>并接手；当自身进展不佳时，它会<i>默许<\/i>并让其他机器人接手。<\/li><\/ul>\n<p><b>五问解读。<\/b>Q1：任务从环境中读取，而非来自列表。Q2：能力编码在阈值中。Q3：没有显式效用。Q4：局部规则。Q5：适应自动发生。<\/p>\n<p><b>为什么叫“自组织”。<\/b>文献中常把这类方法称为“基于阈值”或“群体”方法，但两个名字都覆盖不了整个流派：ALLIANCE 不是群体方法，群体速率设计也不使用阈值。它们的共同点是没有人计算指派方案。每个机器人遵循一条局部规则，劳动分工由这些规则加上来自环境的反馈自发形成。<\/p>\n<p>这是唯一一个不以给定任务列表为起点的经典流派。第四部分会回到这一点。第 2.4.6 页将它与 2.3 的达成一致流派作对比。<\/p>", "solves": "解释昆虫的劳动分工；在机器人失效时保持团队继续工作", "introNote": "响应阈值模型 (Bonabeau, Theraulaz & Deneubourg, 1996) 最初用于解释社会性昆虫如何在没有协调者的情况下分工。ALLIANCE (Parker, 1998) 则为容错而设计：一支异构团队在机器人失效或通信中断时仍能继续工作。两者解决的都是连续、动态的分配问题：任务不断重新出现，且没有人维护任务列表。"}, "p2-fixed-response-thresholds": {"key": "p2-fixed-response-thresholds", "eyebrow": "第二部分 · 流派三 · 深入", "title": "固定响应阈值", "bullets": ["任务是一种<b>刺激<\/b>，无人处理时会不断增长", "低 θ 机器人先响应；高 θ 机器人仅在<b>需求持续上升<\/b>时才响应", "移除部分工作者后，系统<b>无需任何消息<\/b>即可吸收这一变化"], "notesTitle": "作为反馈回路的分配", "notes": "<p>每个任务有一个刺激量 <code>s<\/code>，例如垃圾的多少或队列的长度。它以速率 <code>δ<\/code> 增长，并随机器人处理而下降。每个机器人以概率 <code>T_θ(s)<\/code> 投入，以概率 <code>p<\/code> 停止。阈值 <code>θ<\/code> 低的机器人在刺激较低时就会投入；阈值高的机器人只在刺激较高时才投入。<\/p>\n<p><b>图中是该模型的一次仿真。<\/b>五个低 θ 和五个高 θ 机器人共同处理一个任务。起初，低 θ 机器人将刺激维持在低水平，高 θ 机器人大多闲置。在第 100 步时移除低 θ 机器人。没有人通知其他机器人，但刺激不断攀升，直到高 θ 机器人做出响应，系统稳定在一个新的、更高的刺激水平上。<\/p>\n<p><b>收益。<\/b>无需效用表、无需消息、无需规划器。鲁棒性来自反馈回路本身。<\/p>\n<p><b>代价。<\/b>稳定状态在任何意义上都不是最优的，只是稳定而已。刺激水平是需求的代理量，因此没有合适刺激量的任务难以表达。阈值必须由设计者设定。<\/p>\n<p><b>五问解读。<\/b>Q1：任务是感知得到的，而非列出的。Q2：能力被折叠进 <code>θ<\/code>。Q3：无。Q4：局部随机规则。Q5：自动完成。<\/p>", "solves": "解释蚁群在专职个体被移除后如何让工作继续完成", "introNote": "生物学家观察到，当专门从事某项任务的蚂蚁被移走后，平时忽略该任务的其他蚂蚁会开始承担它。Bonabeau、Theraulaz 和 Deneubourg (1996) 表明一个简单模型即可解释这一现象：每个个体都有一个响应阈值，而当工作被忽视时任务刺激会上升。机器人学借用这一模型，实现无需通信的分配。", "mathNotes": ["每步概率", "", "需求 − 工作"]}, "p2-adaptive-thresholds-specialists-emerge": {"key": "p2-adaptive-thresholds-specialists-emerge", "eyebrow": "第二部分 · 流派三 · 深入", "title": "自适应阈值：专才自发涌现", "bullets": ["执行某任务会<b>降低<\/b>对它的阈值；闲置则会<b>提高<\/b>阈值", "相同的机器人无需规划器即可成为<b>专才<\/b>", "能力不是测量出来的，而是通过重复<b>培养<\/b>出来的"], "notesTitle": "会学习的阈值", "notes": "<p>固定模型需要有人来选定阈值。自适应模型则让阈值自行漂移。当机器人 <i>i<\/i> 执行任务 <i>j<\/i> 时，<code>θ_ij<\/code> 以速率 <code>ξ<\/code> 下降（学习）；不执行时，<code>θ_ij<\/code> 以速率 <code>φ<\/code> 上升（遗忘）。<\/p>\n<p><b>图中<\/b>展示了两个机器人，它们对任务 A 的初始阈值相同。谁碰巧先做了 A，谁的阈值就会降低，从而更可能再次做 A；另一个机器人的阈值则上升。微小的随机不对称被放大为稳定的分工。<\/p>\n<p><b>机器人实验。<\/b>Krieger 等人 (2000) 为觅食的 Khepera 机器人设置了针对群体能量水平的<i>固定<\/i>但因个体而异的阈值。觅食者的数量会自行调节，中等规模的群体觅食效率最高（干扰拖累了更大的群体），而在食物成簇分布时，机器人之间的串联招募使效率提高了约 9%。像上述模型那样随经验自适应的机器人阈值并不在该研究之中。还需注意，机器人是通过无线电从控制站获得群体能量信息的。<\/p>\n<p><b>留待后文的观察。<\/b>这是极少数机器人“能力画像”并非事先给定、而是在运行中形成的经典方法之一。阈值可视为效用表中学习得到的一行，不过它编码的是习惯而非技能：机器人成为专才是因为它做过这项任务，而不是因为它更擅长。<\/p>", "solves": "让专业分工从经验中涌现，而不是靠人为设计", "introNote": "Theraulaz、Bonabeau 和 Deneubourg (1998) 让阈值随经验变化：执行某任务会降低对它的阈值，不执行则会提高。于是相同的个体会分化为专才。在机器人上，Krieger、Billeter 和 Keller (2000) 使用的是固定的、因个体而异的阈值，而非自适应阈值（见备注）。", "mathNotes": ["学习", "遗忘", ""]}, "p2-alliance-impatience-and-acquiescence": {"key": "p2-alliance-impatience-and-acquiescence", "eyebrow": "第二部分 · 流派三 · 深入", "title": "ALLIANCE：不耐烦与默许", "bullets": ["<b>不耐烦<\/b>：被忽视的任务会不断积累动机，直到有人接手", "<b>默许<\/b>：机器人会放弃自己做不好的任务", "容错能力内建其中；不保证最优性（贪心步骤，竞争比至少为 2）"], "notesTitle": "以动机代替消息", "notes": "<p>每个机器人 <i>i<\/i> 对其能执行的每个任务 <i>j<\/i> 维护一个动机值 <code>m_ij<\/code>。动机每步按不耐烦速率增长，并乘以若干取值为 0 或 1 的门控因子：<\/p>\n<ul><li><b>感知反馈：<\/b>该任务此刻是否确实需要？<\/li>\n<li><b>活动抑制：<\/b>我是否已在做别的事情？<\/li>\n<li><b>不耐烦重置：<\/b>是否有其他机器人刚开始执行该任务？<\/li>\n<li><b>默许：<\/b>我是否做了太久却毫无进展？<\/li><\/ul>\n<p>当动机超过阈值 <code>θ<\/code> 时，机器人接手该任务。<\/p>\n<p><b>图中<\/b>跟踪的是机器人 B 对“清扫”任务的动机。当机器人 A 广播自己正在清扫且有进展时，B 的不耐烦只缓慢增长。一旦 A 停止取得进展，B 的不耐烦切换到快速增长，动机越过 <code>θ<\/code>，B 接手。A 则会因默许而自行停止。<\/p>\n<p><b>五问解读。<\/b>Q2 编码在机器人拥有哪些行为集及其不耐烦速率中。Q3 从不计算。Q5 是设计目标：故障无需任何人诊断即可被处理。<\/p>", "solves": "在机器人失效或通信中断时，保持异构团队继续工作", "introNote": "Parker 为在真实机器人上运行的小型异构团队设计了 ALLIANCE，其中任何机器人都可能失效、消息也可能丢失。机器人之间不进行协商，而是各自广播自己正在做什么，并利用内部动机决定何时接手或放弃某项任务。后来的 L-ALLIANCE 又加入了对动机参数的学习。", "mathNotes": ["", "0/1 门控", "接手任务"]}, "p2-swarms-design-transition-rates-not-assignments": {"key": "p2-swarms-design-transition-rates-not-assignments", "eyebrow": "第二部分 · 流派三 · 深入", "title": "群体：设计转移速率，而非具体指派", "bullets": ["将群体建模为<b>各站点上的比例<\/b>，而非单个机器人", "每个机器人以<b>设计好的速率<\/b>随机切换站点", "分配问题转化为<b>设计一个马尔可夫链<\/b>"], "notesTitle": "面向超大规模团队的分配", "notes": "<p>当机器人数以百计时，每个个体去哪里已不重要，重要的是每个站点去了多少。Berman 等人用位于站点 <i>i<\/i> 的机器人比例 <code>x_i<\/code> 来描述群体。站点 <i>i<\/i> 上的每个机器人以速率 <code>k_ij<\/code> 随机转移到站点 <i>j<\/i>。在大群体极限下，各比例服从线性方程 <code>ẋ = −Kx<\/code>，其中 K 的非对角元为 <code>−k_ji<\/code>，对角元为各站点的总离开速率。<\/p>\n<p><b>设计问题。<\/b>在满足 <code>K x_d = 0<\/code> 的前提下选取转移速率，使收敛速度最大（若干表述会对 K 的特征值加界或进行优化），同时限制达到目标后机器人持续切换的程度；若没有这一上限，速率会无限增大。由中央控制器离线计算转移速率并广播；机器人之间不相互通信。<\/p>\n<p><b>图中<\/b>展示了一个群体：初始大多位于站点 1，最终须在三个站点间按 20 / 30 / 50% 分布。<\/p>\n<p><b>五问解读。<\/b>Q1 是一个目标分布。Q2 假设机器人可互换。Q3 被目标分布取代。Q4 是设计出的随机策略。Q5：若目标改变，需广播新的转移速率。<\/p>\n<p><b>为何属于这一流派。<\/b>与阈值模型一样，它以放弃单个机器人层面的最优性换取鲁棒性，且无需机器人之间的通信。与阈值模型不同的是，它通过显式优化来设计，因而是通向流派一的桥梁。<\/p>", "solves": "在机器人之间无需通信的情况下，将大规模群体按目标比例派往各站点", "introNote": "Berman 及其合作者研究的群体规模大到逐个指派已毫无意义。他们将群体建模为在站点间流动的种群比例，并设计单个机器人的随机切换速率，使种群快速收敛到期望分布。优化在离线完成；每个机器人只需按其速率行动。", "mathNotes": ["流入 − 流出", "K = Lᵀ（速率拉普拉斯矩阵）", "离线优化"]}, "p2-four-self-organising-models-side-by-side": {"key": "p2-four-self-organising-models-side-by-side", "eyebrow": "第二部分 · 流派三 · 深入", "title": "四种自组织模型对比", "notesTitle": "这一流派的取舍", "notes": "<p>这四种模型都用局部规则加上来自环境或队友的反馈，取代了显式的效用表。它们放弃最优性，换来鲁棒性、可扩展性以及极少甚至零通信。<\/p>\n<div class=\"key\"><span class=\"lbl\">值得带入后文<\/span>这是唯一一个同时满足以下两点的经典流派：(a) 任务从环境中读取而非来自列表；(b) 在自适应版本中，机器人的画像在运行过程中形成。这两点对于一个中途加入团队、需要弄清自己在哪里有用的机器人都很重要。第四部分会回到这一点。<\/div>", "table": {"head": ["模型", "提出", "状态", "规则", "效果", "适用场景"], "rows": [["固定阈值", "Bonabeau 1996", "刺激 s<sub>j<\/sub>", "以概率 T<sub>θ<\/sub>(s) 投入", "稳定的需求驱动响应", "重复出现的任务、相同的机器人"], ["自适应阈值", "Theraulaz 1998", "s<sub>j<\/sub>, θ<sub>ij<\/sub>", "θ 会学习和遗忘", "专业分工自发涌现", "重复性任务、无预设角色"], ["ALLIANCE", "Parker 1998", "动机 m<sub>ij<\/sub>", "不耐烦、默许", "设计上即具容错性", "小型异构团队、存在故障"], ["速率设计", "Berman 2009", "比例 x", "转移速率 K", "快速收敛到目标配比", "跨站点的大规模群体"]], "caption": ""}}, "p2-agreement-vs-self-organisation": {"key": "p2-agreement-vs-self-organisation", "eyebrow": "第二部分 · 流派三 · 深入", "title": "达成一致 vs 自组织", "bullets": ["达成一致：机器人<b>交换消息<\/b>，直到持有相同的计划", "自组织：机器人<b>读取环境<\/b>，而每个机器人都在改变环境", "只有自组织<b>无需共享协议<\/b>"], "notesTitle": "消息与环境", "solves": "决定机器人应通过交谈协调，还是通过共享环境协调", "introNote": "达成一致流派 (2.3) 与自组织流派 (2.4) 通常被分开讲授。二者都是去中心化的，都依赖局部交互，也都用同一套工具分析：Berman 等人 (2009) 的群体方程与共识动力学 (Olfati-Saber, Fax & Murray, 2007) 形式相同，而 Park, Zhong 和 Leonard (2021) 把任务切换当作群体博弈 (population game) 来分析。二者的区别在于机器人交换的是什么。", "mathNotes": ["对一个值达成一致", "稳定到一个比例", "Park 等, 2021"], "notes": "<p>两个流派都无需中央规划器就能分配工作，也都通过局部交互运作。它们的区别在于交换的是什么，以及“一致”意味着什么。<\/p>\n<table class=\"cmp\"><thead><tr><th><\/th><th>达成一致 (2.3)<\/th><th>自组织 (2.4)<\/th><\/tr><\/thead><tbody>\n<tr><td>交换什么<\/td><td>消息：出价、估计、计划<\/td><td>不直接交换；机器人感知被他人改变的刺激（Berman 的机器人什么也不感知，只按固定速率行动）<\/td><\/tr>\n<tr><td>一致性从何而来<\/td><td>协议：所有人收敛到相同的值<\/td><td>反馈：工作降低需求，无人处理的需求上升<\/td><\/tr>\n<tr><td>结果形式<\/td><td>具名指派，逐个机器人确定<\/td><td>稳定的比例；具体谁做什么可能不断变动<\/td><\/tr>\n<tr><td>最优性<\/td><td>有界（CBBA、SSI、分布式 LP）<\/td><td>通常没有；稳定，但不最优<\/td><\/tr>\n<tr><td>是否需要共享协议？<\/td><td>需要：消息格式、打分规则、平局处理<\/td><td>不需要：只需共享的世界<\/td><\/tr><\/tbody><\/table>\n<p><b>交汇一：同一个方程。<\/b>在共识中，每个机器人向邻居的值靠拢，<code>ẋ = −Lx<\/code>，其中 <i>L<\/i> 是图拉普拉斯矩阵。在 Berman 等人的群体模型中，各站点的机器人比例满足 <code>ẋ = −Kx<\/code>，其中 <code>k_ij<\/code> 是从站点 <i>i<\/i> 切换到站点 <i>j<\/i> 的速率。若把这些速率当作边权，则 <code>K = Lᵀ<\/code>，即同一类拉普拉斯矩阵的转置：共识保持各值的平均（在平衡图上），群体保持机器人总数。两者的收敛速度都由同一类矩阵的谱决定，这也是 Berman 等人能够通过优化特征值来调节速率的原因。<\/p>\n<p><b>交汇二：同一个均衡问题。<\/b>Park, Zhong 和 Leonard (2021) 把任务分配建模为群体博弈：每个机器人的任务选择是一种策略，它切换任务的规则是一种修正协议 (revision protocol)。在大群体极限下，平均动力学收敛到最优的稳态分配，且该分配渐近稳定。这提供了一种追问局部响应规则究竟在优化什么的方法，而阈值文献大多没有回答这个问题。<\/p>\n<div class=\"key\"><span class=\"lbl\">为什么这对开放团队重要<\/span>能交谈的团队通过消息协调；有了语言模型，来自其他厂商的新成员也可能共享这条通道 (2.3.10)。不能交谈的团队仍然共享同一个世界：每个机器人都能观察还剩哪些工作、其他人在做什么。自组织是唯一一个通过这第二条通道协调、且无需共享协议的经典流派。第四部分会回到“说”与“看”这两条通道。<\/div>"}, "p2-learned-policies": {"key": "p2-learned-policies", "eyebrow": "第二部分 · 流派四", "title": "学习型策略", "bullets": ["训练一个策略，将观测映射为谁做什么", "集中式训练的 MARL (QMIX, MAPPO)；用于调度的图网络", "<b>假设：<\/b>奖励编码了效用；测试情形与训练相似", "当<b>团队本身<\/b>与训练时不同，便难以应对"], "notesTitle": "效用转移到奖励中", "notes": "<p>基于学习的方法用训练好的策略取代手写的效用表。某一配对的效用不再被显式写出，而是隐含在策略训练所用的奖励中。<\/p>\n<ul><li><b>合作式 MARL<\/b>，采用集中式训练、分布式执行，例如 QMIX 中的值分解 (Rashid et al., 2018) 或 MAPPO (Yu et al., 2022)。<\/li>\n<li><b>学习型调度器<\/b>，例如在时间约束下学习调度多机器人团队的图注意力网络 (Wang &amp; Gombolay, 2020)。<\/li><\/ul>\n<p><b>五问解读。<\/b>Q1：由环境设计确定。Q2：隐含在策略训练中见过的内容里。Q3：隐含在奖励中。Q4：训练好的策略。Q5：仅在训练分布内得到处理。<\/p>\n<p><b>优点：<\/b>无需编写模型即可处理复杂动力学，训练完成后运行速度快。<b>缺点：<\/b>样本代价、可解释性，以及对未见过的团队构成的泛化能力。最后一点正是开放团队与 ad hoc 协作 (ad hoc teamwork) 研究试图解决的问题。<\/p>", "solves": "当动力学过于复杂、无法手工建模时进行协调", "introNote": "QMIX (2018) 和 MAPPO 等合作式 MARL 方法是在合作博弈上开发和评测的，尤其是 StarCraft II 微操，其中谁做什么必须从快速而复杂的动力学中涌现。学习型调度器（例如 Wang & Gombolay, 2020）旨在用快速的学习近似取代缓慢的 MILP 求解。两者解决的都是写出代价表或精确求解过于困难时的分配问题，前提是有可用于训练的仿真器。"}, "p2-the-model-underneath-dec-pomdps-and-ctde": {"key": "p2-the-model-underneath-dec-pomdps-and-ctde", "eyebrow": "第二部分 · 流派四 · 深入", "title": "底层模型：Dec-POMDP 与 CTDE", "bullets": ["分配不是一个独立步骤：<b>谁做什么从策略中涌现<\/b>", "最优的有限时域求解是 <b>NEXP-complete<\/b> 的", "CTDE：训练时利用全部信息，执行时只用局部信息"], "notesTitle": "效用表去哪了", "notes": "<p>一个 Dec-POMDP 包含智能体集合 <i>I<\/i>、状态 <i>S<\/i>、每个智能体的动作集 <code>A_i<\/code> 和观测集 <code>Ω_i<\/code>、转移 <i>P<\/i>、观测模型 <i>O<\/i>、折扣因子 <code>γ<\/code>，以及一个共享奖励 <i>R<\/i>。每个智能体依据自身的动作–观测历史 <code>τ_i<\/code> 行动。团队最大化期望折扣奖励。<\/p>\n<p><b>没有显式分配。<\/b>不存在机器人–任务变量。若奖励针对完成的任务给出，好的联合策略会自行分工，但这种分工隐含在动作之中。效用存在于 <i>R<\/i> 中，能力存在于 <i>P<\/i> 中（每个机器人的动作能达成什么），两者都只能通过仿真器的采样获知。<\/p>\n<p><b>为何需要近似。<\/b>Dec-POMDP 的最优有限时域求解是 NEXP-complete 的（该结果并不直接覆盖上文的折扣无限时域目标，而后者在实践中并不更容易）。因此深度 MARL 训练近似策略，通常采用 CTDE：训练时，critic 或混合网络可以使用真实状态和所有智能体的动作；执行时，每个机器人只使用自己的观测。<\/p>\n<p><b>五问解读。<\/b>Q1 由环境的构建方式确定。Q2 和 Q3 是隐式且习得的。Q4 是策略。Q5 仅在训练覆盖了该变化时才得到处理。<\/p>", "solves": "部分可观测下分布式决策的形式化模型", "introNote": "Bernstein、Givan、Immerman 和 Zilberstein (2002) 定义了分布式 POMDP，并证明在有限时域上对其进行最优求解，对于两个或更多智能体是 NEXP-complete 的，即使所有智能体的观测合起来能覆盖完整状态也是如此，远难于单智能体 POMDP。正是这一结果使得实用的多智能体学习依赖近似方法，也使“集中式训练、分布式执行”(CTDE) 成为标准折中方案。", "mathNotes": ["", "依据自身历史行动", "一个共享奖励"]}, "p2-value-factorisation-vdn-and-qmix": {"key": "p2-value-factorisation-vdn-and-qmix", "eyebrow": "第二部分 · 流派四 · 深入", "title": "值分解：VDN 与 QMIX", "bullets": ["将团队价值拆分为<b>各智能体的价值<\/b>加一个混合网络", "<b>单调<\/b>混合保证分布式贪心动作的一致性", "无法表示需要智能体<b>非单调协调<\/b>的价值函数"], "notesTitle": "学习可拆分的团队价值", "notes": "<p>每个智能体从自身历史中学习 <code>Q_i(τ_i, a_i)<\/code>。混合网络将它们组合成 <code>Q_tot<\/code>，并以共享奖励进行训练。<\/p>\n<ul><li><b>VDN<\/b> 使用简单求和。<\/li>\n<li><b>QMIX<\/b> 使用一个混合网络，其权重由超网络 (hypernetwork) 根据全局状态生成，并约束为非负。这使 <code>Q_tot<\/code> 对每个 <code>Q_i<\/code> 都是单调的。<\/li><\/ul>\n<p><b>单调性为何重要。<\/b>若任一 <code>Q_i<\/code> 增大时 <code>Q_tot<\/code> 都随之增大，那么最大化 <code>Q_tot<\/code> 的联合动作恰好就是每个智能体各自最大化自身的 <code>Q_i<\/code>。智能体在执行时可以独立地贪心行动，同时仍作为一个团队行事。<\/p>\n<p><b>局限。<\/b>有些协调问题不是单调的：两个机器人各自都更偏好任务 A，但团队的最优解是其中一个去做 B。QMIX 无法表示所有此类价值函数，这推动了后续工作（例如 QTRAN 和 weighted QMIX）。<\/p>\n<p><b>策略梯度替代方案。<\/b>MAPPO (Yu et al., 2022) 用集中式价值函数训练分布式 PPO actor，结果在相同基准上成为一个强大而简单的基线。<\/p>", "solves": "从单一共享奖励中进行信用分配，同时支持分布式贪心动作", "introNote": "在只有一个团队奖励时，智能体无法判断自己的动作贡献了多少。VDN (Sunehag et al., 2018) 将团队价值分解为各智能体价值之和。QMIX (Rashid et al., 2018) 将求和推广为任意单调混合，仍能保证每个智能体选择自身最优动作即得到团队最优联合动作。两者都在合作式 StarCraft II 微操上进行了评测。", "mathNotes": ["", "f 依赖于状态 s", "单调混合", "分布式"]}, "p2-learned-schedulers-on-graphs": {"key": "p2-learned-schedulers-on-graphs", "eyebrow": "第二部分 · 流派四 · 深入", "title": "基于图的学习型调度器", "bullets": ["问题实例<b>本身<\/b>就是输入：一张由机器人、任务和约束构成的图", "GNN 为每个 (机器人, 任务) 对打分；调度得分最高者，然后重复", "<b>在小规模问题上模仿学习<\/b>训练，再应用到更大规模的问题"], "notesTitle": "学习模仿求解器", "notes": "<p>学习型调度器介于流派一和流派四之间。问题与 2.2.3 相同（谁、以何种顺序、何时执行，带有截止时间和先后约束），但不是求解 MILP，而是由网络学习做出良好的序贯选择。<\/p>\n<p><b>表示。<\/b>截止时间或“T2 先于 T4”等时间约束，在任务开始与结束事件上构成一个简单时间网络 (STN)。ScheduleNet (Wang &amp; Gombolay, RSS 2020) 在 STN 中加入机器人节点和邻近性（位置）节点，使图结构不依赖于机器人、任务或位置的数量。图中是这一思想的简化示意。经过数轮消息传递后，每个节点获得一个反映其邻域的嵌入 <code>h<\/code>。<\/p>\n<p><b>解码。<\/b>一个小网络为每个 (机器人, 任务) 对打分。调度得分最高的一对，更新图，然后重复。这与 SSI 拍卖 (2.3.2) 的贪心序贯结构相同，只是出价是学习得到的。<\/p>\n<p><b>训练。<\/b>ScheduleNet 在小规模问题上通过模仿学习训练，并能泛化到更大的、未见过的问题。图注意力调度这一系列工作的 arXiv 预印本 (1912.02059) 将小规模问题上的模仿学习与大规模问题上的深度 Q 学习相结合。无论哪种方式，图网络都能在不重新训练的情况下处理不同数量的机器人和任务，这是固定规模的 MARL 策略做不到的。<\/p>\n<p><b>五问解读。<\/b>Q1 到 Q3 仍在图中显式给出。学习的是 Q4。这是一个学习型求解器，而非学习型效用。<\/p>", "solves": "MILP 调度在大规模下太慢；学习一个快速近似", "introNote": "Gombolay 的团队已经表明 (Tercio, 2013)，带时间与空间约束的精确 MILP 调度对于较大团队太慢。Wang 和 Gombolay (2020) 将调度问题表示为由机器人、任务和时间约束构成的图，并训练图注意力网络逐个挑选机器人–任务对，目标是以远少的时间达到接近求解器的质量。", "mathNotes": ["边：行程、截止时间、先后约束", "消息传递之后", "贪心、序贯"]}, "p2-where-learned-policies-break-new-teammates": {"key": "p2-where-learned-policies-break-new-teammates", "eyebrow": "第二部分 · 流派四 · 深入", "title": "学习型策略的失效之处：新队友", "bullets": ["MARL 策略是针对<b>训练时的队友<\/b>调优的", "新的队友或团队规模构成<b>分布偏移<\/b>", "Ad hoc 协作与开放团队研究正是针对这一缺口"], "notesTitle": "与我们工作的联系", "notes": "<p>CTDE 策略会与训练伙伴形成隐式约定：谁往左走，谁等待。当伙伴行为不同，或有新机器人加入时，这些约定可能失效。图中，策略与训练时见过的类似队友（蓝色区域）配合良好，而与该区域之外的新队友配合则差得多。柱高仅为示意。<\/p>\n<p><b>两条研究路线针对这一问题。<\/b><\/p>\n<ul><li><b>Ad hoc 协作<\/b> (Stone et al., 2010)：智能体须在没有事先协调的情况下合作，通常通过从队友行为中推断其类型并加以适应。<\/li>\n<li><b>开放团队协作<\/b>（例如 GPL, Rahman et al., 2021）：队友在任务过程中加入和离开；基于图的策略可处理数量可变的智能体。<\/li><\/ul>\n<p><b>用五问的语言来说，<\/b>这就是 Q2 和 Q5 的结合：这个队友能做什么，以及团队变化时会发生什么。学习型分配只能在其训练分布内回答这两个问题。<\/p>\n<div class=\"key\"><span class=\"lbl\">通往第三部分<\/span>第一部分中的新加入者问题在这里从学习的角度再次出现。学习型策略没有需要填写的显式效用表，但它同样缺少关于新加入者的信息，也同样需要在团队持续工作的同时获取这些信息。<\/div>", "solves": "与训练中从未见过的队友合作", "introNote": "Stone、Kaminka、Kraus 和 Rosenschein (AAAI 2010) 提出了 ad hoc 协作挑战：构建一个能与毫无事先协调的队友合作的智能体。后续工作将其扩展到开放团队，即智能体在任务过程中加入和离开；Rahman 等人 (ICML 2021) 使用基于图的策略来处理数量不断变化的队友。", "mathNotes": ["", "", "通常很大"]}, "p2-four-learned-approaches-side-by-side": {"key": "p2-four-learned-approaches-side-by-side", "eyebrow": "第二部分 · 流派四 · 深入", "title": "四种学习型方法对比", "notesTitle": "学习改变了什么，又没改变什么", "notes": "<p>学习将 Q3（有时还有 Q2）从手写的效用表中移出，转入奖励和仿真器。这使得无人能手工建模的复杂动力学得以处理。<\/p>\n<p>但它并没有消除对先验知识的依赖。效用表被训练分布所取代，策略关于能力和价值的一切认知都来自这一分布。最后一列展示了共同的失效模式：当部署情形在某方法未覆盖的维度上与训练不同时，该方法就会失效。<\/p>", "table": {"head": ["方法", "提出", "学习内容", "执行方式", "所需条件", "失效情形"], "rows": [["值分解", "VDN, QMIX 2018", "Q<sub>i<\/sub> + 单调混合网络", "分布式贪心", "仿真器、共享奖励", "协调是非单调的"], ["策略梯度 (CTDE)", "MAPPO 2021–22", "actor + 集中式价值", "分布式 actor", "仿真器、大量样本", "伙伴与训练时不同"], ["图调度器", "Wang & Gombolay 2020", "机器人–任务打分", "集中式、贪心解码", "小规模问题上对精确调度的模仿学习", "未见过的约束类型"], ["Ad hoc / 开放团队策略", "Stone 2010; GPL 2021", "队友模型 + 策略", "分布式", "多样化的队友群体", "队友超出该群体范围"]], "caption": ""}}, "p2-llm-planners": {"key": "p2-llm-planners", "eyebrow": "第二部分 · 流派五", "title": "LLM 规划器", "bullets": ["任务以<b>自然语言<\/b>给出；由 LLM 分解并指派", "SMART-LLM, RoCo, COHERENT", "<b>假设：<\/b>能力可以从文本描述中读出", "任务开放，但对谁实际能做什么<b>缺乏落地 (grounding)<\/b>"], "notesTitle": "以常识作为效用", "notes": "<p>最新的流派使用大语言模型作为规划器。人类用自然语言陈述目标，LLM 将其分解为子任务并决定每个子任务由哪个机器人完成，通常依据的是每个机器人技能的文本描述。<\/p>\n<ul><li><b>SMART-LLM<\/b> (Kannan et al.)：任务分解、联盟形成和分配，全部通过提示完成。<\/li>\n<li><b>RoCo<\/b> (Mandi et al.)：机械臂通过对话讨论并商定计划，并结合环境反馈。<\/li>\n<li><b>COHERENT<\/b>：面向异构团队（如机械臂、四足机器人和无人机）的 LLM 框架。<\/li><\/ul>\n<p><b>五问解读。<\/b>Q1：从语言中解析得到，这是新颖且有用的。Q2：从文本描述中读取。Q3：LLM 的常识判断。Q4：提示与推理。Q5：重新提示。<\/p>\n<p><b>优点：<\/b>能处理早期流派无法表达的开放式、组合式任务。<b>缺点：<\/b>能力是声称的而非测量的，因此可行性可能是幻觉。此外也没有最优性概念，且存在实际的延迟代价。<\/p>", "solves": "将一条自然语言指令转化为子任务和指派", "introNote": "LLM 规划器自 2023 年起出现，面向开放式指令，典型场景是 AI2-THOR 等仿真器中的家务任务，那里不存在固定的任务列表。它们为分解提供了另一条途径（Q1，以及 iTax 的 CD 层级），而符号规划器、分层（HTN）规划器与任务–运动规划器更早便已处理过这一问题；随后，它们根据每个机器人的文本描述形成联盟并指派子任务。"}, "p2-prompt-pipelines-smart-llm": {"key": "p2-prompt-pipelines-smart-llm", "eyebrow": "第二部分 · 流派五 · 深入", "title": "提示流水线：SMART-LLM", "bullets": ["一条固定的<b>少样本提示<\/b>链，每个阶段一个提示", "分配 = 将子任务的<b>所需技能<\/b>与机器人的<b>所列技能<\/b>进行匹配", "没有代价，也没有最优性：计划只是<b>看起来可行<\/b>，而非最优"], "notesTitle": "通过提示进行分配", "notes": "<p>SMART-LLM 是流水线风格最清晰的例子。<\/p>\n<ol><li><b>分解：<\/b>LLM 将指令转化为子任务，例如“洗苹果并放进冰箱”变为拿取、清洗、打开冰箱、放置。<\/li>\n<li><b>联盟形成：<\/b>对每个子任务，确定需要哪些技能，以及是由一个机器人全部具备还是需要多个机器人协作。<\/li>\n<li><b>分配：<\/b>将所需技能与每个机器人的技能列表（以文本形式给出）进行匹配，从而把子任务指派给机器人。<\/li>\n<li><b>执行：<\/b>生成按正确顺序调用机器人技能函数的代码，在可能时包括并行执行。<\/li><\/ol>\n<p><b>新在何处。<\/b>Q1 不再是假设：任务列表由语言生成。这是通往 iTax 的 CD 层级（即分解本身是决策的一部分）的一条途径；符号规划器与 HTN 规划器更早便以其他方式达到了这一层级。<\/p>\n<p><b>缺了什么。<\/b>第 3 阶段匹配的是技能名称，而非技能质量。没有代价，因此在多个可行分配之间不存在优劣之分。若技能列表有误或不完整，流水线中没有任何环节能在执行之前发现。<\/p>", "solves": "将一条自然语言指令转化为多机器人计划", "introNote": "SMART-LLM 面向仿真环境 (AI2-THOR) 中的家务类指令，那里没有任务列表，只有一句话。它将少样本提示串联为四个阶段：分解指令、按所需技能形成联盟、将子任务分配给机器人，以及生成调用各机器人技能的可执行代码。", "mathNotes": ["", "分解", "匹配技能", "调用机器人 API"]}, "p2-who-talks-to-whom-central-planner-or-dialogue": {"key": "p2-who-talks-to-whom-central-planner-or-dialogue", "eyebrow": "第二部分 · 流派五 · 深入", "title": "谁与谁对话：中心规划器还是对话协商", "bullets": ["<b>集中式：<\/b>一个 LLM 掌握全部信息，为所有机器人规划", "<b>对话式：<\/b>每个机器人的 LLM 为自己陈述立场，直至达成一致", "两者都依赖一个<b>检查器<\/b>（运动规划器、仿真器）来发现不可行的计划", "在对比实验中，<b>中心规划 + 局部反馈<\/b>的混合架构扩展性最好"], "notesTitle": "LLM 团队的架构", "notes": "<p><b>RoCo<\/b> (Mandi et al., ICRA 2024) 采用对话方式。每个机械臂有一个了解自身可达范围和状态的 LLM 智能体。智能体轮流提出谁做什么，再提出运动路径点。运动规划器检查碰撞和可达性；错误被反馈到对话中，智能体据此修订计划。该论文还提出了 RoCoBench。<\/p>\n<p><b>Chen et al.<\/b> (ICRA 2024) 比较了团队规模增长时的四种结构：完全集中式规划器、完全分布式对话，以及两种由局部反馈修正中心计划的混合结构。其发现如下：<\/p>\n<ul><li><b>成功率与扩展性：<\/b>由各机器人 LLM 向中心规划器提供反馈的混合结构 (HMAS-2) 在全部四项任务上成功率最高，且随机器人数量增加扩展性最好。<\/li>\n<li><b>集中式 (CMAS)：<\/b>token 效率最高，机器人较少时具有竞争力，但扩展性明显更差。<\/li>\n<li><b>完全分布式对话 (DMAS)：<\/b>成功率最低，API 调用和 token 消耗最多。<\/li><\/ul>\n<p><b>五问解读。<\/b>在对话方式中，Q2 部分落地，因为每个智能体会描述自身状态。Q4 是自然语言协商，可粗略类比为没有数值出价的拍卖。Q5 通过反馈后的重新规划来处理。<\/p>", "solves": "协调各自了解自身状态的对等机器人；将 LLM 规划扩展到更多机器人", "introNote": "RoCo (Mandi et al.) 为每个机械臂配备独立的 LLM 智能体；智能体讨论并商定子任务和运动路径点，由运动规划器检查结果并将失败反馈回去。Chen 等人随后比较了随机器人数量增长时集中式、分布式和混合式 LLM 架构的表现，考察成功率和 token 代价。"}, "p2-llm-formal-solver-let-each-do-what-it-is-good-at": {"key": "p2-llm-formal-solver-let-each-do-what-it-is-good-at", "eyebrow": "第二部分 · 流派五 · 深入", "title": "LLM + 形式化求解器：各司其职", "bullets": ["LLM 负责写出<b>问题<\/b>；经典规划器或求解器负责给出<b>计划<\/b>", "恢复了求解器的保证，<b>前提是问题描述本身正确<\/b>", "由此回到流派一，形成闭环"], "notesTitle": "输入是语言，输出是保证", "notes": "<p>一种自然的分工：LLM 擅长把松散的语言转为结构，而经典规划器和求解器擅长在结构化问题上正确地搜索。<\/p>\n<ul><li><b>LLM+P<\/b>（Liu et al., 2023，单智能体）：LLM 将问题翻译为 PDDL，经典规划器求出最优计划，再由 LLM 翻译回自然语言。<\/li>\n<li><b>LaMMA-P<\/b>（Zhang et al., 2024）：面向异构多机器人团队，由 LLM 模块分解任务并按技能分配子任务，PDDL 规划器生成计划，最后对结果进行验证与合并。<\/li><\/ul>\n<p><b>为何这对整体脉络重要。<\/b>这本质上是加了 LLM 前端的流派一。LLM 回答 Q1（有哪些任务）并断言 Q2（谁能做什么），求解器回答 Q4。效用表仍然在求解之前构建，只不过是从语言中构建，而非由工程师手工给出。<\/p>\n<p><b>失效模式。<\/b>如果生成的问题描述有误，例如声明某机器人能开门而实际上不能，规划器会为一个错误的问题返回一个完全合法的计划。<\/p>", "solves": "将语言理解与经典规划器的保证结合起来", "introNote": "LLM+P（Liu et al., 2023）表明，LLM 自身规划能力较差，但能足够可靠地把自然语言问题翻译为 PDDL，交由经典规划器最优求解。LaMMA-P（Zhang et al., 2024）将这一思路用于异构多机器人团队：LLM 负责按技能分解与分配，PDDL 规划器为每个机器人生成计划。", "mathNotes": ["LLM", "经典、完备", "LLM 或求解器"]}, "p2-heterogeneous-teams-capability-by-trial-and-error": {"key": "p2-heterogeneous-teams-capability-by-trial-and-error", "eyebrow": "第二部分 · 流派五 · 深入", "title": "异构团队：在试错中认识能力", "bullets": ["能力先<b>以文本声明<\/b>，再<b>由失败纠正<\/b>", "提议 → 执行 → 反馈 → 调整的循环修正错误分配", "没有任何环节衡量机器人把任务做得<b>有多好<\/b>，只知道是否失败"], "notesTitle": "落地（grounding）问题", "notes": "<p>在异构团队中，关于能力的错误既明显又代价高昂：让无人机去开冰箱，或让没有机械臂的四足机器人去抓取物体。LLM 规划器从文本描述中读取能力，因此恰恰会犯这类错误。<\/p>\n<p><b>COHERENT<\/b>（Liu et al., 2024）针对由四旋翼、机器狗和机械臂组成的团队，提出了提议–执行–反馈–调整（PEFA）循环。中央任务分配器分解任务并提出分配；每个机器人的执行器选择可行动作并返回自我反思反馈；分配器据此调整，循环往复直到任务完成。该论文还提出了一个包含 100 个任务的异构基准。图中，“开冰箱 → 无人机”因无人机没有夹爪而失败，该子任务被重新分配给机械臂。<\/p>\n<p><b>这说明了什么。<\/b>反馈循环让 LLM 分配更鲁棒，但获得的知识是二值的：失败与否。它不估计每个机器人完成每项任务有多好、多快、多可靠，而这恰恰是流派一中效用表的内容。<\/p>\n<p><b>五问解读。<\/b>Q1 来自语言，Q2 先断言再由失败修补，Q3 仍然缺失，Q4 由 LLM 完成，Q5 通过反馈循环处理。<\/p>", "solves": "在能力差异悬殊的机械臂、四足机器人和无人机之间进行分配", "introNote": "COHERENT 面向差异很大的机器人团队，如机械臂、四足机器人和无人机。中央 LLM 提出分配，机器人执行并回报，LLM 再进行调整。系统正是通过这一提议–执行–反馈–调整循环，纠正那些在文本上看似合理、物理上却会失败的分配。"}, "p2-four-llm-patterns-side-by-side": {"key": "p2-four-llm-patterns-side-by-side", "eyebrow": "第二部分 · 流派五 · 深入", "title": "四种 LLM 范式对比", "notesTitle": "LLM 带来了什么，又仍然假设了什么", "notes": "<p>LLM 规划器是第一个正面回应 <b>Q1<\/b> 的流派：任务来自语言，分解是决策的一部分。相比此前所有流派，这是实实在在的进步。<\/p>\n<p>对于 <b>Q2 和 Q3<\/b>，它们依赖文本：假定机器人能做其描述中所说的事。高亮列展示了各范式的处理方式：不检查、询问运动规划器、信任问题描述，或从失败中学习。<\/p>\n<div class=\"key\"><span class=\"lbl\">通向总结<\/span>纵观五个流派，能力与效用要么是给定的，要么由机器人自行定价，要么编码在阈值中，要么隐含于训练，要么读自文本。没有一个是从团队自身的持续工作中测量得到的。这正是第三部分要接续的线索。<\/div>", "table": {"head": ["范式", "示例", "LLM 负责", "谁检查可行性", "优势", "不足"], "rows": [["提示流水线", "SMART-LLM 2023", "分解、组建联盟、分配、生成代码", "执行前无人检查", "一条指令生成完整计划", "错误逐级传播；能力来自文本"], ["对话", "RoCo 2023; Chen et al. 2023", "协商谁做什么", "运动规划器、环境", "每个智能体自行落地自身状态", "token 开销随团队规模增长"], ["LLM + 形式化求解器", "LLM+P 2023; LaMMA-P 2024", "翻译为 PDDL，按技能分配", "规划器（基于给定描述）", "求解器的正确性", "描述错误时静默失败"], ["反馈循环", "COHERENT 2024", "先提议，失败后调整", "机器人的执行结果", "能从错误分配中恢复", "只学到成功 / 失败"]], "caption": ""}}, "p3-what-the-five-questions-underweighted": {"key": "p3-what-the-five-questions-underweighted", "eyebrow": "第三部分 · 步骤 1", "title": "五个问题低估了什么", "bullets": ["Q1、Q2 和 Q5 各自干净地对应<b>一个要素<\/b>", "Q3 把<b>目标<\/b>（E5）藏在了“效用”之中", "Q4 把<b>信息、控制与时机<\/b>（E6–E8）混成了“机制”", "<b>执行<\/b>（E9）完全没有对应的问题"], "notesTitle": "用模型检验第一部分", "notes": "<p>第一部分的五个问题是有用的初步划分，但与九个要素对照时并不均衡：<\/p>\n<ul><li><b>干净对应：<\/b>Q1 任务 ↔ E2，Q2 能力 ↔ E3，Q5 动态 ↔ E1（团队变化），E3 中的漂移是第二条关联。<\/li>\n<li><b>Q3 效用<\/b>覆盖了 E4（配对之间如何交互），但只隐含了 E5。“某个配对值多少”已经预设了一个目标；而该目标是 makespan、吞吐量还是风险，从未被追问。<\/li>\n<li><b>Q4 机制<\/b>合并了三件不同的事：每个机器人能观测到什么（E6）、谁有权为谁决策（E7），以及有多少时间来决策（E8）。<\/li>\n<li><b>E9 执行<\/b>没有对应的问题。五个问题默认分配一旦选定即可执行。<\/li><\/ul>\n<p>这是“推导而非罗列”的第一个具体成果：九个要素中有四个在此前的框架里只是隐含的。任何位于 E5 到 E9 的空白都很容易被忽略。<\/p>"}, "p3-the-classical-corner-and-the-ways-out-of-it": {"key": "p3-the-classical-corner-and-the-ways-out-of-it", "eyebrow": "第三部分 · 步骤 2", "title": "经典角落，以及走出它的路径", "notesTitle": "走出同一角落的三十四条路", "notes": "<p>经典 MRTA 位于空间的一个角落：每个要素都处于最简单的设定（中间列）。右列的每一项是现实偏离该角落的一种方式，每一项都是一条轴，方法可以沿着它更现实或更不现实。<\/p>\n<p>子轴的来源：<\/p>\n<ul><li>大多数是经典假设的直接否定：“固定团队”变为“成员加入和离开”。<\/li>\n<li>一些来自第二部分，某个流派已沿该轴有所推进：任务作为刺激被感知（阈值）、从语言中分解（LLM）、局部观测（Dec-POMDP）、时间耦合（调度 MILP）。<\/li>\n<li>少数来自第一部分中效用表失效的三种方式：“获取信息需要耗费时间”（Uncertain）和“分配会重塑系统”（Coupled）。<\/li><\/ul>\n<p>这份清单是起点，而非定论。接下来两页从两个方面检验它：哪些流派已沿哪些要素离开了角落（3.3.1），以及外部开放问题清单中是否存在本表无法表达的内容（3.4）。<\/p>", "table": {"head": ["要素", "经典 MRTA 假设", "现实偏离的方式（子轴）"], "rows": [["E1 智能体", "固定且已知的机器人", "成员加入和离开 · 类型未知的队友 · 团队中有人类 · 大量异构类型"], ["E2 任务", "给定的一批任务，且已分解", "任务以流的形式到达 · 需通过感知发现 · 需要分解 · 需求未知"], ["E3 动力学", "已知、静态、确定性", "能力未知 · 能力漂移（磨损、电量） · 执行随机失败 · 环境未知"], ["E4 交互", "配对相互独立（ND）", "时间耦合（先后、同步） · 干扰与拥堵 · 团队价值非可加 · 分配重塑系统"], ["E5 目标", "每个回合一个标量（makespan、成本）", "长期吞吐量 · 风险或无害约束 · 多目标、公平性 · 人类偏好"], ["E6 信息", "全局状态，或各机器人了解自身", "局部部分观测 · 通信受限 · 自我认知不确定 · 获取信息需要耗费时间"], ["E7 控制", "一个设计者控制所有机器人", "仅部分机器人可控 · 会适应的队友 · 自利的智能体 · 与人类共享决策权"], ["E8 时机", "离线求解，无时间限制", "实时决策 · 边执行边决策 · 计算量随团队规模增长"], ["E9 执行", "任何分配都可执行", "路径冲突（MAPF） · 操作可行性 · 计划在执行中漂移"]], "caption": ""}}, "p3-where-each-family-has-already-left-the-corner": {"key": "p3-where-each-family-has-already-left-the-corner", "eyebrow": "第三部分 · 步骤 2", "title": "各流派已在何处离开角落", "bullets": ["每个流派放松<b>两到五个<\/b>要素，其余保持理想化", "<b>E5 目标<\/b>和 <b>E9 执行<\/b>几乎无人触及", "许多圆点只是<b>半填充<\/b>：以有限的方式放松", "此处的实心圆点<b>并不<\/b>表示“已解决”，只表示该流派涉及了这一要素"], "notesTitle": "如何解读覆盖矩阵", "notes": "<p>该矩阵逐要素总结第二部分。实心圆点表示该流派的核心思想放松了这一要素；半实心表示以有限方式放松；空心表示保留经典假设。<\/p>\n<ul><li><b>集中式优化<\/b>认真处理了 E4（时间约束、联盟），并允许目标有一定变化（求和、makespan、瓶颈）。其余均保持理想化。<\/li>\n<li><b>市场方法<\/b>涉及 E6：每个机器人私有地掌握自身成本，CBBA 在局部通信下工作。它们部分处理了机器人损失与任务到达（重新拍卖）、边际成本耦合以及分布式控制，但假设投标者合作且诚实。<\/li>\n<li><b>自组织分配<\/b>涉及 E1（机器人损失）、E2（任务作为刺激被感知）、E6（仅局部信息）和 E8（即时局部规则），并通过自适应阈值部分涉及 E3。<\/li>\n<li><b>学习策略<\/b>涉及 E3（从仿真器中学习动力学）、E4（耦合被吸收进价值函数）和 E6（部分可观测），并通过 ad hoc 与开放团队方面的工作部分涉及 E1 和 E7。<\/li>\n<li><b>LLM 规划器<\/b>涉及 E2（来自语言的任务、分解），并部分涉及 E6 和 E9（对话、运动规划器检查）。<\/li><\/ul>\n<p><b>两列尤为突出。<\/b>E5（团队优化什么）只在经典代价函数范围内变化，E9（执行）只通过可行性检查被触及。它们是文献薄弱的候选方向，有待步骤 4 检验，而非直接认定。<\/p>\n<p><b>注意。<\/b>这些评级是基于第二部分所综述方法的判断，而非全面普查。第二部分未覆盖的专门文献，如随机任务分配、结合路径规划的任务分配、人机分配等，将逐轴核查。<\/p>"}, "p3-completeness-audit-mrta-taxonomies-and-surveys": {"key": "p3-completeness-audit-mrta-taxonomies-and-surveys", "eyebrow": "第三部分 · 步骤 3", "title": "完备性审计：MRTA 分类法与综述", "notesTitle": "MRTA 自身综述认为哪些问题仍开放", "notes": "<p>将这些来源中的每个开放问题或所述局限映射到其涉及的要素（一个或两个）。关于方法本身而非问题的条目，映射到以斜体标出的跨领域主题。完整映射如下：<\/p><ol><li><b>Khamis, Hussein & Elmogy 2015<\/b> <span style=\"color:var(--muted)\">（全文）<\/span><ul><li>复杂、紧耦合的多机器人任务 → <code>Tasks + Interaction<\/code><\/li><li>动态分配；动态、不可预测的环境 → <code>Dynamics<\/code><\/li><li>强约束分配；先后约束 → <code>Interaction<\/code><\/li><li>异构、不可靠的机器人；部分故障 → <code>Agents + Dynamics<\/code><\/li><li>环境部分可观测 → <code>Information<\/code><\/li><li>感知与无线电范围有限 → <code>Information<\/code><\/li><li>市场方法的成本与收益函数缺乏形式化设计 → <code>Objective<\/code><\/li><\/ul><\/li><li><b>Korsah, Stentz & Dias 2013<\/b> <span style=\"color:var(--muted)\">（全文（2026 年 10 月核查））<\/span><ul><li>相互关联的效用与约束 → <code>Interaction<\/code><\/li><\/ul><\/li><li><b>Nunes, Manner, Mitiche & Gini 2017<\/b> <span style=\"color:var(--muted)\">（全文（预印本））<\/span><ul><li>近似与启发式调度器的理论保证 → <code>Guarantees for methods<\/code><\/li><li>更丰富的时间模型：析取、软 + 硬时间窗、同步 → <code>Interaction<\/code><\/li><li>带时间约束的随机分配；建模不确定性还是重规划？ → <code>Dynamics + Interaction<\/code><\/li><li>面向多任务机器人的分配 → <code>Agents<\/code><\/li><li>时间尺度与时间敏感性的影响 → <code>Timing<\/code><\/li><li>共享的软件与数据研究平台 → <code>Evaluation and benchmarks<\/code><\/li><\/ul><\/li><li><b>Aziz et al. 2022<\/b> <span style=\"color:var(--muted)\">（全文；条目为推断）<\/span><ul><li>未知环境 → <code>Dynamics<\/code><\/li><li>机器人对自身能力估计的不确定性 → <code>Dynamics + Information<\/code><\/li><li>降低能力的故障 → <code>Dynamics<\/code><\/li><li>优化方法依赖全局信息 → <code>Information<\/code><\/li><li>拍卖者是单点故障 → <code>Control<\/code><\/li><li>组合拍卖的开销呈指数增长 → <code>Timing<\/code><\/li><li>CBBA 的保证依赖子模出价 → <code>Interaction<\/code><\/li><\/ul><\/li><li><b>Seenu et al. 2020<\/b> <span style=\"color:var(--muted)\">（全文（2026 年 10 月核查））<\/span><ul><li>目标、鲁棒性、分配时间、重分配（推断） → <code>Objective + Dynamics + Timing<\/code><\/li><\/ul><\/li><\/ol>\n<p><b>获取限制及更新。<\/b>本审计首次进行时，Korsah et al.（2013）和 Seenu et al.（2020）只能读到摘要，Chakraa et al.（2023, RAS）和 Quinton et al.（2023, JIRS，市场方法）则无法获取。这四篇后来均已通读全文（2026 年 10 月）。它们的开放问题都能映射到模型上：Chakraa et al. 提出复杂度与可扩展性（E8）、公平性（E5c）、不确定性下的动态分配（E2a, E3）、通信错误与限制（E6b）、避碰与运动学约束（E9）以及仿真到真实的差距（评估）。Quinton et al. 提出跨日程依赖与多机器人任务（E4a, E1d）、通信中断（E6b）、任务出现以及载具离开去补给（E2a, E1a）、人机团队（E1c, E7d）、出价设计（E5）、保证薄弱、分布式开销（E8c）以及可复现性。Seenu et al. 补充了随机器人与任务数量增长的运行时扩展（E1a, E2a）、拍卖者失效（E7）、多目标适应度（E5c）以及与路径规划并行的探索（E9, E3d）。无需新增要素；下一页的计数早于此次更新。Aziz et al.（2022）没有明确的开放问题章节，因此其条目是将所述局限视作开放问题。<\/p>", "table": {"head": ["来源", "证据", "条目数", "映射到"], "rows": [["Khamis, Hussein & Elmogy 2015", "全文", "7", "E1, E2, E3, E4, E5, E6"], ["Korsah, Stentz & Dias 2013", "全文（2026 年 10 月核查）", "1", "E4"], ["Nunes, Manner, Mitiche & Gini 2017", "全文（预印本）", "6", "E1, E3, E4, E8, <i>方法的保证<\/i>, <i>评估与基准<\/i>"], ["Aziz et al. 2022", "全文；条目为推断", "7", "E3, E4, E6, E7, E8"], ["Seenu et al. 2020", "全文（2026 年 10 月核查）", "1", "E3, E5, E8"]], "caption": ""}}, "p3-completeness-audit-neighbouring-fields": {"key": "p3-completeness-audit-neighbouring-fields", "eyebrow": "第三部分 · 步骤 3", "title": "完备性审计：相邻领域", "notesTitle": "相邻领域认为哪些问题仍开放", "notes": "<p>相邻领域从不同侧面看待同一问题：异构多机器人系统、ad hoc 协作（ad hoc teamwork）、基于 LLM 的多机器人系统、人机任务分配，以及多智能体路径规划与取送货。最后一行是本项目保存的 RSS/CoRL 2024–2026 扫描。完整映射如下：<\/p><ol><li><b>Rizk, Awad & Tunstel 2019<\/b> <span style=\"color:var(--muted)\">（全文）<\/span><ul><li>自动化任务分解，使团队能够重规划 → <code>Tasks<\/code><\/li><li>在计算与通信受限的机器人上运行学习模型 → <code>Timing + Information<\/code><\/li><li>融合异构来源的感知 → <code>Information<\/code><\/li><li>权衡可扩展性与异构性 → <code>Agents + Timing<\/code><\/li><li>联盟形成与分配结合；联盟随时间重新分派任务 → <code>Interaction + Agents<\/code><\/li><li>人在回路中：资产还是负担 → <code>Agents + Control<\/code><\/li><li>迁移学习尚未在真实世界中端到端验证 → <code>Evaluation and benchmarks<\/code><\/li><li>各模块被孤立研究；需要模块间反馈 → <code>Execution<\/code><\/li><li>通信限制、时间关键任务、硬件受限 → <code>Information + Timing<\/code><\/li><li>多机器人系统缺乏评估标准 → <code>Evaluation and benchmarks<\/code><\/li><\/ul><\/li><li><b>Mirsky et al. 2022 (ad hoc teamwork)<\/b> <span style=\"color:var(--muted)\">（读过相关章节）<\/span><ul><li>会学习或适应的队友 → <code>Control<\/code><\/li><li>部分可观测与开放团队并存 → <code>Information + Agents<\/code><\/li><li>泛化到训练中未见过的队友 → <code>Agents + Control<\/code><\/li><li>真实的测试平台；标准化比较 → <code>Evaluation and benchmarks<\/code><\/li><\/ul><\/li><li><b>Li et al. 2025 (LLM multi-robot)<\/b> <span style=\"color:var(--muted)\">（读过相关章节）<\/span><ul><li>数值推理薄弱；幻觉 → <code>Method-specific failures<\/code><\/li><li>多模态融合与延迟 → <code>Information + Timing<\/code><\/li><li>野外部署需要可靠的连接 → <code>Information<\/code><\/li><li>基准；仿真器把推理视为零开销 → <code>Evaluation and benchmarks + Timing<\/code><\/li><li>人类作为对等的协商者；认知负荷 → <code>Agents + Objective + Control<\/code><\/li><\/ul><\/li><li><b>Ali, Tilbury & Robert 2022 (human–robot)<\/b> <span style=\"color:var(--muted)\">（全文）<\/span><ul><li>新任务：将任务映射到所需能力 → <code>Tasks + Dynamics<\/code><\/li><li>未知或变化的能力；何时重新评估 → <code>Dynamics + Timing<\/code><\/li><li>智能体间的分歧；谁拥有最终决定权 → <code>Control<\/code><\/li><li>分配的公平性 → <code>Objective<\/code><\/li><li>伦理、问责、信任校准 → <code>Ethics and trust + Control<\/code><\/li><\/ul><\/li><li><b>Salzman & Stern 2020 (MAPF / MAPD)<\/b> <span style=\"color:var(--muted)\">（全文）<\/span><ul><li>对持续到达的任务流建模 → <code>Tasks<\/code><\/li><li>长期运行中的在线局部适应 → <code>Dynamics + Timing<\/code><\/li><li>分布式计算与负载均衡 → <code>Timing<\/code><\/li><li>智能体动作的隐私 → <code>Information<\/code><\/li><li>面向吞吐量的最优布局与机队规模 → <code>System design<\/code><\/li><li>结构化领域中 MAPF 的复杂度（APX、FPT） → <code>Guarantees for methods<\/code><\/li><\/ul><\/li><li><b>我们的 RSS/CoRL 2024–26 标题扫描<\/b> <span style=\"color:var(--muted)\">（标题与摘要）<\/span><ul><li>真实机器人上的 ad hoc 协作 → <code>Agents + Control<\/code><\/li><li>以自我为中心推断团队状态 → <code>Information<\/code><\/li><li>观测时间与行动之间的代价权衡 → <code>Information + Timing<\/code><\/li><li>面向吞吐量的长时程运行 → <code>Objective + Tasks<\/code><\/li><li>超越监督关系的人–多机器人团队 → <code>Agents + Control<\/code><\/li><\/ul><\/li><\/ol>\n<p><b>关于来源的说明。<\/b>人机方向的来源是一篇简短的研讨会综述，而非大型综述；未找到更大型的开放获取综述。路径规划方向采用了 Salzman 和 Stern 的议程论文，因为它明确列出了开放问题。LLM 综述的开放问题取自其 2026 年版本（v5）。<\/p>", "table": {"head": ["来源", "证据", "条目数", "映射到"], "rows": [["Rizk, Awad & Tunstel 2019", "全文", "10", "E1, E2, E4, E6, E7, E8, E9, <i>评估与基准<\/i>"], ["Mirsky et al. 2022 (ad hoc teamwork)", "读过相关章节", "4", "E1, E6, E7, <i>评估与基准<\/i>"], ["Li et al. 2025 (LLM multi-robot)", "读过相关章节", "5", "E1, E5, E6, E7, E8, <i>评估与基准<\/i>, <i>方法特有的失效<\/i>"], ["Ali, Tilbury & Robert 2022 (human–robot)", "全文", "5", "E2, E3, E5, E7, E8, <i>伦理与信任<\/i>"], ["Salzman & Stern 2020 (MAPF / MAPD)", "全文", "6", "E2, E3, E6, E8, E10, <i>方法的保证<\/i>"], ["我们的 RSS/CoRL 2024–26 标题扫描", "标题与摘要", "5", "E1, E2, E5, E6, E7, E8"]], "caption": ""}}, "p3-what-the-audit-changed": {"key": "p3-what-the-audit-changed", "eyebrow": "第三部分 · 步骤 3", "title": "审计带来了哪些改变", "bullets": ["所有问题层面的条目都能归入某个要素，只有一个例外：<b>系统设计<\/b>，现列为 <b>E10<\/b>", "<b>E9 执行<\/b>只被一个来源提及：关注度低，不一定意味着需求低", "四个主题关乎<b>方法而非问题<\/b>，作为跨领域主题保留", "一些条目已点明要素的<b>两两组合<\/b>：为步骤 4 提供早期线索"], "notesTitle": "审计结果", "notes": "<p>共映射了来自十一个来源的五十七个条目。柱状图统计了涉及每个要素的条目数。<\/p>\n<p><b>1. 一个新要素。<\/b>Salzman 和 Stern 追问能使吞吐量最大化的仓库布局和机队规模。这不是给定系统内分配的属性，而是把系统本身当作设计变量。Rizk et al. 的“权衡可扩展性与异构性”也指向同一方向。由此得到 <b>E10 系统设计<\/b>：机队构成、布局与环境。<\/p>\n<p><b>2. 关注度不均。<\/b>E6（13 条）和 E8（12 条）被提及最多，其次是 E1 和 E3（各 10 条）。E9 执行只出现一次（Rizk et al.：各模块被孤立研究）；后来的全文阅读又补充了 Chakraa et al. 和 Seenu et al.。E10 也只出现一次。提及少既可能意味着问题次要，也可能意味着它落在不同研究社区之间的缝隙中；步骤 4 必须区分这两种情况。<\/p>\n<p><b>3. 跨领域主题，位于模型之外。<\/b>一些条目关乎方法而非问题，因此不属于任何要素：<\/p>\n<ul><li><b>保证：<\/b>启发式调度器的界；路径规划的复杂度。<\/li>\n<li><b>评估：<\/b>共享平台、基准、真实测试平台、仿真到真实的测试。十一个来源中有四个提及，是审计中最一致的单项抱怨。<\/li>\n<li><b>方法特有的失效：<\/b>LLM 幻觉与数值推理薄弱。<\/li>\n<li><b>伦理与信任：<\/b>人机分配中的问责与信任校准。<\/li><\/ul>\n<p>这些将在第三部分末尾统一讨论，而不作为问题本身的空白。<\/p>\n<p><b>4. 已被点明的组合。<\/b>若干条目已同时落在两个要素上：带时间约束的随机执行（E3 × E4，Nunes et al.）、部分可观测与开放团队（E6 × E1，Mirsky et al.）、观测代价与行动（E6 × E8，我们的扫描）、不确定的自我认知（E3 × E6，Aziz et al.），以及何时重新评估能力（E3 × E8，Ali et al.）。它们为步骤 4 的两两矩阵提供了种子。<\/p>\n<div class=\"key\"><span class=\"lbl\">审计不能证明什么<\/span>通过审计意味着没有任何外部清单包含模型无法表达的条目。这并不能证明完备性：这些来源本身也有共同的盲点。后来的全文核查补充了 Chakraa et al.（2023）和 Quinton et al.（2023）；它们提出的每个条目都能映射到 E1–E10 或跨领域主题，因此审计依然通过。<\/div>"}, "p3-e1a-members-join-and-leave-mid-mission": {"key": "p3-e1a-members-join-and-leave-mid-mission", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E1 智能体", "title": "E1a · 成员在任务中途加入和离开", "bullets": ["开放团队在多智能体研究中已有<b>形式化定义<\/b>（智能体、任务与类型的开放性）", "机器人 MRTA 把变化当作<b>扰动后的修复<\/b>来处理，成员名单固定", "<b>开放问题：<\/b>在物理与时间约束下，把加入和离开作为一等事件处理"], "notesTitle": "E1a：成员在任务中途加入和离开", "notes": "<p><b>经典：<\/b>固定的成员名单。<b>完全放松：<\/b>任何成员都可能在任务中途、不经通知地加入或离开。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>Stone et al. (2010)<\/b>。提出即时组建团队的挑战；是 ad hoc 与开放团队研究线的源头。<span style=\"color:var(--muted)\">仍保留：立场论文；无分配算法；团队并非显式开放。核查方式：标题与发表渠道。<\/span><\/li><li><b>D-ITAGS (2023)<\/b>。在故障、通信中断和延迟后，局部修复分配、调度与运动计划。<span style=\"color:var(--muted)\">仍保留：已知名单，仅考虑退化；不涉及加入。核查方式：摘要。<\/span><\/li><li><b>GPL (2021)<\/b>。队友不经通知地进入和离开；用图网络建模变化的团队。<span style=\"color:var(--muted)\">仍保留：队友为固定策略；单个学习者；仿真游戏，无机器人也无分配。核查方式：摘要。<\/span><\/li><li><b>Eck et al. (2020)<\/b>。智能体暂时离开（去充电）后重新加入；没有新智能体进入。每个智能体为自身规划，对邻居样本建模，并给出外推误差界与遗憾界；野火。<span style=\"color:var(--muted)\">仍保留：固定且有类型的种群；无通信；并非机器人分配的建模形式。核查方式：全文。<\/span><\/li><li><b>PLATO (2026)<\/b>。任务出现与消失；智能体在灭火剂耗尽时退出，补给后返回；一个共享策略（MAPPO, CTDE），在当前任务上使用指针 actor；零样本迁移到更大的网格。<span style=\"color:var(--muted)\">仍保留：仅仿真；策略共同训练；智能体位置固定；完全可观测。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>仍待解决的问题。<\/b>未找到任何在物理或时间约束下、把加入和离开作为一等事件处理的机器人分配方法。Mirsky et al.（2022）将开放团队与部分可观测的结合列为开放问题。Saleh Abadi 和 Soh（2025）报告称，成员更替会破坏多智能体信用分配中的固定组成假设；一项 2026 年开放系统竞赛收到八份报名，但只有一份最终提交（2025 年：四份）；其组织者指出，可及性与赛道设计对参与度影响很大。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>开放性在多智能体系统研究中已有明确定义，但机器人分配研究覆盖的是故障与修复，而非真正的加入与离开。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-e1b-teammates-of-unknown-type": {"key": "p3-e1b-teammates-of-unknown-type", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E1 智能体", "title": "E1b · 类型未知的队友", "bullets": ["临时组队 (ad hoc teamwork) <b>在多智能体学习中已较成熟<\/b>，在游戏基准上亦然", "机器人研究虽有，但<b>规模很小<\/b>（一台机器人加一名人类；仿真足球）", "<b>开放问题：<\/b>自适应的队友、贴近现实的基准，以及与分配结构的耦合"], "notesTitle": "E1b：类型未知的队友", "notes": "<p><b>经典设定：<\/b>所有机器人协同设计。<b>完全放松：<\/b>队友由他人构建，策略未知，且可能在不断适应。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Stone et al. (2010)<\/b>。提出临时组队挑战。<span style=\"color:var(--muted)\">仍保留：无算法。核查：标题与发表场所。<\/span><\/li><li><b>Howell et al. (2024)<\/b>。具备能力感知的机器人可泛化到新的团队组成与规模。<span style=\"color:var(--muted)\">仍保留：队友以共享策略联合训练；侧重协调而非分配。核查：摘要。<\/span><\/li><li><b>PLASTIC (2015)<\/b>。复用与过往队友协作时学到的策略，快速适应新队友。<span style=\"color:var(--muted)\">仍保留：仿真足球；单个临时智能体；无显式分配。核查：摘要。<\/span><\/li><li><b>HOTSPOT (2024)<\/b>。用一台真实移动机器人与一名人类进行任务与队友识别。<span style=\"color:var(--muted)\">仍保留：一台机器人加一名人类；任务库较小。核查：摘要。<\/span><\/li><li><b>N-agent AHT (2024)<\/b>。多个受控智能体与数量、类型不断变化的非受控队友协作。<span style=\"color:var(--muted)\">仍保留：游戏与粒子环境基准；无机器人，也无物理层面的分配。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Mirsky et al. (2022) 将会学习或适应的队友、对未见过队友的泛化，以及具备系统化基准的真实机器人领域列为开放问题。在检索到的机器人工作中，临时组队并未与联盟、调度或能力需求等分配结构相结合。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>在多智能体学习中已较成熟，但机器人层面、面向分配的工作很少，该领域自身的综述也指出了真实性与基准方面的不足。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e1c-humans-on-the-team": {"key": "p3-e1c-humans-on-the-team", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E1 智能体", "title": "E1c · 团队中的人类", "bullets": ["已有相当规模的<b>人机调度<\/b>研究脉络，主要集中在制造单元", "人因（工作负荷、偏好、学习）已进入部分<b>分配模型<\/b>", "<b>开放问题：<\/b>多人与多机器人协作；信任、公平与协商；人类能力的变化"], "notesTitle": "E1c：团队中的人类", "notes": "<p><b>经典设定：<\/b>只有机器人。<b>完全放松：<\/b>人类作为队友，其技能、工作负荷与信任各不相同。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Lippi et al. (2022)<\/b>。离线分配加在线重分配，以应对人的偏好与突发事件；两台机械臂与一名人类。<span style=\"color:var(--muted)\">仍保留：单个人类；单一任务族。核查：摘要。<\/span><\/li><li><b>Gombolay et al. (2015)<\/b>。由机器人在人与机器人之间分配工作，研究其对效率与满意度的影响。<span style=\"color:var(--muted)\">仍保留：实验室小团队；集中式；任务模型已知。核查：摘要。<\/span><\/li><li><b>Gombolay et al. (2017)<\/b>。将态势感知、工作负荷与偏好纳入分配设计。<span style=\"color:var(--muted)\">仍保留：给出的是设计准则而非通用算法；小团队。核查：摘要。<\/span><\/li><li><b>HybridNet (2022)<\/b>。面向人机团队的学习型调度器，人的表现具有随机性且会逐步提升。<span style=\"color:var(--muted)\">仍保留：仿真的人类模型；人员名单与任务集固定。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Ali et al. (2022) 将协作程度、新任务、未知或变化的能力、协商与公平、伦理，以及对分配器的校准信任列为开放问题。检索到的方法大多只涉及一名或少数几名人类与小规模机器人团队；STRATA 的作者也指出其未在人机团队上评估。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>确有一条实际的研究脉络，但集中于小型制造单元，该领域的综述也指出了规模与人类特有因素方面的问题。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e1d-complex-capability-structure-at-scale": {"key": "p3-e1d-complex-capability-structure-at-scale", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E1 智能体", "title": "E1d · 大规模下的复杂能力结构", "bullets": ["面向大规模异构团队的<b>基于特质 (trait-based)<\/b> 分配是一条活跃且成熟的脉络", "按作者自己的说法，<b>多任务机器人<\/b>（同时执行多项任务）的研究仍很薄弱", "<b>开放问题：<\/b>基于特质的调度、理论保证、随特质数量的扩展性"], "notesTitle": "E1d：大规模下的复杂能力结构", "notes": "<p><b>经典设定：<\/b>机器人类型少，一次只做一项任务。<b>完全放松：<\/b>类型众多、特质连续，机器人同时执行多项任务。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Gerkey & Matarić (2004)<\/b>。定义单任务与多任务机器人、单机器人与多机器人任务。<span style=\"color:var(--muted)\">仍保留：静态且已知的机器人名单。核查：标题与发表场所。<\/span><\/li><li><b>Smith et al. (2025)<\/b>。在物理约束下，用加权 MAX-SAT 处理多任务机器人参与多机器人任务；含实物实验。<span style=\"color:var(--muted)\">仍保留：瞬时分配；无数值或时间约束。核查：摘要与正文。<\/span><\/li><li><b>STRATA (2020)<\/b>。面向由多个智能体物种组成的大规模团队，按连续特质进行分配。<span style=\"color:var(--muted)\">仍保留：无调度；每个物种的特质服从高斯分布；团队固定。核查：摘要与正文。<\/span><\/li><li><b>Bezerra et al. (2025)<\/b>。去中心化的学习型联盟形成，分配可修正，适用于大规模群体。<span style=\"color:var(--muted)\">仍保留：仿真；机器人联合训练；名单固定。核查：摘要。<\/span><\/li><li><b>ITAGS (2021)<\/b>。基于特质的联盟形成，与调度和运动规划交替进行。<span style=\"color:var(--muted)\">仍保留：团队与特质已知且固定；仿真。核查：摘要。<\/span><\/li><li><b>CMTAB (2023)<\/b>。任务奖励未知时的基于特质联盟，用 bandit 方法学习。<span style=\"color:var(--muted)\">仍保留：特质已知；无遗憾界；扩展性未经检验。核查：全文。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Smith et al. (2025) 指出，多任务机器人的研究远少于单任务机器人，时间扩展型与数值型多任务分配仍是开放问题。Singh et al. (2023) 指出了随特质与任务数量的扩展性以及缺乏理论保证的问题。STRATA 不涉及调度推理。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>基于特质的异构分配已发展得较好；多任务机器人研究薄弱；整体为部分研究。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e2-tasks-1-thin-2-partly-1-well-studied": {"key": "p3-e2-tasks-1-thin-2-partly-1-well-studied", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E2", "title": "E2 任务：1 项薄弱、2 项部分研究、1 项研究充分", "bullets": ["<b>E2a<\/b> 任务以流的形式到达：<i>研究充分<\/i>", "<b>E2b<\/b> 任务需通过感知发现：<i>部分研究<\/i>", "<b>E2c<\/b> 任务需要分解：<i>部分研究<\/i>", "<b>E2d<\/b> 任务需求未知：<i>薄弱<\/i>"], "notesTitle": "E2 任务：小结", "notes": "<p><b>经典假设：<\/b>任务以给定批次出现，已完成分解，需求已知。<\/p><p>任务随时间到达，是第三部分迄今研究最充分的偏离方向：动态车辆路径与终身取送 (lifelong pickup-and-delivery) 各自形成了成熟且相互独立的脉络。任务发现与分解属于部分研究。任务需求未知则很薄弱。<\/p>\n<p><b>E2 的共同规律：<\/b>每条脉络只放松一个子轴，其余保持经典设定。终身取送有流式任务，但任务是原子的且需求已知；LLM 规划器会分解任务，但只分配一次，且技能已知。在核查过的工作中，没有一项同时放松超过两个 E2 子轴。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作置于一条从经典假设（左）到完全放松设定（右）的轴线上。位置是对该工作在多大程度上放松了假设的定性判断，而非测量值。右侧虚线区域是所有核查过的工作都未触及的范围。每项工作的注释记录了它处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b><i>研究充分<\/i>：有多条成熟的研究脉络。<i>部分研究<\/i>：确有研究，但较为零散，或仍保留较强的简化。<i>薄弱<\/i>：仅有少数论文甚至没有，该领域自身的综述也常称其为开放问题。<\/p>", "tag": "E2 · 经典设定：任务以给定批次出现，已完成分解，需求已知"}, "p3-e2a-tasks-arrive-as-a-stream": {"key": "p3-e2a-tasks-arrive-as-a-stream", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E2 任务", "title": "E2a · 任务以流的形式到达", "bullets": ["成熟且相互独立的几条脉络：<b>动态车辆路径<\/b>、<b>终身取送<\/b>、在线随机分配", "都将任务视为<b>原子的<\/b>，且<b>需求已知<\/b>", "<b>开放问题：<\/b>在线性能保证、到达模型、需求漂移、分配与终身规划的联合求解"], "notesTitle": "E2a：任务以流的形式到达", "notes": "<p><b>经典设定：<\/b>单一批次，事先已知。<b>完全放松：<\/b>任务持续到达，目标是长期吞吐量。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Bucket brigades (1996)<\/b>。连续的工作流通过局部规则在工人之间自我平衡。<span style=\"color:var(--muted)\">仍保留：固定的顺序流水线；人类工人；物品相同。属于运筹学而非机器人学。核查：摘要。<\/span><\/li><li><b>SCoBA (2020)<\/b>。带时间窗与随机成功率的任务在线分配。<span style=\"color:var(--muted)\">仍保留：任务模型与分布已知；原子的单机器人任务。核查：摘要。<\/span><\/li><li><b>Bullo et al. (2011)<\/b>。请求在随机时间、随机地点到达；给出基于排队论的性能极限与带保证的算法。<span style=\"color:var(--muted)\">仍保留：点状需求，服务简单且已知；到达模型为假设。核查：摘要。<\/span><\/li><li><b>Lifelong MAPD (2017)<\/b>。取送任务流；可求解所有良构 (well-formed) 实例。<span style=\"color:var(--muted)\">仍保留：单智能体任务，位置已知；同构智能体。核查：摘要。<\/span><\/li><li><b>Zhu et al. (2025)<\/b>。在仓储仿真器中联合求解在线分配与终身路径规划。<span style=\"color:var(--muted)\">仍保留：任务类型已知；无分解或发现。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Salzman and Stern (2020) 呼吁开展竞争比分析、对任务到达显式建模、在需求漂移时进行在线适应，以及为去中心化方法给出界。Zhu et al. (2025) 指出，大多数工作要么固定任务分配器，要么假设任务事先已知，因此分配与终身规划很少被联合求解。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：研究充分<\/span>有多条成熟脉络，但每条只处理任务到达，且仍将任务视为原子的、需求已知的。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：研究充分"}, "p3-e2b-tasks-must-be-discovered-by-sensing": {"key": "p3-e2b-tasks-must-be-discovered-by-sensing", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E2 任务", "title": "E2b · 任务需通过感知发现", "bullets": ["已有与探索耦合的分配方法，通常采用固定的<b>侦察 / 执行分工<\/b>", "多数方法<b>在发现后重规划<\/b>，而非为发现而规划", "<b>开放问题：<\/b>信息收集与分配的联合求解；以自我中心感知判断哪里需要帮助"], "notesTitle": "E2b：任务需通过感知发现", "notes": "<p><b>经典设定：<\/b>任务清单直接交给团队。<b>完全放松：<\/b>机器人在工作中根据所见发现任务。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Zlot et al. (2002)<\/b>。基于市场机制分配探索目标，在信息增益与代价之间权衡。<span style=\"color:var(--muted)\">仍保留：任务就是探索目标本身。核查：摘要。<\/span><\/li><li><b>Watch-And-Help (2021)<\/b>。辅助者通过观察推断另一智能体的目标，再提供帮助。<span style=\"color:var(--muted)\">仍保留：单个辅助者；仿真家居环境；与 MRTA 相邻而非其组成部分。核查：摘要。<\/span><\/li><li><b>Ginting et al. (2024)<\/b>。在存在故障与通信限制的地下探索中部署异构团队。<span style=\"color:var(--muted)\">仍保留：使命本身就是探索；能力与结果模型给定。核查：摘要。<\/span><\/li><li><b>Osooli et al. (2023)<\/b>。先侦察，再分配，再规划；将能力与受困者需求相匹配。<span style=\"color:var(--muted)\">仍保留：各阶段顺序执行；需求类别预先定义。核查：摘要。<\/span><\/li><li><b>MI-UCB (2021)<\/b>。侦察机器人收集信息，任务机器人获取奖励。<span style=\"color:var(--muted)\">仍保留：固定的侦察 / 任务分工；奖励模型已知。核查：部分全文。<\/span><\/li><li><b>Hunter–gatherer (2021)<\/b>。任务事先未知；快速机器人负责发现，有专长的机器人负责执行。<span style=\"color:var(--muted)\">仍保留：发现的任务是原子的且需求已知；角色固定。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Aziz et al. (2022) 指出任务可能随时间被发现，而多数方法通过重规划来处理。Osooli et al. (2023) 指出搜救研究很少将信息收集、分配与规划视为同一个问题。未检索到将机器人自身对「哪里需要帮助」的感知纳入多机器人分配的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>探索与分配的耦合通过固定角色或重规划实现；基于自我中心感知的任务发现很薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e2c-tasks-must-be-decomposed": {"key": "p3-e2c-tasks-must-be-decomposed", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E2 任务", "title": "E2c · 任务需要分解", "bullets": ["经典方法：可在任意层级交易的<b>任务树<\/b>；带保证的时序逻辑方法", "自 2023 年起：<b>LLM 分解<\/b>非常活跃（SMART-LLM、COHERENT、LaMMA-P）", "<b>开放问题：<\/b>LLM 分解的理论保证、在线再分解、真实世界验证"], "notesTitle": "E2c：任务需要分解", "notes": "<p><b>经典设定：<\/b>任务到达时已完成分解。<b>完全放松：<\/b>需要把目标拆分为子任务，并将其作为决策的一部分。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Korsah et al. (2013)<\/b>。提出复杂依赖 (CD)，即分解本身属于决策的一部分。<span style=\"color:var(--muted)\">仍保留：只是分类法，无方法。核查：摘要。<\/span><\/li><li><b>Zlot & Stentz (2006)<\/b>。可在任意层级交易的 AND/OR 任务树：分解与分配同时进行。<span style=\"color:var(--muted)\">仍保留：树或生成规则由设计者编写。核查：摘要。<\/span><\/li><li><b>Luo & Liu (2024)<\/b>。分层时序逻辑规约，联合分配与规划；声称具有完备性。<span style=\"color:var(--muted)\">仍保留：规约层级由人编写；环境已知。核查：摘要。<\/span><\/li><li><b>SMART-LLM (2023)<\/b>。分解语言指令，组建联盟，并进行分配。<span style=\"color:var(--muted)\">仍保留：技能已知；静态分配；确定性仿真器。核查：全文。<\/span><\/li><li><b>LaMMA-P (2024)<\/b>。LLM 推理结合 PDDL 搜索，用于长时程分解与分配。<span style=\"color:var(--muted)\">仍保留：PDDL 领域与技能给定；家居仿真器。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Li et al. (2025) 指出基于 LLM 的多机器人系统存在数值推理弱、延迟高、基准仅限室内等问题，并建议将 LLM 与优化求解器结合。SMART-LLM 报告了把任务分配给缺乏所需技能的机器人的情况。经典的复杂任务方法仍依赖人工编写的分解结构或规约。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>形式化基础已有，LLM 方向也非常活跃，但理论保证、在线再分解与真实世界验证都很少。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e2d-task-requirements-are-unknown": {"key": "p3-e2d-task-requirements-are-unknown", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E2 任务", "title": "E2d · 任务需求未知", "bullets": ["大多数 MRTA（包括基于特质的方法）<b>将需求视为给定<\/b>", "少数论文会<b>学习<\/b>需求或奖励，但仅限于已见过的任务类型", "<b>开放问题：<\/b>将新任务映射到其能力需求，并给出任何形式的保证"], "notesTitle": "E2d：任务需求未知", "notes": "<p><b>经典设定：<\/b>每个任务所需的能力是给定的。<b>完全放松：<\/b>新任务到来，却没人说明它需要什么。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>STRATA (2020)<\/b>。将任务的特质需求与智能体匹配。<span style=\"color:var(--muted)\">仍保留：需求给定。核查：摘要。<\/span><\/li><li><b>Murata et al. (2025)<\/b>。LLM 推断模糊指令所需的物体，再进行分解与分配。<span style=\"color:var(--muted)\">仍保留：仅限检索；需求表现为物体列表而非能力。核查：摘要。<\/span><\/li><li><b>CMTAB (2023)<\/b>。用 bandit 方法在线学习未知的任务奖励。<span style=\"color:var(--muted)\">仍保留：任务集已知且反复出现；不能迁移到新任务。核查：全文。<\/span><\/li><li><b>Fu et al. (2022)<\/b>。从团队表现数据中学习需求约束与能力模型。<span style=\"color:var(--muted)\">仍保留：同类任务的离线数据；线性约束。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Ali et al. (2022) 指出，新任务需要能同时覆盖熟悉与陌生工作的表示。Fu et al. (2022) 与 Singh et al. (2023) 只针对已见过的任务类型学习需求或奖励。LLM 系统对需求的推断是隐式的，且未经验证。未检索到能将新任务的描述映射到能力需求并给出保证的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>少数局限于已知任务类型的学习型论文，外加一些指出该问题的立场论文。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-e3-dynamics-0-thin-4-partly-0-well-studied": {"key": "p3-e3-dynamics-0-thin-4-partly-0-well-studied", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E3", "title": "E3 动态：0 项薄弱、4 项部分研究、0 项研究充分", "bullets": ["<b>E3a<\/b> 能力未知：<i>部分研究<\/i>", "<b>E3b<\/b> 能力随时间漂移：<i>部分研究<\/i>", "<b>E3c<\/b> 执行具有随机性；机器人会失效：<i>部分研究<\/i>", "<b>E3d<\/b> 环境未知：<i>部分研究<\/i>"], "notesTitle": "E3 动态：小结", "notes": "<p><b>经典假设：<\/b>每台机器人的动作效果已知、静态且确定。<\/p><p>E3 的四个子轴全部属于部分研究，这本身就很说明问题：每个子轴都有一批 2020–2026 年的论文，通常出自少数几个团队，但没有共享的问题形式化、理论或基准。<\/p>\n<p><b>E3 的共同规律：<\/b>处理不确定性的方法几乎总是假设不确定性本身是<i>已知的<\/i>：能力分布已知、失效概率已知、阻塞率已知。而在线<i>学习<\/i>能力或环境的方法，通常会舍弃时间耦合、随机失效，或两者都舍弃。组合情形很少见；未检索到同时学习能力、处理失效并面对未知环境的工作。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作置于一条从经典假设（左）到完全放松设定（右）的轴线上。位置是对该工作在多大程度上放松了假设的定性判断，而非测量值。右侧虚线区域是所有核查过的工作都未触及的范围。每项工作的注释记录了它处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b><i>研究充分<\/i>：有多条成熟的研究脉络。<i>部分研究<\/i>：确有研究，但较为零散，或仍保留较强的简化。<i>薄弱<\/i>：仅有少数论文甚至没有，该领域自身的综述也常称其为开放问题。<\/p>", "tag": "E3 · 经典设定：每台机器人的动作效果已知、静态且确定"}, "p3-e3a-capability-is-unknown": {"key": "p3-e3a-capability-is-unknown", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E3 动态", "title": "E3a · 能力未知", "bullets": ["一批 2020–2026 年的工作<b>在线估计能力<\/b>（专长化、熟练度、bandit、贝叶斯推断）", "多数仍假设<b>能力结构已知<\/b>、平稳性，以及单一固定团队", "<b>开放问题：<\/b>理论（遗憾界）、扩展性，以及学习与时间耦合的结合"], "notesTitle": "E3a：能力未知", "notes": "<p><b>经典设定：<\/b>能力事先已知。<b>完全放松：<\/b>机器人能做什么、做得多好，都要在工作中学习。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Fu et al. (2021)<\/b>。将能力建模为随机变量；风险感知 (CVaR) 的分解、分配与调度。<span style=\"color:var(--muted)\">仍保留：分布事先已知；离线规划。核查：摘要。<\/span><\/li><li><b>CMTAB (2023)<\/b>。用连续臂 bandit 在线学习未知的任务奖励。<span style=\"color:var(--muted)\">仍保留：特质矩阵已知；奖励平稳；仿真；无遗憾界。核查：全文。<\/span><\/li><li><b>Emam et al. (2020)<\/b>。根据观测到的任务进度在线更新每台机器人的专长。<span style=\"color:var(--muted)\">仍保留：团队固定；进度可直接观测；确定性动力学。核查：摘要。<\/span><\/li><li><b>Liu et al. (2022)<\/b>。学习带噪且变化的人类熟练度；考虑探索的鲁棒调度；用户研究。<span style=\"color:var(--muted)\">仍保留：学习的是人而非机器人；参数化学习曲线；任务集固定。核查：摘要。<\/span><\/li><li><b>CE-CM (2026)<\/b>。对跨任务不变的伙伴能力做贝叶斯推断，在少数几个任务中逐步细化。<span style=\"color:var(--muted)\">仍保留：属于临时组队，而非大规模分配；仿真与离线人类数据。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>在线能力学习通常仍假设已知的特质结构（CMTAB 假设特质矩阵已知）、平稳奖励与单一团队。Singh et al. (2023) 将缺少遗憾界与扩展性列为开放问题。将机器人能力学习与时间或耦合约束相结合的例子很少。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>有几篇出自少数团队的近期论文，但缺乏共享的问题形式化、理论或基准。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e3b-capability-drifts-over-time": {"key": "p3-e3b-capability-drifts-over-time", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E3 动态", "title": "E3b · 能力随时间漂移", "bullets": ["<b>能量感知<\/b>分配相当常见，大多采用确定性能量模型", "<b>磨损与退化<\/b>只出现在少数近期论文中，且多针对电池与同构机队", "<b>开放问题：<\/b>在不确定性下，于异构分配中预测能力漂移"], "notesTitle": "E3b：能力随时间漂移", "notes": "<p><b>经典设定：<\/b>能力恒定。<b>完全放松：<\/b>电池会耗尽，部件会磨损，技能会提升或退化。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Latif et al. (2021)<\/b>。考虑电池耗尽与充电的去中心化觅食分配。<span style=\"color:var(--muted)\">仍保留：单一领域；仅以贪心方法为基线。核查：摘要。<\/span><\/li><li><b>Emam et al. (2020)<\/b>。专长化跟踪不断变化的能力。<span style=\"color:var(--muted)\">仍保留：确定性动力学；团队固定。核查：摘要。<\/span><\/li><li><b>Notomista et al. (2021)<\/b>。能耗最小化的在线分配，可适应部件故障与地形变化。<span style=\"color:var(--muted)\">仍保留：确定性能量模型；无法扩展到大量机器人。核查：部分全文。<\/span><\/li><li><b>Mayya et al. (2020)<\/b>。从任务表现中推断退化的能力，然后重新分配。<span style=\"color:var(--muted)\">仍保留：集中式；能力到任务的映射已知；无预测模型。核查：摘要。<\/span><\/li><li><b>Li et al. (2026)<\/b>。联合分配、路径与充电，将电池退化分摊到整个机队。<span style=\"color:var(--muted)\">仍保留：确定性的退化代理指标；离线。核查：摘要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Notomista et al. (2021) 将恢复已损失的能力排除在研究范围之外。Li et al. (2026) 指出，大多数电池感知规划只针对单台机器人。未检索到在不确定性下、于异构多机器人分配中预测能力漂移（预测性健康管理, prognostics）的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>能量耗尽已被广泛处理；退化与学习效应导致的漂移研究薄弱且零散。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e3c-execution-is-stochastic-robots-fail": {"key": "p3-e3c-execution-is-stochastic-robots-fail", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E3 动态", "title": "E3c · 执行具有随机性；机器人会失效", "bullets": ["2017 年时被称为「非常稀少」；此后出现了<b>风险感知与随机<\/b>方法", "几乎都假设<b>分布已知<\/b>且为单机器人任务", "<b>开放问题：<\/b>随机的多机器人任务；学习得到的失效模型；失效 + 重分配 + 理论保证三者兼顾"], "notesTitle": "E3c：执行具有随机性；机器人会失效", "notes": "<p><b>经典设定：<\/b>任务必定成功，持续时间已知。<b>完全放松：<\/b>持续时间可变，任务会失败，机器人会损坏。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Ponda et al. (2012)<\/b>。去中心化的机会约束分配，将团队风险预算进行拆分。<span style=\"color:var(--muted)\">仍保留：分布已知；单机器人任务；无机器人损失。核查：摘要。<\/span><\/li><li><b>Dhanaraj et al. (2024)<\/b>。任务失败会产生恢复工作；对采样的失败情形做事后优化 (hindsight optimisation)。<span style=\"color:var(--muted)\">仍保留：仿真；领域特定的应急模型。核查：全文。<\/span><\/li><li><b>SCoBA (2020)<\/b>。带时间窗的随机任务成功；期望意义下最优。<span style=\"color:var(--muted)\">仍保留：随机模型已知；单智能体任务。核查：摘要。<\/span><\/li><li><b>Messing et al. (2023)<\/b>。持续时间不确定，对执行时间给出概率界。<span style=\"color:var(--muted)\">仍保留：能力已知；无失效或重分配。核查：摘要。<\/span><\/li><li><b>Faruq et al. (2024)<\/b>。将机器人建模为可能永久失效的 MDP；失效后重规划。<span style=\"color:var(--muted)\">仍保留：通信完美；无任务到达；单机器人任务。核查：全文。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>Nunes et al. (2017) 称带时间约束的随机分配研究非常稀少，且没有针对随机多机器人 (ST-MR) 任务的工作。2020 年以来的工作覆盖了其中一部分，但仍保留分布已知、单机器人任务或完美通信等假设；Faruq et al. (2024) 自己也列出了这些局限，Rossano et al. (2025) 将其耦合、非子模奖励下贪心分配的近似界留作一个开放的理论挑战。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>对于分布已知的单机器人任务已不再稀少；联盟任务、学习得到的失效模型以及综合性保证仍很薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e3d-the-environment-is-unknown": {"key": "p3-e3d-the-environment-is-unknown", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E3 动态", "title": "E3d · 环境未知", "bullets": ["不确定的行驶代价已有扎实的<b>风险感知与鲁棒<\/b>形式化，但都假设分布已知", "与<b>探索<\/b>交织的分配大多是启发式的、同构的或分阶段的", "<b>开放问题：<\/b>面向异构团队，在分配的同时在线学习环境模型"], "notesTitle": "E3d：环境未知", "notes": "<p><b>经典设定：<\/b>地图与行驶代价已知。<b>完全放松：<\/b>代价不确定或需在工作中学习；地图在线构建。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Nam & Shell (2017)<\/b>。代价随机且可能相关；比较期望代价与 CVaR。<span style=\"color:var(--muted)\">仍保留：分布已知；一次性分配。核查：摘要。<\/span><\/li><li><b>Prorok (2020)<\/b>。行驶时间不确定且相关；冗余分配，并给出贪心算法的界。<span style=\"color:var(--muted)\">仍保留：图与分布已知；静态。核查：摘要。<\/span><\/li><li><b>Lerman et al. (2006)<\/b>。机器人通过反复的局部观测估计任务构成。<span style=\"color:var(--muted)\">仍保留：同构机器人；两种任务类型。核查：摘要。<\/span><\/li><li><b>Burgard et al. (2005)<\/b>。在在线构建的地图上分配前沿 (frontier) 目标。<span style=\"color:var(--muted)\">仍保留：动作确定；任务即前沿点。核查：全文。<\/span><\/li><li><b>Wilde & A.-Mora (2022)<\/b>。阻塞在到达时才被发现；基于期望代价的贪心在线分配。<span style=\"color:var(--muted)\">仍保留：地图与阻塞率已知；同构；不重新分配。核查：全文。<\/span><\/li><li><b>Patil et al. (2023)<\/b>。在未知环境中生成并分配探索与覆盖任务。<span style=\"color:var(--muted)\">仍保留：同构；启发式，无保证。核查：概要。<\/span><\/li><\/ul>\n<p><b>尚待解决的问题。<\/b>大多数关于不确定代价的工作假设代价或阻塞分布已知。Wilde and Alonso-Mora (2022) 将在线估计阻塞参数（及其探索–利用权衡）列为未来工作。与探索耦合的分配大多是启发式的、使用同构机器人，或将建图与分配作为分离的阶段。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>对已知的不确定性已有鲁棒形式化；在分配过程中在线学习环境仍很薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e4a-temporal-coupling-across-robots": {"key": "p3-e4a-temporal-coupling-across-robots", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E4 交互", "title": "E4a · 跨机器人的时间耦合", "bullets": ["已有专门的<b>分类体系<\/b>（Nunes et al. 2017），以及大量精确、启发式、分布式和学习型求解器", "基本的确定性建模已经<b>成熟<\/b>", "<b>开放问题：<\/b>随机版本、启发式方法的理论保证、更丰富的约束类型、动态任务到达"], "notesTitle": "E4a：跨机器人的时间耦合", "notes": "<p><b>经典设定：<\/b>各任务在时间上相互独立。<b>完全放松：<\/b>在不确定性下，存在连接多个机器人的先后次序、同步和时间窗约束。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Nunes et al. (2017)<\/b>。区分时间约束与次序约束的分类体系，并映射到 VRP 和调度问题。<span style=\"color:var(--muted)\">仍保留：综述；所覆盖的工作大多为确定性。核查方式：全文。<\/span><\/li><li><b>Tercio (2013)<\/b>。处理截止时间、先后次序和空间隔离；MILP 加快速排序器。<span style=\"color:var(--muted)\">仍保留：集中式；确定性时长。核查方式：摘要。<\/span><\/li><li><b>Bischoff et al. (2020)<\/b>。带先后次序的同步多机器人任务；可行性检查与局部改进。<span style=\"color:var(--muted)\">仍保留：集中式启发式；确定性。核查方式：摘要。<\/span><\/li><li><b>ScheduleNet (2020)<\/b>。在含机器人节点和邻近节点的时间网络上学习调度器。<span style=\"color:var(--muted)\">仍保留：集中式；模仿专家；确定性。核查方式：摘要。<\/span><\/li><li><b>GRSTAPS (2022)<\/b>。在时空约束下联合进行规划、分配、调度和运动规划。<span style=\"color:var(--muted)\">仍保留：集中式、离线、确定性；仅仿真。核查方式：摘要。<\/span><\/li><li><b>CBM-pop (2024)<\/b>。面向先后次序与过渡依赖的分布式元启发式方法。<span style=\"color:var(--muted)\">仍保留：网络连通；静态任务；无随机性。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Nunes et al. (2017) 指出，带时间与次序约束的随机分配研究非常稀少，并呼吁为启发式求解器提供理论保证、发展更丰富的时间模型（析取约束、软硬时间窗混合）。Arbanas Ferreira et al. (2024) 将动态任务到达、通信中断和复杂依赖列为未来工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：研究充分<\/span>确定性建模已经成熟；空白在于不确定性、理论保证和动态性。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：研究充分"}, "p3-e4b-interference-and-congestion": {"key": "p3-e4b-interference-and-congestion", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E4 交互", "title": "E4b · 干扰与拥塞", "bullets": ["在群体与觅食模型中，干扰已被充分<b>刻画<\/b>（亚线性扩展）", "很少有<b>分配<\/b>建模对其定价；多数通过行为来减少干扰，或将其推给路径规划", "<b>开放问题：<\/b>时间扩展、异构或去中心化的拥塞感知分配"], "notesTitle": "E4b：干扰与拥塞", "notes": "<p><b>经典设定：<\/b>机器人之间不会相互拖慢。<b>完全放松：<\/b>一个机器人的代价取决于有多少其他机器人与它共享空间或资源。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Lerman & Galstyan (2002)<\/b>。表明由于干扰，群体性能随规模呈亚线性增长。<span style=\"color:var(--muted)\">仍保留：同构；单一任务类型；不做分配优化。核查方式：摘要。<\/span><\/li><li><b>Rosenfeld et al. (2008)<\/b>。度量协调代价；根据感知到的冲突调整协调方式。<span style=\"color:var(--muted)\">仍保留：调整的是行为而非分配；觅食场景；仅仿真。核查方式：摘要。<\/span><\/li><li><b>Mayya et al. (2018)<\/b>。机器人估计局部密度，并以一定概率离开拥挤区域。<span style=\"color:var(--muted)\">仍保留：同构；只决定留下或离开，并非完整分配。核查方式：摘要。<\/span><\/li><li><b>Zhang et al. (2016)<\/b>。用于车辆再平衡的带容量网络流拥塞模型。<span style=\"color:var(--muted)\">仍保留：流体稳态抽象。核查方式：摘要。<\/span><\/li><li><b>Nam & Shell (2015)<\/b>。分配代价中包含随使用某资源的机器人数量而变化的惩罚项。<span style=\"color:var(--muted)\">仍保留：集中式；瞬时；一对一。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Nam 和 Shell 的数量相关惩罚模型是集中式、瞬时的；他们将去中心化和时间扩展版本列为未来工作。Rosenfeld et al. 和 Mayya et al. 通过行为而非分配来减少干扰。Aziz et al. (2022) 的综述没有讨论干扰（这是根据其未提及而作的推断）。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>在群体模型中刻画充分，也有一些分配建模，但很少出现在时间扩展、异构或去中心化的分配中。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e4c-non-additive-team-value": {"key": "p3-e4c-non-additive-team-value", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E4 交互", "title": "E4c · 非可加的团队价值", "bullets": ["<b>联盟形成<\/b>和<b>子模分配<\/b>已经成熟，并有理论保证", "这些保证假设价值是<b>单调<\/b>的：增加一个机器人永远不会变差", "<b>开放问题：<\/b>非单调价值（协同与干扰并存）；在线学习这种价值"], "notesTitle": "E4c：非可加的团队价值", "notes": "<p><b>经典设定：<\/b>团队价值 = 个体价值之和。<b>完全放松：<\/b>协同与干扰同时存在，价值在部署过程中学习得到。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Shehory & Kraus (1998)<\/b>。带近似界的分布式联盟形成；不相交与重叠联盟。<span style=\"color:var(--muted)\">仍保留：联盟价值由已知能力得出；联盟规模有上限；新任务通过重新运行联盟形成来处理。核查方式：全文。<\/span><\/li><li><b>Prorok (2020)<\/b>。将冗余分配建模为超模最小化，并给出贪心算法的界。<span style=\"color:var(--muted)\">仍保留：一次性决策；未建模冗余代价。核查方式：摘要及部分全文。<\/span><\/li><li><b>Synergy graphs (2014)<\/b>。从观测到的小团队表现中学习成对协同。<span style=\"color:var(--muted)\">仍保留：做的是团队选择而非分配；成对结构。核查方式：摘要。<\/span><\/li><li><b>E-ITAGS (2026)<\/b>。带时间约束的、学习得到的非线性联盟效能。<span style=\"color:var(--muted)\">仍保留：特征可加聚合；假设单调性；仅仿真。核查方式：全文。<\/span><\/li><li><b>Liu et al. (2026)<\/b>。在子模团队效用、开放智能体集合下学习策略，给出近似界和遗憾界。<span style=\"color:var(--muted)\">仍保留：仅限边际收益递减。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>现有保证依赖单调的子模或超模结构；E-ITAGS 明确指出其界需要“增加一个机器人永远不会降低性能”。Nam 和 Shell 指出，在存在协同性负代价时他们的精确方法会失效。Prorok 将冗余代价与收益的权衡留作未来工作。从少量观测中学习非可加价值直到最近才开始被研究。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：研究充分<\/span>形式化框架成熟且有理论保证；薄弱之处在于非单调价值以及在部署中学习价值。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：研究充分"}, "p3-e4d-the-allocation-reshapes-the-system": {"key": "p3-e4d-the-allocation-reshapes-the-system", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E4 交互", "title": "E4d · 分配本身重塑系统", "bullets": ["在<b>运筹学<\/b>中已经成熟：瓶颈识别、bucket brigades、仓储排队", "机器人领域只有<b>零散的特定领域实例<\/b>（车辆再平衡、野火）", "<b>开放问题：<\/b>一种价值随分配本身而变化的通用 MRTA 建模"], "notesTitle": "E4d：分配本身重塑系统", "notes": "<p><b>经典设定：<\/b>分配过程中价值保持不变。<b>完全放松：<\/b>每次分配都会改变决定价值的系统状态（瓶颈移动、队列变化）。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Kuo et al. (1996)<\/b>。依据吞吐量的敏感性定义瓶颈，并根据阻塞与饥饿频率识别瓶颈；在一个工厂案例研究中，每次缓冲区调整后瓶颈都会移动。<span style=\"color:var(--muted)\">仍保留：串行产线；重新设计缓冲区，而非移动资源；多瓶颈规则为启发式。核查方式：全文。<\/span><\/li><li><b>Roser et al. (2002)<\/b>。吞吐量敏感性分析，仅在瓶颈不移动时有效。<span style=\"color:var(--muted)\">仍保留：分析工具，而非分配方法。核查方式：摘要。<\/span><\/li><li><b>Berman et al. (2009)<\/b>。通过转移速率将群体驱动到目标分布。<span style=\"color:var(--muted)\">仍保留：目标分布给定；机器人不改变任务环境。核查方式：摘要。<\/span><\/li><li><b>Bucket brigades (1996)<\/b>。分配与产线状态共同演化，收敛到稳定且接近最大吞吐量的划分。<span style=\"color:var(--muted)\">仍保留：一维产线；人类工人。核查方式：摘要。<\/span><\/li><li><b>Pavone et al. (2012)<\/b>。调度会改变站点间的不平衡；基于流体模型的再平衡策略。<span style=\"color:var(--muted)\">仍保留：流体近似；同构；需求已知。核查方式：摘要。<\/span><\/li><li><b>Haksar & Schwager (2018)<\/b>。机器人的行动改变火情，而火情决定未来价值。<span style=\"color:var(--muted)\">仍保留：特定领域；无理论保证。核查方式：摘要。<\/span><\/li><li><b>Lamballais et al. (2022)<\/b>。在 MDP 中嵌入排队网络，根据工作负载在不同流程间重新分配机器人。<span style=\"color:var(--muted)\">仍保留：聚合的机器人池；两个流程；运筹学模型。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>分配与系统状态之间的闭环主要在运筹学或流体模型中处理，而不在 MRTA 建模中。不过，内生队列与耦合决策在那些领域已有充分研究，因此有用的问题是：在明确的模型与目标下，某一具体干预的边际效应如何（3.8），而不是这个闭环是否存在。Roser et al. (2002) 指出，一旦瓶颈移动，基于敏感性的预测便会失效，而这恰恰是重新分配发挥作用的地方。所核查的 MRTA 分类体系（Korsah 2013、Nunes 2017、Aziz 2022）均未将其列为一个类别（这是根据所读内容作的推断）。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>各组成部分在运筹学中已成熟，机器人领域也有零散实例，但没有通用的 MRTA 建模或分类条目。该标签记录的是本综述检索所发现的情况，而非覆盖统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-e5-objective-1-thin-3-partly-0-well-studied": {"key": "p3-e5-objective-1-thin-3-partly-0-well-studied", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E5", "title": "E5 目标：1 项薄弱，3 项部分研究，0 项研究充分", "bullets": ["<b>E5a<\/b> 长期吞吐量：<i>部分研究<\/i>", "<b>E5b<\/b> 风险与无损限制：<i>部分研究<\/i>", "<b>E5c<\/b> 多目标与公平性：<i>部分研究<\/i>", "<b>E5d<\/b> 由人类偏好定义目标：<i>薄弱<\/i>"], "notesTitle": "E5 目标：小结", "notes": "<p><b>经典假设：<\/b>每个回合只有一个标量目标，且由设计者完全指定。<\/p><p>在流派覆盖矩阵（3.3.1）中 E5 几乎为空，文献核查也证实它总体上比 E1–E4 更薄弱。吞吐量目标已经确立，但几乎只出现在同构仓储路径规划中。风险度量已经确立，而“不差于基线”的保证在 MRTA 中缺失。多目标与公平性研究零散，由人类定义目标的研究薄弱。<\/p>\n<p><b>E5 中的一个共同模式：<\/b>一旦目标改变，问题的其余部分就会被简化作为补偿：吞吐量研究保留单机器人任务和同构机器人；风险研究保留已知分布和设计者固定的风险水平；公平性则没有统一定义。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每一页把代表性工作放在一条从经典假设（左）到完全放松设定（右）的线上。位置是对一项工作在多大程度上放松了该假设的定性判断，而非测量值。右侧虚线区域表示所核查的工作均未达到的部分。每项工作的注释记录了它处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b><i>研究充分<\/i>：存在若干成熟的研究脉络。<i>部分研究<\/i>：有真实但零散的工作群，或仍保留较强的简化。<i>薄弱<\/i>：只有少数论文或没有，且领域内综述常称其为开放问题。<\/p>", "tag": "E5 · 经典设定：每个回合只有一个标量目标，且由设计者完全指定"}, "p3-e5a-long-run-throughput": {"key": "p3-e5a-long-run-throughput", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E5 目标", "title": "E5a · 长期吞吐量", "bullets": ["吞吐量是<b>仓储终身路径规划<\/b>和机器人单元运筹学研究的核心", "几乎全部使用<b>同构机器人<\/b>和<b>单机器人任务<\/b>", "<b>开放问题：<\/b>面向异构团队和多机器人任务、带形式化保证的速率目标"], "notesTitle": "E5a：长期吞吐量", "notes": "<p><b>经典设定：<\/b>尽快完成一个回合。<b>完全放松：<\/b>对异构机器人和团队任务最大化长期速率。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Berman et al. (2009)<\/b>。同构机器人的稳态分配。<span style=\"color:var(--muted)\">仍保留：优化的是收敛速度而非吞吐量。核查方式：摘要。<\/span><\/li><li><b>Lifelong MAPD (2017)<\/b>。在线任务流，在良构实例上具有完备性。<span style=\"color:var(--muted)\">仍保留：同构；单智能体任务；吞吐量并非其明确目标。核查方式：摘要。<\/span><\/li><li><b>Dawande et al. (2007)<\/b>。机器人单元中的周期稳态吞吐量，包括多机器人情形。<span style=\"color:var(--muted)\">仍保留：确定性、已知的单元布局。核查方式：摘要。<\/span><\/li><li><b>Robot Runners (2024)<\/b>。在给定时域内最大化完成任务数的基准。<span style=\"color:var(--muted)\">仍保留：有限时域；同构；单智能体任务。核查方式：全文。<\/span><\/li><li><b>Zhu et al. (2025)<\/b>。以吞吐量为目标的在线分配与路径规划联合求解。<span style=\"color:var(--muted)\">仍保留：仅仿真；基于规则的规划器。核查方式：摘要。<\/span><\/li><li><b>GRAND (2026)<\/b>。学习的再平衡加最小费用流分配；吞吐量最多提升 10%。<span style=\"color:var(--muted)\">仍保留：同构；单智能体任务；无形式化的速率目标。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Zhu et al. (2025) 指出，已有工作假设固定的任务分配器或离线任务，因此以吞吐量为驱动的在线联合分配仍处于起步阶段。League of Robot Runners 论文将频繁重规划下的在线终身运行列为核心挑战。未发现为异构智能体或多机器人任务定义长期速率目标的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>在同构仓储场景和机器人单元运筹学中处于核心地位并有基准；超出这些场景的研究很少。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e5b-risk-and-no-harm-limits": {"key": "p3-e5b-risk-and-no-harm-limits", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E5 目标", "title": "E5b · 风险与无损限制", "bullets": ["MRTA 中的风险度量（<b>CVaR<\/b>）和<b>机会约束<\/b>：已有若干扎实工作", "风险水平通常是由设计者固定的<b>单一参数<\/b>", "<b>薄弱：<\/b>保证增加机器人或重新分配不会比当前团队更差"], "notesTitle": "E5b：风险与无损限制", "notes": "<p><b>经典设定：<\/b>优化期望值。<b>完全放松：<\/b>限制风险，并保证任何改变都不会让团队比之前更差。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Ponda et al. (2012)<\/b>。机会约束 CBBA，对团队风险预算进行拆分。<span style=\"color:var(--muted)\">仍保留：不确定性已知；回合目标。核查方式：摘要。<\/span><\/li><li><b>Nam & Shell (2016)<\/b>。均值–CVaR 代价及其对风险偏好的敏感性。<span style=\"color:var(--muted)\">仍保留：ST-SR-IA；小规模实例。核查方式：全文。<\/span><\/li><li><b>Zhou & Tokekar (2022)<\/b>。对子模效用取 CVaR，并给出贪心算法的界。<span style=\"color:var(--muted)\">仍保留：固定风险水平；分布已知；一次性决策。核查方式：摘要。<\/span><\/li><li><b>Park et al. (2023)<\/b>。在截止时间约束下，使未满足特征需求的概率低于阈值。<span style=\"color:var(--muted)\">仍保留：以 makespan 为目标；阈值由设计者给定；离线。核查方式：摘要。<\/span><\/li><li><b>Tihanyi et al. (2022)<\/b>。基于随机可达性的安全性，并为贪心与拍卖分配给出界。<span style=\"color:var(--muted)\">仍保留：危险模型已知。核查方式：摘要。<\/span><\/li><li><b>Conservative bandits (2016)<\/b>。探索过程的累积性能永不低于基线（非 MRTA）。<span style=\"color:var(--muted)\">仍保留：单智能体；bandit 设定。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>风险偏好通常由设计者固定，而 Rudolph et al. (2021) 认为固定的风险态度本身就可能有害。未发现任何 MRTA 工作保证某种改变（增加机器人、重新分配）不会比当前分配更差；这类保证只存在于 MRTA 之外，即 conservative bandits 和安全策略改进。Nam 和 Shell 的精确方法仅适用于小规模实例。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>风险度量和机会约束已经确立（部分研究）；相对基线的无损保证薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e5c-several-objectives-and-fairness": {"key": "p3-e5c-several-objectives-and-fairness", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E5 目标", "title": "E5c · 多目标与公平性", "bullets": ["多目标和<b>最小化最大工作负载<\/b>的建模很常见", "<b>公平性<\/b>没有统一定义（最坏情况任务、最低被选率、工作负载均衡）", "<b>开放问题：<\/b>如何在 Pareto 前沿上选点；兼顾效率权衡的对人公平"], "notesTitle": "E5c：多目标与公平性", "notes": "<p><b>经典设定：<\/b>单一目标。<b>完全放松：<\/b>在多个目标之间权衡，并兼顾机器人之间和人之间的公平。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Msala et al. (2023)<\/b>。机器人间的工作负载均衡。<span style=\"color:var(--muted)\">仍保留：静态；公平仅体现为均衡。核查方式：摘要。<\/span><\/li><li><b>Wei et al. (2020)<\/b>。在总行程与工作负载均衡之间进行 Pareto 搜索。<span style=\"color:var(--muted)\">仍保留：离线；没有选择解的规则。核查方式：摘要。<\/span><\/li><li><b>Malencia et al. (2021)<\/b>。将任务间公平定义为在不确定性下最小化最坏情况代价。<span style=\"color:var(--muted)\">仍保留：仅考虑任务间公平；一次性决策。核查方式：摘要。<\/span><\/li><li><b>Claure et al. (2020)<\/b>。将人之间的公平定义为最低被选率；关于信任的用户研究。<span style=\"color:var(--muted)\">仍保留：由单个机器人进行分配；任务简单。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>多目标 MRTA 大多是离线的元启发式 Pareto 搜索，缺乏有原则的选解方法。各论文对公平的定义各不相同。Ali et al. (2022) 将人–机器人分配中的公平与协商列为需要研究的方向。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>多目标和均衡建模很常见；公平性，尤其是对人的公平，只有少数工作且没有统一定义。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e5d-human-preferences-define-the-objective": {"key": "p3-e5d-human-preferences-define-the-objective", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E5 目标", "title": "E5d · 由人类偏好定义目标", "bullets": ["关于调度中决策权与偏好，有扎实的<b>人因研究<\/b>", "零散的方法<b>模仿专家<\/b>，或从偏好的分配中<b>反推<\/b>参数", "<b>开放问题：<\/b>有保证的交互式偏好获取；多人偏好；随时间变化的偏好"], "notesTitle": "E5d：由人类偏好定义目标", "notes": "<p><b>经典设定：<\/b>由设计者编写目标。<b>完全放松：<\/b>人的偏好（可能来自多人且会变化）决定优化什么。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Gombolay et al. (2015)<\/b>。研究由谁掌握分配决策权。<span style=\"color:var(--muted)\">仍保留：目标仍是效率。核查方式：摘要。<\/span><\/li><li><b>Apprenticeship (2016)<\/b>。从示范中学习专家调度启发式。<span style=\"color:var(--muted)\">仍保留：模仿策略而非获取目标。核查方式：摘要。<\/span><\/li><li><b>Gombolay et al. (2017)<\/b>。工作流偏好和工作负载应如何纳入调度。<span style=\"color:var(--muted)\">仍保留：仅为指导原则；小型实验室任务。核查方式：摘要。<\/span><\/li><li><b>Shi & Sukhatme (2024)<\/b>。调整风险参数，使分配器复现主管偏好的分配。<span style=\"color:var(--muted)\">仍保留：贪心分配器已知；一次只处理一个偏好。核查方式：摘要。<\/span><\/li><li><b>REBEL (2024)<\/b>。基于 LLM、与用户偏好对齐的初始分配。<span style=\"color:var(--muted)\">仍保留：仅限初始分配；无理论保证。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>现有方法要么实证研究人因（Gombolay et al. 2015, 2017），要么模仿专家调度（2016），要么反推单一类别的参数（Shi and Sukhatme 2024）。未发现 MRTA 工作研究有保证的交互式偏好获取、多人偏好融合或随时间变化的偏好。Ali et al. (2022) 认为人可能需要持续参与分配决策。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>有少数扎实的人因研究和零散的反推或模仿方法；形式化处理稀少。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-e6a-partial-local-observation": {"key": "p3-e6a-partial-local-observation", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E6 信息", "title": "E6a · 部分、局部观测", "bullets": ["群体和多智能体强化学习中关于<b>局部观测<\/b>的工作很常见", "几乎都是<b>同构<\/b>的、没有理论保证，或依赖<b>集中式训练<\/b>", "<b>开放问题：<\/b>界定从单个机器人自身视角推断团队状态所带来的损失"], "notesTitle": "E6a：部分、局部观测", "notes": "<p><b>经典设定：<\/b>分配器能看到全局状态。<b>完全放松：<\/b>每个机器人只能看到周围环境，必须推断团队和任务状态。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Jones & Matarić (2003)<\/b>。每个机器人从短期历史中估计任务构成及其他机器人的任务，并切换以与之匹配；能适应任务构成的变化。<span style=\"color:var(--muted)\">仍保留：同构；两种任务类型；目标规则由设计固定；20 个仿真机器人；未测试机器人失效。核查方式：全文。<\/span><\/li><li><b>Lerman et al. (2006)<\/b>。机器人根据一段时间窗口内的局部观测估计环境；收敛时间随窗口长度增长；窗口会引起振荡。<span style=\"color:var(--muted)\">仍保留：两种任务类型（用于阐述）；同构；聚合模型。核查方式：全文。<\/span><\/li><li><b>Amato et al. (2015)<\/b>。宏动作 Dec-POMDP；分配从局部观测中涌现。<span style=\"color:var(--muted)\">仍保留：模型已知；离线；小规模问题。核查方式：摘要。<\/span><\/li><li><b>Lv et al. (2024)<\/b>。聚合邻居观测的 Dec-POMDP 群体分配。<span style=\"color:var(--muted)\">仍保留：集中式训练；无理论保证。核查方式：摘要。<\/span><\/li><li><b>Bezerra et al. (2025)<\/b>。视野范围内的观测，加上通信范围内的意图共享。<span style=\"color:var(--muted)\">仍保留：集中式 critic；同构。核查方式：部分全文。<\/span><\/li><li><b>Mendoza et al. (2026)<\/b>。局部感知半径；机器人只有到达后才知道任务已被占用；100 架无人机。<span style=\"color:var(--muted)\">仍保留：同构；单机器人任务；尚无理论保证。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>学习方法在训练中仍使用集中式 critic 或全局状态；博弈论和群体方法假设同构机器人和简单任务。Mendoza et al. (2026) 将理论保证、异构性、时变拓扑和多机器人任务列为未来工作。未发现对机器人从自我中心视角估计团队或任务状态所造成损失给出界的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>在群体和学习场景中很常见，但几乎总是同构、无保证或依赖集中式训练。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e6b-limited-or-intermittent-communication": {"key": "p3-e6b-limited-or-intermittent-communication", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E6 信息", "title": "E6b · 受限或间歇通信", "bullets": ["文献丰富：<b>鲁棒拍卖<\/b>、共识方法、<b>会合<\/b>调度", "分析大多使用<b>简单的丢包模型<\/b>（独立丢包）", "<b>开放问题：<\/b>真实信道；分配与网络联合规划时的理论保证"], "notesTitle": "E6b：受限或间歇通信", "notes": "<p><b>经典设定：<\/b>可靠、无限制的通信。<b>完全放松：<\/b>消息会丢失，链路时断时续，团队与网络必须一起规划。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Kopeikin et al. (2011)<\/b>。CBBA 调度中继任务以保持网络连通。<span style=\"color:var(--muted)\">仍保留：通信范围模型已知。核查方式：摘要。<\/span><\/li><li><b>Hollinger & Singh (2012)<\/b>。机器人按设定间隔重新连接；在线算法和难度结果。<span style=\"color:var(--muted)\">仍保留：针对搜索与覆盖，而非通用分配。核查方式：摘要。<\/span><\/li><li><b>Dec-MCTS (2019)<\/b>。周期性交换压缩搜索树，可容忍链路退化。<span style=\"color:var(--muted)\">仍保留：针对主动感知而非分配。核查方式：摘要。<\/span><\/li><li><b>Otte et al. (2020)<\/b>。比较随机丢包和突发丢包下的各类拍卖。<span style=\"color:var(--muted)\">仍保留：拍卖者可靠；丢包模型简单。核查方式：全文。<\/span><\/li><li><b>CoCoPlan (2026)<\/b>。联合规划任务分配与重新连接事件；100 个机器人；硬件测试。<span style=\"color:var(--muted)\">仍保留：最坏情况为指数复杂度；最优性依赖平稳的任务到达。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Gielis、Shankar 和 Prorok (2022) 指出，联合设计机器人及其所用网络的工作十分匮乏，并将联合设计列为首要开放问题。大多数分配分析使用 Bernoulli 或两状态丢包模型。时变拓扑下的理论保证被列为未来工作（Mendoza et al. 2026）。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：研究充分<\/span>已有大量文献；真实信道模型以及任务–网络联合规划的理论保证较为薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：研究充分"}, "p3-e6c-uncertain-self-knowledge": {"key": "p3-e6c-uncertain-self-knowledge", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E6 信息", "title": "E6c · 不确定的自我认知", "bullets": ["鲁棒和随机分配把代价视为<b>已知分布或区间<\/b>", "少数方法以集中方式根据执行情况<b>更新<\/b>机器人的估计", "<b>开放问题：<\/b>自我估计失准；有偏出价如何在拍卖中传播"], "notesTitle": "E6c：不确定的自我认知", "notes": "<p><b>经典设定：<\/b>每个机器人精确知道自身代价。<b>完全放松：<\/b>机器人估计自身代价（可能有偏），并需要进行校准。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Liu & Shell (2010)<\/b>。每个效用在最优分配改变之前可以偏离多少。<span style=\"color:var(--muted)\">仍保留：集中式 ST-SR-IA；区间不确定性。核查方式：摘要。<\/span><\/li><li><b>Ponda et al. (2012)<\/b>。分布式分配中的随机任务得分。<span style=\"color:var(--muted)\">仍保留：分布已知；无自我学习。核查方式：摘要。<\/span><\/li><li><b>Fu et al. (2021)<\/b>。将能力建模为随机变量，并进行 CVaR 鲁棒调度。<span style=\"color:var(--muted)\">仍保留：分布已知；集中式。核查方式：摘要。<\/span><\/li><li><b>Messing et al. (2023)<\/b>。不确定时长下的概率保证，无需分布假设。<span style=\"color:var(--muted)\">仍保留：集中式、离线；仅考虑时长。核查方式：摘要。<\/span><\/li><li><b>Emam et al. (2020)<\/b>。根据进展在线更新每个机器人的效能。<span style=\"color:var(--muted)\">仍保留：进展可观测；集中式。核查方式：摘要。<\/span><\/li><li><b>Lin & Tron (2025)<\/b>。按根据执行情况更新的估计完成概率进行分配，并给出置信保证。<span style=\"color:var(--muted)\">仍保留：集中式分配器；MDP 任务模型。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>大多数方法把不确定性当作外生的已知分布或区间，而不是机器人对自身的有偏估计。在线自我估计（Emam et al.；Lin and Tron）是集中式的，且没有校准分析。未发现研究过度自信或信心不足的出价如何在拍卖中传播的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>鲁棒与随机分配已经确立；机器人在分配过程中学习或校准自身估计的研究薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e6d-information-costs-time-to-acquire": {"key": "p3-e6d-information-costs-time-to-acquire", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E6 信息", "title": "E6d · 获取信息需要花费时间", "bullets": ["信息价值理论存在于<b>分配问题之外<\/b>（序贯设计、主动检验）", "在团队协作中，它只出现在小型、完全可观测领域中的<b>单个 ad hoc 智能体<\/b>上", "<b>开放问题：<\/b>在多机器人分配中把“花时间观察”作为显式的、有代价的动作"], "notesTitle": "E6d：获取信息需要花费时间", "notes": "<p><b>经典设定：<\/b>信息免费且即时可得。<b>完全放松：<\/b>观察需要时间，而团队同时在工作；何时停止观察本身就是一个决策。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>Chernoff (1959)<\/b>。在做决策之前选择进行哪个实验以及何时停止。<span style=\"color:var(--muted)\">仍保留：单一决策者；非机器人领域。核查方式：重印本元数据。<\/span><\/li><li><b>CMTAB (2023)<\/b>。通过重复分配探索未知奖励。<span style=\"color:var(--muted)\">仍保留：没有独立的观察动作；奖励平稳。核查方式：摘要。<\/span><\/li><li><b>Mirsky et al. (2020)<\/b>。ad hoc 智能体决定何时向队友提问。<span style=\"color:var(--muted)\">仍保留：单个 ad hoc 智能体；可能目标的集合已知；共享协议且回答如实；静态、确定性领域。核查方式：全文。<\/span><\/li><li><b>Macke et al. (2021)<\/b>。有代价的询问与通过观察推断队友目标之间的权衡。<span style=\"color:var(--muted)\">仍保留：静态、确定性、完全可观测；小型领域。核查方式：全文。<\/span><\/li><li><b>Rossano et al. (2025)<\/b>。任务是否需要额外能力，会在到达现场后经过已知延迟揭示，或根据进展缓慢来估计；中央拍卖预先部署支援机器人。<span style=\"color:var(--muted)\">仍保留：揭示是外生的，而非主动选择的观察；团队固定；仅仿真。核查方式：全文。<\/span><\/li><li><b>Liang et al. (2026)<\/b>。可派遣空闲机器人探索不确定区域，其代价计入 makespan；基于遗憾的搜索。<span style=\"color:var(--muted)\">仍保留：集中式；到达后观察即完美；采用最坏情况视角而非信息价值视角；无停止规则。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>信息价值推理存在于分配问题之外（Chernoff 1959；主动假设检验），或只针对小型领域中的单个 ad hoc 智能体（Mirsky et al. 2020；Macke et al. 2021，其作者明确指出方法局限于简单、有限的环境）。MRTA 论文只部分地触及这一权衡：bandit 探索（Singh et al. 2023）、外生的确认延迟（Rossano et al. 2025），或固定的先收集后行动顺序。Liang et al. (2026) 将探索作为显式的、有代价的分配选择，但没有信息价值或停止分析。未发现任何工作在多机器人分配中把观察时间视为显式的、有代价的动作，并给出信息价值或停止规则分析。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>少数近期论文（多为预印本）隐式地触及该问题；没有工作用信息价值或停止理论来刻画 MRTA 中的“观察还是行动”。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-e6e-teammates-share-only-a-minimal-interface": {"title": "E6e · 队友之间只共享最小接口", "bullets": ["每种经典的达成一致方法都<b>假设<\/b>存在共享的格式、评分规则和平局处理规则（2.3.11）", "零样本协调和即兴协作在<b>机器人学之外<\/b>放松了这一假设，但转而共享其他东西（4.7.1）", "<b>开放问题：<\/b>在共享接口但不共享联合设计策略的机器人之间进行分配"], "notesTitle": "E6e：队友之间只共享最小接口", "notes": "<p><b>经典设定：<\/b>所有机器人运行一套联合设计的协议与协调策略。<b>完全放松：<\/b>来自不同构建方的机器人至多共享一个最小接口，而不共享联合设计的策略。<\/p>\n<p><b>代表性工作<\/b>（按图中从左到右）：<\/p>\n<ul><li><b>CBBA (2009)<\/b>。机器人通过与邻居交换中标出价，就中标结果达成一致。<span style=\"color:var(--muted)\">仍保留：所有机器人运行相同的算法、消息格式和评分方案。核查方式：全文。<\/span><\/li><li><b>RoCo (2024)<\/b>。机械臂用自然语言协商子任务。<span style=\"color:var(--muted)\">仍保留：每个机器人都是同一个 LLM，并使用设计好的对话协议；中央运动规划器。核查方式：全文。<\/span><\/li><li><b>Drop-
