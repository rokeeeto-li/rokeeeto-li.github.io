   intro:{year:'1999 / 2013 / 2017',by:'Theraulaz & Bonabeau; Dragan, Lee & Srinivasa; Knepper et al.',cell:'coordination through actions and the environment',problem:'let functional actions and changes to the environment carry information',note:'Theraulaz and Bonabeau (1999) traced the idea of stigmergy, coordination through modifications of a shared environment, from Grassé\'s termite studies. Dragan, Lee and Srinivasa (2013) formalised legible robot motion, which lets an observer infer the robot\'s goal early. Knepper et al. (2017) gave a framework for how ordinary actions in a joint task can carry implicit messages.'},
   math:[["stigmergy","S<sub>k</sub> → R<sub>k</sub> (any agent) → S<sub>k+1</sub>","Grassé"],["legibility","∫ P(G*|ξ<sub>S→ξ(t)</sub>) f(t) dt / ∫ f(t) dt","goal inferred early"],["decode","m̂ = argmax<sub>m</sub> P(â|m, M<sub>pub</sub>) P(m|M<sub>pub</sub>)","Knepper et al., Eq. 1"]],
   bullets:[`Actions and environmental traces <b>carry information</b> without a message format`,`Legible motion lets others infer your goal <b>sooner</b>`,`All three still assume some <b>common ground</b>`],
   notesTitle:"What can be read without a protocol",
   notes:`<p><b>Stigmergy.</b> Grassé's definition: a stimulating configuration triggers an action by a worker, which turns it into a new configuration that may trigger an action by the same or any other worker. Theraulaz and Bonabeau distinguish <i>quantitative</i> stigmergy, where stimuli differ only in intensity and change the probability of a response (pheromone trails; the response thresholds of 2.4), from <i>qualitative</i> stigmergy, where different configurations trigger different actions (wasp nest building). They stress that stigmergy alone does not explain coordination; another mechanism has to supplement it. It assumes individuals that respond identically to the same stimuli: in effect, the species shares the protocol.</p>
<p><b>Legibility.</b> Predictable motion is what an observer expects for a known goal, the cheapest path under the observer's cost C. Legible motion is what lets the observer infer the goal quickly, the integral above with weights f(t) that favour early time. In an online study with 432 participants watching videos, legible trajectories made goals easier to infer; predictability held for a point robot and a human arm but not for the HERB robot, whose expected motion differed. The robot must know the observer's cost and the candidate goals.</p>
<p><b>Implicit communication.</b> Knepper et al. give conditions under which an action that achieves the task also signals a fact: it must be surprising given common ground, more likely given the fact, and point to that fact more than to others. Decoding and encoding are Bayesian (Eqs. 1–2). The paper offers a framework and case studies, no new experiments, and it assumes participants agree on the available actions, the common ground and the action likelihoods, which the authors themselves call perhaps too strong with strangers.</p>
<p><b>For MRTA.</b> The watch channel is how robots from different builders could coordinate without agreeing on messages, and how the self-organising family already works. What is missing is a task-allocation formulation in which the signal is the choice of task itself, read by robots that do not share a model of each other.</p>`,
   refs:[ref("Theraulaz & Bonabeau, Artificial Life 1999","A brief history of stigmergy",{PDF:"https://lia.disi.unibo.it/Courses/AI/fundamentalsAI2008-09/papers/stigmergy.pdf",Scholar:sch("A brief history of stigmergy")}),
         ref("Dragan, Lee & Srinivasa, HRI 2013","Legibility and predictability of robot motion",{PDF:"https://personalrobotics.cs.washington.edu/publications/dragan2013legible.pdf",Scholar:sch("Legibility and predictability of robot motion")}),
         ref("Knepper, Mavrogiannis, Proft & Liang, HRI 2017","Implicit communication in a joint action",{PDF:"https://rpal.cs.cornell.edu/docs/KneEtal_HRI_2017.pdf",Scholar:sch("Implicit communication in a joint action Knepper")})] },

 { child:true, eyebrow:"Part 4 · ③ Knowledge & authority · P5 Coordination interfaces · Deep dive", title:"Talk or watch? When asking is worth it", fig:"p4cqp",
   intro:{year:'2020 / 2021',by:'Mirsky et al.; Macke, Mirsky & Stone',cell:'one ad hoc agent, a teammate it can query',problem:'decide whether and when to ask a teammate instead of inferring from its behaviour',note:'Mirsky et al. (2020) studied an ad hoc agent that can either keep watching a teammate to infer its goal or ask it directly at a cost. They identified the window of time in which a question can still change the plan. Macke, Mirsky and Stone (2021) generalised this to the expected value of a query during planning.'},
   math:[["window","Z<sub>Q</sub> = {t ≤ wcd<sub>T</sub>} ∩ {t ≥ wcd<sub>A</sub>}","still ambiguous, still useful"],["ask at","CQP = min Z<sub>Q</sub>","−1 if empty"],["rule","ask iff value(q) − cost(q) &gt; 0","Macke et al."]],
   bullets:[`Watching reveals the teammate's goal <b>for free</b>, but only eventually`,`Asking helps only in a <b>window</b>: still ambiguous, still worth changing plans`,`Both papers assume truthful answers in a <b>shared protocol</b>`],
   notesTitle:"The choice between the two channels",
   notes:`<p><b>Worst-case distinctiveness.</b> For a teammate heading to one of several goals, wcd is how long its actions can stay ambiguous between two goals. After that point, watching reveals the goal at no cost. Before the agent's own plans diverge (wcd for the agent), the answer does not matter yet.</p>
<p><b>Mirsky et al. (2020)</b> define the useful query window as the intersection of these two conditions and the critical querying point as its first moment. In 100 instances, querying anywhere in that window cost 3.65 extra steps over a perfect plan, against 7.25 for the next-best strategy.</p>
<p><b>Macke et al. (2021)</b> define the value of a query as the expected improvement of the plan, and ask when the value exceeds the cost. The rule is myopic; the paper proves a Bellman equation for the expected divergence point, not optimality of the query policy.</p>
<p><b>Assumptions.</b> Both papers assume the teammate answers truthfully and without noise, in a communication protocol the two share, and that the teammate behaves optimally and is fully observable. With robots from different builders the talk channel may be available only in natural language (2.3.10), with no guarantee that the answer is understood or reliable.</p>
<p><b>Why this belongs in P5.</b> The choice between talking and watching is itself an information-first decision (P1): each channel buys information at a price, and the right one depends on how long watching takes to become informative. No MRTA work found frames task allocation this way.</p>`,
   refs:[ref("Mirsky, Macke, Wang, Yedidsion & Stone, IJCAI 2020","A penny for your thoughts: the value of communication in ad hoc teamwork",{Link:"https://www.ijcai.org/proceedings/2020/36",Scholar:sch("A penny for your thoughts the value of communication in ad hoc teamwork")}),
         ref("Macke, Mirsky & Stone, AAAI 2021","Expected value of communication for planning in ad hoc teamwork",{arXiv:arx("2103.01171"),Scholar:sch("Expected value of communication for planning in ad hoc teamwork")})] },

 /* ---------- synthesis ---------- */
 { kind:"table", eyebrow:"Part 4 · Synthesis", title:"Combinations: what exists and what is missing", tag:"related evidence",
   table:{ dense:true, head:["Combination","Representative work","What is missing"],
     rows:[["P2 + P6: design for flow","layout search for throughput (Zhang et al. 2023)","the allocator is held fixed; no guarantees"],
           ["P2 + P4: local rules that track demand","response thresholds; Lerman et al. 2006; bucket brigades","homogeneous or speed-ordered robots"],
           ["P1 + P4: infer teammates by watching","PLASTIC; type-based beliefs (Albrecht et al.)","observation time not traded against working time"],
           ["P4 + P5: ad hoc teams without a protocol","GPL; NAHT; fictitious co-play; ProAgent","physical robots; explicit task allocation"],
           ["P1 + P3: learn without doing harm","conservative bandits; SafeOpt; SPIBB","coupled robots; a baseline that moves"],
           ["P3 + P4: a newcomer that must not hurt the team","not found in this review","with no data, safety reduces to copying a baseline"],
           ["P1 + P2 + P4 + P5: read a running system and act on it","pieces: bottleneck detection, local estimates, sequential tests, OPAT, communication-aware planning","not found combined in this review; see the candidate questions (3.16)"],
           ["P5 + P6: environments that carry signals","stigmergy; legible motion","designed for robots from different builders"]],
     hlCol:2, caption:"Related evidence, not certified gaps; rows are not exhaustive." },
   notesTitle:"Where the paradigms meet",
   notes:`<p>The six paradigms are not exclusive. Several existing lines of work already combine two of them, and the empty cells cluster where three or more meet.</p>
<ul><li><b>Pairs with work.</b> Design and flow meet in layout optimisation; local rules and flow meet in threshold models and bucket brigades; information and the individual view meet in type-based ad hoc teamwork; the individual view and the absence of a protocol meet in zero-shot coordination; information and safety meet in conservative and safe exploration.</li>
<li><b>Pairs without work in this search.</b> No paper found here asks a newcomer to improve a team while guaranteeing it does no harm; in the safe-improvement framework, a robot with no data can only copy a baseline, which it may not have.</li>
<li><b>Larger combinations.</b> A robot that reads a running system (flow), pays for what it observes (information), acts only for itself (individual) and cannot rely on shared messages (no protocol) touches E4d, E6d and E1a together. Each ingredient exists separately: bottleneck detection from blocked and starved frequencies, local task-mix estimation, sequential tests with stopping rules, online ad hoc planning (OPAT) and communication-aware planning. This review did not find them combined for heterogeneous robots; that is a statement about the search, not about the field.</li>
<li><b>Environment as a channel.</b> Stigmergy and legibility suggest designing workspaces or behaviours that make intentions readable; neither has been engineered for robots from different builders.</li></ul>
<p>The table lists combinations, not recommendations. Each row could be developed in several ways, and other rows could be added.</p>`,
   refs:[] },

 { kind:"table", eyebrow:"Part 4 · Synthesis", title:"Objections and limits", tag:"counter-arguments",
   table:{ dense:true, head:["Objection","Why it has force","Response"],
     rows:[["These are not new paradigms","queueing control, sequential inference, ad hoc planning and conservative learning are established","agreed: they are lenses whose transfer must be checked, not replacements"],
           ["These are just MRTA with extra constraints","each can be written as a larger MDP or game","in principle; but classical solvers and guarantees do not survive the rewrite"],
           ["The guarantees come from other fields","they assume stationarity, i.i.d. data, single learners","each deep dive lists what breaks; transfer is open"],
           ["The evidence is mostly simulation","drop-in soccer is the only long-running physical ad hoc test","treat claims as hypotheses; physical tests are part of the gap"],
           ["Classical methods still work","tidy settings have known tables, one builder, fixed teams","agreed; the paradigms matter when Part 1's three breaks occur"],
           ["The selection reflects the authors","the six follow from assumptions we chose to list; see 3.18","4.2 makes the derivation checkable; others can add rows"],
           ["Part 3's model missed the protocol","shared semantics surfaced in Part 2, not in the audit","added afterwards as E6e (thin); other omissions are possible"]],
     hlCol:2 },
   notesTitle:"Reasons for caution",
   notes:`<p><b>"Just MRTA with constraints."</b> Any of the paradigms can be folded into a large enough Dec-POMDP or game. That observation does not help: the classical solvers of Part 2 and their guarantees rely on the commitments the paradigms drop. The contribution of a paradigm is a formal statement with a tractable structure and a guarantee, not the observation that the problem is general.</p>
<p><b>Borrowed guarantees.</b> Max-weight assumes central knowledge and i.i.d. arrivals; Wald and Chernoff assume i.i.d. observations from fixed hypotheses; conservative bandits and SPIBB assume stationary environments and a single learner; other-play assumes known symmetries. Robot teams violate each of these, mainly because the other robots react. Each deep dive lists the specific failure. Showing which guarantees survive coupling is open.</p>
<p><b>Thin evidence.</b> Almost every result in Part 4 is theoretical or simulated. The SPL drop-in competition is the main physical evidence for ad hoc teams, and it used a shared message packet.</p>
<p><b>Where classical methods win.</b> In a warehouse with a fixed fleet from one vendor, a known map and stable demand, "table first, solve second" is the right approach. The paradigms are for the three breaks of 1.6: a missing row, an uncertain table, a coupled one.</p>
<p><b>Not new paradigms.</b> The revised reading presents the six as complementary lenses: each builds on an established research direction, and its value for a robot team depends on matching assumptions (4.1).</p>
<p><b>Selection.</b> The six lenses follow from six reference-case assumptions we chose to list. 3.18 discloses the authors' interest in open teams; the derivation in 4.2 is meant to make the choice checkable, and a reader who names another commitment adds another paradigm.</p>
<p><b>A gap in our own model.</b> The need for a shared protocol emerged in Part 2 (2.3.11, 2.4.6), not from the first-principles derivation or the audit. It has been added to Part 3 as E6e, “teammates share no protocol”, rated thin, and placed in tier B of the gap list. That it was missed by eleven outside sources and by our own derivation is a reminder that the model's completeness is checked, not proved.</p>`,
   refs:[] },

 { eyebrow:"Part 4 · Synthesis", title:"Six ways to leave the table", fig:"p4six", tag:"summary",
   bullets:[`Each paradigm drops one commitment of <b>table first, solve second</b>`,`Each brings borrowed theory and a <b>specific failure</b> when transferred`,`The emptiest region is where Part 3's <b>tier-A gaps</b> meet`,`Next step for any of them: a <b>formal statement</b> whose guarantee survives coupling`],
   notesTitle:"The deck in one page",
   notes:`<p><b>Part 1</b> broke allocation into five questions and found a hidden default: build the utility table first, then solve.</p>
<p><b>Part 2</b> showed that the classical families differ mostly in how they decide (Q4): centralised optimisation, agreement through markets and consensus, self-organisation, learned policies and language-model planners. Agreement methods all assume a shared protocol; self-organisation is the one classical family that coordinates through the environment.</p>
<p><b>Part 3</b> derived a model of the problem from first principles (E1–E10), audited it against surveys, and rated each sub-axis. The thinnest regions were teams whose membership changes (E1a), information that costs time (E6d), and allocations that reshape the system (E4d).</p>
<p><b>Part 4</b> named six paradigms, one per classical commitment: rates instead of matchings, information as a cost, the individual robot's view, safety relative to the incumbent, designing the problem, and coordination without a shared protocol. Each comes with real theory, mostly from neighbouring fields, and each deep dive records what that theory assumes and where a robot team breaks it.</p>
<div class="key"><span class="lbl">What would move the field</span>For any paradigm, the useful contribution is a formal statement for robot teams, with heterogeneous capabilities and teammates that react, together with a guarantee that survives that coupling, and evidence on physical robots.</div>`,
   refs:[] },
];

const PARTS = [
 {id:"p1", label:"Part 1", title:"The problem, from first principles", slides:[
  { kind:"title", eyebrow:"Part 1 · First principles", title:"Multi-robot task allocation, from the problem up",
    sub:"Before comparing algorithms: what does any allocator have to know, and what does the field quietly assume it knows?", fig:"hero",
    notesTitle:"What this deck is for",
    notes:`<p>This deck reviews multi-robot task allocation (MRTA) by starting from the problem itself instead of from a catalogue of algorithms. The goal is to see which parts of the problem the field has worked hard on, which parts it has assumed away, and where a different framing might pay off.</p>
<p>It is built in four parts that follow the same thread:</p>
<ol><li><b>Part 1</b> breaks allocation into five questions any allocator must answer.</li>
<li><b>Part 2</b> maps the classic families of methods onto those five questions.</li>
<li><b>Part 3</b> walks through the questions one at a time and looks for gaps.</li>
<li><b>Part 4</b> looks at paradigms the field has underweighted.</li></ol>
<p>The figure is the canonical picture: robots on the left, tasks on the right, and allocation as a choice of edges between them. Most of what follows asks where the numbers on those edges come from.</p>`,
    refs:[] },

  { eyebrow:"Part 1 · First principles", title:"Every allocator answers five questions", fig:"five",
    bullets:[`<b>Q1 Tasks:</b> what work exists, and where does it come from?`,`<b>Q2 Capability:</b> who is able to do what?`,`<b>Q3 Utility:</b> what is a robot–task pairing worth, or cost?`,`<b>Q4 Mechanism:</b> who makes the decision, and by what rule?`,`<b>Q5 Dynamics:</b> what happens when the world changes?`],
    notesTitle:"The courier-station analogy",
    notes:`<p>Picture a parcel depot. There is a pile of parcels (tasks), a few couriers (robots), and a dispatcher who decides who delivers what. However clever the dispatcher's method, five questions cannot be avoided:</p>
<ol><li><b>What work exists?</b> Is the parcel list fixed in the morning, or do parcels keep arriving?</li>
<li><b>Who can do what?</b> One courier has an e-bike; another walks.</li>
<li><b>What is a pairing worth?</b> Distance, time, chance of success.</li>
<li><b>Who decides, and how?</b> The dispatcher assigns, couriers grab jobs, or everyone improvises.</li>
<li><b>What if things change?</b> Someone calls in sick, an urgent parcel arrives, a road closes.</li></ol>
<div class="key"><span class="lbl">Working claim</span>Every MRTA paper can be read as a particular set of assumptions about these five questions. Comparing papers by their assumptions is often more revealing than comparing them by their algorithms.</div>`,
    refs:[] },

  { eyebrow:"Part 1 · The standard map", title:"Gerkey & Matarić: three binary axes", fig:"cube",
    bullets:[`<b>ST / MT</b> (single- / multi-task <i>robots</i>): one task at a time, or several at once?`,`<b>SR / MR</b> (single- / multi-robot <i>tasks</i>): one robot per task, or a team?`,`<b>IA / TA</b> (instantaneous / time-extended <i>assignment</i>): decide for now, or plan a schedule?`,`One choice per axis, e.g. <span class="m">ST-SR-IA</span>: polynomial in its basic form`],
    notesTitle:"The taxonomy everyone cites",
    notes:`<p>Gerkey and Matarić (2004) gave the field its common vocabulary. Each MRTA problem is described by three yes/no choices, one per axis, and written as a three-part code such as <code>ST-SR-IA</code>.</p>
<table class="cmp"><thead><tr><th>Axis</th><th>Full name</th><th>The question it asks</th><th>Example</th></tr></thead><tbody>
<tr><td>ST / MT</td><td>single-task / multi-task <i>robots</i></td><td>Can one robot work on several tasks at the same moment?</td><td>ST: a tote carrier holds one tote. MT: a patrol robot that also streams video for mapping.</td></tr>
<tr><td>SR / MR</td><td>single-robot / multi-robot <i>tasks</i></td><td>Does a task need one robot, or several acting together?</td><td>SR: inspect one aisle. MR: two robots carry a long beam.</td></tr>
<tr><td>IA / TA</td><td>instantaneous / time-extended <i>assignment</i></td><td>Is only current information available (assign now), or enough to plan each robot's schedule ahead?</td><td>IA: give the free robots the open tasks. TA: give each robot an ordered list of pickups for the shift.</td></tr></tbody></table>
<p><b>Reading a code.</b> <code>ST-MR-TA</code> means: each robot does one task at a time, some tasks need a team, and the answer is a schedule over time. In five-question terms, the first two axes are about what robots can do and what tasks require (Q2, Q3); the third is about time and change (Q5).</p>
<p>From here on, hovering over any of these codes (or over Q1–Q5) shows its full meaning; click to keep it open.</p>
<p>The simplest corner, <code>ST-SR-IA</code>, is the optimal assignment problem, which the Hungarian method solves in polynomial time. In Gerkey and Matarić's formulations, every other class is shown to be NP-hard; other encodings or special structure can behave differently (1.2). Multi-robot tasks turn into coalition formation (a set-partitioning problem), and time-extended assignment turns into scheduling.</p>
<p>The paper also analysed existing architectures of the time (for example ALLIANCE and the auction-based MURDOCH) as instances of these problems, which is why it remains the common reference point.</p>`,
    refs:[ref("Gerkey & Matarić, IJRR 2004","A formal analysis and taxonomy of task allocation in multi-robot systems",{Scholar:sch("A formal analysis and taxonomy of task allocation in multi-robot systems Gerkey Mataric")}),
          ref("Kuhn, Naval Research Logistics Quarterly 1955","The Hungarian method for the assignment problem",{Scholar:sch("The Hungarian method for the assignment problem Kuhn 1955")})] },

  { eyebrow:"Part 1 · The standard map", title:"iTax adds a fourth axis: interdependence", fig:"itax",
    bullets:[`Gerkey & Matarić assume, and say so, that a pairing's value <b>stands alone</b>`,`Korsah et al. (2013) grade how much it <b>depends on other choices</b>`,`<span class="m">ND → ID → XD → CD</span>: the utility table gets harder to even write down`],
    notesTitle:"When a pairing's value depends on other pairings",
    notes:`<p>Korsah, Stentz and Dias (2013) noticed that the original taxonomy treats the value of a robot–task pairing as independent of everything else. Their iTax makes the degree of interdependence the primary level and keeps Gerkey and Matarić's three axes as an optional second level, written for example <code>XD[ST-MR-TA]</code>. The levels are:</p>
<ul><li><b>ND, no dependencies:</b> each pairing's utility can be computed on its own. This is the setting of the original taxonomy.</li>
<li><b>ID, in-schedule dependencies:</b> a pairing's utility depends on the other tasks the same robot is doing, for example travel distance depends on the route.</li>
<li><b>XD, cross-schedule dependencies:</b> it depends on other robots' schedules too, for example "open the door before the cart goes through".</li>
<li><b>CD, complex dependencies:</b> it also depends on how the tasks are decomposed in the first place, so the task list itself is part of the decision.</li></ul>
<p>In terms of the five questions, iTax is a statement about <b>Q3</b>: how hard it is to write the utility down before allocating. At CD, even <b>Q1</b> (what the tasks are) becomes part of the decision.</p>
<p><b>The figure</b> is redrawn after the iTax illustration in Korsah et al. (2013). In ND each robot links straight to its tasks. In ID each robot's tasks form a route, so a task's cost depends on its neighbours in that route. In XD a constraint ("before") links tasks in different robots' routes. In CD two different decompositions of the same job, A and B, compete, so which subtasks exist is itself part of the choice.</p>`,
    refs:[ref("Korsah, Stentz & Dias, IJRR 2013","A comprehensive taxonomy for multi-robot task allocation",{Scholar:sch("A comprehensive taxonomy for multi-robot task allocation Korsah Stentz Dias")})] },

  { eyebrow:"Part 1 · The hidden assumption", title:"The table as a reference case", fig:"pipeline",
    bullets:[`Reference case: a utility table <span class="m">U(robot, task)</span> is available <b>before</b> allocation`,`Q1–Q3 become <b>inputs</b>; Q4 is where the solver works`,`Many methods <b>relax</b> this: stochastic, coupled, online, learned (2.7)`],
    notesTitle:"The assumption that shapes everything",
    notes:`<p>Put the taxonomies side by side and a default workflow appears underneath all of them: <b>first obtain a utility table U(robot, task), then run combinatorial optimisation over it.</b></p>
<p>In five-question terms, Q1 to Q3 (what the tasks are, who can do them, what each pairing is worth) are treated as already known, or at least directly computable from a model. Most algorithmic work concentrates on Q4: solving the problem efficiently, with guarantees, and often in a distributed way. Q5 is mostly handled by re-allocating when something changes, which means running Q4 again on an updated table.</p>
<div class="key"><span class="lbl">Key takeaway</span>This is a useful reference case, not a definition of classical MRTA. Stochastic, coupled, dynamic and hybrid methods relax it in many ways (2.7). The useful question for a given setting is which part of the table is unavailable, uncertain or changed by the allocation itself, and whether an existing method already handles that.</div>
<p>To see one table built from scratch and solved, click <b>worked example</b> under the table in the figure. It opens a side page; its Back button returns here.</p>`,
    refs:[] },

  { id:"example", hidden:true, eyebrow:"Part 1 · Side page · Worked example", title:"A worked example: three robots, three jobs", fig:"example",
    bullets:[`Warehouse; cost = <b>seconds to finish</b> the task`,`Each cell = <b>map distance ÷ rated speed + nominal handling time</b>`,`No arm → <span class="m">∞</span>: capability enters as feasibility`,`Hungarian picks R1→T1, R2→T3, R3→T2 (85 s)`,`All of it is computed <b>before any robot moves</b>`],
    notesTitle:"Building the table, then solving it",
    notes:`<p>A small warehouse makes the pipeline concrete. There are three robots and three jobs:</p>
<ul><li><b>R1</b> and <b>R2</b> are mobile bases rated at 1 m/s, with no arm. R1 is at the dock, R2 at aisle 5.</li>
<li><b>R3</b> is a mobile manipulator rated at 0.5 m/s, parked near the shelves.</li>
<li><b>T1</b>: carry a tote from aisle 3 to the dock. <b>T2</b>: pick a part from shelf B, which needs an arm. <b>T3</b>: inspect aisle 7.</li></ul>
<p><b>Step 1, build the table.</b> Each cell is an estimated completion time. For R1→T1: 30 m to aisle 3 at 1 m/s is 30 s, plus 10 s nominal loading time, so 40 s. R1 and R2 have no arm, so their T2 cells are ∞ (infeasible). Repeating this for every pair gives the 3×3 table on the slide.</p>
<p><b>Step 2, solve it.</b> R3 is the only robot that can do T2, so it gets T2 (25 s). R1 and R2 split T1 and T3: R1→T1 plus R2→T3 costs 40 + 20 = 60 s; the swap costs 70 + 30 = 100 s. The Hungarian method returns the first option, 85 s in total. With a makespan objective (minimise the slowest robot) the answer is the same here, finishing at 40 s.</p>
<p><b>Where each input came from.</b> The columns came from the order system (Q1). The ∞ entries came from a spec sheet (Q2). The numbers came from the map, the rated speeds and nominal handling times (Q3). All of it existed before a single robot moved, and the solver (Q4) never questions any of it.</p>
<div class="key"><span class="lbl">What the table quietly assumes</span>
<ul style="margin:6px 0 0">
<li>Rated speed is real speed: no congestion, no low battery, no person in the aisle.</li>
<li>Handling time is the nominal 10 s, every time.</li>
<li>Capability is what the spec sheet says, and nothing changes it.</li>
<li>Each cell stands alone: R1 driving through aisle 3 does not slow R2 down (the ND case in iTax).</li>
<li>The team is fixed. If a fourth robot rolls in a minute later, nobody knows what its row should say.</li></ul></div>
<p>Each of these assumptions is reasonable in a tidy warehouse. The question for the rest of the deck is what happens when they stop holding.</p>`,
    refs:[ref("Kuhn, Naval Research Logistics Quarterly 1955","The Hungarian method for the assignment problem",{Scholar:sch("The Hungarian method for the assignment problem Kuhn 1955")})] },

  { eyebrow:"Part 1 · Where this leads", title:"Where the reference table falls short", fig:"breaks",
    bullets:[`<b>Missing:</b> a newcomer's row may be empty, or already known`,`<b>Uncertain:</b> values can only be estimated, and estimating costs time`,`<b>Coupled:</b> the allocation itself changes the values`,`Which applies must be <b>stated</b>, not assumed (see notes)`],
    notesTitle:"Why the hidden assumption matters for us",
    notes:`<p>The pipeline from the previous slide breaks in three distinct ways:</p>
<ul><li><b>Missing.</b> A newcomer joins a team that is already working. Its row of the table is empty, and nobody, including the newcomer, knows how to fill it yet.</li>
<li><b>Uncertain.</b> Capabilities and costs can only be estimated, for example from observation. Getting better estimates takes time during which the team is still working, so information has a price.</li>
<li><b>Coupled.</b> What one robot does changes the value of what the others could do. If one station is overloaded, helping there is worth more than doing the task you are nominally best at.</li></ul>
<p>Ad-hoc teamwork, and in particular the question of what a newcomer should do when it joins mid-run, sits in all three at once. That is the link to the "watch, then help" direction: a newcomer faces a table that is not yet filled in, and has to fill it while the team keeps going.</p>
<p><b>Next, Part 2:</b> how each classic family of methods handles the five questions, and why they make the assumptions they do.</p>`,
    refs:[] },
 ]},

 {id:"p2", label:"Part 2", title:"The classic families", slides:[
  { eyebrow:"Part 2 · Overview", title:"Five families, placed on two axes", fig:"map",
    bullets:[`<b>Horizontal:</b> does one planner decide, or does each robot?`,`<b>Vertical:</b> is utility written by hand, or learned?`,`Older families sit at the bottom, newer ones at the top`,`They differ most in <b>Q4</b>, much less in Q1–Q3`],
    notesTitle:"A map before the tour",
    notes:`<p>The classic families can be roughly placed on two axes.</p>
<ul><li><b>Who decides (horizontal):</b> a single planner with the whole picture, or each robot deciding from local information.</li>
<li><b>Where utility comes from (vertical):</b> written down from a model (distances, travel times, success probabilities), or learned from data or prior knowledge.</li></ul>
<p>Centralised optimisation and markets both use hand-modelled utilities; they differ in who computes the decision. Self-organising methods (response thresholds, ALLIANCE, swarm rate design) sit off to the side because they do not use an explicit utility at all. Learned policies and LLM planners moved upward: utility is implicit in a reward function or in a language model's commonsense.</p>
<p>The positions are approximate, and many systems are hybrids. The point of the map is the observation at the bottom of the slide: the families differ most in how they decide (Q4), and much less in how they answer Q1 to Q3.</p>`,
    refs:[] },

  { eyebrow:"Part 2 · Family 1", title:"Centralized optimization", intro:{year:'1950s →',by:'operations research',cell:'ST-SR-IA → ST-MR-TA',problem:'find a provably best plan when the whole world is known',note:'These formulations come from operations research in the 1950s, where the problem was assigning workers, trucks or machines in a factory or depot. The world was known and the question was purely how to choose well. Robotics adopted them for the same situation: a known map, known robots, a known task list, and a need for optimal or bounded-suboptimal plans.'},  fig:"hungarian",
    bullets:[`One planner sees everything and solves for the best plan`,`<b>Hungarian</b> for ST-SR-IA; <b>MILP / VRP</b> formulations for richer variants`,`<b>Assumes:</b> full information in one place; utility computed from models`,`<b>Pays with:</b> scaling, a single point of failure, and brittleness to model error`],
    notesTitle:"The optimiser's view",
    notes:`<p>This is the most direct reading of "table first, solve second". All information is gathered in one place, a utility or cost is computed for each pairing from a model, and a solver returns the best allocation.</p>
<ul><li>For <code>ST-SR-IA</code>, the Hungarian method gives the exact optimum in polynomial time. The figure shows a 3×3 instance whose optimum total cost is 5.</li>
<li>For multi-task robots, multi-robot tasks or schedules, the problem is usually written as a mixed-integer linear program, or as a vehicle routing / multiple travelling salesman variant with time windows and precedence constraints. Nunes et al. (2017) catalogue the temporal and ordering-constraint variants.</li></ul>
<p><b>Five-question reading.</b> Q1: a known task list. Q2: a known model of each robot. Q3: computed from that model. Q4: an exact or approximate solver. Q5: re-solve when something changes.</p>
<p><b>Strengths:</b> optimality or bounded suboptimality, and clear problem statements. <b>Weaknesses:</b> computation grows quickly, everything depends on communication with the planner, and the result is only as good as the model behind the table.</p>`,
    refs:[ref("Kuhn, Naval Research Logistics Quarterly 1955","The Hungarian method for the assignment problem",{Scholar:sch("The Hungarian method for the assignment problem Kuhn 1955")}),
          ref("Nunes, Manner, Mitiche & Gini, Robotics and Autonomous Systems 2017","A taxonomy for task allocation problems with temporal and ordering constraints",{Scholar:sch("A taxonomy for task allocation problems with temporal and ordering constraints Nunes Gini")})] },

  { child:true, eyebrow:"Part 2 · Family 1 · Deep dive", title:"Linear assignment: the one easy corner", intro:{year:'1955',by:'Kuhn',cell:'ST-SR-IA',problem:'assign n workers to n jobs at minimum total cost',note:'Kuhn (1955) built on earlier results by König and Egerváry, hence the name "Hungarian". The original problem was personnel assignment: n workers, n jobs, a known cost for each pairing. In robotics it solves one-shot, one-to-one assignment: which robot goes to which goal, target or formation slot.'},  fig:"lap",
    math:[["min","Σ<sub>i</sub> Σ<sub>j</sub> c<sub>ij</sub> x<sub>ij</sub>",""],["s.t.","Σ<sub>j</sub> x<sub>ij</sub> = 1","each robot: one task"],["","Σ<sub>i</sub> x<sub>ij</sub> = 1","each task: one robot"],["","x<sub>ij</sub> ∈ {0, 1}",""]],
    bullets:[`Cell <b>ST-SR-IA</b>, costs independent (ND)`,`An integer program that <b>behaves like an LP</b>; Hungarian is exact in <span class="m">O(n³)</span>`,`Breaks once a robot takes two tasks or a task needs two robots`],
    notesTitle:"Why this one problem is easy",
    notes:`<p><b>Variables.</b> <code>x_ij = 1</code> if robot <i>i</i> does task <i>j</i>. <b>Objective.</b> Total cost from the utility table. <b>Constraints.</b> Every robot takes exactly one task and every task gets exactly one robot. This is the warehouse example from Part 1.</p>
<p><b>Why it is easy.</b> Integer programs are usually hard, but this constraint matrix is <i>totally unimodular</i>: every corner of the LP feasible region already has 0/1 coordinates. Drop the integrality constraint, solve the LP, and the answer comes out integral. The Hungarian method exploits this structure through the LP dual (one "potential" per robot and per task) and finds the exact optimum in <code>O(n³)</code>. Thousands of robots and tasks are routine.</p>
<p><b>Useful variants that stay easy.</b></p>
<ul><li>Unequal numbers of robots and tasks: pad with zero-cost dummy rows or columns.</li>
<li>Maximising utility instead of minimising cost: negate the table.</li>
<li><b>Bottleneck assignment</b>, which minimises the single worst cost <code>max c_ij</code> instead of the sum. This is the makespan version and is also polynomial.</li></ul>
<p><b>A bridge to Family 2.</b> Bertsekas's <i>auction algorithm</i> solves the same problem by reading the dual variables as prices: tasks raise their price when contested and robots bid for the task with the best value minus price. Robot auctions descend from this view.</p>
<p><b>Works when:</b> one robot per task, a one-shot decision, and costs that are known and independent. Because it is so fast, re-solving on every change is a practical way to handle Q5.</p>`,
    refs:[ref("Kuhn, Naval Research Logistics Quarterly 1955","The Hungarian method for the assignment problem",{Scholar:sch("The Hungarian method for the assignment problem Kuhn 1955")}),
          ref("Bertsekas, Annals of Operations Research 1988","The auction algorithm: A distributed relaxation method for the assignment problem",{Scholar:sch("The auction algorithm: A distributed relaxation method for the assignment problem")}),
          ref("Burkard, Dell'Amico & Martello, SIAM 2009","Assignment Problems (book)",{Scholar:sch("Burkard Dell'Amico Martello Assignment Problems SIAM")})] },

  { child:true, eyebrow:"Part 2 · Family 1 · Deep dive", title:"Add a budget: the generalized assignment problem", intro:{year:'1975',by:'Ross & Soland',cell:'MT-SR-IA (or TA with order ignored)',problem:'assign jobs to agents that each have limited capacity',note:'Ross and Soland (1975) studied assigning jobs to agents whose total load must fit a capacity, a common structure in facility location and machine loading. In robotics it handles robots that take several tasks within a time, battery or payload budget, when the order of those tasks does not matter much.'},  fig:"gap",
    math:[["min","Σ<sub>i</sub> Σ<sub>j</sub> c<sub>ij</sub> x<sub>ij</sub>",""],["s.t.","Σ<sub>i</sub> x<sub>ij</sub> = 1","each task: one robot"],["","Σ<sub>j</sub> w<sub>ij</sub> x<sub>ij</sub> ≤ b<sub>i</sub>","robot i's budget"],["","x<sub>ij</sub> ∈ {0, 1}",""]],
    bullets:[`A robot may take <b>several tasks</b>, within a budget`,`One changed constraint makes it <b>NP-hard</b> (it contains knapsack)`,`Solved by MILP branch-and-bound, Lagrangian relaxation, or greedy`],
    notesTitle:"One constraint changes the complexity class",
    notes:`<p>Replace "each robot takes exactly one task" with "each robot's tasks must fit its budget". Here <code>w_ij</code> is how much of robot <i>i</i>'s resource task <i>j</i> uses (time, battery, payload) and <code>b_i</code> is the budget.</p>
<p><b>Where it sits.</b> It fits MT-SR-IA when the budget is a resource shared by tasks served together, such as payload. It is also the most common <i>order-free approximation</i> of time-extended allocation: give each robot a time or battery budget and ignore the order in which it does its tasks.</p>
<p><b>Why it is hard.</b> The budget row is a knapsack constraint, so the matrix is no longer totally unimodular. LP corners can be fractional (half a task here, half there), and rounding them is not trivially correct. The problem is NP-hard.</p>
<p><b>How people solve it.</b></p>
<ul><li><b>Branch-and-bound MILP</b> (Gurobi, CPLEX, OR-Tools). With good bounds, hundreds of tasks are often fine.</li>
<li><b>Lagrangian relaxation</b>: move the budget rows into the objective with multipliers. Each subproblem becomes easy again, and the multipliers give a lower bound.</li>
<li><b>Greedy</b>: assign the cheapest feasible pair repeatedly. Fast, no guarantee in general.</li></ul>
<p><b>Still missing:</b> order and travel between tasks. Once the cost of a task depends on what the robot did just before it (ID in iTax), the problem becomes routing, on the next slide.</p>`,
    refs:[ref("Ross & Soland, Mathematical Programming 1975","A branch and bound algorithm for the generalized assignment problem",{Scholar:sch("A branch and bound algorithm for the generalized assignment problem Ross Soland")})] },

  { child:true, eyebrow:"Part 2 · Family 1 · Deep dive", title:"Add time: routing and scheduling MILPs", intro:{year:'1959',by:'Dantzig & Ramser',cell:'ST-SR-TA (+XD)',problem:'route a delivery fleet; later with time windows',note:'Dantzig and Ramser (1959) posed the "truck dispatching problem": route a fleet of delivery trucks from a depot to customers. Time windows were added in the 1980s, with Solomon (1987) providing the standard benchmarks. Robotics uses these formulations when order and timing matter: delivery, inspection rounds, and manufacturing cells with precedence and shared-space constraints (for example Tercio, 2013).'},  fig:"gantt",
    math:[["min","C<sub>max</sub>","makespan"],["s.t.","Σ<sub>k</sub> Σ<sub>i</sub> x<sub>ijk</sub> = 1","each task visited once"],["","s<sub>j</sub> ≥ s<sub>i</sub> + d<sub>i</sub> + t<sub>ij</sub> − M(1 − x<sub>ijk</sub>)","order ⇒ timing"],["","a<sub>j</sub> ≤ s<sub>j</sub> ≤ b<sub>j</sub>","time window"],["","s<sub>j</sub> ≥ s<sub>i</sub> + d<sub>i</sub>","precedence"],["","C<sub>max</sub> ≥ s<sub>j</sub> + d<sub>j</sub>",""]],
    bullets:[`Cell <b>ST-SR-TA</b>, often with cross-robot constraints (XD)`,`Decides <b>who, in what order, and when</b>`,`Big-M links order to time and weakens the LP bound: exact solving stays at tens of tasks`],
    notesTitle:"Who, in what order, and when",
    notes:`<p>Once order matters, the decision is a <b>route plus a schedule</b> for every robot. This is multi-vehicle routing with time windows (VRPTW, or mTSP without windows).</p>
<p><b>Variables.</b> <code>x_ijk = 1</code> if robot <i>k</i> goes from task <i>i</i> straight to task <i>j</i>. <code>s_j</code> is the start time of task <i>j</i>, <code>d_j</code> its duration, <code>t_ij</code> the travel time between tasks, and <code>C_max</code> the makespan. Flow-conservation constraints, not shown on the slide, make each robot's chosen edges form one route.</p>
<p><b>Reading the constraints.</b></p>
<ul><li>The <b>big-M</b> line says: if robot <i>k</i> goes from <i>i</i> to <i>j</i>, then <i>j</i> cannot start before <i>i</i> finishes and the robot drives over. If not, a large <code>M</code> switches the constraint off.</li>
<li><b>Time windows</b> bound when a task may start, such as a dock available between 30 s and 50 s.</li>
<li><b>Precedence</b> across robots (T2 must finish before T5 starts) is what iTax calls XD. In the figure R2 has to wait for it.</li></ul>
<p><b>Why it is slow.</b> Big-M constraints give very loose LP relaxations, so branch-and-bound explores a large tree. Exact solutions are practical for tens of tasks. Beyond that, people use insertion heuristics, large-neighbourhood search, or split the problem. Tercio (Gombolay et al., 2013) uses a MILP only for the robot-to-task assignment and a fast sequencer for ordering and timing, and iterates between the two.</p>
<p><b>Objective matters.</b> Total travel, makespan and weighted completion time give different plans from the same constraints. Nunes et al. (2017) catalogue the temporal-constraint variants.</p>`,
    refs:[ref("Dantzig & Ramser, Management Science 1959","The truck dispatching problem",{Scholar:sch("Dantzig Ramser The truck dispatching problem")}),
          ref("Solomon, Operations Research 1987","Algorithms for the vehicle routing and scheduling problems with time window constraints",{Scholar:sch("Algorithms for the vehicle routing and scheduling problems with time window constraints Solomon")}),
          ref("Gombolay, Wilcox & Shah, RSS 2013","Fast scheduling of multi-robot teams with temporospatial constraints",{Scholar:sch("Fast scheduling of multi-robot teams with temporospatial constraints Gombolay")}),
          ref("Toth & Vigo (eds.), SIAM 2014","Vehicle Routing: Problems, Methods, and Applications (book, 2nd ed.)",{Scholar:sch("Toth Vigo Vehicle Routing Problems Methods and Applications")}),
          ref("Nunes, Manner, Mitiche & Gini, Robotics and Autonomous Systems 2017","A taxonomy for task allocation problems with temporal and ordering constraints",{Scholar:sch("A taxonomy for task allocation problems with temporal and ordering constraints Nunes Gini")})] },

  { child:true, eyebrow:"Part 2 · Family 1 · Deep dive", title:"Add teams: coalition formation", intro:{year:'1998',by:'Shehory & Kraus',cell:'ST-MR-IA and MT-MR-IA',problem:'tasks that no single agent can do alone',note:'Shehory and Kraus (1998) addressed multi-agent systems in which some tasks need the combined capabilities of several agents. Vig and Adams (2006) carried this to robots, adding constraints from sensing and communication range. It solves allocation when a task needs a team: lifting, escorting, coverage.'},  fig:"coalition",
    math:[["min","Σ<sub>C</sub> Σ<sub>j</sub> c(C, j) y<sub>Cj</sub>",""],["s.t.","Σ<sub>C ∋ i</sub> Σ<sub>j</sub> y<sub>Cj</sub> ≤ 1","each robot in ≤ 1 team"],["","Σ<sub>C</sub> y<sub>Cj</sub> = 1","each task gets a team"],["","y<sub>Cj</sub> ∈ {0, 1}",""]],
    bullets:[`Cell <b>ST-MR-IA</b>: some tasks need several robots`,`A team's value is <b>not the sum of its members</b>`,`Up to 2ⁿ columns: set partitioning; in practice cap team size or generate columns`],
    notesTitle:"When value belongs to the team, not the robot",
    notes:`<p>Some tasks need several robots at once: lifting something heavy, escorting, covering an area. The natural variable is <code>y_Cj = 1</code> if coalition <i>C</i> (a subset of robots) does task <i>j</i>, with cost <code>c(C, j)</code>. If <i>C</i> lacks a required capability, the cost is infinite. This is a <b>set-partitioning</b> problem.</p>
<p><b>Why it is hard.</b> With <i>n</i> robots there are <code>2ⁿ − 1</code> possible coalitions per task: 31 for 5 robots, about a million for 20. Enumerating every column stops being possible early, and the problem is NP-hard.</p>
<p><b>How people solve it.</b></p>
<ul><li><b>Cap coalition size</b> at <i>k</i>, which bounds the number of columns. Shehory and Kraus (1998) give a greedy algorithm with a provable bound under this cap.</li>
<li><b>Column generation</b>: start with a few coalitions and let the LP dual suggest which new ones could help.</li>
<li>Vig and Adams (2006) adapted coalition formation to robots, adding locality and communication constraints.</li></ul>
<p><b>Why it matters for the bigger picture.</b> This is the first formulation where utility cannot be written as a per-(robot, task) table. The value of a robot depends on who else is on its team. It is a mild version of the "coupled" case from Part 1.</p>`,
    refs:[ref("Shehory & Kraus, Artificial Intelligence 1998","Methods for task allocation via agent coalition formation",{Scholar:sch("Methods for task allocation via agent coalition formation Shehory Kraus")}),
          ref("Vig & Adams, IEEE Trans. Robotics 2006","Multi-robot coalition formation",{Scholar:sch("Vig Adams Multi-robot coalition formation IEEE Transactions on Robotics")})] },

  { kind:"table", child:true, eyebrow:"Part 2 · Family 1 · Deep dive", title:"Four formulations side by side",
    table:{ head:["Problem","Introduced","G&M cell","Variables","What makes it hard","Exact solver","Exact size (rough)"],
      rows:[["Linear assignment","Kuhn 1955","ST-SR-IA","x<sub>ij</sub>","nothing: LP is integral","Hungarian, auction","thousands"],
            ["Generalized assignment","Ross & Soland 1975","MT-SR-IA; TA without order","x<sub>ij</sub>","budget rows (knapsack)","MILP, Lagrangian","hundreds of tasks"],
            ["Routing / scheduling","Dantzig & Ramser 1959","ST-SR-TA (+XD)","x<sub>ijk</sub>, s<sub>j</sub>, C<sub>max</sub>","big-M order–time link","MILP, constraint prog.","tens of tasks"],
            ["Coalition formation","Shehory & Kraus 1998","ST-MR-IA","y<sub>Cj</sub>","2ⁿ coalitions","set partitioning, column gen.","~10–20 robots"]],
      hlCol:4, caption:"Sizes are rough orders of magnitude for exact solutions and depend heavily on problem structure and solver." },
    notesTitle:"Choosing a formulation",
    notes:`<p>A quick guide to which formulation fits:</p>
<ul><li><b>One robot per task, decide now:</b> linear assignment. It is fast enough to re-solve whenever anything changes.</li>
<li><b>Robots take several tasks, order does not matter much:</b> generalized assignment.</li>
<li><b>Order, timing, windows or precedence matter:</b> a routing or scheduling MILP for small instances, heuristics or decomposition (for example Tercio) for larger ones.</li>
<li><b>Tasks need teams:</b> coalition formation, with a cap on team size.</li></ul>
<p>Each step down the table adds one feature of the real problem (budgets, time, teams), and each one costs a large drop in the size that can be solved exactly.</p>
<div class="key"><span class="lbl">The common thread</span>All four take the cost <code>c</code> as an input. They differ in how much structure they allow in Q4, not in how they answer Q3. The market methods in Family 2 can be read as distributed, approximate solvers for these same objectives, starting from Bertsekas's price interpretation of linear assignment.</div>`,
    refs:[] },

  { eyebrow:"Part 2 · Family 2", title:"Distributed agreement", intro:{year:'1980 → 2023',by:'Smith; Choi, Brunet & How; Arslan, Marden & Shamma; Chopra et al.',cell:'ST-SR-IA → ST-SR-TA, decentralised',problem:'reach one consistent allocation with no central solver',note:'The Contract Net Protocol (1980) introduced announce–bid–award for distributed problem solving, and robot auctions (MURDOCH 2002, TraderBots) brought it to physical teams. In parallel, control theory developed consensus (agreement by local averaging), distributed optimisation (exact solvers that run across a network) and game-theoretic design (utilities whose equilibria are good allocations). CBBA (2009) joined auctions and consensus. All of these answer one question: how do many decision makers end up with one consistent allocation without a central planner?'},  fig:"auction",
    bullets:[`One question: how do many deciders reach <b>one consistent allocation</b>?`,`Four answers: <b>auctions</b> (agree on bids), <b>consensus</b> (agree on state or plans), <b>distributed optimisation</b> (agree on an exact optimum), <b>games</b> (agree on an equilibrium)`,`<b>Assumes:</b> every robot can price or evaluate tasks for itself`,`Nearly all assume robots run the <b>same pre-agreed protocol</b>`],
    notesTitle:"Distributing the decision, not removing the table",
    notes:`<p>This family keeps the logic of the classical table but distributes the decision. Each robot computes the part of the table that concerns itself (its own cost, marginal cost or utility), and some agreement process turns these local views into one consistent allocation. The family is organised by <b>what the robots agree on</b>:</p>
<ul><li><b>Auctions</b> (2.3.1–2.3.3): agree on winning bids. Contract Net (Smith, 1980), MURDOCH (Gerkey &amp; Matarić, 2002), TraderBots and the survey by Dias et al. (2006), sequential single-item and combinatorial auctions.</li>
<li><b>Consensus</b> (2.3.4–2.3.5): agree on a shared picture of the world, or on the plan itself. Consensus theory (Olfati-Saber et al., 2007), implicit coordination and its failure (Alighanbari &amp; How, 2005), and CBBA (Choi, Brunet &amp; How, 2009), which agrees on winning bids through consensus.</li>
<li><b>Distributed optimisation</b> (2.3.7): agree on the exact optimum of the assignment problem, using distributed auction, simplex, Hungarian or ADMM methods.</li>
<li><b>Games</b> (2.3.8): agree on an equilibrium, by designing each robot's utility so that selfish improvement improves the team.</li>
<li><b>When the assumptions fail</b> (2.3.9–2.3.10): resilient consensus tolerates faulty or malicious robots; agreement through language removes the need for a shared protocol.</li></ul>
<p><b>Five-question reading.</b> Q1: tasks announced or shared. Q2 and Q3: each robot knows itself well enough to price or score tasks. Q4: an agreement process. Q5: re-run the agreement.</p>
<p><b>Strengths:</b> no single point of failure, scales with local communication, some methods are exactly optimal. <b>Weaknesses:</b> robots must be able to evaluate themselves, coupled tasks are hard to score one at a time, and almost every method assumes all robots run the same protocol honestly.</p>`,
    refs:[ref("Smith, IEEE Trans. Computers 1980","The Contract Net Protocol: High-level communication and control in a distributed problem solver",{Scholar:sch("The contract net protocol high-level communication and control in a distributed problem solver")}),
          ref("Gerkey & Matarić, IEEE Trans. Robotics and Automation 2002","Sold!: Auction methods for multirobot coordination",{Scholar:sch("Sold!: Auction methods for multirobot coordination")}),
          ref("Dias, Zlot, Kalra & Stentz, Proceedings of the IEEE 2006","Market-based multirobot coordination: A survey and analysis",{Scholar:sch("Market-based multirobot coordination: A survey and analysis")}),
          ref("Olfati-Saber, Fax & Murray, Proceedings of the IEEE 2007","Consensus and cooperation in networked multi-agent systems",{Scholar:sch("Consensus and cooperation in networked multi-agent systems")}),
          ref("Choi, Brunet & How, IEEE Trans. Robotics 2009","Consensus-based decentralized auctions for robust task allocation",{Scholar:sch("Consensus-based decentralized auctions for robust task allocation")})] },

  { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Single-item auctions: sell each task as it arrives", fig:"online",
    intro:{year:'1980 / 2002',by:'Smith; Gerkey & Matarić',cell:'ST-SR-IA, online',problem:'allocate tasks as they appear, with no central controller',note:'The Contract Net Protocol (Smith, 1980) came from distributed problem solving: a node with work to hand out announces it, others bid, and the announcer awards a contract. No node needs a global view. MURDOCH (Gerkey & Matarić, 2002) used the same announce–bid–award loop on physical robots, with tasks arriving over time and each one auctioned to the currently available robots.'},
    math:[["bid","b<sub>ij</sub> = c<sub>ij</sub>","robot i's own cost for task j"],["award","i* = argmin<sub>i free</sub> b<sub>ij</sub>","cheapest available robot"],["then","task j is never revisited","no reassignment"]],
    bullets:[`One task, one round: <b>announce → bid → award</b>`,`Each robot needs only <b>its own cost</b>; the auctioneer needs only the bids`,`It is an <b>online greedy</b> algorithm: fast, robust, myopic`],
    notesTitle:"The simplest market",
    notes:`<p>When a task appears, it is announced. Every robot that is free computes its own cost, for example travel time to the task, and sends it as a bid. The lowest bid wins. Then the next task is handled the same way.</p>
<p><b>What each party needs to know.</b> A robot needs only its own state and the task description. The auctioneer needs only the bids. Communication is one message per robot per task. This is why auctions scaled to real robot teams early.</p>
<p><b>What it actually computes.</b> Gerkey and Matarić (2004) point out that this is an online greedy assignment: each decision is optimal for that moment and is never reconsidered. In the figure, giving T1 to R2 is cheapest when T1 arrives, but it leaves R2 busy when T2 appears.</p>
<p><b>Five-question reading.</b> Q1: tasks arrive one by one. Q2 and Q3: each robot prices itself. Q4: argmin over bids. Q5: handled naturally for new tasks; reallocating old ones would need re-auctioning, which Gerkey and Matarić (2004) analyse MURDOCH as not doing. Their analysis shows that this online greedy rule is 3-competitive, the best possible for online assignment without a task model or reassignment.</p>`,
    refs:[ref("Smith, IEEE Trans. Computers 1980","The Contract Net Protocol: High-level communication and control in a distributed problem solver",{Scholar:sch("The contract net protocol high-level communication and control in a distributed problem solver")}),
          ref("Gerkey & Matarić, IEEE Trans. Robotics and Automation 2002","Sold!: Auction methods for multirobot coordination",{Scholar:sch("Sold!: Auction methods for multirobot coordination")})] },

  { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Sequential single-item auctions: routing on a budget", fig:"ssi",
    intro:{year:'2005',by:'Lagoudakis et al.',cell:'ST-SR-TA',problem:'multi-robot routing with cheap auctions that still carry guarantees',note:'Lagoudakis and colleagues (RSS 2005) asked whether simple auctions could solve multi-robot routing, which is a time-extended problem, with provable quality. Sequential single-item (SSI) auctions offer all unassigned tasks each round, robots bid the marginal cost of adding a task to their current route, and only the single best bid is awarded. Different bidding rules target different team objectives (total distance, makespan, average latency).'},
    math:[["bid","b<sub>ij</sub> = PC(R<sub>i</sub> ∪ {j}) − PC(R<sub>i</sub>)","marginal route cost"],["round","(i*, j*) = argmin<sub>i, j open</sub> b<sub>ij</sub>","one award per round"],["repeat","m rounds for m tasks",""]],
    bullets:[`All open tasks are on offer; robots bid <b>marginal route cost</b>`,`Only the <b>single best</b> bid wins each round`,`Marginal-cost bids are <b>within 2× of optimal</b> total distance`],
    notesTitle:"Auctions that know about routes",
    notes:`<p>SSI keeps the single-item simplicity but adds look-ahead through the bid. A robot's bid for task <i>j</i> is how much its route cost <code>PC</code> would grow if it added <i>j</i> at the best position in its current route <code>R_i</code>. In the figure, R2 can slot the new task between two of its existing stops for +5, while R1 would have to drive far out for +16.</p>
<p><b>Why one award per round.</b> If every task were awarded in parallel, two awards could both look cheap but conflict once combined. Awarding one at a time and letting robots re-bid with updated routes keeps marginal costs honest. This makes SSI a distributed version of greedy insertion, a standard routing heuristic.</p>
<p><b>Guarantees.</b> Lagoudakis et al. (2005) prove worst-case ratios to optimal for six bidding rules under three team objectives. For the marginal-path-cost rule described here (BidSumPath), the ratios are:</p>
<ul><li><b>MiniSum</b> (total distance of all robots): at most <b>2×</b> optimal.</li>
<li><b>MiniMax</b> (longest single route, i.e. makespan): at most <b>2n×</b>, with <i>n</i> robots.</li>
<li><b>MiniAve</b> (average time until each target is visited): at most <b>2m×</b>, with <i>m</i> targets.</li></ul>
<p>So the same cheap auction is near-optimal for one objective and only loosely bounded for the others; the bidding rule should match the team objective. Koenig and colleagues later studied extensions and variants of SSI.</p>
<p><b>Five-question reading.</b> Q3 is now a <i>marginal</i> cost that depends on what the robot already holds (ID in iTax), which is a small but real step beyond a fixed table.</p>`,
    refs:[ref("Lagoudakis et al., RSS 2005","Auction-based multi-robot routing",{Proceedings:"https://roboticsproceedings.org/rss01/p45.html",Scholar:sch("Auction-based multi-robot routing Lagoudakis")}),
          ref("Koenig, Keskinocak & Tovey, AAAI 2010","Progress on agent coordination with cooperative auctions",{Scholar:sch("Progress on agent coordination with cooperative auctions Koenig")})] },

  { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Combinatorial auctions: bid on bundles", fig:"combo",
    intro:{year:'2003',by:'Berhault et al.',cell:'ST-SR-TA (ID)',problem:'capture synergy between tasks that are cheaper together',note:'Berhault and colleagues (IROS 2003) applied combinatorial auctions to multi-robot exploration, where visiting two nearby targets together is much cheaper than visiting them separately. Single-item auctions cannot express that synergy; letting robots bid on bundles can.'},
    math:[["max","Σ<sub>i</sub> Σ<sub>B</sub> v<sub>i</sub>(B) z<sub>iB</sub>",""],["s.t.","Σ<sub>i</sub> Σ<sub>B ∋ j</sub> z<sub>iB</sub> ≤ 1","each task sold once"],["","Σ<sub>B</sub> z<sub>iB</sub> ≤ 1","one bundle per robot"],["","z<sub>iB</sub> ∈ {0, 1}",""]],
    bullets:[`Robots bid on <b>sets of tasks</b>, so synergies are priced in`,`Choosing winners is <b>weighted set packing</b>: NP-hard`,`Practical versions limit which bundles may be bid on`],
    notesTitle:"Pricing synergy",
    notes:`<p>If two tasks are close together, doing both costs less than the sum of doing each alone. In the figure, R1 can do T1 and T2 together for 10, versus 7 + 7 = 14 separately. A single-item auction cannot see this; a combinatorial auction lets R1 bid on the bundle <code>{T1, T2}</code> directly.</p>
<p><b>The optimisation.</b> <code>z_iB = 1</code> if robot <i>i</i> wins bundle <i>B</i> with valuation <code>v_i(B)</code>. Each task can appear in at most one winning bundle and each robot wins at most one bundle. This "winner determination problem" is weighted set packing, which is NP-hard. It looks very much like coalition formation in 2.2.4, with bundles of tasks in place of teams of robots.</p>
<p><b>Two costs.</b> Robots must evaluate up to <code>2ᵐ − 1</code> bundles, and the auctioneer must solve an NP-hard problem. In practice, bundles are restricted to small sizes or to nearby tasks, and winner determination is solved approximately.</p>
<p><b>Takeaway.</b> Combinatorial auctions handle in-schedule dependencies (ID) correctly in principle, but they recentralise most of the hard computation in the auctioneer.</p>`,
    refs:[ref("Berhault et al., IROS 2003","Robot exploration with combinatorial auctions",{Scholar:sch("Robot exploration with combinatorial auctions Berhault")})] },

  { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"CBBA: bundles plus consensus, no auctioneer", fig:"cbba",
    intro:{year:'2009',by:'Choi, Brunet & How',cell:'ST-SR-TA',problem:'conflict-free allocation when robots hold inconsistent views and talk only to neighbours',note:'The consensus-based bundle algorithm was motivated by teams of UAVs whose members each see a different, partly outdated picture of the world and can only talk to nearby teammates. Earlier consensus approaches required agreement on the world state before planning; CBBA instead reaches agreement on the winning bids directly, which is cheaper and tolerates disagreement about the world.'},
    math:[["phase 1","j* = argmax<sub>j</sub> c<sub>ij</sub>[b<sub>i</sub>] · 𝟙(c<sub>ij</sub> > y<sub>ij</sub>)","best I can win"],["","c<sub>ij</sub>[b<sub>i</sub>] = S<sub>i</sub>(p<sub>i</sub> ⊕ j) − S<sub>i</sub>(p<sub>i</sub>)","marginal score"],["phase 2","exchange y, z with neighbours","agree on winners"],["","outbid on j ⇒ drop j and all later tasks",""]],
    bullets:[`Each robot <b>builds a bundle</b> greedily from its own marginal scores`,`Neighbours <b>agree on winning bids</b>, not on the world`,`Conflict-free; <b>≥ 50% of optimal</b> if gains diminish, views agree`],
    notesTitle:"How CBBA works",
    notes:`<p>CBBA alternates two phases until nothing changes.</p>
<p><b>Phase 1, bundle construction.</b> Robot <i>i</i> keeps a bundle <code>b_i</code> and a path <code>p_i</code>. It repeatedly adds the task whose marginal score <code>S_i(p_i ⊕ j) − S_i(p_i)</code> is highest among the tasks it could still win, meaning its score beats the best known bid <code>y_ij</code> for that task.</p>
<p><b>Phase 2, consensus.</b> Robots send their lists of winning bids <code>y</code> and winners <code>z</code> to their neighbours and apply a fixed table of rules to resolve conflicts, using timestamps to discard stale information. If a robot learns it has been outbid on a task, it releases that task <i>and every task it added after it</i>, because those later marginal scores were computed assuming the lost task was in the path.</p>
<p><b>Guarantees.</b> Choi et al. prove that CBBA converges to a conflict-free assignment within N<sub>min</sub>·D rounds, where N<sub>min</sub> = min(number of tasks, number of robots × bundle limit) and D is the network diameter (static network, synchronous rounds), and that conflict-freeness holds even when robots hold inconsistent views of the world. If scores have <i>diminishing marginal gain</i> (adding a task to a bundle never makes the remaining tasks more valuable) and robots share the same situational information, the result equals sequential greedy and is at least 50% of optimal. Lemma 4 shows that never raising a bid keeps conflict-free convergence for any scoring scheme; only the match with sequential greedy and the 50% bound need diminishing gain. In practice CBBA is usually much closer to optimal than the 50% bound.</p>
<p><b>Five-question reading.</b> Q2 and Q3: each robot still prices itself, now with marginal scores. Q4: distributed greedy plus consensus. The diminishing-gain condition is important: synergies like the bundle on 2.3.3 violate it.</p>`,
    refs:[ref("Choi, Brunet & How, IEEE Trans. Robotics 2009","Consensus-based decentralized auctions for robust task allocation",{Scholar:sch("Consensus-based decentralized auctions for robust task allocation")})] },

  { child:true, kind:"table", eyebrow:"Part 2 · Family 2 · Deep dive", title:"Four auctions side by side",
    table:{ head:["Auction","Introduced","What is sold","Bid","Hard part","Guarantee","Coupling handled"],
      rows:[["Single-item","Smith 1980; MURDOCH 2002","one task, on arrival","own cost","nothing; but myopic","3-competitive; best possible online (G&amp;M 2004)","none"],
            ["SSI","Lagoudakis 2005","one task per round, all open","marginal route cost","m rounds of n·m bids","≤ 2× for total distance; looser for makespan","ID, via marginal cost"],
            ["Combinatorial","Berhault 2003","bundles","bundle value","winner determination is NP-hard","none in general; winner determination solved approximately","ID, synergies"],
            ["CBBA","Choi 2009","bundles built greedily","marginal score","converges within N<sub>min</sub>·D rounds (D = network diameter)","conflict-free; ≥ 50% with diminishing gain and shared information","ID without synergy"]],
      hlCol:4 },
    notesTitle:"Choosing an auction",
    notes:`<ul><li><b>Tasks arrive over time, robots do one at a time:</b> single-item auctions. Simple and robust, but expect myopic choices.</li>
<li><b>Each robot does a route of tasks:</b> SSI. Close to greedy insertion, with guarantees for some objectives.</li>
<li><b>Strong synergies between tasks:</b> combinatorial auctions, with restricted bundles.</li>
<li><b>No reliable central node, poor or local communication:</b> CBBA.</li></ul>
<div class="key"><span class="lbl">The common thread</span>Every auction asks each robot to price tasks for itself. The table is not removed; it is computed in pieces, one row per robot. If a robot cannot price itself, for example a newcomer that does not yet know its own effectiveness in this team, auctions have nothing to work with.</div>`,
    refs:[] },
