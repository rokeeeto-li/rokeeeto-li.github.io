in SPL (2017)<\/b>。来自 30 个机构的实体机器人与从未见过的队友一起比赛。<span style=\"color:var(--muted)\">仍保留：强制使用标准消息包；针对足球角色，而非一般的分配。核查方式：全文（扩展摘要）。<\/span><\/li><li><b>PLASTIC (2017)<\/b>。通过对未见过的队友建模来与其合作，无需通信。<span style=\"color:var(--muted)\">仍保留：完全没有通信；队友行为平稳；仿真；低层动作。核查方式：全文。<\/span><\/li><li><b>Other-play (2020)<\/b>。不依赖任意约定，与独立训练的伙伴进行协调。<span style=\"color:var(--muted)\">仍保留：博弈及其对称性是共同知识；相同的学习规则；纸牌游戏。核查方式：全文。<\/span><\/li><li><b>ProAgent (2024)<\/b>。LLM 智能体通过观察推断队友意图并随之调整。<span style=\"color:var(--muted)\">仍保留：手写的知识库；双人烹饪游戏；并非机器人。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>该子轴是在第三部分的第一轮梳理之后加入的。第二部分表明，拍卖、共识、CBBA 和分布式优化都依赖于机器人事先就消息格式、评分和平局处理达成一致（2.3.11），而自组织是唯一转而通过环境进行协调的经典流派（2.4.6）。十一个审查来源都没有提出这一假设，这说明它被视为理所当然的程度之深。机器人领域中涉及未知队友的工作，要么强制使用共享消息包（RoboCup 临时加入比赛），要么让每个机器人运行同一个语言模型或对话协议（RoCo、SMART-LLM）。没有共享协议的协调在游戏和人–AI 基准中有所研究（other-play、离信念学习、虚拟协同博弈、ProAgent），而即兴协作往往干脆避免通信（PLASTIC）。注意 4.7 中所作的区分：共享一个接口（任务标识、状态、预约）并不等同于共享一套联合设计的团队策略。本综述的检索未发现仅共享这种最小接口的机器人之间的任务分配工作。3.15 的成对检查早于该子轴，并未涵盖它。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>已找到的 MRTA 工作要么假设存在共同协议，要么避免通信；无协议协调在游戏和人–AI 基准中有所研究，而非针对机器人任务分配（见 4.7）。该标签记录的是本综述检索所发现的情况，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E6 信息"}, "p3-e7-control-1-thin-3-partly-0-well-studied": {"key": "p3-e7-control-1-thin-3-partly-0-well-studied", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E7", "title": "E7 控制：1 项薄弱，3 项部分研究，0 项研究充分", "bullets": ["<b>E7a<\/b> 仅部分机器人可控：<i>部分研究<\/i>", "<b>E7b<\/b> 会自适应的队友：<i>薄弱<\/i>", "<b>E7c<\/b> 自利或策略性智能体：<i>部分研究<\/i>", "<b>E7d<\/b> 与人类共享决策权：<i>部分研究<\/i>"], "notesTitle": "E7 控制：小结", "notes": "<p><b>经典假设：<\/b>由一个设计者控制所有机器人，且所有机器人都相互合作、如实报告。<\/p><p>E7 的每个子轴在 MRTA 之外都有扎实的理论基础：部分控制对应即兴协作（ad hoc teamwork），自适应队友对应考虑学习过程的多智能体学习，策略性智能体对应算法机制设计，人类决策权对应自动化等级研究。但在分配问题内部，这些方向都薄弱或尚处早期。自适应队友最为薄弱：在分配研究中，“自适应”指的是每个机器人都运行设计者自己的规则。<\/p>\n<p><b>E7 的共同规律：<\/b>机器人学已在工程上实现了实践层面（多厂商车队适配器、人工接管层、激励相容的路径规划机制），却缺少分配层面的形式化；而形式化研究则存在于不涉及机器人的多智能体领域。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作放在一条从经典假设（左）到完全放松设定（右）的轴线上。位置是对一项工作放松该假设程度的定性判断，而非测量值。右侧虚线区域是所有已核查工作都未达到的范围。每项工作的备注记录其处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b><i>研究充分<\/i>：有多条成熟的研究脉络。<i>部分研究<\/i>：存在真实但零散的研究群，或保留了较强的简化。<i>薄弱<\/i>：只有少量论文或没有，领域自身的综述常将其列为开放问题。<\/p>", "tag": "E7 · 经典设定：由一个设计者控制所有机器人，且所有机器人都相互合作、如实报告"}, "p3-e7a-only-some-robots-are-controllable": {"key": "p3-e7a-only-some-robots-are-controllable", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E7 控制", "title": "E7a · 仅部分机器人可控", "bullets": ["<b>即兴协作（ad hoc teamwork）<\/b>提供形式化基础；<b>Open-RMF<\/b> 提供多厂商的实践基础", "不可控智能体只在<b>路径<\/b>层面处理，而非分配层面", "<b>开放问题：<\/b>仅以己方机器人的指派作为决策变量的分配"], "notesTitle": "E7a：仅部分机器人可控", "notes": "<p><b>经典设定：<\/b>设计者控制所有机器人。<b>完全放松：<\/b>你只控制自己的机器人；既有车队是黑箱。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>PLASTIC (2015)<\/b>。一个受控智能体去适应其无法控制的队友。<span style=\"color:var(--muted)\">仍保留：合作；单个智能体；仿真足球，而非分配。核查方式：摘要。<\/span><\/li><li><b>Open-RMF (2022)<\/b>。中央调度器通过具有不同控制级别的竞价适配器管理多厂商车队。<span style=\"color:var(--muted)\">仍保留：厂商合作且如实竞价；中央拥有最终决定权。核查方式：全文。<\/span><\/li><li><b>OEATE (2022)<\/b>。在智能体选择任务的同时，在线估计不受控队友的类型。<span style=\"color:var(--muted)\">仍保留：合作；候选类型集合；网格世界。核查方式：摘要。<\/span><\/li><li><b>Strawn et al. (2025)<\/b>。在不受控机器人之间为受控机器人做规划，并给出保形（conformal）安全保证。<span style=\"color:var(--muted)\">仍保留：仅限路径层面；不受控智能体不会作出反应。核查方式：摘要。<\/span><\/li><li><b>N-agent AHT (2024)<\/b>。受控子集与数量和类型不断变化的不受控队友协作。<span style=\"color:var(--muted)\">仍保留：共享团队回报；粒子环境与 StarCraft 基准。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>即兴协作主要在网格世界、粒子环境和 StarCraft 中测试；Mirsky et al. (2022) 将真实领域与基准列为开放问题。Open-RMF 解决了集成问题，但没有对队友建模。路径规划中关于不可控智能体的工作停留在路径层面。未找到这样的工作：其分配形式化中只有己方机器人是决策变量，而既有车队是黑箱。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>已有形式化基础（即兴协作）和实践基础（Open-RMF），但针对受控子集的分配层面工作很薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e7b-teammates-that-adapt": {"key": "p3-e7b-teammates-that-adapt", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E7 控制", "title": "E7b · 会自适应的队友", "bullets": ["考虑学习过程的多智能体 RL（对手塑造、非平稳性）<b>十分活跃<\/b>", "在分配研究中，“自适应”意味着每个机器人都运行<b>设计者自己的规则<\/b>", "<b>开放问题：<\/b>面对独立学习并对你作出反应的队友进行分配"], "notesTitle": "E7b：会自适应的队友", "notes": "<p><b>经典设定：<\/b>其他机器人的策略固定不变。<b>完全放松：<\/b>独立设计的队友会根据你的任务选择改变自己的任务选择。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>Emam et al. (2020)<\/b>。分配随能力变化而调整。<span style=\"color:var(--muted)\">仍保留：变化的是能力，而非他者的策略。核查方式：摘要。<\/span><\/li><li><b>Park et al. (2021)<\/b>。机器人按学习规则修正任务选择；收敛到最优的平稳分配。<span style=\"color:var(--muted)\">仍保留：所有机器人运行同一套设计好的规则。核查方式：摘要。<\/span><\/li><li><b>HBA (2016)<\/b>。对他者的行为类型维护贝叶斯信念，并检验这些类型是否正确。<span style=\"color:var(--muted)\">仍保留：是类型假设，而非会作出响应的学习者；不是分配问题。核查方式：摘要。<\/span><\/li><li><b>Xie et al. (2020)<\/b>。机器人对伙伴不断变化的策略建模并加以引导；真实空气曲棍球实验。<span style=\"color:var(--muted)\">仍保留：单个伙伴；低维任务。核查方式：摘要。<\/span><\/li><li><b>LOLA (2018)<\/b>。每个智能体都考虑自身如何影响他者的学习。<span style=\"color:var(--muted)\">仍保留：矩阵博弈与网格博弈；学习规则已知。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Mirsky et al. (2022) 指出，现有即兴协作（ad hoc teamwork）方法并非为自适应队友设计。在已找到的 MRTA 工作中（Park et al. 2021；Emam et al. 2020），所有机器人都运行设计者的规则。未找到这样的分配方法：独立设计的队友会针对本方（ego）车队改变其任务选择策略。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>在多智能体学习中很活跃，但在分配研究中自适应始终是共享的设计规则，且即兴协作综述将其列为开放问题。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-e7c-self-interested-or-strategic-agents": {"key": "p3-e7c-self-interested-or-strategic-agents", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E7 控制", "title": "E7c · 自利或策略性智能体", "bullets": ["<b>机制设计<\/b>理论已成熟（激励相容的支付规则）", "机器人学已有面向<b>路径规划<\/b>而非分配的激励相容机制；机器人拍卖假设<b>如实出价<\/b>", "<b>开放问题：<\/b>在存在空间或时间耦合、归属各自独立的车队之间实现激励相容的分配"], "notesTitle": "E7c：自利或策略性智能体", "notes": "<p><b>经典设定：<\/b>每个机器人都如实出价。<b>完全放松：<\/b>归属不同方的车队可能为获利而虚报。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>Nisan & Ronen (2001)<\/b>。在自利机器之间进行调度的激励相容近似机制。<span style=\"color:var(--muted)\">仍保留：抽象机器；货币转移。核查方式：摘要。<\/span><\/li><li><b>Cavallo et al. (2006)<\/b>。面向具有私有 MDP 状态的机器人的激励相容序贯 VCG。<span style=\"color:var(--muted)\">仍保留：模型为共同知识；弱耦合；转移支付。核查方式：全文。<\/span><\/li><li><b>Ramchurn et al. (2009)<\/b>。在可能失败的自利智能体之间进行 VCG 式分配。<span style=\"color:var(--muted)\">仍保留：通用智能体；集中式；胜者确定问题为 NP 完全。核查方式：摘要。<\/span><\/li><li><b>SPARCAS (2019)<\/b>。面向独立控制机器人的激励相容、去中心化优先级定价。<span style=\"color:var(--muted)\">仍保留：路径层面；货币转移。核查方式：摘要。<\/span><\/li><li><b>Friedrich et al. (2024)<\/b>。面向数百个智能体的防策略操纵（strategyproof）路径规划机制。<span style=\"color:var(--muted)\">仍保留：路径规划；中央机制；成本相互独立。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>机器人学中的激励相容机制主要用于路径规划（Das et al. 2019；Friedrich et al. 2024）或抽象的任务分配。Dias et al. 关于基于市场的机器人学综述未讨论如实出价。Friedrich et al. 指出，放松其假设会牺牲个体理性或可扩展性。未找到面向归属不同方、存在空间或时间耦合的车队的激励相容 MRTA 机制。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>理论成熟，近期也有机器人路径规划机制；但归属各自独立的车队之间的分配仍很薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e7d-authority-shared-with-humans": {"key": "p3-e7d-authority-shared-with-humans", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E7 控制", "title": "E7d · 与人类共享决策权", "bullets": ["扎实的<b>人因<\/b>基础：自动化等级、调度决策权应由谁掌握", "分配系统额外加入<b>人工接管<\/b>或审批层", "<b>开放问题：<\/b>将决策权作为分配形式化中的显式变量，并给出保证"], "notesTitle": "E7d：与人类共享决策权", "notes": "<p><b>经典设定：<\/b>由算法决定。<b>完全放松：<\/b>人类与分配器共享、协商或推翻决策。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>Parasuraman et al. (2000)<\/b>。覆盖信息处理各阶段的自动化等级。<span style=\"color:var(--muted)\">仍保留：通用框架，不是分配问题。核查方式：仅标题。<\/span><\/li><li><b>Gombolay et al. (2015)<\/b>。改变工人保留的分配决策权大小；工人更偏好由机器人控制。<span style=\"color:var(--muted)\">仍保留：单个团队；实验室任务。核查方式：摘要。<\/span><\/li><li><b>Ramchurn et al. (2015)<\/b>。混合主动式多 UAV 分配在一项 40 人研究中降低了工作负荷。<span style=\"color:var(--muted)\">仍保留：单个操作员；实验室研究。核查方式：摘要。<\/span><\/li><li><b>Galati et al. (2023)<\/b>。监督者批准或强制指定任务指派；快速重分配。<span style=\"color:var(--muted)\">仍保留：仅为接管层；仿真。核查方式：摘要。<\/span><\/li><li><b>Natarajan et al. (2024)<\/b>。机器人对人类的服从程度建模，并决定何时接管、何时让步。<span style=\"color:var(--muted)\">仍保留：网格世界；一人一机；动作层面。核查方式：全文。<\/span><\/li><li><b>Guillet (2025)<\/b>。操作员在 CBAA/CBBA 内部调整出价。<span style=\"color:var(--muted)\">仍保留：初步评估。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Ali et al. (2022) 将协作程度、协商、公平与伦理列为有待研究的方向。Guillet (2025) 将何种程度的干预才合适、可用性以及通信失效下的行为列为开放问题。多数工作是用户研究或接管层；未找到将最终决定权作为显式变量并给出保证的分配形式化。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>人因基础扎实，也有接管机制，但形式化的共享决策权分配尚处早期，且多为单人研究。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e8a-decide-in-real-time": {"key": "p3-e8a-decide-in-real-time", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E8 时机", "title": "E8a · 实时决策", "bullets": ["已有快速启发式方法和<b>随时（anytime）<\/b>求解器", "最优或随时方法只能处理<b>小团队<\/b>；LLM 规划器会带来数秒的<b>延迟<\/b>", "<b>开放问题：<\/b>截止时间下的质量保证；机器人运动过程中延迟的代价"], "notesTitle": "E8a：实时决策", "notes": "<p><b>经典设定：<\/b>求解没有时间限制。<b>完全放松：<\/b>在机器人运动的同时，于计算截止时间内作出决策，包括 LLM 延迟。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>Chen et al. (2023)<\/b>。随团队规模增长，LLM 协调的 token 与 API 调用成本。<span style=\"color:var(--muted)\">仍保留：未考虑实际耗时延迟；小团队。核查方式：部分全文。<\/span><\/li><li><b>Tercio (2013)<\/b>。数秒内为 10 个智能体、500 个任务生成近优调度。<span style=\"color:var(--muted)\">仍保留：快速但非随时；集中式；确定性。核查方式：摘要。<\/span><\/li><li><b>SCoBA (2020)<\/b>。效率足以在线交替进行规划与执行。<span style=\"color:var(--muted)\">仍保留：没有显式计算预算。核查方式：摘要。<\/span><\/li><li><b>MonTA (2024)<\/b>。快速监控器决定何时调用较慢的 LLM 推理。<span style=\"color:var(--muted)\">仍保留：单个人–智能体对；Overcooked。核查方式：摘要。<\/span><\/li><li><b>Präntare & Heintz (2020)<\/b>。随时分支定界，被中断时仍返回有效解。<span style=\"color:var(--muted)\">仍保留：13–18 个智能体；效用静态。核查方式：部分全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>最优与随时求解器仍只能处理小团队（Präntare and Heintz 2020）。Nunes et al. (2017) 指出快速规划器通常缺乏保证，并将时间尺度与时间敏感性列为开放问题。Li et al. (2025) 将 LLM 延迟列为开放挑战。未找到这样的工作：在机器人运动过程中界定因决策延迟而损失的规划质量。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>快速与随时方法已经存在，但关于显式截止时间、截止时间下的保证以及考虑延迟的 LLM 分配，论文很少且规模较小。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e8b-decide-while-executing": {"key": "p3-e8b-decide-while-executing", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E8 时机", "title": "E8b · 边执行边决策", "bullets": ["滚动时域与在线指派在终身路径规划中已<b>成熟<\/b>", "<b>何时重分配<\/b>与<b>切换代价<\/b>只零散地出现在少数论文中", "<b>开放问题：<\/b>重分配的一般理论：承诺、切换代价、稳定性"], "notesTitle": "E8b：边执行边决策", "notes": "<p><b>经典设定：<\/b>一次分配，然后执行。<b>完全放松：<\/b>在执行过程中重分配，在承诺与切换代价之间权衡。<\/p>\n<p><b>代表性工作<\/b>（图中从左到右）：<\/p>\n<ul><li><b>Parker & Gini (2014)<\/b>。对智能体被重分配时付出的延迟建模。<span style=\"color:var(--muted)\">仍保留：受限的代价函数；同构智能体。核查方式：摘要。<\/span><\/li><li><b>Lifelong MAPD (2017)<\/b>。智能体执行期间的在线指派；任务交换。<span style=\"color:var(--muted)\">仍保留：切换代价不在目标函数中。核查方式：摘要。<\/span><\/li><li><b>Nam & Shell (2015)<\/b>。给出使当前指派保持最优的代价区域，从而可以跳过重新指派。<span style=\"color:var(--muted)\">仍保留：线性指派；无切换代价。核查方式：部分全文。<\/span><\/li><li><b>RHCR (2021)<\/b>。面向至多 1,000 个智能体的滚动时域重规划。<span style=\"color:var(--muted)\">仍保留：任务指派不在其范围内；执行完美。核查方式：部分全文。<\/span><\/li><li><b>Lippi et al. (2023)<\/b>。带任务切换代价的在线重分配。<span style=\"color:var(--muted)\">仍保留：两条机械臂，一个人。核查方式：摘要。<\/span><\/li><li><b>Aznar et al. (2026)<\/b>。由重大事件而非周期性触发的重分配。<span style=\"color:var(--muted)\">仍保留：仿真；摘要未说明触发条件。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Nunes et al. (2017) 提出疑问：构建信息较少的规划并频繁重规划是否就已足够。滚动时域路径规划（Li et al. 2021）在窗口大小与死锁之间权衡，并将任务指派排除在其范围之外。Zhu et al. (2025) 指出多数工作固定任务分配器。未找到关于重分配策略的一般理论；现有处理都针对特定领域。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>在线指派在终身路径规划中已成熟；切换代价与何时重分配的研究很零散，单独来看可评为薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e8c-computation-grows-with-team-size": {"key": "p3-e8c-computation-grows-with-team-size", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E8 时机", "title": "E8c · 计算量随团队规模增长", "bullets": ["<b>简单指派<\/b>可扩展到大规模团队（拍卖、划分、分布式方法）", "更丰富的约束至多在<b>数百<\/b>台规模上得到验证；学习型策略<b>不提供保证<\/b>", "<b>开放问题：<\/b>同时兼顾时间窗、联盟、异构性与冲突的规模化"], "notesTitle": "E8c：计算量随团队规模增长", "notes": "<p><b>经典设定：<\/b>小规模团队，任意求解器均可。<b>完全放松：<\/b>数千台异构机器人，同时带有时间约束与联盟约束。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>Auction algorithm (1988)<\/b>。通过竞价实现并行、分布式指派。<span style=\"color:var(--muted)\">仍保留：线性一对一指派；静态代价。核查方式：摘要。<\/span><\/li><li><b>CBBA (2009)<\/b>。带保证的去中心化任务包（bundle）分配。<span style=\"color:var(--muted)\">仍保留：收益递减型评分；无计算预算。核查方式：摘要。<\/span><\/li><li><b>Liu & Shell (2011)<\/b>。先粗化、划分，再细化指派。<span style=\"color:var(--muted)\">仍保留：线性指派；少量质量损失。核查方式：摘要。<\/span><\/li><li><b>Wang & Gombolay (2020)<\/b>。调度策略在小规模上训练，在大规模上应用。<span style=\"color:var(--muted)\">仍保留：同构机器人；2–5 台机器人，至多 100 个任务；无保证。核查方式：全文（RA-L 版本）。<\/span><\/li><li><b>CapAM (2022)<\/b>。图 RL 策略可泛化到更大实例，决策速度提升 10 倍以上。<span style=\"color:var(--muted)\">仍保留：无最优性保证。核查方式：摘要。<\/span><\/li><li><b>Lee et al. (2025)<\/b>。在杂乱地图中为 100–500 台机器人进行路径感知分配。<span style=\"color:var(--muted)\">仍保留：同构；一次性求解、以 makespan 为目标。核查方式：部分全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Lee et al. (2025) 指出，冲突感知分配至多只在数十台机器人上测试过。Chen et al. (2023) 报告，集中式 LLM 协调随智能体数量增加，扩展性显著变差。Nunes et al. (2017) 认为，带时间与顺序约束的分配在非平凡规模下难以求解。扩展到数千台的结果主要见于简单指派或路径规划。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>简单指派扩展性良好；更丰富的约束至多达到数百台，学习型方法的扩展缺乏保证。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e9-execution-0-thin-2-partly-1-well-studied": {"key": "p3-e9-execution-0-thin-2-partly-1-well-studied", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E9", "title": "E9 执行：0 项薄弱，2 项部分研究，1 项研究充分", "bullets": ["<b>E9a<\/b> 路径冲突：<i>研究充分<\/i>", "<b>E9b<\/b> 操作可行性：<i>部分研究<\/i>", "<b>E9c<\/b> 执行中的计划漂移：<i>部分研究<\/i>"], "notesTitle": "E9 执行：小结", "notes": "<p><b>经典假设：<\/b>分配器选出的任何分配都能被其下层执行。<\/p><p>E9 仅由一个审计来源提出，但文献核查发现了大量相关工作，说明审计衡量的是综述中的关注度，而非实际研究活跃度。联合指派与路径规划在离散栅格抽象内研究充分。多机器人任务与运动规划较为活跃，但规模小且离线。路径层面已有鲁棒执行，分配层面已有事件触发的修复，但两者尚未打通。<\/p>\n<p><b>E9 的共同模式：<\/b>分配与执行之间的耦合每次只研究一对层级，采用开环方式，且在理想化几何中进行。将底层执行偏差反馈到分配的工作很少。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作放在一条从经典假设（左）到完全放松设定（右）的线上。位置是对工作放松该假设程度的定性判断，而非测量值。右侧虚线区域是所核查工作均未达到的范围。每项工作的注释记录其处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b><i>研究充分<\/i>：存在若干成熟的研究脉络。<i>部分研究<\/i>：存在真实但零散的工作群，或仍保留较强的简化。<i>薄弱<\/i>：仅有少量论文或没有，且该领域自身的综述常将其列为开放问题。<\/p>", "tag": "E9 · 经典设定：分配器选出的任何分配都能被其下层执行"}, "p3-e9a-path-conflicts": {"key": "p3-e9a-path-conflicts", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E9 执行", "title": "E9a · 路径冲突", "bullets": ["<b>联合指派与路径规划<\/b>（TAPF、CBS-TA、MAPD）研究密集，已有最优与可扩展的变体", "几乎全部共享<b>栅格、单位时间、同构<\/b>的抽象", "<b>开放问题：<\/b>连续动力学、异构机器人、多机器人任务"], "notesTitle": "E9a：路径冲突", "notes": "<p><b>经典设定：<\/b>被指派的机器人总能到达其任务。<b>完全放松：<\/b>在连续空间中为异构团队联合求解指派与无碰撞路径。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>CAPT (2014)<\/b>。在连续空间中一步完成指派与无碰撞轨迹。<span style=\"color:var(--muted)\">仍保留：机器人可互换；仅在无障碍物时最优。核查方式：摘要。<\/span><\/li><li><b>CBM (TAPF) (2016)<\/b>。定义 TAPF；完备且 makespan 最优。<span style=\"color:var(--muted)\">仍保留：团队内智能体匿名；离散图。核查方式：摘要。<\/span><\/li><li><b>CBS-TA (2018)<\/b>。最优的联合指派与路径规划。<span style=\"color:var(--muted)\">仍保留：每个任务一个智能体；栅格；单位时间。核查方式：摘要。<\/span><\/li><li><b>Chen et al. (2021)<\/b>。基于考虑碰撞的实际配送代价进行指派；机器人可承担多个任务。<span style=\"color:var(--muted)\">仍保留：栅格；同构；精确执行。核查方式：摘要。<\/span><\/li><li><b>CBS-TA-PTC (2024)<\/b>。在联合指派与路径规划中加入优先约束与定时目标。<span style=\"color:var(--muted)\">仍保留：离散；3 智能体领域。核查方式：全文。<\/span><\/li><li><b>Kumagai & Okumura (2026)<\/b>。快速路径求解器将瓶颈智能体反馈给重新指派；规模远超 CBS。<span style=\"color:var(--muted)\">仍保留：TAPF 抽象；无最优性。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>多数耦合工作停留在离散、单位时间、同构的路径规划中，且耦合方法难以扩展（ITA-CBS；Kumagai and Okumura 2026）。Hönig et al. (2018) 发现，在稀疏地图中解耦指派的效果相差无几。运动动力学、异构与多机器人任务这几种扩展很少结合；CAPT 仅在无障碍物、机器人可互换时处理连续空间。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：研究充分<\/span>在离散路径规划抽象内研究充分；超出该抽象则薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：研究充分"}, "p3-e9b-manipulation-feasibility": {"key": "p3-e9b-manipulation-feasibility", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E9 执行", "title": "E9b · 操作可行性", "bullets": ["<b>多机器人任务与运动规划<\/b>研究脉络活跃（2019–2025）", "局限于<b>结构化工作单元<\/b>，离线、确定性、中小规模", "<b>开放问题：<\/b>在机队规模上将分配与富接触、协作操作相耦合"], "notesTitle": "E9b：操作可行性", "notes": "<p><b>经典设定：<\/b>操作被视为理想化的一步。<b>完全放松：<\/b>分配在机队规模上检查可达性、抓取与协作操作的可行性。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>Behrens et al. (2019)<\/b>。针对 200 个物体联合进行分配与运动调度。<span style=\"color:var(--muted)\">仍保留：结构化单元；预计算运动；离线。核查方式：摘要。<\/span><\/li><li><b>GRSTAPS (2022)<\/b>。交错进行规划、分配、调度与运动。<span style=\"color:var(--muted)\">仍保留：导航层级的运动；确定性。核查方式：摘要。<\/span><\/li><li><b>TMP-CBS (2020)<\/b>。考虑依赖关系的联合分解、分配与运动规划。<span style=\"color:var(--muted)\">仍保留：离线；确定性。核查方式：摘要。<\/span><\/li><li><b>Pan et al. (2021)<\/b>。调度器评估备选的机器人指派，以减少规划器调用。<span style=\"color:var(--muted)\">仍保留：2 个机械臂，至多 6 个物体。核查方式：摘要。<\/span><\/li><li><b>Hartmann et al. (2022)<\/b>。多机器人协作操作，并在真实双臂系统上执行。<span style=\"color:var(--muted)\">仍保留：离线；几何已知；开环。核查方式：摘要。<\/span><\/li><li><b>Lazy-DaSH (2025)<\/b>。惰性可行性检查；可扩展到两倍数量的机器人与物体。<span style=\"color:var(--muted)\">仍保留：重排任务；确定性。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>现有方法均为离线、确定性、中小规模，主要在重排或装配单元中评估。He et al.（2026，摘要）指出，现有方法把操作视为理想化的一步。Rizk et al. (2019) 指出，各模块大多被独立研究，端到端框架很少。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>研究脉络活跃，但局限于结构化单元或导航层级运动，采用开环，且规模有限。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e9c-plans-drift-during-execution": {"key": "p3-e9c-plans-drift-during-execution", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E9 执行", "title": "E9c · 执行中的计划漂移", "bullets": ["<b>路径层面<\/b>对延迟的鲁棒性已较成熟", "<b>分配层面<\/b>的修复针对离散故障事件做出响应", "<b>开放问题：<\/b>持续监测，并将执行漂移反馈到分配"], "notesTitle": "E9c：执行中的计划漂移", "notes": "<p><b>经典设定：<\/b>计划按计算结果执行。<b>完全放松：<\/b>监测底层偏差并将其反馈到分配。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>TraderBots (2004)<\/b>。在通信或机器人故障后进行基于市场的重新分配。<span style=\"color:var(--muted)\">仍保留：仅限任务层面的离散故障。核查方式：摘要。<\/span><\/li><li><b>Hönig et al. (2019)<\/b>。路径执行对减速与障碍物具有鲁棒性。<span style=\"color:var(--muted)\">仍保留：不修订指派。核查方式：摘要。<\/span><\/li><li><b>Atzmon et al. (2020)<\/b>。可容忍至多 k 次延迟的计划；鲁棒执行策略。<span style=\"color:var(--muted)\">仍保留：仅考虑延迟；无分配层。核查方式：摘要。<\/span><\/li><li><b>Lodigiani et al. (2023)<\/b>。在线取送货中对延迟的确定性与概率鲁棒性。<span style=\"color:var(--muted)\">仍保留：仅考虑延迟；栅格。核查方式：摘要。<\/span><\/li><li><b>D-ITAGS (2023)<\/b>。跨分配、调度与运动层的定向修复。<span style=\"color:var(--muted)\">仍保留：离散扰动事件；仿真。核查方式：摘要。<\/span><\/li><li><b>Calvo & Capitan (2025)<\/b>。事件发生时在线修复或重新计算分配。<span style=\"color:var(--muted)\">仍保留：事件触发；空中平台案例研究。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>鲁棒性研究分为两支：路径层面的工作处理延迟但不重新审视分配，分配层面的工作仅在离散扰动事件之后进行修复。Lodigiani et al. (2023) 指出，取送货方法常常忽略延迟与故障。将底层漂移反馈到分配的工作主要见于近期未经同行评审的预印本。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>鲁棒路径执行与事件触发的重新分配各自存在；从执行漂移到分配的闭环研究薄弱。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e10-system-design-1-thin-2-partly-0-well-studied": {"key": "p3-e10-system-design-1-thin-2-partly-0-well-studied", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E10", "title": "E10 系统设计：1 项薄弱，2 项部分研究，0 项研究充分", "bullets": ["<b>E10a<\/b> 机队规模与构成：<i>部分研究<\/i>", "<b>E10b<\/b> 布局与环境设计：<i>部分研究<\/i>", "<b>E10c<\/b> 机队、布局与策略的协同设计：<i>薄弱<\/i>"], "notesTitle": "E10 系统设计：小结", "notes": "<p><b>经典假设：<\/b>机队、布局与环境固定且给定；只设计分配。<\/p><p>E10 由审计（3.4.2）新增，文献核查证实这是一个真实的研究领域，但大多位于经典 MRTA 之外。机队规模确定在按需出行（mobility-on-demand）领域已较成熟；与分配一同设计异构机器人团队构成的工作仅有少数近期论文。布局设计有一批运筹学评估文献，且自 2023 年起有一条活跃的路径规划研究线。机队、环境与分配策略三者的协同设计研究薄弱。<\/p>\n<p><b>E10 的共同模式：<\/b>设计针对已知任务集离线进行，环路内的分配或路径规划策略保持固定。未发现研究设计对不确定任务流的鲁棒性，或研究设计时与运行时决策如何划分的工作。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作放在一条从经典假设（左）到完全放松设定（右）的线上。位置是对工作放松该假设程度的定性判断，而非测量值。右侧虚线区域是所核查工作均未达到的范围。每项工作的注释记录其处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b><i>研究充分<\/i>：存在若干成熟的研究脉络。<i>部分研究<\/i>：存在真实但零散的工作群，或仍保留较强的简化。<i>薄弱<\/i>：仅有少量论文或没有，且该领域自身的综述常将其列为开放问题。<\/p>", "tag": "E10 · 经典设定：机队、布局与环境固定且给定；只设计分配"}, "p3-e10a-fleet-sizing-and-composition": {"key": "p3-e10a-fleet-sizing-and-composition", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E10 系统设计", "title": "E10a · 机队规模与构成", "bullets": ["机队规模确定在<b>按需出行领域已较成熟<\/b>", "<b>与<\/b>分配一同设计异构机器人团队构成：少数近期论文，均为离线", "<b>开放问题：<\/b>面向不确定任务流的鲁棒构成；增加一台机器人的非单调价值"], "notesTitle": "E10a：机队规模与构成", "notes": "<p><b>经典设定：<\/b>机队给定。<b>完全放松：<\/b>选择各类型机器人的数量，并知晓再增加一台的边际价值。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>Rosenfeld et al. (2004)<\/b>。增加机器人的收益先递减、后转负，具体取决于协调方式。<span style=\"color:var(--muted)\">仍保留：机器人相同；经验研究；研究规模而非设计规模。核查方式：摘要。<\/span><\/li><li><b>Spieser et al. (2014)<\/b>。城市级的解析式机队规模确定。<span style=\"color:var(--muted)\">仍保留：同构；聚合模型。核查方式：摘要。<\/span><\/li><li><b>Wallar et al. (2019)<\/b>。结合车辆路由确定机队规模与容量组合。<span style=\"color:var(--muted)\">仍保留：需求已知；仅限车辆。核查方式：摘要。<\/span><\/li><li><b>Pan & Yu (2024)<\/b>。通过仿真调度为候选团队打分。<span style=\"color:var(--muted)\">仍保留：枚举候选；任务已知。核查方式：摘要。<\/span><\/li><li><b>Wilde & A.-Mora (2023)<\/b>。在预算约束下选择机器人类型，并与分配和排序联合求解。<span style=\"color:var(--muted)\">仍保留：任务已知；离线；MILP 扩展性差。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>团队构成通常针对已知任务集离线选定；对不确定任务流与故障的鲁棒性很少涉及，且精确方法扩展性差（Wilde and Alonso-Mora 2023）。由相互干扰导致的增加机器人的非单调边际价值（Rosenfeld et al. 2004）已有经验记录，但很少纳入机队设计优化器。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>在按需出行领域已较成熟；异构构成与分配的联合设计仅有少数近期的离线论文。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e10b-layout-and-environment-design": {"key": "p3-e10b-layout-and-environment-design", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E10 系统设计", "title": "E10b · 布局与环境设计", "bullets": ["<b>运筹学<\/b>用排队模型评估仓库布局", "自 2023 年起，一条活跃的<b>路径规划<\/b>研究线开始优化布局与引导图", "<b>开放问题：<\/b>可证明排除困难情形的布局；对需求变化的鲁棒性"], "notesTitle": "E10b：布局与环境设计", "notes": "<p><b>经典设定：<\/b>环境给定。<b>完全放松：<\/b>设计布局，使吞吐量高且困难情形无从出现。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>Lamballais et al. (2017)<\/b>。基于排队模型评估布局与机器人分区。<span style=\"color:var(--muted)\">仍保留：评估设计而非综合设计。核查方式：摘要。<\/span><\/li><li><b>Azadeh et al. (2019)<\/b>。设计优化与运行控制综述。<span style=\"color:var(--muted)\">仍保留：综述；侧重 OR。核查方式：摘要。<\/span><\/li><li><b>Zhang et al. (2023)<\/b>。在终身规划器下进行质量-多样性布局优化。<span style=\"color:var(--muted)\">仍保留：规划器固定；布局较小；仿真。核查方式：摘要。<\/span><\/li><li><b>NCA 生成器 (2023)<\/b>。优化布局生成器；可扩展到 2,350 台机器人。<span style=\"color:var(--muted)\">仍保留：规划器固定；仅考虑吞吐量。核查方式：摘要。<\/span><\/li><li><b>引导图 (2024)<\/b>。设计软结构（边权重），为 3,000 个智能体提升吞吐量。<span style=\"color:var(--muted)\">仍保留：物理布局与规划器给定。核查方式：摘要。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Azadeh et al. (2019) 指出，对于柔性自主仓库，布局与核心设计决策须重新审视，且子系统集成仍是开放问题。Zhang et al. (2023) 将直接布局搜索的扩展性列为局限。未发现能保证布局排除病态路径规划情形的工作，也未发现处理需求变化鲁棒性的工作（两者均由文献缺失推断）。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：部分研究<\/span>已有成熟的 OR 评估文献，以及自 2023 年起活跃的路径规划研究线（主要来自同一团队）；面向可解性的设计仍未解决。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：部分研究"}, "p3-e10c-co-design-of-fleet-layout-and-policy": {"key": "p3-e10c-co-design-of-fleet-layout-and-policy", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E10 系统设计", "title": "E10c · 机队、布局与策略的协同设计", "bullets": ["已有通用的<b>协同设计理论<\/b>（单调协同设计）", "MRTA 专属的协同设计：2024–2026 年的少数工作，在机队、环境、策略中各自<b>至多覆盖两项<\/b>", "<b>开放问题：<\/b>三者兼顾；设计时与运行时决策的划分"], "notesTitle": "E10c：机队、布局与策略的协同设计", "notes": "<p><b>经典设定：<\/b>各部分分别设计。<b>完全放松：<\/b>联合设计机队、布局与分配策略，并划分设计时与运行时的职责。<\/p>\n<p><b>代表性工作<\/b>（图中自左向右）：<\/p>\n<ul><li><b>Censi (2015)<\/b>。互联设计问题的单调协同设计。<span style=\"color:var(--muted)\">仍保留：要求单调性；非 MRTA 专属。核查方式：摘要。<\/span><\/li><li><b>Zardini et al. (2019)<\/b>。联合设计机队规模、自动化水平与公共交通发车频率。<span style=\"color:var(--muted)\">仍保留：聚合流；无在线自适应。核查方式：摘要。<\/span><\/li><li><b>Gao et al. (2024)<\/b>。交替优化布局与智能体策略。<span style=\"color:var(--muted)\">仍保留：面向导航而非分配；机队固定。核查方式：摘要。<\/span><\/li><li><b>DiCoDe (2025)<\/b>。扩散式环境生成器与 RL 策略协同优化。<span style=\"color:var(--muted)\">仍保留：机队固定；RL 策略。核查方式：摘要。<\/span><\/li><li><b>Stralz et al. (2026)<\/b>。协同设计硬件、机队构成与规划器；优于顺序设计。<span style=\"color:var(--muted)\">仍保留：离线集中式规划；单调接口。核查方式：全文。<\/span><\/li><\/ul>\n<p><b>尚未解决的问题。<\/b>Stralz et al. (2026) 指出，协同设计需要单调接口，收益依问题而定，且规划为离线、集中式。环境–策略协同设计保持机队固定，并以导航或 RL 策略为目标。未发现联合设计机队、布局与分配策略，或明确划分设计时与运行时决策的工作。<\/p>\n<div class=\"key\"><span class=\"lbl\">检索快照（2026 年 10 月）：薄弱<\/span>已有通用理论，但 MRTA 专属的协同设计仅有少数近期预印本，且至多覆盖三部分中的两部分。该标签记录本综述的检索所得，并非覆盖率统计。<\/div>", "tag": "检索快照：薄弱"}, "p3-pairwise-coverage-almost-every-pair-has-been-tried": {"key": "p3-pairwise-coverage-almost-every-pair-has-been-tried", "eyebrow": "第三部分 · 步骤 4 · 成对", "title": "成对覆盖：几乎每一对都已有人尝试", "bullets": ["对每一对要素，寻找<b>同时放宽两者<\/b>的工作", "<b>35<\/b> 对已有联合研究，<b>9<\/b> 对仅有一两项工作，<b>1<\/b> 对未找到（E6 × E10）", "在要素层面，空间看似已被覆盖；空白在于<b>特定的子轴组合<\/b>", "若干“已研究”的对依赖于<b>相邻领域<\/b>的工作：多智能体理论，或分配器固定的布局设计"], "notesTitle": "成对检查的发现", "notes": "<p>步骤 4 从单轴推进到成对。三轮文献检查覆盖了全部 45 对要素，考察是否有工作在同一篇论文中对每个要素至少放宽一个子轴。<\/p>\n<p><b>要素层面的结果。<\/b>35 对存在可辨识的联合研究脉络，9 对仅有一两项工作，只有 E6 × E10（通过设计机群或布局来弥补受限通信）未找到任何工作。白点标记的对，其证据主要来自相邻领域：不涉及机器人的多智能体机制设计，或任务分配保持固定的仓库布局设计。<\/p>\n<p><b>为何这还不是全部。<\/b>要素的粒度较粗。“E1 × E5 已有联合研究”之所以成立，是因为基于特质的团队已与风险目标结合、人类已与偏好目标结合，但没有工作将开放团队与吞吐量目标结合。下一页列出各轮检查报告缺失的具体子轴组合。<\/p>\n<p><b>每一对的证据<\/b>（代表性工作）：<\/p>\n<ul><li><code>E1 × E2<\/code> 已有联合研究：PLATO 2026；HMR-ODTA 2025；Rossano et al. 2025<\/li><li><code>E1 × E3<\/code> 已有联合研究：Rudolph et al. 2021；RiTAGS 2023；Liu et al. 2020<\/li><li><code>E1 × E4<\/code> 已有联合研究：ITAGS 2021；Rudolph et al. 2021；Calvo & Capitan 2025<\/li><li><code>E1 × E5<\/code> 已有联合研究：Gombolay et al. 2014；RiTAGS 2023；Mallampati & Ravichandar 2023<\/li><li><code>E1 × E6<\/code> 已有联合研究：Eck et al. 2020；Kakarlapudi et al. 2022；ATPO 2022<\/li><li><code>E1 × E7<\/code> 已有联合研究：Gombolay et al. 2014；Ramchurn et al. 2015；GPL 2021<\/li><li><code>E1 × E8<\/code> 已有联合研究：D-ITAGS 2022；Calvo & Capitan 2025；Eck et al. 2020<\/li><li><code>E1 × E9<\/code> 已有联合研究：ITAGS 2021；D-ITAGS 2022；OMCoRP 2021<\/li><li><code>E1 × E10<\/code> 已有联合研究：Wilde & Alonso-Mora 2023；Stralz et al. 2026；Pan & Yu 2024（仅异质性）<\/li><li><code>E2 × E3<\/code> 已有联合研究：SCoBA 2020；Mendoza et al. 2026；RiTAGS 2023<\/li><li><code>E2 × E4<\/code> 已有联合研究：Zhu et al. 2025；GRAND 2025；RiTAGS 2023<\/li><li><code>E2 × E5<\/code> 已有联合研究：Zhu et al. 2025；GRAND 2025；RiTAGS 2023<\/li><li><code>E2 × E6<\/code> 已有联合研究：CBBA-PR 2019；Mendoza et al. 2026；CoCoPlan 2026<\/li><li><code>E2 × E7<\/code> 少量工作：HECTOR 2026；Chen et al. 2017（机器调度）<\/li><li><code>E2 × E8<\/code> 已有联合研究：Lifelong MAPD 2017；CBBA-PR 2019；GRAND 2025<\/li><li><code>E2 × E9<\/code> 已有联合研究：Lifelong MAPD 2017；Lodigiani et al. 2023；Zhu et al. 2025<\/li><li><code>E2 × E10<\/code> 少量工作（多为相邻领域）：Zhang & Pavone 2014；Zhang et al. 2023（分配器固定）<\/li><li><code>E3 × E4<\/code> 已有联合研究：E-ITAGS 2026；CMTAB 2023；Messing et al. 2023<\/li><li><code>E3 × E5<\/code> 已有联合研究：Rudolph et al. 2021；Messing et al. 2023；Ponda et al. 2012<\/li><li><code>E3 × E6<\/code> 已有联合研究：Amato et al. 2014；Ponda et al. 2012；Ginting et al. 2024<\/li><li><code>E3 × E7<\/code> 已有联合研究（多为相邻领域）：Porter et al. 2008；Ramchurn et al. 2009；Cavallo et al. 2006<\/li><li><code>E3 × E8<\/code> 已有联合研究：SCoBA 2020；Mayya et al. 2020；Emam et al. 2020<\/li><li><code>E3 × E9<\/code> 少量工作：Lodigiani et al. 2023；Farinelli et al. 2020<\/li><li><code>E3 × E10<\/code> 少量工作：Ginting et al. 2024；Stralz et al. 2026（关联较弱）<\/li><li><code>E4 × E5<\/code> 已有联合研究：Zhu et al. 2025；Zhang et al. 2023；Messing et al. 2023<\/li><li><code>E4 × E6<\/code> 已有联合研究：CCBBA 2011；Jang et al. 2018；Rossano et al. 2025<\/li><li><code>E4 × E7<\/code> 已有联合研究（多为相邻领域）：Jang et al. 2018；Zhao et al. 2020；Cavallo et al. 2006<\/li><li><code>E4 × E8<\/code> 已有联合研究：SCoBA 2020；Lifelong MAPD 2017；OSDAG 2026<\/li><li><code>E4 × E9<\/code> 已有联合研究：CBS-TA 2018；CBS-TA-PTC 2024；Zhu et al. 2025<\/li><li><code>E4 × E10<\/code> 少量工作（多为相邻领域）：Zhang et al. 2023；Zhang & Pavone 2014<\/li><li><code>E5 × E6<\/code> 少量工作：Ponda et al. 2012；Tristão & Macharet 2026；Krnjaic et al. 2024<\/li><li><code>E5 × E7<\/code> 已有联合研究：Gombolay et al. 2015, 2017；Lamon et al. 2023<\/li><li><code>E5 × E8<\/code> 已有联合研究：GRAND 2025；Zhu et al. 2025；Lippi et al. 2023<\/li><li><code>E5 × E9<\/code> 已有联合研究：Lifelong MAPD 2017；GRAND 2025；Zhu et al. 2025<\/li><li><code>E5 × E10<\/code> 已有联合研究（多为相邻领域）：Zhang et al. 2023；NCA 2023（分配器固定）<\/li><li><code>E6 × E7<\/code> 已有联合研究：Ribeiro et al. 2023；OEATE 2022；Xu et al. 2012<\/li><li><code>E6 × E8<\/code> 已有联合研究：ACBBA 2011；Albani et al. 2019；Mendoza et al. 2026<\/li><li><code>E6 × E9<\/code> 少量工作：Albani et al. 2019；Chen et al. 2020<\/li><li><code>E6 × E10<\/code> 未找到：未找到（仅有固定团队内部的中继角色）<\/li><li><code>E7 × E8<\/code> 已有联合研究：Lamon et al. 2023；OEATE 2022；Flammini et al. 2023<\/li><li><code>E7 × E9<\/code> 少量工作：Flammini et al. 2023；Zhao & Zhu 2024<\/li><li><code>E7 × E10<\/code> 少量工作（多为相邻领域）：Mau & Dolan 2007；Crandall & Cummings 2007<\/li><li><code>E8 × E9<\/code> 已有联合研究：Lifelong MAPD 2017；Chen et al. 2021；GRAND 2025<\/li><li><code>E8 × E10<\/code> 已有联合研究（多为相邻领域）：Zhang et al. 2023, 2024；NCA 2023（同一课题组，分配器固定）<\/li><li><code>E9 × E10<\/code> 已有联合研究（多为相邻领域）：Zhang et al. 2023, 2024；Zeng et al. 2024<\/li><\/ul>\n<p>多数条目仅在摘要层面核查；若干 2025–2026 年预印本的发表场所尚未核实。<\/p>", "tag": "45 个要素对"}, "p3-sub-axis-combinations-reported-missing-1-of-2": {"key": "p3-sub-axis-combinations-reported-missing-1-of-2", "eyebrow": "第三部分 · 步骤 4 · 成对", "title": "报告缺失的子轴组合（1/2）", "notesTitle": "成对空白的真正所在", "notes": "<p>三轮成对检查各自针对每一对报告了未能找到的具体子轴组合，本表将其汇总。“未找到”指每对约两到四次定向检索均未发现相关工作；这是研究薄弱的证据，而非不存在的证明。<\/p>\n<p><b>三点观察。<\/b><\/p>\n<ul><li><b>E4d 未出现在任何一对中。<\/b>在三轮检查中，“分配重塑系统”均未与任何其他要素结合。<\/li>\n<li><b>开放与未知队友（E1a、E1b）反复出现。<\/b>它们与任务分解、吞吐量、无害目标、干扰以及不确定的自我认知的组合均缺失。<\/li>\n<li><b>系统设计（E10）的研究中分配器是固定的。<\/b>布局与机群设计回路将任务分配固定，因此设计与分配尚未被联合优化。<\/li><\/ul>", "table": {"head": ["成对", "缺失的组合", "已发现的工作"], "rows": [["E4 × 全部", "分配重塑系统，与任何其他子轴结合", "三轮成对扫描中均无成对工作。"], ["E1 × E2", "开放团队配合需分解的任务或需求未知的任务", "智能体开放与任务开放仅在 2026 年的 PLATO 系列工作中同时出现，且任务为原子任务。"], ["E1 × E5", "开放或未知队友配合吞吐量目标，或配合相对于无新成员基线的无害目标", "未找到。"], ["E1 × E4", "开放或未知队友配合干扰或瓶颈转移", "未找到。"], ["E1 × E6", "不确定的自我认知配合开放或未知队友", "未找到。"], ["E3 × E6", "不确定的自我认知配合需耗时获取的信息", "最接近的工作：Rossano et al.（2025）对任务额外需求得到确认之前的延迟进行了建模；其不确定性关乎任务，而非机器人的自我认知。"], ["E2 × E3", "通过感知发现的任务，配合在线习得或漂移的能力", "未核实到任何论文。"], ["E3 × E7", "习得的能力配合自适应队友或人类共享决策权", "MRTA 中未找到。"]], "caption": ""}}, "p3-sub-axis-combinations-reported-missing-2-of-2": {"key": "p3-sub-axis-combinations-reported-missing-2-of-2", "eyebrow": "第三部分 · 步骤 4 · 成对", "title": "报告缺失的子轴组合（2/2）", "notesTitle": "缺失组合（续）", "notes": "<p>其余组合涉及控制（面对任务流的策略性机器人）、执行（应触发重分配的漂移；面对到达任务或习得能力时的操作可行性）以及系统设计（弥补通信限制的设计；回路中包含优化分配器的设计；设计与执行中的非吞吐量目标）。<\/p>\n<p>其中若干涉及经典框架完全未曾考虑的要素（E9 与 E10，见 3.2.1），这与它们较少被探索的现状一致。<\/p>", "table": {"head": ["成对", "缺失的组合", "已发现的工作"], "rows": [["E2 × E7", "面对持续到达任务流的策略性机器人", "最接近：Cavallo et al. 2006（无任务到达）；OMCoRP 2021（无分配）。"], ["E3 × E9", "触发重分配而不仅是路径修复的执行漂移", "路径层面的鲁棒性已有研究；由漂移触发的重分配很少见。"], ["E5 × E9, E10", "风险、公平或无害目标配合路径冲突或系统设计", "所发现的工作均优化吞吐量或服务时间。"], ["E6 × E10", "弥补受限通信或观测的机群或布局设计", "未找到。"], ["E10 × E2, E4, E8", "回路中包含优化分配器的机群或布局设计", "布局工作固定分配器（随机或简单规则）。"], ["E9 × E2, E3", "面对到达任务或习得能力时的操作可行性", "未找到。"], ["E7 × E9", "自利或临时组队（ad hoc）机器人配合路径冲突；人类决策权配合操作", "少量工作（Flammini et al. 2023；Zhao & Zhu 2024）。"]], "caption": ""}}, "p3-which-sub-axes-keep-turning-up-in-missing-combinations": {"key": "p3-which-sub-axes-keep-turning-up-in-missing-combinations", "eyebrow": "第三部分 · 步骤 4 · 成对", "title": "哪些子轴在缺失组合中反复出现", "bullets": ["统计每个子轴在缺失列表中出现的次数", "<b>单独看已薄弱<\/b>的子轴反复出现；E1a 居首（高亮）", "薄弱的单轴与缺失的成对指向<b>相同的位置<\/b>"], "notesTitle": "单轴与成对之间的一致性检查", "notes": "<p>如果单轴评级（3.5–3.14）与成对检查（3.15）衡量的是不同的东西，缺失组合中的子轴应呈随机分布。实际上，单独评级已为薄弱的子轴反复出现：E1a 计数居首，E4d、E6d、E2d、E7b 以及 E5b 中的无害部分均有出现。与它们并列的是部分研究的相邻子轴（E1b、E3a、E6c、E10a/b）。<\/p>\n<p>这种一致性是对方法的一项较弱但有用的检验：两轮独立分析、使用不同检索，指向问题空间中的相同区域。<\/p>"}, "p3-prevalence-against-emptiness": {"key": "p3-prevalence-against-emptiness", "eyebrow": "第三部分 · 结果", "title": "普遍性与空白程度", "bullets": ["每个点代表列表中的一个空白；颜色表示其层级", "<b>右上方<\/b>：实践中常见且文献中薄弱", "低普遍性的空白（设计、策略性机群）在<b>特定<\/b>场景中仍可能重要"], "notesTitle": "如何阅读该图", "notes": "<p>横轴为普遍性判断；纵轴为来自文献检查的空白程度。阴影区域为层级 A。落在同一格中的点堆叠显示。<\/p>\n<p>该图是表格的汇总，而非新证据。其价值在于表明层级划分主要由普遍性驱动：多数空白同样薄弱，区分它们的是该情形出现的频率。<\/p>"}, "p3-four-themes-about-methods-not-problems": {"key": "p3-four-themes-about-methods-not-problems", "eyebrow": "第三部分 · 横向主题", "title": "关于方法而非问题的四个主题", "bullets": ["<b>保证：<\/b>启发式方法与习得策略很少附带性能界", "<b>评估：<\/b>审查中最一致的抱怨（11 个来源中有 4 个）", "<b>方法特有：<\/b>LLM 规划器带来其特有的失效模式", "<b>伦理与信任：<\/b>当分配伤害到某人时由谁负责"], "notesTitle": "模型之外的主题", "notes": "<p>3.4 中的审查发现了一些不属于任何要素的条目，因为它们关乎方法而非问题本身。它们贯穿上述所有空白。<\/p>\n<ul><li><b>保证。<\/b>Nunes et al.（2017）呼吁为启发式与分散式调度器给出性能界；Salzman 和 Stern（2020）指出，已部署系统运行的规划器缺乏质量保证。基于学习与基于 LLM 的分配器进一步加剧了这一问题。<\/li>\n<li><b>评估。<\/b>共享平台（Nunes et al.）、评估标准（Rizk et al.）、贴近真实的测试平台与系统性比较（Mirsky et al.），以及统一的 LLM 基准（Li et al.）。文献检查反复发现，2024–2026 年的方法仅在仿真中评估，且一个开放团队基准最终只收到了一份提交。<\/li>\n<li><b>方法特有的失效。<\/b>Li et al.（2025）列举了基于 LLM 的多机器人系统中的幻觉、数值推理薄弱与延迟问题。<\/li>\n<li><b>伦理与信任。<\/b>Ali et al.（2022）提出了机器人向人分配工作时的问责、过度信任与信任校准问题。<\/li><\/ul>\n<p>任何针对层级 A 空白的工作也将以这些标准受到评判：新的形式化需要保证或令人信服的评估，最好两者兼具。<\/p>"}, "p3-what-this-derivation-cannot-claim": {"key": "p3-what-this-derivation-cannot-claim", "eyebrow": "第三部分 · 局限", "title": "本推导无法主张什么", "bullets": ["模型是一种<b>选择<\/b>：E8、E9 依判断加入，E10 由审查补入，E6e 在第二部分之后加入", "状态与普遍性评级均为<b>判断<\/b>，并附有依据", "多数证据停留在<b>摘要层面<\/b>；检索偏向近期 arXiv", "层级 A 的空白与<b>本演示文稿背后的研究兴趣<\/b>存在重叠"], "notesTitle": "局限的直白说明", "notes": "<ol><li><b>模型并不唯一。<\/b>E1–E7 遵循团队决策问题的结构；E8 与 E9 依判断加入，E10 在审查发现之前一直缺失。审查只能捕捉其十一个来源中提及的内容，因此可能还存在其他遗漏。后来确实又发现了一处：共享协议的假设在第二部分（2.3.11）中浮现，并作为 E6e 加入；审查的所有来源都未曾提出这一点。<\/li>\n<li><b>子轴部分受第二部分影响。<\/b>一些子轴来自对经典假设的否定，另一些来自前文综述的方法族，以及第一部分中表格失效的三种方式。换一个起点的演示文稿可能会有不同的表述。<\/li>\n<li><b>评级是判断。<\/b>“薄弱”“部分研究”与“研究充分”概括了检索的发现；普遍性是作者对某一情形出现频率的估计。两者均附有依据，便于读者对具体条目提出异议。<\/li>\n<li><b>证据深度。<\/b>图表展示了所引工作的核查方式；多数仅在摘要层面阅读。“未找到”的结论依赖于智能体进行的定向网络检索，这类检索偏向近期 arXiv 预印本，可能遗漏较早或付费墙后的工作。首次审查中缺失的两篇综述（Chakraa et al. 2023；Quinton et al. 2023）后来已通读全文；它们的开放问题都能映射到 E1–E10 或跨领域主题。项目中的阅读清单记录了哪些论文最可能改变这一图景。<\/li>\n<li><b>粒度。<\/b>成对检查在要素层面进行，并附子轴备注；未尝试完整的子轴成对矩阵（超过 600 对）。<\/li>\n<li><b>利益相关。<\/b>本演示文稿由研究“机器人加入运行中团队”的人员准备。早先的层级 A 结果（重塑系统的分配、需耗时获取的信息、任务中途变化的成员构成）与这一兴趣接近。分层排名现在被视为一次检索快照，3.16 的讲稿中补充了候选问题及其证伪结果，但部分子轴的措辞（例如 E4d 中的“瓶颈转移”，或 E6d 中的“信息需耗时获取”）仍可能反映这一视角。<\/li><\/ol>"}, "p4-six-reference-case-assumptions-one-lens-each": {"title": "六条参照情形假设，每条对应一个视角", "notesTitle": "从参照情形推导出这六条", "notes": "<p>仔细阅读 1.5 中的参照情形，会发现六条假设。每个视角放松其中一条；文献中没有任何一条是所有方法都假设的（2.7）。<\/p>\n<ol><li><b>① 免费信息。<\/b>分配之前效用表就已可用。了解一个机器人擅长什么、一项任务需要什么，是免费且即时的。<\/li>\n<li><b>② 一次性价值。<\/b>一个决策的价值是该次决策中各配对效用之和。至于系统此后会发生什么，则只字未提。<\/li>\n<li><b>② 替换计划。<\/b>输出取代团队当前正在做的一切。不存在“当前计划即基线”的概念。<\/li>\n<li><b>③ 完全控制。<\/b>求解问题的一方控制每一个机器人：要么直接控制，要么因为每个机器人都运行相同的算法。<\/li>\n<li><b>③ 共享协议。<\/b>机器人对消息的含义、出价的评分方式以及平局的打破规则达成共识。2.3.11 表明每种达成一致的方法都是如此；2.4.6 表明自组织是唯一避开这一点的经典流派。<\/li>\n<li><b>④ 给定问题。<\/b>团队、工作空间和收益都是输入。分配器只能在他人已固定的选项中进行选择。<\/li><\/ol>\n<p><b>与第三部分的联系。<\/b>各行按 3.2.2 引入的四组排列：什么是未知的、怎样才算帮上忙、谁知道什么并能决定什么，以及系统如何运行。最后一列列出每个视角所涉及的第三部分子轴；有些视角还涉及另一组（例如，受控智能体视角也关系到未知队友，E1b）。<\/p>\n<p><b>写作中发现的一个局限。<\/b>“共享协议”这一假设在第三部分最初的模型中没有对应的子轴：共享语义只是间接出现，即通过未知队友（E1b）和部分控制（E7a）。此后它已作为 E6e 加入，评为薄弱；4.10 记录了它是如何被遗漏的。<\/p>", "tag": "四组", "table": {"head": ["组", "参照情形假设", "放宽它的视角", "相关维度"], "rows": [["① 什么是未知的", "<b>免费信息<\/b>：分配前 U 已知或可计算", "P1 信息获取", "E6d · E2d · E3a"], ["② 怎样才算帮上忙", "<b>一次性价值<\/b>：目标是单次决策的 Σ U·x", "P2 流与瓶颈", "E4d · E5a"], ["", "<b>替换计划<\/b>：先优化，再部署新计划", "P3 保守改进", "E5b · E7b"], ["③ 谁知道什么、谁能决定", "<b>完全控制<\/b>：一个规划器或一套协议控制每个机器人", "P4 受控智能体视角", "E1a · E7b · E1b · E7a"], ["", "<b>共享协议<\/b>：所有机器人共享消息格式、评分与规则", "P5 协调接口", "E6e · E1b · E7a"], ["④ 何时执行、能否改系统", "<b>给定问题<\/b>：团队、布局与收益是固定输入", "P6 系统与激励设计", "E10c · E10a · E10b"]], "caption": "按第三部分的四组排列（3.2.2）；每个视角放宽一条假设，一个系统中可同时用到多个视角。"}, "eyebrow": "第四部分 · 视角"}, "p4-max-weight-throughput-optimal-scheduling": {"key": "p4-max-weight-throughput-optimal-scheduling", "eyebrow": "第四部分 · ② 价值 · P2 流与瓶颈 · 深入", "title": "最大权重 (max-weight)：吞吐量最优的调度", "bullets": ["每个时隙，服务<b>总权重最大<\/b>的可行集合", "对容量区域内的<b>每一个<\/b>到达率都稳定", "稳定性<b>并不<\/b>意味着短完工时间或小的时延尾部"], "notesTitle": "以状态为效用表的分配问题", "notes": "<p><b>模型。<\/b>队列中有 <code>X<sub>lj<\/sub>(t)<\/code> 个类别 <i>j<\/i> 的数据包；到达独立同分布，速率为 <code>a<sub>lj<\/sub><\/code>；服务者 <i>i<\/i> 以概率 <code>m<sub>i<\/sub><\/code> 成功。每个时隙，调度器从 𝒮 中选取一个激活向量，𝒮 为可同时激活的服务者集合。稳定是指队列过程保持有界（正常返）。<\/p>\n<p><b>策略。<\/b>服务者 <i>i<\/i> 的权重是其上游与下游队列的积压差乘以其成功率。调度器激活总权重最大的可行集合。在图中的单跳情形下，权重就是积压 × 速率：队列 2 被服务，尽管队列 3 更长，因为队列 2 的服务速度是其两倍。<\/p>\n<p><b>定理 3.2。<\/b>记 C′ 为能使流量严格位于 𝒮 凸包内部的到达率集合，则该策略的稳定区域包含 C′，且包含于 C′ 的闭包。换言之，除边界外，任何策略能稳定的到达率，max-weight 都能稳定。证明使用二次 Lyapunov 函数。定理 4.1 表明，在区域外，即使采用非平稳策略，积压也会无界增长（单类别、单位服务）。<\/p>\n<p><b>为何在此重要。<\/b>Max-weight 表明流视角并没有抛弃分配。它在每个时隙都求解一次分配，只是所用的表由系统拥塞实时重算，而非事先给定。<\/p>\n<p><b>哪些不能移植。<\/b><\/p>\n<ul><li>调度器是集中式的，需要所有队列长度。<\/li>\n<li>每个时隙的问题是最大权独立集，一般情况下为 NP 难（注 2）。<\/li>\n<li>成功率只取决于服务者，而不取决于（机器人，任务）配对；没有行驶或切换代价。<\/li>\n<li>保证只涉及吞吐量，未处理时延。在可容许负载下的队列稳定性，并不意味着最短完成时间、小的时延尾部，或每条样本路径上队列都有界。<\/li><\/ul>", "solves": "调度相互干扰的队列，使得只要某个策略能让网络稳定，网络就能稳定", "introNote": "Tassiulas 和 Ephremides 研究了链路相互干扰的多跳无线网络，其中只有特定的链路集合可以同时传输。他们寻求一种调度规则，使得对任何规则能处理的每个到达率，所有队列都保持有界。其答案即如今所称的 max-weight（最大权重）或 back-pressure（反压）调度，后来成为无线网络、交换机乃至机器人车队的标准工具。", "mathNotes": ["积压差 × 速率", "每个时隙", "定理 3.2"]}, "p4-bucket-brigades-a-line-that-balances-itself": {"key": "p4-bucket-brigades-a-line-that-balances-itself", "eyebrow": "第四部分 · ② 价值 · P2 流与瓶颈 · 深入", "title": "接力传递 (bucket brigades)：自我平衡的生产线", "bullets": ["<b>局部规则<\/b>会稳定到与速度成比例的工作区段", "顺序正确时，产出速率等于<b>所有速度之和<\/b>", "增加一名工人<b>绝不会降低<\/b>速率（定理 4）"], "notesTitle": "无需规划器的自平衡", "notes": "<p><b>模型。<\/b>生产线按工作量归一化为 [0, 1]。工人 <i>i<\/i> 的速度函数为 <code>v<sub>i<\/sub>(x)<\/code>，且有正的下界。状态是工人位置向量；一次交接循环将其映射到下一状态，<code>x<sup>(t+1)<\/sup> = f(x<sup>(t)<\/sup>)<\/code>。<\/p>\n<p><b>结果。<\/b><\/p>\n<ul><li><b>定理 1：<\/b>不动点总是存在。<\/li>\n<li><b>定理 2：<\/b>若工人按从最慢到最快排序（“i 比 j 慢”指 <code>sup<sub>x<\/sub> v<sub>i<\/sub>(x)/v<sub>j<\/sub>(x) &lt; 1<\/code>），则不动点唯一，且任意初始构型都收敛到它。<\/li>\n<li><b>定理 3：<\/b>在速度恒定且无阻塞时，收敛呈指数速度，工人 <i>i<\/i> 最终覆盖与其速度成比例的区段，产出速率等于各速度之和，即任何安排所能达到的最大值。<\/li>\n<li><b>定理 4：<\/b>在从慢到快的顺序下，增加一名工人或提高某人的速度绝不会降低速率。<\/li><\/ul>\n<p>若采用其他顺序，生产线可能出现排斥不动点或极限环，速率也可能差得多（§4–5）。<\/p>\n<p><b>为何是流视角的结果。<\/b>没有人计算分配。规则的动态过程自行分配工作，保证针对的是长期速率。图中速度为 1 : 2 : 3，对应区段分别占生产线的 1/6、1/3 和 1/2。<\/p>\n<p><b>哪些不能移植。<\/b>证明要求工人在生产线上每一点都按速度全序排列。在某些任务上快、另一些任务上慢的异构机器人会破坏这一条件。该模型只有一条串行流、相同的工件、瞬时返回，且速度确定。<\/p>", "solves": "在没有规划器、无需测量的情况下，在速度不同的工人之间平衡工作", "introNote": "Bartholdi 和 Eisenstein 分析了“接力传递”(bucket brigades)，这是工业中用于拣货线和装配线的一种运作方式。每名工人把一件工件向前推进；当最后一名工人完成时，所有人往回走，接手后一名工人手中的工件。他们研究的问题是：这一局部规则何时能自行平衡生产线。", "mathNotes": ["局部", "", "最大"]}, "p4-finding-the-bottleneck-from-a-running-line": {"key": "p4-finding-the-bottleneck-from-a-running-line", "eyebrow": "第四部分 · ② 价值 · P2 流与瓶颈 · 深入", "title": "从运行中的生产线找出瓶颈", "bullets": ["瓶颈 = 改进后<b>对吞吐量帮助最大<\/b>的机器", "可由<b>阻塞与饥饿<\/b>频率读出", "两台机器时精确成立；更多机器时是<b>经检验的规则<\/b>"], "notesTitle": "无需模型的诊断", "notes": "<p><b>定义。<\/b>在由效率为 <code>p<sub>i<\/sub><\/code> 的伯努利机器和有限缓冲区组成的串行线中，若产出速率对机器 <i>i<\/i> 最敏感，即对所有 <i>j ≠ i<\/i> 有 <code>∂PR/∂p<sub>i<\/sub> &gt; ∂PR/∂p<sub>j<\/sub><\/code>，则该机器是瓶颈。它并不总是最慢的机器。<\/p>\n<p><b>定理 2.1（两台机器）。<\/b>机器 1 是瓶颈，当且仅当它被阻塞的频率低于机器 2 饥饿的频率：<code>mb<sub>1<\/sub> &lt; ms<sub>2<\/sub><\/code>。两个频率都可在车间现场测得。<\/p>\n<p><b>更多机器。<\/b>图中的箭头规则：当 <code>mb<sub>i<\/sub> &gt; ms<sub>i+1<\/sub><\/code> 时，箭头从 <code>m<sub>i<\/sub><\/code> 指向 <code>m<sub>i+1<\/sub><\/code>，否则反向；没有箭头离开的机器即为瓶颈。对 M &gt; 2，该规则由仿真支持，论文也给出了反例。定理 4.1 在两个假设（单一瓶颈；缓冲区很少为空或满）下论证了一个较弱的结论。用作者的话说，多瓶颈规则没有解析依据。在 Li 和 Meerkov 的评估中，主瓶颈的识别正确率约为 72%。<\/p>\n<p><b>漂移瓶颈。<\/b>Roser 等人将不间断活跃期最长的机器称为瞬时瓶颈，并将重叠计为漂移。他们的活跃状态表明确包含 AGV。这是一种没有保证的启发式方法。<\/p>\n<p><b>相关性。<\/b>这些是为数不多能从系统自身行为读出其约束的工具。它们只做诊断，不做分配。第三部分的薄弱空白 E4d（分配会移动瓶颈）需要两者兼备：一个随机器人移动而更新的诊断，以及一个对诊断作出响应的分配。<\/p>", "solves": "利用生产线本来就会产生的数据定位其约束", "introNote": "生产工程师需要在不建立完整模型的情况下知道哪台机器限制了生产线。Kuo、Lim 和 Meerkov（1996）用灵敏度定义瓶颈，并证明可以从机器被阻塞或饥饿的频率中读出瓶颈。Roser、Nakano 和 Tanaka（2002）提出了一种更简单、经仿真检验的方法，基于不间断活跃期。Li 和 Meerkov（2009）在一本教科书中汇总了这些规则。", "mathNotes": ["速率的灵敏度", "阻塞 vs 饥饿", "M &gt; 2：经检验，未证明"]}, "p4-wald-s-sequential-probability-ratio-test": {"key": "p4-wald-s-sequential-probability-ratio-test", "eyebrow": "第四部分 · ① 未知 · P1 信息获取 · 深入", "title": "Wald 的序贯概率比检验", "bullets": ["累积证据；在<b>第一个决定性时刻<\/b>停止", "错误率由两个<b>阈值<\/b>控制", "期望代价 ≈ log(1/α) 除以一个<b>信息速率<\/b>"], "notesTitle": "最简形式的停止问题", "notes": "<p><b>设定。<\/b>观测 <code>x<sub>1<\/sub>, x<sub>2<\/sub>, …<\/code> 独立同分布，来自 <code>f<sub>0<\/sub><\/code> 或 <code>f<sub>1<\/sub><\/code>。只有一种实验，因此唯一的选择是何时停止。该检验累积对数似然比 <code>S<sub>n<\/sub><\/code>，当其离开区间 (log B, log A) 时停止。<\/p>\n<p><b>已证明的结论。<\/b><\/p>\n<ul><li>检验以概率 1 终止（3.11）。<\/li>\n<li>基本不等式（§3.2）：<code>α/(1−β) ≤ 1/A<\/code> 与 <code>β/(1−α) ≤ B<\/code>。采用实用取值 A = (1−β)/α 和 B = β/(1−α) 时，实际误差满足 <code>α′ ≤ α/(1−β)<\/code>、<code>β′ ≤ β/(1−α)<\/code> 以及 <code>α′ + β′ ≤ α + β<\/code>。由于随机游走会越过边界，它们并不恰好等于 α 和 β。<\/li>\n<li>期望样本量（§4.1）：<code>E[n] = E[S<sub>n<\/sub>]/E[z]<\/code>（Wald 恒等式），近似为 <code>[(1−γ) log B + γ log A]/E[z]<\/code>，其中 γ 为接受 H₁ 的概率。<\/li>\n<li>效率（§4.7）：任何具有相同错误率的序贯检验，平均所需观察次数都不少于该检验在无越界时所达到的界。精确最优性后来由 Wald 和 Wolfowitz（1948）证明。<\/li><\/ul>\n<p>当 α 和 β 较小时，<code>E₁[n] ≈ log(1/α)/KL(f₁‖f₀)<\/code>，<code>E₀[n] ≈ log(1/β)/KL(f₀‖f₁)<\/code>。Wald 并未使用 KL 这一术语；这些量是对数似然比的期望。<\/p>\n<p><b>哪些不能移植。<\/b>单一固定实验、两个简单假设、独立同分布数据。一个判断自己在哪里被需要的机器人，通常面对两个以上的选项，可以选择观察什么，而且所观察的系统会因它自身的存在而改变。只有当观测服从所假设的模型时，关于误差和样本量的结论才成立；相关的观测、会适应的队友或缺失的假设都会使名义置信度失效，而且这些都不是关于融入时间的界。<\/p>", "solves": "在给定错误率下，用尽可能少的观察在两个假设之间作出判断", "introNote": "Wald 在第二次世界大战期间为弹药验收检验发展了序贯分析，当时每一次检验都代价高昂。该检验不预先固定样本量，而是在每次观察后审视证据，一旦证据具有决定性便立即停止。1945 年的论文阐述了该检验、其误差界及期望样本量。", "mathNotes": ["", "否则继续观察", "§3.3", "α、β 较小"]}, "p4-choosing-what-to-observe": {"key": "p4-choosing-what-to-observe", "eyebrow": "第四部分 · ① 未知 · P1 信息获取 · 深入", "title": "选择观察什么", "bullets": ["选择能最快将真值与其<b>最近对手<\/b>区分开的实验组合", "Chernoff：当<b>代价 → 0<\/b> 时一阶最优", "最优臂识别：<b>上下界<\/b>相匹配"], "notesTitle": "信息速率决定观察什么", "notes": "<p><b>Chernoff（1959）。<\/b>状态 θ、实验 E、结果密度 <code>f(x, θ, E)<\/code>。随机化实验 λ 相对于备选集合 a(θ) 的信息数是一个零和博弈的值：实验者选择 λ 以最大化加权 KL 散度；自然选择最易混淆的备选。程序 A 用最大似然估计 θ，针对该估计运行极大极小实验，并在累积证据超过 log(1/c) 时停止。定理 1–2：风险为 <code>(1+o(1)) c log(1/c)/I(θ)<\/code>，且当 c → 0 时没有任何程序能在一阶意义上做得更好。假设：状态与实验均有限，且每个实验都能区分每一对状态。Chernoff 警告，当采样代价高昂时，由于“初始的笨拙摸索”(initial bungling)，该程序可能表现不佳。<\/p>\n<p><b>Naghshvar &amp; Javidi（2013）<\/b>将问题写为最小化 <code>E[τ] + L·P<sub>e<\/sub><\/code>，这是一个关于信念的动态规划。他们将假设放宽为“每一对状态都能被<i>某个<\/i>实验区分”，给出了下界，并证明一个两阶段策略是渐近最优的（推论 2）：<code>V* = Σ<sub>i<\/sub> ρ<sub>i<\/sub> log L / D<sub>i<\/sub> + o(log L)<\/code>。<\/p>\n<p><b>Garivier &amp; Kaufmann（2016）。<\/b>K 个臂来自指数族，且最优臂唯一。定理 1：每个 δ-正确策略都满足 <code>E[τ<sub>δ<\/sub>] ≥ T*(μ)·kl(δ, 1−δ)<\/code>，其中 <code>1/T*(μ) = sup<sub>w<\/sub> inf<sub>λ∈Alt(μ)<\/sub> Σ<sub>a<\/sub> w<sub>a<\/sub> d(μ<sub>a<\/sub>, λ<sub>a<\/sub>)<\/code>。Track-and-Stop 按最优比例 w* 采样，并用 Chernoff 规则停止；定理 14 给出了 δ → 0 时相匹配的上界（对伯努利臂可取 α = 1）。<\/p>\n<p><b>图示<\/b>展示了这一思想：每种观察方式以不同斜率累积证据；按正确比例混合它们，可获得相对于最近备选的最陡斜率，从而最早作出承诺。<\/p>\n<p><b>哪些不能移植。<\/b>答案是单个最优臂或假设，而非联合分配；观察代价与行驶无关；每次只有一个决策者在采样。在团队中，机器人并行观察，而观察往往意味着执行任务本身，因此有产出的工作与信息收集是交错进行的，而非先后进行（4.3）。速率 T* 和 I(θ) 只有在观测模型相匹配时才有意义。<\/p>", "solves": "既选择运行哪个实验，也选择何时停止", "introNote": "Chernoff（1959）将序贯检验推广到实验者在每一步可从多个实验中选择的情形。Naghshvar 和 Javidi（2013）为主动假设检验给出了非渐近界和两阶段策略。Garivier 和 Kaufmann（2016）解决了老虎机中的对应问题：以 1−δ 的置信度、用尽可能少的样本从 K 个选项中识别出最优者。", "mathNotes": ["Chernoff (4.2)", "代价 c → 0", "GK 定理 1", "Track-and-Stop"]}, "p4-information-as-a-cost-in-mrta-so-far": {"key": "p4-information-as-a-cost-in-mrta-so-far", "eyebrow": "第四部分 · ① 未知 · P1 信息获取 · 深入", "title": "MRTA 中迄今将信息视为代价的工作", "notesTitle": "全文显示了什么", "notes": "<p>第三部分的检索快照将 E6d 评为薄弱。下列全文是假设各不相同的相关证据；通信感知的即兴规划（Macke et al.）最为接近，应纳入任何基线集合。<\/p>\n<ul><li><b>Rossano et al.<\/b> 对任务是否需要额外能力的不确定性建模，该信息在任务到达后的固定时间揭示。拍卖通过对这些不确定性采样来估计期望奖励。没有任何动作用于选择观察什么或何时观察，也没有观察代价。<\/li>\n<li><b>Liang et al.<\/b> 最为接近：探索不确定区域是一个显式的分配选择，其代价是机器人行驶时间，与任务工作采用同一计量单位，目标为最坏情况遗憾。但观察在到达时是完美且免费的，没有信息价值计算，也没有停止规则，且仅在禁用遗憾剪枝时才具备完备性。<\/li>\n<li><b>Macke et al.<\/b> 通过比较查询的价值与代价来决定何时询问队友。这是一个短视规则，没有最优性结果，并假设队友在共享协议中如实回答（4.7.3）。<\/li>\n<li><b>Hollinger 和 Sukhatme<\/b> 在预算约束下规划使信息最大化的路径；信息是目标本身，而非用于分配的手段。<\/li>\n<li><b>Lerman et al.<\/b> 表明，机器人估计任务组成所用的窗口决定了一种权衡：窗口越长，变化后收敛越慢（Lerman et al.）；窗口越短，机器人切换越频繁（Jones &amp; Matarić）（4.6.3）。<\/li><\/ul>\n<p><b>缺少什么。<\/b>这样一种形式化：观察消耗机器人时间，多个机器人并行观察，答案是一个分配而非单个最优选项，且停止观察的决定具有 4.3.1–4.3.2 所提供的那类保证。<\/p>", "tag": "相关证据", "table": {"head": ["工作", "未知的是什么", "观察是一项决策吗？", "保证"], "rows": [["Rossano, Lim & How 2025", "任务是否需要额外能力", "否：在固定延迟后或随进展揭示", "收敛性与运行时间；无质量界"], ["Liang et al. 2026", "地图的部分区域", "是：可派空闲机器人去探索；代价计入完工时间 (makespan)", "计划满足规范；遗憾启发式，无最优性"], ["Macke, Mirsky & Stone 2021", "队友的目标", "是：若查询的价值超过其代价则询问", "短视规则；无最优性结果"], ["Hollinger & Sukhatme 2014", "环境场", "信息本身就是目标", "RIG-graph 渐近最优"], ["Lerman et al. 2006", "任务组成", "窗口长度 h 是设计参数", "收敛时间随 h 增长（模型）"]], "caption": "在这些工作中，没有一项用停止规则在观察时间与工作时间之间进行权衡（仅限本次检索）。"}}, "p4-ad-hoc-teamwork-the-challenge-and-a-formal-model": {"key": "p4-ad-hoc-teamwork-the-challenge-and-a-formal-model", "eyebrow": "第四部分 · ③ 信息与权限 · P4 受控智能体视角 · 深入", "title": "即兴协作：挑战与形式化模型", "bullets": ["挑战：成为<b>素未谋面<\/b>的智能体的好队友", "以众多团队上的<b>团队得分<\/b>来评判", "I-POMDP：对<b>世界及他者的模型<\/b>保持信念"], "notesTitle": "问题如何提出", "notes": "<p><b>挑战。<\/b>Stone et al. 将其表述为：“构建一个自主智能体，使其能够高效且稳健地与事先未知的队友协作，完成每个成员都能以团队成员身份各自做出贡献的任务。”他们强调“即兴团队智能体本质上是一个个体智能体”。<\/p>\n<p><b>评估方式。<\/b>从智能体池中抽取一个任务 <i>d<\/i> 和一个团队 <i>B<\/i>，移除一名成员，插入候选智能体，记录团队得分。重复多次；若智能体 a₀ 的总分高于 a₁，则 a₀ 是更好的即兴队友（见图）。团队必须具备基本能力：每个智能体都能为某个达到最低得分的团队做出贡献。<\/p>\n<p><b>挑战论文没有给出什么。<\/b>它是问题陈述和评估流程，而不是决策模型。角色选择只出现在文字示例中（急救助手与医生；顶替守门员的位置）。<\/p>\n<p><b>形式化模型：I-POMDP。<\/b>Gmytrasiewicz 和 Doshi 将交互状态定义为物理状态加上对其他智能体的模型。模型分为意向型（对方本身是具有信念和框架的理性智能体）和亚意向型（固定策略）。交互状态上的信念是充分统计量（命题 1）；有限嵌套 I-POMDP 的值迭代收敛到唯一不动点，且值函数分段线性且凸（定理 1–2）。求解在有限时域下为 PSPACE 难，在无限时域下不可判定，与 POMDP 相同。该框架是一般和的，其示例是双智能体老虎问题；其中既没有任务，也没有机器人。<\/p>\n<p><b>对 MRTA 而言<\/b>，这些工作给出了问题的形态（基于对他者信念的个体决策，并在群体上评估），但未涉及任务分配本身。<\/p>\n<p><b>在线即兴规划。<\/b>Wu、Zilberstein 和 Chen（2011，OPAT）借助蒙特卡洛树搜索和队友行为模型，与陌生队友逐步进行在线规划。因此，与未知队友的重复规划并非新问题；一项贡献必须指出额外的难点（1.6）。<\/p>", "solves": "无需预先协调即可与事先未知的队友协作", "introNote": "Gmytrasiewicz 和 Doshi (2005) 将 POMDP 扩展到存在其他智能体的场景：智能体同时对物理状态和他者的模型保持信念。Stone et al. (2010) 将即兴协作 (ad hoc teamwork) 作为一项挑战提出：构建一个能成为素未谋面的智能体之好队友的智能体，并以它对从群体中抽取的团队的帮助程度来评判。", "mathNotes": ["世界 × 他者", "命题 1", "Stone"]}, "p4-type-based-reasoning-plastic-and-when-beliefs-can-be-trusted": {"key": "p4-type-based-reasoning-plastic-and-when-beliefs-can-be-trusted", "eyebrow": "第四部分 · ③ 信息与权限 · P4 受控智能体视角 · 深入", "title": "基于类型的推理：PLASTIC，以及信念何时可信", "bullets": ["保留<b>过往队友<\/b>的模型；按预测准确度为其加权", "若真实类型在假设之中，<b>预测<\/b>会变得正确", "若不在其中，行为可能失败；需在线<b>检验<\/b>假设"], "notesTitle": "了解你的队友是谁", "notes": "<p><b>PLASTIC（Barrett et al.）。<\/b>队友从一组类型中抽取；智能体曾与以往的团队合作。PLASTIC-Model 用上述多项式权重规则更新对队友模型的信念，并用 UCT 进行规划；PLASTIC-Policy 在与以往团队学到的策略中进行选择。假设：共同目标、已知环境、无通信、队友不学习。在包含 40 多个未见团队的追捕域和包含七个团队的 RoboCup 2D 半场进攻中评估，它利用与过往队友的相似性快速适应。作者指出，若新队友与过往队友差异很大，它“可能表现得任意差”。<\/p>\n<p><b>信念与真相（Albrecht et al.）。<\/b>在具有假设类型 Θ* 的随机贝叶斯博弈中：<\/p>\n<ul><li>所有收敛结果都需要假设 1：真实类型在假设之中。<\/li>\n<li>定理 1（乘积后验）：在纯类型分布和正先验下，智能体对未来行为的<i>预测<\/i>会变得 ε-正确。它不必识别出类型（例 1），且该结果对混合类型分布不成立（例 2）。<\/li>\n<li>定理 2–3 给出其他后验收敛到真实类型分布的条件。<\/li>\n<li>当真实类型缺失时，第 6 节给出可离线检验的充分条件，在此条件下智能体仍能完成任务；“临界”假设空间可能使其陷入循环。<\/li>\n<li>第 7 节提出一种在线假设检验（基于得分函数的 p 值）；其准确性通过实验展示，常接近 100%。<\/li>\n<li>先验可能显著影响长期收益（实验结果，78 个重复博弈）。<\/li><\/ul>\n<p><b>对 MRTA 而言。<\/b>基于类型的推理是新成员估计队友行为的自然方式，而这些结果说明了何时可以信任它。所有实验均为仿真，队友是平稳的，决策是底层动作而非任务分配。<\/p>", "solves": "复用与过往队友合作所学，快速帮助新队友", "introNote": "Barrett et al. (2017) 构建了 PLASTIC：即兴智能体保留与以往团队合作学到的模型或策略，并按其对新队友的预测准确度加权。Albrecht、Crandall 和 Ramamoorthy (2016) 针对所有此类基于类型的方法提出了根本问题：信念何时收敛到正确的结果？若真实类型从未被假设，又会怎样？", "mathNotes": ["PLASTIC", "真实类型在假设之中", "并非：类型被识别"]}, "p4-open-teams-who-joins-who-adapts-who-chooses-tasks": {"key": "p4-open-teams-who-joins-who-adapts-who-chooses-tasks", "eyebrow": "第四部分 · ③ 信息与权限 · P4 受控智能体视角 · 深入", "title": "开放团队：谁加入、谁适应、谁选择任务", "notesTitle": "开放团队相关工作实际覆盖了什么", "notes": "<p>第三部分将 E1a（“成员在任务中途加入和离开”）评为薄弱，并将 Eck et al. 和 PLATO 列为最接近的工作。阅读全文后，这一判断更加明确。<\/p>\n<ul><li><b>Lerman et al. 和 Jones &amp; Matarić<\/b> 研究的机器人各自从滑动观测窗口估计任务构成，并据此切换任务类型。Lerman et al. 表明，任务构成变化后，当窗口较长时，收敛时间大致随窗口长度线性增长，且窗口还会引起延迟导致的振荡。Jones 和 Matarić 观察到，短窗口收敛更快，但切换更频繁。机器人是同构的，任务类型有两种，团队规模固定为 20；增减机器人被列为研究动机，但未经测试。<\/li>\n<li><b>Eck et al.<\/b> 允许智能体离开并重新进入，但“新智能体不会进入”。每个智能体为自身规划，对邻居样本建模并外推；定理 1 给出在给定误差下需要建模多少个邻居。<\/li>\n<li><b>GPL<\/b> 是这里唯一一项队友在回合内进出的工作，但场景为最多五个智能体的网格游戏。<\/li>\n<li><b>NAHT<\/b> 只在回合之间改变团队。<\/li>\n<li><b>PLATO<\/b> 用指针网络在任务之间选择，但所有智能体共享一个联合训练的策略；这是团队层面的设计，其开放性只是临时的退出与补位。<\/li>\n<li><b>SPL 替补赛 (drop-in competition)<\/b> 是唯一长期在实体机器人上进行的测试：三年间来自 30 个组织的 56 支参赛队。各队必须使用标准通信数据包，因此存在共享协议（即“共享协议”假设）。<\/li><\/ul>\n<p><b>结论。<\/b>在本综述的检索中，快照评级维持不变。OPAT（Wu, Zilberstein &amp; Chen, 2011）是在线即兴规划的又一直接前驱工作。将 GPL 加入最接近工作列表；需指出，尚无工作在实体机器人上同时结合任务中途加入、异构能力与任务选择。<\/p>", "tag": "相关证据", "table": {"head": ["工作", "谁适应", "开放性", "任务选择", "场景"], "rows": [["Lerman et al. 2006; Jones & Matarić 2003", "每台机器人，同一规则", "提及但未测试（N = 20）", "依据局部窗口选择任务类型", "仿真机器人，两种任务类型"], ["Eck et al. 2020", "每个智能体为自身规划", "离开并重新进入；无新智能体", "扑救哪一处火点", "仿真野火，≤ 50 个智能体"], ["Rahman et al. 2021 (GPL)", "一个学习者", "队友在回合中途进出", "隐式", "网格游戏，≤ 5 个智能体"], ["Wang et al. 2024 (NAHT)", "M 个智能体中的 N 个", "每回合采样一次团队", "隐式", "MPE、SMAC"], ["Saleh Abadi et al. 2026 (PLATO)", "一个共享策略，联合训练", "退出与补位循环", "基于任务的指针", "野火网格"], ["Genter, Laue & Stone 2017", "每台机器人", "每场比赛都有新队友", "足球角色", "实体 NAO 机器人，共享消息数据包"]], "caption": "异构机器人在任务中途加入并选择任务：未找到相关工作。"}}, "p4-conservative-bandits-learning-above-a-floor": {"key": "p4-conservative-bandits-learning-above-a-floor", "eyebrow": "第四部分 · ② 价值 · P3 保守改进 · 深入", "title": "保守老虎机：在下限之上学习", "bullets": ["先执行默认选项以<b>积累余量<\/b>，再用余量去探索", "该约束只在遗憾中增加一个<b>加性<\/b>项", "约束是累积的：单步仍可能很差"], "notesTitle": "不落后的代价", "notes": "<p><b>设定。<\/b>K 个臂外加一个均值为 μ₀ 的默认臂 0。学习者必须在每一轮都使累积平均奖励至少达到始终选择默认臂所得的 (1−α) 倍。保守 UCB（Conservative UCB）仅在剩余“预算”的悲观估计保持非负时才选择乐观臂，否则选择默认臂（图中的阶梯）。<\/p>\n<p><b>定理 2。<\/b>在奖励位于 [0, 1]、噪声为 1-次高斯且 μ₀ 已知的条件下，以至少 1−δ 的概率，约束在每一轮都成立，且遗憾为常规的 <code>√(nK log)<\/code> 项加上 <code>K log/(αμ₀)<\/code>。第二项不随 n 增长：安全只需付出常数代价。定理 5 处理 μ₀ 未知的情形；定理 9 表明，即使约束只在最后一轮施加，该加性项也不可避免。<\/p>\n<p><b>上下文扩展。<\/b>Kazerouni et al. 在线性上下文老虎机中针对基线<i>策略<\/i>施加同样的约束（CLUCB，定理 6），额外项为常数，但要求基线奖励有正的下界。<\/p>\n<p><b>仔细解读。<\/b>该保证是累积的、任意时刻的，而非针对每个动作：单次拉臂可能远差于默认臂。定理 2 假设奖励是随机的；论文还处理了对抗设定（定理 7 和推论 8），此时约束带来的额外代价更大。<\/p>\n<p><b>对机器人团队而言。<\/b>“臂”可以是新成员的选项，或团队的备选分配。在团队中，其他机器人会做出反应，因此臂不是平稳的；奖励在机器人之间相互耦合；而新成员甚至可能不知道自己的默认选项是什么。<\/p>", "solves": "探索新选项，同时收益始终不明显低于默认策略", "introNote": "Wu et al. (2016) 的动机来自这样一类公司：已在运行合理的默认策略，希望尝试替代方案，又不想让收入出现明显下滑。他们在老虎机问题中加入一个约束：累积奖励必须始终保持在默认策略累积奖励的固定比例之上。Kazerouni et al. (2017) 将其扩展到线性上下文老虎机。", "mathNotes": ["以 ≥ 1−δ 的概率", "定理 2", "定理 9"]}, "p4-safe-policy-improvement-from-data": {"key": "p4-safe-policy-improvement-from-data", "eyebrow": "第四部分 · ② 价值 · P3 保守改进 · 深入", "title": "基于数据的安全策略改进", "bullets": ["在一部分数据上挑选候选；在其余数据上<b>只检验一次<\/b>", "SPIBB：数据稀少处<b>照搬基线<\/b>", "新成员没有数据：安全意味着<b>照搬团队<\/b>"], "notesTitle": "先认证，再部署", "notes": "<p><b>HCPI。<\/b>若算法返回差于用户阈值 ρ₋ 的策略的概率至多为 δ，则称该算法“安全”。数据被划分为两部分：一部分用于提出候选，另一部分用重要性加权回报的置信下界对其检验一次；若下界超过 ρ₋，则返回候选，否则返回“未找到解”。只有集中不等式版本是完全安全的；t 检验和自助法版本依赖近似，因而是“半安全”的。除此之外，唯一的假设是环境为（平稳的）POMDP。迭代版本 Daedalus 将 ρ₋ 设为当前策略性能的估计值。<\/p>\n<p><b>Seldonian 算法<\/b>（Thomas et al., 2019）将其推广：在用户给定的约束下最大化目标，每个约束须以 ≥ 1−δ<sub>i<\/sub> 的概率成立。“相对当前策略不降低性能”就是这样一个约束。<\/p>\n<p><b>SPIBB。<\/b>在具有已知基线策略和一批数据的有限 MDP 中，出现次数少于 N∧ 的状态–动作对构成自举集 𝔅。新策略在 𝔅 上必须照搬基线，在其他位置可以优化。定理 2：以 1−δ 的概率，它是 ζ-近似安全改进，ζ 由计数和模型估计给出。去掉 𝔅 约束的变体（Π≤b-SPIBB、SPIBB-DQN）失去了该保证。<\/p>\n<p><b>图示<\/b>对比了拥有日志数据的团队（在计数高处改进）与新成员（所有计数为零，因此每个单元格都照搬基线）。对于加入团队的机器人，安全改进的答案退化为“像基线一样行动”，而这预设了该机器人存在一个基线。<\/p>\n<p><b>无分布假设的门控。<\/b>共形预测以更少的假设给出同类保证：若校准数据与测试点可交换，则预测集以至少 1−α 的概率包含真值（Angelopoulos &amp; Bates，定理 1）。该覆盖是边际的，而非条件的。Lindemann et al. (2023) 用它在其他智能体周围进行安全规划，但假设机器人不影响它们，而队友恰恰会产生影响。<\/p>", "solves": "仅当数据表明新策略不差于当前策略时才部署", "introNote": "Thomas et al. (2015) 希望得到从业者可以信任的强化学习：仅当以高置信度确认新策略至少达到选定阈值时，算法才返回该策略，否则回答“未找到解”。Laroche et al. (2019) 提出一种基于模型的替代方案，在数据稀少之处保持基线不变。", "mathNotes": ["否则：保持 π₀", "数据稀少则照搬", "以 1−δ 的概率"]}, "p4-designing-payoffs-distributed-welfare-games": {"key": "p4-designing-payoffs-distributed-welfare-games", "eyebrow": "第四部分 · ④ 运行与设计 · P6 系统与激励设计 · 深入", "title": "设计收益：分布式福利博弈", "bullets": ["设计<b>福利的分割方式<\/b>，而非任务指派", "边际贡献与 Shapley 规则：均衡存在，且<b>至少达到最优的 ½<\/b>", "需要<b>次模<\/b>福利；预算平衡与效率之间存在权衡"], "notesTitle": "收益设计能承诺什么、不能承诺什么", "notes": "<p><b>模型。<\/b>智能体选择资源集合；福利是各资源福利之和，<code>W(a) = Σ<sub>r<\/sub> W<sub>r<\/sub>({a}<sub>r<\/sub>)<\/code>。设计者为每个资源固定一个分配规则 <code>f<sub>r<\/sub><\/code>，规定使用该资源的每个智能体获得 <code>W<sub>r<\/sub><\/code> 中的多少。该规则只能依赖 <code>W<sub>r<\/sub><\/code>，且必须适用于设计者未知的动作集合。<\/p>\n<p><b>规则比较（表 1）。<\/b><\/p>\n<ul><li><b>平均分配<\/b>：预算平衡且计算廉价；仅当 <code>W<sub>r<\/sub><\/code> 是匿名的时才保证均衡存在。<\/li>\n<li><b>边际贡献<\/b>（wonderful life utility）：始终是以 W 为势函数的势博弈，因此均衡存在；但不满足预算平衡。<\/li>\n<li><b>Shapley 值<\/b>（及加权 Shapley）：均衡存在且规则预算平衡，但计算困难，需要大量信息。<\/li><\/ul>\n<p><b>效率。<\/b>若福利是次模的，且规则支付给每个智能体至少其边际贡献而不超支，则每个均衡至少达到最优福利的一半（命题 4，源自 Vetta 2002）。该界是紧的（例 1，图中的下方曲线）。在动作集合相同且福利匿名时，界提升至 n/(2n−1)（定理 2）。对于覆盖问题，一个非 Shapley 的预算平衡规则也能达到 ½（定理 3）。<\/p>\n<p><b>均衡与动态。<\/b>Marden 和 Wierman 分析的是均衡，而非智能体如何达到均衡；他们指出，一般情况下寻找纳什均衡不是多项式时间可解的。Marden、Arslan 和 Shamma 给出了学习结果：在对数线性学习下，平稳分布正比于 <code>exp(β·φ)<\/code>，当 β → ∞ 时集中于势函数的最大化点（定理 3.1）。他们的示例是一致性问题与传感器覆盖。<\/p>\n<p><b>对 MRTA 而言。<\/b>收益设计给出了本部分最清晰的保证，但仅适用于可按资源分离且次模的福利。带有行程、时序和互补能力的任务分配常常同时违反这两点。<\/p>", "solves": "选择局部效用，使自利的最优响应带来良好的团队福利", "introNote": "Marden、Arslan 和 Shamma (2009) 主张协同控制可以设计为一个博弈：给每个智能体一个与全局目标一致的局部效用，使简单的学习即可找到好的结果。Marden 和 Wierman (2013) 探讨了哪些在智能体之间分割福利的方式，能在事先不知道智能体动作集合的情况下，保证均衡存在且高效。", "mathNotes": ["规则 f<sub>r<\/sub> 即为设计对象", "命题 4（Vetta）", "紧（例 1）"]}, "p4-designing-the-team-and-the-workspace": {"key": "p4-designing-the-team-and-the-workspace", "eyebrow": "第四部分 · ④ 运行与设计 · P6 系统与激励设计 · 深入", "title": "设计团队与工作空间", "bullets": ["团队设计：<b>多样性度量<\/b>可预测难度", "互补性越强 → 收敛<b>越慢<\/b>", "布局搜索：<b>可扩展性提升 2 倍<\/b>，任务随机分配"], "notesTitle": "度量、搜索，以及尚未被设计的部分", "notes": "<p><b>基于特质的团队（Prorok et al.）。<\/b>S 个物种、U 个二值特质、物种–特质矩阵 Q；X(t) 表示每个物种在每项任务上的机器人数，Y = XQ 为特质分布。每个物种遵循设计好的转移速率（同 2.4.4）。目标是尽快精确达到（G₁）或至少达到（G₂）目标特质分布。<\/p>\n<ul><li>多样性用<b>最小物种基数（minspecies cardinality）<\/b>度量：能构造出所有可达特质分布的最小物种集合。对精确匹配，它等于 rank(Q)（eigenspecies，命题 1）；对“至少达到”的匹配，它是一个最小集合覆盖（coverspecies，命题 2）。<\/li>\n<li><b>发现（经验性，图 7）：<\/b>收敛时间随最小物种基数增大而增加。用作者的话说，“机器人群体越多样，就越难优化”。加入冗余物种会使分配更容易。<\/li>\n<li>多样性只是被度量，而非被设计；如何选择 Q 或各物种的数量仍是开放问题。<\/li><\/ul>\n<p><b>STRATA<\/b> 将模型扩展到高斯特质，并加入方差约束；其结论指出最优性保证仍未解决，利用多样性来合成团队则留作未来工作。基于协同图（synergy graph）的团队组建（Liemhetcharat &amp; Veloso, 2012）通过观察学习成对兼容性；在加权版本中寻找最佳团队是 NP 难的，采用模拟退火求解。<\/p>\n<p><b>布局设计（Zhang et al., 2023）。<\/b>决策变量是哪些栅格单元放置货架、端点或留空；吞吐量取终身路径规划仿真的平均值；搜索采用带修复步骤的质量–多样性（quality-diversity）方法。核心结论：优化后的布局使一个规划器（RHCR）在出现拥堵前可承载的机器人数量翻倍，在某一设置中从不足 150 台增至 300 台以上。机器人数量较少时吞吐量相近。任务分配始终是均匀随机的。后续工作学习布局生成器，可扩展到含 2,350 台机器人的地图。<\/p>\n<p><b>空白。<\/b>团队与布局的设计都将分配器固定且保持简单。联合优化分配器与设计（E10c）仍是开放问题。<\/p>", "solves": "选择团队成员或物体位置，使分配变得更容易", "introNote": "Prorok、Hsieh 和 Kumar（2017）用物种与二值特质描述异构集群，并研究团队多样性如何影响达到期望特质分布的速度。Ravichandar et al.（2020）将其扩展到连续且不确定的特质（STRATA）。Zhang et al.（2023）在环中加入路径规划器，对仓库布局进行搜索以提高吞吐量。", "mathNotes": ["每项任务的机器人数 × 每个物种的特质", "eigenspecies（精确匹配）", "coverspecies（至少达到）", "仿真，QD 搜索"]}, "p4-zero-shot-coordination-what-is-still-shared": {"key": "p4-zero-shot-coordination-what-is-still-shared", "eyebrow": "第四部分 · ③ 信息与权限 · P5 协调接口 · 深入", "title": "零样本协调：哪些仍是共享的", "notesTitle": "从机器人视角解读零样本协调文献", "notes": "<p><b>Other-play。<\/b>在一个作为共同知识的合作博弈中，对称性 Φ 是对状态、动作和观测的重新标记，且不改变博弈本身。自博弈（self-play）可能收敛到众多等价惯例中的任意一个；other-play 最大化与经对称重标记的副本对局时的期望回报 <code>E<sub>φ∼U(Φ)<\/sub>[J(π¹, φ(π²))]<\/code>，因此无法依赖任意的标签。命题 2 表明，当状态和动作不带标签时，它是可能达到的最佳元均衡。在 Hanabi 中，独立训练的智能体之间的交叉配对表现大幅提升；一项 20 人的人类研究也更青睐它，但作者指出它并非“银弹”。<\/p>\n<p><b>离信念学习（off-belief learning）<\/b>将伙伴过去的动作解释为来自固定的基础策略 π₀，从而消除隐藏惯例。在有界的回合制博弈中，所得策略是唯一的，因此独立训练的智能体可以零样本协调（定理 1、推论 1）；在同时行动的情形下，唯一性不再成立。<\/p>\n<p><b>虚拟协同博弈（fictitious co-play）<\/b>训练对一个冻结的自博弈智能体池及其早期检查点的最优响应；在与真人进行的 Overcooked 实验中（n = 114），它得分最高且更受偏好。去掉早期检查点会使性能大幅下降。<\/p>\n<p><b>规则与惯例。<\/b>Shih et al. 将策略分解为依赖任务的规则模块和依赖伙伴的惯例模块。适应一个<i>新<\/i>伙伴仍需微调；零样本迁移只适用于已知伙伴面对新任务的情形。<\/p>\n<p><b>Carroll et al.<\/b> 表明，仅与其他智能体一起训练的智能体与人类合作时表现较差，而人类模型有所帮助，但对真人的帮助弱于仿真中。<b>ProAgent<\/b> 用语言模型推断意图，并在队友行为与预期不符时修正信念；在两个布局中，它作为其中一方玩家时最强，作为另一方时则不然。<\/p>\n<p><b>对于来自不同构建方的机器人。<\/b>关键在最后一列：每种方法都用另一种共享假设替代了共享协议。这些假设中哪些在真实的机器人厂商之间是合理的，仍是开放问题。<\/p>", "tag": "交叉配对（cross-play）", "table": {"head": ["方法", "思路", "证据", "仍然共享的"], "rows": [["Other-play（Hu et al. 2020）", "与经对称重标记的伙伴一起训练，使任意惯例无法形成", "Hanabi 交叉配对；小规模人类研究（n = 20）", "博弈本身、其对称性 Φ、学习规则"], ["离信念学习（Hu et al. 2021）", "将伙伴过去的动作视为来自固定的基础策略", "Hanabi；独立运行之间的零样本协调", "基础策略 π₀、仿真器"], ["虚拟协同博弈（Strouse et al. 2021）", "对自博弈智能体池及其检查点做最优响应", "与人类进行的 Overcooked 实验（n = 114）", "仿真器与动作空间"], ["规则与惯例（Shih et al. 2021）", "将任务规则与伙伴特定的惯例分离", "老虎机、积木摆放、一个 Hanabi 变体", "领域本身；伙伴身份已知"], ["了解人类（Carroll et al. 2019）", "对行为克隆得到的人类模型做最优响应", "与人类进行的 Overcooked 实验", "来自数据的人类模型"], ["ProAgent（Zhang et al. 2024）", "由 LLM 通过观察推断队友意图", "Overcooked，对比其他算法与克隆的人类", "手写的知识库、语言落地（grounding）"]], "caption": "对未见伙伴的鲁棒性有所提升，但每种方法都依赖某种在设计时就共享的东西。"}}, "p4-the-watch-channel-implicit-signals-legibility-stigmergy": {"key": "p4-the-watch-channel-implicit-signals-legibility-stigmergy", "eyebrow": "第四部分 · ③ 信息与权限 · P5 协调接口 · 深入", "title": "“看”通道：隐式信号、可读性、环境介导协调", "bullets": ["动作与环境痕迹无需消息格式即可<b>携带信息<\/b>", "可读的运动让他人<b>更早<\/b>推断出你的目标", "三者仍都假设某种<b>共同基础<\/b>"], "notesTitle": "无需协议即可读出的信息", "notes": "<p><b>环境介导协调（stigmergy）。<\/b>Grassé 的定义：一个刺激性构型触发某个工作个体的动作，该动作将其变为新的构型，新构型又可能触发同一个体或任何其他个体的动作。Theraulaz 和 Bonabeau 区分了<i>定量<\/i>环境介导协调——刺激只在强度上不同，改变的是响应的概率（信息素路径；2.4 中的响应阈值）——与<i>定性<\/i>环境介导协调——不同构型触发不同动作（胡蜂筑巢）。他们强调，仅靠环境介导协调无法解释协调，必须有另一种机制加以补充。它假设个体对相同刺激做出相同响应：实际上是整个物种共享了协议。<\/p>\n<p><b>可读性。<\/b>可预测的运动是观察者对已知目标所预期的运动，即观察者代价 C 下的最低代价路径。可读的运动则让观察者能快速推断出目标，即上述积分，其权重 f(t) 偏重较早时刻。在一项有 432 名参与者观看视频的在线研究中，可读轨迹使目标更易推断；可预测性对点状机器人和人类手臂成立，但对 HERB 机器人不成立，因为其预期运动不同。机器人必须知道观察者的代价和候选目标。<\/p>\n<p><b>隐式通信。<\/b>Knepper et al. 给出了一个完成任务的动作同时传递某个事实的条件：在共同基础下它必须出人意料，在该事实成立时更可能出现，并且指向该事实多于指向其他事实。解码与编码都是贝叶斯式的（式 1–2）。该论文提供了框架与案例研究，没有新实验；它假设参与者对可用动作、共同基础和动作似然达成一致，作者自己也承认这一假设对陌生人而言或许过强。<\/p>\n<p><b>对 MRTA 而言。<\/b>“看”通道是来自不同构建方的机器人无需就消息达成一致即可协调的途径，也是自组织流派现有的工作方式。缺少的是这样一种任务分配表述：信号就是任务选择本身，由彼此不共享对方模型的机器人来解读。<\/p>", "solves": "让功能性动作和对环境的改变携带信息", "introNote": "Theraulaz 和 Bonabeau（1999）从 Grassé 对白蚁的研究出发，梳理了环境介导协调（stigmergy）——即通过修改共享环境进行协调——这一思想的源流。Dragan、Lee 和 Srinivasa（2013）形式化了可读的机器人运动，使观察者能及早推断机器人的目标。Knepper et al.（2017）给出了一个框架，说明联合任务中的普通动作如何携带隐式信息。", "mathNotes": ["Grassé", "及早推断目标", "Knepper et al.，式 1"]}, "p4-talk-or-watch-when-asking-is-worth-it": {"key": "p4-talk-or-watch-when-asking-is-worth-it", "eyebrow": "第四部分 · ③ 信息与权限 · P5 协调接口 · 深入", "title": "“说”还是“看”？何时值得询问", "bullets": ["观察能<b>免费<\/b>揭示队友的目标，但要等到最终", "询问只在一个<b>窗口<\/b>内有用：仍有歧义，且仍值得改变计划", "两篇论文都假设在<b>共享协议<\/b>下得到如实回答"], "notesTitle": "两条通道之间的选择", "notes": "<p><b>最坏情况可区分度（worst-case distinctiveness）。<\/b>当队友朝若干目标之一前进时，wcd 是其动作在两个目标之间能保持歧义的最长时间。过了这一点，观察即可无代价地揭示目标。而在智能体自身的计划分叉之前（智能体的 wcd），答案还无关紧要。<\/p>\n<p><b>Mirsky et al.（2020）<\/b>将有用询问窗口定义为这两个条件的交集，并将关键询问点定义为该窗口的第一个时刻。在 100 个实例中，在该窗口内任意时刻询问，相比完美计划多花 3.65 步，而次优策略要多花 7.25 步。<\/p>\n<p><b>Macke et al.（2021）<\/b>将一次询问的价值定义为计划的期望改进，并研究价值何时超过代价。该规则是短视的；论文证明的是期望分叉点满足的 Bellman 方程，而非询问策略的最优性。<\/p>\n<p><b>假设。<\/b>两篇论文都假设队友在双方共享的通信协议中如实、无噪声地回答，并且队友行为最优、完全可观测。对于来自不同构建方的机器人，“说”通道可能只能使用自然语言（2.3.10），无法保证回答被理解或可靠。<\/p>\n<p><b>为何归入 P5。<\/b>在“说”与“看”之间的选择本身就是一个信息优先的决策（P1）：每条通道都以一定代价换取信息，正确的选择取决于观察需要多久才能变得有信息量。目前未找到以这种方式表述任务分配的 MRTA 工作。<\/p>", "solves": "决定是否以及何时询问队友，而不是从其行为中推断", "introNote": "Mirsky et al.（2020）研究了一个即兴协作（ad hoc teamwork）智能体：它可以持续观察队友以推断其目标，也可以付出代价直接询问。他们确定了提问仍能改变计划的时间窗口。Macke、Mirsky 和 Stone（2021）将其推广为规划过程中询问的期望价值。", "mathNotes": ["仍有歧义，仍然有用", "若为空则为 −1", "Macke et al."]}, "p4-combinations-what-exists-and-what-is-missing": {"key": "p4-combinations-what-exists-and-what-is-missing", "eyebrow": "第四部分 · 综合", "title": "组合：已有的与缺失的", "notesTitle": "范式交汇之处", "notes": "<p>六种范式并不互斥。已有若干研究方向组合了其中两种，而空白单元格集中在三种及以上范式交汇之处。<\/p>\n<ul><li><b>已有研究的组合对。<\/b>设计与流在布局优化中交汇；局部规则与流在阈值模型和水桶接力（bucket brigades）中交汇；信息与个体视角在基于类型的即兴协作中交汇；个体视角与无协议在零样本协调中交汇；信息与安全在保守探索和安全探索中交汇。<\/li>\n<li><b>本次检索中尚无研究的组合对。<\/b>在此未找到任何论文要求新成员在保证不造成损害的前提下改进团队；在安全改进框架中，没有数据的机器人只能复制基线，而它可能根本没有基线。<\/li>\n<li><b>更大的组合。<\/b>一个读取运行中系统（流）、为其观测付出代价（信息）、只为自身行动（个体）且不能依赖共享消息（无协议）的机器人，同时触及 E4d、E6d 和 E1a。各组成部分都已单独存在：基于阻塞与饥饿频率的瓶颈检测、局部任务组合估计、带停止规则的序贯检验、在线即兴规划（OPAT）以及通信感知规划。本综述未发现它们在异构机器人上被结合起来；这是关于本次检索的陈述，而非关于整个领域的陈述。<\/li>\n<li><b>环境作为通道。<\/b>环境介导协调与可读性提示我们可以设计使意图可读的工作空间或行为；二者都尚未针对来自不同构建方的机器人进行工程实现。<\/li><\/ul>\n<p>表中列出的是组合，而非建议。每一行都可以从多个方向展开，也可以加入其他行。<\/p>", "tag": "相关证据", "table": {"head": ["组合", "代表性工作", "缺失之处"], "rows": [["P2 + P6：面向流的设计", "以吞吐量为目标的布局搜索（Zhang et al. 2023）", "分配器保持固定；没有保证"], ["P2 + P4：跟踪需求的局部规则", "响应阈值；Lerman et al. 2006；水桶接力", "同构或按速度排序的机器人"], ["P1 + P4：通过观察推断队友", "PLASTIC；基于类型的信念（Albrecht et al.）", "未权衡观察时间与工作时间"], ["P4 + P5：无协议的即兴团队", "GPL；NAHT；虚拟协同博弈；ProAgent", "实体机器人；显式任务分配"], ["P1 + P3：学习而不造成损害", "保守老虎机；SafeOpt；SPIBB", "耦合的机器人；会变动的基线"], ["P3 + P4：不得损害团队的新成员", "本综述中未找到", "没有数据时，安全性退化为复制基线"], ["P1 + P2 + P4 + P5：读取运行中的系统并据此行动", "零散部分：瓶颈检测、局部估计、序贯检验、OPAT、通信感知规划", "本综述中未发现其结合；参见候选问题（3.16）"], ["P5 + P6：携带信号的环境", "环境介导协调；可读的运动", "面向来自不同构建方的机器人的设计"]], "caption": "相关证据，而非经认证的空白；各行并非穷尽。"}}, "p1-multi-robot-task-allocation-from-the-problem-up": {"key": "p1-multi-robot-task-allocation-from-the-problem-up", "eyebrow": "第一部分 · 第一性原理", "title": "多机器人任务分配：从问题本身出发", "sub": "在比较算法之前：任何分配器必须知道什么？而这个领域又默认自己已经知道了什么？", "notesTitle": "这套幻灯片的目的", "notes": "<p>本综述从问题本身而非算法目录出发，梳理多机器人任务分配 (multi-robot task allocation, MRTA)。本文是叙述性综述，不是系统综述，也不是穷尽式的新颖性评估。目标是看清：问题的哪些部分领域已下足功夫，哪些部分被假设掉了，以及换一种问题框架可能在哪里带来收益。<\/p>\n<p>任务分配问的是团队应如何分配工作。在运行中的系统里，这一决策还取决于机器人知道什么、可以改变什么，以及哪些工作已在执行中。挑战在于识别在特定设定中哪些特征真正重要，然后选择合适的模型。<\/p>\n<p>全篇分为四部分，沿同一条主线展开：<\/p>\n<ol><li><b>第一部分<\/b>把分配拆成任何分配器都必须回答的五个问题。<\/li>\n<li><b>第二部分<\/b>把经典方法流派对应到这五个问题上。<\/li>\n<li><b>第三部分<\/b>逐一审视这五个问题，寻找空白。<\/li>\n<li><b>第四部分<\/b>讨论领域中被低估的视角。<\/li><\/ol>\n<p>图中是最经典的画面：左边是机器人，右边是任务，分配就是在两者之间选择连边。后文大部分内容都在追问：这些边上的数值从何而来。<\/p>\n<div class=\"key\"><span class=\"lbl\">核心论点<\/span>固定的机器人–任务评分表（即图中的画面）是一个有用的起点，但它并不是整个 MRTA 文献的定义。涉及学习、通信、规划与执行的扩展早已存在；可信的贡献必须明确它所处理的额外假设或假设组合。<\/div>"}, "p1-every-allocator-answers-five-questions": {"key": "p1-every-allocator-answers-five-questions", "eyebrow": "第一部分 · 第一性原理", "title": "每个分配器都要回答五个问题", "bullets": ["<b>Q1 任务：<\/b>有哪些工作？它们从何而来？", "<b>Q2 能力：<\/b>谁能做什么？", "<b>Q3 效用：<\/b>一个机器人–任务配对值多少、代价多少？", "<b>Q4 机制：<\/b>由谁决策？按什么规则？", "<b>Q5 动态：<\/b>世界变化时怎么办？"], "notesTitle": "快递站类比", "notes": "<p>设想一个快递站：有一堆包裹（任务）、几名快递员（机器人），还有一个调度员决定谁送哪件。无论调度员的方法多巧妙，都绕不开五个问题：<\/p>\n<ol><li><b>有哪些工作？<\/b>包裹清单是早上就定好的，还是不断有新包裹到达？<\/li>\n<li><b>谁能做什么？<\/b>有的快递员骑电动车，有的步行。<\/li>\n<li><b>一个配对值多少？<\/b>距离、时间、成功概率。<\/li>\n<li><b>谁来决定、怎么决定？<\/b>调度员指派、快递员抢单，或者各自随机应变。<\/li>\n<li><b>情况变了怎么办？<\/b>有人请病假、来了加急件、某条路封了。<\/li><\/ol>\n<h4>“谁做什么？”是必要的，但通常并不充分<\/h4>\n<p>在选择求解器之前，先定义决策。调度员的问题处在四个相互耦合的决策之中：<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_decisions\"><\/div>\n<p><b>分解<\/b>把目标转化为任务；<b>分配<\/b>指定责任归属；<b>调度<\/b>安排工作的顺序与时间；<b>运动与操作规划<\/b>决定如何执行。具体应用可以联合求解这些决策、在它们之间交替进行，或接受一个近似的接口。<\/p>\n<p>一个简单的<b>参照情形<\/b>使用已知代价 <code>c_ij<\/code> 和二元指派变量 <code>x_ij<\/code>。在一对一约束下最小化 <code>Σ c_ij x_ij<\/code>，即得到线性指派（见 1.5 及其算例）。用快递站的话说，包裹清单、快递员的能力和每个配对的价值都已事先确定，只剩调度员的规则有待选择。当工作已经定义、代价有意义且所选指派之间不会互相使对方失效时，这一模型是合适的。<\/p>\n<p>时间先后约束、联盟、共享资源、不确定的结果以及依赖路径的代价都会改变问题的建模。一般化的版本在计算上可能是困难的，但“除一对一指派外一切都是 NP-hard”的说法过于宽泛：复杂度取决于具体的问题类别与编码方式，而非分类标签。Gerkey 和 Matarić 证明的是他们对各类别所给建模的困难性（1.3），其他编码方式或特殊结构可能表现不同。<\/p>\n<div class=\"key\"><span class=\"lbl\">核心论点<\/span>每篇 MRTA 论文都可以读作对这五个问题的一组特定假设。按假设来比较论文，往往比按算法比较更能说明问题。<\/div>\n<div class=\"key\"><span class=\"lbl\">贯穿示例<\/span>一个仓库团队经由一条共享通道把货物运往打包工位。一台新机器人到来。如果任务、能力和路径都已知，且重新分配得到授权，这可能只是一个普通的重新调度问题。如果新成员无法查看团队的队列，也不能改变团队的承诺，那么即使物理上是同样的机器人，也会产生一个不同的决策问题。<\/div>"}, "p1-where-the-reference-table-falls-short": {"title": "参照效用表的不足之处", "bullets": ["<b>缺失：<\/b>新成员的那一行可能是空的，也可能已经已知", "<b>不确定：<\/b>数值只能估计，而估计本身要花时间", "<b>耦合：<\/b>分配本身会改变这些数值", "属于哪种情形必须<b>明确说明<\/b>，而不能默认假设（见讲稿）"], "notesTitle": "为什么这个隐含假设对我们很重要", "notes": "<p>上一页的参照情形会以三种不同方式失效：<\/p>\n<ul><li><b>缺失。<\/b>新成员加入一个已在工作的团队。它在表中的那一行可能是空的，包括它自己在内，谁都还不知道怎么填；在另一些设定中，这一行已经已知，例如来自声明的规格说明。<\/li>\n<li><b>不确定。<\/b>能力和代价只能估计，例如通过观察。获得更好的估计需要时间，而团队在此期间仍在工作，因此信息是有代价的。<\/li>\n<li><b>耦合。<\/b>一个机器人做什么，会改变其他机器人可做之事的价值。如果某个工位过载，去那里帮忙比做你名义上最擅长的任务更有价值。<\/li><\/ul>\n<p>属于哪种情形必须明确说明，而不能默认假设，而用来说明它的术语却常常含混不清。尤其是以下四个术语常被混用：开放团队、即兴协作、在线重新规划和去中心化决策。每个描述的是不同的性质，任何一个都不蕴含其他几个。<\/p>\n<table class=\"cmp\"><thead><tr><th>术语<\/th><th>改变的是什么？<\/th><th>哪些并不自动成立？<\/th><\/tr><\/thead><tbody><tr><td>开放团队<\/td><td>成员构成可在运行期间变化<\/td><td>新成员不一定具有未知的能力或不兼容的策略<\/td><\/tr><tr><td>即兴协作<\/td><td>智能体在事先未共同设计协调策略的情况下进行合作<\/td><td>零通信、零共享语义，或不存在原有团队的调度器<\/td><\/tr><tr><td>在线重新规划 / 计划修复<\/td><td>随着状态、信息或约束的变化修订决策或计划；修复会复用已有计划<\/td><td>队友不熟悉；反应式策略无需显式计划也能适应<\/td><\/tr><tr><td>去中心化决策<\/td><td>信息或决策分布在各智能体之间<\/td><td>没有共享协议或已知模型；优化本身不必集中进行<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">开放成员、即兴协作（ad hoc teamwork）、重新规划与去中心化是不同的性质。“即兴重新规划”本身并不是一个空缺的类别（OPAT、PLASTIC）。<\/p>\n<p><b>即兴规划器早已在执行中反复规划。<\/b>OPAT（Wu, Zilberstein &amp; Chen, 2011）明确研究了即兴团队的在线规划，PLASTIC（Barrett et al., 2017）则利用过去队友的模型来调整行为（4.6.2）。因此，“即兴重新规划”本身并不是一个空缺的类别。所提出的贡献必须指明一个额外的难点，例如代价高昂的信息、持续存在的承诺或受限的干预；这些正是上面不确定与耦合两种情形的精确表述。<\/p>\n<p><b>分布式优化是一个反例<\/b>，反驳了“优化需要集中控制”的说法：共识 ADMM（Shorinwa et al., 2023）以及 2.3.7 中的分布式拍卖、单纯形和匈牙利方法都无需中央求解器即可求解指派问题。<\/p>\n<p>厘清这些区分之后，本综述关心的情形，即新成员中途加入，可能同时处于这三种失效情形之中。这正是与“先观察，再帮忙”(watch, then help) 方向的联系：在这一设定中，新成员面对的是一张尚未填好的表，它必须在团队持续运转的同时把表填上。<\/p>\n<h4>明确信息与权限契约<\/h4>\n<p>对于仓库示例，在选择集中式或分布式算法之前，先定义一个显式接口。原有团队可以有自己的调度器，而新成员只控制自身的行动。这一设定是否属于即兴协作，取决于事先建立了何种协调，而不取决于服务器的数量。<\/p>\n<table class=\"cmp\"><thead><tr><th>需要明确的内容<\/th><th>一个具体例子<\/th><\/tr><\/thead><tbody><tr><td>共享语义<\/td><td>任务标识符、单位、能力描述符、地图坐标和消息含义<\/td><\/tr><tr><td>初始可用信息<\/td><td>公开的目标与地图；工作队列的部分视图；声明的而非完全已知的能力<\/td><\/tr><tr><td>询问与观察<\/td><td>队列摘要、当前承诺或任务状态；延迟、带宽，以及请求能否被拒绝<\/td><\/tr><tr><td>权限<\/td><td>仅可自我指派；提议需经对方接受；或有权重新分配整个团队<\/td><\/tr><tr><td>执行契约<\/td><td>哪些行动可被中断、哪些预约会过期、交接如何变得具有约束力<\/td><\/tr><tr><td>回退方案<\/td><td>在信息或协议尚未到位时，一个明确的原有团队策略和一个可行的新成员行为<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">计算在何处运行，与已知什么、谁可被控制，是两回事。<\/p>\n<p>正是这份契约决定了三种失效情形中哪一种真正存在。新成员的那一行是否<b>缺失<\/b>，取决于共享语义和初始可用信息。它会保持多大程度的<b>不确定<\/b>、使之更精确要付出多少代价，取决于允许哪些询问与观察，以及其延迟与带宽。<b>耦合<\/b>是可以加以利用还是只能被动承受，取决于权限与执行契约：仅可自我指派的新成员只能围绕团队的承诺进行调整，而获准提议或重新分配的新成员则可以改变这些承诺。<\/p>\n<div class=\"key\"><span class=\"lbl\">不要人为制造难度<\/span>不要通过扣留本可免费获得的信息来制造问题。如果原有团队能以低成本传送一份足够的日程，那就是一个强基线。如果共享受到限制，应以部署条件说明限制的理由，并计入其实际代价。<\/div>\n<p>该契约也确定了后续公平比较的形态（4.10）：各方法应在算法上有所不同，而不是在被赋予的信息或权限上有所不同。<\/p>\n<p><b>接下来，第二部分：<\/b>各经典方法流派如何处理这五个问题，以及它们为何做出各自的假设。<\/p>", "eyebrow": "第一部分 · 由此引出"}, "p2-five-families-placed-on-two-axes": {"key": "p2-five-families-placed-on-two-axes", "eyebrow": "第二部分 · 概览", "title": "五个流派，放在两条轴上", "bullets": ["<b>横轴：<\/b>由一个规划器决策，还是每个机器人各自决策？", "<b>纵轴：<\/b>效用是手工写出的，还是学出来的？", "各流派<b>相互重叠<\/b>：是类别，而非划分", "它们的差异主要在 <b>Q4<\/b>，在 Q1–Q3 上差别小得多"], "notesTitle": "出发前先看地图", "notes": "<p>经典流派可以大致放在两条轴上。<\/p>\n<ul><li><b>谁来决策（横轴）：<\/b>掌握全局的单一规划器，还是每个机器人基于局部信息各自决策。<\/li>\n<li><b>效用从何而来（纵轴）：<\/b>从模型写出（距离、行驶时间、成功概率），还是从数据或先验知识中学得。<\/li><\/ul>\n<p>集中式优化和市场方法都使用手工建模的效用；区别在于由谁计算决策。自组织方法（响应阈值、ALLIANCE、群体速率设计）位于一侧，因为它们根本不使用显式效用。学习策略和 LLM 规划器向上移动：效用隐含在奖励函数或语言模型的常识之中。因此，大体而言，较老的流派位于图的下方，较新的位于上方。<\/p>\n<p>位置只是近似的，许多系统是混合型。这五个流派是组织性的类别，而不是一种划分，它们的角色相互重叠。拍卖可以调用运动规划器来计算出价；学习得到的模型可以为优化器提供代价；语言模型可以提出一个 HTN 或符号计划，再由独立的检查器加以验证。同样，集中式计算并不意味着完全信息，分布式计算也不意味着队友未知。“优化假设团队是静态的”或“仅靠学习就能处理不确定性”之类的说法，掩盖了已有的混合方法。<\/p>\n<table class=\"cmp\"><thead><tr><th>流派<\/th><th>有用的贡献<\/th><th>应向具体方法提出的问题<\/th><\/tr><\/thead><tbody><tr><td>优化与搜索<\/td><td>显式的目标、约束、日程，有时还有界<\/td><td>哪些量是已知的？随机还是鲁棒？执行与求解延迟如何？<\/td><\/tr><tr><td>市场、共识与分布式优化<\/td><td>在智能体之间协调出价或局部决策<\/td><td>采用何种协议、连通性、真实性与收敛假设？<\/td><\/tr><tr><td>自组织分配<\/td><td>局部规则以很少的协商响应需求<\/td><td>阈值如何设定？是否会出现振荡、拥堵、不公平？<\/td><\/tr><tr><td>学习得到的策略与队友模型<\/td><td>摊销决策；表示不确定性或交互<\/td><td>何种训练与队友多样性能支持泛化？部署时会发生什么偏移？<\/td><\/tr><tr><td>基于语言的规划器与混合规划器<\/td><td>理解指令；提出分解或消息<\/td><td>如何检查落地（grounding）、可行性、权限与反馈？<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">比较具体算法及其假设，而不是比较整个流派。<\/p>\n<p>2.2–2.6 各页逐一介绍每个流派的建模、保证与示例；本页的两轴图只作粗略定向。这张地图的意义在于幻灯片底部的观察：各流派的差异主要在于如何决策 (Q4)，而在如何回答 Q1 到 Q3 上差别小得多。<\/p>"}, "p2-same-five-questions-five-answers": {"key": "p2-same-five-questions-five-answers", "eyebrow": "第二部分 · 总结", "title": "同样的五个问题，五种回答", "notesTitle": "对比揭示了什么", "notes": "<p>横向阅读此表：<\/p>\n<ul><li><b>Q4 才是各流派真正的分野。<\/b>求解器、拍卖、局部规则、训练得到的策略和提示词，是对“谁来决策、如何决策”的不同回答（高亮）。<\/li>\n<li><b>Q1 至 Q3 大多靠假设回答<\/b>（蓝色文字）：给定的列表、给定的模型，或已经了解自身的机器人。例外情况很有启发性：阈值方法从环境中读取任务，LLM 从语言中读取任务。也有一些方法会根据结果更新能力或效用：<b>能力可以根据执行情况更新<\/b>，例如 Emam et al.（2020）的自适应分配利用观测到的任务进展和不断演化的能力来调整分配；<b>分配可以学习未知的奖励<\/b>，例如未知奖励分配：CMTAB（2023）研究了任务奖励未知且存在资源约束条件下的在线联盟优化（见下方反例，2.7）。<\/li>\n<li><b>Q5 常常是“再做一次 Q4”。<\/b>阈值方法持续自适应，并为此放弃了最优性。在线方法与修复方法也会在执行期间修订决策（2.7）。<b>规划早已可以是在线的、即兴的：<\/b>OPAT 与不熟悉的队友一起反复规划，PLASTIC 使用学习得到的队友模型。<b>分配与执行可以耦合：<\/b>D-ITAGS 在变化发生后修复一个交织的分配、调度与运动规划解。<\/li><\/ul>\n<p>另有两个反驳“固定效用表”叙事的反例，落在这五列之外。<b>通信本身可以是一项决策：<\/b>Macke et al. 研究了在询问队友与通过观察推断其计划之间所做的代价敏感选择。<b>部分计划与承诺由来已久：<\/b>SharedPlans 在部分知识与承诺的条件下形式化了协作活动；这些思想并非由近来的语言模型所创造。<\/p>\n<table class=\"cmp\"><thead><tr><th>应避免的论断<\/th><th>反例<\/th><th>它表明了什么<\/th><\/tr><\/thead><tbody><tr><td>能力是固定输入<\/td><td>Emam et al. 2020<\/td><td>依据观测到的任务进展和演化中的能力调整分配<\/td><\/tr><tr><td>效用是固定输入<\/td><td>CMTAB（Singh et al. 2023）<\/td><td>任务奖励未知条件下的在线联盟优化<\/td><\/tr><tr><td>即兴团队只规划一次<\/td><td>OPAT（2011）；PLASTIC（2017）<\/td><td>与不熟悉队友的在线规划与模型复用<\/td><\/tr><tr><td>通信不是一项决策<\/td><td>Macke, Mirsky &amp; Stone 2021<\/td><td>在询问与推断之间的代价敏感选择<\/td><\/tr><tr><td>分配与执行是分离的<\/td><td>D-ITAGS（2022）<\/td><td>修复交织的分配、调度与运动<\/td><\/tr><tr><td>部分计划与承诺是新事物<\/td><td>SharedPlans（Grosz &amp; Kraus 1996）<\/td><td>部分知识与承诺下的协作活动<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">这些工作并未解决所有联合设定；它们排除的是笼统的论断。<\/p>\n<p>这些例子并未解决所有联合设定，但它们确实推翻了以下笼统论断：所有方法都把能力和效用当作固定输入，或在线修复、分解与通信仍无人触及。<\/p>\n<div class=\"key\"><span class=\"lbl\">结合反例阅读（2.7）<\/span>五问题表在典型假设的层面比较各流派，应结合这些更正来读。具体方法常常偏离其所属流派的那一行；上面的列表（2.7）给出了具体反例，因此第三部分追问的是：已有方法<i>在哪些精确假设下<\/i>不再能回答某个问题。<\/div>", "table": {"head": ["流派", "Q1 任务", "Q2 能力", "Q3 效用", "Q4 机制", "Q5 动态"], "rows": [["集中式", "给定列表", "给定模型", "由模型计算", "精确 / 近似求解器", "重新求解"], ["分布式达成一致", "公告或共享", "每个机器人了解自身", "自身的出价、得分或效用", "拍卖、共识、分布式求解器、均衡", "重新执行达成一致的过程"], ["自组织", "作为刺激被感知", "编码于阈值中", "无显式效用", "局部规则", "自行适应"], ["学习", "由环境固定", "隐含于训练中", "隐含于奖励中", "训练得到的策略", "限于训练分布之内"], ["LLM", "从语言中解析", "从文本中读取", "常识推测", "提示", "重新提示"]], "caption": ""}}, "p3-deriving-gaps-instead-of-listing-them": {"key": "p3-deriving-gaps-instead-of-listing-them", "eyebrow": "第三部分 · 方法", "title": "推导空白，而非罗列空白", "bullets": ["凭经验写出的空白清单<b>反映的是作者本人<\/b>：读过什么、想做什么", "改为：从问题的<b>最一般模型<\/b>出发，逐一放松每个假设", "再用十一份外部清单对模型进行<b>审计<\/b>，让盲点暴露出来", "证据：<b>已证明、相关或未解决<\/b>；评级是<b>检索快照<\/b>而非统计"], "notesTitle": "为何推导，如何推导", "notes": "<p>第二部分以一个有力的观察收尾：在全部五个流派中，能力与效用要么是给定的、自行定价的、编码在阈值中的、隐含于训练的，要么读自文本，很少从团队的持续工作中测量得到。（2.7 列出了一些例外，例如自适应分配与未知奖励分配。）这一观察来自用五个问题审视五个流派。但一篇中立的综述需要更多，因为这五个问题本身只是一种直觉，而建立在直觉上的空白清单会继承其盲点。<\/p>\n<h4>推导清单<\/h4>\n<p>因此本部分遵循四个明确步骤：<\/p>\n<ol><li><b>写出一般模型。<\/b>把分配视为团队决策问题的一个实例，列出此类问题包含的全部要素。<\/li>\n<li><b>陈述经典理想化。<\/b>对每个要素，写下经典 MRTA 的假设，以及现实偏离它的各种方式。每种偏离即一条轴。<\/li>\n<li><b>审查。<\/b>取 MRTA 内部及相邻领域的分类法与综述所列的开放问题，将每一条映射到某个要素上。若某条无处可放，说明模型有所缺失，于是扩展模型。<\/li>\n<li><b>核查文献。<\/b>对每条轴，寻找单独放松该轴的工作；再考察轴的两两组合，未被探索的组合往往藏在这里。只有经受住这一核查的才记为候选空白，其状态记录的是本综述当时的检索所得。<\/li><\/ol>\n<p>其结果是 E1–E10 这组标签，保留作为实用清单。它们描述了团队决策问题中有用的若干方面，但既不是相互独立的坐标，也不是唯一完整的推导。例如，时间与物理执行可以被纳入扩展后的状态、行动或转移模型；在这里将它们分开，是为了让其假设显露出来。<\/p>\n<h4>从覆盖图到研究问题<\/h4>\n<p>分类法组织证据；它并不能证明某个问题是新的。因此，在清单上定位到的候选空白，还要再经过五个步骤才成为研究问题：<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_method\"><\/div>\n<ol><li><b>明确设定。<\/b>说明任务过程、不确定性、信息、权限与执行约束。<\/li>\n<li><b>找出最相近的工作。<\/b>同时检索 MRTA 与相邻领域，并使用同一机制的不同名称。<\/li>\n<li><b>记录实际证据。<\/b>区分论文中已证明的设定、摘要层面的相关性判断，以及没有得到答案的检索。<\/li>\n<li><b>提出剩余问题。<\/b>指明额外的假设，并解释它为何改变决策。<\/li>\n<li><b>定义证伪结果。<\/b>说明在何种情况下，已有方法或一个简单接口就已足够。<\/li><\/ol>\n<p><b>证据用语。<\/b>关于已有工作的每一项陈述都使用以下三个术语之一。“已在特定设定中证明”需要具体的方法以及实验或定理。“相关证据”指出一个假设不同但有用的联系。“本综述未解决”描述的是检索的局限，而不是文献的缺失。<\/p>\n<div class=\"key\"><span class=\"lbl\">基本原则<\/span>本部分保持中立：不因与任何研究计划契合而推举某个问题。情形的普遍程度与所见证据的薄弱程度作为背景加以记录，但不据此排序。每个空白都注明其放松的假设。没有任何论断声称相关工作不存在：找不到对应工作的问题记为“本综述未解决”，并记录每项工作的核查方式：全文、摘要或仅标题。<\/div>\n<div class=\"key\"><span class=\"lbl\">计数与标签是快照<\/span>本部分中的组合计数、成熟度标签与分层空白清单属于一次检索快照（2026 年 10 月），而非覆盖统计。子轴页面（3.5–3.14）与组合核查（3.15）依然有用，因为其中的代表性工作和“仍保留”备注依然有用；它们的状态标签被标记为快照，不作为更新后的覆盖统计或排名使用。后来的某篇论文可能使某个计数失效，而不改变分类法本身。<\/div>\n<p>本页及其后三页涵盖推导的步骤 1 到 3。步骤 4 及之后的内容在侧边栏中列为后续部分。<\/p>"}, "p3-the-general-model-a-team-decision-problem": {"key": "p3-the-general-model-a-team-decision-problem", "eyebrow": "第三部分 · 步骤 1", "title": "一般模型：团队决策问题", "bullets": ["团队：<b>一个共同目标<\/b>，成员各自掌握不同的信息、控制不同的动作", "四个要素描述<b>世界<\/b>，一个描述<b>目标<\/b>，三个描述<b>谁知道什么、谁来决策<\/b>", "还有一个位于<b>分配器之下<\/b>：其输出能否被执行", "经典 MRTA 把九个要素都固定在最简单的设定"], "notesTitle": "九个要素", "notes": "<p>一个分配工作的多机器人团队，是 Marschak 和 Radner 意义上的<b>团队决策问题<\/b>（team decision problem）：多个决策者共享一个目标，但掌握不同的信息、控制不同的动作。2.5.1 中的 Dec-POMDP 是同一结构的形式化版本。从该结构中读出各要素：<\/p>\n<ul><li><b>E1 智能体<\/b>（智能体集合）：团队中有谁，以及是否会变化。<\/li>\n<li><b>E2 任务<\/b>（状态与奖励的一部分）：需要完成什么，以及如何得知。<\/li>\n<li><b>E3 动力学<\/b>（转移模型）：每个机器人的动作能达成什么。能力就体现在这里。<\/li>\n<li><b>E4 交互<\/b>（转移与奖励如何分解）：机器人的动作如何相互影响。<\/li>\n<li><b>E5 目标<\/b>（奖励及其随时间的聚合）：什么算好。<\/li>\n<li><b>E6 信息<\/b>（观测与通信）：谁观测到什么，代价如何。<\/li>\n<li><b>E7 控制<\/b>（谁的策略被设计）：谁为谁决策，以及是否合作。<\/li>\n<li><b>E8 时机<\/b>：何时决策，可用的计算量有多少。<\/li>\n<li><b>E9 执行<\/b>：以抽象任务表达的分配能否由下层的运动与操作层执行。<\/li><\/ul>\n<p><b>关于完备性的说明。<\/b>E1 到 E7 直接来自决策问题的结构。E8 和 E9 不属于该形式结构；加入它们是因为真实的分配器是运行在物理执行之上的一个计算过程。步骤 3 将检验是否还有其他缺失。3.2–3.3.1 展示了这些维度最初的推导过程，3.4–3.4.2 展示了对照外部分类法与综述所做的完备性审查。审查表明，十一个（后来是十四个）外部来源提出的每一条都能用这些维度表达；但这并不能证明完备性，而且事后又发现了一处遗漏（最小共享接口，E6e）。<\/p>\n<p><b>十个维度，一份连贯的清单。<\/b>本部分其余内容所用的清单加入了第十个维度 E10 系统设计，并以更贴近使用的说法表述其余维度：E3 包含能力，E7 表述为权限与行为，E8 表述为决策时机，E9 表述为物理执行。各维度的组合方式如下：E1–E4 描述了系统的大部分；E5 定义何为成功；E6–E7 约束哪些决策是可能的；E8–E9 把决策与时间和执行联系起来；E10 追问哪些系统属性是设计变量。这种分组是解释性的，而非形式上的划分：通信需要时间，运动会产生交互，而目标会改变哪种不确定性是要紧的。下表对每个维度列出一个设定必须说明的内容，以及一个可检验该维度是否要紧的压力测试。<\/p>\n<table class=\"cmp\"><thead><tr><th>维度<\/th><th>必须说明什么？<\/th><th>一个有用的压力测试<\/th><\/tr><\/thead><tbody><tr><td>E1 · 智能体<\/td><td>成员构成、异质性、人类、事先熟悉程度<\/td><td>已知的新成员 vs 不熟悉的策略；加入 vs 故障<\/td><\/tr><tr><td>E2 · 任务<\/td><td>到达、发现、分解、需求<\/td><td>持续到来的已知任务 vs 需求必须通过学习得知的任务<\/td><\/tr><tr><td>E3 · 动力学 / 能力<\/td><td>未知参数、漂移、故障、环境影响<\/td><td>能力差 vs 拥堵 vs 任务本身困难<\/td><\/tr><tr><td>E4 · 交互<\/td><td>先后约束、共享资源、联盟效应、反馈<\/td><td>帮助一个工位是否会使另一个工位过载？<\/td><\/tr><tr><td>E5 · 目标<\/td><td>有限完成、吞吐量、风险、公平、偏好<\/td><td>平均值的改进是否掩盖了不可接受的尾部损失？<\/td><\/tr><tr><td>E6 · 信息<\/td><td>可观测性、通信、自我认知、获取代价<\/td><td>一次询问能否取代长时间的观察？<\/td><\/tr><tr><td>E7 · 权限与行为<\/td><td>谁的策略受控；适应、激励、人类否决<\/td><td>所提出的计划真的能被强制执行吗？<\/td><\/tr><tr><td>E8 · 决策时机<\/td><td>截止期限、计算预算、并发、规模<\/td><td>返回的计划是否已经过时？<\/td><\/tr><tr><td>E9 · 物理执行<\/td><td>路径、操作、中断、交接、监控<\/td><td>抽象上可行的指派是否可执行？<\/td><\/tr><tr><td>E10 · 系统设计<\/td><td>机队构成、布局、允许的结构性变化<\/td><td>改变布局是否会消除表面上的分配瓶颈？<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">有用的比较单位是一个明确的设定，而不是被放松的假设的数量。<\/p>"}, "p3-e1-agents-1-thin-3-partly-0-well-studied": {"key": "p3-e1-agents-1-thin-3-partly-0-well-studied", "eyebrow": "第三部分 · 步骤 4 · ① 未知 · E1", "title": "E1 智能体：1 项薄弱，3 项部分研究，0 项研究充分", "bullets": ["<b>E1a<\/b> 成员在任务中途加入和离开：<i>薄弱<\/i>", "<b>E1b<\/b> 类型未知的队友：<i>部分研究<\/i>", "<b>E1c<\/b> 团队中有人类：<i>部分研究<\/i>", "<b>E1d<\/b> 大规模下的复杂能力结构：<i>部分研究<\/i>"], "notesTitle": "E1 智能体：小结", "notes": "<p><b>经典假设：<\/b>一组固定且已知的机器人。<\/p><p>在“固定且已知的机器人”这一假设被打破的四种方式中，只有异构能力结构在机器人学中有成熟的研究线（基于特质的分配）。类型未知的队友和团队中有人类都有研究，但大多在 MRTA 本身之外，或局限于小规模团队。机器人在任务中途加入和离开，在多智能体系统研究中有明确定义，但本综述的检索几乎没有找到这方面的机器人分配工作。<\/p>\n<p><b>E1 中的一个规律：<\/b>最成熟的研究线（即兴协作、开放 MAS）存在于多智能体学习和游戏基准中；机器人学的研究线则保持固定的成员名单，把变化当作扰动后的修复来处理。<\/p>\n<p><b>加入并不等于未知。<\/b>这些子轴区分了容易被混为一个“开放团队”的几种情形：未经通告的加入、未经通告的离开、不熟悉的行为、异质的能力以及人类参与。一台充电后重新加入的已知机器人可能只需要修复日程。一个不熟悉的协作者即使在规模固定的团队中也可能需要队友建模。在声称存在一个组合式的开放团队问题之前，应分别检验这些情况。<\/p>\n<p>名单、工作与模型的变化会产生不同的问题，相邻的两个要素也需要同样的区分。<\/p>\n<p><b>E2 · 任务到达不等于任务发现或分解（3.6）。<\/b>新到的配送请求可能具有已知的模式；发现一处溢漏会产生原本不在队列中的工作；分解“布置好房间”会产生子任务及其顺序约束。未知的需求又增加了一种不确定性：哪些资源能够成功？路径规划、符号规划与在线学习提供了相关的先行工作。分解早在语言模型规划器之前便已存在。<\/p>\n<p><b>E3 · 能力取决于任务与环境（3.7）。<\/b>完成得慢，可能反映机器人能力弱、通道拥堵或存在隐藏的前置条件（见图）。学习单一的机器人评分可能会混淆这些原因。Emam et al. 与 CMTAB 表明，根据结果进行适应是相关的已有工作；问题在于某一设定需要哪些潜在原因和反馈。<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_confound\"><\/div>\n<div class=\"key\"><span class=\"lbl\">候选问题<\/span>贯穿 E1–E3，要追问从允许的探测中能辨识出什么。当任务需求和队友行为仅部分已知时，新成员能否估计自己的有效贡献？为使其具体化，需要定义允许的探测、可辨识性假设及代价。如果不确定性不可辨识，方法应保留多种可能，或选择鲁棒的行动，而不是报告没有依据的确定性。<\/div>\n<p><b>如何阅读子轴页面。<\/b>每页把代表性工作放在一条线上，左端是经典假设，右端是完全放松的设定。位置是对一项工作放松假设程度的定性判断，而非测量值。右侧虚线区域是已核查工作都未达到的范围。每项工作的注释记录了它处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。子轴页面 3.5.1–3.7.4 保留了 2026 年 10 月检索中找到的代表性工作，每项都附有其“仍保留”的假设。<\/p>\n<p><b>状态评级。<\/b>这些标签记录的是一次检索快照（2026 年 10 月），而非覆盖统计或排名；后来的论文可能改变某个标签，而不改变这条轴本身。<i>研究充分<\/i>：有多条成熟的研究线。<i>部分研究<\/i>：存在真实但零散的研究群，或仍保留较强简化的研究群。<i>薄弱<\/i>：只有少数论文，或在本综述的检索中没有找到，且该领域自身的综述常称其为开放问题。<\/p>", "tag": "E1 · 经典假设：一组固定且已知的机器人"}, "p3-e4-interaction-1-thin-1-partly-2-well-studied": {"key": "p3-e4-interaction-1-thin-1-partly-2-well-studied", "eyebrow": "第三部分 · 步骤 4 · ② 价值 · E4", "title": "E4 交互：1 项薄弱、1 项部分研究、2 项研究充分", "bullets": ["<b>E4a<\/b> 跨机器人的时间耦合：<i>研究充分<\/i>", "<b>E4b<\/b> 干扰与拥塞：<i>部分研究<\/i>", "<b>E4c<\/b> 非可加的团队价值：<i>研究充分<\/i>", "<b>E4d<\/b> 分配会重塑系统：<i>薄弱<\/i>"], "notesTitle": "E4 交互：小结", "notes": "<p><b>经典假设：<\/b>每个机器人–任务配对的价值与其他配对无关 (ND)。<\/p><p>E4 有两个子轴研究充分：时间耦合有专门的分类法和大量求解器，非可加团队价值有成熟的形式化框架（联盟形成、子模分配）并带有理论保证。将干扰作为分配代价属于部分研究。分配本身重塑系统的情形在 MRTA 内部被评为薄弱，尽管其组成部分在运筹学中已很成熟：先后约束、共享充电桩、通道占用和联盟协同效应早已催生了耦合调度与排队模型。因此，“分配会重塑系统”是一个有用的建模警示，但不足以证明存在新的研究空白。<\/p>\n<p><b>E4 的共同规律：<\/b>理论保证依赖于<i>单调<\/i>结构，即增加机器人永远不会有害，且收益递减。干扰打破了这种单调性；而分配与系统状态之间的反馈，则打破了「选择分配时价值固定不变」这一假设。两者都处在现有理论的边缘。<\/p>\n<p><b>干预会改变系统。<\/b>保持忙碌、完成更多本地任务与改善团队表现是不同的结果。在仓库中，把另一台机器人派往上游，可能会增加下游队列，却不增加出库量（见图）。<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_marginal\"><\/div>\n<p>关键量是在明确的时间范围和基线下干预的边际效应。长队列是关于需求与服务的证据，而不能证明在那里增加一台机器人就有帮助。应优先采用受控比较或显式的预测模型，而不是把相关性解读为因果收益。Kuo、Lim 和 Meerkov 的瓶颈定义（4.4.3）正是这样一个边际量，即串行产线上的 ∂PR/∂p<sub>i<\/sub>。<\/p>\n<p><b>E5 · 先选目标，再选指标（3.9）。<\/b>什么算有用的帮助取决于目标。对于有限的一批任务，剩余完成时间可能是合适的。对于持续到达的任务，吞吐量、队列增长和响应时间的尾部才重要。多目标权衡、公平与人类偏好需要一个聚合规则或约束。这些都无法由一个未加说明的“效用”充分表示。<\/p>\n<div class=\"key\"><span class=\"lbl\">三个不同的安全问题<\/span>物理安全限制轨迹或状态。性能保守性限制相对于参照策略的损失。公平限制结果的分布方式。其中一项保证并不蕴含另外两项。<\/div>\n<p>与新成员加入前的团队比较时，应计入行驶、干扰、交接失败和过渡延迟。一个在自身任务上表现良好的新成员，仍可能损害整体目标。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作置于一条从经典假设（左）到完全放松设定（右）的轴线上。位置是对该工作在多大程度上放松了假设的定性判断，而非测量值。右侧虚线区域是所有核查过的工作都未触及的范围。每项工作的注释记录了它处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b>这些标签记录的是一次检索快照（2026 年 10 月），而非覆盖统计或排名；后来的论文可能改变某个标签，而不改变这条轴本身。<i>研究充分<\/i>：有多条成熟的研究脉络。<i>部分研究<\/i>：确有研究，但较为零散，或仍保留较强的简化。<i>薄弱<\/i>：仅有少数论文，或在本综述的检索中没有找到，该领域自身的综述也常称其为开放问题。<\/p>", "tag": "E4 · 经典设定：每个机器人–任务配对的价值与其他配对无关 (ND)"}, "p3-e6-information-2-thin-2-partly-1-well-studied": {"key": "p3-e6-information-2-thin-2-partly-1-well-studied", "eyebrow": "第三部分 · 步骤 4 · ③ 信息与权限 · E6", "title": "E6 信息：2 项薄弱，2 项部分研究，1 项研究充分", "bullets": ["<b>E6a<\/b> 部分、局部观测：<i>部分研究<\/i>", "<b>E6b<\/b> 受限或间歇通信：<i>研究充分<\/i>", "<b>E6c<\/b> 不确定的自我认知：<i>部分研究<\/i>", "<b>E6d<\/b> 获取信息需要花费时间：<i>薄弱<\/i>", "<b>E6e<\/b> 队友之间没有共享协议：<i>薄弱<\/i>"], "notesTitle": "E6 信息：小结", "notes": "<p><b>经典假设：<\/b>分配器能看到全局状态，或每个机器人精确知道自身代价。<\/p><p>E6 是审查中被提及最多的要素（13 条）。受限通信研究充分，但在真实性方面有所保留。局部观测和不确定的自我认知属于部分研究。把信息视为需要花时间获取的东西则被评为薄弱：信息价值 (value of information) 推理只存在于分配问题之外，或只针对小型领域中的单个即兴协作智能体。第二部分和第四部分表明经典协调假设存在共享的消息协议，此后又加入了第五个子轴 E6e；在没有共享协议的情况下工作同样被评为薄弱。<\/p>\n<p><b>E6 中的一个共同模式：<\/b>不确定性通常是外生且已知的（一个分布、一个区间、一个丢包模型）。需要<i>估计<\/i>自身代价或团队状态、并决定为此花多长时间的机器人，在本综述的检索中很少见。<\/p>\n<p><b>信息有内容、代价与时效。<\/b>区分隐藏状态、未知的队友策略、不确定的自身能力，以及无法获得的任务需求。一次观察、一次询问和一次有产出的试做，揭示的信息各不相同。它们是否有用，取决于能否在信息过时之前改变一个可执行的决策。<\/p>\n<p>这类单智能体即兴协作工作正是相关的基线：考虑通信的即兴规划已经比较过询问与观察（Macke et al., 2021；4.7.3）。新方法应与这类工作比较，而不仅仅与一个收不到任何更新的规划器比较。若询问被拒绝、指代对齐（grounding）错误和模型失配是实际部署的一部分，也应将其纳入考虑。<\/p>\n<p><b>E7 · 控制不等于合作（3.11）。<\/b>共同目标并不意味着一个规划器可以替换每个机器人的策略。原有成员可能接受提议、拒绝被打断、适应新成员，或听从人类指令。策略性行为会引入超出一般合作不确定性的激励问题。不确定性可以降低；权限不能靠假设凭空产生。因此，一个有用的设定要明确算法能观察什么、能改变什么。<\/p>\n<div class=\"key\"><span class=\"lbl\">一个精确的组合<\/span>新成员只控制自己的动作，只能看到部分队列，并可付出一定代价请求一份承诺摘要。现有任务不得被打断。这比“去中心化即兴分配”更有信息量：它明确了算法能观察什么、能改变什么。<\/div>\n<div class=\"fig nfig\" data-fig=\"rv_contract\"><\/div>\n<p>不要因为一个策略缺少其竞争者被赋予的信息或权限，就判定它能力不足。每次只改变一个条件，或者将结果明确表述为接口之间而非算法之间的比较。<\/p>\n<p><b>如何阅读子轴页面。<\/b>每一页把代表性工作放在一条从经典假设（左）到完全放松设定（右）的线上。位置是对一项工作在多大程度上放松了该假设的定性判断，而非测量值。右侧虚线区域表示所核查的工作均未达到的部分。每项工作的注释记录了它处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b>这些标签记录的是一次检索快照（2026 年 10 月），而非覆盖统计或排名；后来的论文可能改变某个标签，而不改变这条轴本身。<i>研究充分<\/i>：存在若干成熟的研究脉络。<i>部分研究<\/i>：有真实但零散的工作群，或仍保留较强的简化。<i>薄弱<\/i>：只有少数论文，或在本综述的检索中没有找到，且领域内综述常称其为开放问题。<\/p>", "tag": "E6 · 经典设定：分配器能看到全局状态，或每个机器人精确知道自身代价"}, "p3-e8-timing-0-thin-3-partly-0-well-studied": {"key": "p3-e8-timing-0-thin-3-partly-0-well-studied", "eyebrow": "第三部分 · 步骤 4 · ④ 运行与设计 · E8", "title": "E8 时机：0 项薄弱，3 项部分研究，0 项研究充分", "bullets": ["<b>E8a<\/b> 实时决策：<i>部分研究<\/i>", "<b>E8b<\/b> 边执行边决策：<i>部分研究<\/i>", "<b>E8c<\/b> 计算量随团队规模增长：<i>部分研究<\/i>"], "notesTit
