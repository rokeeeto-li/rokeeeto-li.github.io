const CONS_SLIDES = {
 before: { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Consensus before planning", fig:"consensus",
   intro:{year:'2005 / 2007',by:'Alighanbari & How; Olfati-Saber et al.',cell:'ST-SR-IA, decentralised',problem:'let every robot run the same planner by first agreeing on the inputs',note:'Consensus theory (surveyed by Olfati-Saber, Fax and Murray, 2007) shows how networked agents can agree on a shared value by repeatedly averaging with their neighbours. Alighanbari and How (2005) applied the idea to UAV task assignment: if every vehicle first agrees on the situation, each can run the same central planner on its own copy ("implicit coordination"). They found that this consensus is necessary but slow and often incomplete, and that residual differences produce conflicting assignments. Their remedy was to exchange candidate plans as well, which led to consensus on plans and, later, to CBBA.'},
   math:[["update","x<sub>i</sub> ← x<sub>i</sub> + ε Σ<sub>j∈N(i)</sub> (x<sub>j</sub> − x<sub>i</sub>)","average with neighbours"],["result","x<sub>i</sub> → average of initial values","connected, balanced graph"],["then","each robot solves the same problem on x<sub>i</sub>","implicit coordination"]],
   bullets:[`Robots first <b>agree on a shared picture</b>, then each runs the same planner`,`Agreement is <b>exponentially fast</b> on a connected graph, but never exact in finite time`,`Small residual differences can still produce <b>conflicting</b> assignments`],
   notesTitle:"Agreeing on inputs is not agreeing on decisions",
   notes:`<p><b>Consensus theory.</b> Each robot holds an estimate <code>x_i</code> of some shared quantity and repeatedly moves toward its neighbours' values. Olfati-Saber, Fax and Murray (2007) show that on a strongly connected, balanced graph all robots converge to the average of the initial values, exponentially fast, at a rate set by the graph's algebraic connectivity. The result survives switching graphs and, up to a bound, communication delay. The figure is a simulation of four robots on a ring.</p>
<p><b>Using it for allocation.</b> If all robots agree exactly on task positions, robot states and costs, each can run the same deterministic planner and they will all compute the same allocation without further talk. Alighanbari and How (2005) call this implicit coordination.</p>
<p><b>Why it is fragile.</b> Consensus is asymptotic: estimates get close but are rarely identical in finite time, and new observations keep arriving. An allocation is discrete, so a tiny difference in inputs can flip a decision, and two robots can both claim the same task (bottom of the figure). Alighanbari and How report exactly this: consensus on situational awareness is necessary but slow and incomplete, and conflicts follow. Their fix was to also exchange candidate plans, which moves agreement from the inputs to the decisions. CBBA, next, is the mature version of that idea.</p>
<p><b>Five-question reading.</b> Q4 becomes "agree, then decide alone"; Q2 and Q3 must be part of the shared state, so every robot needs a model of every other robot's capability.</p>`,
   refs:[ref("Olfati-Saber, Fax & Murray, Proceedings of the IEEE 2007","Consensus and cooperation in networked multi-agent systems",{Link:"https://murray.cds.caltech.edu/Consensus_and_Cooperation_in_Networked_Multi-Agent_Systems",Scholar:sch("Consensus and cooperation in networked multi-agent systems")}),
         ref("Alighanbari & How, IEEE CDC-ECC 2005","Decentralized task assignment for unmanned aerial vehicles",{Link:"https://ieeexplore.ieee.org/document/1583066/",Scholar:sch("Alighanbari How Decentralized task assignment for unmanned aerial vehicles")}),
         ref("Alighanbari, MIT PhD thesis 2007","Robust and decentralized task assignment algorithms for UAVs",{Link:"http://hdl.handle.net/1721.1/42177",Scholar:sch("Robust and decentralized task assignment algorithms for UAVs Alighanbari")})] },
 distopt: { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Distributed optimisation: exact, together", fig:"distopt",
   intro:{year:'2008 → 2023',by:'Zavlanos et al.; Bürger et al.; Chopra et al.; Shorinwa et al.',cell:'ST-SR-IA, decentralised',problem:'reach the centralised optimum with no central solver, each robot knowing only its own costs',note:'Auctions and CBBA trade optimality for simplicity. A parallel line in control asked whether the exact optimum of the assignment problem could be computed by robots that each know only their own costs and talk only to neighbours. Distributed versions of the auction algorithm (Zavlanos et al. 2008), the simplex method (Bürger et al. 2012), the Hungarian method (Chopra et al. 2017) and ADMM (Shorinwa et al. 2023) all answer yes, under connectivity assumptions.'},
   math:[["min","Σ<sub>i</sub> Σ<sub>j</sub> c<sub>ij</sub> x<sub>ij</sub>","robot i knows only row i"],["s.t.","assignment constraints","as in 2.2.1"],["goal","every robot ends with the same x*","by local exchange only"]],
   bullets:[`Robots exchange <b>labels, prices, bases or dual variables</b> with neighbours`,`Guarantees: <b>the same optimum</b> in finite time, under connectivity`,`Limited to <b>linear, one-to-one</b> assignment; coupling breaks the structure`],
   notesTitle:"Exact answers, decentralised",
   notes:`<p>These methods keep the classical problem from 2.2.1 and change only who computes it. Each robot knows its own row of the cost table and talks only to neighbours; the goal is for every robot to end with the same optimal assignment.</p>
<ul><li><b>Distributed auction</b> (Zavlanos, Spesivtsev & Pappas, 2008): extends Bertsekas's auction with multi-hop price relaying over a network that is connected over time. The result is within <code>nε</code> of the optimum, and exactly optimal for integer benefits with <code>ε &lt; 1/n</code>; iterations scale with the network diameter.</li>
<li><b>Distributed simplex</b> (Bürger, Notarstefano, Bullo & Allgöwer, 2012): each robot holds its own columns of the LP; robots agree on the same optimal basis in finite time over a periodically connected network, even for degenerate problems.</li>
<li><b>Distributed Hungarian</b> (Chopra, Notarstefano, Rice & Egerstedt, 2017): robots exchange a small graph and labelling; with a strongly connected network, all converge to the same optimal assignment in finite time, with at most <code>O(r³)</code> rounds in the synchronous case.</li>
<li><b>Consensus ADMM</b> (Shorinwa, Haksar, Washington & Schwager, 2023): relaxes the binary assignment and solves it with consensus ADMM; with linear costs the relaxed optimum is integral. One variant shares only dual variables, which helps privacy.</li></ul>
<p><b>What they assume.</b> Linear, one-to-one assignment with additive costs, cooperative robots running the same algorithm, and a network that is connected (always, or over time). Temporal coupling, coalitions or interference break the linear structure that makes exactness possible.</p>`,
   refs:[ref("Zavlanos, Spesivtsev & Pappas, IEEE CDC 2008","A distributed auction algorithm for the assignment problem",{Link:"https://scholars.duke.edu/publication/809524",Scholar:sch("A distributed auction algorithm for the assignment problem Zavlanos")}),
         ref("Bürger, Notarstefano, Bullo & Allgöwer, Automatica 2012","A distributed simplex algorithm for degenerate linear programs and multi-agent assignments",{Link:"https://cris.unibo.it/handle/11585/671807",Scholar:sch("A distributed simplex algorithm for degenerate linear programs and multi-agent assignments")}),
         ref("Chopra, Notarstefano, Rice & Egerstedt, IEEE T-RO 2017","A distributed version of the Hungarian method for multirobot assignment",{arXiv:"https://arxiv.org/abs/1805.08712",Scholar:sch("A distributed version of the Hungarian method for multirobot assignment")}),
         ref("Shorinwa, Haksar, Washington & Schwager, IEEE T-RO 2023","Distributed multirobot task assignment via consensus ADMM",{Link:"https://msl.stanford.edu/bibliography/shorinwa_distributed_2023-1.html",Scholar:sch("Distributed multirobot task assignment via consensus ADMM")})] },
 games: { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Game-theoretic allocation", fig:"games",
   intro:{year:'2007 / 2009 / 2018',by:'Arslan, Marden & Shamma; Jang et al.',cell:'ST-SR-IA; ST-MR-IA (coalitions)',problem:'get good allocations from robots that each optimise only their own utility',note:'Arslan, Marden and Shamma (2007) treated vehicle–target assignment as a game: each vehicle picks a target to maximise its own utility, and the designer chooses those utilities (for example, each vehicle\'s marginal contribution) so that the game is a potential game whose potential is the team objective. Simple learning rules then converge to a Nash equilibrium. Marden et al. (2009) generalised this to cooperative control. Jang et al. (2018) used hedonic games to form task coalitions in large teams.'},
   math:[["player i","a<sub>i</sub> ∈ argmax U<sub>i</sub>(a<sub>i</sub>, a<sub>−i</sub>)","own utility only"],["design","U<sub>i</sub>(a) = G(a) − G(∅<sub>i</sub>, a<sub>−i</sub>)","marginal contribution"],["⇒","potential game: Φ = G","best responses raise G"]],
   bullets:[`Each robot optimises <b>its own utility</b>; the designer shapes those utilities`,`With <b>marginal-contribution</b> utilities, the team objective is a potential`,`Learning converges to a <b>Nash equilibrium</b>, which need not be optimal`,`Needs only <b>local</b> information about who chose what`],
   notesTitle:"Allocation as an equilibrium",
   notes:`<p>Game-theoretic allocation removes the central decision entirely. Each robot repeatedly picks the task that maximises its own utility <code>U_i</code>, given what the others chose. The design problem moves to choosing the utilities.</p>
<p><b>Potential games.</b> If each robot's utility is its marginal contribution to the team objective <code>G</code> (the "wonderful life utility"), then any change that improves one robot's utility improves <code>G</code> by the same amount. <code>G</code> is a potential: best-response dynamics can only climb it, so they must stop, at a Nash equilibrium. Arslan, Marden and Shamma (2007) develop this for vehicle–target assignment with learning rules such as spatial adaptive play; Marden, Arslan and Shamma (2009) extend it to cooperative control with restricted and time-varying action sets.</p>
<p><b>Coalitions.</b> Jang, Shin and Tsourdos (2018) use anonymous hedonic games (GRAPE): robots prefer coalitions by size, and local exchange reaches a Nash-stable partition in polynomial time, with at least 50% of optimal welfare under a monotonicity condition.</p>
<p><b>Limits.</b> An equilibrium is stable, not necessarily optimal (the gap in the figure). Computing marginal contributions may need knowledge of others' actions. And the robots are not actually self-interested; the game is a design device. Truly strategic agents need mechanism design (see E7c in Part 3).</p>`,
   refs:[ref("Arslan, Marden & Shamma, ASME J. Dynamic Systems, Measurement, and Control 2007","Autonomous vehicle-target assignment: A game-theoretical formulation",{Scholar:sch("Autonomous vehicle-target assignment: A game-theoretical formulation")}),
         ref("Marden, Arslan & Shamma, IEEE Trans. SMC-B 2009","Cooperative control and potential games",{Link:"https://authors.library.caltech.edu/records/xq9ws-8wp90",Scholar:sch("Cooperative control and potential games Marden")}),
         ref("Jang, Shin & Tsourdos, IEEE T-RO 2018","Anonymous hedonic game for task allocation in a large-scale multiple agent system",{arXiv:"https://arxiv.org/abs/1711.06871",Scholar:sch("Anonymous hedonic game for task allocation in a large-scale multiple agent system")})] },
 resilient: { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Resilient consensus: when robots fail or lie", fig:"resilient",
   intro:{year:'2013 / 2017',by:'LeBlanc et al.; Saldaña et al.',cell:'decentralised agreement under faults',problem:'reach agreement even when up to F robots send wrong values',note:'Ordinary consensus assumes every robot follows the protocol; one robot broadcasting a wrong value can drag the whole team. LeBlanc, Zhang, Koutsoukos and Sundaram (2013) showed that with a simple trimming rule (W-MSR) normal robots still agree, provided the network is "robust" in a precise graph-theoretic sense. Saldaña, Prorok, Sundaram, Campos and Kumar (2017) extended this to moving robots whose network is robust only over time windows.'},
   math:[["W-MSR","discard F largest and F smallest neighbour values","then average"],["holds if","graph is (F+1, F+1)-robust","F-total malicious"],["mobile","(T, 2F+1)-robust over windows T","Saldaña et al. 2017"]],
   bullets:[`One faulty or malicious robot can break <b>ordinary</b> consensus`,`<b>Trim</b> extreme neighbour values, then average`,`Normal robots agree if the network is <b>robust</b>, a stronger condition than connected`,`Agreement on <b>scalar values</b>; extending it to allocations is open`],
   notesTitle:"Why this matters for teams you did not build",
   notes:`<p>Every agreement method above assumes all robots follow the same protocol honestly. In an ad hoc or mixed-vendor team that assumption is the first to go: a teammate may be faulty, mis-calibrated, or simply running different software.</p>
<p><b>The W-MSR rule.</b> Each normal robot discards up to <code>F</code> of the largest and <code>F</code> of the smallest values it hears, then averages the rest. LeBlanc et al. (2013) show that connectivity is no longer the right condition; instead the graph must be <i>r-robust</i>: for any two disjoint subsets, at least one contains a node with enough neighbours outside it. With <code>F</code> malicious robots in total, normal robots reach consensus if and only if the graph is <code>(F+1, F+1)</code>-robust, and the agreed value stays within the range of normal robots' initial values.</p>
<p><b>Moving robots.</b> Saldaña et al. (2017) note that a mobile team's graph is rarely robust at any single instant. Their sliding-window variant needs robustness only over the union of graphs in each time window, and they design robot motions that make this hold.</p>
<p><b>Gap.</b> These results are for agreement on scalar values. Resilient agreement on discrete allocations, where a lying robot could claim tasks it will not do, connects to E7c (strategic agents) and E1b (unknown teammates) in Part 3 and was not found as a developed line.</p>`,
   refs:[ref("LeBlanc, Zhang, Koutsoukos & Sundaram, IEEE JSAC 2013","Resilient asymptotic consensus in robust networks",{PDF:"https://cs.vuse.vanderbilt.edu/koutsoxd/www/Publications/resilientConsensusJSAC2013.pdf",Scholar:sch("Resilient asymptotic consensus in robust networks")}),
         ref("Saldaña, Prorok, Sundaram, Campos & Kumar, ACC 2017","Resilient consensus for time-varying networks of dynamic agents",{PDF:"https://engineering.purdue.edu/~sundara2/papers/acc17saldana.pdf",Scholar:sch("Resilient consensus for time-varying networks of dynamic agents")})] },
 language: { child:true, eyebrow:"Part 2 · Family 2 · Deep dive", title:"Agreement through language", fig:"langagree",
   intro:{year:'2023 →',by:'Chen et al.; Du et al.; DynaHMRC; CLiMRS',cell:'decentralised, heterogeneous',problem:'let agents that share no update rule still reach agreement, using natural language',note:'Every classical agreement method requires robots to run the same protocol, designed in advance. Large language models offer a different possibility: agents built by different teams can negotiate in natural language. Chen et al. (2023) studied how LLM agents reach consensus and found behaviour resembling classical averaging, with new failure modes. Multi-agent debate (Du et al., ICML 2024) showed that agreement through discussion can improve answers. Since 2025, LLM-based decentralised multi-robot allocation systems negotiate tasks this way.'},
   bullets:[`Classical consensus needs <b>one update rule</b> agreed in advance; language does not`,`LLM agents tend to <b>average</b>, but <b>stubborn</b> agents lead and <b>hallucinations</b> spread`,`2025–26 systems negotiate allocations in language; <b>no convergence guarantees</b>`,`Related: zero-shot coordination with <b>unseen partners</b> (other-play, grounded communication)`],
   notesTitle:"What language changes, and what it does not",
   notes:`<p><b>The protocol problem.</b> Every method on the previous pages assumes all robots run the same algorithm: the same averaging rule, the same bidding rule, the same tie-breaking. That is exactly what ad hoc teamwork cannot assume. Natural language is the first shared "protocol" that agents from different builders might have without coordinating in advance.</p>
<p><b>How LLM agents reach consensus.</b> Chen, Ji, Xu and Zhao (2023) had LLM agents negotiate a shared number. Without instruction, agents mostly averaged, like classical consensus. Stubborn agents produced leader–follower outcomes, several stubborn agents split the group, suggestible agents could oscillate, and hallucinations propagated. Fully connected networks converged fastest. There is no convergence proof, and consensus was not always reached.</p>
<p><b>Debate.</b> Du et al. (ICML 2024) let several LLM instances debate until they agree; accuracy improved with more agents and rounds, plateauing around four rounds, but agents sometimes converged on a wrong answer.</p>
<p><b>Allocation systems.</b> DynaHMRC (2026) has role-aware LLM agents describe themselves, bid for leadership and elect a leader; CLiMRS (2025) forms subgroups with a manager agent that leads negotiation; Ismayilov et al. (2025) exchange LLM goal rankings with a fixed tie-break rule. All are preprints without guarantees, and none studies agents from independently built systems negotiating with each other. LLM-Flock (2025) uses influence-weighted consensus across different LLM back-ends for flocking.</p>
<p><b>Agreement with unseen partners, without language.</b> Other-play (Hu et al., ICML 2020) avoids arbitrary conventions that only a specific partner would share; quasi-equivalence discovery (Bullard et al., 2021) finds a communication protocol unseen partners would converge on; Li et al. (NeurIPS 2024) ground multi-agent communication in language and report zero-shot ad hoc teamwork.</p>
<div class="key"><span class="lbl">Open question</span>Language removes the need for a pre-agreed protocol, but not the need for guarantees. Whether agreement through language converges, how fast, how it degrades with stubborn, faulty or hallucinating agents, and when it is worth its cost compared with simply observing teammates, are all unanswered for allocation.</div>`,
   refs:[ref("Chen, Ji, Xu & Zhao, arXiv 2023","Multi-agent consensus seeking via large language models",{arXiv:"https://arxiv.org/abs/2310.20151",Scholar:sch("Multi-agent consensus seeking via large language models")}),
         ref("Du, Li, Torralba, Tenenbaum & Mordatch, ICML 2024","Improving factuality and reasoning in language models through multiagent debate",{Link:"https://proceedings.mlr.press/v235/du24e.html",Scholar:sch("Improving factuality and reasoning in language models through multiagent debate")}),
         ref("Yu et al., arXiv 2026","DynaHMRC: Decentralized heterogeneous multi-robot collaboration for dynamic tasks with large language models",{arXiv:"https://arxiv.org/abs/2606.14882",Scholar:sch("DynaHMRC decentralized heterogeneous multi-robot collaboration")}),
         ref("Song et al., arXiv 2025","Leveraging adaptive group negotiation for heterogeneous multi-robot collaboration with large language models (CLiMRS)",{arXiv:"https://arxiv.org/abs/2602.06967",Scholar:sch("Leveraging adaptive group negotiation for heterogeneous multi-robot collaboration with large language models")}),
         ref("Ismayilov, Meriaux, Wen & Dudek, arXiv 2025","Decentralized multi-agent goal assignment for path planning using large language models",{arXiv:"https://arxiv.org/abs/2510.23824",Scholar:sch("Decentralized multi-agent goal assignment for path planning using large language models")}),
         ref("Li & Zhou, arXiv 2025","LLM-Flock: Decentralized multi-robot flocking via large language models and influence-based consensus",{arXiv:"https://arxiv.org/abs/2505.06513",Scholar:sch("LLM-Flock decentralized multi-robot flocking")}),
         ref("Hu, Lerer, Peysakhovich & Foerster, ICML 2020","\"Other-play\" for zero-shot coordination",{Link:"https://proceedings.mlr.press/v119/hu20a.html",Scholar:sch("Other-play for zero-shot coordination")}),
         ref("Bullard, Kiela, Meier, Pineau & Foerster, arXiv 2021","Quasi-equivalence discovery for zero-shot emergent communication",{arXiv:"https://arxiv.org/abs/2103.08067",Scholar:sch("Quasi-equivalence discovery for zero-shot emergent communication")}),
         ref("Li et al., NeurIPS 2024","Language grounded multi-agent reinforcement learning with human-interpretable communication",{Link:"https://proceedings.neurips.cc/paper_files/paper/2024/hash/a06e129e01e0d2ef853e9ff67b911360-Abstract.html",Scholar:sch("Language grounded multi-agent reinforcement learning with human-interpretable communication")})] },
 table: { child:true, kind:"table", eyebrow:"Part 2 · Family 2 · Deep dive", title:"Seven ways to reach agreement",
   table:{ dense:true, head:["Approach","Introduced","What is agreed on","Guarantee","Needs","Breaks when"],
     rows:[["Auctions","Smith 1980 → Lagoudakis 2005","winning bids","greedy or bounded (SSI)","each robot prices itself; an auctioneer","robots can't price themselves; coupled tasks"],
           ["Consensus on the world","Alighanbari & How 2005","shared situational picture","asymptotic agreement on values","identical planners; good connectivity","small residual differences flip decisions"],
           ["CBBA","Choi, Brunet & How 2009","winning bids and winners","conflict-free; ≥ 50% under diminishing gain and shared information","same protocol; diminishing-gain scores","synergies; dishonest bids"],
           ["Distributed optimisation","Zavlanos 2008 → Shorinwa 2023","labels, prices, bases, duals","same exact optimum","linear one-to-one costs; connectivity","coupling, coalitions, interference"],
           ["Games","Arslan, Marden & Shamma 2007","an equilibrium","Nash equilibrium (not optimum)","designed utilities; repeated play","equilibria far from optimal"],
           ["Resilient consensus","LeBlanc et al. 2013","values, despite F bad robots","agreement among normal robots","robust network; known F","discrete allocations (open)"],
           ["Language","Chen et al. 2023 →","a negotiated plan","none yet","LLM agents; communication budget","stubborn or hallucinating agents"]],
     hlCol:2 },
   notesTitle:"One question, seven answers",
   notes:`<p>All seven approaches answer the same question: how do several decision makers end up with one consistent allocation without a central solver? They differ in what they agree on (highlighted column).</p>
<ul><li>Agreeing on <b>inputs</b> (the world) is fragile, because discrete decisions amplify small differences.</li>
<li>Agreeing on <b>decisions</b> (bids, winners, assignments, an equilibrium) is robust to that, and is where the guarantees are.</li>
<li>Agreeing in the presence of <b>bad actors</b> needs stronger network conditions, and is developed only for values, not allocations.</li>
<li>Agreeing through <b>language</b> removes the need for a shared protocol, at the price of guarantees.</li></ul>
<div class="key"><span class="lbl">Common assumption</span>Every row except the last assumes that all robots run the same, pre-agreed protocol. That assumption is exactly what fails in ad hoc and mixed-vendor teams, which is why the last two rows matter for Parts 3 and 4.</div>`,
   refs:[] },
};
