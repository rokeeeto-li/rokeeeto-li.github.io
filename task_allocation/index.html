le": "E8 时机：小结", "notes": "<p><b>经典假设：<\/b>分配在执行前离线求解，没有时间限制。<\/p><p>E8 的三个子轴都属于部分研究，各自有成熟的核心和薄弱的边缘。快速求解器和随时（anytime）求解器已经存在，但只适用于小团队或简单约束；滚动时域和在线指派在终身路径规划中已成熟，但何时重分配、切换代价多大，相关研究很零散；超大规模只在简单指派上得到展示，尚未覆盖时间窗、联盟或异构性。<\/p>\n<p><b>E8 的共同规律：<\/b>速度是以舍弃结构为代价换来的。在本综述的检索中，未找到这样的工作：在机器人持续运动时，界定决策延迟会造成多少规划质量损失。<\/p>\n<p><b>求解本身也占用时间线。<\/b>说明机器人在推理、通信和优化期间是否继续工作。基于旧快照计算出的计划需要更新、有效性检查，或一个约定好的未来激活时刻。数秒的计算预算对某些实例绰绰有余，对另一些则无法使用；仅凭规模无法证实其中任何一种说法。<\/p>\n<p>世界持续运转时，计划必须仍然有意义，这把时机与其余两个要素联系在一起。<\/p>\n<p><b>E9 · 执行可能改变分配决策（3.13）。<\/b>路径、操作可行性、延迟和交接不只是最后的检查。一条不可行的路线可能要求换一个任务负责者；一个不可中断的动作可能妨碍立即重新分配。任务与运动规划以及动态交错方法（D-ITAGS）已经处理了这一闭环的部分环节。所提出的扩展应指明它们未覆盖的是哪种执行契约或不确定性。<\/p>\n<p><b>E10 · 系统本身可能是决策变量（3.14）。<\/b>车队规模、能力构成和布局决定了哪些分配是可能的。应将设计阶段的投入与运行时的适应区分开，并比较总成本。如果增设第二个打包站就消除了瓶颈，那是一项有用的系统设计发现，而不是分析的失败。<\/p>\n<p>完整的闭环是：<b>观察 → 更新状态或信念 → 选择一个可行的干预 → 达成一致并激活 → 执行并监控 → 修正<\/b>。并非每个实现都需要每个阶段，但被省略的阶段意味着一些应当明确说明的假设。<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_loop\"><\/div>\n<p><b>如何阅读子轴页面。<\/b>每页将代表性工作放在一条从经典假设（左）到完全放松设定（右）的轴线上。位置是对一项工作放松该假设程度的定性判断，而非测量值。右侧虚线区域是所有已核查工作都未达到的范围。每项工作的备注记录其处理了什么、仍保留了什么，以及核查方式（全文、摘要或仅标题）。<\/p>\n<p><b>状态评级。<\/b>这些标签记录的是一次检索快照（2026 年 10 月），而非覆盖统计或排名；后来的论文可能改变某个标签，而不改变这条轴本身。<i>研究充分<\/i>：有多条成熟的研究脉络。<i>部分研究<\/i>：存在真实但零散的研究群，或保留了较强的简化。<i>薄弱<\/i>：只有少量论文，或在本综述的检索中没有找到，领域自身的综述常将其列为开放问题。<\/p>", "tag": "E8 · 经典设定：分配在执行前离线求解，没有时间限制"}, "p3-candidate-gaps-a-search-snapshot-ranked-neutrally": {"key": "p3-the-gap-list-ranked-neutrally", "eyebrow": "第三部分 · 结果", "title": "候选空白：检索快照，中立排序", "notesTitle": "列表如何排序", "notes": "<p>该列表合并了单独评为薄弱的各子轴（包括 E6e，它是在第二部分揭示出共享协议假设后加入的）与 3.15.1 中反复出现的缺失组合。它是一份检索快照：每一项都是候选空白，且仅按两项标准评分：<\/p>\n<ul><li><b>普遍性<\/b>（0 低，1 中，2 高）：已部署的多机器人系统遇到这种情形的频率。这是一项判断；“出现场景”一栏给出其依据。<\/li>\n<li><b>空白程度<\/b>（1 为部分研究或缺失组合，2 为薄弱或在本综述的检索中未找到）：取自文献检查；这些检查记录的是本综述的检索在某一时点找到的内容，而非经过认证的缺失。<\/li><\/ul>\n<p><b>层级规则：<\/b>普遍性 + 空白程度 ≥ 3.5 为 A；≥ 3 为 B；其余为 C。层级 A 与 B 在本页，层级 C 在下一页。该规则在列表排序之前即已确定。由于它把主观判断的普遍性与检索快照中的空白程度相加，层级表明的是应先从哪里着手，而不是某个空白已被确立。<\/p>\n<p><b>层级 A<\/b> 有三个候选空白：重塑系统的分配、需耗时获取的信息、任务中途变化的团队成员。三者在实践中都很常见，在本综述对 MRTA 的检索中都很薄弱；其中两个在相邻领域有成熟理论，而检索中未发现它们被迁移过来。<\/p>\n<p><b>“相邻理论”一栏很重要。<\/b>凡该栏有内容的，候选空白看起来属于迁移而非发明：瓶颈理论、序贯检验、保守型 bandit、机制设计与协同设计均已存在；本综述未找到的是在含物理约束的分配问题中对它们进行的形式化。<\/p>\n<p><b>候选组合，而非经过认证的空白。<\/b>由于层级把主观判断的普遍程度与检索快照中的空缺混在了一起，排序更有用的产出是下表中的候选问题。每个问题都附有最接近的出发点，以及会削弱其动机的结果，因此它既可以被推进，也可以被否定。为该列表提供依据的成对检查和缺失组合（3.15–3.15.3）是线索，而非“不存在”的证据。<\/p>\n<table class=\"cmp\"><thead><tr><th>候选问题<\/th><th>最接近的出发点<\/th><th>什么会削弱其动机？<\/th><\/tr><\/thead><tbody><tr><td>在有限权限和已有承诺下，新成员何时应询问、观察或行动？<\/td><td>在线即兴协作、通信价值、队友模型、SharedPlans<\/td><td>一条低成本的状态消息加上计划修复就能做得同样好<\/td><\/tr><tr><td>干预能否在不产生不可接受的过渡损失的前提下改善耦合的流？<\/td><td>排队控制、瓶颈分析、保守学习<\/td><td>已知模型的排队控制或静态人员配置已能涵盖这一点<\/td><\/tr><tr><td>哪种不确定性值得一次有产出的试探？<\/td><td>自适应与老虎机分配、信念空间规划<\/td><td>声明或被动观察已足够准确，且成本更低<\/td><\/tr><tr><td>团队何时应修复计划，何时应重新打开整个决策？<\/td><td>分配–调度–运动修复、在线搜索<\/td><td>事件触发的重规划能以相近的过渡代价满足截止期限<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">“有前景”意味着影响重大且可检验，而不只是在某一篇综述中被引用较少。<\/p>\n<p>每一项都需要一次有针对性的检索、一个形式化接口和一个强基线。一个有用的下一步实验应每次只改变一种难度（信息代价、队友失配、承诺时长或耦合强度），然后再将它们组合起来。<\/p>\n<div class=\"key\"><span class=\"lbl\">结合 3.18 阅读<\/span>普遍性评级是此处最主观的输入，且层级 A 的候选空白与本演示文稿背后的研究兴趣存在重叠。3.18 对这两点均有讨论。<\/div>\n<div class=\"key\"><span class=\"lbl\">通往第四部分的桥梁<\/span>目标不是用某个单一的新范式取代 MRTA，而是选择其假设与候选问题相匹配的工具，并发现何时额外的机制是不必要的。<\/div>", "table": {"head": ["空白", "放宽", "空白证据", "出现场景", "相邻理论", "层级"], "rows": [["重塑系统的分配", "E4d", "单独薄弱；无成对工作", "流式系统：仓库、产线、共享充电桩", "瓶颈理论、排队论（运筹学）", "A"], ["需耗时获取的信息", "E6d (+E6c)", "薄弱；与 E6c 及 E1 的组合缺失", "任何须先观察再行动的机器人：搜索、新加入者、巡检", "序贯检验、信息价值", "A"], ["任务中途变化的团队成员", "E1a (+E1b)", "薄弱；与 E2c/d、E4、E5、E6c 的组合缺失", "充电、故障、新增机器人、混合机群", "开放多智能体系统、临时组队（ad hoc teamwork）", "A"], ["执行漂移反馈至重分配", "E9c × E3c", "部分研究；闭环薄弱", "所有物理部署都会发生漂移", "鲁棒执行（路径层面）", "B"], ["相对当前团队的无害性", "E5b（子部分）", "MRTA 中薄弱；与 E1、E9、E10 的组合缺失", "对运行中系统的任何改动", "保守型 bandit、安全策略改进", "B"], ["会自适应的队友", "E7b (+E3a)", "薄弱；与习得能力的组合缺失", "多厂商混合机群、人类同事", "对手感知学习", "B"], ["没有共享协议的队友", "E6e (+E1b, E7a)", "薄弱；在第二部分（2.3.11）之后加入", "多厂商混合机群、加入其他团队的机器人", "零样本协调、隐式通信", "B"], ["未知的任务需求", "E2d (+E1a)", "薄弱；与开放团队的组合缺失", "开放式任务、语言指定的任务", "—", "B"], ["由人定义的目标", "E5d", "薄弱", "人机共享工作场所", "偏好学习", "B"]], "caption": ""}, "tag": "检索快照"}, "p4-what-counts-as-a-lens": {"key": "p4-what-counts-as-a-paradigm", "eyebrow": "第四部分 · 视角", "title": "什么才算一个视角", "bullets": ["视角改变的是<b>形式化表述<\/b>：状态、决策、目标或保证", "它放松一条<b>参照情形假设<\/b>（4.2）", "各视角<b>补充<\/b>而非取代 MRTA；可同用于一个系统", "只有<b>假设相匹配<\/b>时，其保证才能迁移"], "notesTitle": "为什么第四部分按形式化表述来组织", "notes": "<p>第三部分找出了在本综述的检索中问题空间看起来空白的区域。第四部分提出另一个问题：是否存在某些<i>表述<\/i>问题的方式，能让研究进入这些区域？针对同一表述的更快求解器不算。一个视角只要改变以下四者之一即可算数：<\/p>\n<ul><li><b>状态：<\/b>决策者跟踪什么。经典做法中是一张效用表；这里可能是队列长度、对队友的信念，或团队本身。<\/li>\n<li><b>决策：<\/b>经典做法中是一次性分配 <code>x(r,t)<\/code>；这里可能是反馈策略、停止观察的时刻，或单个机器人自己的动作。<\/li>\n<li><b>目标：<\/b>经典做法中是 <code>Σ U·x<\/code>；这里可能是长期速率、信息的代价，或不造成损害。<\/li>\n<li><b>保证：<\/b>经典做法中是最优性或近似比；这里是稳定性、置信水平 δ，或安全界。<\/li><\/ul>\n<p><b>需要检验其迁移性的视角。<\/b>每个视角改变的是一种建模侧重点；它补充而非取代 MRTA，且多个视角可以同时用于一个系统。把这六个主题称为“被忽视的范式”会夸大证据所能确立的内容：排队控制、序贯推断、即兴规划和保守学习都是成熟的研究方向。将它们迁移到某个特定的机器人系统可能有用，但需要明确地匹配假设。每个视角都对应第三部分评为薄弱或部分覆盖的候选空白。<\/p>\n<p><b>六个视角如何选出。<\/b>4.2 列出了参照情形（“先建表、后求解”）所做的六条假设，并展示每个视角放松了哪一条。以所放松的假设来定义每个视角，使这份清单是可推导的，而非偏爱话题的集合；这也意味着其他读者只要指出我们遗漏的某条假设，就可以补充一个视角。<\/p>\n<p><b>六个视角一览。<\/b>每个视角以其主要问题以及与之最相关的第三部分维度来概括。<\/p>\n<table class=\"cmp\"><thead><tr><th>视角<\/th><th>主要问题<\/th><th>最相关的维度<\/th><\/tr><\/thead><tbody><tr><td>P1 · 信息获取<\/td><td>哪种观察、询问或试做值得其代价？<\/td><td>E3、E6、E8<\/td><\/tr><tr><td>P2 · 流与瓶颈<\/td><td>额外的投入在哪里能提升系统层面的产出？<\/td><td>E4、E5、E8<\/td><\/tr><tr><td>P3 · 保守改进<\/td><td>相对于基线，多大的损失是可接受的？<\/td><td>E5、E8、E9<\/td><\/tr><tr><td>P4 · 受控智能体视角<\/td><td>该智能体能对陌生队友推断什么、改变什么？<\/td><td>E1、E6、E7<\/td><\/tr><tr><td>P5 · 协调接口<\/td><td>哪些最小的共享语义和约定能够促成合作？<\/td><td>E1、E6、E7、E9<\/td><\/tr><tr><td>P6 · 系统与激励设计<\/td><td>改变车队、布局或交互规则，能否改善问题本身？<\/td><td>E4、E7、E10<\/td><\/tr><\/tbody><\/table>\n<p><b>每节包含什么。<\/b>每个视角都按同样的五个方面来阅读：模型中改变了什么；哪种已有机制有帮助；它需要哪些假设（迁移条件）；它不能确立什么（局限）；以及一项检验。概览给出通用形式化表述；然后深入原始论文，保留其定理以及从全文中核实的条件；最后讨论把该思想移植到多机器人任务分配时哪些地方会失效。4.9 讨论组合，4.10 汇总反对意见与局限，4.10–4.11 将各视角与执行和公平评估联系起来。<\/p>\n<div class=\"key\"><span class=\"lbl\">阅读规则<\/span>第四部分的大部分理论来自相邻领域：排队论、序贯统计、博弈论、安全强化学习、人机协调。这些保证在相应领域的假设下成立。每个深入小节都会说明哪些假设对机器人团队不成立。<\/div>", "tag": "标准"}, "p4-objections-and-limits": {"key": "p4-objections-and-limits", "eyebrow": "第四部分 · 综合", "title": "反对意见与局限", "notesTitle": "需要谨慎的理由", "notes": "<p><b>“不过是带约束的 MRTA。”<\/b>任何一个视角都可以被纳入一个足够大的 Dec-POMDP 或博弈中。这一观察并无帮助：第二部分的经典求解器及其保证依赖的正是这些视角所放弃的承诺。一个视角的贡献在于给出具有可处理结构和保证的形式化表述，而不在于指出问题具有一般性。<\/p>\n<p><b>借来的保证。<\/b>Max-weight 假设集中式知识和 i.i.d. 到达；Wald 与 Chernoff 假设来自固定假设的 i.i.d. 观测；保守老虎机和 SPIBB 假设环境平稳且只有单个学习者；other-play 假设对称性已知。机器人团队违反了其中每一条，主要是因为其他机器人会做出反应。每个深入页都列出了具体的失效之处。哪些保证在耦合下仍然成立，仍是开放问题。<\/p>\n<p><b>证据薄弱。<\/b>第四部分几乎所有结果都是理论性的或基于仿真的。SPL 临时加入（drop-in）比赛是即兴团队的主要实体证据，而它使用了共享消息包。<\/p>\n<p><b>经典方法胜出之处。<\/b>在一个拥有单一厂商的固定车队、已知地图且需求稳定的仓库中，“先建表，再求解”是正确的做法。这些视角针对的是 1.6 中的三种破缺：缺失的行、不确定的表、耦合的表。<\/p>\n<p><b>并非新范式。<\/b>这六者是互补的视角，既不相互取代，也不取代经典分配：每个都建立在一个已有的研究方向之上，其对机器人团队的价值取决于假设是否匹配（4.1）。<\/p>\n<p><b>选择。<\/b>六个视角源于我们选择列出的六条参照情形假设。3.18 披露了作者对开放团队的兴趣；4.2 中的推导旨在使这一选择可被检验，读者若指出另一项承诺，便会增加另一个视角。<\/p>\n<p><b>我们自身模型中的一个空白。<\/b>对共享协议的需求出现在第二部分（2.3.11、2.4.6），而不是来自第一性原理推导或审查。它已作为 E6e“队友之间没有共享协议”加入第三部分，在检索快照中评为薄弱，并列入候选空白列表的层级 B。十一个外部来源和我们自己的推导都遗漏了它，这提醒我们：模型的完整性是经过检验的，而非经过证明的。<\/p>\n<h4>如何公平地评估一个视角<\/h4>\n<p>上述反对意见中有几条只能通过实验来裁决，而公平的实验评估的是机制本身，而非信息优势。它还应能揭示简单方法何时已经足够。<\/p>\n<p><b>同一共享环境与接口。<\/b>使用相同的任务、动态、观测、动作权限与执行模型。区分同接口的算法基线与拥有完整信息或全团队控制权的特权参照。<\/p>\n<p><b>在系统运行时计时。<\/b>例如，比较 0.1、1、5 和 10 秒的决策预算，同时报告实际挂钟时间与硬件（这是示意性设计，并非测量结果）。纳入通信与观测延迟、计划启动、回退行为以及未完成的求解。如果一种条件让团队暂停、另一种让团队继续执行，应将其设为单独且命名清晰的条件。<\/p>\n<p><b>测量所主张的结果。<\/b>对有限工作负载，报告剩余完工时间（makespan）与截止期限违约；对任务流，报告吞吐量、队列增长与响应时间尾部。还应记录相对原有团队的性能下降、失败的交接、通信代价，以及达到有效参与所需的时间。报告跨随机种子、到达事件和留出队友策略的不确定性，而不只是获胜的平均值。<\/p>\n<p><b>应纳入的比较。<\/b><\/p>\n<table class=\"cmp\"><thead><tr><th>比较<\/th><th>目的<\/th><\/tr><\/thead><tbody><tr><td>原有策略；在可行时新成员等待<\/td><td>衡量集成的反事实价值与损害<\/td><\/tr><tr><td>保留现有分配；为新成员分配符合条件的工作<\/td><td>检验最小干预的收益<\/td><\/tr><tr><td>相同权限下的局部修复与完全重规划<\/td><td>区分邻域限制与搜索预算；若无全团队控制权，应将完全重规划标为单独的参照<\/td><\/tr><tr><td>现有在线即兴协作 / 队友模型方法<\/td><td>检验熟悉的适应机制是否已足够<\/td><\/tr><tr><td>低成本通信、固定观测、被动推断<\/td><td>检验自适应信息收集的必要性<\/td><\/tr><tr><td>组件消融<\/td><td>逐一移除承诺处理、信息选择或保守控制<\/td><\/tr><\/tbody><\/table>\n<p style=\"font-size:.85em;color:var(--muted)\">特权参照并不自动构成上界，除非它是精确的或已证明了某个界。<\/p>\n<div class=\"key\"><span class=\"lbl\">有用的负面结果<\/span>如果低成本的承诺摘要加上常规修复就能与更复杂的方法持平，贡献可能在于接口与问题刻画。不要仅仅为了找回算法优势而把基准测试变难。<\/div>", "tag": "反方论点", "table": {"head": ["反对意见", "其合理之处", "回应"], "rows": [["这些并不是新范式", "排队控制、序贯推断、即兴规划和保守学习都是成熟的研究方向", "同意：它们是需要检验迁移性的视角，而非替代方案"], ["这些不过是附加约束的 MRTA", "每一种都可写成更大的 MDP 或博弈", "原则上如此；但经典求解器及其保证在改写后不再成立"], ["这些保证来自其他领域", "它们假设平稳性、i.i.d. 数据、单一学习者", "每个深入页都列出了失效之处；迁移仍是开放问题"], ["证据主要来自仿真", "临时加入足球赛是唯一长期进行的实体即兴协作测试", "将结论视为假设；实体测试本身就是空白的一部分"], ["经典方法仍然有效", "规整的场景有已知的表、单一构建方、固定团队", "同意；当第一部分的三种破缺出现时，这些范式才有意义"], ["选择反映了作者的偏好", "六者源于我们选择列出的假设；见 3.18", "4.2 使推导可被检验；他人可以增加行"], ["第三部分的模型遗漏了协议", "共享语义出现在第二部分，而非出现在审查中", "事后作为 E6e（薄弱）加入；也可能存在其他遗漏"]], "caption": ""}}, "p4-six-lenses-and-where-to-start": {"key": "p4-six-ways-to-leave-the-table", "eyebrow": "第四部分 · 综合", "title": "六个视角，以及从何处着手", "bullets": ["每个视角都放宽了<b>“先建表，再求解”<\/b>的一项承诺", "每个视角都带来借鉴的理论，以及迁移时的<b>特定失效<\/b>", "都运行于<b>规划与执行<\/b>之中：信念、承诺、交接", "<b>示意性的下一步问题：<\/b>新成员何时应行动、观察或通信？"], "notesTitle": "一页看懂全篇", "notes": "<p><b>第一部分<\/b>将分配拆解为五个问题，并发现了一个隐藏的默认做法：先构建效用表，再求解。<\/p>\n<p><b>第二部分<\/b>表明，各经典流派的差异主要在于如何决策（Q4）：集中式优化、通过市场和共识达成一致、自组织、学习策略以及语言模型规划器。达成一致的方法都假设存在共享协议；自组织是唯一通过环境进行协调的经典流派。<\/p>\n<p><b>第三部分<\/b>从第一性原理推导出问题模型（E1–E10），对照综述进行审查，并以检索快照（而非覆盖率统计）的形式为每个子轴评级。该快照中最薄弱的区域是成员会变化的团队（E1a）、需要耗费时间的信息（E6d），以及会重塑系统的分配（E4d）。<\/p>\n<p><b>第四部分<\/b>提出了六个视角，每个对应一项经典承诺：用速率替代匹配、将信息视为代价、单个机器人的视角、相对于现行方案的安全性、设计问题本身，以及无共享协议的协调。每个视角都有扎实的理论支撑，大多来自相邻领域；每个深入页都记录了该理论的假设，以及机器人团队在何处打破这些假设。4.9 列出了各视角的组合，应将其视为相关证据，而非经认证的空白；在该快照中，最空白的区域是第三部分各 A 级候选空白交汇之处。<\/p>\n<h4>各视角与规划和执行的衔接<\/h4>\n<p>六个视角并不取代规划与执行架构；运行中的团队还需要信念、承诺与监控。符号规划器或 HTN 可以表达任务分解、前提条件、效果、因果依赖和资源约束。分配选择执行者；调度给出时序；运动与操作确立物理可行性。<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_exec\"><\/div>\n<p><b>循环：<\/b>观察并更新信念 → 生成任务或修复选项 → 评估信息、代价与风险 → 就承诺达成一致 → 执行并监控 → 重复。<\/p>\n<p>未知的队友意图不应悄然变为已知的符号事实。应维护一个信念或一组合理的解释，并区分已观察到的效果与预测的效果。信念空间中的任务与运动规划（Kaelbling &amp; Lozano-Pérez, 2013）提供了相关基础；但它并不免除说明其他智能体能改变什么的必要。<\/p>\n<p><b>交接必须保留什么。<\/b><\/p>\n<ul><li><b>所有权：<\/b>启动前后分别由谁负责？<\/li>\n<li><b>依赖关系：<\/b>哪些已完成的效果仍然成立，哪些未完成的动作必须先完成？<\/li>\n<li><b>预约：<\/b>哪些资源、路线或物体已被承诺？<\/li>\n<li><b>有效性：<\/b>什么观察会使新计划失效，允许怎样的恢复？<\/li><\/ul>\n<p>D-ITAGS 和 SharedPlans 是修复与协作承诺方面的相关前驱工作。候选研究问题是这些机制如何与指定的陌生队友及高代价信息相互作用，而不是符号规划与重规划能否首次结合。<\/p>\n<h4>一个具体的下一步问题及其局限<\/h4>\n<p>目标是收窄为可证伪的问题，而不是宣称某个领域是空白。<b>示意性表述：<\/b>当新成员无法替换原有团队策略、只能看到部分任务状态，并且必须尊重进行中的承诺时，它应如何在生产性行动、观察与通信之间做出选择？<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_question\"><\/div>\n<p>这一表述结合了 E1、E6、E7、E8 和 E9；仅当不确定性或物理耦合对应用至关重要时，才纳入 E3 或 E4。它使干预与接口变得显式。它并不确立新颖性：仍须在相同假设下考察最接近的在线即兴协作、通信规划与计划修复方法。<\/p>\n<p>最小研究应首先确定接口是否足以完成常规修复。只有在实测失败提供了动机时，才加入信念建模、信息选择或保守改进。保持任务与执行框架共享，使结果仍可归因于所提出的机制。<\/p>\n<div class=\"key\"><span class=\"lbl\">什么能推动这一领域<\/span>对任何一个视角而言，有价值的贡献是：针对具有异构能力、队友会做出反应的机器人团队给出形式化表述，同时给出在这种耦合下仍然成立的保证，并提供实体机器人上的证据。<\/div>\n<div class=\"key\"><span class=\"lbl\">本综述支持什么，哪些仍待解决<\/span><b>支持：<\/b>精确的问题边界、相关的邻近方法，以及可检验的评估方案。<b>待解决：<\/b>穷尽的新颖性核查、对整个继承文献目录的来源级核实，以及表明该候选组合需要新算法的实证证据。<\/div>", "tag": "总结"}, "p3-candidate-gaps-tier-c": {"key": "p3-the-gap-list-tier-c", "eyebrow": "第三部分 · 结果", "title": "候选空白：C 层", "notesTitle": "层级 C：薄弱，但较少见", "notes": "<p>这些空白在文献中与许多层级 B 空白一样薄弱，但相应情形出现得较少，或仅出现于特定场景：每个设施只决策一次的设施设计、多个机群所有者共用的设施、安全或公平攸关的设施、连通性差的野外部署。<\/p>\n<p>在所有部署中普遍性低，并不意味着在特定场景中不重要。设计新仓库的团队会直接面对 E10c，而由多个机群运营方共用的站点会面对 E7c × E2a。<\/p>", "table": {"head": ["空白", "放宽", "空白证据", "出现场景", "相邻理论", "层级"], "rows": [["回路中包含分配器的设计", "E10c（+E10 相关成对）", "薄弱；设计回路中分配器固定", "每个设施只决策一次", "单调协同设计", "C"], ["面对任务流的策略性机器人", "E7c × E2a", "缺失的成对", "多个机群所有者共用的设施", "机制设计", "C"], ["执行与设计中的非吞吐量目标", "E5 × E9, E10", "已研究成对中的缺失组合", "安全或公平攸关的设施", "—", "C"], ["弥补通信限制的设计", "E6 × E10", "未找到", "连通性差的野外部署", "网络协同设计", "C"]], "caption": ""}}, "p4-flow-and-bottlenecks-keep-the-system-moving": {"key": "p4-p1-flow-view-keep-the-system-moving", "eyebrow": "第四部分 · ② 价值 · P2 流与瓶颈", "title": "流与瓶颈：让系统持续运转", "bullets": ["状态：随到达而增长、随工作而减少的<b>积压<\/b>", "决策：一个反馈<b>策略<\/b>（此刻谁服务哪个队列）", "目标：<b>吞吐量<\/b>、稳定性或系统逗留时间", "保证：<b>容量区域<\/b>，前提是模型相符"], "notesTitle": "分配是一种速率，而非一次匹配", "notes": "<p>在仓库、厨房或装配单元这类持续运行的系统中，工作源源不断地到达，单次分配很快就会过时。<b>模型变化。<\/b>流视角用不断演化的队列、资源占用和可行的服务决策，取代彼此独立的任务评分，并用速率来表述问题。于是，机器人只有通过其对团队目标的影响才算有帮助，而不在于它在局部有多忙碌。这对存在共享瓶颈的持续性工作尤其有用；对于小规模的有限批次，直接的调度可能仍是最清晰的表述。形式化地：<\/p>\n<ul><li><b>状态：<\/b>积压向量 <code>x(t)<\/code>：队列长度、缓冲区水平、各工位上的机器人。<\/li>\n<li><b>决策：<\/b>平稳反馈策略 <code>π: x(t) → u(t)<\/code>，在可行性约束下选择服务哪些队列。<\/li>\n<li><b>目标：<\/b>在尽可能大的到达率下保持积压有界（吞吐量），或最小化稳态系统逗留时间。<\/li>\n<li><b>保证类型：<\/b>容量区域（当且仅当到达率位于其内时系统稳定）、轻载与重载下的常数因子界、收敛到平衡不动点，或基于灵敏度的瓶颈证书。<\/li><\/ul>\n<p><b>图示。<\/b>两条任务流共享一组机器人。所有策略都受限于同一个容量区域。在区域内，好的策略能使队列保持有界；在区域外，<i>任何<\/i>策略下积压都会无界增长。问题由“谁做哪项任务？”变成“需求是否位于区域内，我的策略能否达到其边界？”。<\/p>\n<p><b>可借鉴的机制。<\/b>Max-weight 控制展示了在给定网络模型下，队列压力如何引导服务决策（4.4.1，Tassiulas &amp; Ephremides 的定理 3.2）。接力式分工（bucket brigades）展示了在结构化生产假设下的自组织工作分担（4.4.2）。瓶颈分析识别出哪部分能力制约了产出（4.4.3）。<\/p>\n<p><b>机器人学中已有的工作。<\/b>当任务以泊松流到达时，动态车辆路径问题给出了稳定性条件和时延界。对单车而言，系统稳定当且仅当负载 ρ &lt; 1（Bertsimas &amp; van Ryzin, 1991）；对 m 辆相同车辆，负载 ϱ = λs̄/m &lt; 1 是必要条件（Bullo et al., 2011）。按需出行的再平衡使用流体模型和最小费用流 LP（Pavone et al., 2012）。终身多智能体路径规划度量仓库吞吐量，但把任务分配交给外部分配器（Li et al., 2021）。这些工作覆盖了 E5a，第三部分将其评为“部分覆盖”。<\/p>\n<p><b>迁移条件。<\/b>在应用上述任何结果之前，需定义到达与服务过程、路由、可同时执行的可行动作，以及行驶或切换延迟。在可容许负载下的队列稳定性结果，并不意味着最短完成时间、小的时延尾部，或每条样本路径上队列都有界。一个不断变化的机器人网络可能不满足原定理的假设。<\/p>\n<p><b>MRTA 还缺什么。<\/b>这些保证假设服务者相同；在 DVR 中，异构性仅以组队的数量级结果出现（Bullo et al., §VII）。这些工作都没有处理分配本身会移动瓶颈的情形（E4d，薄弱）。<\/p>\n<p><b>仓库检验。<\/b>将一个感知队列的控制器，与“把新成员分配到最长队列”的做法以及一个基于调度的控制器进行比较。分别独立地增加通道干扰和打包能力。如果下游工位饱和时收益消失，这是关于耦合的证据，并不自动说明规划不佳。<\/p>", "tag": "放宽“一次性价值” · E4d、E5a"}, "p4-information-acquisition-observing-has-a-price": {"key": "p4-p2-information-first-observing-has-a-price", "eyebrow": "第四部分 · ① 未知 · P1 信息获取", "title": "信息获取：观察是有代价的", "bullets": ["效用表<b>未知<\/b>；学习它所花的时间本可用于工作", "每步：<b>观察<\/b>、询问或行动；证据足够即<b>承诺<\/b>", "目标：观察代价 + <b>错误承诺<\/b>的代价", "胜过<b>最接近的备选<\/b>即可，须<b>观测模型<\/b>成立"], "notesTitle": "当效用表需要花钱买", "notes": "<p>参照情形把效用表视为已知。当它未知时，例如机器人在这个团队中的效能未知，或任务需要什么只有尝试后才能揭示，决策就包含两部分：观察什么，以及何时停止观察并作出承诺。<b>模型变化。<\/b>将观察、询问和试做纳入行动集合。它们的价值是对后续可行决策的期望改进，再减去时间、通信和干预代价；对一个无关细节的精确模型几乎没有决策价值。目标是只学习能改进决策的信息。<\/p>\n<p><b>通用表述。<\/b>一个未知量 θ（任务价值、队友类型、自身的有用程度）及其上的信念 <code>b<sub>t<\/sub><\/code>。每一步，要么执行代价为 <code>c(a)<\/code> 的观察动作 <i>a<\/i> 并获得一个样本，要么在时刻 τ 停止并承诺一个分配 <i>x<\/i>。三种标准目标：<\/p>\n<ul><li><b>贝叶斯或拉格朗日形式：<\/b>最小化期望观察代价加上 L × 错误承诺的概率。<\/li>\n<li><b>固定置信度：<\/b>在误差 ≤ δ 的约束下最小化期望停止时间。<\/li>\n<li><b>固定预算：<\/b>在 N 次观察后最大化最终选择的价值。<\/li><\/ul>\n<p><b>共同的答案。<\/b>从 Wald、Chernoff 到最优臂识别，期望观察次数都表现为 <code>log(1/δ) / D*<\/code>，其中 D* 是一个信息速率：最优实验组合相对于最难区分的备选所达到的 KL 散度。对分配而言有两点推论：只需足以排除最接近的竞争分配的证据，而无需填满整张表；每种观察方式的信息速率告诉你应该购买哪种观察。<\/p>\n<p><b>图示<\/b>是示意性的：等待代价随观察时间增长，错误承诺的风险随之下降，总代价在 τ* 处取最小值。其确切位置取决于闲置代价、错误角色的代价，以及备选方案之间的可区分程度。<\/p>\n<p><b>可借鉴的机制。<\/b>序贯检验提供了一套判断证据何时足够的语言（4.3.1）。受控感知和最优臂识别有助于选择信息量大的实验（4.3.2）。考虑通信的即兴规划已经把“问哪个问题”作为规划的一部分（4.7.3）。<\/p>\n<p><b>迁移条件。<\/b>似然比检验和样本复杂度结果（包括上述标度）需要其所声明的统计模型；它们并不是关于融入时间的普适界。相关的观测、会适应的队友以及缺失的假设，都可能使名义置信度失效。应区分关于环境的不确定性与关于队友的不确定性。<\/p>\n<p><b>并不总是“先观察，后行动”。<\/b>停止表述读起来像是先有一段等待期、再作出承诺，但有用的工作本身也会揭示信息，而且这一决策是重复进行的。新成员可以先搬运一件低风险物品，观察由此产生的队列，询问调度方的承诺摘要，然后修正其下一步行动（见图）。“承诺”不必意味着永久角色。问题在于在学习的同时选择有用的干预，而不是把所有信息收集都硬塞进一个初始等待期。<\/p>\n<div class=\"fig nfig\" data-fig=\"rv_interleave\"><\/div>\n<p><b>公平的比较。<\/b>一个实用的比较应包括：立即行动、被动观察、固定观察窗口、先询问的行为，以及自适应信息策略。对每一种都计入相同的耗时与通信代价。<\/p>\n<p><b>在 MRTA 中。<\/b>第三部分在其检索快照中将 E6d“获取信息需要时间”评为薄弱。细读两篇最接近论文的全文后，这一评级不变（4.3.3）。<\/p>", "tag": "放宽“免费信息” · E6d、E2d"}, "p4-controlled-agent-s-view-control-only-yourself": {"key": "p4-p3-individual-view-control-only-yourself", "eyebrow": "第四部分 · ③ 信息与权限 · P4 受控智能体视角", "title": "受控智能体视角：只控制你自己", "bullets": ["一台机器人只选择<b>自己的<\/b>动作", "队友从决策变量变为<b>状态<\/b>的一部分", "目标：对<b>信念的最优响应<\/b>，在众多团队上评估", "需要正确的<b>假设空间<\/b>与真正行动的<b>权限<\/b>"], "notesTitle": "从团队最优到最优响应", "notes": "<p>经典分配器对所有成员的分配进行优化。当一台机器人加入他人组建的团队，或与无法指挥的队友并肩工作时，它面对的并不是这个决策。个体视角从该机器人的角度表述问题。即兴合作既改变了被建模的队友，也改变了可用的干预，因此机器人必须依据自己实际拥有的权限进行规划。<\/p>\n<p><b>一般表述。<\/b>机器人 <i>i<\/i> 选择自己的策略 <code>π<sub>i<\/sub><\/code> 以最大化期望团队回报；其他机器人按未知的类型或模型 <code>θ<sub>−i<\/sub><\/code> 行动，<i>i<\/i> 持有信念 <code>b<sub>i<\/sub> ∈ Δ(S × Θ<sub>−i<\/sub>)<\/code>，并根据观测进行更新。团队成员与任务集合可能在其控制之外发生变化。成功与否以它可能遇到的队友和任务上的平均团队表现来评判（4.6.1）。<\/p>\n<p><b>与规划者视角相比的变化。<\/b>受控机器人在推理其他智能体策略的同时选择自己的策略。它可以维护关于队友类型或潜在意图的信念，再针对这种不确定性进行规划。<\/p>\n<ul><li>队友以类型或模型的形式成为状态的一部分，而非决策变量。<\/li>\n<li>联合最优被对信念的最优响应所取代。<\/li>\n<li>表现取决于真实队友是否位于假设空间内（4.6.2）。<\/li><\/ul>\n<p>以集中方式实现这种推断，并不赋予对团队的集中权限：机器人可以计算关于所有成员的信念，但仍只能在自身所持权限范围内行动。<\/p>\n<p><b>介于两种视角之间。<\/b>N 智能体即兴协作（N-agent ad hoc teamwork，Wang et al., 2024）控制 M 个智能体中的 N 个。其矩阵博弈示例表明，将单智能体即兴策略复用于两个受控智能体，可能比联合训练它们更差，这也是两种视角给出不同答案的原因之一。<\/p>\n<p><b>可借鉴的机制。<\/b>OPAT（Wu, Zilberstein &amp; Chen, 2011）是在线即兴规划的明确先例。PLASTIC 展示了队友模型的复用与适应如何支持行为选择，Albrecht et al. 则说明了基于类型的信念何时可信（4.6.2）。这些是与陌生协作者进行重复决策的直接已有工作。<\/p>\n<p><b>迁移条件。<\/b>说明可观测性假设、候选模型类别以及队友可能如何适应。队友类型库可能遗漏部署时的实际策略。开放成员制还需要追踪谁在场，以及其角色如何影响状态空间与动作空间（4.6.3）。更准确的推断无法弥补机器人没有权限采取的动作。<\/p>\n<p><b>边界检验。<\/b>如果原有调度器提供完整计划并能指挥每台机器人，核心问题可能是动态集中式规划。如果新成员必须适应一个它无法替换的陌生原有策略，即兴推理就更为核心。两种架构本身都不必然是更好的研究设定；由部署决定。<\/p>\n<p><b>在 MRTA 中。<\/b>Lerman、Jones 及其同事的群体机器人研究在“每台机器人依据局部观测决策”的意义上是个体式的，但所有机器人运行同一规则。Eck et al. (2020) 是本综述所见最清晰的自我中心式任务选择模型：每个灭火智能体在建模邻居的同时规划扑救哪一处火点。4.6.3 详细比较了开放团队相关工作；在第三部分的检索快照中，E1a 的评级仍为“薄弱”。<\/p>", "tag": "放宽“完全控制” · E1a, E7b, E1b, E7a"}, "p4-conservative-improvement-never-worse-than-now": {"key": "p4-p4-safe-increments-never-worse-than-now", "eyebrow": "第四部分 · ② 价值 · P3 保守改进", "title": "保守改进：永不差于现状", "bullets": ["对运行中的团队决定一项<b>改变<\/b>，而非从零开始规划", "“不做改变”是回退选项；需确认<b>等待不会阻挡他人<\/b>", "保证：P(new &lt; baseline − ε) ≤ δ", "代价明确（<b>遗憾、数据、拒绝<\/b>）；<b>不等于物理安全<\/b>"], "notesTitle": "以现行方案为参照点", "notes": "<p>运行中的团队已有一套工作方式。新的分配、新成员或新策略只有在改进现状时才有用；如果在学习过程中使情况变差，则是有害的。安全增量方法以现行方案为参照点。但只有当基线的行为与所承诺的比较都有明确定义时，基线才有用。<\/p>\n<p><b>一般表述。<\/b>给定现行方案 π₀、在其下收集的数据 D、性能度量 J、容差 ε 和风险水平 δ，算法返回一个候选方案或“保持 π₀”，使得 <code>P<sub>D<\/sub>[J(output) &lt; J(π₀) − ε] ≤ δ<\/code>。只有当候选方案性能的置信下界超过阈值时才予以考虑；回退到 π₀ 始终可行。<\/p>\n<p><b>明确“不造成损害”的含义。<\/b>模型上的变化是：在相对参照策略的既定性能预算约束下优化改进。需明确该准则针对的是期望回报、高概率界、各前缀上的累积奖励，还是最坏情况损失。这些是不同的要求，下面两种形式在其中做出了不同的选择。<\/p>\n<p><b>两种形式。<\/b><\/p>\n<ul><li><b>在线、任意时刻<\/b>（保守老虎机，4.5.1）：累积奖励必须在每一轮都保持在基线所能获得奖励的一定比例之上；原始工作同时涵盖随机与对抗设定。它约束的是<i>学习<\/i>。<\/li>\n<li><b>批量、一次性<\/b>（HCPI、Seldonian 算法、SPIBB，4.5.2）：只有当留出数据证明新策略合格时才部署。HCPI 和 Seldonian 算法在部署前对候选方案进行认证，或返回“未找到解”；SPIBB 在其 MDP 与置信假设下，从固定数据集给出近似的基线改进。它约束的是<i>部署<\/i>。<\/li><\/ul>\n<p>这些都不是“每一次物理执行在每一时刻都优于原有团队”的一般保证。<\/p>\n<p><b>与“先优化再部署”的区别。<\/b>决策变量是改变本身，而非分配；输出可以是“不做改变”；保证针对的是算法在随机数据上的表现，而非达到最优；安全的代价以数值形式呈现（额外遗憾、数据需求，或答案为“未找到解”的频率）。<\/p>\n<p><b>迁移条件。<\/b>定义加入后可行的基线、损失容忍度、时域与不确定性模型。如果新成员可以等待而不阻挡任何人，不行动可以作为基线；但这并非自动成立，因此“保持 π₀”这一回退选项需要针对具体团队加以检验，而不能直接假定。性能上的保守不等于物理安全：物理安全与资源预约仍需单独的约束。<\/p>\n<p><b>明确反事实。<\/b>将加入后的策略与相同需求和扰动下的同一原有团队运作进行比较。仅有原有团队时的结果通常是评估用的反事实，而非可同时观测的信号。多次试验中的经验损失率是证据，而不是无损保证的证明。应同时报告平均改进以及性能下降的概率与严重程度。<\/p>\n<p><b>在 MRTA 中。<\/b>所读论文中没有一篇将相对基线的保证应用于多机器人任务分配。Rudolph et al. (2021) 认为固定的风险态度可能有害，并根据情境调整风险偏好；Shi 和 Sukhatme (2024) 通过对当前参数的最小偏离来推断人类的风险参数。两者都使用绝对阈值或参数距离，而非“不差于当前团队”。在第三部分的检索快照中，由于风险感知目标已经存在，E5b 仍为“部分覆盖”；相对基线的形式在本综述中未找到。<\/p>", "tag": "放宽“替换计划” · E5b, E7b"}, "p4-system-and-incentive-design-change-it-then-solve-it-simply": {"key": "p4-p5-design-the-problem-change-it-then-solve-it-simply", "eyebrow": "第四部分 · ④ 运行与设计 · P6 系统与激励设计", "title": "系统与激励设计：先改变问题，再简单求解", "bullets": ["改变问题，使<b>简单规则<\/b>就能表现良好", "三个旋钮：<b>收益<\/b>、<b>团队<\/b>、<b>布局<\/b>；新成员很少<b>掌握它们<\/b>", "双层优化：选择 d，以最大化规则所产生结果的福利", "只有收益设计有<b>证明<\/b>；其余依赖指标或仿真"], "notesTitle": "分配作为设计问题的内层循环", "notes": "<p>与其为固定问题设计更好的分配器，不如改变问题本身。如果收益、团队或工作空间选得好，一个简单的分散式规则的表现，可能不逊于在设计糟糕的问题上运行的复杂规划器。车队、布局与激励可能比再多一次求解器迭代更重要。<\/p>\n<p><b>一般表述。<\/b><code>max<sub>d∈𝒟<\/sub> J(d)<\/code>，其中 <code>J(d) = W(a(d))<\/code>，<code>a(d)<\/code> 是在设计 d 下运行固定的简单分配规则所得的结果：博弈的均衡、群体的转移动态，或均匀随机任务分配后再进行路径规划。目标可以是对结果的最坏情况（无政府代价，price of anarchy），也可以是通过仿真估计的期望。<\/p>\n<p><b>模型变化。<\/b>将选定的结构属性视为决策：车队构成、工位容量、充电位置、通信接口，或局部控制器所用的奖励。这会把部分工作从运行时分配转移到设计阶段。协同设计同时优化设备与策略；下面三类设计是本综述考察的机制。<\/p>\n<p><b>三类设计。<\/b><\/p>\n<ul><li><b>收益或规则设计<\/b>（4.8.1）：d 是智能体的局部效用。这是唯一有定理的一类：在福利次模等条件下，有均衡存在性与无政府代价界（在分布式福利博弈中，均衡至少达到最优的一半）。机制设计与收益设计寻求支持团队目标的局部规则。存在自利参与者的部署需要激励相容；信息有限的合作团队可能只需要协调。<\/li>\n<li><b>团队设计<\/b>（4.8.2）：d 是团队包含哪些机器人、具备哪些特性。多样性度量可预测分配的难度；团队组建本身是 NP 难的，采用启发式求解。<\/li>\n<li><b>环境设计<\/b>（4.8.2）：d 是布局。采用质量–多样性方法搜索，并在仿真中评估，没有保证。将路径规划器纳入循环的布局搜索，提高了单个规划器在出现拥堵前所能处理的机器人数量。<\/li><\/ul>\n<p><b>迁移条件。<\/b>说明谁可以改变系统、在什么时间尺度上、以何种代价。新成员通常无法重新设计原有团队的奖励函数或仓库布局。设计阶段的保证不会自动在未知的运行时群体中继续成立。<\/p>\n<p><b>仓库检验。<\/b>比较将同样的资源预算用于再增加一台移动机器人、增加打包容量，或改进信息接口。如果结构性干预胜出，就报告这一结论。这样可以避免把物理容量限制归因于分配上的缺陷。<\/p>\n<p><b>在 MRTA 中。<\/b>在第三部分的检索快照中，车队、布局与策略的协同设计（E10c）被评为薄弱。此处阅读的全文说明了原因：布局搜索固定了分配器（随机目标），团队多样性工作只度量多样性而不选择团队，收益设计分析的是均衡，而非行程、时序或能力等机器人约束。<\/p>", "tag": "放宽“给定问题” · E10c, E10a, E10b"}, "p4-coordination-interfaces-talk-or-watch": {"key": "p4-p6-no-shared-protocol-talk-or-watch", "eyebrow": "第四部分 · ③ 信息与权限 · P5 协调接口", "title": "协调接口：“说”还是“看”", "bullets": ["队友来自<b>不同的构建方<\/b>：没有约定的格式、评分或惯例", "目标：在<b>一群伙伴<\/b>中都表现良好（交叉配对，cross-play）", "两条通道：<b>“说”<\/b>需要落地，<b>“看”<\/b>需要解释", "许多方法只是把约定<b>上移<\/b>；接口可以<b>很小，但不能没有<\/b>"], "notesTitle": "无需事先约定的协调", "notes": "<p>2.3 中的每种达成一致方法都假设机器人共享消息格式、评分规则和打破平局的惯例。来自不同构建方的机器人，或加入一个其软件从未见过的团队的机器人，都无法作此假设。2.4.6 节指出，自组织是唯一转而通过环境进行协调的经典流派。<\/p>\n<p><b>一般表述。<\/b>机器人 <i>i<\/i> 运行由其自身构建方构建的策略；其伙伴来自未知群体 𝒫，动作空间可能不同。不存在具有约定含义的共享消息字母表，没有共享效用表，也没有共享算法。每个构建方求解 <code>max<sub>π<sub>i<\/sub><\/sub> E<sub>π<sub>−i<\/sub>∼𝒫<\/sub>[J(π<sub>i<\/sub>, π<sub>−i<\/sub>)]<\/code>：与未共同训练过的伙伴也能表现良好。<\/p>\n<p><b>接口可以很小，但不能没有。<\/b>没有联合设计的策略，并不意味着没有共同含义。模型上的变化是追问：智能体必须共享什么，才能使各自独立的决策相互兼容。候选项包括任务标识符、公开的动作效果、意图消息、预约，以及“提议–接受”握手。<\/p>\n<p><b>两条通道。<\/b><\/p>\n<ul><li><b>“看”：<\/b>从伙伴的动作及其在环境中留下的痕迹推断其意图。隐式通信、可读动作（legibility）、环境信号以及环境介导协调（stigmergy，即通过环境进行的间接协调）都属于这一类，可以在不发送消息的情况下支持协调（4.7.2）。<\/li>\n<li><b>“说”：<\/b>发送消息（如今常为自然语言），这需要耗费时间，且只有在伙伴按预期解码时才有用（2.3.10）。<\/li>\n<li>决定使用哪条通道以及何时使用，本身就是一个信息问题。当直接询问成本较低时，它可能更可取；通信文献明确刻画了这种权衡（4.7.3）。<\/li><\/ul>\n<p><b>贯穿本节的一个提醒。<\/b>许多零样本协调文献并未消除约定，而是把它上移了一层。它研究的是在指定的共享结构下，独立训练的智能体之间的兼容性：设计者仍共享博弈本身、其对称性、基础策略、仿真器或学习规则（4.7.1）。RoCo 和 SMART-LLM 等系统有时被引为异构协调的例子，但它们对所有机器人使用同一个语言模型或设计好的对话协议，因此实际上存在共享协议。<\/p>\n<p><b>迁移条件。<\/b>观察仍需解释，自然语言仍需落地（grounding），环境信号仍需可被检测。交换任务状态的协议并不等同于联合优化的团队策略。反过来，假设各方都服从一种新的协商算法，本身就是一项实质性的协调假设。<\/p>\n<p><b>最小交接示例。<\/b>新成员提出一项任务及其启动时间；原有团队接受或拒绝；被接受的预约具有所有者和失效时间；完成后更新公开的任务状态。这是一个示意性接口，并非新协议，也不主张握手能解决所有失败。<\/p>\n<p>因此，评估时除比较策略外，还应比较接口选择：完整公开调度、任务级摘要、按需询问以及仅靠观察。让结果决定隐式推断实际上有多必要。<\/p>", "tag": "放宽“共享协议” · E6e, E1b, E7a"}, "p3-four-groups-of-elements-and-the-lens-for-each": {"eyebrow": "第三部分 · 步骤 1", "title": "要素分四组，每组对应的视角", "bullets": ["十个要素分成<b>四组<\/b>，每组回答一个朴素的问题", "① 什么是未知的 · ② 怎样才算帮上忙 · ③ 谁知道什么、谁能决定 · ④ 系统如何运行", "第四部分沿用<b>同样的四组<\/b>：每个视角回答其中一组", "E4d、P2 等编号只是标签；<b>悬停<\/b>任一编号即可查看含义"], "notesTitle": "第三、四部分共用的一个框架", "notes": "<p>十个要素、三十八个子轴，逐一记住太多了。它们可以分成四组，每组回答一个关于运行中团队的朴素问题。要素的编号使每组连续排列；第四部分的视角也按同样的四组组织，因此第三部分遇到的某个子轴，可以直接对应到第四部分讨论应对办法的位置。<\/p>\n<table class=\"cmp\"><thead><tr><th>组<\/th><th>它问的问题<\/th><th>要素（第三部分）<\/th><th>视角（第四部分）<\/th><\/tr><\/thead><tbody>\n<tr><td>① 未知<\/td><td>关于团队、任务和机器人能力，哪些是事先不知道的？<\/td><td>E1 智能体 · E2 任务 · E3 动态（3.5–3.7）<\/td><td>P1 信息获取（4.3）<\/td><\/tr>\n<tr><td>② 价值<\/td><td>什么才算有用的帮助：更好的单次得分、更高的吞吐量，还是不损害已在运转的部分？<\/td><td>E4 交互 · E5 目标（3.8–3.9）<\/td><td>P2 流与瓶颈（4.4） · P3 保守改进（4.5）<\/td><\/tr>\n<tr><td>③ 信息与权限<\/td><td>每个机器人能观察或询问什么？它能改变谁的行为？<\/td><td>E6 信息 · E7 控制（3.10–3.11）<\/td><td>P4 受控智能体视角（4.6） · P5 协调接口（4.7）<\/td><\/tr>\n<tr><td>④ 运行与设计<\/td><td>何时必须做决策、决策如何执行、系统本身能否改变？<\/td><td>E8 时机 · E9 执行 · E10 系统设计（3.12–3.14）<\/td><td>P6 系统与激励设计（4.8）；执行与规划见 4.11<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>为什么是这四组。<\/b>它们沿着新成员加入运行中团队时遇到问题的顺序排列：先是知道得不够（①），然后要判断什么才真正有帮助（②），接着发现自己只能观察和改变团队的一部分（③），最后它的决策需要定时与执行，或者需要重新设计系统（④）。分组只是阅读辅助，并不是对模型的进一步主张；E10 是在完备性审查之后才加入的（3.4.2）。<\/p>\n<p><b>视角会涉及不止一组。<\/b>每个视角按其主要所属的组放置。受控智能体视角（P4）也涉及未知队友（E1b），信息获取（P1）也涉及信息的代价（E6d）。4.2 列出了全部相关子轴。<\/p>\n<div class=\"key\"><span class=\"lbl\">如何浏览<\/span>第三、四部分每页顶部的彩色按钮显示当前所在的组，目录中也用同样的颜色标记。悬停 E 或 P 编号可查看其含义，并跳转到对应页面。<\/div>"}}};

function slideHTML(s,n){
  const foot=`<div class="foot"><span>${s.part.label} · ${s.part.title}</span><span>${s.num}</span></div>`;
  if(s.kind==="title") return `<div class="slide title-slide"><div class="body"><div><div class="eyebrow">${s.eyebrow}</div><h2>${tcode(s.title)}</h2><div class="sub">${s.sub}</div></div><div class="fig">${figSvg(s)}</div></div>${foot}</div>`;
  if(s.kind==="table"){
    const t=s.table;
    const rows=t.rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map((c,j)=>`<td class="${j+1===(t.hlCol??-1)?'q4':''} ${(t.givenCols||[]).includes(j+1)?'given':''}">${c}</td>`).join("")}</tr>`).join("");
    return `<div class="slide wide">${stripHTML(n)}<div><div class="eyebrow">${s.eyebrow}</div><h2>${tcode(s.title)}</h2></div><div class="body"><div style="min-width:0"><table class="${t.dense?"dense":""} ${t.xdense?"xdense":""}"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>${t.caption?`<div class="tcap">${t.caption}</div>`:""}</div></div>${foot}</div>`;
  }
  const math = s.math ? `<div class="math">${s.math.map(r=>`<span class="ml">${r[0]}</span><span class="me">${r[1]}</span><span class="mn">${r[2]||""}</span>`).join("")}</div>` : "";
  const intro = s.intro ? `<p class="solves"><span class="lbl">${U("solves")}</span><span class="txt">${s.intro.problem.charAt(0).toUpperCase()+s.intro.problem.slice(1)}</span></p>` : "";
  const back = s.hidden ? `<button type="button" class="backlink" data-back>${U("back")} ${FLAT[s.parent].num}</button>` : "";
  return `<div class="slide${s.math?' has-math':''}">${back}${stripHTML(n)}<div><div class="eyebrow">${s.eyebrow}</div><h2>${tcode(s.title)}</h2>${intro}</div><div class="body"><div class="lcol">${math}<ul>${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul></div><div class="fig">${figSvg(s)}</div></div>${foot}</div>`;
}

FLAT.forEach((f,i)=>{ if(f.hidden) return; let m=f.title.match(/^(E(?:10|[1-9])[a-e]?)\s/); if(m&&f.part.id==="p3"&&!(m[1] in GLX)) GLX[m[1]]=i;

/* ================= Glossary pop-ups ================= */
const GL={
 Q1:{en:["Q1 · Tasks","What work exists, and where does it come from?","Depot: is the parcel list fixed in the morning, or do parcels keep arriving?"],zh:["Q1 · 任务","有哪些工作？它们从何而来？","快递站：包裹清单是早上就定好的，还是不断有新包裹到达？"]},
 Q2:{en:["Q2 · Capability","Who is able to do what, and how well?","Depot: one courier has an e-bike; another walks."],zh:["Q2 · 能力","谁能做什么？做得多好？","快递站：有的快递员骑电动车，有的步行。"]},
 Q3:{en:["Q3 · Utility","What is a robot–task pairing worth, or cost?","Depot: distance, time, chance of success."],zh:["Q3 · 效用","一个机器人–任务配对值多少、代价多少？","快递站：距离、时间、成功概率。"]},
 Q4:{en:["Q4 · Mechanism","Who makes the decision, and by what rule?","Depot: the dispatcher assigns, couriers grab jobs, or everyone improvises."],zh:["Q4 · 机制","由谁决策？按什么规则？","快递站：调度员指派、快递员抢单，或者各自随机应变。"]},
 Q5:{en:["Q5 · Dynamics","What happens when the world changes?","Depot: someone calls in sick, an urgent parcel arrives, a road closes."],zh:["Q5 · 动态","世界变化时怎么办？","快递站：有人请病假、来了加急件、某条路封了。"]},
 ST:{en:["ST · single-task robots","Each robot works on at most one task at a time.","Example: a tote carrier holds one tote."],zh:["ST · 单任务机器人","每个机器人同一时刻最多执行一个任务。","例：搬运机器人一次只搬一个周转箱。"]},
 MT:{en:["MT · multi-task robots","A robot can work on several tasks at the same time.","Example: a patrol robot that also streams video for mapping."],zh:["MT · 多任务机器人","一个机器人可以同时执行多个任务。","例：巡逻机器人同时为建图回传视频。"]},
 SR:{en:["SR · single-robot tasks","Each task needs exactly one robot.","Example: inspect one aisle."],zh:["SR · 单机器人任务","每个任务只需要一个机器人。","例：巡检一条货道。"]},
 MR:{en:["MR · multi-robot tasks","Some tasks need several robots acting together (a coalition).","Example: two robots carry a long beam."],zh:["MR · 多机器人任务","有些任务需要多个机器人协同完成（一个联盟）。","例：两台机器人一起抬一根长梁。"]},
 IA:{en:["IA · instantaneous assignment","Only current information is available, so robots are assigned now, with no planning ahead.","Example: give the robots that are free now the tasks that are open now."],zh:["IA · 即时分配","只有当前信息可用，因此立即分配，不做前瞻规划。","例：把现在空闲的机器人分给现在待做的任务。"]},
 TA:{en:["TA · time-extended assignment","More is known (all tasks, or a model of how they arrive), so each robot gets a schedule over time.","Example: give each robot an ordered list of pickups for the shift."],zh:["TA · 时间扩展分配","已知更多信息（全部任务，或任务到达的模型），因此为每个机器人安排一段时间内的日程。","例：为每个机器人排好本班次的取货顺序。"]},
 ND:{en:["ND · no dependencies","A pairing's utility can be computed on its own.","Example: the cost of R1→T1 does not depend on any other choice."],zh:["ND · 无依赖","每个配对的效用可以单独计算。","例：R1→T1 的代价与其他任何选择无关。"]},
 ID:{en:["ID · in-schedule dependencies","A pairing's utility depends on the other tasks the same robot does.","Example: travel cost depends on the robot's own route."],zh:["ID · 日程内依赖","配对的效用取决于同一机器人承担的其他任务。","例：行驶代价取决于该机器人自己的路线。"]},
 XD:{en:["XD · cross-schedule dependencies","A pairing's utility also depends on other robots' schedules.","Example: the door must be opened before the cart goes through."],zh:["XD · 跨日程依赖","配对的效用还取决于其他机器人的日程。","例：门必须先打开，推车才能通过。"]},

const GLCAT=k=>k[0]==="Q"?"Q":["ND","ID","XD","CD"].includes(k)?"I":/^[ECP]\d/.test(k)?k[0]:"G";

function glKeys(m){

function glAnnotate(root, skip=new Set()){

  if(tip.contains(e.target)){ clearTimeout(hideT); return; }
  const t=tipTarget(e); if(!t){ return; }
  if(pinned||t===tipFor){ clearTimeout(hideT); return; }
  clearTimeout(tipT); tipT=setTimeout(()=>showTip(t), t.dataset.tipk?1000:650);
});
document.addEventListener("mouseout",e=>{
  const t=tipTarget(e)||(tip.contains(e.target)?tip:null); if(!t) return;
  const to=e.relatedTarget; if(to&&(t.contains(to)||tip.contains(to)||(tipFor&&tipFor.contains?.(to)))) return;
  clearTimeout(tipT); if(!pinned) hideT=setTimeout(hideTip,220);
});
function goKey(k){ const i=FLAT.findIndex(f=>f.id===k||f.key===k); if(i>=0) go(i); }
document.addEventListener("click",e=>{
  const gb=e.target.closest?.("#gltip [data-goi]"); if(gb){ const i=+gb.dataset.goi; hideTip(); go(i); return; }
  if(tip.contains(e.target)) return;
  const lk=e.target.closest?.("[data-goto]"); if(lk){ e.preventDefault(); e.stopPropagation(); hideTip(); goKey(lk.dataset.goto); return; }
  const bk=e.target.closest?.("[data-back]"); if(bk){ e.stopPropagation(); hideTip(); const s=FLAT[cur]; go(s.hidden?s.parent:cur); return; }
  const g=e.target.closest?.(".gl");
  if(g&&!g.closest("#toc")){ e.preventDefault(); e.stopPropagation(); if(pinned&&tipFor===g) hideTip(); else showTip(g,true); return; }
  if(pinned) hideTip();
},true);
document.addEventListener("keydown",e=>{
  const g=e.target.closest?.(".gl,[data-goto]");
  if(g&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.stopPropagation(); if(g.dataset.goto){ hideTip(); goKey(g.dataset.goto); } else if(pinned&&tipFor===g) hideTip(); else showTip(g,true); return; }
  if(e.key==="Escape"&&!tip.hidden){ hideTip(); }
},true);
addEventListener("scroll",()=>{ if(!pinned) hideTip(); else if(tipFor&&document.contains(tipFor)) showTip(tipFor,true); },{passive:true});

bindToc(); applyChrome(); buildToc();
const h=(location.hash||"").slice(1); const start=FLAT.findIndex(f=>f.key===h);
go(start>=0?start:0,false);
</script>
