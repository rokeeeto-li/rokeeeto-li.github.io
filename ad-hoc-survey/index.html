<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teamwork Reading Map</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
<link rel="icon" type="image/png" href="/favicon-32-dark.png" sizes="32x32" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/favicon-16-dark.png" sizes="16x16" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">
<style>
/* Style follows qihangli.com: plain academic page, Open Sans, 960px column, hairline rules, bracketed text links, round theme toggle. Only the topic colours in the chart are added. */
:root {
  --font: 'Open Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --link: #1a56a7; --rule: #e5e7eb; --accent: #b1292b; --ph: #f1f3f5;
  --c1: #8A919C; --c2: #2a78d6; --c3: #eb6834; --c4: #1baf7a; --c5: #eda100;
  --c6: #e87ba4; --c7: #5b46c4; --c8: #4a3aa7; --c9: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --fg: #e6e8eb; --muted: #9aa3ad; --link: #6cb0ff; --rule: #2a2e35; --accent: #ff7b7e; --ph: #1d2026;
    --c1: #9AA1AC; --c2: #3987e5; --c3: #d95926; --c4: #199e70; --c5: #c98500;
    --c6: #d55181; --c7: #9085e9; --c8: #9085e9; --c9: #e66767; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --fg: #e6e8eb; --muted: #9aa3ad; --link: #6cb0ff; --rule: #2a2e35; --accent: #ff7b7e; --ph: #1d2026;
  --c1: #9AA1AC; --c2: #3987e5; --c3: #d95926; --c4: #199e70; --c5: #c98500;
  --c6: #d55181; --c7: #9085e9; --c8: #9085e9; --c9: #e66767; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased; padding-inline: 0; transition: background .2s, color .2s; }
.wrap { max-width: 960px; margin: 0 auto; padding: 56px 24px 40px; }
.wrap * { min-width: 0; }
a, .lnk { color: var(--link); text-decoration: none; }
a:hover, .lnk:hover { text-decoration: underline; }
.lnk { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; }
.lnk[disabled] { color: var(--muted); cursor: default; text-decoration: none; opacity: .6; }
.br::before { content: "["; } .br::after { content: "]"; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }
.sw { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.muted { color: var(--muted); }

.theme-toggle { position: fixed; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; z-index: 10; }
.theme-toggle:hover { border-color: var(--muted); }
.theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* top block, same grid as the home page: side column + name + intro */
.top { display: grid; grid-template-columns: 220px 1fr; grid-template-areas: "side name" "side intro"; grid-template-rows: auto 1fr; column-gap: 40px; align-items: start; }
.side { grid-area: side; } .name { grid-area: name; } .intro { grid-area: intro; }
.name { font-size: 2.1rem; line-height: 1.2; margin: 0 0 .45em; letter-spacing: -.01em; font-weight: 700; }
.contact { list-style: none; padding: 0; margin: 8px 0 0; font-size: .93rem; }
.contact li { display: flex; gap: 10px; margin: .3em 0; }
.contact span { flex: 0 0 76px; color: var(--muted); }
.intro p { margin: .7em 0; text-wrap: pretty; }
.search { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.search input { flex: 1 1 240px; max-width: 340px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--fg); font: inherit; font-size: .95rem; }
.search input::placeholder { color: var(--muted); }
h2 { font-size: 1.35rem; margin: 48px 0 12px; font-weight: 700; }
.tab { color: var(--link); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; }
.tab:hover { text-decoration: underline; }
.tab[aria-selected="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
.hint { font-size: .92rem; color: var(--muted); margin: 0 0 10px; }

/* chart */
.chartbox { position: relative; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 0 4px; }
.rsz { height: 16px; display: flex; align-items: center; justify-content: center; cursor: ns-resize; touch-action: none; user-select: none; }
.rsz span { width: 46px; height: 4px; border-radius: 2px; background: var(--rule); transition: background .15s; }
.rsz:hover span, .rsz.on span, .rsz:focus-visible span { background: var(--muted); }
.scroller { overflow-x: auto; overflow-y: hidden; position: relative; }
html { scrollbar-gutter: stable; overflow-y: scroll; }
.scroller svg { display: block; min-width: 760px; width: 100%; height: auto; }
.lbl { fill: var(--fg); font-family: var(--font); font-size: 12px; }
.lbl.mut { fill: var(--muted); }
.lbl.year { fill: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; font-size: 11px; }
.lbl.year:hover { fill: var(--link); text-decoration: underline; }
.lbl.lane { cursor: pointer; }
.lbl.lane:hover { fill: var(--link); text-decoration: underline; }
.gridl { stroke: var(--rule); stroke-width: 1; }
.band { fill: var(--ph); }
.area { fill-opacity: .2; transition: opacity .15s; pointer-events: none; }
.brushbg { fill: transparent; cursor: crosshair; }
.brushsel { fill: var(--link); fill-opacity: .1; stroke: var(--link); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.sellbl { font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.narrow { display: none; }
@media (max-width: 800px) { .narrow { display: inline; } }
.lg { display: inline-flex; align-items: center; gap: 5px; margin-right: 8px; }
.lg .d { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.lg .d.r { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--fg); margin: 0 3px 0 3px; width: 8px; height: 8px; }
.dot { cursor: pointer; transition: opacity .15s; }
.dot.adj { fill-opacity: .42; stroke: var(--bg, #fff); }
.seg { cursor: pointer; fill: var(--muted); fill-opacity: .55; transition: fill-opacity .15s; } .seg:hover { fill-opacity: .85; }
.seg.part { fill-opacity: .16; } .seg.part:hover { fill-opacity: .3; }
.segsel { fill: var(--muted); fill-opacity: .8; pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 4px; padding: 5px 9px; font-size: .82rem; line-height: 1.4; max-width: 280px; z-index: 5; }
.tip b { font-weight: 600; }

/* lineage links */
.lk { fill: none; stroke: var(--fg); stroke-width: 1.5; opacity: .3; transition: opacity .15s; pointer-events: none; stroke-linecap: round; }
.ah { fill: var(--fg); opacity: .4; stroke: var(--bg); stroke-width: .8; stroke-linejoin: round; paint-order: stroke; transition: opacity .15s; pointer-events: none; }
.ah.on { opacity: 1; }
.ah.off { opacity: .05; }
.lk.bl { stroke-dasharray: 4 3; stroke-width: 1.1; opacity: .26; }
.lk.on { stroke: var(--fg); stroke-width: 2.4; opacity: 1; }
.lk.off, .lk.bl.off { opacity: .05; }
.lk.bl.on { stroke-width: 2.2; opacity: 1; }
.ah.bl { opacity: .3; }
.ah.bl.on { opacity: 1; }
.ah.bl.off { opacity: .05; }
.lin { margin: 8px 0 2px; }
.lin h5 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 8px 0 2px; }
.lrow { margin: 5px 0; font-size: .93rem; }
.lrow .lnote { font-size: .88rem; color: var(--muted); max-width: 72ch; }
.lg svg { vertical-align: middle; }

/* publication-style entries */
.pub { padding: 16px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 1px; }
.pub:last-child { border-bottom: 0; }
.ptitle { font-weight: 700; line-height: 1.4; margin-bottom: 2px; }
.venue { font-size: .92rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tldr { font-size: .9rem; color: var(--muted); margin: 6px 0 2px; padding-left: 10px; border-left: 2px solid var(--rule); max-width: 70ch; }
.tldr b { font-weight: 400; opacity: .8; margin-right: .35em; }
.links { font-size: .92rem; margin-top: 4px; display: flex; gap: .9em; flex-wrap: wrap; align-items: baseline; }
.award { color: var(--accent); font-weight: 600; }
.grp h4 { font-size: 1.05rem; margin: 28px 0 6px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--rule); padding-bottom: 4px; display: flex; gap: 10px; align-items: center; }
.grp h4 .lnk { font-size: .92rem; font-weight: 400; margin-left: auto; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 2px 14px; font-size: .92rem; margin: 6px 0 2px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
ul.rows { list-style: none; padding: 0; margin: 0; }
ul.rows li { display: flex; gap: 16px; margin: .55em 0; }
.date { flex: 0 0 96px; color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }
.inl { display: inline-flex; align-items: center; gap: 6px; margin-right: .9em; white-space: nowrap; }
.plist { display: flex; flex-direction: column; margin-top: 6px; max-height: 340px; overflow-y: auto; }
.plist button { display: grid; grid-template-columns: 48px 1fr; gap: 10px; text-align: left; background: none; border: 0; padding: 5px 0; font: inherit; color: var(--fg); cursor: pointer; font-size: .95rem; }
.plist button:hover .nm { color: var(--link); text-decoration: underline; }
.plist .y { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.plist .nm b { font-weight: 600; } .plist .nm span { color: var(--muted); }
.progress { color: var(--muted); font-size: .9rem; }
footer.pg { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); }

/* reader */
.rgrid { display: grid; grid-template-columns: 220px 1fr; column-gap: 40px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 2px; font-size: .93rem; max-height: 70vh; overflow-y: auto; }
.rail h4 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 0 0 6px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.rail button { display: grid; grid-template-columns: 16px 1fr; gap: 6px; background: none; border: 0; padding: 4px 0; text-align: left; font: inherit; color: var(--link); cursor: pointer; line-height: 1.4; }
.rail button:hover .nm { text-decoration: underline; }
.rail button[aria-current="true"] .nm { color: var(--fg); font-weight: 600; }
.rail .chk { color: var(--muted); font-size: .8rem; }
.rail .y { display: block; color: var(--muted); font-size: .82rem; font-weight: 400; }
.rtop { margin-bottom: 18px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.rtitle { font-size: 1.6rem; line-height: 1.25; letter-spacing: -.01em; font-weight: 700; margin: 4px 0 4px; text-wrap: balance; }
.pagebody { display: flex; flex-direction: column; gap: 18px; min-height: 300px; margin-top: 22px; animation: pgin .2s ease; }
@keyframes pgin { from { opacity: 0; transform: translateX(var(--dx, 10px)); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pagebody { animation: none; } }
.pagebody h4 { font-size: 1.05rem; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin-bottom: 8px; }
.pagebody .big { font-size: 1.15rem; line-height: 1.55; max-width: 60ch; text-wrap: pretty; }
.pagebody .txt { color: var(--muted); max-width: 66ch; }
.pagebody .qrow { display: grid; grid-template-columns: 110px 1fr; gap: 4px 18px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.pagebody .qrow b { font-weight: 700; }
.pagebody .qrow:last-child { border-bottom: 0; }
.pagebody .ref { display: block; text-align: left; }
.pagebody .ref small { color: var(--muted); font-size: .82rem; display: block; }
.pagebody .ref em { font-style: normal; color: var(--muted); font-size: .9rem; }
.pathbox { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; font-size: .92rem; }
.pathbox code { font: .85rem ui-monospace, Menlo, Consolas, monospace; background: var(--ph); padding: 2px 7px; border-radius: 3px; overflow-wrap: anywhere; }
.pgnav { border-top: 1px solid var(--rule); margin-top: 26px; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.steps { display: flex; gap: 4px 8px; flex-wrap: wrap; font-size: .93rem; align-items: baseline; }
.steps .sep { color: var(--muted); }
.steps .tab { font-weight: 400; }
.steps .tab[aria-selected="true"] { font-weight: 600; }
.pgbtns { display: flex; justify-content: space-between; gap: 16px; font-size: .95rem; }
@media (max-width: 900px) and (min-width: 721px) { .rgrid, .top { column-gap: 28px; } }
@media (max-width: 720px) {
  .wrap { padding: 60px 20px 32px; }
  body { font-size: 15.5px; }
  .top { grid-template-columns: 1fr; grid-template-areas: "name" "side" "intro"; grid-template-rows: auto; row-gap: 12px; }
  .name { font-size: 1.9rem; margin: 0; }
  .contact { display: flex; flex-wrap: wrap; gap: 0 18px; margin: 0; }
  .contact span { flex: none; }
  .rgrid { grid-template-columns: 1fr; row-gap: 20px; }
  .rail { max-height: 180px; }
  .date { flex-basis: 84px; }
  .pagebody .qrow, .kv { grid-template-columns: 1fr; }
}

/* slide cards */
body.wide .wrap { max-width: 1200px; }
#reader.wide .rgrid { grid-template-columns: 1fr; row-gap: 10px; }
#reader.wide .rail { flex-direction: row; max-height: none; overflow-x: auto; overflow-y: hidden; gap: 4px 20px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); font-size: .88rem; }
#reader.wide .rail h4 { display: none; }
#reader.wide .rail button { white-space: nowrap; flex: none; }
#reader.wide .rail .y { display: none; }
.cardbox { display: flex; flex-direction: column; gap: 12px; }
.card { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; border: 1px solid var(--rule); background: #FAF8F3; box-shadow: 0 1px 2px rgba(0,0,0,.06), 7px 7px 0 -2px var(--ph), 7px 7px 0 -1px var(--rule); cursor: zoom-in; user-select: none; }
.card .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; line-height: 1.4; text-align: left; }
.stage > section { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
.stage *, .wrap .stage * { min-width: auto; }
.stage h1, .stage h2, .stage h3, .stage p, .stage ul, .stage ol { margin: 0; }
.stage ul, .stage ol { padding-left: 34px; }
.stage li { margin: 0; }
.stage table { border-collapse: collapse; }
.stage h1 { line-height: 1.1; } .stage h2 { line-height: 1.15; } .stage h3 { line-height: 1.2; }
.card .zoom { position: absolute; right: 10px; bottom: 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); border-radius: 4px; font: inherit; font-size: .8rem; padding: 2px 9px; cursor: pointer; opacity: .85; }
.card .zoom:hover { opacity: 1; }
.card .nv, #lb .lbcard .nv { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 44px; line-height: 1; color: #fff; background: rgba(20,22,26,.45); border-radius: 6px; opacity: 0; transition: opacity .15s; pointer-events: none; }
.nv.l { left: 10px; } .nv.r { right: 10px; }
.card[data-zone="l"] .nv.l, .card[data-zone="r"] .nv.r, #lbCard[data-zone="l"] .nv.l, #lbCard[data-zone="r"] .nv.r { opacity: 1; }
.card .zoom { z-index: 2; }
#panel .card.prev { margin: 12px 0 14px; max-width: 760px; }
.cardmeta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
details.notes { font-size: .92rem; color: var(--muted); max-width: 90ch; }
details.notes summary { cursor: pointer; color: var(--link); }
details.notes p { margin-top: 8px; color: var(--fg); text-wrap: pretty; }
#lb { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
#lb[hidden] { display: none; }
#lb .lbcard { position: relative; border-radius: 8px; overflow: hidden; background: #FAF8F3; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
#lb .lbcard .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; line-height: 1.4; }
#lb .bar { display: flex; gap: 18px; align-items: center; color: #d5d9df; font-size: .92rem; }
#lb .bar button { background: none; border: 1px solid #5a606a; color: #e6e8eb; border-radius: 4px; padding: 3px 12px; font: inherit; cursor: pointer; }
#lb .bar button[disabled] { opacity: .35; cursor: default; }
@media (max-width: 720px) { .card .zoom { font-size: .75rem; } }

/* minimal home page */
.wrap { padding: 44px 24px 56px; }
.top { display: block; }
.name { font-size: 1.9rem; margin: 0 0 .2em; }
.intro { color: var(--muted); margin: 0; font-size: .95rem; }
.search { position: relative; margin-top: 20px; max-width: 420px; display: block; }
.search input { width: 100%; flex: none; max-width: none; padding: 9px 14px 9px 38px; border-radius: 999px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 28px 0 6px; }
.lgb { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px; border: 1px solid var(--fg); border-radius: 999px; background: var(--bg); color: var(--fg); font: inherit; font-size: .88rem; line-height: 1.2; cursor: pointer; transition: color .15s, border-color .15s; }
.lgb svg { width: 34px; height: 10px; transition: opacity .15s; }
.lgb[aria-checked="false"] { border-color: var(--rule); color: var(--muted); }
.lgb[aria-checked="false"] svg { opacity: .35; }
.lgb[aria-checked="false"] span { text-decoration: line-through; }
.lanehl { fill-opacity: .1; pointer-events: none; }
.lbl.cn { fill: var(--muted); font-size: 10.5px; }
#panel { margin-top: 10px; }
.pp { display: grid; grid-template-columns: minmax(0, 600px) minmax(0, 1fr); gap: 8px 32px; align-items: start; padding: 18px 0 6px; position: relative; }
.pp.nocard { grid-template-columns: minmax(0, 1fr); }
#panel .card.prev { margin: 0; max-width: none; }
.pager { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.pager button { width: 26px; height: 14px; border: 0; padding: 5px 0; background: var(--rule); background-clip: content-box; cursor: pointer; border-radius: 4px; transition: background .15s; }
.pager button[aria-current="true"] { background: var(--fg); background-clip: content-box; }
.ppr { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding-right: 30px; }
.ppr .ptitle { font-size: 1.08rem; margin: 0; }
.ptl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .88rem; }
.xb { position: absolute; top: 14px; right: 0; width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
.xb:hover { color: var(--fg); background: var(--ph); }
.rbtn { white-space: nowrap; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 6px 20px; font: inherit; font-size: .92rem; cursor: pointer; margin-top: 4px; }
.rbtn:hover { opacity: .85; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rel .ra { width: 20px; color: var(--muted); font-size: 1.05rem; text-align: center; }
.rc, .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--muted); border-radius: 999px; padding: 1px 10px; background: none; color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer; }
.rc.bl { border-style: dashed; }
.rc.guest { background: none; border-style: dashed; border-color: var(--fg); }
